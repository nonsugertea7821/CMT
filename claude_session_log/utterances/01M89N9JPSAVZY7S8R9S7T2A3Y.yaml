      text: |
        その切り分けは、今の結果ではできていません。区画が字面に結びついているという反証（h_genus_region_immune_display）は、自然な文章で学んだモデルでしか測っていないからです。字面への結びつきが幾何そのものの性質なのか、学習の材料から来たものなのかは、まだ区別できません。

        ご指摘を仮説として登録し、PR #868 を立てました。概念を一つ足すので自動マージには乗りません。中身を見てマージしてください。

        **足した仮説（二つで一組）**

        | 仮説 | 中身 | 結んだ決定 |
        |---|---|---|
        | h_display_free_region_by_formal_teaching | 概念式で教えたモデルでは、上位概念のまとまり（区画）が表示語の影響を受けない | 領域の道（d_road_region） |
        | h_formal_taught_keeps_consistency | 同じモデルで、4 つの使い方をまたいだ一貫性が概念式に頼る（同じ課題を正しく解けるか） | 物差しの決定（d_metric） |

        足した概念は「概念式で教えたモデル」（formal_taught_model）です。二つの仮説は両方ともこのモデルに範囲を絞りました。字面から離れても課題が解けなくなっては意味がないので、同じモデルで両方を測る形にしています。

        **測るときに決めること**
        「学習したモデル」を何で作るかは、事前登録の段で決めます。候補は三つで、上ほど切り分けが弱くなります。
        1. 概念ベクトルを足すだけ（今のやり方。重みは固定したまま）
        2. 小さい追加学習（LoRA など）
        3. 小さいモデルを、概念式から作った文章だけで一から学習する

        学習の過程と切り分けたいという今回の意図にいちばん合うのは 3 です。ただ、CPU で回る大きさに収める必要があります。そのぶん、モデルの課題の力は落ちます。
