        E40 は、事前登録の前提が崩れたので判定せず、`h_model_reads_by_name` は未検証のまま残りました。CI の結果はまだ届いていません。

        | 書き方 | 正しく選べた割合 | X に「変わる」 | Y に「変わる」 |
        |---|---|---|---|
        | extends（依存先が名前の位置にある） | 0.667 | 0.54 | 0.42 |
        | inline（名前のない中身の中にある） | 0.75 | 1.00 | 0.83 |
        | named（名前を付けた中身の中にある、参考） | 0.667 | 0.875 | 0.83 |

        - 前提は「extends で 0.75 以上正しく選べる」でしたが、0.667 でした。
        - この大きさのモデル（Qwen2.5-1.5B）は、この書き方の依存をほぼ読めていません。
          - 「変わる」と「変わらない」の差は全体に小さいです。
          - 依存しない Y にも「変わる」と答える割合が高いです。
          - 名前の位置で読むかどうかを問う手前で止まりました。
        - 向きは仮説の予想と逆でした。
          - 依存先が名前のない中身の中にある inline の方が、よく正しく選べています。
          - これは、行に A の名前の文字列があることに反応しているようにも見えます。
          - ただ、この設問では「名前の文字列に反応する読み」と「名前の位置で読む読み」を区別できません。
        - 体系に書いたもの:
          - 3 つの書き方それぞれの正答率の観察。
          - extends が前提の 0.75 に届かなかったという観察。
          - どちらも仮説には結んでいません。
        - **#718 で手で見てほしい点:** 検査器 ec（`exp/src/exp_check.py`）を変えました。
          - この結果ファイルは、行ごとの差を数ひとつで持っていて、ec が読む形になっていませんでした。
          - そこで、正答率と差の平均を、その数から計算できるようにしました。
          - 評価器の変更なので、自動マージには乗りません。
          - PR は未検証のまま Draft で置きます。

        この結果の含意として、次の 2 つを仮説にする候補があります。
        - より大きいモデルなら前提が成り立つか。
        - 名前の文字列と名前の位置を分けた設問にするとどうなるか。

        ただ、「名前の文字列」を指す概念が体系の中で決まっていないので、今回は登録していません。次の周回で、式にする書き方を決めてから登録します。

