      text: |
        前の説明が曖昧でした。幾何の仮説と結んだ理由から考え直します。以下は記録を読んだうえでの私の解釈で、確かめてはいません。

        **記録にある、識別子化をする理由（ca3c411、あなたの示唆）**
        - 概念ベクトルを含む、パラメータを絞った微調整をするには、概念体系とモデル内部の幾何がどう対応するかを特定する必要がある。
        - そのために、式の識別子化が必須になる。
        - 支持済みの「区画（モデル内で概念が占める範囲）は上位概念で決まる」（h_midpoint_depends_genus）と合わせると、識別子と区画がどちらも上位（extends）に立つ。これが体系とモデル内部の対応の鍵になる。

        **ここから読める「識別子＝式」の意味**
        - 識別子は、ただの名前（区別の札）としては求められていませんでした。求められていたのは、式の組み立て（上位・始点終点・修飾・成り立つ状態など）をそのまま持った鍵です。式の部品が、モデル内部の部品（区画・方向）と一つずつ突き合わせられるようにするためです。
        - 名前は組み立てを持たないので、幾何と突き合わせられません。だから式から識別子を作る必要がありました。

        **その目的に照らすと、識別子の実験（#331・#952・#954）は何を外していたか**
        - どの実験も、体系の中だけで「名前の分け方と中身の分け方が一致するか」を数えていました。モデルを一度も見ていません。
        - 幾何との対応に必要なのは、名前を区別できることではありません。式の部品ごとに、モデル内部に対応する部品があることです。
        - なので「全部の鍵の分け方と一致するか」という判定は、この目的には効いていませんでした。
          - 承認と入金が中身で区別できなくても、モデルの中では表示語で別の場所に置かれているはずです。
          - 実際、「区画は表示語に左右されない」（h_genus_region_immune_display）は反証で、表示語は区画を動かしていました。

        **目的に沿う形でこれまでの結果を並べ直すと**

        | 式の部品 | モデル内部との対応 |
        |---|---|
        | 上位（extends） | 区画を決める（支持） |
        | 始点・終点（from・to） | 共通の方向を持つ、は反証（h_refer_ops_share_direction） |
        | 成り立つ状態（holds） | 未検証（h_functor_preserves_shape） |
        | 修飾（mod） | 未検証（h_refer_cut_spans_mods） |
        | 注意の中の役割 | 未検証（h_roles_in_attention） |
        | 役割の指し方（form）・前後の状態（pre・post）・否定（neg） | 幾何の仮説がまだない |

        最後の行の三つは、#954 で体系の中では区別に効いていると分かった部品です。#954 の結果をこの目的に活かすなら、「識別子の部品の一覧のうち、幾何の側でまだ問われていないもの」として読むのが筋だと思います。

        この線で実験を立てる場合は、仮説として登録してから進めます。
