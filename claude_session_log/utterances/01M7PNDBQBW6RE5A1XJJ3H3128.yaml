      text: |
        その通りだと思います。今回の「運ばれない」もそうですが、解釈を私の言葉の散文で書くと、体系の意味から気づかないままずれていきます。解釈を CSCL の式で書き、意味を変えない変換で自然言語に出せば、ずれは変換の側にしか起きません。変換を確かめれば済む形になります。

        **いまあるもの**
        `cscl/bootstrap/display/display.py` に、変換のごく初めの形があります。issue の題「依存する(何でもを端に持つ限定, 上位の順序)」も、これで作っています。
        - 種類は `表示名 ＝ 上位 ∧ 動詞(これ, 相手)` の形で出します。否定は `¬`、範囲は `（個数≥1）` と書きます。
        - 事実は `動詞(始点, 終点)` の形で出します。
        - 出力は関数の形のままで、文にはなっていません。助詞も活用もなく、入れ子の式を読み下すこともできません。

        **作ろうとすると突き当たること**
        1. **解釈の多くは、法則が導く関係について述べている。** 「運ばれない」を式にすると `¬ r_entail(t, t_any)` です。ところが r_entail のような法則の関係はノードではないので、claims の中から名前を参照できません（h_any_by_entail を登録するときにも、ここで弾かれました）。解釈を体系で書くには、まず法則の関係を体系の中で参照できるようにする必要があります。
        2. **意味論のまま修飾する、の基準をどこに置くか。** たとえば「表示の文を体系に読み戻すと、元の式と同じ事実になる」ことを基準にすれば、変換が意味を保つかを tc で確かめられます。
        3. **測った値の言い方。** 表や数は、観察（v_level）としてすでに式になっています。足りないのは、それらをつなぐ「だから」「ただし」の部分です。

        決めていただきたいのは次の二つです。

        1. **仮説として登録するか。** 仮説として登録すれば、登録だけの PR は自動でマージされます。登録するなら次の形を考えています。
           - 変換の前提を一つ: 法則の関係を参照できれば、今回の解釈が式で書ける。
           - 変換の基準を一つ: 表示の文を読み戻すと、元の式と同じ事実になる。
        2. **PR #158 の法則 any_above_end の扱い。** この方向に進むなら、法則は外してからマージするのがよいと考えています。
