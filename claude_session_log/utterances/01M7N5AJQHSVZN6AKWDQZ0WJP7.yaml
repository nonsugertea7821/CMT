        観察の1回目は、混同の判定がうまく取れませんでした。記録・コミットはしていません。

        **やったこと（探索）**
        1. 動詞の位置（v, p）ごとに、そこへ置かれている概念を集めました。限定 `{of: [v, p]}`、名前を付けた限定、form と、その下位すべてです。
        2. 同じ位置にある2つ c, b の組で、c の定義が「R(c, w)」を持ち、b と w が is_a でつながるものを探しました。前回の抽象化「R(c, b) で、c と b が同じ位置にある」を、種類の水準で書いたものです。

        **結果**
        - 当たった組は **23,859** で、ほとんどが雑音でした。
          - R の多くは is（上位）と v_compose（〜からなる）です。
          - w の多くは word・sentence のような広い種類で、何でもつながってしまいます。
        - 目当ての「設計書と、作るもの」は、この方法では出てきません。model_design は model について述べていますが、model は設計の終点に置かれていません。終点に置かれている programming_language について述べる設計書もありません。

        **分かったこと**
        前回の判定のかなめは「作るものは、設計しただけでは在らない」、つまり F（post の exists(to)）が b について成り立たないことでした。私はこれを**意味を読んで**決めていて、体系の事実から決めていませんでした。種類の水準では「この種類のものが、この歩みの後に在るか」は書かれていないので、判定できません。

        F が成り立つかを事実から決められるのは、**個体の水準**、つまり実行の記録です。各フレームで pre・post を評価できます。例えば：
        - ある歩み v(…, p = b) で、F の位置 p についての文が b について成り立たない（実行器のエラーや halted になる）。
        - 同じフレームに、F を満たす c があり、R(c, b) が述べられている。

        この両方がそろったものを混同の候補として数えます。ただし今ある実行の記録は少なく（歩み 6 程度）、設計や計算の歩みは入っていません。

        **進め方の案**
        - A：実行の記録に、設計・計算の歩みを使う記録を足して、個体の水準で観察する。記録を作るのは私たちなので、作り方を先に登録してから足す。
        - B：種類の水準の探索を絞る（R を refer・depend に限り、w を広い種類にしない）。ただし、F が成り立つかの判定は入らないので、混同そのものではなく、その手がかりの観察になる。

        私は A を勧めます。混同の定義は「F が成り立たない」を中心に置いているので、それが評価できる場所で観察するのが筋だと考えます。どちらにするか指示してください。
