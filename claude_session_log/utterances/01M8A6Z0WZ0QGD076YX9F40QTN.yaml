        この回では、軽い列の仮説を 1 つ反証で記録し、その含意を新しい仮説として登録しました。重い列の E66 は走ったままです。

        **h_domain_sep_by_extends（#894、反証）**
        - 問いは、#891 で「どの層（領域）の語か」の条件だけが分けていた 7 対の動詞を、親子関係（extends）の書き方で分けられるかでした。
        - 体系の一時の写しの上で、下流の動詞を上流の動詞の特化に書き換えました。7 回とも型の検査（tc）が落ちました。書き換えない写しでは検査が通ることを先に確かめています。
        - 落ちた理由は 2 つです。
          - 7 回すべて: 下流の動詞の端は「何でもよい」で、上流の動詞の端より広いため、端の向きでは上流の動詞のほうが特化になります。この書き方は端が等しい対でしか通らず、7 対はどれも等しくありません。
          - うち 4 回は、加えて層の規則（下流は自分が使わない層を参照できない）にも反しました。
        - 逆向き（上流を下流の特化にする書き方）は、上流が下流を参照することになるので層の規則が止めます。こちらは今回試していません。
        - 解釈として、この 7 対では、端の向きが決める親子と、層が許す参照の向きが逆になっています。
        - 予想との違い: 反証は予想どおりでしたが、理由は予想した「exp.v_rely の 5 対が鎖になっていない」ではなく、端の広さの向きでした。対が 1 つしかない動詞でも解けません。
        - この反証が言えるのは「下流を上流の特化にする書き方では置き換えられない」までです。領域の条件がどんな書き方でも要る、とまでは言っていません。
        - 結果は体系に書きました。CI が通れば Draft を外します。

        **新しい仮説 h_domain_sep_by_lifting（#895、登録だけ）**
        - 端が「何でもよい」の一般の動詞を、両方の動詞が使える上流の層へ移せば、上流の動詞をその特化として書け、領域の条件なしで分かれるか、という仮説です。未検証です。

        **E66**
        - 24 概念のうち 12 まで学習が済みました。9 分ごとの確かめを置いています。

        ロードマップでは、表示を式から導く決定（d_cscl_display_derived）の下で、区別に領域が要るかを確かめる段を一つ進めました。
