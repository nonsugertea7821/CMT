        仮説2（#354）は、事前に決めた前提を満たさなかったので、**未検証のまま**です。PR #357 は Draft のままにしました。

        ## 何が起きたか
        「ものさしがまっすぐなら、切っても凸を保つ」を確かめる実験でした。前提は、隠れ状態から量を線形に読める（R² ≥ 0.5）量が 3 つ以上あることでした。実際に読めたのは「数」の 1 つだけでした。

        ## 判定の外で見えたこと
        | 量 | まっすぐな切り方（上半分） | 曲げた切り方（両端） |
        |---|---|---|
        | 体重 | 0.69 | 0.16 |
        | 長さ | 0.80 | 0.44 |
        | 値段 | 0.61 | 0.32 |
        | 時間 | 0.87 | 0.67 |
        | 緯度 | 0.62 | 0.47 |
        | 数 | 0.96 | 0.96 |

        - 「数」を除く 5 つの量すべてで、まっすぐに切ったほうが一かたまりを保ちました。家と値段の例で言えば、「5000万円以上」でひとまとまりに切るほうが、「ごく安い家とごく高い家」をまとめて切るより、かたまりになる、ということです。
        - 唯一読めると判定された「数」は、どう切っても 0.96 でした。数詞どうしは、隠れ状態の中でもともとひとかたまりだからだと読めます。

        ## 原因の見立て
        - 外れたのは仮説ではなく、「読める」と判定する物差しのほうだと見ています。
        - 語が 12〜20 語しかないのに、隠れ状態は 1536 次元あります。この条件では、一つ抜きの回帰は読めるものも低く出しやすいです。

        ## 次
