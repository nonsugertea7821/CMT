      text: |
        「型検査が法則の役割を名前でなく枠（前・後・両側）から読んでも、結果は変わらない」という仮説（h_rule_verbs_unhardcode）は反証でした。#339 に記録して Draft を外したので、確認をお願いします。

        **結果**
        - 写しの体系で、3 つの動詞に枠を足し、型検査が役割を読む 2 か所を名前から枠に置き換えました。
        - 型検査と ec はどちらもエラー 0 で、型検査が集める法則 164 個も元と同じでした。
        - ただし、法則を評価して導かれる関係が 302,004 から 301,649 に、355 減りました。
        - 対照として、枠を足さずに読み方だけ置き換えた版も走らせました。エラーが 160 件出ており、置き換えた読み方が実際に使われていることは確かめられました。

        **含意**
        - 法則の集まりが元と同じなので、読み方の置き換えそのものは法則の取り出しを変えていません。
        - 関係が減った原因は、足した枠の中身の見込みが高いです。前回（#335）は違いを位置だけにするため、3 つの動詞に同じ文を置き、意味は問いませんでした。その文が、動詞の状態の事実として評価に入り込んだと考えられます。
        - 前回は導かれる関係を測っていなかったので、この交絡を見逃していました。
        - この反証は「名前でなく枠から読むことはできない」とは言っていません。「意味を問わずに置いた枠の中身が、評価を変える」と言っています。

        **新しい仮説（#340、登録だけ）**
        2 つの変更を分けて確かめるため、対で登録しました。
        - h_frame_enters_relations：関係が変わったのは、足した枠そのもののせい。枠だけを足した版でも、関係は今回と同じ値になるはずです。
        - h_rule_frame_redundant：枠の中身を、すでに導かれている文にすれば、役割を枠から読んでも関係は元のままになる。

        次の周回は 11:44Z です。
