      text: |
        その像で整理し直すと、こうなります。

        ## 二段階の像
        1. **refer: 空間を切り出す**
           - 高次元の全体から、使う軸を三本選んで、三次元の空間を取り出します。
           - 家なら、家が持ちうるすべての性質の中から「広さ・築年数・駅からの距離」の三軸を取り出す、という操作です。
           - 取り出した空間は平らで、途中に穴も島もありません。だから凸です。前回の直観「refer で述べる領域は凸」とも合います。
        2. **量・質的な限定: その中に立体を作る**
           - 取り出した三次元の中で、仲間だけを囲む立体を作ります。

        ## 限定で凸が崩れる仕組み（この像の上で）
        - **質的な限定**は、立体の表面をどの「ものさし」で引くかを選ぶ操作です。
          - 「値段」を選ぶと、三次元の各点に値段が一つずつ付きます。同じ値段の点をつなぐと、空間の中に一枚の面ができます（等高線の三次元版です）。
        - **量的な限定**は、どの値段の面で切るかを選ぶ操作です。「5000万円の面より上」と切ると、立体が一つ決まります。
        - 立体が凸になるかどうかは、**この面が平らか曲がっているか**で決まります。
          - 値段が三軸からまっすぐ決まるなら（広さが倍なら値段も一定ずつ上がる、のような関係なら）、面は平らです。切った立体は凸になります。
          - 値段が「駅に近いと急に跳ねる」ように決まるなら、面は曲がって波打ちます。切った立体は、えぐれたり島に分かれたりします。

        つまり、凸を保証しているのは refer です。限定はその保証を引き継ぎません。限定のものさしが曲がっている分だけ、凸が崩れます。

        ## 一点だけ、区別しておくと後で効きそうなこと
        「切り出す」には二通りあります。
        - **影を取る**: ほかの軸は気にしない（どんな値でもよい）とする。ほかの軸の方向には無限に伸びた柱になります。
        - **断面を取る**: ほかの軸を一つの値に固定する（たとえば「東京で」と決める）。

        どちらで切り出しても、切り出した空間そのものは凸です。違いが出るのは、その後で限定したときです。影のほうは、ほかの軸の違いが混ざったまま切るので、値段のようなものさしが曲がりやすくなります（東京と田舎が重なって見えるため）。断面のほうは、曲がりが出にくくなります。

        体系の言葉に当てると、断面は「at で値を固定する」に近く見えます。ただ、ここはまだ私の読みで、確かめてはいません。
