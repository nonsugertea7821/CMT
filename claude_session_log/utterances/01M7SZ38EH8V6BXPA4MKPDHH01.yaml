      text: |
        `with` と `neg` の定義を、文法・語の定義・型検査器の評価の三つで確かめました。

        ## 修飾（mod）の形
        `syntax.yaml:7` で、修飾の指定は `[of, with, neg, quant, at]` の組です。
        - `of`: どの動詞の、どの位置か（`syntax.yaml:132`、位置の指定）
        - `with`: 相手の端の指定
        - `neg`: 示されていないことの指定
        - `quant`・`at`: 量の指定

        例として `law_rule: {mod: {of: [v_assume, from], with: premise}}`（`syntax.yaml:117`）を読むと、「v_assume の from の位置にいて、相手の端（to）に premise がいるもの」です。

        ## with
        `syntax.yaml:92`
        ```
        with: {display: もう一方の端の指定, extends: expression_part, mod: {of: [v_refer, from], with: participant}}
        ```
        - 動詞の関係の、反対側の端に来るものの**種類**を指します。参照先は participant（関わるもの、`ontology.yaml:60`）です。
        - `{of: [V, p], with: K}` が表す範囲は、「種類 K のものが一つでもあって、それと V の関係にある x」の集まりです。論理では存在量化で、幾何では「K を関係 V で引き戻した像」、つまり射影にあたります。
        - K が範囲（種類）で、V が線形に近い関係なら、K が凸のとき結果も凸です。凸どうしの射影や引き戻しは凸を保つからです。
        - 凸が崩れるのは、K が個別の個体（有限個の点）を指すときです。

        ## neg
        `syntax.yaml:93`
        ```
        neg: {display: 示されていないことの指定, extends: expression_part, mod: refer_from_facts}
        ```
        `refer_from_facts`（`syntax.yaml:54`）は「事実へ述べる」です。つまり neg は、世界についての否定ではなく、事実（述べられた文）についての指定です。

        型検査器での扱い:
        - `type_checker.py:197` の `truth_of` にこうあります。「neg（述べられていない）とは別」。偽と述べる（`val: {truth: false}`）こととは区別されています。
        - `type_checker.py:606-609` の評価では、`neg` の前提は「一致する事実が一つも見つからなければ成り立つ」です。失敗による否定（negation as failure）、つまり閉じた世界の否定です。
        - `type_checker.py:388` で、種類どうしの事実には neg を書けません。「否定は『示されていない』で、示す文である事実には書けない。否定は法則の制約で書く」。

        幾何で言うと:
        - neg の範囲は、空間での補集合ではありません。述べられた事実が覆うところの補集合です。
        - 事実が増えると縮みます（非単調）。つまり、固定した範囲ではありません。どの事実が述べられているかで変わります。ドメインで事実を足したり上書きしたりすると、neg の範囲は動きます。

        ## 量（quant・at の count）
        `syntax.yaml:99` と `type_checker.py:602-604` です。一致する事実の**個数**を数え、閾値（`gt: 1` など）と比べます。値は整数なので離散で、連続の空間では凸ではありません。

        ## あなたの直観に戻すと
        - 質的な限定のうち **with** は存在量化による射影で、それだけなら凸を保ちえます。崩れるのは、相手が個体のときです。
        - **neg** は凸でなくなるだけでなく、そもそも空間の範囲ではありません。事実の集まりに相対的な範囲です。
        - **量的な限定**は、離散であることで凸を崩します。
        - ですから「限定で凸でなくなる」は、neg と量の限定には当たります。with には、相手が個体である場合にだけ当たります。

        あなたの言う「質的な限定」が with と neg のどちらに近いかで、読みが分かれます。
