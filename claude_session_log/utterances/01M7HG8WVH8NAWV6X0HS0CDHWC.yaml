        検査を約10倍速くし（約14秒 → 約1.4秒）、名前を「合成する」と「合成可能集合」に改めました。ただし合成可能集合は、まだ木の中の位置で決まっています。概念式で定義できたのは片側だけです（下に書きます）。検査（check_spec と run_spec）は通り、コミットして push 済みです（d61b08b）。

        ## 高速化

        - **規則の評価:** 各回で、前の回に新しく増えた文だけを使って当てるようにしました（semi-naive 評価）。規則の文を解釈し直すのも、最初の一度だけにしました。
        - **YAML:** C 実装の読み込みに替え、同じファイルは一度だけ読むようにしました。
        - **結果が変わっていないことの確認:** 今の spec では、出力が変更前と完全に一致しました。逆向きの誤りをわざと入れた場合も、変更前と同じ違反の組が出ます（並び順だけ違います）。
        - **ついでに見つけた既存の不具合:** 相手を書かない限定 `{of: [v_sum, from]}` があると、検査が落ちていました。直してあります。

        当面は Python のままで十分だと思います。

        ## 名前

        | | 前 | 今 |
        |---|---|---|
        | `v_sum` | 合わせる | 合成する |
        | `summand` | 合わせられる情報 | 合成できる情報 |
        | 空間（新設 `composable_set`） | （空間） | 合成可能集合 |

        法則の表示名も「合成」にそろえました。

        型の誤りをわざと入れて確かめ、3つとも捕まりました。

        - 別の合成可能集合のベクトルと合成する
        - 合成が定義されていない種類を集合に置く
        - 層と合成する

        ## 正直に言うと、定義は半分しかできていません

        `composable_set` には概念式で「合成してできるもの」（`{of: [v_sum, new]}`）と書きました。しかし「この集合に属する」の判定は、今も「合成可能集合のすぐ下の種類」という、木の中の位置で決めています。

        **理由:** 「合成について閉じている」は、成員一つ一つの性質ではなく、集まり全体の性質です。この体系では、種類の下位はその性質を受け継ぎます。そのため、例えば残差の流れのベクトルを合成可能集合の下位にすると、その下の隠れ状態（hidden_state）も「閉じた集合」だということになってしまいます。実際には h ⊕ v は h′ で、隠れ状態には戻らないので、これは偽です。

        **ちゃんと定義するには:** 種類そのものを、別の種類の成員として扱う必要があります。つまり「残差の流れのベクトル」という種類が、合成可能集合の一つの個体である、と書けることです。今の文法では、種類は個体になれません。

        最初にもらった「空間は関係や軸と混同していないか」という疑問の答えも、ここにあると思います。関係とも軸とも別物です。種類について述べる一段上の概念（メタクラス）で、この体系にはまだその階層がありません。

        これを入れるかどうかは、文法の大きな拡張になるので、決めてもらえれば対応します。
