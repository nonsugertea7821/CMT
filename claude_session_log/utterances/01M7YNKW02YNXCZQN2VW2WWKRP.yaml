        具体的な問い1つで、ベクトルが何をしているかを追ってみます。

        **1. モデルの中では、トークンごとに数の並びが流れている**

        評価の問いは、モデルには45個のトークンとして入ります。

        ```
        次の / 文 / の / 空 / 欄 / に入る / … / 部署 / の中 / だけで / 回 / して / 読 / む / 票 / は / 、 / ＿ / ＿ / である / 。\n
        1 / . / ␣ / 丙 / 票 / \n / 2 / . / ␣ / 丁 / 票
        ```

        - モデル（Qwen2.5-1.5B）は28層あります。各層を通るたびに、トークン1個ごとに 1536 個の実数の並び（隠れ状態）が書き換わります。
        - その並びに、「このトークンは何で、前の文脈から見て何を指しているか」が数として入っています。
        - 最後のトークンの状態から、次に出す語（「1」か「2」）の点数を読みます。

        **2. 学習するベクトルは、その並びに足す「ずらし」**
        - 丙票用に 1536 個の実数を1本、丁票用に1本持ちます。1組で動かす数は 3072 個だけです。
        - 第8層を出たところで、「丙」と「票」の2トークンの位置（選択肢 1 の所）の並びに v_丙 を足します。「丁」「票」の位置（選択肢 2 の所）には v_丁 を足します。
        - 本文の「…読む票は」の「票」は「丙票」の一部ではないので、何も足しません。
        - 足した後の並びが、第9層から第28層を通って、最後の「1 か 2 か」に響きます。

        **3. 学習前と学習後で、何が変わってほしいか**
        - 学習前の「丙票」の位置にあるのは、「丙」という字と「票」という字の並びとしての状態だけです。丙票の定義は、モデルはどこからも知りません。
        - 学習で望んでいるのは、v_丙 を足した状態が「社内だけで回覧する票」を読んだときの状態に近づき、v_丁 を足した状態が「社外の取引先にも送る票」の状態に近づくことです。
        - そうなれば、後の層が本文の「部署の中だけで回して読む」と選択肢 1 の状態を照らし合わせ、「1」を選べるはずです。

        **4. 実際に起きているらしいこと**
        - 損失を下げる手は、意味を入れるほかにもあります。
          - v_丙 と v_丁 に「この選択肢を選びやすくする」「選びにくくする」という向きを入れれば、本文を読まなくても答えは動きます。
          - 2本の差を小さくして、どちらにも決めないようにしても、順を入れ替えた2通りで損失はそこそこ下がります。
        - 組 5 の round で余裕が ±0.07 に縮んだのは、後のほうに見えます。

        **5. まだ見ていないもの**
        - 学習したベクトルそのもの（3072 個の数）は、結果のファイルに保存していません。残っているのは、答えの余裕だけです。
        - そのため、v_丙 が「社内だけで回覧する票」の向きを向いているのかどうかは、今の記録からは分かりません。

        どこから具体的に詰めますか。次の三つが入口になりそうです。
        - ベクトルが向くべき先、つまり「社内だけで回覧する票」と読んだときの状態とは何か。
        - 足す場所を、選択肢の位置と第8層にしたことが妥当か。
        - 「意味を入れた」と言えるのは、ベクトルがどうなったときか。

        本線 a 往復の教示（h_round_trip_raises_sibling、PR #640）
