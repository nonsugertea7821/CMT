      text: |
        数学（モデル理論）と合わせてみると、「関係・真偽・質・量」の4つにかなりきれいに収まります。「真は exists」も、数学の側から裏づけられます。体系を数えて照らし合わせた結果です（体系は変えていません）。

        **真 = exists について**
        モデル理論では、原子文 R(a, b) が真であるとは、組 (a, b) が関係 R の中に在ることです。真は「事実が在る」ことと言い換えられます。体系もこの形を受け入れる準備があります。
        - syntax の文法の注に「事実は動詞の個体」とあります。事実が個体なら、exists(事実) は文として成り立ちます。
        - そうすると、3つの読み方は次のように言い直せます。
          - 真と述べる: 事実が在ると述べる。
          - 偽と述べる: 事実が在らないと述べる。
          - 述べられていない: refer がない。
        - 真偽の軸は「refer の値」として公理に置かれています。真 = exists なら、この軸は独立の原始語ではなく、「述べた事実が在るか」から導けるかもしれません。
        - ただ、偽を述べるには「在らない」を述べる手段が1つ要ります。真偽の軸か、exists の古典否定のどちらかは、原始語として残ります。

        **4つの象限と、その在り方**
        体系の数（ノード、軸、限定の使用数）を当てはめると、次のようになります。

        | 象限 | 数学 | 体系での在り方 | 体系にあるもの |
        |---|---|---|---|
        | 関係 | n 項関係（組の集まり） | 組が在ること | 動詞 116、基礎の関係 depend・part・after・involve・same |
        | 真偽 | 充足（組が関係に属するか） | 事実の exists。refer は述べること、not は述べないこと | exists、refer、not、世界 |
        | 質 | 1項の述語（特性関数 → {真, 偽}） | 1項の事実が在ること（x が q を持つ ⇔ q(x) が在る） | quality の下位 105、val、neg の限定 |
        | 量 | 関数（数への写像）、濃度 | 在る組を数える・測る | 軸 count・amount・ratio・order、限定 at.count 30・at.amount 11 |

        体系を見ると、量の軸は関係から生まれています。
        - order（順番）のもとは after です。
        - ratio（割合）のもとは part です。
        - text（文字列）と truth（真偽）のもとは refer です。
        - count と amount のもとは any（どの関係でも）です。

        ですから、収束の向きは「関係 → 真偽（在るか）→ 質・量」と読めます。
        - 質は、1項の関係に真偽を当てたものです。
        - 量は、在る組を数えたもの（count、つまり濃度）か、関係から作った尺度（order、ratio）です。
        - 関係から導けないのは amount（測った値、実数）だけです。これは数そのものを外から与えています。

        **カントの範疇表との対応**
        「関係・真偽・質量」は、カントの4つの見出し（量・質・関係・様相）に重なります。体系の書き方もそれぞれに当たります。
        - **量:**
          - 単一性は `at: {count: 1}` です。
          - 数多性は `at: {count: {gt: 1}}` です。
          - 全体性は `quant: all` です。
        - **質:**
          - 実在性は肯定の限定です。
          - 否定性は neg です。
          - 制限性は「ある種類の中で、〜でないもの」です（肯定で置かれた種類に neg を足したもの）。
        - **関係:**
          - 内属は depend です（特定依存持続体が担い手に依存する）。
          - 因果は after と depend の組み合わせの候補です。
          - 相互性は involve か same の候補です。ここはまだ当てはめが弱いです。
        - **様相（= 真偽）:**
          - 可能性は、world だけを置いたときの「決められない」です。
          - 現実性は exists です。おっしゃる「真 = exists」がここに当たります。
          - 必然性は法則の「求める文」（require）です。

        **合わないところ**
        - same は、関係の象限に置くと同値関係ですが、量（count の一致）とも、真偽（unique_names）とも結びついています。1つの象限に収まりません。
        - text（文字列の軸）は、質にも量にも当たりません。refer から生まれる「述べ方」で、表示の側のものです。

        **次に確かめられること（候補）**
        1. **真 = exists:** 事実を個体として exists を当て、真偽の軸を exists から導けるかを、実行器で確かめます。
        2. **量 = 在る組の数:** at.count の30箇所が、「在る組の数え上げ」として法則から計算できるかを確かめます。
        3. **全ノードの象限:** 全ノードを4つの象限に分けてみて、どこにも入らないもの・2つに入るものを数えます。そうすれば、収束するという見立てを観察で確かめられます。

        どれから進めるか、あるいはこの見立て自体に直すところがあれば指示してください。
