        **User intent in this period**
        The user is digging, step by step, into what E33's training is concretely and what "meaning" in vector space is:
        - why pair 5 got 2/4 correct before training and then failed;
        - the training operation;
        - what a vector is;
        - dimensions vs. binary;
        - what one component means in system terms;
        - how to identify the projection axis, drawing on prior research;
        - inner-product definition vs. the intuition that the concept space is a "立体" (solid).

        2. Key Technical Concepts

        - **E33 mechanism**
          - Qwen2.5-1.5B-Instruct: 28 layers, hidden size 1536, frozen.
          - Injector hook adds per-position deltas to the layer-8 output.
          - Two 1536-dim float32 vectors per pair, initialized to zero, trained with Adam lr 0.1 for 24 steps.
          - The vector is added only at the token positions of the concept label, found by label_mask; 丙票 tokenizes as ['丙', '票'].
          - Recitation rows: 3 TEMPLATES × 2 concepts, target is the definition text.
          - QA rows: 4 items × 2 option orders, target is the digit "1" or "2".
          - Conditions:
            - none: no training.
            - both: all 14 rows every step.
            - round: 4 cycles; each cycle is 3 abstract steps on the definitions of the wrong items, then 3 concrete steps on the wrong QA items.
          - Evaluation: margin = logit difference, averaged over the two option orders. acc_both counts an item only if both orders are correct.
          - Learned vectors are not saved.
        - **Label-bias finding**
          - Under none, margins alternate in sign with the correct label in every pair. Example: pair 7 gives +3.4 on 松返品 items and −1.9 on 竹返品 items.
          - Under both, label bias becomes a likely position bias.
          - Under round, margins go to about 0 (indifference). That is why round's wrong count is always 4.
          - mean_margin cancels label bias; acc_both does not.
        - **Meaning of vectors in system terms**
          - concept_vector ⊂ state_shift ⊂ residual_vector; qualification_vector; common_vector_component and specific_vector_component.
          - No system node corresponds to a single coordinate.
          - Supporting prior work: pwc_elhage2022_superposition, pwc_park2024_linear_representation.
        - **Axis candidates (registered as hypotheses in #652)**
          - output embedding / logit lens (nostalgebraist 2020, tuned lens Belrose et al. 2023);
          - sparse autoencoders (Bricken et al. 2023, Templeton et al. 2024);
          - difference of means from formula parts (Marks & Tegmark 2023, Zou et al. 2023);
          - link to E33 discrimination.
          - E22 earlier supported difference vectors (h_qualification_vector_transfers_to_unseen_genus).
          - h_axis_readout_raises_midpoint was refuted earlier.
        - **Region view (latest answer)**
          - An inner-product definition already implies half-spaces.
          - Under a region view, the inner product serves as the metric for shape (e.g. an ellipsoid).
          - Formula parts become set operations: extends = inclusion, siblings = disjoint within the genus, mod = intersection, neg = complement. Same shape as Gärdenfors 2000.
          - Each component is the region's shadow (an interval) on one axis, which loses the shape. Box embeddings (Vilnis et al. 2018) are the axis-aligned exception.
          - Reading E33 this way: v_丙 is a translation into R_丙; a margin of about 0 means the point sits on the boundary; label bias is a prior offset.
          - Aligns with d_road_region (h_convex_prior_resists_redefinition, h_ambiguity_is_region_choice).

