      text: |
        PR 全般をまとめて見張ることはできません。購読は PR ごとで、リポジトリ全体を一度に購読する手段はありません。ただ、仮説の PR は私が作るので、作ったときに購読すれば、仮説の PR はすべて見張れます。漏れるのは、ほかの人が作った PR と、このセッションが終わった後に立った PR です。

        届いた内容をログに残すことは、仕組みの上ではできますが、今のままだと問題があります。

        - **GitHub 側には元から残る。** コメント、レビュー、CI の結果は、PR の上にそのまま残ります。
        - **セッションログには、たぶん間違った話し手で残る。** 届いた内容は、このセッションへの入力として入ってきます。セッションログの `build.py` は、システムの出力を決まった印で除いていますが、GitHub の通知の印は除いていないはずです（確かめていません）。そのため、PR のコメントが「利用者の発言」として記録されるおそれがあります。実際には、書いたのは PR にコメントした人です。

        どちらも、やるなら手を入れることになります。PR を作ったら購読する取り決めと、ログで GitHub の通知を別の話し手として扱う変更です。取り決めどおり、進めるならまず仮説として登録します。
