      text: |
        モデルの学習は、大きく「何を教えるか」と「どの重みを動かすか」で分かれます。言語モデルでよく使う順に並べます。

        ## 1. 事前学習（一から学ぶ）
        - **やり方**: 大量の文章で、次の語を当てる（または隠した語を当てる）ことを繰り返します。答えは文章そのものなので、人手のラベルは要りません。
        - **長所**: 言語の知識・世界の知識・推論の型を、まとめて身につけます。いま使っている Qwen などの力は、ほぼすべてここから来ています。
        - **短所**: 費用がとても大きいです（GPU を大量に、長期間使います）。何を学んだかは文章の偏りに左右され、あとから切り分けにくいです。
        - **このプロジェクトとの関係**: 区画が字面に結びつくのは、ここで自然な文章から学んだからかもしれません（#868 の問い）。

        ## 2. 継続事前学習
        - **やり方**: 学習済みのモデルに、特定分野の文章を足して、同じ形（次の語当て）で学ばせ続けます。
        - **長所**: 分野の語彙や知識を足せます。
        - **短所**: 前に覚えたことを忘れることがあります（破滅的忘却）。費用もまだ大きいです。

        ## 3. 教師ありの微調整（SFT、指示への調整）
        - **やり方**: 「問い → 望ましい答え」の組を見せて、重みを全部動かします。
        - **長所**: 決まった形式や課題に、素直に合わせられます。
        - **短所**: 重み全部を持つので、メモリと計算が重いです。少ないデータでは過学習しやすく、ほかの力が落ちることもあります。

        ## 4. パラメータを絞った微調整
        重みの大部分は固定して、小さい追加部分だけを学習します。
        - **LoRA**: 重みの行列に、小さい低ランクの差分を足して学びます。いま一番よく使われます。
        - **アダプタ**: 層の間に、小さい層を挟みます。
        - **プロンプト調整・プレフィックス調整**: 入力の前に置く「学習される埋め込み」だけを学びます。
        - **ステアリングベクトル**: 途中の層の状態に、決まったベクトルを足します。**このプロジェクトの概念ベクトル（E3・E36・E64）はこれ**で、概念の語の位置にだけ足しています。
        - **長所**: 軽く、CPU でも小さいモデルなら回ります。元のモデルが壊れにくく、外せば元に戻ります。
        - **短所**: 動かせる範囲が狭いので、元のモデルが持っていない力は足しにくいです。事前学習でできた癖（字面への結びつきなど）は、そのまま残ります。

        ## 5. 好みからの学習（RLHF・DPO など）
        - **やり方**: 「答え A と B のどちらが良いか」という比べを集めて、良い方に寄せます。RLHF は報酬モデルを作ってから強化学習し、DPO は比べのデータから直接学びます。
        - **長所**: 正解が一つに決まらない課題（丁寧さ、安全さなど）を調整できます。
        - **短所**: 比べのデータを集めるのが重いです。報酬の穴を突く振る舞い（報酬ハッキング）や、こびる傾向が出ることがあります。

        ## 6. 蒸留
        - **やり方**: 大きいモデル（先生）の出力を、小さいモデル（生徒）に真似させます。
        - **長所**: 小さく速いモデルに、大きいモデルの力をある程度移せます。
        - **短所**: 生徒は先生より上には行きにくく、先生の誤りや癖も一緒に移ります。

        ## 7. 対照学習
        - **やり方**: 「似ている組は近く、違う組は遠く」なるように、表現そのものを学びます。検索用の埋め込みモデルはこれで作られます。
        - **長所**: 表現の幾何（近さ・区画）を、直接形作れます。
        - **短所**: 文章を生成する力は、別に要ります。何を「似ている」とするかの組を、設計する必要があります。

        ## 8. 誤差逆伝播を使わない学習
        - **やり方**: 進化戦略、直接フィードバック整列（DFA）、局所的な規則など。Griffith の Akiho Propagation もここに入ります。
        - **長所**: 回路やハードウェアに載せやすいものがあります。勾配を全体に流さないぶん、軽くなることがあります。
        - **短所**: 大きな言語モデルでの実績は、まだ限られます。

        ## 学習しないで変える手（比べのために）
        - **文脈の中で教える（前置き・例示）**: 重みは変えず、入力に定義や例を置きます。E58・E63 の改名や前置きは、これです。
        - **長所**: 費用がほぼかからず、API のモデルにも使えます。
        - **短所**: 文脈の長さに縛られます。事前学習の癖に負けることがあります（E59・E60 で、例を置く手は当てはめる力を上げませんでした）。

        ## 学習の過程を切り分けるという観点で
        - いまのプロジェクトの手（前置き、ステアリングベクトル）は、どれも**事前学習の結果の上に乗る**手です。字面への結びつきが事前学習から来るのかは、これでは切り分けられません。
        - 切り分けに効くのは、事前学習そのものを変えられる手です。小さいモデルを一から学習する（1）か、継続事前学習（2）です。ただし、小さいモデルを一から学ぶと、課題を解く力そのものが足りなくなりやすいです。
        - 中間の手として、対照学習（7）で表現の幾何を直接形作る道もあります。区画を字面から離せるかを、その形作り方の側から問えます。

        ここに挙げた種類や長所・短所は、一般によく知られていることを私の知識からまとめたもので、このセッションでは文献を確かめていません。
