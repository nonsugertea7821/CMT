      text: |
        仮説を3つ登録して、PR #352 を立てました。体系に概念を4つ足しているので、手で見てもらう PR です。マージされると issue が立ち、そこから実験に入ります。

        ## 出した仮説とトリアージ
        | 順 | 仮説 | 中身 | 手間 | 順位の理由 |
        |---|---|---|---|---|
        | 1 | `h_cross_genus_lowers_midpoint` | 上位概念をまたぐ性質で集めた語（いちご・ポスト・消防車などの「赤いもの」）は、「動物」のような上位概念の語の集まりより、凸が崩れる | 小。Qwen に語を通して隠れ状態を取るだけで、学習は要らない | あなたの直観の芯（領域は凸、限定は凸でない）をそのまま問う |
        | 2 | `h_axis_readout_raises_midpoint` | ものさしがまっすぐ（隠れ状態から線形に読める）なら、それで切った集まりは凸を保つ | 中。動物の大きさや物の値段など、数値つきの語の表を作る必要がある | 1 が出たときに、凸が崩れる理由を説明する側に立つ |
        | 3 | `h_qualification_immune_genus` | 「下位 − 上位」の差分は、上位の向きと直交する（Park らの追試） | 小 | 先行研究があり、新しさは低い。1 と同じデータで、ついでに測れる |

        凸かどうかは、こう測ります。
        - 仲間の語二つの中点を取り、語彙全体の中でいちばん近い語が仲間かどうかを見ます。
        - 線形の識別器は使いません。識別器で切った半空間は、はじめから凸だからです。何も確かめたことになりません。

        マージされたら、1 から事前登録して進めます。

        ## self・any・same が座標系を決める、について
        signature を見直すと、この読みはきれいに成り立ちます。
        - **self**: 変数で、一つのノードを指す。これが一本の軸（基底の一本）にあたります。
        - **any**: self の上を走る（`ranges: self`）。すべての軸を張った全体、つまり無限次元の空間そのものです。
        - **same**: 二つが同じかどうか。これが軸どうしの内積にあたります。同じなら 1、違えば 0 です。

        この読みでは、異なるノードは互いに直角になります。前回の話（別々の refer は外から見ると点で、互いにほぼ直交する）は、ここから自動的に出ます。

        似ている・上位と下位、といった関係は、軸を混ぜることで初めて生まれます。extends や refer で、いくつかの軸を足し合わせるわけです。下位は上位の軸に新しい軸を足したもの、と読めます。これは Park らの「下位 = 上位 + 直交する差分」と同じ形です。仮説 3 は、モデルがこの形を持つかを確かめる問いにもなっています。

        ただ、この対応はまだ私の読みです。確かめる問いにするなら、先に仮説として登録します。
