      text: |
        この体系では、否定に二つの意味が混ざっていました。言語が述べている意味と、検査器や実行器が実際に扱っている意味が違います。

        ## 1. 言語の定義では：真偽が偽
        - 構文で、`neg`（否定の指定）は `val: {truth: false}` と定義されています。
        - 否定の文 `not` は、元の文と真偽の軸で異なる（`cmp: truth differ`）と定義されています。
        - これは古典論理の否定です。P が偽であることを主張しています。

        ## 2. 実装では：書かれていないこと（閉世界の仮定）
        - **規則の照合**（`_match`）：否定の前提 `neg: true` は、その文が事実の中に見つからなければ成り立ちます。これは失敗による否定（negation as failure）です。
        - **実行器**：`holds` は「事実の集合にないこと」として否定を判定します。最初の状態に否定を書くと、「書かれていない文は成り立っていない」というエラーになります。事後条件の否定は、事実を取り除く操作です。
        - **型検査の多くの箇所**：否定の付いた限定は `not m.get("neg")` で読み飛ばされます。何の情報もないものとして扱われています。

        ## 二つの違い
        - 古典の否定 ¬P は、世界について「P は偽」と主張します。
        - 閉世界の否定は、事実の集合について「P はここに書かれていない」と述べます。

        二つが一致するのは、事実の集合が完全だと仮定したときだけです。体系はその仮定を、言語の中では宣言していません。仮定は実行器のエラーメッセージに書かれているだけです。

        ## 前の議論への含意
        `natural_language`（設計されていない言語）は、二つの意味で別物になります。
        - **古典の否定として読む場合：** 「設計する」が偽だという、設計についての主張です。語彙として `v_design` に依存します。前回の結論のとおりです。
        - **閉世界の否定として読む場合：** 「この言語を終点とする設計の事実が、事実の集合にない」という主張です。中身は事実の集合についての記述です。つまり、体系の行為である「述べる」の側の主張になります。変化について何かを主張しているわけではありません。

        否定の意味が決まらないと、シグネチャからの分類も決まりません。どちらの読みでも `v_design` は語彙として出てきます。ただ、分類が「変わる」になるか「述べる」になるかが変わります。

        ## 決めること
        - **(a) 古典の否定に統一する。** 偽であることを事実として書けるようにし、実装も合わせます。閉世界の仮定は捨てます。
        - **(b) 閉世界の否定に統一する。** 構文の `neg` と `not` の定義を、「事実の集合にない」に直します。そうすると、否定は事実の集合について述べる行為になります。閉世界の仮定は、言語の中で宣言します。
        - **(c) 両方を別の語として持つ。** 古典の否定と、書かれていないことを区別して書けるようにします。

        どれを取るかは言語の根本の決定なので、判断してください。まだ何も変更していません。
