        はい、1相の話です。前の整理（発言 1660、2505）とつなぐと、次のようになります。

        **前の整理の骨組み**
        - **静的な層（1つのフレームの中）:** 概念は点で、限定（動詞と位置の組）がその座標です。上下の順序は錐で決まります。
        - **時間の層（フレームの列）:** 持続体はフレームをまたいでも同じ点のままです。生起体はフレーム t から t+1 への変位にあたります。
        - **アフィンの類比:** 点と変位を分けるのは、斉次座標の w です。静的な空間にはこの w にあたる時間方向の座標がないので、持続体と生起体を区別できない、と読みました。
        - **holds だけを持つ静的な動詞:** 点でも変位でもない「関係」です。1つのフレームの中で、点どうしが満たす制約（方程式のようなもの）にあたります。

        **今回の結果はどこに入るか**

        `v_refer` は holds だけを持つ動詞なので、3つめの「フレームの中の制約」に入ります。今回わかったのは、この制約の形（どの位置からどの位置へ、どの基礎の関係が張られるか）だけで、述べる系の動詞を名前なしに切り出せる、ということです。時間の方向、つまり w の側には何も触れていません。

        **この読みから出てくること（まだ測っていない解釈です）**
        1. **座標軸も形で書ける見込み。** 概念の座標は `{of: [v_refer, from], with: X}` のような限定でした。その軸の動詞が形で決まるなら、座標軸は「holds の形と、その中の位置」の組になり、名前の地図（chart）を通さずに書けそうです。
        2. **pre・post を持つ動詞はまだ見ていない。** これらは前の状態から後の状態への変化、つまり変位の側です。Gärdenfors の言葉では結果のベクトルにあたります。これを形で読むなら、1相の形ではなく、「pre の相の形 → post の相の形」という2相の組で比べることになるはずです。
        3. **w は形からはまだ読めていない。** ある動詞が関係なのか変位なのかは、いまは「pre・post を持つか」で決まっています。今回の結果だけでは、この区別は形の中に出てきません。

        2つめ（変位の動詞も2相の形の一致で読めるか）は、この整理の延長でいちばん測りやすいところです。未検証の仮説として登録します。
