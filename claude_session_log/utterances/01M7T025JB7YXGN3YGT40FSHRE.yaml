      text: |
        言い過ぎでした。要るとは言い切れません。

        ## 新しい概念なしで書く案
        既存の語だけでも、次のように書けます。
        `{is: v_immune, from: genus_concept, to: genus_concept}`
        読みは「上位概念の向きは、ほかの上位概念に依らない」です。

        ## それでも見送った理由
        この式は、どの二つの上位概念の組にも当てはまる形です。困るのは、上下の関係にある組まで含んでしまうことです。
        - 「動物」と「哺乳類」は、どちらも上位概念になり得ます。
        - この二つの向きは、直交しません。哺乳類は「動物 + 直交する差分」なので、動物の成分をそのまま持っています。
        - Park らが直交すると言っているのは、差分と上位の組です。上位と下位そのものの組ではありません。

        つまり、この式のままでは、確かめる前から偽になる組が混ざります。直交を主張したいのは、上下の関係にない組だけです。

        ## その限定は式で書けるか
        書けます。条件は「片方がもう片方を extends でたどれない」、つまり extends の鎖の否定です。neg と extends、相異なる二つ（same の否定）で表せる中身なので、表示語に頼る必要はありません。

        ただ、いまの仮説の式は、どれも型の名前を from と to に置くだけです。中に mod や変数を書いた例が、体系にまだ一つもありません。そのため、限定を書く場所は次の二つのどちらかになります。
        - 限定を mod に持つノードを一つ足す。これが前回「概念が要る」と言った中身です。
        - 仮説の式の中に条件を直接書く。いまの文法と検査器が通すかは、まだ試していません。

        なので、正確には「新しい概念か、式の中の条件か、どちらかが要る」です。ほかの3つと一緒に登録しなかったのは、この選択を後に回したからです。

        前回の話の「self・any・same が座標系を決める」と組み合わせると、後者の書き方が筋に合います。相異なる二点は直交する、を same の否定で書けるからです。次に登録するとき、この形で式が通るかを試します。
