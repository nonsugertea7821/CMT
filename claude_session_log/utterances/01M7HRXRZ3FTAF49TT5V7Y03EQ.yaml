        名前空間の再編が終わり、claude/cross にプッシュしました。型検査と実行の検査は、どちらも手元で通っています。

        **層の構成**（使う向きは ontology→axiom、syntax→ontology、runtime→syntax、std→syntax）
        - **axiom**：公理だけです。基礎の関係 exists・refer・same、軸 count・amount・text・truth、規則の変数を置いています。ノードと法則は持ちません。
        - **ontology**：存在論です。part・depend・after・involve（表示は「関わる」）と、その6つの法則、軸 ratio と order を置いています。推論は「行う(何か, これ)」の形に一般化しました。
        - **syntax**：文法と、体系の書き方の法則です。
        - **runtime**：run を改名して統合しました。
        - **std**：人工物・モデルなどです。「モデルの推論」（model_inference）もここに置きました。

        ノードは「層.名前」の形で持ち、層を付けずに書いた語は、自分の領域、使う領域の順に探して解決します。

        **検査の結果**
        - 型検査はエラー0で、ノード数は 561 です。以前は 560 で、モデルの推論の1つが増えました。
        - 測定値 608、観察 106、仮説 56 は以前と同じ数です。
        - 実行の検査は「実行の記録 1、歩数 3」で、以前と同じ出力でした。
        - **表示の行**：変わったのは推論の行だけです（「推論 ＝ 過程 ∧ 行う(何か, これ)」と、新しい「モデルの推論」の行）。
        - **実験に渡す文字列**（render_expr）：全語で以前と同じでした。
        - **issue の下書き**：78件を作り直しました。変わったのは、`run.` を `runtime.` に直した1件だけです。

        **理由をまだ確かめていない変化**
        - 参照の数（refer）が 1522 から 1506 に、種類の下位の関係（r_below）が 3686 から 3675 に減りました。ノードは1つ増えたので、増えるはずのところが減っています。
        - 語に層の名前が付いて同じ語にまとまったことが原因の候補ですが、確かめていません。表示と実験の入力が変わっていないので、検査の結果には影響していないと見ています。

        **変更の過程で決めたこと**
        - **層をまたぐ参照**：exp → std → syntax → ontology のように、使う領域の使う領域も参照できる必要がありました。syntax に法則 visible_trans を1つ足しました。
        - **端の any**：存在の数量化のノードは syntax.any になりました。ノードの端に書く `any` は、以前どおり書き方の語として扱います。
        - **主張の側の確かめ方**：lang の主張が参照してよい語を、5つの層すべてと lang の語に広げました。

        **PR**
        状態を確かめたところ、claude/cross の PR は #3 だけで、すでにマージ済みです。今回の作業（issue 同期 cf0bb3a、途中のコミット f4031fd、今回の再編）は、まだどの PR にも入っていません。claude/cross から main への新しい PR を作ってよいですか。
