      text: |
        原典を三本読みました。DisCoCat の系統は、式の識別子化の半分をすでに解いています。もう半分は「構造だけでは決まらない」と、定理として示しています。

        ## 原典で確かめたこと

        **1. Coecke・Pavlović・Vicary「A new description of orthogonal bases」（[arXiv:0810.0812](https://arxiv.org/abs/0810.0812)）**
        - 定理 5.1：可換な †-フロベニウス代数を一つ選ぶことと、直交基底を一つ選ぶことは、一対一に対応します。正規直交基底なら、代数に「特殊」という条件が加わります。
        - 構造の写像は、基底で書くと次のとおりです。
          - 写す：e_i → e_i⊗e_i
          - 単位：Σ e_i（すべての基底の和）
          - 掛ける：e_i⊗e_j → δ_ij e_i（同じなら残り、違えば 0）
        - 基底は、構造から取り出せます。写す写像できれいに複製される元が、ちょうど基底になります。基底の名前を外から与える必要はありません。
        - 系 7.2：ただし、写す・消すを保つ射で見ると、この圏は有限集合の圏（FinSet）と同値です。つまり、構造が定めるのは基底の「付け替え（置換）を除いた」形までです。どれが何という名前は、構造からは出てきません。

        **2. Sadrzadeh・Clark・Coecke「Frobenius anatomy of word meanings I」（[arXiv:1404.5278](https://arxiv.org/abs/1404.5278)）**
        - 関係代名詞（who, which, that）の意味は、コーパスを使わず、名詞の空間のフロベニウス構造だけで組み立てています。本文にも「関係代名詞のベクトルを作るのに、コーパスから情報を取る必要はない」とあります。
        - コーパスのデータが入るのは、名詞と動詞だけです。
        - ほかの機能語（前置詞・限定詞）にも同じ方法が使えそうだ、と書いています。ただし、実際に組み立ててはいません。and・not・量化子・コピュラの意味は与えていません。
        - 「機能語の意味は型で決まる」という一般原理も、明言はしていません。

        **3. DisCoCat（[arXiv:1003.4394](https://arxiv.org/abs/1003.4394)）と ICS（[arXiv:1703.08314](https://arxiv.org/abs/1703.08314)）**
        - DisCoCat では、他動詞を「基底の対ごとの 0/1」で組みます。ブール値に落とすと、関係の圏の話になると述べています。
        - ICS では、形容詞「黄色い」を「色の領域だけを条件で絞り、ほかの領域はそのまま通す対角の関係」として書いています。
          - あなたの「外から見ると断面、中から見ると選んだ軸だけが動く」に、いちばん近い形です。
          - ただし論文自身は、これを射影や切り出しとは呼んでいません。
          - 交わり（intersection）を掛ける写像から導く説明もありません。そう読めることは私の確認です。
        - 無限次元を使った例はありません。例はどれも有限です。

        注意：ICS の後半（動詞の例を含む）は要約でしか読めておらず、まだ確認していません。

        ## あなたの直観との対応

        | 直観 | 原典 |
        |---|---|
        | self が軸の1本 | 基底の一本（写すで複製される元） |
        | any が全体 | 単位 Σe_i |
        | same が内積（同じなら 1、違えば 0） | 掛ける δ_ij |
        | refer が軸を切り出す | ICS の「一つの領域だけ絞る対角の関係」が近い。ただし切り出しとしての定式化はない |

        ここからは私の解釈です。「self・any・same が座標系を定める」は、定理 5.1 の内容とほぼ同じです。違うのは次の二点です。
        - 原典は有限次元で、基底を固定しています。あなたの像は、上限なく開いた全体です。
        - refer を「切り出し」として一般に扱う枠組みは、原典にはありません。

        ## 識別子化について言えること

        - **解いている側**：関係や機能語（私たちの動詞の側）は、名前ではなく構造で識別できます。#503 の「v_refer は holds の図の一致で読める」は、この系統と同じことを体系の上でやったことになります。
        - **解けないと示している側**：個体（基底）は、構造からは付け替えを除いてしか決まりません。同じ形をした個体どうしを区別するところでは、名前が最後まで残ります。

        この「名前が残る所」を体系の上で数える問いを、仮説 `h_names_up_to_relabel`（d_cscl_display_derived に結んだ）として登録し、[PR #512](https://github.com/nonsugertea7821/CMT/pull/512) を立てました。登録だけの PR なので、自動でマージされます。開いている #504（検査器は綴りに依らない）とは表と裏の関係です。#504 は付け替えても何も変わらない側を、こちらは付け替えでしか区別できない所が残る側を問います。

        ほかの片付け：
        - #505（refer の切り出し系の仮説 6 つ）は自動でマージ済みです。手元のブランチを消しました。
        - PR を見張る設定のとき、番号を一度 #506 と取り違えました。すぐ外して、#512 に付け直しています。
