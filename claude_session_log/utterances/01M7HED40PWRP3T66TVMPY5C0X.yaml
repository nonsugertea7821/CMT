      text: |
        三つとも入れて、今の spec はすべて通りました。わざと誤りを入れて、各法則が実際に反応することも確かめています（確かめた後は元に戻しました）。check_spec と run_spec は通っていて、コミットしてプッシュ済みです（8b31dc9）。

        | 法則 | 中身 | わざと入れた誤り | 結果 |
        |---|---|---|---|
        | ① 部分の事実の向き（part_fact_direction） | 「a は b の部分」という事実が、種類の限定と逆向きになっていないか見る | 軸の値と軸の部分関係を、事実の側で逆にした | 反応した |
        | ② 種類としての部分の反対称（kpart_*） | 部分の限定から「種類としての部分」を導き、推移と下位への継承をたどって、互いに部分になっていないか見る | 隠れ状態とずれを互いの部分にした | 反応した |
        | ③ 表示名の明示（part_display_explicit） | 「〜から／へ部分になる」は使えない。「〜の部分である／〜を部分に持つ」と書き、限定の向きと合わせる | ずれの表示名を「隠れ状態を部分に持つずれ」にした | 反応した |

        - **表示名の書き換え:** ③ に合わせて、表示名13件を書き換えました。例えば「語から部分になる情報」は「語を部分に持つ情報」に、「設問へ部分になる情報」は「設問の部分である情報」になりました。
        - **今の spec への当てはめ:** 「部分になる」の事実404件に ① を当てたところ、逆向きは0件でした。

        **① の形を変えた理由**
        最初は「部分の限定を持つ種類の個体には、それを裏づける事実が必ずある」という形で試しました。ところが約300件が引っかかりました。限定は「ある X の部分である」という存在の主張で、事実をすべて書き出すことは求めていないためです。そこで、事実と限定が食い違ったときだけ誤りとする形にしました。

        **まだ捕まらない誤り**
        最初に気にしていた「ずれ ⇄ 隠れ状態」の逆向きの下書きは、今の三つの法則でも捕まりません。
        - **捕まらない理由:** 種類として矛盾しておらず、循環もなく、関わる事実もなく、表示名にも部分の言い方を含まないからです。
        - **原理的な限界:** 向きの誤りの中には、形式的な法則では原理的に区別できないものが残ります。
        - **残る手段:** 表示名で関係を明示する ③ が、人が読んで気づくための主な網になります。

        これを強めるなら、部分の限定を持つ種類には、表示名に必ず「〜の部分である／〜を部分に持つ」を含めるよう求める手があります。ただ「層」「選択肢」「語のトークン位置」のような自然な名前も書き換えることになるので、入れていません。必要なら言ってください。
