      text: |
        この路線が支持されても、「内部状態への介入は無理」とまでは言えないと思います。言えるのは、条件付きの限界です。

        **1. 支持されたときに言えること**
        - 言えるのは「事前の概念と干渉せずに使える次元が、体系の要る次元より少ないとき、一つの層にベクトルを足すだけの介入では、兄弟を分けきれない」という範囲です。
        - この限界が実際に効くかどうかは、要る次元の伸び方で決まります。
          - 式の部分の数に比例して伸びるなら、大きな体系では足りなくなります。
          - log の程度でしか伸びないなら、介入は現実的なまま残ります。

        **2. 足りなかった場合の逃げ道**
        ベクトルを足す以外にも、介入の手はあります。
        - 複数の層に入れて、層の折り畳みを使う。
        - 重みを少し変える（LoRA など）。読み出しの向きそのものを作り変えることになります。
        - 外に次元を足す。モデルの外に、概念のための記憶や判定の部品を置きます。
        - 文脈で定義を与える（文章での注入）。

        体系にはすでに、二つの経路を分ける決定があります。
        - 重みが公開されたモデルにはベクトルを使う（d_vector_needs_open_weights）。
        - API でしか使えないモデルには文章を使う（d_text_for_api_models）。
        - 支持されれば、この使い分けに「体系の規模」という条件が加わる形になると見ています。

        **3. E33 の失敗は、次元が足りない証拠にはまだなりません**
        ここは注意が要ります。
        - E33 で学習した自由度は、1536 × 2 の値です。8 問を分けるには、十分すぎるほどあります。
        - それでも余裕がほぼ 0 になったのは、往復の手順で、定義を言う学習と問いに答える学習が引っ張り合った結果かもしれません。これは容量ではなく、最適化の問題です。
        - 次元の限界と言う前に、この手順の側の原因を除く必要があります。
          - 先に述べた「k 次元に落として、弁別が保たれる最小の k を見る」測り方なら、この二つを分けられます。

        まとめると、この路線の結果は「介入が可能か不可能か」ではなく、「どの規模の体系まで、どの介入で足りるか」という表として返ってくるはずです。

        本線 b 領域の道（d_road_region、PR #655）、本線 a の E33 の読み直し
