      text: |
        「慣習で決まる」のと「空間に形がある」のは両立します。慣習が恣意的なのは語の形（音や字）のほうで、意味の切り分け方は恣意的ではないからです。

        **1. ベクトルは語の形ではなく、使われ方から作られる**
        LLM の空間で「倉庫」の位置を決めているのは、「そう-こ」という音や「倉庫」という字ではありません。どんな文脈で使われるか（分布）です。学習の始めには、語のベクトルは恣意的な初期値です。そこから、「保管」「在庫」「搬入」と同じ文脈に出る、といった使われ方で動かされていきます。音や字が恣意的でも、使われ方は世界と用途に縛られます。なので空間には形が出ます。

        **2. 切り分け方は恣意的でなく、凸に寄る**
        語彙化の歴史が決めるのは、意味の空間のどこに境界線を引き、どの語を当てるかです。ただ、その線の引き方には制約があります。色の語の研究では、言語ごとに境界は違うのに、どの言語の分け方も知覚の空間でほぼ凸になっています。凸に分けると伝達の効率がよいからだ、という説明があります（Berlin & Kay の流れ、Regier と Kemp らの情報効率の議論）。「どの語を使うか」は歴史の偶然でも、「どんな形の領域に語を当てるか」は効率の圧力で凸に寄る、ということです。

        LLM の側でも、カテゴリーの概念が表現の空間で凸な領域（多面体）として現れる、という報告があります（たとえば Park らの、階層的な概念の幾何の研究）。ただ、どこまで一般に成り立つかは、まだ決着していないと思います。

        **3. 非凸が出るところは、歴史が効率に逆らったところ**
        凸にならないのは、たとえば次のような場合です。
        - **同音異義・多義**: 「かき」（柿・牡蠣）のように、形が同じで意味の離れた語。一つの語の領域が飛び地になります。
        - **歴史的な分類**: 「鯨」が魚へんを持つように、昔の分類が語に残っている場合。
        - **言語ごとの切り方の違い**: 日本語の「お湯／水」は温度で分けますが、英語は water 一語です。別の言語の切り方が混じると、境界が凸でなくなりえます。

        つまり、凸な部分は慣習が意味の構造に沿ったところ、非凸な部分は歴史の偶然が残ったところ、と読めそうです。

        **この体系との関係**
        - 前の話の二層に当てはめると、こうなります。
          - **句**: 式から作れる。意味の構造そのもの。
          - **辞書の語**: 慣習。ただし、どの領域に当てるかは凸に寄るよう制約されている。
        - ロードマップの `d_road_region` は「使い方をまたいだ一貫性は、中点が同じ概念に入るか（凸性）に頼る」という決定です。今の話は、その決定がなぜ成り立ちうるかの説明にもなります。式で書いた限定が意味の構造をとらえていれば、モデルの空間の凸な部分と対応するはずです。合わないところは、慣習の偶然か、式の書き漏らしのどちらかです。

        この見方、つまり「非凸な部分は、式で書いた構造と慣習がずれる場所を示す」を検証可能な形にできるか、少し考えてみてもいいかもしれません。
