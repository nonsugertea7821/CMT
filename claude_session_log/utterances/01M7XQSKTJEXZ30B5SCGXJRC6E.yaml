      text: |
        その見方なら、二つの読みは一つの式の両向きとして書けそうです。そう読むと、すでに体系の中に二つの象限としてそろっています。

        ## 一つの式
        概念 x の中身全体 D(x) は、親の中身と自分の差異を足したものです。

          **D(x) = D(親(x)) ＋ 自分の欄(x)**

        この式は、どちら向きにも解けます。

        | | 与えられるもの | 求めるもの | 体系での姿 | 時間での姿 |
        |---|---|---|---|---|
        | 演繹の象限 | 中身全体 D(x) | 親 | 名詞（placed_deduced、定義された概念） | 後から見た、いまの類 |
        | 構成の象限 | 親と差異 | 中身全体 D(x) | 動詞（extends を書く、原始概念） | 分化の出来事（親から差異を足して生まれる） |

        - 「いまの類」と「分化の記録」は、相反する性質ではありません。同じ式を逆向きに解いたものです。
        - 世界の開き方も、この対に乗ります。
          - 名詞は閉世界の側です。全部を書くので、親が演繹できます。
          - 動詞は開世界の側です。書かないものは継ぐので、親が要ります。
          - 以前に出していただいた「開閉世界の対称性」と同じ軸になります。

        ## すでにある観察（事実と解釈を分けます）
        - **事実**:
          - 動詞は、自分の欄だけからは親が出ませんでした（#561〜#574、最良で 59/70）。
          - 継いだ中身まで含めると、70/70 で親が出ました（#557）。
          - 名詞は tc が placed_deduced で検査しています。
        - **解釈**: 動詞でも、中身全体から親を出す向き（演繹の向き）は成り立っています。成り立たないのは、差異だけから出す向きです。これは、一つの式が両方の象限で成り立つことと合っています。

        ## これから決めること
        両方が成り立つことを、時間の側でも確かめます。そのために、鏡の仮説 h_lineage_is_history を #580 で登録しました（わき道、h_lineage_is_genus と対）。確かめは、両方を同じ方法で判定します。
        - git の履歴で、extends が変わった節を名詞と動詞に分けます。
        - 変更の順序を数えます。
        - 予想は次のとおりです。
          - 名詞は、欄が先に変わり、親が後を追う（演繹）。
          - 動詞は、親が先にあり、欄が後から足される（構成）。

        逆の順序がまとまって出るなら、この一つの式の見方は崩れます。

