      text: |
        挙げていただいた 3 人の研究から 6 本を選び、先行研究として体系に足しました（PR #655）。書誌は、出版社・PMC・arXiv の記録で確かめています。

        いちばん効くのは SueYeon Chung の仕事です。先ほどの「体系の規模から、要る次元を逆算する」という考えに、すでに理論があります。

        **SueYeon Chung（高次元表現の幾何）**
        - [Chung, Lee & Sompolinsky 2018](https://link.aps.org/doi/10.1103/PhysRevX.8.031003)（Physical Review X 8, 031003）
          - 一つのものの表現の集まり（多様体。ここで言う立体）を、ランダムに二組に分けたとき、平面で分けきれる数を理論で出しています。
          - その数は表現の次元に比例し、比例の係数は、多様体の半径と次元で決まります。
          - つまり「要る次元 ≒ 概念の数 ÷ 容量」で、容量は立体の大きさと厚みから計算できます。
          - ですから、逆算の問題は「概念の点の雲の半径と次元を測る」問題に置き換わります。これは、先に登録した立体の測り方（#653）でそのまま測れる量です。
          - 主張の形が `h_width_raises_sibling_discrimination` と同じなので、式で結びました。
        - [Cohen ほか 2020](https://www.nature.com/articles/s41467-020-14578-5)（Nature Communications 11, 746）
          - 層が進むにつれて、多様体の半径・次元・相関が下がり、分けやすくなります。
          - どの層で測るか、どの層に介入するかを選ぶ手がかりになります。
        - [Sorscher, Ganguli & Sompolinsky 2022](https://pmc.ncbi.nlm.nih.gov/articles/PMC9618072)（PNAS 119(43)）
          - 少数の例から新しい概念を学べるかどうかを、表現の幾何の量から予測しています。
          - E33 で新しい概念を教えたときに、うまくいかなかった理由を事前に予測できるかもしれません。

        **Joshua Tenenbaum（概念学習と形式モデル）**
        - [Lake, Salakhutdinov & Tenenbaum 2015](https://cims.nyu.edu/~brenden/papers/LakeEtAl2015Science.pdf)（Science 350(6266)）
          - 概念を「部品を組み合わせるプログラム」として表すと、一つの例から人と同じ程度に学べます。
          - CSCL の「概念を式の部品で書く」と同じ発想です。
        - [Kemp & Tenenbaum 2008](https://pmc.ncbi.nlm.nih.gov/articles/PMC2492756)（PNAS 105(31)）
          - データに合う構造の形（木・環・格子など）そのものを選ぶ方法です。
          - 体系は、extends の木という形を最初から前提にしています。その前提を問い直す材料になります。

        **Melanie Mitchell（抽象と類推）**
        - [Mitchell 2021](https://arxiv.org/abs/2102.10717)（Annals of the New York Academy of Sciences 1505(1)）
          - いまの AI の脆さの一因は、抽象と類推の力が欠けていることだ、という主張です。
          - 複数の領域にまたがる評価が要ると述べています。先行研究を分野ごとに分けたファイル（prior_*）を、評価の領域として使う筋とつながります。

        **次の一手（見込み）**
        - Chung の理論の量（多様体の半径と次元）を、立体の測り方（#653）の手順に組み込みます。
        - そうすれば、「要る次元」を一つのモデルの中で見積もれるはずです。

        本線 b 領域の道（d_road_region、PR #655）
