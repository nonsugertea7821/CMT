      text: |
        その投稿は読めませんでした。X のページは取得を断られました（402）。なので中身は確かめられていません。

        「論理ゲート型で CPU でも学習できる」という説明からすると、おそらく Differentiable Logic Gate Networks の流れだと思います（Petersen ら、2022 年。畳み込み版が 2024 年）。私の記憶にある範囲では、次のような手法です。
        - AND・OR・XOR のような 2 入力の論理ゲートをつないだ網を作ります。
        - 各ゲートが「どの演算になるか」を連続な確率として持たせ、勾配で学習します。
        - 学習が終わったら、いちばん確からしいゲートに固めます。
        - 推論はビット演算だけなので、CPU でとても速く動きます。
        - 得意なのは画像分類や表のデータで、言語モデルとしての実績は知りません。

        「軽い学習手段があちこちで作られている」という読みには賛成です。ただ、このプロジェクトにどう効くかは分けて考える必要があります。

        - **効きそうなところ**: #868 の案 3（概念式の文章だけで小さいモデルを一から学習する）は、CPU で回るかが一番の壁です。軽い学習の手が増えれば、その壁は低くなります。
        - **そのままでは合わないところ**: 区画の測り（中点が同じ上位概念に落ちるか）は、モデル内部の連続な状態を前提にしています。論理ゲート網の中間はビットなので、「中点」や「区画」の意味から定義し直す必要があります。今の測りと比べられなくなるので、学習の過程と字面を切り分けるという #868 の目的には、普通の小さい Transformer の方が素直だと思います。

        投稿の文章か、元の論文やリポジトリのリンクを貼ってもらえれば、そこから確かめます。
