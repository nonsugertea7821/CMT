        リポジトリはまだ空だったので、あなたの文面だけを前提に書きます。

        ## 私の案との比較

        いちばん大きな違いは、**概念体系をどこに置くか**です。私はモデルの表現の内側に持たせようとしました。あなたは外に出し、LLMは状態を持たない解釈器と割り切っています。重みに頼らないので忘却が起きず、人間が監査でき、合意も取れます。設計の揺れを無くすという目的なら、外に置く方が正しいと思います。

        | 観点 | 私の案 | あなたの案 |
        |---|---|---|
        | 分化の起点 | 予測誤差 | 人間との合意 |
        | 概念の構造 | 親＋差分 | 類種差（修飾の合成） |
        | 系譜 | 追記専用ログ | 型付きグラフ（系譜・版・置換） |
        | 語と概念 | 多対多 | 同音異義を禁止し、正規形で同一性を決める |
        | 接地 | 未解決 | テストで行う |

        構造はほぼ同じ形に落ち着いていて、違いは「どこまで厳格にするか」です。語と概念を多対多にせず正規形で決めることで、表現力と引き換えに決定性を得ています。目的に合った選択です。

        ## ここから出てくる課題

        重要だと思う順に並べます。

        ### 1. 修飾の役割が増えたときの同一性
        既存概念の正規形にない新しい役割が追加されたとき、その概念は新しい役割について「未指定」なのか「既定値を持つ」のかを決める必要があります。

        - 未指定（開世界）とみなすと、既存概念は暗黙のうちに上位概念へ格上げされます。
        - 既定値（閉世界）とみなすと、過去の定義が遡って書き換わります。

        どちらを選んでも、役割の追加は同一性に関わる変更です。変更が多発する前提なら、役割の追加そのものを版管理の対象にする必要があります。

        ### 2. 意図解釈の段階で曖昧さが再発する
        LLMの「汎用的な概念に寄せる」癖は、第1層でそのまま出ます。人間の意図を、既存の汎用概念にまとめてしまうか、逆にほぼ同じ概念を新しく作ってしまうかのどちらかに偏りやすいです。

        対策として、解釈のたびに**近い既存概念を提示し、「Xと同じか、違うなら差異は何か」に答えさせる**手順を必須にするのがよいと考えます。合意の場面で、差異を言語化することを強制する形です。

        ### 3. テストの循環
        実装とテストを同じLLMが同じ概念式から作ると、同じ誤解が両方に入り、テストを通ってしまいます。

        案として、**差異とテストを1対1で対応させる**ことを提案します。概念を分化するときは、兄弟概念では失敗し自分では通るテストを必ず作り、それを分化成立の条件にします。これで「区別」そのものが接地されます。

        ### 4. 交差分類と単一の類の衝突
        類種差は類を1つと仮定しますが、実際の概念は複数の軸で分類されます。修飾の合成で定義すると、構造は自然に木ではなく束になり、「どれを類とするか」が恣意的になって同一性が揺れます。

        正規形は「根＋修飾の集合」とし、類はそこから導出する扱いにするのが筋だと思います。形式概念分析（FCA）や記述論理の包摂判定が参考になります。

        ### 5. 内包と外延のずれ
        正規形が一致すれば同一、で決まるのは内包上の同一性です。修飾の組が違っても指す対象が同じ、という隠れた重複は検出できません。修飾間の含意（「Aを満たすなら必ずBも満たす」）を表す仕組みが要ります。

        ### 6. 置換が起きたときの波及
        概念が置換されたとき、それを参照しているコード・テスト・他の概念式をどう扱うかが問題になります。

        - 参照に概念の版を固定するかどうか
        - 影響範囲をグラフから算出する仕組み
        - 移行用の変更を生成する仕組み

        ### 7. 実装側から概念が逆流してくる
        実装の途中で、概念体系にない概念が必要になることがあります。これを検出し、第1層に差し戻す経路がないと、語彙リントを通る形で暗黙の概念が溜まっていきます。

        ### 8. 名詞以外の概念
        修飾の合成は実体（名詞）には強いですが、イベント・状態遷移・制約・振る舞いを制御自然言語でどう表すかは別途必要です。実装生成ではむしろこちらが中心になります。

        ### 9. 状態を持たないLLMに何を渡すか
        概念体系が大きくなると、タスクごとにどの部分グラフと系譜をどの粒度で渡すかが性能を決めます。

        ### 10. 合意のコスト
        変更が多発すると、人間の合意がボトルネックになります。同一性や外延を変える変更は合意を必須にし、既存の参照に影響しない精緻化は自動で通す、という仕分けが必要です。

        ## 根本にある問い

        私が最も根本的だと思うのは1と5です。つまり「同一性を何で定義するか」です。正規形で決めるという方針は、修飾の役割が増え続ける前提と構造的に緊張関係にあります。ここをどう解くかで、用語サーバーとグラフの設計が大きく変わります。

        あなたが導いている課題はどれでしたか。重なりと、私が見落としているものを知りたいです。

        この議論を、ブランチ `claude/model-concept-language-mapping-g0lw1i` に設計メモとして残すこともできます。
