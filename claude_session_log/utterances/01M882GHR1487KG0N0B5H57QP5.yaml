        2. Key Technical Concepts

        - **Midpoint membership test** (#364, geo_cross_genus_midpoint)
          - 120 Japanese words. Each word is fed as 「w.
          - Hidden state at layer L is taken from the word's token positions (p:q). Vectors are centered.
          - For each member pair (a, b), find the nearest word to (a+b)/2. A hit is a member of the same set.
          - G_rate = average over genus sets. C_rate = average over cross-genus property sets. R_rate = 200 random 8-word sets.
          - holds = G − R ≥ 0.15.
        - **Geometric framing:** x ≈ g(genus) + s(surface) + c(context).
        - **Transformer mechanics**
          - Detokenization: a multi-token word's meaning sits in the last token.
          - Rogue/outlier dimensions can dominate cosine.
          - Relation roles are carried in attention.
        - **ec families**
          - Defined by v_file_of, v_rows_of (a path with '{axis}' format, e.g. [reads, '{read}', '{layer}']), v_axis_of, v_keys_of '#' (every value of that axis needs v_spell), v_value_of, v_entry_of ('{stat}' or a fixed name such as 'drop'), and v_metric_of mean_value.
          - Measured id = fam.<axis labels in declaration order>.metric.
        - **Observations:** v_near (with `new` as tolerance), v_come_after, v_come_before. Hypotheses are linked with v_support / v_contradict.

