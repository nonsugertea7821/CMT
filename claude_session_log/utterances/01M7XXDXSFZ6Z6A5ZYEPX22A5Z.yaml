        **std の何を数えるか**
        - ノード 28 個、法則の個体、facts の各行です。

        **移す側の決め方**
        - 次の二つを、増えなくなるまで繰り返して決めます。
          - 使い手が exp だけ（またはすでに移すと決まったものだけ）なら、移す。
          - すでに移すと決まったものを参照しているなら、移す。std は exp を使えないからです。

        **判定**
        - 移すノードが std のノードの半分以上なら、h_std_exp_biased は支持です。半分未満なら反証です。
        - std に残るノードと個体は一覧にして出します。これは判定には使いません。

        **先に言っておくこと**
        - 仮説や観察の式の中で std の語に触れているものも、使い手に数えます。
        - そのため、lang の主張が std の語に触れていれば、その語は std に残ります。

