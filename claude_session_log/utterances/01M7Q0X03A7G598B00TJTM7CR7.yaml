        2. Key Technical Concepts

        - **exp.yaml family pattern** (used for sys_comment_ban and sys_attribution):
          - Nodes: `F: {is: measurement_family}`, `F_cond: {is: family_axis, val: {text: cond}}`, and `F_cond_k: {is: axis_value, val: {text: k}}` per key.
          - Facts: v_file_of `F.json`, v_rows_of [rows], v_axis_of, v_value_of / v_spell per key, `v_entry_of '{cond}'`, `v_metric_of mean_value`.
        - **Observations:**
          - In claims.yaml (cscl domain) they use the `exp.` prefix. In exp.yaml there is no prefix: `o_x: {is: observation}`, `v_contradict`.
        - **Law named_mod:** two concepts with the same mod must share a named mod.
          - Example: `speak_to_operator: {display: 運用者が発話する（終点）, extends: quality, of: [v_speak, to], with: operator}`, used by place_system and operator_speech.
        - **exp.lim_post_hoc:** a limitation that comes after an observation. Used through `exp.v_qualify(exp.lim_post_hoc, h)` for hypotheses formed after the observation.
        - **hyp_withdrawn (new, #182):** `hyp_withdrawn: {display: 取り下げた仮説, extends: withdrawn_sentence, mod: {of: [is, from], with: hypothesis}}`.
          - ec skips the status/evidence check when `T.is_a(status, "withdrawn_sentence")`.
          - sync maps `"hyp_withdrawn": "withdrawn"`, and `reason_of(c)` returns "not_planned" for withdrawn and "completed" otherwise.
        - **sync_issues:** `claims()` gives c["status"] labels. CLOSED = {supported, refuted, adopted, withdrawn}.

