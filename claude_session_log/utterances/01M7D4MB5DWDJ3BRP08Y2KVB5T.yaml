      text: |
        合っていません。実験でモデルに渡している定義も、モデルに書かせている出力も、制御自然言語ではなく、普通の日本語です。

        ## 実験で実際に使っているもの

        | 場面 | 使っている言語 |
        |---|---|
        | モデルに渡す定義 | 私が書いた日本語の文（「社員：当プロジェクトでは、会社と雇用契約を結ぶ全員を指す。アルバイトとパートも社員に含む。」） |
        | モデルに渡す設問 | 私が書いた日本語の文 |
        | モデルの出力 | 選択肢の番号1トークン、または自由な日本語の文 |

        制御自然言語が使われているのは、実験について述べる側だけです。測定条件、観察、仮説、決定は `spec/` に書いてありますが、実験の対象になっている 24個の再定義（社員、営業日、未成年 など）そのものは、オントロジーの式になっていません。`experiments/data/concepts_ja.json` に日本語の文として入っているだけです。

        ## これが意味すること

        これまでの結果は、すべて「自然言語で書いた定義に、モデルが従うか」についてのものです。最初の構成にあった次の2つは、まだ一度も試していません。

        1. **意図の解釈**: モデルが、人間の意図を概念式に変換できるか。
        2. **概念式からの生成**: モデルが、概念式を受け取って、それに従った判定や実装ができるか。

        つまり、この計画の中心にある仕組みと、実験が測っているものの間に、ずれがあります。語彙の体系を固めるのに時間を使いましたが、それが実験の入力としては使われていません。

        ## やるべき実験

        体系が固まったので、次が可能になりました。

        | 実験 | 内容 | 分かること |
        |---|---|---|
        | 概念式で渡す | 同じ 24個の再定義を、日本語の文ではなく概念式で渡して、同じ設問に答えさせる | 定義の書き方を制御すると、追従が変わるか |
        | 概念式を書かせる | 日本語の定義を見せて、概念式に変換させる。検査ツールで、型と参照が通るかを機械的に判定する | モデルが制御自然言語を書けるか。どこで間違えるか |
        | 概念式で教える | 概念ベクトルの教師を、日本語の定義文ではなく概念式にする | 定義の暗唱が適用に転移しなかった問題が、式なら変わるか |

        1つ目は、値が関数である再定義（規則型）で特に意味があります。「25歳未満」を文として渡すのと、`{lt: 25}` という値として渡すのとで、モデルの扱いが変わるかを見られます。

        ## 先に必要な作業

        どの実験にも、対象の 24個の再定義を概念式で書く作業が要ります。そのためには、社員・会社・雇用契約・年齢のような、実験の題材の側の語彙をオントロジーに加える必要があります。いまの語彙は、実験を記述するためのもので、題材を記述する語を持っていません。

        この作業と上の3つの実験を、残り項目に加えて進めます。
