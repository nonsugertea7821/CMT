      text: |
        そうなると思います。ただ、どこで停止しなくなるかは、もう少し絞れます。

        **決められる範囲**
        - 法則の評価は、今は手持ちの事実から規則で事実を導き、増えなくなるまで回す形です。ノードの数が有限なら、組み合わせも有限なので必ず止まります。いわゆる Datalog と同じ性質です。
        - 型検査の「動詞の式が同じ」も、書かれた形を比べるだけなので止まります。

        **止まらなくなる所**
        - 評価の途中で新しいノード（新しい概念）を作れるようになると、事情が変わります。Datalog に新しい値を作る操作を足すと、一般には止まる保証がなくなることが知られています。
        - refer で新しい概念を名付ける操作を規則の中で回せば、まさにそれに当たります。
        - 「2 つの概念が同じ意味か」を一般に決めることも、同じ理由で決められなくなります（Rice の定理と同じ形の話です）。
        - 今の評価器が、評価の途中で新しいノードを作れるのかは、私は確かめていません。

        **自然言語はどうしているか**
        - 自然言語も、これを決めてはいません。同じ意味の語が並んで残り、あいまいさは使われていく中で少しずつ整理されます。つまり、決めずに抱えたまま運用しています。

        **この体系に当てはめると**
        - 書かれた形が同じかどうかは、型検査で決めます（必ず止まる）。
        - 意味が同じかどうかは、仮説として登録して、実験で一件ずつ確かめます（全部を決めることはしない）。
        - 今の進め方は、結果としてこの二段に分かれています。完全には決められない部分を、仮説と実験で扱う側に回している、と読めます。

        もし refer による名付けを規則の中で自動で回すようにすると、この分け方が崩れます。ですから、新しい概念を作るのは規則の外（人か、登録の手順）に置いておくのが、止まることを守る素直な線だと思います。
