            - none: no definition.
            - near: the prefix "次の定義に従うこと。\n" + defs[L] + "\n\n".
          - Usages (all margins positive when the model follows the new definition):
            - apply: question_text, averaged over 2 orders.
            - para: INSTR_PARA, project vs ordinary.
            - explain: EXPLAIN with the answer given; options are "「L」は{project/ordinary}を指すから".
