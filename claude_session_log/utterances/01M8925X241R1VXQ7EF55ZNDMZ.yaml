          - summarize gives acc per usage, joint (all four > 0), indep (product of accs), and a permutation lo/hi (10000 runs, seed 0, 2.5% and 97.5% points).
          - Judgment on near:
            - Fewer than 2 nontrivial usages: not_judged.
            - joint outside [lo, hi]: supported. Inside: refuted.
          - Output file: results/e58_<model>.json, with keys rows, summary{none, near}, judgment.
