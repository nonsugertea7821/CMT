      text: |
        `h_mod_phrase_without_with`（#461）は支持でした。PR は #468 です。手順を一度直したので auto-merge には乗らず、手で見てもらう必要があります。

        **何をしたか**
        部分の限定は 99 あり、そのうち with を持つ 92 は前回までに式から訳せていました。今回は残りの、with のない 7 を扱いました。with がないときは、相手を「その位置に来る種類のどれか」と読みます。相手の種類は動詞の定義から取ります。第三のものを作る動詞なら `new_kind`、そうでなければ限定の位置と反対の位置の種類です。句は、その種類の表示語と言い方をつないで作りました。

        **結果**
        - with のない 7 つは、すべて訳せました。
          - 生起体を時間的な部分に持たない（continuant）
          - 生起体を時間的な部分に持つ（process）
          - 合成できる情報の部分である（summand）
          - 商品を部分に持つ（warehouse、category）
          - 地方の部分である（land）
          - 土地を部分に持つ（region）
        - 部分の限定は 99 すべてが式から訳せました。表示語の法則に反するものも、新しく出た誤りも 0 です。

        **訂正**
        最初の手順は、測る前の段階で止まりました。表示語の法則が #455 で Python から文法の規則に移っていて、差し込み先がもうなかったためです。何も測っていない段階だったので、差し込み先だけを直した `_fix` を、走らせる前に commit しました。数える量と判定は変えていません。

        **解釈と限界**
        - 部分の限定の句は、すべて限定の式から出せることになります。手で書いた表示語を検査する法則が要らないかを確かめる前提がそろいました。
        - 「どれかの」のような量化の語は、句に入れていません。日本語として自然かどうかは、ロードマップ b で扱います。
        - warehouse と category は同じ句になります。この二つを分けているのは句ではなく式です。

        ロードマップ: a（識別子化）で h_mod_phrase_without_with を確かめた。次は h_display_law_redundant（#466）。
