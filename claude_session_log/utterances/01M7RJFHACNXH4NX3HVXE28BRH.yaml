        E25 の判定は inconclusive でした（#287）。仮説 h_multi_layer_raises_conflict_following は未検証のままなので、PR は Draft のままにしています。tc と ec は通りました。

        **結果**（accuracy / 順序に強い正答率）
        | | none | text | multi |
        |---|---|---|---|
        | 学習用 | 0.25 / 0.21 | 0.375 / 0.17 | 0.50 / 0.0 |
        | 学習していない上位 | 0.25 / 0.25 | 0.29 / 0.04 | 0.50 / 0.0 |

        - 事前登録の前提（学習用で multi の accuracy ≥ 0.75）に届きませんでした。
        - 損失は3組とも ln 2（0.70）で止まりました。
        - multi の margin の絶対値は全 48 問で 0.006 未満でした。accuracy 0.5 は、ほぼ 0 の margin の符号が決めた値です。
        - 最初の起動はコンテナの再起動で、結果を書かずに止まりました。同じ引数で起動し直しています。結果のファイルはその1回分だけです。PR の本文にも書きました。

        **含意**
        - 複数層のベクトルは、2つの選択肢の出しやすさを**ちょうど等しくする所**に収まりました。元の意味を打ち消しますが、逆にはしません。
        - 層8の1本（E24）でも同じく ln 2 で止まりましたが、margin の絶対値は最大 0.9 まで残っていました。複数層では、等しくする所への収まりがより強くなっています。
        - E23（複合語の位置）、E24（修飾の位置）、E25（複数層）のどれでも、止まり方は同じでした。位置と層の数では、衝突での止まりは解けないと読みます。
        - 残る読みは2つです。
          - step の量: 30 step では、元の意味から逆の意味への途中で止まる。
          - 教師と目的の形: 2つの順序を教師にすると、等しくする所が鞍点になる。

        **新しい仮説を登録しなかった理由**
        この2つの読みを式で書くには、体系に「step の量」と「初期値」の概念がいります。どちらも今はありません。概念を足す登録は手で見てもらうものなので、まだ登録していません。

        方向として、step の量と初期値の概念を体系に足して、この2つを対の仮説にしますか？ 足さないなら、次の周回（00:21Z）は C の #57 h_attention_carries_text_route に進みます。
