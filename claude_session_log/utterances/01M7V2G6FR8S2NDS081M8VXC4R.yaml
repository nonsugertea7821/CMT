      text: |
        h_placement_in_laws（上位で決まる置き場は、型検査器のコードに依存しない）は、訂正のうえで支持になりました。#411 は Draft を外しましたが、訂正を含むので手で見てもらう扱いです。CI はまだ見ていません。

        **何を確かめたか**
        - 検査器が決めている置き場の検査のうち、次の 3 つを規則の法則に移しました。
          - 動詞は生起体の下に置く
          - 修飾語は特定依存持続体の下に置く
          - axis（数の軸）を持てるのは質だけ
        - 訂正後は、7 つの版すべてで検査器と法則の誤りの数が一致しました。何も足さない版では、法則の誤りは 0 件です。

        **訂正の中身（PR に開示済み）**
        - 最初の測定は、一致が 2 つで、何も足さない版でも法則が 6 件の誤りを出しました。
        - 原因の一つ目は、法則の前提「在る」（exists）がノードでない軸（歳・cm・円など）にも当たったことです。
        - 二つ目は、試しの動詞に始点と終点が抜けていて、検査器が止まったことです。
        - 前提を「ノードだけが持つ文」に替え、試しの動詞を直す訂正スクリプトを、走らせる前に登録してから測り直しました。
        - 一点、順番に崩れがあります。訂正スクリプトを、元の結果ファイルを足す commit より先に commit しました。結果を見た後に書いたものなので、自動マージには乗りません。

        **含意**
        - syntax の文 `axis` は、「ノードが持つ数の軸」と「軸の上位」の二つの意味に使われています。名前で読まず式で書くなら、二つの別の文に分けるのが筋です。
        - これは今回は仮説として登録していません。次の周回で、中身を式で書けるかを見てから登録します。

        ロードマップ a の識別子化で、h_placement_in_laws まで進みました。この層の残りは h_cscl_self_hosting です。
