      text: |
        正本を、固めた形に切り替えました。検査は通っており、プッシュ済みです。

        ## 切り替えた内容

        | ファイル | 変更 |
        |---|---|
        | `spec/ontology.yaml` | 試験の第4版の形に置き換え。仮説と決定で使う動詞 11個を追加 |
        | `spec/claims.yaml` | 仮説の述語を動詞に置き換え。決定 15個を書き直し |
        | `spec/measurements.yaml` | 測定条件の意味づけを、ノードと軸の値で書き直し |
        | `tools/check_spec.py` | 全面的に作り直し |

        ## 現在の規模

        | 項目 | 件数 |
        |---|---|
        | ノード | 211（うち動詞の語根 37、役割 5） |
        | 基礎の関係 | 6 |
        | 分類の軸 | 5 |
        | 測定値 | 332 |
        | 観察 | 58 |
        | 仮説 | 32 |
        | 決定 | 15 |

        観察 58件は、切り替えの前後で変わらず、すべて結果ファイルから再計算して成り立っています。

        ## 仮説と決定で使う動詞

        対象外にしていた関係を、状態の関係で書きました。

        ```
        を上げる     : 終点は、始点がない場合の値より後ろにあり、始点に依存する
        を下げる     : 終点は、始点がない場合の値より前にあり、始点に依存する
        の原因である : 終点は、始点の後にあり、始点に依存する
        に転移する   : 終点は、始点に依存する
        と同居できる : 始点と終点が、同じ第三のものに依存する
        に頼る       : 始点は、終点に依存する
        ```

        「下げない」「転移しない」などは、否定で書いています。

        ## 決定の扱いが変わった点

        - **「テストは適用例の一種である」は、体系の構造そのものになりました。** テストを「適用例のうち、検証に使うもの」と定義したので、この決定は検査が構造から確かめます。採用済みの決定が体系の上で成り立たなくなると、検査が失敗します。
        - **「〜で測る」「〜に置く」「〜に限る」という専用の関係は、無くなりました。** 既存の動詞（測る、部分になる、からなる、頼る）で書けたためです。

        ## 検査で確かめていること

        わざと入れた6種類の誤りは、すべて検出されました。

        | 入れた誤り | 検出 |
        |---|---|
        | 仮説の型違反（生起体しか来られない位置に、持続体を置く） | その位置に来られない |
        | 採用済みの決定が、体系の上で成り立たない | 下位になっていない |
        | 偽の観察 | 成り立たない（計算値つき） |
        | 測定条件の意味に、未定義のノード | 未定義 |
        | 役割に、根拠となる定義がない | 根拠がない |
        | 最上位以外に説明文を付ける | 式で書くこと |

        ## 留保

        - **測定条件の意味づけは、粗くなりました。** 以前は「何を、どこに、どう届けるか」を役割名つきで書いていましたが、いまは関わるノードの並びと、軸の値だけです。どのノードが何の立場で関わるかは、ノードの種類から読み取ることになります。
        - **決定のうち 2個は、検査が構造から確かめません。** 「再定義は用語集の先頭に置く」「与えられた意味を保持するのは、教示で得られたベクトル」は、暫定の取り決めとして書いてあり、体系の上では成り立っていません。暫定なので検査は通しています。
        - **式が意味を正しく捉えている保証は、引き続きありません。** 検査が確かめるのは、型の整合、式の重複、参照の解決、観察の真偽です。

        ## そのほか

        - 1時間ごとの継続確認の指示を、新しい書き方に合わせて改めました。
        - `spec/trial/` は試験の記録として残してあります。正本ではありません。
        - 凍結した文書（`docs/design.md`、`experiments/README.md`）は、そのままです。

        実験は、E8 が 24概念すべての学習を終え、評価に入りました。結果が出たら、新しい形の `spec/` に記録します。
