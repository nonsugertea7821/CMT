      text: |
        できます。ただし、それは「限定で導く」定義ではなく、「宣言する」定義になります。体系で確かめた結果を3点にまとめます（体系は変えていません）。

        ## 1. 関係・真偽・量は、限定を組み立てる部品そのもの
        syntax が定める限定の書き方は `mod: [of, with, neg, quant, at]` です。各部分が何に当たるかは次のとおりです。

        | 限定の部分 | 象限 |
        |---|---|
        | `of: [動詞, 端]` | 関係 |
        | `neg`（と文の `val`） | 真偽 |
        | `quant`、`at: {count, amount}` | 量 |
        | `with` | 別の概念 |

        関係・真偽・量は、限定の道具を作っている材料です。限定される側に来ることはありません。真偽と量は、ノードではなく軸として公理に置かれています（`truth`、`count` など）。「限定できないものは概念より上、シグネチャ」という見立てに合います。

        ## 2. 質だけは、限定が概念になったもの
        - 名前を付けた限定 57 個のうち 54 個は、quality の下にあります。残りの3個も role と disposition で、どれも依存持続体です。
        - つまり質は「限定そのものを名指したもの」です。しかも質は、さらに限定されます（quality の下位は 105）。
        - 4つのうち、自己言及が起きる場所は質です。限定する道具が、そのまま限定される概念になっています。

        ## 3. 「自分を限定するもの」を述べると、定義が循環する
        `extends` と `with` をたどって、定義どうしの循環を探しました。664 ノードのうち、循環は 7 つありました。

        | 循環 | 層 |
        |---|---|
        | system ↔ cscl ↔ concept_expression | syntax |
        | axis ↔ value | syntax |
        | base ↔ state_relation | syntax |
        | pre ↔ post | syntax |
        | law_rule ↔ premise | syntax |
        | sentence ↔ word | ontology（言語の部分） |
        | model ↔ weights | std |

        7 つのうち 5 つが syntax、つまりシグネチャの層に集まっています。互いを限定に使い合って定義されている語は、言語の骨組みのところにあります。

        ## 含意：導けるものと、宣言するしかないもの
        - 循環に入っている語は、根から限定をたどって導くことができません。展開しようとすると止まりません。おっしゃる「停止性につながる循環」です。
        - それでも型検査は通ります。名前を宣言してあるからです。プログラムの再帰型と同じで、名前で止めれば循環しても定義として成り立ちます。中身を展開して定義しようとすると止まりません。
        - ここから、次の区別が立ちます。
          - **概念** = 限定で導けるもの。
          - **シグネチャ** = 自分を限定するものについて述べるしかないもの。これは宣言で置くしかありません。
        - 前に話した「宣言が存在を導く」は、この宣言の側の話でした。

        ## 弱さ
        - 循環は、私が決めた辿り方（`extends` と `with`）だけで数えました。
        - 7 つの中には、std の model ↔ weights のように、シグネチャとは言いにくいものも入っています。
        - 「循環しているもの ＝ 宣言するしかないもの ＝ シグネチャ」は、まだ仮説です。

        ## 次の候補
        - **仮説として登録する。** 内容は「限定で導けない（定義が循環する）語は、シグネチャの層に集まる」。確かめ方は、循環の数え方を事前に固定し、層ごとの割合を比べることです。
        - 前回の (i) フレームの区切り、(ii) 巻き戻しで戻すもの、も決まっていません。この区別（導くか、宣言するか）を使うと、「フレームで増えるのは宣言」と言い直せそうです。

        どちらから進めますか。
