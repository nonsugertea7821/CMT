      text: |
        私も、概念体系に合ったやり方はあると思います。ふつうの学習（次の語当て、問いと答えの組）は、教える材料が文章として流れていればよく、材料の形は問いません。概念体系は形を持っているので、その形を教え方そのものに使えるはずです。

        形の使い方として、二つを仮説にして #868 に足しました。

        - **上位概念への包含を教える**（h_containment_teaching_raises_consistency）: 「業務日」は「日」の中に入る、というように、下位の概念の区画が上位の概念の区画の中に収まるように教えます。いま区画の性質を外から測っている領域の道を、教え方の側で直接つくる形です。
        - **兄弟の概念の組を対比させて教える**（h_sibling_contrast_raises_consistency）: 同じ上位概念を持つ組（平日と休日など）を、互いの違いで教えます。どこが違うかを体系が指してくれるので、比べる組を選べます。

        どちらも、効いたかどうかは区画そのものではなく、目的の物差しである「使い方をまたいで一貫して使えた割合」で測ります。区画をつくるように教えれば区画の値が上がるのは当たり前で、問いたいのはそれが目的につながるかだからです。

        同じ PR には、さっき登録した二つもあります。
        - 概念式で教えたモデルなら、区画が字面に左右されなくなるか
        - そのモデルが同じ課題を正しく解けるか

        二つ目の点として、他に考えた道がいくつかあります。どれもまだ登録しておらず、勧めているのでもありません。
        - 依存の順に教える（先に依存される概念から）
        - 表示語を入れ替えながら教えて、字面に頼れなくする
        - 型検査を損失に入れる

        この中で進めたいものがあれば、そのとき登録します。

        #868 は CI を待っています。概念を三つ足すので、自動ではマージされません。
