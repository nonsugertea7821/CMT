        5. Problem Solving

        - **std bias:** refuted under the use-based fixpoint. Interpretation: the std "definition" is only its display plus a necessary condition, which led to the paired definition hypotheses.
        - **Vocabulary placement**
          - The language strictly requires each concept to be differentiated by a formula.
          - With only the base relations (same, exists, refer, depend, part, after, involve, above) and existing verbs, everyday nouns such as pig vs umbrella likely can't be distinguished.
          - Japanese collapses make/do/take into one word 為す, which unique_in_domain forbids having three times.
          - The honest procedure is to place only what can be formulated so that tc passes, and to leave the rest out (counted as non-fit, with reasons in the commit). h_basic_vocab_fits will likely be refuted.

