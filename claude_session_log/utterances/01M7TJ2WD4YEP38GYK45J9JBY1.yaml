      text: |
        h_frame_both_sides（#327）を確かめ、PR #396 を開きました。結果は mixed です。Draft は外してあり、あなたの確認待ちです。

        **分かったこと**
        - 「前の状態（pre）を書く動詞は、後の状態（post）も書く」は、いまの体系では成り立っています。pre を書く節点は 16 あり、どれも post も書いていました。片側だけの動詞はありません。
        - ただし、これを法則として式で求めることは、いまはできません。写しに法則を足すと、pre を書く動詞がすべて違反と出ました。
          - 原因は検査器の側にあります。検査器は pre を法則が読む事実に訳しますが、post は訳しません。そのため「post がない」という前提が、どの動詞でも当たってしまいます。
        - 解釈としては、ルールの中身は正しいものの、それを書いて確かめる仕組みが欠けている、という状態です。

        **ほかに分かったこと**
        - 見本として足した「後の状態だけを書く動詞」が、法則とは関係のない別の検査（placed_deduced）で落ちました。見本の作り方の誤りです。判定は変わらないので、PR に書いてあります。

        **次の仮説**
        - 新しい仮説 `h_post_as_fact`（未検証）を同じ PR で登録しました。中身は「検査器が post も pre と同じように事実に訳せば、この法則で片側だけの動詞を拒める」です。
        - ロードマップの決定 d_cscl_display_derived に結んであります。
        - 確かめるには検査器を変えるので、別の PR で手で見てもらう予定です。

        **あなたのマージ待ち**
        - #387、#394、#395 に、今回の #396 が加わりました。
