        d_road_region を続けます。次は、すでに登録してある h_genus_region_immune_display（#770）を確かめに入りました。PR は #779（Draft）で、事前登録の commit は済み、測定を走らせています。

        あなたの幾何の読み x ≈ g（類）+ s（字面）+ c（文脈）を、正面から試す形にしました。

        - **何を替えるか:** #364 と同じ 120 語の字面を、別の書き方に替えます。
          - 漢字とカタカナはひらがなに、ひらがなはカタカナにします。
          - 例: 犬→いぬ、ライオン→らいおん、りんご→リンゴ。
        - **主な問い:** 「犬」と「ねこ」のように、元の字面と書き替えた字面をまたいで中点をとります。その中点が、同じ類の成員に落ちるかを見ます。
          - g が成り立つなら、字面をまたいでも区画は保たれるはずです。
          - s が支配するなら、中点は同じ書き方の語に引っぱられて、区画を外れるはずです。
        - **判定（層 8）:**
          - 支持: 書き替えだけでも、混ぜても区画が保たれ、元からの落ち込みが 0.15 以下。
          - 反証: 混ぜたときに区画が保たれない、または落ち込みが 0.3 以上。
          - それ以外: 判定しない。

        限界も二つあります。

        - 確かめるのは書き方の替えだけで、同義語への言い替えは測りません。
        - ひらがなにするとトークンが細かく分かれるので、字面の効きとトークンの数の効きは分けられません。

        9 分後に進みを見ます。

