      text: |
        **目的**
        設計の揺れ（概念の混同）を排除し、重みに頼らない長期記憶を持つこと。LLMは状態を持たない解釈器で、記憶は外部の概念体系が担う。

        **構成**
        1. **意図の解釈**：LLMが人間の意図を概念式に変換し、人間と合意する
        2. **概念式の体系**：制御自然言語で記述する。抽象は抽象のまま上位概念として整理し、具体は修飾の合成で定義する（類種差）。同音異義は許さず、正規形で同一性が決まる
        3. **用語サーバー**：概念の正規化と同一性解決を担う
        4. **型付きグラフ（永続層）**：概念間の関係に加え、分化と精緻化の系譜、版、置換関係を持つ。修飾の役割は運用しながら増え、変更は多発する前提
        5. **実装生成**：概念式からLLMが実装とテストを生成する
        6. **検証**：生成前の参照検証（語が現行の概念に解決できるか）、生成後の語彙リント、テストによる接地と回帰検出

        **位置づけ**
        人間の記憶で言えば、第3層（外部化された形式定義）にあたり、LLMが持たない概念の発達史を外から供給します。

        と、いうアーキテクチャが必要になっていた。
        ここから先の課題を導いている。
