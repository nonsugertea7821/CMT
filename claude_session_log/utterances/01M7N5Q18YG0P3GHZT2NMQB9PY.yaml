    val:
      order: 1271
      text: |
        git の履歴で観察できました。今の語彙では「計算し直し」の 39 件がすべて pre で破れ、終点を版にずらすとすべて歩めます。手順は実行の前に登録してプッシュし（1afee2d）、結果を記録しました（e2e6660）。型検査・実行・世界・同期の検査はすべて通っています。

        **計画1からの変更**
        体系の YAML に個体を手で書き足すことはしませんでした。代わりに、git の履歴から個体を規則で作る形にしました。この方が、どの個体を足すかを私が選ばずに済みます。

        - **使った事実**：`results/` の結果ファイル（.json）が、足された・書き換えられた・名前を変えられたコミットの履歴です。
        - **ファイルの種類**：体系の語彙では `exp.result_file` です。これは計算の終点（passage_compute_to）の下にあります。
        - **2つの読み**
          - V（今の語彙のまま）：出来事ごとに `v_compute(計算したスクリプト, ファイル)`。スクリプトは結果の `_source` から取りました。
          - S（ずらした読み）：出来事ごとに、新しい版 c を計算し、そのあと `part(c, ファイル)` を述べます。R を part にしたのは、体系が版の種類（row_collection）を「結果ファイルの部分」と定義しているからで、私が選んだものではありません。

        **結果**（計算の出来事 138 件）

        | | 足す（A）99 件 | 計算し直す（M）39 件 |
        |---|---|---|
        | V（今の語彙） | 99/99 歩める | **0/39**（すべて pre の ¬exists(ファイル) で破れる） |
        | S（part でずらす） | 99/99 | **39/39** |

        結果ファイル 99 のうち、13 が少なくとも1回計算し直されていました。

        **読み取れること**
        - 混同の定義の形が、実際のデータで1つ現れました。
          - v = 計算する、p = 終点、b = ファイル、c = 版、R = part です。
          - 「ファイルを計算する」は、実際には「版を計算して、それがファイルの部分になる」（v∘part）でした。
        - 破れが見えるのは、計算し直しがあるときだけです。1回しか計算されないファイルでは、2つの読みは区別できません。
        - 設計の側の programming_language と同じ構造が、計算の側にもありました。

        **弱いところ**
        - 結果は、作りからほぼ決まります。ファイルが在れば pre は破れ、版は毎回新しいので S は破れません。経験的な中身は、計算し直しが実際に 39 件あったことです。
        - S は、ファイルそのものを何が作るのかを述べていません。ファイルは A の時点で在るものとして宣言しただけです。
        - R を part にしたのは体系の定義に従ったためで、refer や depend と比べて確かめてはいません。実行器は R の種類に関わらず歩めるので、R の違いはこの方法では区別できません。

        **次の候補**
        1. 混同を検出する法則を書く。候補は「同じ位置に置いた個体について、F が成り立たない歩みがあり、R でずらすと成り立つ」もので、実行器の検査として書けます。
        2. 語彙を直す。結果ファイルを計算の終点から外し、版を終点にします。設計の側も、設計書を終点、作るものを refer の相手にします。
        3. 設計の側にも個体の事実の出どころを探す。

        どれから進めるか指示してください。
