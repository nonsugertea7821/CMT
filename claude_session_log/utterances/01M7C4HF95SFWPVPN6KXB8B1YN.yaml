        その読みは一部当たっていると思いますが、今のデータでは「文脈が長いこと」そのものが原因とは言えません。切り分けが必要なので、測定を先に入れます。

        ## 今のデータが示していること（Qwen3-4B）

        | 条件 | 再定義で衝突する設問 | 新しい語（分化・置換） |
        |---|---|---|
        | 定義文を直前に置く | 0.75 | 1.00 |
        | 用語集（55定義、約1400トークン） | 0.46 | 1.00 |
        | 用語集＋無関係な文章 約500トークン | 0.46 | 1.00 |
        | 用語集＋無関係な文章 約2000トークン | 0.50 | 1.00 |

        - **無関係な文章を足して文脈を長くしても、それ以上は落ちていません。** 長さや距離だけが原因なら、2000トークン足したときにさらに下がるはずです。
        - **落ちるのは再定義だけです。** 新しい語は同じ長さの文脈で 1.00 のままです。

        したがって、より正確には「元の意味と競合する定義は、設問から離れたり他の定義に埋もれたりすると効かなくなる。競合のない定義は効き続ける」と言えます。文脈全体の長さより、定義という信号の弱さと置かれ方の掛け算に見えます。

        ## ただし、切り分けはできていない

        「直前に置く」と「用語集」の間では、次の3つが同時に変わっています。

        1. **定義の数**: 1個 対 55個
        2. **設問からの距離**: 0 対 約1400トークン
        3. **置き場所**: 利用者の発話の中 対 システムプロンプト

        どれが効いているのかは分かりません。また、試した文脈は最大で約3500トークンです。実際の作業で使う数万〜数十万トークンの規模については、何も言えません。あなたの懸念がその規模の話であれば、否定する材料はありません。

        ## 測定を入れます

        再定義で衝突する設問について、3つの要因を1つずつ動かします。

        - **置き場所だけ変える**: 関係する定義だけをシステムプロンプトに置く。
        - **距離だけ変える**: その後ろに無関係な文章を 500、2000 トークン挟む。
        - **数だけ変える**: 用語集の大きさを 5、15、55 定義にする。
        - **用語集の中での位置を変える**: 関係する定義を、55定義の先頭に置く場合と末尾に置く場合。

        これは 4B モデルで行う必要があり、実行中の層の実験とはメモリの都合で同時に走らせられません。層の実験は始めて間もないので、いったん止めてこちらを先に回し、終わったら層の実験を自動で再開します。所要は2〜3時間の見込みです。
