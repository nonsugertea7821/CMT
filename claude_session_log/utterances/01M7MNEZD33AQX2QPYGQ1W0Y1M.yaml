        2. Key Technical Concepts

           **Statement semantics (implemented on claude/cscl, commit 970571b)**
           - A sentence has 3 readings:
             - true: no flag
             - false: `val: {truth: false}`
             - not stated: `neg: true`, matching the syntax `not` definition "否定（示されていない文を述べる文）"
           - The runtime state is a dict: sentence → stated truth.
           - UNSTATED is decidable from the record in every world.
           - The world gives a truth value only to unstated sentences: `WORLDS = {"closed_world": False, "world": None}`.
           - A post with neg retracts; a post with val false states false.
           - open_world was removed. Presuming `world` alone means open; closed_world = world + `val: {truth: false}`.

           **Truth-flip involution σ**
           - σ flips stated truths and flips readings (UNSTATED fixed).
           - It maps closed_world ↔ co-closed (default true, experimental only); `world` is self-dual.
           - Results: 24,300 reading checks with 0 mismatches; 360 mirrored steps with 0 mismatches.
           - Symmetry breaks:
             - No co-closed node exists.
             - Laws apply only to stated-true facts (`stated_true`).
             - Law negations are NAF: assume neg 43, require neg 5.
             - world_declared privileges closed world.
             - Mods: positive 398, negative 46. Of the 39 negated mod kinds, 26 are also used positively.
             - Few verbs have a classical-negation pair.

           **Quadrants (classified by each node's own definition)**
           - Rules:
             - 関係 = is_verb.
             - 真偽 = is_a sentence or world, or uses the truth axis.
             - 量 = is_a magnitude or value, or uses a number axis (count, amount, ratio, order).
             - 質 = non-verb with a positive own mod, or is_a quality, or a form/of node.
           - Counts (659 nodes, cscl state):
             - 質 338
             - 関係 116
             - 真偽・質 81
             - 質・量 65
             - 真偽 22
             - 真偽・質・量 3
             - none 34
           - The 34 "none" nodes are 2 roots (continuant, occurrent) plus 32 nodes whose own definition is only a negation. This is Kant's 制限性 (limitation). Examples: natural_language, syntax.form, syntax.val, runtime.halted, std.artifact, exp.new_word, hidden_word, genus_concept, single_pass, unseen_relation, subj.person, stock, business_day, weekday_day, etc.
           - Verbs never overlap other quadrants. 量 never appears alone.

           **Axes**
           - count / amount (source any), text / truth (source refer), ratio (source part), order (source after).

           **Base relations and their laws**
           - Base relations: exists, same, refer (axiom); depend, part, after, involve.
           - Laws:
             - part: transitive, antisymmetric.
             - after: transitive, asymmetric (requires `not after`).
             - depend and involve have the same law shape: `exists(x) ∧ R(x,y) ⇒ exists(y)`. They differ only in their signature: v_depend is from continuant; v_involve is from occurrent.
           - Signatures remain as the condition for a sentence to be statable.

           **Other**
           - Kant mapping: 量 = at.count / quant all; 質 = positive / neg / limitation; 関係 = depend etc.; 様相 = world / exists / require.
           - Model theory: true = existence of the tuple. The grammar comment "事実は動詞の個体" supports exists(fact).
           - Negation verbs pattern: v_not_X with holds neg plus `opposite`. v_immune (exp) has the same holds as v_not_depend (lang).

