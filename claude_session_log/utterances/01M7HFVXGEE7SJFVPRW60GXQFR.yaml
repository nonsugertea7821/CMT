      text: |
        「合わせる」に型を付けました。合わせられるのは「合わせられる情報」に属するものだけで、しかも同じ空間に属するものどうしだけです。検査（check_spec と run_spec）は通り、コミットして push 済みです（863746f）。

        ## 変えたこと

        - **ontology.yaml（core）:**
          - `summand`（合わせられる情報）を置きました。中身は「合わせるの始点になれる情報」という概念式で定義しています。
          - `v_sum` の始点・終点・新しくできるものを、continuant から `summand` に狭めました。
          - 法則 `sum_same_space` を足しました。合わせる二つと合わせてできたものは、同じ空間に属さなければなりません。ここで「空間」は、`summand` のすぐ下の種類のことです。
        - **exp.yaml:** 空間として `residual_vector`（残差の流れのベクトル、モデルに依存する）を置きました。層の出力（h を含む）、隠れ状態のずれ（v とその下位の概念ベクトル）、h′ をその下に付け替えています。
        - **check_spec:** 同じ空間かどうかを、種類どうしの事実と、限定「合わせて X になる」の両方で確かめます。

        ## 型の誤りをわざと入れて確かめたこと

        | 入れた誤り | 結果 |
        |---|---|
        | h と層を合わせる（事実） | 捕まりました。層は合わせられる情報でない、という型の誤りと、同じ空間でない、の両方が出ました |
        | h を別の空間のベクトル（語彙の上の点数）と合わせる | 捕まりました（同じ空間でない） |
        | 限定で、ずれを層と合わせる | 捕まりました（同じ空間でない） |

        いずれも確かめた後、spec は元に戻してあります。

        ## 型の細かさについて

        今の「空間」は、残差の流れ全体を1つとしています。そのため、E12 の専用トークンのベクトル（入力埋め込み、つまり層0）と、E3 の層8のベクトルは、同じ空間として扱われます。次元は同じなので、足すこと自体は型として正しいです。

        ただ、E15 で見たとおり、層によって大きさの基準が違います（|h| の大きさ）。「同じ層でしか合わせない」ところまで型で守るなら、空間を層ごとに分ける必要があります。それには「どの層の出力か」を種類で表す必要があり、層の数だけ種類が増えます。今の実験は層を固定して足しているので、そこまでは要らないと判断して止めています。
