      text: |
        リポジトリの README を読みました（docs のサイトや論文はまだ読んでいません）。

        **Griffith とは**
        - 論理ゲートの網を PyTorch で学習するライブラリです。元にしているのは、前に名前を挙げた Differentiable Logic Gate Networks（Petersen ら、2022）でした。
        - 各ニューロンは、重みつきの和ではなく、2・4・6 入力の表（LUT）です。
          - 学習中は、表を連続な混ぜ合わせとしてゆるめ、勾配を通します。
          - 評価のときは一番確からしい表に固めて、ビットの回路にします。README には「精度を落とさない」とあります。
          - 固めた回路は Verilog や VHDL に書き出せます。
        - 学習の規則は、通常の誤差逆伝播のほかに、作者たち独自の逆伝播を使わない規則（Akiho Propagation）などから選べます。
        - CUDA は要らず、CPU で動きます。ただ、CPU で学習にどれだけ時間がかかるかは、README には書かれていません。
        - 版は v0.1.0、ライセンスは Apache-2.0 です。

        **前の答えの訂正**
        言語モデルの実績はないと書きましたが、ありました。
        - 文字単位の言語モデル（LogicGPT）で、Tiny Shakespeare の検証パープレキシティが 13.31 です。比べる基準の数字は README に載っていません。
        - 日本語の感情分類（WRIME）で 82% です。

        どちらも作者が自分で報告した数字で、私は確かめていません。

        **このプロジェクトとの関係**
        - **#868 の案 3 の候補になります**: 案 3 は、概念式の文章だけで、小さいモデルを一から学習する案です。CPU で言語モデルまで学習できるなら、その道具になりえます。
        - **区画の測りは、そのままでは使えません**: 学習中の状態は連続ですが、固めた後の状態はビットです。どちらの状態で中点を取るのかを、決め直す必要があります。逆に言えば、内部がビットのモデルでも上位概念の区画が出るかは、それだけで面白い問いです。
        - **規模の差に注意が要ります**: 文字単位のごく小さいモデルなので、Qwen と同じ課題（4 つの使い方の設問）を解けるかは分かりません。#868 で組にした「同じ課題を正しく解けるか」（h_formal_taught_keeps_consistency）が、まさにそこを確かめる仮説です。

        案 3 で何を使うかは、#868 の仮説を確かめるときに、事前登録の段で決めて書きます。小さい Transformer と Griffith を並べて検討するつもりです。
