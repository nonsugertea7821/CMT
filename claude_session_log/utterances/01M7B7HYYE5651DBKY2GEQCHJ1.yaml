      text: |
        両方を進めるなら、**外部化を先に作り、それをモデル側を変えるための教師データの源にする**順序を勧めます。外部化は今の技術で作れますし、運用すると、モデル側の改良に必要なデータが副産物として溜まるからです。

        ## 外部化が生むデータ

        - **意図と概念式の合意済みの対**: 解釈の教師データになります。
        - **兄弟概念とその差異**: 区別を学ばせる対照例になります。
        - **分化・精緻化・置換の履歴**: 概念がどう発達するかの系列データです。
        - **参照検証やリントの失敗例**: モデルがどこで概念を混同するかの記録です。

        これらは通常のコーパスにはほとんど存在しません。

        ## モデル側の段階

        1. **重みを変えない段階**: 出力を制約して、語を出す前に概念の識別子を確定させます。外部化の第1層と第6層がこれに当たります。
        2. **追加学習の段階**: 概念の識別子を語彙に加え、上のデータで「解釈して識別子に束縛する」「兄弟との差異を言う」ことを学習させます。
        3. **構造を変える段階**: 概念を確定する離散的な工程をモデルの中に持たせ、表現を「親＋差分」の形にし、グラフを読み書きする記憶として接続します。

        ## 内と外の分担

        | 置き場所 | 担うもの | 理由 |
        |---|---|---|
        | 外部（恒久） | 同一性の正本、系譜、版、合意 | 共有と監査が必要 |
        | モデル側（段階的に移す） | 区別する能力、概念から語を選ぶ対応、正本に束縛する工程 | 毎回テキストで読ませる方式では曖昧さが残る |

        系譜の記憶だけは、モデル側に移しても重みが履歴を上書きする問題が残ります。ここは外に置いたまま、モデルにはそれを読む能力を持たせるのが現実的だと考えます。

        ## 設計上の要点

        段階が進んでも変わらないのは、両者の接点である**概念の識別子・正規形・系譜の形式**です。ここを最初に固めておけば、モデル側が何を内部化しても外部の体系は作り直さずに済みます。逆にここが揺れると、溜めたデータが段階をまたいで使えなくなります。

        したがって最初に着手すべきは、正規形と識別子の仕様だと考えます。
