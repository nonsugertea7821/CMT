      text: |
        2つとも仮説として登録し、PR #474 にまとめました。概念は足さず、仮説と確かめる残り項目を足しただけなので、自動マージの条件に入ります。main に入ると仮説ごとに issue が立ちます。手元で体系の検査（ec と tc）は通しました。PR は見張りに入れ、あなたを assignee にしてあります。

        **1. 再定義と凸な領域（`h_convex_prior_resists_redefinition`）**
        - 式: 元の意味の領域が凸であるほど、再定義への追従は下がる。凸の度合いは「中点が成員に落ちる度合い」で測ります。
        - 範囲: 一般語に限りました。新しい語には元の意味がないので、引力が働きようがないからです。
        - 既存の仮説との関係: 「元の意味とぶつかると追従が下がる」はすでに支持されています。今回はそれを一歩進めて、ぶつかる強さが領域の形で決まるかを問います。
        - ロードマップ: 領域の道（`d_road_region`）の根拠に結びました。

        **2. ベクトルは式で表せる（`h_vector_from_expression`）**
        - 式: 概念ベクトルは、その概念の式と一致する。
        - 既存の仮説との関係: E32 で支持されたのは、ベクトルの「固有成分」が式と一致するところまでです。今回はベクトル全体に広げました。
        - 予想: 共通成分は多くの語が共有する慣習の部分で、式に書かれていない可能性があります。そのため全体では一致が弱まるかもしれません。この見通しは PR の本文に書きました。
        - ロードマップ: 表せるなら、式を書くことがそのままベクトルを決めることになります。そこで「設計が再定義の成功を上げる」という最終目標（`d_goal`）の根拠に結びました。

        2つは裏表の関係です。2が全体でも成り立てば、1の引力も式で書けることになります。成り立たず、共通成分で外れるなら、その外れた部分が「式から導けない慣習」の置き場だという読みになります。
