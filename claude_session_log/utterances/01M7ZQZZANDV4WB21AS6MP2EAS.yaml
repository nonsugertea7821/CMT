            chunks = [slice(0, n)] if not micro else [slice(i, min(i + micro, n)) for i in range(0, n, micro)]
            for _ in range(steps):
                opt.zero_grad(); total = 0.0
                for s in chunks:
                    inj.delta = msk_b[s] * v.view(1, 1, -1)
                    logits = r.model(ids_b[s], attention_mask=att_b[s]).logits
                    k = logits.shape[0]
                    per_tok = F.cross_entropy(logits[:, :-1].reshape(-1, logits.shape[-1]), lab_b[s, 1:].reshape(-1), reduction="none").view(k, -1)
                    valid = (lab_b[s, 1:] != -100).float()
                    loss = ((per_tok * valid).sum(1) / valid.sum(1)).sum() / n
                    loss.backward(); total += loss.item(); del logits, per_tok, loss
                opt.step(); losses.append(total)
            ```
