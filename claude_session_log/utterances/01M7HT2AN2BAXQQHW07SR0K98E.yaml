        観察値を CI で引っ張ってくる件、実装しました。issue の書き込みはいったん止めています。

        **観察値を CI で生成するようにした（claude/cross に push 済み、PR はまだ作っていません）**
        - `sync_issues.py` に「観察の値」の節を足しました。説明と定義の間に置き、各主張の支持・反証の観察について、体系の測定値を `値 < 値` の形で毎回書き直します。
        - この節はハッシュに入れていません。測定値だけが変わっても「説明が古い」は付きません。今のハッシュも変わらないので、既存の issue に誤って「説明が古い」が付くこともありません。
        - この節がない古い本文には、apply のときに差し込みます。

        **定義を変えたとき同じ issue が更新されるか（気にしていた点）**
        - `test_sync_issues.py` で確かめ、spec の CI にも入れました。偽の GitHub に78件を作ってから定義を変えると、同じ issue（#1）が更新されます。説明は残り、「説明が古い」が付きます。
        - 観察の値も確かめました。節は1つのままで、値だけ変えても「説明が古い」は付きません。テストは通っています。
        - 例外が1つあります。主張の識別子を改名すると、別の issue が新しくできます。古い issue は「体系にない主張の issue」と表示されるだけで、自動では閉じません。

        **issue の進み具合**
        - 説明と経緯を書いたのは #5〜14、#16、#17 です。cscl 側（#60, #78〜82）も書いてあります。
        - ただし、書いた exp の issue は説明の中に観察値を直接書いています。このままマージして apply すると、値が二重に表示されます。直すには、説明の中の値を消して書き直します。
        - 残りの exp の issue（#15, #18〜59, #61〜77）の本文は新しい形で用意してあり、説明に値は入れていません。

        **順番の提案**
        1. PR（claude/cross → main）を作る
        2. マージする
        3. 残りを書き込み、値を書いてしまった issue も直す

        この順なら、書いた本文と CI が書く節が食い違いません。PR を作ってよいですか？

        **別件**
        - E19 と E3 の seed 再学習（バックグラウンドの job）は、時間の上限で止まっていました。結果は記録できていないので、やり直す必要があります。
