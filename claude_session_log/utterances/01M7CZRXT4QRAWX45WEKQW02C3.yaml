      text: |
        当たります。私は表示語だけの値を無くそうとして、分類そのものを消してしまっていました。数は値です。

        ## 何を取り違えていたか

        これまで「値」と呼んでいたものには、2種類が混ざっていました。

        | 種類 | 例 | 正体 |
        |---|---|---|
        | 値のふりをしていたもの | 固定されている、届ける、名前 | 動詞や名詞から作れる修飾語や実体。値ではなかった |
        | 本当の値 | 15億、8、「はい」 | それ以上は分解しない具体 |

        前者を無くしたのは正しかったのですが、その際に後者の置き場所まで無くしていました。今回の書き直しには、関係と修飾はありますが、分類がありません。

        ## 欠落の出方が、それを示していました

        28個の問題のうち、少なくとも 13個は「具体を置く場所がない」という同じ原因です。

        | 問題 | 件数 | 欠けていたもの |
        |---|---|---|
        | 数と個数 | 4 | 15億、段の数、本数 |
        | 選択肢や形式の中身 | 5 | 「はい」「いいえ」「正しい」「誤り」 |
        | 隣り合うことや正確な位置 | 3 | 直前（間が 0）、直後 |
        | 順序を入れ替えた2回 | 1 | 2 |

        別々の問題として並べましたが、分類が無いことの現れでした。

        ## 数は、どの軸の値か

        最初にいただいた定義「軸は関係を抽象として見たもの、値はその具体」に従うと、数は基礎の関係から出てきます。

        | 基礎の関係 | 抽象として見た軸 | 値 |
        |---|---|---|
        | 部分である | いくつの部分を持つか（個数） | 28、15億 |
        | 後ろにある | 何番目にあるか（順番） | 8、14 |

        個数と順番という2種類の数が、2つの基礎の関係にそれぞれ対応します。「直前」は、順番の差が 1 であること、「用語集の先頭」は順番が最初であること、として書けます。前回、数量化（1つ、複数、すべて）を論理の結合子として扱いましたが、これも個数の軸の値を粗く言ったものだと整理できます。

        ## 比較も、同じ道具で書けるかもしれません

        もう1つの大きな欠落は「衝突する事例」でした。定義による判定と、元の意味による判定が食い違う事例です。

        これは「同じ軸の上で、値が違う」と書けます。判定という軸があり、定義に従った場合の値と、元の意味に従った場合の値が異なる。一致するとは値が同じであること、衝突するとは値が違うこと、です。2つのものを比べるには、両者が同じ軸に載っている必要があり、それを与えるのが分類です。

        そうだとすると、分類は「具体を置く場所」であるだけでなく、「比べることを可能にするもの」でもあります。

        ## 3つが揃う

        - **関係**: 状態の関係と、その変化としての動詞。
        - **修飾**: 関係のある位置を占めるものへの限定。
        - **分類**: 関係を軸として見て、具体を値として置く。比較の土台。

        今回の書き直しは、このうち2つしか使っていませんでした。

        ## 次の手

        書き直しに分類を加えて、同じ検査にかけます。28個の問題のうち何個が解けるかを数えます。上の見立てが正しければ、数・選択肢の中身・正確な位置・比較の 15個前後が解け、残るのは役割の中身、動詞の産物、概念式の中での位置などになるはずです。
