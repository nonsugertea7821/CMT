      order: 1664
      text: |
        **シグネチャはアフィン空間そのものではなく、その一段下の「点の集まりと、同じかどうかだけ」に当たると思います。** 点と変位の区別（w）も、順序も、まだ入っていない層です。そのうえで、三つの語は次の役を持つと読めます。

        - **any**：何も条件を課さない「空間全体」。w もまだ決めていません。
        - **self**：基点（原点）を選ぶこと。
        - **same**：同一性。どんな変換でも保たれる唯一の関係です。

        ## 1. 今のシグネチャの中身

        `signature.yaml` にあるのは三つだけです。

        | 語 | 種別 | 定義 |
        |---|---|---|
        | same | 基礎の関係（項数 2） | 同じである |
        | any | ノード（many: true） | 何でも。自分が動く範囲そのもの。何も限定しない |
        | self | 個体（変数） | 自分 |

        ## 2. Erlangen の見方：幾何は「保たれるもの」で決まる

        Klein の Erlangen プログラムは、幾何を「変換の群」と「その変換で変わらない性質」の組として整理しました。群が大きいほど、保たれる性質は少なくなります。

        | 幾何 | 許す変換 | 保たれる性質 |
        |---|---|---|
        | ユークリッド | 回転・平行移動 | 距離、角度、平行、点と点の同一性 |
        | アフィン | 上に加えて、引き伸ばし・せん断 | 平行、直線上の比、点とベクトルの区別、点と点の同一性 |
        | 集合（最も粗い） | どんな一対一の対応でもよい | 点と点の同一性（同じか違うか）だけ |

        例で言うと、正方形をせん断すると平行四辺形になります。角度は保たれませんが、平行は保たれます。これがアフィンです。さらに点をばらばらに並べ替えてもよいとすると、平行も直線も崩れ、残るのは「この点とこの点は同じか」だけです。

        **シグネチャは、この一番下の段に当たります。** same だけが基礎の関係なのは、どんな変換でも保たれる唯一の関係だから、と読めます。
        - part、after、depend などは ontology の基礎の関係で、群を狭めて構造を足したもの（アフィンやそれ以上）に当たります。
        - 今日足した above も同じです。順序なので、順序を保つ変換でしか保たれません。シグネチャではなく syntax の基礎に置いたのは、この見方と合っています。

        ## 3. any：条件のない空間全体

        any は、類比の中で二つの顔を持ちます。

        **(a) 座標の値としての any は「その方向には何も言っていない」です。**
        - 例：限定 `{of: [v_refer, from], with: any}` は、「何かについて述べる」とだけ言い、何についてかは決めていません。
        - アフィンで言えば、その座標は自由な媒介変数のままです。平面で x = 2 だけを決め、y を any にすると、点ではなく縦の直線になります。

        **(b) 概念は点というより「条件で切り出した領域」です。**
        - 前回まで概念を点と言いましたが、包含で順序を決めている以上、正確には領域（平坦な部分空間や錐）です。
        - 限定が一つ増えるごとに、領域は狭くなります。

        | 条件 | 平面での領域 |
        |---|---|
        | なし（すべて any） | 平面全体 |
        | x = 2 | 直線 |
        | x = 2 かつ y = 3 | 点 |

        - 深い概念ほど条件が多く、領域が狭くなります。すべての座標が any の概念は、空間全体です。

        **斉次座標で書くと、any は「零の条件」です。**
        - 直線は ax + by + cw = 0 という条件で書けます。係数 (a, b, c) が条件の側（双対）です。
        - 係数がすべて 0 なら、条件は 0 = 0 になり、すべての点が満たします。any はこの零の条件に当たります。
        - 前に「any はゼロ」と言ったのは、この意味でした。点の側ではゼロでなく全体、条件の側ではゼロ、です。

        **any は w もまだ決めていません。** ここが今日の話に一番効くところです。
        - 斉次座標の空間全体 (x, y, w) には、w = 1 の点も w = 0 の方向も含まれます。
        - any が「自分が動く範囲そのもの」なら、それは持続体と生起体に分かれる前の全体です。
        - 最上位の continuant と occurrent は、この全体を w = 1 と w = 0 で切った切り口に当たります。
        - **シグネチャから最上位を導けなかった（`h_tops_derivable` の反証）のは、シグネチャ（any と same）が w を決める材料を持っていないから、と読めます。** w を決めるのは、フレームをまたいだ情報（D2）で、それはシグネチャの外にあります。
        - 動詞の `from: any, to: any` は、どちらの切り口のものも受け付ける、という意味になります。

        ## 4. self：基点を選ぶこと

        - アフィン空間には、特別な原点がありません。どの点を原点に選んでもかまいません。
        - 一点 O を選ぶと、各点 X を差 X − O（ベクトル）で表せるようになります。アフィン空間がベクトル空間になります。
        - 体系の限定 λself. v(self, X) は、定義される概念自身（self）を基点にして、ほかの概念 X との関係で位置を書いています。**self は、各定義が自分のところに原点を置くための変数**です。
        - アフィン幾何の重心座標（ほかの点の重み付きの組み合わせで点の場所を書く方法）が近い形です。原点に頼らず、ほかの点との関係だけで位置を決めます。

        ## 5. same：同一性と、否定の限定

        - same は「同じ点か」を決める関係です。2 の表のとおり、どの幾何でも保たれます。
        - 否定の限定（`h_neg_not_self` で支持済み）は、「self は S のどれとも same でない」と書けました。幾何で言えば、領域 S の**補集合**です。補集合を作るには same（同じかどうか）だけで足り、順序や w は要りません。否定がシグネチャの語だけで書けたのは、この層の操作だからだと読めます。

        ## 6. まとめ

        | シグネチャ | 類比 | 幾何の層 |
        |---|---|---|
        | same | 点の同一性（どの変換でも保たれる） | 集合 |
        | any | 条件のない空間全体（零の条件）。w もまだ決まっていない | 斉次座標の全体（w で切る前） |
        | self | 各定義の基点（局所の原点） | アフィンからベクトル空間を作る操作 |
        | 否定（same と self で書く） | 補集合 | 集合 |
        | （シグネチャにないもの）w | 持続体と生起体の区別 | アフィン：ontology の最上位とフレーム |
        | （シグネチャにないもの）above | 包含の順序 | 順序の構造：syntax の基礎 |

        これは私の解釈で、どれも測っていません。特に次の二つは、類比として筋が通るというだけです。
        - any を「w を決めていない全体」と読むこと
        - `h_tops_derivable` の反証を「シグネチャが w の材料を持たない」ことで説明すること

        体系の数で確かめたいなら、まず仮説として登録します。
