      text: |
        大半は今の体系で書けます。ただ、決定的に足りない語が1つあります。

        **解釈を書く形は、すでにある**
        claims は、解釈を仮説として書く形をもう持っています。例は `h_tops_derivable` です。
        - 中身は `v_refer` で書きます: `{is: v_depend, from: top_placement, to: signature_class}`。
        - 状態は種類で表します: `hyp_untested` / `hyp_supported` / `hyp_refuted`。
        - 観察とのつながりは `v_support` / `v_contradict` で書きます。
        - 決定の根拠は `v_ground` で書きます。

        claims のコメント 277 行をこの形に当てはめると、次のように分かれます。

        | コメントの中身 | 書く先 |
        |---|---|
        | 結果の数値 | 観察の事実（`o_* v_level ...`）。ほとんどはもう書いてあり、コメントは重複 |
        | 「h_xxx の語」という見出し | 不要。その語が仮説の中身に出てくることから導ける |
        | 手順・登録した commit・訂正 | 経緯なので git が持つ |
        | 「実行の後の読み（登録していない）」 | 仮説として書くはず。ここで詰まる（次の節） |

        **足りないもの: 観察から思いついた、という関係**
        `hyp_untested` は「支持する観察も、反する観察も持たない仮説」と式で定義されています（exp.yaml:299, 302）。そのため、「この観察を見て、こう読んだ」を `v_support` で書くと、その仮説は未検証でなくなってしまいます。

        これは型の誤りではなく、方法として正しい制約です。データを見てから作った読みを、同じデータで支持されたことにしてはいけないからです。

        ですが「観察 X から着想した（支持ではない）」を言う動詞がありません。示唆・着想に当たる語は、ライブラリにも exp にもありませんでした。だから今まで、読みはコメントに逃げていたのだと思います。

        **もう1つの弱点: 中身の語が薄い**
        `top_placement`（quality, `mod: refer_from_occurrent`）のような仮説ごとの語は、式がほとんど空で、意味は display に寄っています。形は書けても、中身が display 頼みになるので、前に見た「薄い概念」と同じ問題が残ります。

        **提案**
        1. 動詞を1つ足します。仮の名前は `v_suggest`（観察 → 仮説、着想した）で、`v_agree` の下には置きません。支持にならないので、`hyp_untested` のまま書けます。言語の設計の決定なので、足してよいか確認させてください。
        2. 試しに、claims の「読み」3つ程度をこの形で書いてみます。たとえば「一つの after が時間・大小・並びの3つに使われている」や「深さ 0 だけが 30%」です。
           - 確かめること: 既存の語だけで中身が書けるか、新しい語が要るか、型検査が通るか。
           - 手順は事前登録します。

        この2つの結果で、claims のコメントを消すだけで済むのか、書き移してから消すのかが決まります。
