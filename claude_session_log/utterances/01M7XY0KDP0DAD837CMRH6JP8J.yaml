      text: |
        std の偏りを測りました。事前に決めた判定では、h_std_exp_biased は反証です。PR #594 の Draft を外し、確認を待っています。

        **結果**
        - exp に移せるノードは 28 のうち 12（0.43）で、判定の線の 0.5 に届きませんでした。
          - 移るのは、実験・実験の取り決め・仮説・適用範囲・学習する・動かす、と、それらから作った限定の語です。
        - 法則の個体 38 と facts 147 は、一つも移りません。

        **std に残るもの**
        - 種類としての部分と依存の法則、閉集合の法則。
        - 合成と閉集合の語: v_sum、v_close、summand、closed_set。
        - 機械学習の語が 12 残りました: model、weights、v_compute、v_freeze、artifact など。

        **機械学習の語が残った理由**（ここは解釈です）
        1. lang の主張が compose_from_model と artifact を使っています。compose_from_model は model を参照するので、model と、model がたどる語も std に残ります。
        2. どこからも使われていない model_inference が model を参照しています。今回の手順では、そのせいで model が「exp だけのためにある」と判定されません。使い手のない語をどう扱うかを、事前に決めていませんでした。数え直しはしていません。

        「std は偏っていない」とは言えません。言えるのは次のことまでです。
        - exp のためだけにある語は半分未満です。
        - 機械学習の語は、lang の主張と std の中の参照でつながったまま残っています。

        std の本当の中身は、法則と合成・閉集合の語と考えてよさそうです。基礎語彙を足すときは、この部分を土台にするのが自然だと思います。

