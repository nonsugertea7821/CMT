      text: |
        A の準備で、記録の作り方を決める前に問題が1つ見つかりました。まだ何も書いておらず、記録もコミットもしていません。

        **問題：実行の記録では、F が成り立つかを私たちが決めてしまう**
        - 実行器は pre・post をそのまま強制します。新しい名前 b で v_design(…, to = b) と書けば、b は在るようになり、F は成り立ちます。
        - F が破れるのは、b がすでに在るときだけです（pre の ¬exists(b) が偽になる）。
        - ところが「b がすでに在るか」は、記録の最初の facts に私たちが書くことです。混同が見つかるかどうかを、私たちが前もって決めてしまうので、観察になりません。

        **体系の中の個体も足りません**
        設計・計算の終点の種類に属する個体は、this_design（本設計）の1つだけです。プログラミング言語、実験の取り決め、層の出力、型検査の結果の個体は0です。

        **提案：在るかどうかを、このリポジトリの git の履歴から取る**
        私たちが決めずに済む、外の事実はこれしかありません。ファイルやノードが最初に現れたコミットを「在るようになった時点」とし、その順にフレームを作ります。

        使えそうな出来事：
        - **CSCL（syntax.cscl、言語）**：最初の仕様ファイルのコミットで在るようになる。そのあとも、設計の決定（d_cscl_* など）が何度も足されている。
        - **本設計（this_design）と、それを部分に持つ決定**：決定ごとに、最初に現れたコミットがある。
        - **型検査の結果**：型検査器を走らせるたびに新しくできる。

        観察のやり方：
        - 体系の今の語彙のとおりに書いた歩み（例：言語を設計の終点に置く「v_design(人, cscl)」）を、履歴の順に実行し、F が破れる歩みを数える。
        - 破れた歩みのそれぞれで、位置を R（refer・depend・part）に沿ってずらすと F が成り立つか（例：新しい決定 d を終点にして、d が cscl について述べる、または cscl の部分になる）を数える。

        **この方法の限界**
        - 履歴のどの出来事を、どの動詞の歩みとして書くかの対応づけは、私が決めます。そこで、対応づけの規則を結果を見る前に登録して固定します。
        - 「言語を設計の終点に置く」読みは、決定が足されるたびに pre が破れることがほぼ見込まれます。記録の目的は、どの歩みで破れて、どの R でずらすと直るかを残すことにあります。

        この「git の履歴から在るようになった時点を取る」形で登録まで進めてよいか、指示してください。
