      text: |
        exists と not exists を軸に、肯定の記述と否定の記述が対称かどうかを、体系を数え、実行器を実際に動かして確かめました。体系は何も変えていません。結論から言うと、閉世界では効果の上で対称、開世界では非対称です。開世界では「在らない」を示す手段がありません。

        **1. 数えた結果（基礎の関係の原子、+ は肯定、− は否定）**

        | 関係 | holds | pre | post | 法則の前提 | 法則が求める文 |
        |---|---|---|---|---|---|
        | exists | +2 −0 | +1 −9 | +9 −1 | +6 −0 | +2 −0 |
        | depend | +20 −3 | +3 −1 | +7 −2 | +1 −0 | +0 −0 |
        | part | +7 −0 | +2 −2 | +3 −2 | +4 −0 | +0 −0 |
        | after | +10 −8 | +0 −0 | +1 −0 | +3 −0 | 求めない文 −1 |
        | same | 0 | 0 | 0 | +0 −3 | +6 −2 |

        - exists の否定は、動的な動詞の pre と post にしか出てきません。
        - exists を使う動的な動詞は10個あります。
          - 9個は作る動詞で、pre が「在らない」、post が「在る」です（v_design、v_learn、v_execute など）。
          - 壊す動詞は v_freeze の1個だけで、pre が「在る」、post が「在らない」です。
        - 静的な記述（holds）と法則は、「在る」しか述べません。

        **2. 実行器の作り（runtime.py）**
        - 状態は、肯定の文の集まりだけを持ちます。否定の文を入れる場所はありません。
        - 最初の状態に否定を書くと、誤りになります（「否定は『示されていない』」）。
        - post の否定は「在らない」を書き込むのではなく、肯定の文を消すだけです。
        - 書かれていない文の扱い:
          - 閉世界では偽です。
          - 開世界では不明（None）です。

        **3. 動かした結果（作る v_learn → 壊す v_freeze → もう一度作る）**
        - **閉世界:** 学習すると在る、固定すると在らない、もう一度学習できる、の順に進みます。効果の上では対称です。
        - **開世界:**
          - 作る動詞は一度も動けません。pre の「在らない」は、開世界では示せないからです。
          - 壊したあとの exists(k) は「不明」です。「在らない」にはなりません。
          - 否定の記述は、開世界では書けず、導けもしません。肯定の記述だけが積み上がる非対称になっています。

        **4. ほかに見つけたこと**
        - **在らないものの関係が残る:** 閉世界で k を壊しても、depend(k, a) は真のまま残ります。法則 depend_end_exists は「依存する側が在れば、依存される側も在る」という向きだけです。「在らないものは依存しない」という法則はありません。
        - **表示の小さな不具合:** 開世界で「決められない」と言うとき、肯定の文にも「not」を付けて表示しています（runtime.py の `unknown` を作る行）。

        **5. 対称にするなら**
        開世界の状態に、肯定の文の集まりと並べて、否定の文の集まりを持たせます。1つの文が「示された真」「示された偽」「示されていない」の3つのどれかになります。
        - post の否定は、否定の集まりに書き込むことになります。
        - pre の否定は、否定の集まりに文があるかで確かめます。
        - そうすると「在らない」が示せるようになり、作る動詞も開世界で動けます。

        ただし、そうすると neg に2つの意味が生まれます。「示されていない」（今の neg）と「偽であると示された」（古典否定）です。この2つを書き分ける必要があります。

        古典否定を状態に持てるようになれば、すべての動詞の古典否定が、動詞を1つずつ定義しなくても書けます。前におっしゃった「全ての動詞は古典否定を対に持つ」は、この形で成り立ちます。

        この先は、5 の形（否定の集まりを持たせる）を設計するか、まず 4 の「在らないものの関係」を法則として調べるか、どちらから進めるかを指示してください。
