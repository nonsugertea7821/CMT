      text: |
        意図の正本を形式的な記述に移し、機械で検査できるようにしました。これ以降、結果や設計判断は文章ではなく `spec/` に書き、尋ねられたらそこから日本語に訳します。

        ## 構成

        | ファイル | 内容 | 件数 |
        |---|---|---|
        | `spec/terms.yaml` | 語彙。各語は識別子、表示語、上位の語と種差（類種差）を持つ。上位を持たない語には説明を付ける | 語 101、述語 18 |
        | `spec/measurements.yaml` | 測定値の定義。どの結果ファイルのどの条件から、どの統計量を計算するか | 測定値 332 |
        | `spec/claims.yaml` | 観察、仮説、決定、残り項目 | 観察 58、仮説 32、決定 15、残り 15 |
        | `tools/check_spec.py` | 検査と値の計算 | — |

        ## 揺れを防ぐ仕組み

        - **同音異義を許さない。** 表示語が重複すると検査が失敗します。
        - **未定義の語を使えない。** 観察・仮説・決定に現れる語は、すべて語彙に解決できなければ失敗します。
        - **数値を手で書かない。** 測定値は結果ファイルから毎回計算します。観察は「測定値Aは測定値Bより大きい」のような関係として書き、成り立たなければ検査が失敗します。
        - **仮説は「主語・述語・目的語」の三つ組で書く。** 適用範囲、状態（支持／部分的に支持／反証／未検証）、根拠となる観察、置き換えた旧仮説を持ちます。根拠のない仮説を「支持」にはできません。
        - **決定は取り下げても消さない。** 「一般語の再定義を避ける」は、取り下げた決定として残り、置き換えた決定から参照されています。

        検査が実際に効くことは、偽の観察と綴りを誤った語を入れて確認しました（どちらも検出され、戻すと成功）。

        ## 移行で分かったこと

        - これまで文章で報告した観察は、58件すべてが結果ファイルから再計算して成り立ちました。
        - 形式化できなかったものが2件あり、「未検証」として記録しました。
          - **ベクトルは理由の説明を変えない**: 出力を目で読んだ観察で、数値がありません。
          - **定義文を文脈に置けば定義の言い換えを 0.96 で選べる**: その場で測っただけで、結果ファイルに保存していませんでした。測り直して保存する項目を残りに加えました。

        ## 文章の扱い

        - `docs/design.md` と `experiments/README.md` は、冒頭に「正本ではない。凍結した」と明記し、今後は更新しません。
        - 1時間ごとの継続確認の指示も、`spec/` を見て `spec/` に書く内容に改めました。

        ## 判断を仰ぎたい点

        記法は、私が最小限のものを決めました（YAML の型付き記録と、固定した述語の集合）。あなたの側には既に概念式の体系があるはずなので、その記法に合わせる方がよければ、文法を教えてください。変換します。

        ## 使い方

        ```
        python tools/check_spec.py                  # 検査
        python tools/check_spec.py --values         # 測定値をすべて表示
        python tools/check_spec.py --show <識別子>   # 1項目を、参照を展開して表示
        ```

        実験（E8、続いて E9）は並行して動いています。結果が出たら `spec/` に追加します。
