      text: |
        ## 一言で

        **種類について、性質を下位に受け継がせずに述べられるようになります。** 今の体系で種類に付けられる性質は、全部「成員みんなが持つ性質」です。下位の種類に自動で受け継がれます。メタクラスを入れると、もう一つの書き方が増えます。「この種類（集まり）そのものが持つ性質」で、下位には受け継がれません。

        ## 今と、入れた後

        **今（性質が下位に流れる）**
        ```
        合成可能集合
         └ 残差の流れのベクトル        ← 閉じている（正しい）
            ├ 層の出力                ← 閉じている（偽: h ⊕ v は h′ で、層の出力に戻らない）
            │  └ 隠れ状態              ← 閉じている（偽）
            └ 隠れ状態のずれ            ← 閉じている（v ⊕ v はずれ? 書いていない）
        ```
        「下位の種類も同じ性質を持つ」という一つの仕組みで、「成員の性質」と「集まりの性質」を両方扱っています。そのため、集まりの性質が下位に漏れます。今は、この漏れを「すぐ下の種類だけ」という位置の約束で止めています。

        **入れた後（二階建て）**
        ```
        1階（種類どうし。今と同じ）              2階（種類が成員になる）
         残差の流れのベクトル                     合成可能集合
          ├ 層の出力                               ∋ 残差の流れのベクトル   ← 個体として1つだけ
          │  └ 隠れ状態                            ∌ 層の出力（書かなければ、閉世界で偽）
          └ 隠れ状態のずれ
        ```
        ```yaml
        residual_space: {is: composable_set, of_kind: residual_vector}   # 「残差の流れのベクトル」は合成可能集合の一つ
        ```

        ## 何が導けるようになるか

        1. **閉じていることが、宣言ではなく検査になります。** 「S は合成可能集合」と書くと、S の成員どうしの合成した結果も S に入っていることが求められます。今ある事実 h′ = h ⊕ v の場合、h と v と h′ がすべて「残差の流れのベクトル」の下にあることを確かめます。入っていなければエラーです。位置の約束は要らなくなります。
        2. **「同じ集合でしか合成できない」が定理になります。** 型の法則 sum_same_space は、閉じていることから導かれる帰結になり、検査に手で書く法則ではなくなります。
        3. **同じ要領で、ほかの集まりの性質も書けます。** 例えば次のようなものです。
           - 「この族の測定値は、すべて同じ尺度」
           - 「層ごとの状態の集まりは28個」（今は `at: count` で書いている特殊な書き方）
           - 「概念ベクトルの集まりの平均が共通成分 m」。E16 の m は、本来、成員一つ一つではなく集まりの性質です。今は「概念ベクトルの共通成分」という成員の種類として近似しています。
        4. **E15 の大きさの比も、集まりの性質として書けます。** 例えば「E3 のベクトルの集まりは、|h| の範囲に収まる」です。層ごとに合成可能集合を分ける話も、「層8の状態の集合」という個体として自然に書けます。種類を層の数だけ増やす必要はありません。

        ## 代わりに引き受けるもの

        - **階を混ぜない決まりが要ります。** 「自分自身を成員に持たない集合の集まり」のような循環を禁じます（ラッセルの逆理を避ける、型の階層）。検査には、1階と2階を混同していないかを見る仕事が増えます。
        - **書き方が二通りになります。** 新しい性質を書くたびに、成員の性質か集まりの性質かを決める必要があります。迷った場合の決め方は、「下位に受け継がれるか」で判定します。
        - **既存の spec は変わりません。** 今の書き方はすべて1階のままです。2階は、必要な所（合成可能集合、E16 の平均、層の集合）にだけ足します。
        - **検査は規則の評価が少し増えます。** 速くした後の今なら、問題にならない量のはずです。

        ## 判断の材料

        今の「すぐ下の種類」という約束でも、実用上は困っていません。入れる意味が大きいのは、次のような目標を持つ場合です。

        - 「集まりの性質」（平均、閉じていること、個数、尺度）を、実験の記録で正確に書きたい。
        - 前回の部分と全体の向きと同じように、約束ではなく定理で守りたい。

        E16 の「共通成分＝集まりの平均」は、今まさにこの近似で書いているものの一つです。入れる価値はあると私は考えています。
