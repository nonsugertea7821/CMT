      text: |
        語彙の全体（176個の概念）を、試験で固まった形で書き直せました。表示語だけの値は 0個になり、検査も通っています。ただし 28個（16%）は、内容の一部が書けていないか、無理のある書き方になっています。

        ## 結果

        | 項目 | 件数 |
        |---|---|
        | 基礎の関係 | 6（法則を持つ状態の関係 5、体系の行為 1） |
        | 動詞（静的） | 14 |
        | 動詞（動的） | 12 |
        | 動詞の下位（端の種類を狭めたもの） | 22 |
        | 修飾語 | 6 |
        | 修飾で書いた概念 | 120（持続体の側 106、生起体の側 14） |
        | 表示語だけの値 | 0 |

        修飾 153回のうち、始点の位置を占めるものが 95回、終点の位置が 58回でした。もう一方の端の固定は 128回、否定は 24回、数量化は 19回使っています。

        検査は、型の合わない修飾、式が同じ動詞、端を狭めていない下位、式が同じ概念を拒否します。わざと入れた4種類の誤りはすべて検出されました。

        ## 書けた例

        ```
        概念         = 推論のうち、語が引き起こすもの
        推論         = 過程のうち、モデルが行うもの
        使い方が共有する推論 = 概念のうち、すべての使い方の時間的な部分になるもの
        定義文の暗唱 = 使い方のうち、「定義文を発話する」を時間的な部分に持つもの
        適用         = 使い方のうち、「事例を判定する」を時間的な部分に持つもの
        文章での注入 = 「定義を届ける」のうち、文脈に関わるもの
        改名         = 文章での注入のうち、「置き換える」を時間的な部分に持つもの
        傾向性       = 実現可能体のうち、質に依存するもの
        役割         = 実現可能体のうち、質に依存しないもの
        大きさ       = 質のうち、他の質の後ろに置かれるもの（順序を持つ質）
        ```

        「概念＝語を使うときに走る推論」は、前回の試し書きでは書けませんでしたが、今回は「語が引き起こす推論」として書けました。「使い方が共有する推論」も、すべての使い方の部分である、と書けています。

        ## 書けなかった 28個の原因

        | 原因 | 件数 | 例 |
        |---|---|---|
        | 選択肢や形式の中身 | 5 | 「はい・いいえ」という選択肢、設問と答えの枠 |
        | 数と個数 | 4 | パラメータ数15億、段の数、同時に入れる本数 |
        | 役割の中身 | 4 | 正本、変更の固定先、要因、指標 |
        | 隣り合うことや正確な位置 | 3 | 設問の直前、語の直後 |
        | 動詞の産物 | 3 | 教示の産物としての概念ベクトル |
        | 2つの判定の比較 | 2 | 衝突する事例、衝突しない事例 |
        | 概念式の中での位置 | 2 | 修飾、上位概念 |
        | その他 | 5 | 様態（見る／読む）、兄弟であること、暦の計算、永続すること、順序を入れ替えた2回 |

        ## 読み取れること

        - **数が、はっきり欠けています。** 個数、番号、直前（間に何もない）、2回、15億。これらは別々の問題に見えますが、どれも数えることに関わります。「大きさ」を順序を持つ質として書けたので、入口はありますが、数そのものを置く仕組みがありません。
        - **この計画の中心にある概念が、書けていません。** 「衝突する事例」は、定義による判定と元の意味による判定が食い違う事例です。判定を2つ立てて比べる必要がありますが、いまの修飾は端を1つ固定することしかできません。実験の主題そのものなので、ここは重要な欠落です。
        - **役割は、担い手の条件としてしか書けませんでした。** 「正本」は、他のすべての記述に依存されるもの、と書きましたが、これは正本という役割ではなく、その役割を担うものの説明です。
        - **体系が自分自身を指す箇所で詰まります。** 「修飾」「上位概念」は、概念式の中での位置を指す語です。体系の部品を体系の中で書こうとすると、書けません。「について述べる」が解けなかったのと同じ形です。

        ## 対象外にしたもの

        仮説と決定で使う関係 17個（上げる、下げる、転移する など）と、測定条件を書くための数の軸 9本は、今回の書き直しに含めていません。前者は「質の大きさが変わること」として書けるはずですが、数の扱いが決まってからになります。

        ## 次の手

        欠落の中で最も影響が大きいのは、数と、2つのものの比較です。この2つは同じ道具で解ける可能性があります。順序を持つ質どうしの比較、です。次はここを調べます。

        記録は `spec/trial/full3.yaml` に置きました。正本（`spec/ontology.yaml`）はまだ前の形のままで、切り替えていません。
