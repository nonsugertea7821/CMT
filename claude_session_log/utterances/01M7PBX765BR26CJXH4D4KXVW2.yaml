      text: |
        PR #132 を取り込み、承認済みの手順1として cscl/library のコメント 76 行を消しました。どちらも claude/cross に push してあります。

        **main の取り込み（24bf4a9）**
        `.claude/settings.json` が衝突したので、claude/cross 側の版を採りました。session log の Stop hook と、コメント検査の hook 2つを含む版です。

        **コメントの削除（5624a51）**
        - **変わらなかったもの:** 5ファイルとも、yaml を読んだ結果は消す前と同じです。導いた事実は 231306 件で、前後のハッシュが一致しました。型検査の誤りは 0 です。
        - **消した文の残し方:** 差分に残っています。分類は commit メッセージに書きました。分類は私の判断です。式があることを実際に確かめたのは「a」だけです。

        | 分類 | 内容 |
        |---|---|
        | a. すでに式がある（確かめた） | 「在る」を same から導く、名前を付けた限定、閉世界、真偽の軸 |
        | b. 見出し・ファイルの説明 | 構造を示すだけのもの |
        | c. 経緯・観察・コードの説明 | 本来は commit や会話に書くもの |
        | d. 事実と食い違っていた | 1件。syntax の「区別は法則 truth_distinct が与える」。そんな法則はどこにも定義されていません |
        | e. 式化の候補（未確認） | 意味は定義に効くのに、式になっていないかもしれないもの |

        「e」には次のようなものがあります。
        - 説明文（gloss）を持つのは最上位の2つだけ
        - 個体は1つの種類にだけ属する
        - any は在らないものも含む
        - 種類の集まりの性質は、成員の下位の種類に受け継がれない
        - 実行の状態と体系の記述は完全に書かれている、という前提

        **解釈**
        コメントを消しても事実が1件も変わらないのは当然で、コメントが式に効いていなかったことの確認にすぎません。大事なのは「e」です。ここには、体系が守っているはずなのに式としては書かれていない約束が並んでいます。これを式にすれば、法則で検査できるようになります。

        **次の候補**
        - 手順2: exp/src のコメント 64 行。ほとんどが見出しです。
        - 「e」の式化: 一つずつ事前登録してから行います。たとえば「個体は1つの種類にだけ属する」は、法則として書きやすいはずです。

        どちらから進めますか？
