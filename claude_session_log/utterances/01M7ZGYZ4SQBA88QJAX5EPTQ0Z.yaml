      text: |
        型検査器の誤りの出し方を読み、E37 で今の版に退けられた 65 行について、最初の誤りの文の形を数えました。

        **分かったこと**
        - 誤りを記録する箇所は 111 か所あり、どれも自由な文を一つ積むだけです。
        - 「法則 X（…）に反する」と法則の名前を出すのは、法則（law_rule）を当てはめる箇所だけでした。
        - 65 行の最初の誤りの内訳は次のとおりです。

        | 誤りの形 | 行数 |
        |---|---|
        | 「X は動詞 X の X（X）に来られない」（動詞の端の型が合わない） | 30 |
        | 「X は動詞でない」 | 11 |
        | 「法則 X に反する」（法則の名前を出す） | 9 |
        | 検査器そのものが落ちた | 約 9 |
        | 「上位がない、または未定義」ほか | 残り |

        - つまり、法則の名前で出る誤りは 65 行のうち 9 行です。多くは名前のない文で出ています。「端に来られない」などは、意味を検査が与える法則（law_given）にあたる見込みがありますが、文の中で法則を名指ししていません。

        **手順のうえで開示すること**
        `h_error_kind_is_law` の事前登録より前に、測るつもりのデータを覗いてしまいました。このあと事前登録を書くときは、この覗き見と上の数を手順に書き添えます。判定は結果を見た後に決めたものになるので、自動マージには乗せず、手で見てもらいます。

        **含意（対の解き方）**
        1. 今の検査器では、誤りの種類は法則で与えられていない。そう読めば、`h_error_kind_is_law` は反証の向きです。
        2. 法則が足りないのではなく、検査器が法則の名前を出していないだけ、という読み方もできます。「意味を検査が与える法則（law_given）を、誤りの文で名指しすれば立つ」という形です。こちらは検査器を変える話なので、別の仮説として登録するのが筋です。

        どちらにするかは、事前登録を書くときに 1 と 2 を対で置いて決めます。E36 が走っている間は、事前登録のスクリプトを書くところまでにします。型検査器を何度も走らせる作業は、メモリの余りが少ないので E36 の後にします。

        ロードマップ上の位置: 検査器の道 d_road_checker の `h_error_kind_is_law` の下調べをしました。H2（d_metric の直下の E36）は 10/24 まで進んでいます。
