      text: |
        軸を座標の番号で探しても、見つからないと考えます。モデルの中の座標の基底には、元々特別な向きがないからです。軸は、何か外の基準で決めるものです。

        候補は下の4つを、未検証の仮説として登録の PR #652 に入れました。概念を4つ足すので、手で見ていただく PR です。

        **前提: 座標の番号に意味がないのはなぜか**
        - 残差の流れの空間は、全体を回転させて重みの側を逆に回しても、モデルの振る舞いは変わりません（LayerNorm などの例外はあります）。
        - そのため、「第 731 成分」という軸は、基準として特別なものではありません。
        - 先行研究の領域に入れた Park 2024（`pwc_park2024_linear_representation`）も、意味は成分ではなく方向にあり、方向を正しく比べるには内積の選び方（因果の内積）が要る、と述べています。

        **候補1: 出力の側から決める（h_part_named_by_output_word）**
        - モデルの最後には、「社内」「社外」のような語ごとに、その語を出すための向き（出力の埋め込み）があります。
        - 隠れ状態をその向きに射影すると、「この位置は『社内』をどれだけ言おうとしているか」が読めます。logit lens（nostalgebraist 2020）と tuned lens（Belrose ほか 2023）の考えです。
        - 体系と合う点は、軸に初めから語の名前が付いていることです。
        - 弱い点は、第8層のような途中の層では、出力の向きとずれやすいことです。tuned lens は、そのずれを層ごとの変換で補っています。

        **候補2: 隠れ状態の統計から決める（h_part_named_by_state_feature）**
        - 多くの文の隠れ状態を、「少数の向きの和」に分ける辞書を学習します（疎な自己符号化器。Bricken ほか 2023、Templeton ほか 2024）。
        - Elhage 2022（`pwc_elhage2022_superposition`）の「次元より多い特徴が重なっている」を、ほどく道具です。
        - 得られた特徴の向きは、成分の番号よりずっと単一の意味に近いと報告されています。
        - 弱い点は二つです。特徴の名前は後から付けるものになります。また、1.5B のモデル用の辞書を CPU で作るのは重いです。

        **候補3: 体系の式から決める（h_sibling_difference_on_part の基準）**
        - 丙票と丁票の式で違う部品は、限定の with（社内／社外）です。
        - 「社内だけで回す票」と「社外にも送る票」の文を多く作り、隠れ状態の平均の差を取れば、それが「この部品の向き」になります。差分の平均を向きとする方法で、Marks & Tegmark 2023 や Zou ほか 2023 の表現工学が使っています。
        - この方法の強みは、体系がすでに部品の名前を与えていることです。軸の名付けを後から推し量る必要がありません。
        - 過去の結果とも合います。E22 では、限定の差分ベクトル（下位 − 上位）が見たことのない上位概念へ移ることが支持されました（h_qualification_vector_transfers_to_unseen_genus）。差の向きに意味が乗る、という手掛かりはすでにあります。

        **候補4: E33 とのつながり（h_sibling_discrimination_on_part）**
        - 軸が決まれば、学習した v_丙 − v_丁 を、その部品の向きに射影できます。
        - 予想される形は、弁別が上がる組（組 3 など）では射影が大きく、余裕がほぼ 0 の組では射影がほぼ 0、というものです。
        - E33 はベクトルを保存していないので、これを確かめるには、ベクトルを保存する実験が別に要ります。

        先行研究の出典の多くは記憶から書いていて、まだ確かめていません。この中で一番体系らしいのは候補3です。軸の名前を、検査ではなく体系の式が与えるからです。

        本線 a 往復の教示の含意（d_consolidation_in_vector の下、PR #652）
