        ## 1. 象限ごとのノードの数

        分け方は、各ノードが自分で足した定義の形で決めました。継承した定義で分けると、特定依存持続体の `at: {count: 1}` が下位すべてを「量」にしてしまうからです。
        - **関係:** 動詞であること。
        - **真偽:** 文か世界の下位であること、または真偽の軸を使うこと。
        - **量:** 大きさか値の下位であること、または数の軸（count・amount・ratio・order）を使うこと。
        - **質:** 肯定の限定を足していること、または質の下位か、端の形であること。

        結果は次のとおりです（ノード 659、claude/cscl の状態）。

