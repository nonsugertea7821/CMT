      text: |
        それなら、私の進め方が誤っていました。あなたから定義を引き出そうとしていましたが、定義はまだ誰の手元にもなく、あるのは直観と、それを指し示す近い概念だけだということですね。私の役割は、その直観と矛盾しない構造を探して、具体例で確かめることだと捉え直します。

        ## これまでの言葉を、求める構造への制約として並べる

        1. 原始的なのは、持続と生起の最上位だけ。他はすべて、そこからの連鎖で書かれる。
        2. 関係は BFO の下にある実体で、グラフで結ばれる。
        3. 分類は関係を利用して記述される。軸は関係を抽象として見たもの、値はその具体。
        4. 持続体は形を変えると生起体になり、その逆もある。
        5. 修飾は第3の次元である。
        6. 関係・分類・修飾は、次元を変える操作である。次元そのものではない。
        7. 語は、修飾の連鎖でその振る舞いを定義している。

        ## 候補を1つ出します

        制約を満たす構造を1つ考えました。正しいと主張するものではなく、試すための候補です。

        **3つの次元は、「開いている端の数」の違いである。**

        | 次元 | 開いている端 | 例 |
        |---|---|---|
        | 生起 | 2つ | 書く（誰が、何で） |
        | 修飾 | 1つ | 自然言語で書かれた（何が） |
        | 持続 | 0 | 語 |

        **3つの操作は、端の数を変えながら次元を一巡させる。**

        | 操作 | 移動 | すること |
        |---|---|---|
        | 関係 | 持続 → 生起 | 物と物の間に、結び付きを立てる |
        | 修飾 | 生起 → 修飾 | 結び付きの一方の端を固定して、限定する働きにする |
        | 分類 | 修飾 → 持続 | 限定する働きを物に当てて、種類を切り出す |

        「書く」→「自然言語で書かれた」→「自然言語で書かれた語」が、この一巡です。

        ## 制約との照合

        - **3（分類は関係を利用する）**: 分類は、関係から修飾を経た先にあるので、関係なしには成り立ちません。軸は「一方の端を固定する前の関係」、値は「固定した端に入れた具体」になります。合います。
        - **4（形を変える）**: -er は「修飾してから分類する」の合成です（届ける → 届ける働きを持つ → 届けるもの）。-ing は関係の操作です。合います。
        - **5、6（修飾は次元であり、操作は次元を変える）**: 修飾は、端が1つ開いた状態という居場所であり、同時にそこへ移す操作の名前でもあります。同じ語が次元と操作の両方に現れる理由が説明できます。
        - **7（語は修飾の連鎖）**: 一巡を繰り返すたびに、限定が1つ積まれます。合います。
        - **1、2**: 矛盾はしませんが、この候補から積極的に導かれるわけではありません。

        ## 合わないかもしれない点

        - 端が3つ以上ある生起（誰が、何を、誰に）をどう扱うかが決まっていません。
        - 前回の 3×3 の表では、次元の間の移動は6方向ありました。この候補は一巡の3方向しか直接には持たず、逆向きは合成で作ることになります。それが直観に合うかは分かりません。

        ## 次にやること

        候補が直観に合うかどうかを、あなたの判断だけに頼らず確かめます。いまの語彙にある 137個の実体を、この3つの操作だけで書き直してみて、書けたもの、書けなかったもの、無理が出たものを数えます。書けないものが、候補の欠陥か、直観の中にまだ言葉になっていない部分を示すはずです。

        結果を持って報告します。この候補が明らかに直観と違う場合は、その時点で教えてください。
