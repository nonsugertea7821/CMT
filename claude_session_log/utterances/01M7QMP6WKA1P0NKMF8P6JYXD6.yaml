        2. Key Technical Concepts

        **tc gather** (cscl/bootstrap/type_checker/type_checker.py)
        - A reading formula (v_refer with a dict `to`) sets I[subj] s/p/o by assignment. A later v_refer of the same subject overwrites the earlier one; this is now confirmed.
        - The final multiplicity check exempts only "o" and "_at" from `many`, so a list in a formula's `from` (s) errors with "関係 s の事実が2つ以上ある".
        - T.many is the set of relation names whose end kind has `many: true`. It governs the number of facts per (subject, relation), with the subject on either side.
        - Top-level lists are read as one value: lists in from 113, lists in to 6, none on many relations.

        **exp_check.triple** (checks that ends are defined) is called only for hypotheses (line 236) and decisions (line 265).
        - Prior-work claims (pwc_) are not end-checked.
        - Observations are checked elsewhere; all o_ mutants were rejected.

        **Rule engine**
        - runtime.py `Machine.check_laws` applies law_rules to one state's stated-true base-relation facts only.
        - `same` is built into type_checker `_match` (name equality = unique_names).
        - step and frame are in Machine.step; halt is in main plus Machine.applicable; no_confusion is in Machine.confusion.
        - LAWS_RUN = {unique_names, step, frame, halt, no_confusion}.

