      text: |
        表示語を式から訳せば part_display_explicit は要らなくなる、という仮説 h_part_display_from_formula は反証でした。結果は #450 に書き、Draft を外しました。最初の実行で手順を誤って直したので、自動マージには乗らず、手で見てもらう PR です。

        - **手順の誤りと訂正:** 最初の実行は、スクリプトが途中で例外で落ち、表示語を一つも訳せませんでした。原因は、相手（with）を書いていない限定の扱いです。その結果を開示の commit に残し、直したスクリプトを走らせる前に commit してから実行しました。判定の基準は変えていません。
        - **結果:** 部分の限定を持つノード 99 個をすべて、式から訳した表示語に置き換えました。新しく出た誤りは 3 つで、どれも part_display_explicit そのものです。事前に決めた反証の条件に当たります。
        - **見込み違いだった点:** 訳した表示語なら当然この法則を満たすと見込んでいましたが、違いました。訳した表示語は上位の表示語を後ろに含みます。法則は表示語全体を平らな文字列として読むので、上位の限定の言い方を、そのノード自身の言い方と取り違えます。
          - 例: 「結果の行を部分に持つ結果ファイルの部分である情報」。「の部分である」は上位の限定の言い方として正しいのに、咎められます。
        - **含意:** 食い違っているのは、訳し方ではなく、平らな文字列を読む法則の側です。
          - ほかの検査は新しい誤りを出さず、同じ表示語になったノードもありませんでした。
          - 判定には使っていませんが、語として読めない訳もありました。たとえば ontology.continuant は「を時間的な部分に持たない」になり、句が空のまま始まります。
        - **新しい仮説（#451、登録だけ）:** 反証から、別々の解き方を対で登録しました。どちらも識別子化の決定（d_cscl_display_derived）に結んであります。
          - h_part_display_own_phrase: 法則が読む単位を、そのノード自身の限定の句に限る。
          - h_display_as_part_tree: 表示語を平らな文字列でなく式の部分の木として持ち、検査は木を読む。
        - **待っているもの:** #439 と #443 は、まだマージを待っています。

        ロードマップ: a（識別子化）で、表示語を式から導く道（#447）を確かめ、反証から次の二つの仮説を出しました。
