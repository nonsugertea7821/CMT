        賛成です。理由は、ここまでの観察の数が少なすぎることです。

        **いまの結果が乗っている数（事実）**
        - 収斂（自分の欄が同じで親が違う組）は 1 組だけでした。
        - 動詞の付け替えは、改名を除くと 6 件でした。
        - 親だけが単独で動いた付け替えは 7 件でした。
        - std は 28 節しかなく、その中身はモデル・重み・実験・計算など、実験の側の語に偏っています。
        - 動詞 119 のうち多くは exp の動詞です。そのため、「動詞は原始概念」「差異は類に相対的に一意」という結論が、実験という一つの領域の癖なのか、言語の性質なのかを区別できません。

        **増やすときの注意（解釈）**
        - 手で概念を足すと、以前おっしゃった「恣意的であってはならない」に触れます。足し方そのものが演繹できる形のほうがよいと思います。
        - 案は次の形です。
          - 外にある、領域に偏らない基本の語彙から語を取ります。
          - 名詞は、placed_deduced で置き場所が決まるかを tc に任せます。
          - 動詞は、親を宣言し、差異だけを書きます。
        - こうすると、増やす作業そのものが、ここまでの仮説を確かめる場になります。
          - 名詞が法則だけで置けるか（h_concept_extends_deduced）。
          - 兄弟の差異が一意か（h_differentia_by_genus）。
          - 収斂がどれだけ出るか（h_verb_extends_primitive）。

        一つだけ、方向として決めていただきたいことがあります。**どこから語を取るか**です。
        - (1) **BFO や DOLCE のような上位オントロジー**: 語は少ないです。いまの ontology 層と重なりやすいです。
        - (2) **WordNet の上位の語や、基礎語彙表（Basic English 850 など）**: 一般の語が多く、名詞と動詞の両方がそろいます。
        - (3) **日本語の基本語彙（教育基本語彙など）**: d_road_japanese とつながります。

        おすすめは (2) です。領域に偏らず、動詞もそろうからです。

        決まったら、その取り方と判定を仮説として登録し、事前登録してから増やします。

