      text: |
        ロードマップを軸にした台帳のページを作り、PR #698 にしました。GitHub Pages に出すワークフローも同じ PR に入れています。

        - **プレビュー**: https://claude.ai/artifact/Qj5zABE8sP9DtnFYG6UHtw
          - 上にロードマップがあり、決定を押すと、その根拠になっている仮説が状態ごとに出ます。
          - 仮説は検索と状態での絞り込みができます。どの決定にも結んでいない仮説（わき道）は、主語ごとにまとめています。
          - 仮説の文は体系の式から訳しています。「依存する」の前に「を」が付く誤りは、`sys_case_frame_formula.py` にある助詞の表（`GOLD`）で補って直しました。例:「隠れ状態が始点の位置に依存する」。
          - この表は私が表示語を見て付けたもので、式から導いたものではありません。PR の本文にもそう書いています。`display.sentence` 自体は直していません。ほかの出力も変わるのと、格の付け方は研究の筋そのものだからです。
          - 段の決め方も直しました。表示語の決定が目標と同じ段に出ていたのを、「依存する」の線だけで段を決める形にしました。
        - **脆弱性への対策**:
          - ページは外から何も読み込みません。中に書いた script と style だけを、その中身のハッシュで許しています。
          - 画面に入れる値はすべてエスケープしています。
          - ワークフローは PR からは走りません。権限は最小限にし、取り出すのは main だけです。
          - issue は誰でも立てられるので、issue の番号は github-actions が立てた issue のものだけを使います。
        - **session_log**: 読みません。読むのは main の体系のファイルと issue の番号だけです。
        - **お願い**: マージの前に、リポジトリの Settings → Pages で Source を「GitHub Actions」にしてください。設定しないと、ページを出す段が失敗します。
        - **確かめたこと**: 手元では生成器を一度だけ走らせて見た目を確かめました（コンソールのエラーなし、スマホ幅でも横にはみ出さない）。体系の検査はまだランナーで回っていません。ワークフローと生成器を変える PR なので、自動マージには乗らず、手で見ていただく形です。

        なお、実験 E35 は裏で動き続けています（144 状態のうち途中まで）。

        ロードマップ上の位置: わき道（台帳の見せ方の改善で、どの決定の根拠にも結んでいません）。
