      text: |
        残りは小さいので、「シグネチャと文法だけで書ける」のうち体系の式の側は、閉じられる見込みがあります。ただ、それで目的まで届くわけではありません。そう読んで、仮説を二つ登録しました（#967、#968）。

        **残りの中身**（#328 と #331 の結果を読み直しました）
        - 名前でしか分かれない組は、#331 の時点で 4 類 10 ノードでした。
          - 承認／支払いと、その動詞（承認する／支払う）。
          - 法則の文の「前提／導く／求める」と、その動詞。
        - どれも「同じ形で、違いは名前だけ」という種類です。分ける中身を式に書き足せば消える見込みがあります。たとえば、支払いは物の移しを含み、承認は含まない、という書き方です。
        - 法則の文の 3 つは、#331 の後の #484 で役割の書き方を変えています。いまの体系では、もう分かれているかもしれません。
        - もう一つの残り（#210）は、実行時の法則 5 つです。これは、法則の意味を事実で与える仮説（`h_law_given_by_facts`）の線で、すでに追っています。

        **モデルの空間とのつながり**
        承認／支払いは、#963 で名前を伏せると同じ文になり、モデルの中でも完全に一致した組です。体系の式の側と、モデルの空間の側で、同じ組が残っていました。式の側で分ければ、モデルの側でも分かれるはずです。

        **これで言えること・言えないこと**
        - 閉じられれば、鍵の一意性を、名前に頼らず式の形から保証できます。
        - 一貫性（使い方をまたいで同じ意味で使えるか）は、辞書の側の受け持ちです。それが上がるかは、学習させて測るまで分かりません。

        **登録したもの**
        - #968 `h_identifier_by_residue_differentia`（登録だけなので、CI が通れば自動マージに乗るはずです）
          - 残りの組に種差（同じ上位概念の中で、ほかと分ける中身）を書き足せば、識別子は式だけで決まるか。
          - 確かめ方: いまの体系で残りを数え直し、書き足してから、もう一度数えて 0 になるか見ます。
        - #967 `h_opaque_region_immune_collision`（概念を一つ足すので、手で見てもらう PR です）
          - 名前を伏せて同じ文になる組を除いても、#963 の「区画は式に沿う」が残るか。

        前のフックへの答え:
        - 一致した組による #963 の結果のかさ上げは、#967 として登録しました。
        - 「残りは鍵の受け持ちだ」という読みは、#968 で確かめる形に登録しました。
        - それ以外の否定の文は、grep と履歴で確かめた事実なので、登録していません。
