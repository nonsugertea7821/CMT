      text: |
        キャッシュして増分で比べる案を、もう一つの直し方の仮説 `h_sync_by_diff` として #623 に足しました。まだ登録だけで、作り込みはこれからです。

        **直し方の二つ**
        - **索引にする:** 体系の yaml を一度だけ読み、仮説・決定ごとに振り分けます。いまは 1 件ごとに全部読み直しているので、この分の手間は件数に比例しなくなります。ただ、型検査器と実験の検査器を組み立てる 75 秒は残ります。
        - **増分にする（ご提案）:** 前回の結果を GitHub Actions のキャッシュに残し、比べて違う分だけ作り直して送ります。残すのは、仮説・決定ごとの本文の hash と、それが拠る yaml の行の hash です。
          - 体系の yaml が前回からまったく変わっていなければ、検査器の組み立てごと省けます。
          - 変わっていれば、検査器は組み立て直したうえで、差分の分だけ作り直します。

        **一つ気をつけること**
        issue の題は表示語から訳した文なので、ある仮説の行が同じでも、別の場所で表示語が変わると、その仮説の issue の文も変わります。キャッシュの鍵を「その仮説の行」だけにすると、この変化を取りこぼします。鍵には、その仮説が参照する語の表示語も含める必要があります。

        **進め方**
        二つは同時に入れられます。#623 がマージされたら、まず原因の確かめをします。過去 88 回の実行時間を、その時点の件数と行数に当てはめます。そのあと、索引化と増分化を一つの PR で出します。ワークフローの変更なので、その PR は手で見てもらう扱いになります。

