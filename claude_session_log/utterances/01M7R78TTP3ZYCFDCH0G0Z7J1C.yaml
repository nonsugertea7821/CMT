        E22 が終わり、仮説 #91 は支持になりました。限定の差分ベクトル（下位の概念ベクトル − 上位の概念ベクトル）は、学習していない上位概念にも移りました。

        学習していない上位概念の 24 問での値です（accuracy / 2 順序とも正答の割合）。

        | 条件 | 値 |
        |---|---|
        | 何もなし（none） | 0.50 / 0.125 |
        | 限定の差分ベクトル（qual） | 0.75 / 0.375 |
        | 修飾のベクトル（mod） | 0.667 / 0.542 |
        | 定義文（text） | 0.792 / 0.292 |

        学習が収まったかの前提（学習用の設問で 0.75 以上）は 0.792 で満たしました。事前登録の判定は transfer です。

        ただし、支持と言えるのは「移る」までで、留保があります。
        - **組による偏り**: 甲種/乙種では、限定の差分ベクトルが何もなしと同じ 0.50 でした。移りは青/赤と一類/二類の 2 組から来ています。
        - **前提はすれすれ**: 学習が収まったかの前提は 0.792 で、しきい値の 0.75 にかなり近い値です。
        - **修飾のベクトルとの比較**: 修飾の語だけのベクトルのほうが、2 順序とも正答の割合が高く出ました。限定の差分ベクトルが修飾のベクトルより良いとは言えません。
        - **問数が少ない**: 24 問で、組は 3 つだけです。

        体系への記録と PR です。
        - **PR #278**: 結果を書いて tc と ec が通り、Draft を外しました。事前登録の commit はスクリプトだけで、訂正もないので、auto-merge に乗るはずです。
        - **含意（PR #279、登録だけ）**: 2 順序とも正答の割合（判定の安定）は、E14 の対比ベクトルでは下がり、今回の 2 つのベクトルでは上がりました。この違いを説明する 2 つの読みを、仮説の対で出しました。
          - `h_qualification_raises_stability`: 限定の差分ベクトルが判定の安定を上げる。差分の取り方で、安定の向きが変わるという読みです。
          - `h_modifier_vector_raises_stability`: 修飾の位置に学習したベクトルを足すこと自体が、判定の安定を上げるという読みです。
          - 今回の値は事後に見たものなので、根拠にはしません。確かめは別の組か別のモデルで、事前登録してから行います。

        E22 が終わったので、コンテナ保持の予約は止めました。次の周回は 21:13Z で、#92（限定の差分ベクトルで再定義に従う率が上がるか）の準備を始めます。
