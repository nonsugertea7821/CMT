      text: |
        そのとおりです。「どちらかに約束で決めればよい」という私の答えは、浅いものでした。

        **なぜ「どちらも成立する」が正しいか**
        - **微積分の側から：** 跳びの点 t₀ ちょうどの値は、極限にも積分にも効きません。一点は測度 0 なので、t₀ で 0 を取っても 1 を取っても、意味のある量は変わりません。右連続や左連続は計算の便宜上の約束で、どちらを選んでも結果が変わらないから、約束で済むのです。
        - **対称性の側から：** 時間を反転すると、出現と消滅が入れ替わり、右連続と左連続も入れ替わります。`occurrent` の `sometime` は、始まりと終わりを対で持っています。片方の約束だけを採ると、この対称性を体系の外から壊すことになります。

        **エラーとして読めること**
        境目を前に入れても後ろに入れても、体系の結論が変わらないことが、健全さの条件になります。結論が選びに依存するなら、どこかの式が一瞬の値に頼っている、つまり式が足りていない合図です。名前の付け替えで結論が変わってはいけない（`h_renaming_invariant`）のと同じ型の、不変性の検査です。

        **#318 での具体例**
        「モデルの出現より前の文章」は、出現と同じ瞬間に公開された文章がどちらに入るかで、集まりが変わります。この不変性の観点から見ると、これは約束で埋める隙間ではありません。定義が一点に依存しているという欠けです。直し方は、境目に頼らない形にすることです。たとえば「出現の区間と重ならない」のように書けば、一点の扱いに関係なく決まります。

        **登録したもの（PR #321、概念を足すので手で見てください）**
        - 概念 `boundary_choice`（前後の状態の境目の選び）を足しました。
        - 仮説 `h_boundary_invariant`（型検査器の結論は、境目の選びに依存しない）を登録しました。
        - 開いている点があります。今の型検査器が境目の値を扱っているかを、まだ見ていません。扱っていなければ、仮説は自明に支持されます。その場合は、境目に頼りうる式（`pre_model_passage` のようなもの）を、別に数える必要があります。
