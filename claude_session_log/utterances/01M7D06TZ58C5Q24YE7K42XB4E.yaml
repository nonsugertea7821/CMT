      text: |
        役割は再定義と同じ形で書けました。内容が落ちていた概念は、196個中 7個（4%）まで減っています。

        ## 役割の書き方

        場面を指定する新しい仕組みは要りませんでした。既存の「依存する」だけで書けています。

        ```
        傾向性 = 実現可能体のうち、担い手の質に依存するもの
        役割   = 実現可能体のうち、定義に依存するもの
        ```

        「どの場面でのことか」は、その定義が何の部分であるか、で表せます。

        | 役割 | 根拠となる定義 | その定義がある場面 |
        |---|---|---|
        | 与えられた意味 | 再定義 | — |
        | 動かす条件である | 実験の取り決め | 実験 |
        | 測る量である | 実験の取り決め | 実験 |
        | 正本 | 正本の取り決め | 本設計 |
        | 変更の固定先 | 変更の固定先の取り決め | 本設計 |

        検査には「役割は、根拠となる定義を特定していなければならない」という規則を加えました。定義でないもの（設計そのもの）を根拠に置くと、失敗します。

        ## 再定義との対応

        元の意味と、再定義によって与えられた意味が、同じ対の両側に並びました。

        ```
        元の意味       = 傾向性のうち、学習で得られ、重みに依存するもの
        与えられた意味 = 役割のうち、再定義に依存し、一般語に依存するもの
        ```

        - 一般語の再定義とは、語に、定義に依存する役割を与えること。
        - 再定義への追従とは、傾向性ではなく役割に従って判定すること。

        前回は式の見比べからの推論でしたが、今回は同じ形で書いて検査を通したので、対応は見かけだけではなかったと言えます。

        ## 動詞の産物

        残りのうち 3個は、動詞の第三のものの位置を修飾で使うことで書けました。

        ```
        教示で得られたベクトル = 実現可能体のうち、「教示」の第三のものの位置に来るもの
        概念ベクトル           = 「定義を届ける」のうち、教示で得られたベクトルに関わるもの
        教えた使い方           = 使い方のうち、教示の材料が述べているもの
        ```

        「教える」は、教えた相手に依存する何かが生まれる、と書いてありました。教える相手を層としたのは誤りではなく、産物（ベクトル）が層に依存することを表していました。

        ## 3回の書き直しの推移

        | 版 | 加えたもの | 内容が落ちた概念 |
        |---|---|---|
        | 第1版 | 関係と修飾 | 28 |
        | 第2版 | 分類（軸と値、関数の値、比較） | 14 |
        | 第3版 | 定義に依存する役割、動詞の産物 | 7 |

        ## 残った 7個

        | 原因 | 例 |
        |---|---|
        | 概念式の中での位置（2個） | 修飾、上位概念 |
        | 様態 | 見る と 読む |
        | 同じ上位を持つこと | 兄弟概念 |
        | 発話者 | システムプロンプト |
        | 中身を除いた形式 | 設問形式 |
        | 永続することと型 | 型付きグラフ |

        このうち「修飾」「上位概念」「兄弟概念」「型付きグラフ」の 4個は、概念の体系そのものについて述べる語です。体系の部品を体系の中で書こうとしている箇所で、「について述べる」が解けなかったのと同じ種類の限界に当たっている可能性があります。

        ## 現在の形

        - 基礎は、法則を持つ状態の関係 5個と、体系そのものの行為 1個。
        - 動詞は、状態の関係の成立と変化。
        - 修飾は、動詞のある位置（始点、終点、第三のもの）を占めるものへの限定。
        - 分類は、関係を軸として見て、値（固定値か関数）を置くこと。比較の土台。
        - 役割は、定義に依存する実現可能体。

        ## 次の手

        残り 7個は、解ける見込みの薄いもの（体系の自己言及）と、細部（様態、発話者）です。ここで書き直しの試験は区切りとし、次は正本の切り替えに進むのが妥当だと考えます。`spec/ontology.yaml` をこの形に置き換え、測定値の定義と、仮説・決定をその上に載せ直します。今回対象外にした「仮説と決定で使う関係」17個（上げる、下げる、転移する など）も、そこで書くことになります。

        切り替えは規模が大きいので、進める前に、この形で固めてよいかの判断をください。

        実験は、E8 があと 1概念で学習を終えます。評価の結果が出たら記録します。
