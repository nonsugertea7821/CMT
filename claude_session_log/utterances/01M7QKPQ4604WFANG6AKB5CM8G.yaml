      text: |
        はい、悪くなっています。失敗はしていませんが、1回の CI（spec）にかかる時間がこの2日で約4倍になりました。

        | 時点 | spec 1回の時間 |
        |---|---|
        | 11/16（run #92〜96） | 約 10〜12 秒 |
        | 今朝 06:33Z ごろ（run #443〜447） | 約 30〜38 秒 |
        | いま（run #735〜747） | 約 40〜60 秒 |

        今朝といまを工程ごとに比べると、増えたのは2つの工程だけです。

        | 工程 | 今朝 | いま |
        |---|---|---|
        | 型検査 | 8 秒 | 14 秒 |
        | issue 同期の確認（`test_sync_issues.py`） | 13 秒 | 19 秒 |
        | そのほか | 合わせて 5 秒ほどで、変わらない | 同じ |

        **見立て（測っていないので推測です）**
        - 型検査が伸びたのは、体系の事実・仮説・観察が増えたためだと思います。
        - issue 同期の確認は、中で `exp_check.build()` を呼び、体系全体を組み直しています。そのため、1回の CI で型検査をほぼ2回走らせていることになり、体系が大きくなるほど2倍効きます。

        **回数も多くなっています**
        - spec は push と pull_request の両方で走るので、PR のブランチへの push 1回で2本動きます。
        - 会話の記録のブランチ（`claude/session-log-…`）への push でも毎回走り、それが全体のほぼ半分を占めています。

        なお、いま手元で走っている2つの実験は、この container の中で回しているもので、GitHub 側の CI の速さには影響していません。

        直すとすれば、次のようなやり方があります。
        - 体系を組むのを1回にする。
        - 会話の記録のブランチでは、spec を走らせない。
        - push と pull_request で重複して走らないようにする。

        取り決めどおり、直す前に仮説として登録します。原因を確かめる（型検査の時間が事実の数に比例するか見る）ところから進めるなら、そうします。
