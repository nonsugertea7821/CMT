      text: |
        言い換えの検証（E5）が終わりました。改名しても再定義への追従は改善せず、これまでの私の解釈を改める必要が出ました。

        ## E5 の結果（Qwen2.5-1.5B、一般語の再定義 24概念）

        数値は正答率です。

        | 手段 | 定義が元の意味と衝突する設問 | 衝突しない設問 |
        |---|---|---|
        | 定義文を直前に置く（基準） | 0.58 | 0.75 |
        | 元の語が見える新しい語に改名（社員 → P社員） | 0.58 | 0.79 |
        | 元の語が見えない新しい語に改名（社員 → 用語08） | 0.58 | 0.75 |
        | 設問中の語の直後に定義を展開 | 0.46 | 0.83 |
        | 定義文を直前に置き、設問中でも展開 | 0.42 | 0.88 |

        ## 私の解釈の誤り

        これまで「文章での注入は、語が元から持つ意味に押し負ける」と説明してきました。この結果はそれを支持しません。

        - 語を「用語08」のような完全に新しい語に替えると、元の意味との衝突はなくなります。それでも 0.58 のままでした。
        - つまり失敗の原因は語の側ではなく、事例の側にあります。「週に二日のアルバイトは、雇用契約を結ぶ全員に含まれる」のように、定義を事例に当てはめる推論そのものを、このモデルが誤っていると読むのが自然です。

        小さいモデルの推論力の不足と、元の意味との衝突とは、まだ切り分けられていません。前回お伝えした「再定義では 0.58、新しい語では 1.00」という対比も、設問の難しさが違うだけだった可能性があります。

        ## 概念ベクトルの結果の読み方

        ベクトルの数値（衝突する設問で 0.79）そのものは変わりません。ただし意味づけは変わります。「元の意味を上書きした」のではなく、「定義を当てはめる推論を、適用例から学んだ境界で肩代わりした」と読む方が正確かもしれません。

        ## 対応

        小さいモデル特有の現象かどうかを切り分けるため、より大きいモデルでの確認を最優先に上げ、実行を始めました。

        - **モデル**: Qwen3-4B（Apache 2.0、同意手続き不要）。この環境で動くことを確認済みです。
        - **内容**: E1（定義文での注入）と E5（言い換え）を同じ設問で回します。
        - **見たいこと**:
          - 定義文だけで従えるようになるか。
          - 改名の効果が現れるか。

        大きいモデルで「定義文は効かないが改名は効く」となれば、元の意味との衝突が実在することになり、あなたの言い換えの効果とも合います。どちらも効くなら、1.5B の結果は推論力の不足だったことになります。

        E4 のやり直しは、この後に回します。結果と解釈の修正は `experiments/README.md` と `docs/design.md` に記録し、プッシュ済みです。
