        測る候補は四つで、どれも学習は要らず、手元の E3・E12・E14 のベクトルと順伝播だけで測れます。ベクトルの定義から出た含意を一つずつ確かめるためのものです。

        1. **大きさの比 |v| / |h|（含意2：読める範囲に留まっているか）**
           - 層8の語の位置で、元の隠れ状態 h に対する足したずれ v の大きさを、E3・E12・E14で比べます。
           - 予想：E14は比が大きすぎて範囲の外に出ています（判断が壊れた理由）。E12は小さすぎます（効かなかった理由）。E3はその間です。

        2. **E3 の v と、near（定義文を直前に置く）が実際に作るずれとの cos（含意4：ベクトルは仮想の文脈か）**
           - near が作るずれは h(定義＋設問) − h(設問) です。E14と同じ作り方ですが、比べる相手として使います。
           - cos が高ければ、ベクトルは定義文を圧縮したものです。低ければ、文章では作れないずれを含んでいます。E3 が near より成績が良いことと突き合わせられます。

        3. **ベクトルの入れ替え（含意1：意味は基準点に依存するか）**
           - 概念Aの設問に概念Bのベクトルを足して正答率を測ります。
           - 大きく落ちれば概念ごとの意味を運んでいます。落ちなければ「定義に従う」という一般的な構えにすぎません。

        4. **手段ごとの着地点の距離（含意4：全実験を共通の尺度に載せる）**
           - none・near・概念式・E3・E12 それぞれで層8の語の位置の状態を取り、E3の着地点との距離が正答率と並ぶかを見ます。

        先に1と2をやるのを勧めます。どちらも一つのスクリプトで一回順伝播すれば出て、数分で終わる見込みです。3は評価を回すので約10分かかります。全部まとめて一つのスクリプトにして走らせますか。
