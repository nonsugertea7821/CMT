        2. Key Technical Concepts

        - **E3 concept vectors**
          - A per-concept vector is added at label-token positions in a layer's output via `Injector` (forward hook) and `label_mask`.
          - Training: Adam, lr 0.1, zero init. The model is frozen.
        - **E33 design**
          - Joint training of the two sibling vectors per pair.
          - Conditions: none, both (6 recitation rows + 8 QA rows per step, 24 steps), round (4 cycles of 3 abstract + 3 concrete steps).
            - Abstract phase: recite the correct-side concepts of currently wrong training items (both concepts in cycle 1, or if none are wrong).
            - Concrete phase: the rows of wrong training items (all items if none are wrong).
            - The judgment uses margin ≤ 0 in either option order.
          - Evaluation: 48 items (4 per pair; the G3 items plus new ones). Metrics: acc_both, acc, mean_margin.
          - Verdict:
            - Outlier (status unchanged) if both's acc_both ≤ none's.
            - Supported if acc_both(round) − acc_both(both) ≥ 0.10 and margin(round) > margin(both).
            - Refuted if acc_both(round) ≤ acc_both(both).
            - Mixed otherwise.
