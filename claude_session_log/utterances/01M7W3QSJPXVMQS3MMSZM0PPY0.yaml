      text: |
        はい、表示語を検査しています。11 月 16 日から、表示語の文字列を読む法則があります（commit b8cb706）。

        **何を見ているか**
        - 部分の限定を持つ種類の表示名に、「〜の部分である」「〜を部分に持つ」のような向きを言う語が入っていないかを探します。
        - その向きが式の限定（部分の側か全体の側か）と逆なら、誤りとして咎めます。
        - 「〜から部分になる」のようにどちら向きか曖昧な言い方も、誤りとして咎めます。
        - 初めは検査器の Python の中に part_display_explicit として書いてありました。#455 で、syntax.yaml の規則 disp_vague・disp_dir_part・disp_dir_whole に移りました。

        **なぜあるのか**
        表示語は書き手が手で書くので、式と食い違うことがあります。たとえば式では「A は B の部分」なのに、表示名に「B を部分に持つ A」と書いてしまう場合です。この法則は、その食い違いを拾うための手当てでした。

        **引っかかる点**
        この法則は、自然言語の文字列の中の語を読んで判定しています。「名前で読まない、式で書く」という方針とはずれています。「表示語は式から訳す」という決定（d_cscl_display_derived）が通れば、この食い違いは作りから起きないので、法則は要らなくなるはずです。

        実際、#459・#464・#465 で句を式から訳したところ、法則の誤りは訳し方からして 0 になりました。#456 の検査も、この法則を前提にした実験でした。

        この「要らなくなる」は、まだ確かめていません。そこで仮説 h_display_law_redundant として登録し、#466 を立てました。d_cscl_display_derived の根拠に結んであり、登録だけなので auto-merge が通すはずです。

        確かめるには、句をすべて式から訳したうえで法則を外し、体系の検査結果が変わらないかを見ます。そのためには、残る with のない限定 7（#461）が訳せるようになる必要があります。

        ロードマップ: a（識別子化）は、#456・#464 が手でのマージを、#466 が auto-merge を待っています。次は #461 で、その先が h_display_law_redundant です。
