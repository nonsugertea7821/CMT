      text: |
        今のやり方で下層の具象概念をモデルに扱わせにくい理由は、5つあると考えます。「できない」と決まったわけではなく、ベクトルで食い違う設問が 0.38 から 0.75 に上がっているので、部分的には扱えています。以下は、あなたの前提（モデルが持つのは途中の抽象概念で、キーは複数の表示名が混ざって一意でない）から導いた仮説です。

        ## 理由

        **1. 具象概念には、モデルの中に専用のキーがない**
        - モデルが概念を引くキーは表層の語です。「顧客」という語は、モデルの中では「顧客」「客」「取引先」などが混ざった抽象寄りの塊につながっています。
        - 体系の `customer`（法人であり、契約の相手方）に対応する入口は、モデルの中にありません。
        - E3 では、ベクトルを語の文字列が一致したトークン位置に足しています。新しい入口を作ったのではなく、既存の混ざったキーの読み方を局所的にずらしただけです。

        **2. 具象概念は、引くものではなく毎回計算するもの**
        - 具象概念は「上位 ∧ 限定」の連言です。例えば「顧客」は、法人であり、かつ契約の相手方である、という形です。
        - これを使うには、事例ごとに限定を満たすかを確かめる必要があり、知識を引くだけでは済みません。
        - 1.5B は明示的な多段の推論が苦手です。E9 では途中経過を書かせると付け替え型の再定義への従いが下がり、E11 では概念式で書かせると下がりました。下層ほど連言が深くなるので、不利になります。

        **3. 下層を分けるのは関係の条件で、モデルは典型例との近さで分類している**
        - 下層の区別は、「契約を結ぶ」の相手、年齢の閾値、個数といった限定に乗っています。
        - モデルの分類は必要十分条件の照合ではなく、典型例との類似で行われていると考えられます。
        - 食い違う設問（G2c）は、境界の条件を元の意味からずらすものなので、類似による判断と真っ向からぶつかります。

        **4. キーが一意でないので、一つのキーを直しても他の入口から元の意味に戻る**
        - 言い換えへの転移が出なかったこと（E6）と合います。別の表示名から入ると、元の抽象の塊に行ってしまいます。
        - E10 で日本語の表示名を外したときに残っていた英語の識別子も、モデルにとっては別のキーの集まりです。前回指摘した比較の不純さは、ここにもつながります。

        **5. 学習の信号が、境界を教える形になっていない**
        - E3 の教師は、定義文の暗唱と二択の適用例です。境界の内側と外側を対にして見せる、という形にはなっていません。
        - 選ぶための差分ではなく、全体を覚えさせようとしていました。

        ## 扱わせるなら考えられる方向

        **(a) 具象概念に専用のキーを与える**
        - 表示名ではなく、新しい識別子（専用のトークンなど）を作り、それにベクトルや小さな差分重みを結び付けます。
        - 入口が一意になるので、4 の問題は避けられます。ただし、文章の中の語をその識別子に解決する段階が別に要ります（用語サーバー、d_term_server_selects）。

        **(b) 下層の判断はモデルの外で行う**
        - モデルには、事例からモデルが元から持つ抽象概念の水準の事実を取り出させます。例えば「この人は法人か」「契約を結んだか」です。
        - その事実が具象概念に属するかは、体系の検査器（check_spec など）が記号的に決めます。
        - 2 と 3 の弱点を、モデルにやらせないことで避ける分担です。
        - E11 では、事実を CSCL の書式で書かせたため形式の誤りで崩れました（453行中15行通過）。そこで、事実の取り出しは自然言語の問い（はい／いいえ）で行い、書式への変換は道具が担う、という形が考えられます。

        **(c) 差分を境界の対で教える**
        - 兄弟概念で失敗し、その概念で通る対を教師にします（docs/design.md 5.6 の「分化の条件」）。
        - ベクトルを境界を選ぶ向きとして学ばせる形で、前回話した「候補どうしの差」の考えにつながります。

        この中では、(b) が今のモデルの大きさでも一番成り立ちやすいと考えます。CSCL を正本として持つ意味（具象概念を体系で一意に決められること）とも合います。(a) は、この研究の主張に一番近い形です。

        どれかを仮説と残り項目として spec/exp.yaml に足しますか？
