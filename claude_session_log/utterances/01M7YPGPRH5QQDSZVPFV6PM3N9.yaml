      text: |
        その指摘を、強い形の仮説として PR #655 に足しました。ただ、論理の上では、弱い形からは「外の仕組みが要る」は出てこず、強い形のときだけ出てきます。

        **1. 弱い形と強い形**
        - 先に登録したのは弱い形 `h_width_raises_sibling_discrimination` で、「次元が多いほど見分けやすい」です。
          - これは単調に上がるという主張にすぎません。次元の少ないモデルでも見分けられることを否定しません。
        - 「次元の少ないモデルが見分けるには外の仕組みが要る」が出てくるのは、強い形のときです。
          - 強い形は「見分けるには、次元の多い隠れ状態が要る」という主張です。
          - これを `h_sibling_discrimination_relies_on_width` として、同じ PR #655 に登録しました。
        - 強い形が成り立っても、逆説というより、このプロジェクトの前提と同じ向きになります。
          - 定義を文脈に入れること（文章での注入、d_explanation_by_text）は、まさにモデルの外の仕組みです。
          - 「次元の少ないモデルほど、文脈で与える定義に頼る」という予測になります。

        **2. 数学的な操作で解ける可能性**
        影の限界は、主に「たくさんの立体を同時に保持しておく」ことにかかります。計算の途中では、次のような逃げ道がありえます。
        - **高い次元への持ち上げ**
          - 非線形の写像で高い次元へ移すと、分けられなかった集合が平面で分けられるようになります（Cover の定理。カーネル法と同じ考えです）。
          - MLP は、1 層ごとに 1536 次元を 8960 次元へ持ち上げて、また戻しています。ですから、計算に使える次元は 1536 より多いことになります。
        - **層を重ねた折り畳み**
          - 非線形の層は空間を折り畳みます。分けられる区画の数は、層の数に対して指数的に増えます（Montúfar ほか 2014）。
          - ですから、幅が足りなくても、深さで補える可能性があります。
        - **文脈ごとの使い回し**
          - 注意の機構があるので、隠れ状態は文脈に応じて動きます。
          - その文で分ける必要があるのは、その文に出てくる概念だけです。1536 次元でも、文ごとに分け方を組み替えれば足りる可能性があります。
        - **共通成分を引くこと**
          - 兄弟に共通する成分を引いて、差の向きだけを見る方法です。
          - E22 では、差のベクトルが見たことのない上位概念へ移ることが支持されました。

        **3. 見込みと、確かめる筋**
        外の仕組みが要るとすれば、それは計算のためではなく、文脈なしに概念を保持しておくためだと見ています。ただし、これは見込みです。
        - 強い形が反証されれば、モデルの中の操作で足りることになります。その場合は、層を重ねて持ち上げる操作などが候補になります。
        - 確かめ方: 0.5B・1.5B・3B のモデルで、定義を文脈に入れたときと入れないときの見分けを比べます。差が小さいモデルほど大きくなれば、強い形を支持します。

        本線 b 領域の道（d_road_region、PR #655）
