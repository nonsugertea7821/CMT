        2. Key Technical Concepts

        **Region road**
        - Midpoint membership G_rate on Qwen2.5-1.5B, 120 words, 5 genera × 8 words, so 28 pairs per genus and 140 pairs in all.
        - Conditions: swap and mixed.
        - lift = mean of (swap − base) and (mixed − base). Values sit on a 1/280 lattice.
        - Bands: top = the 256 highest-std dims, scaled by a0·f/100. a0 = sqrt(var_low / var_top).
        - Bootstrap: resample pairs within each genus, 2000 times, seed 0.

        **ec (exp_check.py) mechanics**
        - rows_of(file, path) returns the items of the dict at that path.
        - stat() averages r[cond] over rows where `cond in r`, so a row must be a dict.
        - v_keys_of '#' plus v_spell ['L'] on an axis filters rows by key (row_keys).
        - `v_rows_of from: []` with a part axis keyed 'judgment' works for top-level scalar stats.
        - Comparisons to constants work, for example `{v_come_after, from: id, to: 0.3}`.

        **Checker road**
        - E-series prompts are built by HEAD and snippet (named).
        - score is the log-prob of the answer name. d = s(X) − s(Y).
        - Each item is scored over 2 name swaps × 2 definition orders. acc is the share of items whose pair mean is > 0.

