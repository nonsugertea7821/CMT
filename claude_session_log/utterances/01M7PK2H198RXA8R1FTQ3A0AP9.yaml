        2. Key Technical Concepts

        - **above**: a base relation in syntax, derived via above_by_ancestor from r_ancestor.
          - Extensionally a strict order: 2478 pairs, reflexive 0, symmetric 0, transitive missing 0, all ends exist, 0 overlap with depend.
          - It has no own order laws (unlike after_transitive/after_asymmetric, part_transitive/part_antisymmetric).
          - The bridge is one-way only (ancestor ⇒ above).
        - **Type checker name reading outside signature/syntax**:
          - TOPS continuant/occurrent (183, 1100)
          - verb under occurrent (1119)
          - modifier under specifically_dependent_continuant (1130)
          - axis only on quality (1149)
          - role/definition/v_depend grounding (1079, 1183–1190)
          - role at a position (994)
