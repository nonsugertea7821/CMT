          - gloss tops (1283)
          - ontology base relations exists/refer/part/after and axes count/truth/text: signature-like by definition, but placed in ontology
          - runtime law names (LAWS_RUN)
        - **Coordinate analogy**:
          - A concept is a point (better: a region) in mod dimensions (verb × position).
          - self = origin/base point; any = zero / no condition; same = sign.
          - Geometric order: G(x,y) iff acc[y] ⊆ has[x].
        - **D2 (user's choice)**:
          - continuant = ∀t,t' same(self_t, self_t').
          - occurrent = ¬same(frame_t, frame_t+1).
          - Static (holds-only) verbs are relations, not occurrents. The current system is D1-placed.
          - h_tops_derivable was refuted because of the static verbs.
          - sys_verbs: dynamic 36, static 82. Static verbs are unlimited, carry more order relations, and 14 have occurrent ends.
        - **Affine w analogy**:
          - point w=1 = continuant; vector w=0 = occurrent (difference of frames).
          - Static relations are a third kind (dual/constraints).
          - The static coordinates lack w, hence gap_zero 941.
        - **Signature → Erlangen bottom (set level)**:
          - same = identity invariant under all bijections.
          - any = whole space / zero condition, w undetermined.
          - self = base point.
          - Negation = complement.
