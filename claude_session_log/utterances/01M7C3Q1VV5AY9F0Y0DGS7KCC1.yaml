        大きいモデル（Qwen3-4B）での結果が出ました。元の意味との衝突は実在し、あなたの言い換え（改名）は効きます。1.5B の結果は、このモデルには処理が重すぎて衝突が見えなかっただけ、と読めます。

        ## 定義を文章で渡したとき（Qwen3-4B、正答率）

        | 設問の種類 | 定義なし | 定義文を直前に置く | 用語集（55定義）に入れる |
        |---|---|---|---|
        | 一般語の再定義。定義が元の意味と衝突する設問 | 0.38 | 0.75 | 0.46 |
        | 一般語の再定義。衝突しない設問 | 0.83 | 0.83 | 0.79 |
        | 分化した兄弟概念（新しい語） | 0.38 | 1.00 | 1.00 |
        | 置換された用語（新しい語） | 0.50 | 1.00 | 1.00 |

        - **同じ用語集の中で、新しい語は 1.00 で従い、一般語の再定義は 0.46 で、定義なしとほぼ同じです。** モデルは用語集を読めているのに、再定義だけを無視しています。あなたが最初に言った「再定義しても従わずに揺れる」が、そのまま数値に出ました。
        - **定義文が直前にあっても、再定義は 0.75 にとどまります。** 新しい語は同じ条件で 1.00 です。

        ## 言い換え（Qwen3-4B、正答率）

        | 手段 | 衝突する設問 | 衝突しない設問 |
        |---|---|---|
        | 定義文を直前に置く（基準） | 0.75 | 0.83 |
        | 元の語が見える語に改名（社員 → P社員） | 0.79 | 0.92 |
        | 元の語が見えない語に改名（社員 → 用語08） | 0.92 | 0.79 |
        | 設問中の語の直後に定義を展開 | 0.67 | 0.88 |
        | 定義文を直前に置き、設問中でも展開 | 0.83 | 0.88 |

        - **元の語が見えない語への改名が最も効きます（0.75 → 0.92）。** 元の語が残る改名は効果が小さく、元の語が見えているだけで引っ張られることが分かります。
        - **ただし、見えない語への改名は衝突しない設問を少し下げました（0.83 → 0.79）。** 元の語が持っていた正しい知識も一緒に失うためと考えられます。

        ## 前回の解釈の訂正

        1.5B の E5 を受けて「語の意味の衝突では説明できない」と述べましたが、これは言い過ぎでした。1.5B では定義を事例に当てはめる処理そのものが重く、衝突の有無が結果に表れなかった、と読むのが妥当です。衝突の証拠としては 4B の結果を使います。

        ## 設計への含意

        - **言い換えは、文章の側で取れる有効な手段です。** ただし、出力される語が設計の語彙から離れるので、「再定義した一般語のまま従わせる」という課題そのものの解決ではありません。
        - **用語集に載せる方式の欠陥は、再定義に限った問題でした。** 新しい語なら、用語集に埋めても従います。

        ## 未確認の点

