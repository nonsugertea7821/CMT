      text: |
        #866 は直して push しました。tc が落ちた理由は、「文章での注入」が部品ではなく通り道として型づけされていて、部品の並びに入れられなかったことです。そこで部品を「型つきの体系・自然言語に変換した文・概念ベクトル」の 3 つに絞りました。いまは CI を待っています。E64 は学習中で、まだ最初の概念も書き出されていません。

        **Anthropic のモデルは何 B か**
        Anthropic はパラメータ数を公表していません。外部の推定はありますが、根拠のある数字ではないので、ここでは言いません。

        **作業フォルダを変えたサブエージェントに概念を扱わせる案**
        試すとすれば、これは「文章だけで概念を渡す道」の試験になります。重みには触れないので、使えるのは前置きの文で渡す手だけです。設計でいえば、API のモデルには文章で渡すという決定（d_text_for_api_models）の部分にあたります。言い直した概念の定義を、体系から変換した文として渡し、4 つの使い方で一貫して当てられるかを測る形です。

        ただし、気をつける点が三つあります。
        - 「切り離し」は、会話の中身が引き継がれないという意味だけです。重みは私と同じで、事前の知識も同じです。作業フォルダを変えて変わるのは、読めるファイルだけです。
        - リポジトリが読める場所に置くと、体系や過去の結果を読んでしまえます。それでは答えを見たうえでの測りになるので、データだけを置いたフォルダで走らせる必要があります。
        - 前に決めた「Claude のモデルを実験の対象にしない（Qwen を使う）」と正面からぶつかります。

        三つ目は方向そのものの決めごとなので、この案はまだ仮説として登録していません。あの決まりを外す、あるいは「文章の道だけは Claude でも測る」と例外にするなら、そのとき登録して E64 の後に回します。

        ロードマップの位置:
        - 目的: 言い直した概念を、モデルが 4 つの使い方（当てはめる・言い換える・理由を言う・定義を言う）すべてで当てられる割合（一貫して使えた割合）を、この設計で上げる。
        - 設計: いま試しているのは、概念ごとのベクトルを、モデルの途中の、概念の語の位置に足す部分です。#866 では、設計全体が「型つきの体系・自然言語に変換した文・概念ベクトル」でできている、という仮説を登録しています。
        - 計画:
          - [済] 1.5B で、理由を言う使い方が上がったときに、一貫して使えた割合も上がった（E63） → 1.5B で足を引っぱっているのは理由を言う使い方だ、という見立てが立った。
          - [今] ベクトルで理由を言う使い方を直接上げ、一貫して使えた割合が付いてくるかを見る（E64） → その見立てが当たっているかが決まる。
          - [次] 設計の部品の並びを決める（#866）。文章の通り道をどこに置くかも決める → どの部品を直せば目的に効くかの地図ができる。
          - [先] 言い直した概念で、手を入れる前と後の一貫して使えた割合を比べる → この設計が目的を上げるかを言える。
        - 分かれ目: E64 で付いてくれば、1.5B では理由を言う使い方を上げる手を設計に組み込みます。付いてこなければ、ベクトルがほかの使い方を下げていないかを概念ごとに見ます。
