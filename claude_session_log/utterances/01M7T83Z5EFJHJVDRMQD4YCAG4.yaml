        **#379: 仮説を決定に結び直した（手で見る PR）**
        - ロードマップに届く仮説は、5 つから 32 になりました。
        - 日本語の自然さは、新しい決定 `d_road_japanese` にしました。「一貫した仕方で用語を結び、ネイティブに読めれば効く。ただし必要条件ではない」という指摘のとおり、依存ではなく「使い方をまたぐ一貫性を上げる」道として結んでいます。
          - この道は識別子の式ができていることを前提にしますが、その依存は式に書けませんでした。一つの決定から関係を二つ出すと、型検査が落ちるためです。前提は commit のメッセージに残しました。
