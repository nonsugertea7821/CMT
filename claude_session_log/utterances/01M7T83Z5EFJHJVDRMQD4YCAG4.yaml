        - 結ばなかったのは 19 です。追従・安定の系列、運用の仮説、ほか 2 つで、30 分ごとの見直しでは選びません。

        **30 分ごとの見直しの順**
        指示を書き換えました。上の層の測定は下の層の健全性に依存するので、下から進めます。
