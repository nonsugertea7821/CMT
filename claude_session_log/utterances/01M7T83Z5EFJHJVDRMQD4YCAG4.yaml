        `h_roadmap_by_ground` は反証になりました。結果を見て、仮説をロードマップに結び直し、進める順も決めました。確認待ちの PR は 2 つです。

        **#378: ロードマップに届く仮説を数えた（反証）**
        - 未検証の仮説 51 のうち、ロードマップに届いていたのは 5 つ、式の語から結べそうなものが 3 つで、合わせて 8 つでした。
        - 残りの 43 は、中身から次のように読めます。
          - **発話・韻律・公開コーパスの系列**: どの決定にも届いていませんでした。
          - **追従・安定の系列**: 取り下げた指標（再定義への追従）の側に残っていました。
          - **体系の内側の仮説**: 識別子化に関わるのに、文法の語で書かれているので数え方で拾えませんでした。
