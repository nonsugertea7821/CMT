      text: |
        曖昧な言葉を使いました。「推論力」の中身を分けると、定義を事例に当てはめる作業は次の段階からなります。どの段階で失敗しているかは、まだ測っていません。

        ## 当てはめに必要な段階

        「週に二日だけ働くアルバイトの学生は、社員に当たるか」を例にします。

        | 段階 | 内容 | この例では |
        |---|---|---|
        | 1. 条件の取り出し | 定義文から、当てはまる条件と例外を読み取る | 「会社と雇用契約を結ぶ全員。アルバイトも含む」 |
        | 2. 事例の属性の取り出し | 設問の事例が持つ性質を読み取る。定義に書かれていない常識の補完を含む | 「アルバイトは雇用契約を結んでいる」 |
        | 3. 照合 | 条件と属性を突き合わせる。数値の大小、集合への所属、曜日の計算など | 「雇用契約がある → 条件を満たす」 |
        | 4. 答えの形式への写像 | 照合の結果を、求められた形式に直す | 「はい → 選択肢の番号」 |
        | 5. 事前の傾きに抗する | 上の結論が常識的な答えと違っても、結論の方を出力する | 「アルバイトは社員ではない」という傾きを抑える |

        ## 実験から言えること

        - **段階5だけが原因ではない。** 語を「用語08」に替えると、語についての事前の傾きはなくなります。それでも正答率が変わらなかったので、失敗は1〜4のどこかにもあります。
        - **段階4は一部関与している。** 選択肢の順序を入れ替えると答えが変わる設問が多くありました（順序を入れ替えても両方正答する率は 0.42〜0.50）。番号への写像が不安定だということです。
        - **段階1〜3のどれが弱いかは不明。** 測っていません。

        ## もう1つの要因：一度の計算で済ませていること

        今回の測り方では、モデルは答えを最初の1トークンで出します。段階1〜4を、途中経過を書き出さずに、層を一度通るだけで済ませる必要があります。「推論力の不足」と呼んだものの実体は、この「書き出しなしで多段の照合を完了する能力」の不足である可能性が高いと考えます。小さいモデルは層が少なく、この能力が弱いことが知られています。

        ## 切り分ける方法

        次の2つの測定で分けられます。

        1. **途中経過を書かせる。** 「定義の条件は何か、事例はそれを満たすか」を先に書かせてから答えさせます。これで正答率が上がれば、原因は一度の計算で済ませる制約にあります。
        2. **段階ごとに問う。** 「定義によれば、アルバイトは含まれるか」（段階1）、「アルバイトは雇用契約を結んでいるか」（段階2）を別々に問い、どこで外れるかを見ます。

        1つ目は、概念ベクトルの意味づけにも関わります。途中経過を書かせれば文章でも従えるのであれば、ベクトルの利点は「書き出しを省いても判定が合う」ことに絞られます。

        大きいモデルでの実行が終わったあとに、この切り分けを入れます。
