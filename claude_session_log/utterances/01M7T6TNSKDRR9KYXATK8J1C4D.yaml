      text: |
        この周回の結果です。h_midpoint_depends_genus（#360）は**支持**になりました。PR #370 の Draft を外したので、見てマージしてください。#369（日本語をほとんど読んでいないモデル、支持）も、マージを待っています。

        **何をしたか**
        2 つの上位概念の語を、同じ量の上で交互に並べました（重さなら動物と乗り物）。そのうえで、2 つの集め方のまとまりを比べています。

        | 組 | 同じ上位概念の 8 語 | 量のひと続きの半分 |
        |---|---|---|
        | 重さ（動物・乗り物） | 1.00 | 0.59 |
        | 値段（楽器・家具） | 0.98 | 0.43 |
        | 人口（国・都市） | 0.93 | 0.70 |

        - 同じ上位概念の 8 語は、量の上で飛び飛びでも、ほぼ完全にまとまりました。
        - 量のひと続きの区間は、上位概念が混ざると、でたらめに選んだ場合（約 0.5）とあまり変わりません。
        - 人口の組だけ区間もまとまっています（0.70）。国も都市も地名なので、2 つの上位概念の隔たりが小さいためかもしれません。

        **読み（式への含意）**
        まとまり（凸の領域）を作るのは、上位概念です。量や上位概念をまたぐ性質による切り分けは、それだけでは領域になりません。これで段階 2 の「何がまとまりを作るか」には答えが出ました。

        式の側から見ると、`extends: word` のように広い基底を置き、`mod`（限定）だけで区別している概念が問題になります。幾何の上では、そうした概念は一かたまりの領域ではなく、散らばった集まりになっているはずです。これが、段階 3 で式の欠陥を探す最初の手がかりになります。

        **次**
        次の周回（15:58）で、この含意を `cscl/design/claims.yaml` に仮説として登録します。中身は、「上位概念を経ずに限定だけで区別している概念は、まとまりを持たない」ことを式で書いたものです。その前に、体系の中でそういう書き方をしている概念を洗い出します。h_qualification_immune_genus（#355、限定は上位概念をまたいで共通の向きか）は、その後に回します。
