      text: |
        していません。そこが抜けています。

        ## 現状

        `spec/` にあるのは、概念の構造です。たとえば再定義は、こう書かれています。

        ```
        redefinition: {ja: 再定義, is: definition,
          mod: [{of: [v_refer, from], with: common_word},
                {of: [v_agree, from], with: prior_meaning, neg: true}]}
        ```

        これは体系に沿った形式的な記述ですが、制御自然言語ではありません。英語の識別子と記号の組み合わせで、日本語は表示語（`ja`）として付いているだけです。

        そして私は、この構造を報告のたびに自分で日本語に直していました。

        > 再定義 ＝ 定義のうち、一般語について述べ、元の意味と一致しないもの

        この訳は、私がその場で作っている文です。同じ構造を、ある回は「〜について述べるもの」、別の回は「〜を述べる」と訳している可能性があります。最初に「文章が揺れるので、形式的に書いて、そこから訳してほしい」と言われた問題は、構造の側では解けましたが、訳の側にそのまま残っています。

        ## 欠けているもの

        体系は固まりましたが、それを自然言語として書くための規則がありません。必要なのは次の3つです。

        1. **文型の規則**: 構造の各要素に、文の形を1つだけ対応させる。たとえば「上位＋修飾」は必ず「A のうち、〜するもの」と書く。
        2. **動詞ごとの格の枠**: いまは動詞に表示語（「述べる」）しかありません。始点と終点がどの助詞を取るか（「〜が〜について述べる」「〜が〜に依存する」）と、否定や受け身の形が要ります。動詞の語根は 37個なので、手で書ける量です。
        3. **構造と文の機械的な変換**: 構造から文を生成する処理と、文から構造を読み取る処理。

        これが揃えば、訳は私の裁量ではなく、規則による変換になります。同じ構造は、常に同じ文になります。

        ## 決めてほしいこと

        制御自然言語を、どちらの位置づけにするかです。

        - **案A（生成された表示）**: 正本は今の構造のまま。制御自然言語の文は、そこから機械的に生成する。読むための形。
        - **案B（正本そのもの）**: 制御自然言語で書いた文を正本とし、構造はそこから読み取る。書くための形でもある。

        最初の構成では「概念式の体系は制御自然言語で記述する」とあったので、目指す先は案Bだと理解しています。ただし、案Bには文を読み取る処理が必要で、文型を厳密に決めてからでないと作れません。

        私の推奨は、まず案Aを作ることです。構造から文を生成してみれば、文型と格の枠が足りているかが 211個の実例で確かめられます。生成した文が安定して読めると分かった時点で、同じ文型を読み取る側に回して案Bへ進めます。

        この順でよいか、最初から案Bで作るべきか、判断をください。
