          - Measured id: `fam.<axis values in order>.<stat>.mean_value`, e.g. `geo_sp_j.lift.comp_256.mean_value`.
          - In exp_check.py, rows_of walks the path; a dict gives its items. row_keys filters keys; stat takes `r[cond]`.
        - **Observations:** v_near (`new` = tolerance), v_come_before, v_come_after. Linked with v_support / v_contradict. Statuses: hyp_supported / hyp_refuted / hyp_untested; item_done / item_queued.

