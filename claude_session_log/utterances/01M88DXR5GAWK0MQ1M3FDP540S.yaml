        2. Key Technical Concepts

        - **Midpoint membership**
          - G_rate / C_rate / R_rate on 120 words (Qwen2.5-1.5B, layers 8 / 14 / 20, judged at L8).
          - Conditions: orig / swap / mixed (240 words, centered).
          - holds = G − R ≥ 0.15.
          - lift = mean over swap and mixed of (G_x − G_base).
        - **Spread ordering:** per-dimension std over the centered 240 mixed words. The top 256 dims ("top band") hold 0.728 / 0.814 / 0.855 of the centered variance at L8 / L14 / L20.
        - **ec family patterns**
