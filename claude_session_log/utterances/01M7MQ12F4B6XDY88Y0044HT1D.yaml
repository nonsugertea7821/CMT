        (A) は登録した基準で反証、(B) は反証されませんでした。どちらも、実行する前に手順と判定の基準を固定してから確かめました（登録は 9b329fd、結果は a4c9c52）。PR #93 に入れて、説明も更新してあります。

        ## (A) 宣言した対称性を実装が壊すと欠陥になる → 反証
        - runtime.py の 1 か所を変えた変異を 98 作りました。このうち振る舞いを変えたのは 34 で、例外を出した 6 を除く 28 を比べました。

        | 変異 | σ と関係のない、実行の記録の検査が失敗した割合 |
        |---|---|
        | σ を壊す | 2/5 = 0.40 |
        | σ を壊さない | 20/23 = 0.87 |

        - p = 1.00 で、向きは仮説と逆でした。
        - ただし、この確かめの検出力は低いです。実行の記録は 1 件だけで、閉世界しか使っていないからです。
          - 閉世界の既定値を「偽」から「真」にする変異（鏡の世界になる）も、開世界を閉世界にする変異も、検査は通りました。
          - 今の実行の記録は、述べていない文の扱いをまったく試していません。
        - なので、この結果は「実装の対称性が健全性と無関係」というより、「σ と関係のない検査が、σ の壊れる場所を見ていない」ことを示しています。

        ## (B) 中身が対を欠くことは、書き換えを引き起こさない → 反証されない
        - まだ使っていない期間（e845f0b → 6bfac2f、49 コミット）で測りました。
        - 対の無いノードの書き換えは 7/370（0.019）、対のあるノードは 0/77、p = 0.26 でした。
        - 基準では「反証されない」なので、支持として記録しました。ただし向きは反証の側で、書き換えが少なすぎて差が見つからなかっただけです。差がないことの証明ではありません。

        ## 3 つの確かめを合わせて言えること
        - 対称性が健全性を示すという直感を支える観察は、いまの体系にはまだありません。
        - 反証も十分ではありません。欠陥の基準（書き換え、検査の失敗）の側が、件数も対象範囲も足りないからです。
        - (A) の確かめで、体系の欠けも 1 つ見つかりました。実行の記録が閉世界しか試さないので、述べていない文の扱いを変えても、どの検査も気づきません。

        (A) をもう一度確かめるなら、σ と関係なく書いた実行の記録を、開世界の例も含めて増やす必要があります。ただし、私がこれから書くと対称性を意識した記録になります。題材の側（subj）の意図から書くなど、書き方を先に決めるのが筋です。
