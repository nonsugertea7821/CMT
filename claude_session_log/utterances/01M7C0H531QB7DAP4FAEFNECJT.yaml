        ## いま回しているもの

        言い換えの検証（E5）を開始しました。一般語の再定義について、文章の側の手段を5つ比べます。

        - 定義文を直前に置く（基準、0.58）
        - 元の語が見える新しい語に改名する（社員 → P社員）
        - 元の語が見えない新しい語に改名する（社員 → 用語08）
        - 改名せず、設問中の語の直後に定義を展開する
        - 定義文を直前に置き、設問中でも展開する

        あなたの言い換えが実際にどの形に近いかは分からないので、この5つのどれに近いか、あるいは別の形かを教えてもらえると、次の比較を合わせられます。

