        懸念12（検査器が名前に頼っていた所）を片付けて、コミット・プッシュしました。E19 の結果も出ています。E3 の再学習（種 1・2）はまだ途中です。

        ## 12. 名前に頼らない検査
        - **閉集合の検査を規則にした。** closed_under・collection_level・op_defined を、Python の手続きから ontology.yaml の規則（law_rule）に移しました。「集まりに属する」「何について閉じているか」「動詞が定義されている」の関係を規則で導いて検査します。`closed_op` / `space` / `check_closed` は消しました。
        - **check_parts も名前で読まなくなった。** これまでは `v_sum` を名前で特別扱いしていました。今は、動詞の holds にある部分の文から「どちらが部分か」を読みます。第三のものを作る動詞なら、限定の相手は new の位置として扱います。検査器のコードに `v_sum` という名前は残っていません。
        - **確認した結果。**
          - 本体の spec は検査も実行の検査も通ります。検査は約 1.5 秒です。
          - わざと誤りを入れた版は、8 種類すべて検出しました。集合の外への限定、合成でできたものが外に出る、合成が定義されていない種類、段の混同、閉じる動詞のない閉集合、二項動詞で閉じる、表示名の向き（合成と部分の 2 件）です。
          - 一つ弱くなった点があります。二項動詞で閉じた場合、原因の違反（closed_op_ternary）は出ますが、そこから連なる違反が 100 件以上一緒に出ます。前は原因の 1 件だけで止めていました。

        ## E19（中立な対照）
        正答率です。かっこ内は margin。rand・m+rand は 5 回引いた平均です。

        | | none | own | swapped | rand | m+rand |
        |---|---|---|---|---|---|
        | G2c（定義の書き換えあり） | 0.38 (−0.36) | **0.79** (+4.31) | 0.54 (+0.05) | 0.52 (+0.03) | 0.59 (+0.21) |
        | G2k（対照） | 0.75 (+1.95) | **0.92** (+6.90) | 0.62 (+1.38) | 0.49 (+0.09) | 0.53 (+0.43) |

        - **own は、同じ大きさのランダムな向きよりはっきり上です。** 正答率は 0.79 / 0.92、ランダムは約 0.5 です。ランダムに引いた 5 回の範囲（G2c 0.46〜0.58、G2k 0.38〜0.58）を大きく超えています。
        - **ランダムなベクトルは中立ではありませんでした。** 答えを壊して約 0.5 に寄せます。G2k では none の 0.75 より下がり、margin もほぼ 0 になります。
        - **G2c の swapped（0.54）は、ランダムと同じ程度でした。** なので、他の語の v を入れても、ランダムより強く逆向きに押していたわけではありません。
        - **m+rand（共通成分を残し、固有成分だけランダム）も約 0.5〜0.6 です。** own の効果は固有成分の向きに大きく依存しています。共通成分だけでは説明できません。
        - 注意点が二つあります。n=24 と小さく、学習も 1 回だけです。

        まだやっていないこと：
        - E19 を spec/exp.yaml（族・観察・仮説）に記録すること。
        - E3 再学習の比較。今の v と cos がどれだけ近いか、正答率が再現するかを見ます。

        再学習が終わったら、比較と記録をまとめてやります。
