        E57 は 4B で走り出しました（#838）。進みは 9 分ごとに確かめます。

        「目的に対してどうか」への答えです。今日の作業は、目的への近さで二つに分かれます。

        **領域の道（今朝の top band と knee の系列）: 目的への寄与は薄くなっています**
        - この系列が確かめたのは、ばらつきの大きな上位 256 次元が中点の帰属を隠している、ということです。上の帯を縮めると類の区画がよく見え、効き目は a0 の半分ほどで頭打ちになります。
          - これは、モデルの中で概念を「読む物差し」の前処理として役に立つ知見です。
        - ただし、#827・#830・#834・#835 は、その前処理のつまみの形を細かく詰める実験でした。
          - 「途中まで縮めるか、捨てきるか」「knee が層で動くか」は、概念認識が一貫するかどうかに答えません。
          - 結論は「十分に縮めれば効く、細部は揺れの中」で足りています。
        - そこで判断として、h_knee_layer_needs_more_pairs（#836 で登録）は優先度を下げ、選ばない側に置きます。
        - 領域の道で目的に効くのは、区画の幾何と概念の振る舞いをつなぐ仮説です。
          - 周回の H4 にある h_ambiguity_is_region_choice・h_qualification_immune_genus などが、それに当たります。
          - 次に領域の道へ戻るときは、こちらへ移ります。

        **検査器の道（E55→E56→E57）: 目的に近い位置にいます**
        - 問いは、「一貫した判定を、モデルの外（検査器）に置いたとき、モデルはその出力を使えるか」です。
        - E55・E56 では、4B は答えが書かれた行は使いますが、依存の辺からたどることはしませんでした。
        - E57 で「答えを写しているだけ」が支持された場合の含意:
          - 検査器はモデルに途中の構造を渡しても使われない、ということになります。
          - 一貫性を出すには、判定そのものを外で出すしかない。これは設計の決定に直接効きます。
        - 反証された場合の含意:
          - 4B は行と定義を突き合わせていることになります。
          - その場合は、モデルの中で一貫させる道も残ります。

        **限界（開示）**
        - どちらの道も、1.5B と 4B の小さなモデルでの観察です。大きなモデルに一般化できるかは、まだ測っていません。

        まとめると、今は検査器の道を重い列で進め、領域の道は「幾何と振る舞いをつなぐ仮説」に切り替えます。周回の指示もこの順に直します。

        ロードマップの位置: d_road_checker（E57 実行中）。d_road_region は H4 の振る舞いの仮説へ切り替え。
