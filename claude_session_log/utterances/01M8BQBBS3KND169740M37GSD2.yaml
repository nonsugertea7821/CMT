      text: |
        辞書の鍵として読み直すと、識別子に求めるものと、これまでの実験の位置が変わってきます。以下は私の読みで、確かめてはいません。

        **辞書の鍵に求めるもの**
        - 一つの鍵が一つの項目を指すこと。文法の定義「識別子は概念の式をちょうど一つ指す」がこれにあたります。
        - 変わらないこと。項目の中身の一部（表示語・読み・宣言の範囲）を書き換えても、鍵は動かない。
        - 項目のどの面からも同じ鍵で引けること。
          - 項目には、体系の側の式、人の側の表示語と読み（#945）、モデルの側の区画やベクトルが並びます。
          - 体系とモデル内部の幾何の対応（ca3c411）は、この同じ鍵で両方の面を引き合わせることで取れます。

        **中身から計算できることは、鍵の条件に入らない**
        - 鍵は項目を引くためのもので、項目の中身そのものである必要はありません。
        - 「識別子＝式」は、鍵と値を同じものにしようとしていたことになります。

        **この見方で、これまでの実験を並べ直すと**
        - **#952（宣言の範囲に依らない、支持）**：鍵が変わらないことの一部を確かめていて、条件に沿っています。
        - **#331・#954（中身から計算できるか、反証）**：鍵の条件ではないことを問うていました。
          - それでも、承認と入金のぶつかりは意味を持ちます。辞書の中で、二つの項目の値（式）が同じになっている、ということだからです。
          - 鍵の問題ではなく、項目の中身が足りない、という読みになります。
        - **#955（いま登録した h_state_by_identifier_parts）**：これも鍵ではなく、値の側（式の部品とモデル内部の状態の対応）を問う仮説です。「識別子の部品」という名前は、鍵と値を同じものとして読んだ名残です。
          - 仮説の式（隠れ状態が form・pre・post・neg に依る）自体は、値どうしの対応を問うものとして読めます。

        **鍵を何にするか**
        - 決めるべきことは、何を鍵にすれば、上の三つの条件（一つが一つを指す・変わらない・どの面からも引ける）を満たせるか、です。
        - いまの体系の名前（subj.approval のような識別子）は、一つ目は型検査で、二つ目は #952 で、すでにかなり満たしています。
        - 残るのは三つ目です。モデルの側から同じ鍵で引けるか、たとえば専用トークン（dedicated_token、exp.yaml にある「概念専用のトークン」）がそれにあたるか。これが次の問いになると思います。

        鍵の条件を体系に書くことや、三つ目を確かめる実験を進めることになったら、先に仮説として登録します。#955 の名前の付け方も、この見方で直すかどうか考えます。
