      text: |
        ご指摘のとおりで、「LLMか検査プログラム」は限定しすぎでした。前例を当たると、実行器は体系の外に「誰か」として置くのではなく、体系の中に「役割」として定義するのが正しい形です。

        ## 前例が示していること

        | 前例 | 「適用」をどう扱っているか |
        |---|---|
        | 操作的意味論 | 言語の意味を「状態 → 次の状態」の書き換え規則として書く。規則どおりに動くものは何でも実行器である |
        | JVM の仕様 | バイトコードと抽象機械を仕様として定める。実装はインタプリタでも JIT でもハードウェアでもよい |
        | Lisp の eval／apply | 言語が自分のインタプリタを自分で書く。ただし最下層は必ず別の何かが動かす |
        | CPU | 取り出し・解読・実行の循環は機械語では書かれていない。回路の因果がそれを担う |
        | 二村射影 | インタプリタとプログラムがあれば、特殊化によってコンパイル済みのコードが得られる |

        どの前例も同じ構造です。「適用」は言語の中の文にはならず、最下層では物理が担います。そのかわり、適用の仕方は仕様として完全に書けます。

        ## 体系への含意

        1. **実行器は役割である**：役割は「定義に依存する実現可能体」と決めてあります。実行器は「書き換え規則の定義に従って状態を移すもの」という役割で、LLM も検査プログラムも CPU もその担い手です。限定は不要になります。
        2. **書くべきものは抽象機械**：状態（個体についての文の集まり）、1歩（動詞の `before` が成り立つとき、それを `after` に置き換える）、停止（当てはまる動詞がない）の3つです。
        3. **動詞はすでに規則の形をしている**：`before`／`after` を持つ動詞は、型つきグラフの書き換え規則です。グラフ書き換え系は一般にチューリング完全なので、個体の層を足せば万能性は動詞の側に自然に出ます。
        4. **実行器どうしは検査できる**：同じ状態と同じ動詞から同じ次の状態を出すか、で適合を判定できます。LLM が実行したものを検査プログラムが確かめる、という分担もここから出ます。
        5. **機械語への道**：二村射影のとおり、抽象機械が定まればコンパイルは実行器の特殊化として得られます。バイトコードとして扱うなら、抽象機械の定義は必須です。ご指摘のとおりです。

        ## 足りないもの

        前例から、書き足す必要があるものが2つ分かります。

        - **枠の法則**：動詞が触れなかった文は変わらない、という決まりです。いまはどこにも書かれていません。
        - **選び方**：当てはまる動詞が複数あるとき、どれを先に適用するかです。決めなければ非決定的な機械になります。

        ## 次の作業

        前回挙げた3点（区別の公理、論理の語のノード化、継承の法則）に、次を加えて進めます。

        - 個体の層（`is` で種類に属する個体と、個体についての文）
        - 実行器の役割と、1歩・停止・枠の法則
        - 選び方は、ひとまず「決めない（非決定的）」としておき、必要になったら足します
