          - 01M7PCX8JMNZWDQT467W9K3EZC:「何故型階層が現状の定義で書けないのかを、他のメタ表現、計算機科学や幾何学と類似して導いた方がいい」
          - 01M7PGT2J68GNQE3Y95REZ80BM:「さっきの座標、幾何的な定義と類比しよう」
          - 01M7PJ4GEXC5A9GTEYRNY6A5EX:「ちょっと整理して。aboveとD2の解釈の関係、幾何における類比」
        - **物理:**
          - 01M7MPHVGEF6DSPY6CBYCE6HQK:「物理学や量子力学の対称性にはない？」
          - 01M7MRCADWEJ2WY8G9QMGDZRNC:「「開いている」のは時間方向だ。特定のフレームから次のフレームの概念差分が常に増大し続ける事が証明条件なんだよ」

        **その流れで立った仮説の今の状態:**

        | 系統 | 仮説 | 状態 |
        |---|---|---|
        | 幾何（上位の順序） | h_above_sound（上位の偽は、限定の欠けに依存する） | 反証。限定の欠けで示されない上位の偽が 1535 組残った |
        | 幾何 | h_above_closed（上位の順序は extends に依存する） | 未検証 |
        | 幾何 | h_above_individual（個体の深さは上位の順序に依存する） | 未検証 |
        | 物理（対称性） | h_symmetry_soundness | mixed |
        | 物理（時間方向） | h_open_runtime（宣言の範囲は状態に依存しない） | 支持 |
        | 物理（時間方向） | h_open_declaration | 反証 |
        | 物理（時間方向） | h_w_from_frames（最上位の置き場は、後の状態の痕跡に依存する） | 未検証 |

        **つながり（私の読み）:**
        - h_tops_derivable が外れたのは、「静的な生起体」でした。生起体に置かれているのに、シグネチャ上では変化を持たないものです。
        - 時間方向の類比で言えば、生起体は「フレームをまたいで差分を残すもの」です。それなのに、今のシグネチャは一つのフレームの中しか見ていません。
        - h_w_from_frames は、ちょうどこの穴を埋める問いです。最上位を、シグネチャに時間方向（フレームの痕跡）を足したものから導けるかを問います。
        - ここが通れば、その下の格の枠（h_case_frame_by_signature）も、同じ座標の上で問えるようになります。

        正直に言うと、幾何の類比で D2 や上位の順序についてどこまで結論が出ていたかは、私の手元の要約が薄く、ここでは確かなことを言えません。体系に残っているのは、上の表の状態までです。

