        仮説1の結果は**支持**です。PR #356 の Draft を外しました。自動マージの条件に乗る形なので、CI が通れば自動でマージされる見込みです。

        ## 結果
        Qwen2.5-1.5B の層 8 で測りました。中点から最も近い語が、同じ集まりの成員だった率は次のとおりです。

        | 集まり | 率 |
        |---|---|
        | 上位概念（動物・果物・楽器・乗り物・家具） | **0.78**（動物は 1.00） |
        | 上位をまたぐ性質（赤い・丸い・柔らかい・長い・光る） | **0.19**（光るものは 0.04） |
        | でたらめな 8 語 | 0.05 |

        差は 0.59 で、並べ替え検定の p は取りうる最小値（1/252）でした。層 14・20 でも向きは同じです（記録のみで、判定には使っていません）。

        ## 読み
        - 上位概念は、モデルの中でもほぼ一かたまりになっていました。あなたの像の「refer で切り出したものは凸」に合います。
        - 性質での限定は、ほぼ散らばりました。ただ、でたらめよりは少し高く出ています。たとえば「柔らかいもの」は 0.46 でした。
        - これは、限定した集まりが「いくつかの小さな島の寄せ集め」になっている、と読めます。この例でいえば、枕・毛布・羽毛という寝具の島です。前に話した「値段で切ると島に分かれる」の絵と同じ形ですが、島が本当にあるかはまだ確かめていません。

        ## 次
