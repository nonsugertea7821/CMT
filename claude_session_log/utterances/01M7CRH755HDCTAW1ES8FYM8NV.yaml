      text: |
        もっともな指摘です。振り返ると、あなたの直観が効いた場面には共通点があり、私の側の欠落もはっきりしています。

        ## 何が違っていたか

        あなたは毎回、実験の枠そのものが置いている前提を問い直していました。

        - 「再定義を避ける」は課題の回避だ、という指摘
        - 「推論力」という語の中身を問う指摘
        - 再定義を「推論の内容が変わること」と捉え直す抽象化
        - 層の境界が曖昧なら依存も分布しているはずだ、という指摘

        私は結果が出るたびに名前を付けて、同じ枠の中で次の実験を足していました。しかも、指摘されたあとで私が挙げた裏づけ（複数層に分けた編集の方が強い、定義と適用は別経路になりうる、など）は、実験を組む前から知っていたことです。足りなかったのは知識ではなく、「この実験の設計はどんな前提を埋め込んでいるか」「この結果は実験の外で何を意味するか」を、自分から問う手順でした。

        今後は、結果が出るたびに次の3点を書き出し、次の実験を並べる前に示します。

        1. その実験が埋め込んでいる前提
        2. 結果を一般化したときの含意
        3. 既に知っていることのうち、その前提に反するもの

        ## いま自分で問い直してみた結果

        口先だけにならないよう、現時点の設計に対してやってみました。

        **問い直した前提**: 概念ベクトルは「足し込むだけ」の操作です。足し込みで変えられるのは、モデルが既に持っている別の概念へ語を付け替えることまでで、新しい規則（「25歳未満」「10個以上」のようなしきい値）を作ることはできないのではないか。

        **そこからの予想**: 24概念を「範囲を伸縮する型」と「数値や暦の規則で決まる型」に分ければ、ベクトルは前者で成功し、後者で失敗するはずです。

        **既存の結果を集計し直した結果**（各12概念、数値は衝突する設問と衝突しない設問の両方に正答した概念数）:

        | 条件 | 規則型 | 付け替え型 |
        |---|---|---|
        | 1.5B 定義文を直前に置く | 1 | 9 |
        | 1.5B ベクトル（定義＋適用例） | 7 | 11 |
        | 4B 定義文を直前に置く | 7 | 7 |

        - **予想は半分当たりました。** ベクトルは付け替え型でほぼ成功し、規則型では半分強にとどまります。学習の損失も規則型の方が5倍高いです。ただし「できない」ではなく「苦手」でした。
        - **予想していなかった発見が1つありました。** 1.5B が文章の定義に従えなかったのは、ほぼ規則型に限られます。付け替え型は定義文だけで12概念中9概念が正答していました。以前「推論力の不足」と呼んだものの実体は、数値や暦の照合ができないことだった、と特定できます。
        - 注意点として、型の分類は結果の一部を見たあとで行っています。基準は機械的ですが、事前に決めた分類ではありません。

        ## 含意

        「一般語の再定義」は一枚岩ではなく、少なくとも2種類ありました。

        - **付け替え型**は、既存の意味空間の中での移動です。ベクトルで扱えます。
        - **規則型**は、新しい計算の追加です。足し込みでは不十分で、重みの修正か、検証側の規則として外に持つ必要がありそうです。

        これは設計の「修飾の役割」の区別にも関わります。集計の結果は `experiments/README.md` に記録し、プッシュ済みです。E8 は実行中です。
