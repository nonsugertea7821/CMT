      text: |
        そういうことですか。私はまだ「語のラベル」を原子として扱っていました。おっしゃる原則では、原子は語ではなく、次の3つだけになるはずです。

        1. 最上位の2つ（持続体と生起体）
        2. 修飾の操作そのもの（上位に軸と値を付ける）
        3. 述語論理の結合子

        動詞は生起体の種類、名詞は持続体の種類で、関係は「ある生起体に、ある持続体がどう関わるか」を圧縮した書き方にすぎない、と理解しました。

        ## この原則で書き直すと、どうなるか

        作り直す前に、解釈が合っているかを例で確かめさせてください。これまで2回、読み違えたまま全体を作り直しているためです。

        **動詞型の関係**は、生起体の種類と、そこに関わる持続体で定義します。

        ```
        delivers(x, y)    iff  exists p. instance_of(p, delivering) and agent(p, x) and patient(p, y)
        substitutes(x, w) iff  exists p. instance_of(p, substituting) and agent(p, x) and patient(p, w)
        ```

        ここで `delivering`（届ける）は実体のツリーにある生起体で、概念式で書かれます。

        **「持つ」型の関係**は、担い手に宿る質（持続体）で定義します。

        ```
        has_unit(x, u)   iff  exists q. instance_of(q, unit) and inheres_in(q, x) and has_value(q, u)
        has_count(x, n)  iff  exists q. instance_of(q, count) and inheres_in(q, x) and has_value(q, n)
        ```

        **関わり方**（行い手である、対象である）も、役割という持続体で定義します。

        ```
        agent(p, x)  iff  exists r. instance_of(r, agent_role) and inheres_in(r, x) and realized_in(r, p)
        ```

        こうすると、いま 50個ある原子関係は、ほぼすべてが定義に置き換わります。

        ## 底に残るもの

        私の見立てでは、どうしても定義できずに残る関係は、次の数個です。

        | 関係 | 意味 | 残る理由 |
        |---|---|---|
        | inheres_in | 質や役割が、担い手に宿る | 持続体どうしを結ぶ。動詞に還元できない |
        | realized_in | 役割や傾向性が、過程の中で実現される | 持続体と生起体を結ぶ、唯一の橋 |
        | part_of | 部分である | 同上 |
        | precedes | 前にある | 順序 |
        | has_value | 質が、ある値を取る | 軸と値をつなぐ |
        | is_about | 情報が、何かについて述べる | 情報の本質 |

        これに、木の構造から来る「〜の一種である」が加わります。

        ## 判断を仰ぎたい点

        2点あります。ここが決まらないと、また外した作り直しになります。

        1. **上の6個は、原子として残してよいか。** それとも、これらも生起体と持続体の圧縮として書くべきでしょうか。たとえば「宿る」を「宿っているという状態」という生起体として扱う書き方も考えられますが、BFO の流儀からは外れます。
        2. **質の種類どうしを、何で区別するか。** 「単位」と「言語」は、どちらも「情報に宿る質」で、修飾の式だけでは同じになってしまいます。私の案は、取りうる値の集合で区別することです（単位＝{名前、文、文章…} を値に取る質）。値は「抽象に対する具体」なので、ここが意味の底になります。これでよいでしょうか。

        ## 実験の状況

        - E8（複数の層に薄く分けたベクトル）: 学習の終盤です。まもなく評価に入ります。
        - E9（途中を書き出させる実験）: E8 の後に自動で始まります。

        結果が出たら `spec/` に記録します。語彙の作り直しは、上の2点への回答を受けてから着手します。
