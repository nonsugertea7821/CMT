      text: |
        人間の見分けが不正確なことの説明として、次元が少ないことはありうると思います。ただ、もう一つ別の説明もあります。また、「完全な見分けには無限の次元が要る」が成り立つかどうかは、何を見分けるかで分かれます。

        **1. 人間の見分けが不正確な理由として、二つの候補があります**
        - **次元が少ない（ご指摘の筋）**
          - 人間の作業記憶は、一度に数個のまとまりしか保てません（Miller 1956、Cowan 2001）。
          - そのため、たくさんの立体を同時に分けて持つことができず、影が重なる、と読めます。
        - **境界そのものがぼやけている**
          - 「はげ」や「山」のように、境界の場所に事実がない概念があります（曖昧さ、砂山のパラドックス）。
          - この場合、次元をいくら増やしても、正確な見分けにはなりません。分けるべき線がもともと無いからです。
          - 登録済みの `h_ambiguity_is_region_choice`（曖昧さは、領域の選び方である）は、こちらに近い仮説です。
        - この二つは、次の点で区別できるはずです。
          - 次元が足りないことが原因なら、次元を増やす（または文脈に定義を入れる）と見分けがよくなります。
          - 境界がぼやけていることが原因なら、どうしても揺れが残ります。

        **2. 無限の次元が要るか**
        見分ける対象によって答えが分かれます。
        - **互いに交わらない凸の立体が有限個なら、有限の次元で完全に分けられます。**
          - 交わらない凸集合の間には、必ず平面を一枚通せます（分離超平面定理）。
          - 有限個なら、その平面の数も有限です。
        - **無限の次元が要るのは、次のような場合です。**
          - 概念の数に上限がない場合。自然言語のように、いくらでも新しい区別を作れる場合がそうです。
          - どこまでも細かい区別を許す場合。
          - カーネル法の RBF カーネルは無限次元の特徴空間にあたり、どんな有限の点の集まりでも分けられます。「無限の次元なら何でも分けられる」は、数学の上でもこの形で知られています。
        - ですから「完全な見分けには無限の次元が要る」は、「開かれた（上限のない）概念の集まりについては」と限れば、もっともらしい主張です。

        **3. このプロジェクトにとっての含意**
        - CSCL の体系は、有限個の概念を有限の式で定めています。
        - 式の部品の数が有限なので、必要な次元も有限で、上から抑えられるはずです。
          - これは見込みで、確かめてはいません。
        - 読み替えると、「無限の次元が要る開かれた概念を、式で閉じて、有限の次元で完全に見分けられるようにする」ことが、この言語の役目だと言えます。

        **4. 登録について**
        今回は仮説として登録していません。今の体系には「無限」や「完全な見分け」を書く語がなく、式にできないためです。式にできないことも、一つの観察です。
        - 有限の側の主張なら、式に近い形で書けそうです。たとえば「体系の兄弟の見分けに要る次元は、式の部品の数で抑えられる」です。
        - これを測る手順が見えた段階で、登録します。

