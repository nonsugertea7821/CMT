      text: |
        いいえ。完全展開した定義を直接ベクトルにする方式は、まだ試していません。

        ## これまでにやったこと

        E3-expr は「直接ベクトル化」ではありませんでした。

        - **教師の中身:** 定義は subj の中だけを展開したものです。上位の体系の概念は名前だけで、完全な展開ではありません。
        - **作り方:** 案3（学習）です。モデルの重みは固定し、概念ごとのベクトル1本を勾配で最適化しました。目的は、そのベクトルを語の位置に足したとき、モデルが展開した文を暗唱でき、適用例の二択にも正答することです。
        - **展開した定義が入る場所:** 損失の教師としてだけ入ります。展開した構造をそのままベクトルに写す処理はしていません。

        ## docs/design.md 5.5 の3案との関係

        docs/design.md の 5.5 には、C1 のベクトルの作り方として3案が書かれています。

        1. SAE の特徴の方向を使う。
        2. 兄弟概念の定義文を読ませたときの活性化の差を使う。
        3. 概念ごとにベクトルを学習する。

        これまでの実験（E3・E6・E8・E3-expr）は、すべて案3です。案1と案2は実施していません。「子 = 親 + 差分」の形で持つという設計も、まだ実装していません。

        ## 「完全展開を直接ベクトル化する」をどう具体化するか

        - **(A) 合成型:** 概念式の構造に沿って、ベクトルを組み立てます。例えば「顧客 = v(法人) + v(契約を結ぶ, to)」のように、上位のベクトルに限定ごとの差分を足し、末端まで再帰します。
          - docs/design.md の「子 = 親 + 差分」をそのまま具体化した形です。
          - 共有する上位（主体・組織など）のベクトルを、概念どうしで使い回せます。
          - 正本の変更を局所的に反映できます。
        - **(B) 読ませて写す型:** 完全展開した文をモデルに読ませ、その隠れ状態から差分を取ってベクトルにします。docs/design.md の案2を、定義文から完全展開に置き換えた形です。
          - 学習が不要です。1語あたり約8分の学習（今回の24語でほぼ1日）がなくなり、前向き計算1回で済みます。
        - **(C) 案3を完全展開の教師で学習し直す:** 一番手軽ですが、今回の結果から、教師の書式による差は小さいと予想しています。

        ## 見込みと注意

        - E3-expr では、概念式の文を文脈に置くと崩れました。一方、ベクトルだけなら日本語の定義文で教えた場合とほぼ同じでした。このことから、CSCL はモデルに読ませるより、ベクトルの作り方の側で生かすほうが筋がよさそうです。
        - (A) が一番この研究の主張に沿います。体系の構造がそのままモデルへの接続になるからです。ただし、上位の概念の単位がモデル内で定まっているか（docs/design.md が挙げる弱点）が成否を分けます。
        - (B) は E6 の結果に注意が要ります。単一層のベクトルは、言い換えの設問に転移しませんでした（第4層の define_choice で 0.38）。読ませた隠れ状態の差が設問で効く方向と一致する保証はありません。
        - どれも各群24問・1モデルでの判断なので、まず数語で試して効くかを見るのがよいと思います。

        (A) か (B) を、新しい実験として計画しますか？ 進めるなら、まず spec/exp.yaml に仮説と残り項目を足し、そのあと実装します。
