           - User's architecture: (1) LLM interprets human intent into concept expressions and agrees with the human; (2) concept expressions written in a controlled language (genus + differentia, no homonyms, canonical form determines identity); (3) term server; (4) typed graph with lineage/versions/replacement; (5) LLM generates implementation+tests from concept expressions; (6) verification (reference check, vocabulary lint, tests). User considers both changing the model side and externalizing.
           - Standing instructions: "次の一手が出る限りは主体的に続けて" with an hourly timer as a safeguard; "やるべきことは全部やりたい。ただし順序はFableに任せる"; runtime is not a concern; if license/terms problems arise consider workarounds (I stated I would not bypass terms themselves, only switch to ungated models); experiments must be in Japanese (design doc may be Japanese); when asked to judge order, think independently of the user's remarks.
