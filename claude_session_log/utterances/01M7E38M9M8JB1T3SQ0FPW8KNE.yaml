        2. Key Technical Concepts:
           - Experiments on open models (CPU only, 4 cores, 15GB RAM; venv at `/home/user/venv`; HF cache ~12GB): Qwen2.5-0.5B/1.5B-Instruct (fp32), Qwen3-4B (bfloat16, `enable_thinking=False`, Apache 2.0). Two-choice logit margin with both option orders; conflict (G2c) vs control (G2k) items for 24 redefined common words; G1 confusables, G3 sibling new words, G4 replaced terms.
           - Concept vectors: one vector per concept added at the label's token positions at a layer's output (hook), body weights frozen; teachers: definition recital (def), application examples (qa), both (defqa); multi-layer variant (E8).
           - Main empirical findings (all recomputed from result files by the checker): text definitions of redefined common words are not followed well (4B: adjacent 0.75; in a 55-definition glossary 0.46 ≈ none 0.38; new words 1.00); cause is the number of preceding definitions (not length, distance or depth; 0→0.71, 14→0.62, 27+→0.50–0.54; kind irrelevant); opaque renaming helps on 4B (0.92); QA-taught vector at L8: 0.79/0.92, transfers across formats and to free generation for verdicts, 24 vectors together fine; recital-only vector doesn't transfer to application; no vector transfers to untaught usage (definition paraphrase choice ~0.5 vs 0.96 with text); L14 worse; E8 multi-layer inconclusive (training unconverged, 16/24 loss>0.3); E4 modifier composition inconclusive (2/3 pairs unconverged; converged pair 0.88 on unseen genus); rule-type vs remap-type split (post hoc); E9 on 1.5B: scratchpad does not help rule-type (0.33→0.25) and hurts remap-type (0.83→0.58, control 0.83→0.42); model miscompares numbers ("22歳は25歳以上").
           - Ontology principles reached with the user: only 持続体 (continuant) and 生起体 (occurrent) are primitive (only they have gloss); relations are entities (verbs = occurrents with from/to ends) connected by the graph; modification = occupying a position (from/to/new) of a verb, optionally fixing the other end, with negation and quantification; modifiers live in the BFO tree (quality/realizable); classification = axis (relation viewed abstractly) + value (concrete; fixed value or function such as range predicates); count axis applies to any relation, order axis is from `after`; verbs are defined as holding/changes of base state relations; "について述べる" (refer) is the system's own act — undefinable but restrictable; role = realizable depending on a definition (disposition depends on bearer's quality); redefinition gives a word a role (assigned meaning) vs prior meaning (disposition); three "dimensions" 生起・持続・修飾; 関係・分類・修飾 as dimension-changing operations (user has intuition, not definitions).
           - Turing-completeness discussion (pending): mod=AND, neg=NOT → NAND (combinational completeness only); missing: instance/state layer, execution semantics, unbounded repetition, arithmetic; dynamic verbs are rewrite rules; versioning gives history/memory; LLM as stateless interpreter + system as memory; recommendation to keep static definitions decidable and put universality on the dynamic-verb side; open question to user: where to place universality.

