      text: |
        本線 a の最初の仮説 `h_rule_roles_by_signature` を確かめ、結果は反証でした（PR #478）。

        **何を試したか**

        型検査は今、法則の役割（前提・導く文・求める文）を、v_assume などの動詞の名前で読んでいます。今回は名前で読むのをやめ、役割の名詞の式から読めるかを試しました。名詞の式は、前提を「前の状態」、導く文を「後の状態」、求める文を「どのステップでも成り立つ状態」を指す形に書き替えました。

        **結果**

        役割は 3 つとも名詞の式から読めました。法則の集まりも元と同じでした。ただ、事前に決めた判定のうち 2 つが外れました。

        - **誤りが 3 件出た。** 原因は、体系の法則が書き方を咎めたことです。一つは、「後の状態を指す」という中身にはすでに名前があるのに、名前を使わずに書いたためです。もう一つは、「法則の前提」と実行器の「前の状態の確かめ方」が同じ中身になったため、その中身に名前が要ると咎められたものです。
        - **関係の差が 793 行出た。** ほとんどは、事前登録の除き方に穴があったせいです。書き替えた名詞の式を表す行には名詞の名前が現れないので、除き漏れました。事後に数え直すと、残る差は 9 行で、どれも定義の参照の行でした。法則を評価した中身は変わっていません。ただしこれは事後の読みなので、判定は反証のまま動かしていません。

        **含意として登録した仮説（PR #479、登録だけ）**

        - `h_rule_roles_by_named_mod`: 名詞を名前のある中身で書けば、誤りは 0 になり、関係の差は定義の参照の行だけに収まる。除き方は事前に直して決めます。
        - `h_premise_agrees_pre_rule`: 法則の前提と、実行器の前の状態の確かめ方は、式の上で同じものである。体系の法則が自分で見つけた同一性の候補です。

        どちらもロードマップの識別子化（`d_cscl_display_derived`）に結びました。

        #478 は Draft を外したので、あなたが確認してマージする番です。#479 は自動マージを待っています。

        ロードマップ: 本線 a（識別子化）の先頭、法則の役割を名前でなく式で読む段を一周しました。次の周回では、#479 の `h_rule_roles_by_named_mod` か、次の `h_frame_both_sides` に進みます。
