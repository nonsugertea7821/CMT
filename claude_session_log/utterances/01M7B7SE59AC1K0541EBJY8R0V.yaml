      text: |
        「カーネル」を、LLMの外側にあって状態を持ち続ける中核、と読んで答えます。その読みなら、必要だと考えます。

        ## 文脈として渡すだけでは弱い理由

        変更を文章として毎回読ませても、モデルの重みに入っている元の意味と競合します。元の用法が強い語ほど、変更後の定義が押し負けます。変更が確実に効くには、重みと同じ強さで計算に入る必要があります。

        ## 「重みとして扱う」方法

        | 方法 | 内容 | 弱点 |
        |---|---|---|
        | 重みの直接編集・継続的な追加学習 | 変更のたびに本体の重みを書き換える | 編集が関連知識に波及しない。回数を重ねると劣化する。取り消しや版管理ができない |
        | 変更ごとの差分重み | 1つの変更を小さな追加重み（低ランクのアダプタ）にし、足し引きで合成・取り消しをする | 数が増えると差分同士が干渉する |
        | 計算に直接入る外部記憶 | 記憶を注意機構が引ける鍵と値として持たせる。重みを変えずに重みに近い効き方をする | 本体が元の意味で上書きする余地が残る |
        | 活性化への加算 | 概念に対応するベクトルを中間層に足す | 粗い制御しかできない |

        あなたの構成に最も合うのは2番目です。変更が差分で、系譜が差分の連鎖になり、置換は差分の差し替えになります。「親＋差分」の構造と版管理が、そのまま重みの側に写ります。概念式から差分重みを生成するネットワークを使う研究もあります。

        ## 重みを正本にしない

        カーネルが持つ正本は記号的な変更記録のままにして、重みはそこから**コンパイルした派生物**として扱うべきだと考えます。ソースコードとバイナリの関係です。

        - 重みは人間が読めず、差分の比較も監査もできません。
        - 派生物なら、本体のモデルを入れ替えても正本から再生成できます。
        - コンパイルが正しく効いたかは、あなたの構成の検証層（テスト）で確かめられます。

        ## 変更が多発する前提への対応

        変更のたびにコンパイルするのは重いので、二段構えにします。

        - **新しく不安定な変更**: 文脈や外部記憶として保持する。
        - **安定した変更**: 定期的に重みへ固定する。

        人間の記憶でいう、海馬から新皮質への固定化と同じ分担です。

        ## 未解決の点

        - 差分重みが数百、数千と積み重なったときの干渉。
        - 1つの変更が、関連する概念まで正しく波及するか。重みの編集全般でまだ解けていません。

        この2点は、概念体系のグラフが波及範囲を明示している分、通常の重み編集より有利な位置にあります。どの概念に影響するかが分かっていれば、その範囲を学習と検証の対象にできるからです。
