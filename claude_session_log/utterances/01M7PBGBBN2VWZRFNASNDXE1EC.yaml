        棚卸しが終わりました。コメントは今 431 個あり、大半は claims.yaml の観察の経緯です。言語の定義そのもの（cscl/library）にあるのは 76 個で、その半分は見出しでした。

        ## 結果（sys_comments、手順は先に登録）

        | ファイル | 合計 | 見出し | 経緯・観察 | コードについて | 意味の説明 |
        |---|---|---|---|---|---|
        | cscl/design/claims.yaml | 277 | 18 | 136 | 13 | 110 |
        | cscl/library（5 ファイル） | 76 | 41 | 6 | 4 | 25 |
        | exp/src（2 ファイル） | 64 | 52 | 3 | 1 | 8 |
        | cscl.yaml | 14 | 4 | 1 | 2 | 7 |
        | 合計 | 431 | 115 | 146 | 20 | 150 |

        - 前回数えた 406 個より増えているのは、この会話で私が claims に観察の経緯を書き足してきたからです。
        - 分類は語で機械的に決めています。そのため、複数行にわたる経緯の 2 行目以降は「意味の説明」に入ります。claims の「意味の説明」110 個の多くは、実際にはそれです。

        ## 読み取れること

        - **言語の定義（cscl/library）の中身は少ないです。** 見出し 41 個を除くと、意味の説明 25 個、経緯 6 個、コードについて 4 個です。ここは 1 つずつ「式にする、または消す」で片付けられる量です。verb_ref の注釈のように、式にすると誤りが消える例が混ざっている可能性もあります。
        - **exp/src はほぼ見出しです。** 概念の共通の上位で導けるか確かめたうえで、消せます。
        - **大きいのは claims の観察の文章です。** ただ、観察の数値の部分は、すでに事実（`v_refer` と `v_level` など）になっています。コメントに残っているのは、手順の経緯と「実行の後の読み」（解釈）です。解釈を式で述べるには、まだ語彙がありません。例えば「この観察をこう読む」を表す動詞です。

        ## 進め方の案

        1. **cscl/library の 76 個**：見出しは消し、意味の説明は式にするか消し、経緯とコードについての記述は消します。式にするものは、今回と同じく手順を登録して測りながら進めます。
        2. **exp/src の 64 個**：主に見出しなので消します。
        3. **claims の 277 個**：解釈を述べる語彙を先に決める必要があります。ここは設計の判断です。
        4. **最後に禁止を書きます。** 文法（syntax）に「定義のファイルはコメントを持たない」と書き、読む側が字句の上で見つけたら誤りにします。

        決めていただきたいことが 1 つあります。今は観察のたびに、私が claims に解釈のコメントを足しています。禁止の方針と食い違うので、どう扱うかを決めたいです。

        - **(a)** 禁止が入るまでは今のまま書き、3 でまとめて移す。
        - **(b)** 今から、解釈は commit のメッセージと会話にだけ書き、claims には事実だけを足す。

        私の勧めは (b) です。これ以上、移す量を増やさずに済みます。

        そのうえで、1（cscl/library）から始めてよいですか。記録は 2ff8be5 まで claude/cross に push してあります。
