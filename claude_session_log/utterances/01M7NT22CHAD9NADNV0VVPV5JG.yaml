      text: |
        同じ方法で調べましたが、この履歴では v_compute と v_speak は**見分けられませんでした**。見分けに必要な出来事が、履歴に1つもなかったためです。手順は実行の前に登録してプッシュし（e1f…ではなく、登録はその1つ前のコミット）、結果を記録しました（b550bf0）。型検査・同期の検査は通っています。

        **何を見たか**
        - 2つの式の違いは、v_speak の post にだけある `depend(to, from)`（作られたものは作ったものに依存する）です。
        - 実行の中でこの違いが効くのは、法則 depend_end_exists（依存する始点が在れば、終点も在る）を通してだけです。ほかの動詞の pre が読む depend は、始点が役割・実現体・性質のときだけで、作られた情報には当たりません。
        - したがって、作ったものが在らなくなった後も、作られたものが在り続ける出来事があれば、発話の読みでだけ法則が破れます。
        - 手順は sys_confusion と同じです。結果ファイルを作られたもの、その `_source` のスクリプトを作ったものとし、履歴の削除を「在らなくなる」として、2つの読みで歩みました。

        **結果**

        | | 値 |
        |---|---|
        | `_source` を持つ結果ファイル | 26 |
        | 作る歩み（計算の読み・発話の読み） | 26/26・26/26 |
        | 作ったものより長く残ったファイル | 0/26 |
        | 履歴の .py の削除 | **0**（削除は全部で 5、どれも .py 以外） |

        **手順の欠け（実行後に気づいたので記録に残しました）**
        同じコミットでスクリプトと結果を足すと、名前の順で結果を先に読みます。そのため source_in_git が 11/26 と低く出ています。見分けの結果には影響しません。

        **この結果から言えること**
        - 体系の中で、計算と発話を状態で分けているのは `depend(to, from)` だけです。その中身は「作られたものは、作ったものより長く在ることができない」です。
        - 先の直し方の案（v_compute に depend(to, from) を足す）は、「計算結果はスクリプトより長く残れない」と主張することになります。直観には反しますが、この履歴では確かめられません。このため、パッチは入れないままにしています。
        - 同じ疑いは v_speak 自身にも向きます。書かれた発話は、ふつう話し手より長く残ります。

        **次の候補**
        1. 作ったものが消える出来事を持つ外の事実を探す。例えば、実験で使ったモデルが消えて、結果だけが残る場合です。
        2. v_speak の `depend(to, from)` 自体を観察の対象にする。発話の産物が話し手より長く残る例が見つかれば、v_speak の式のほうが誤りで、計算と発話は今の書き方では同じ式になります。

        私は 2 を勧めます。どちらにするか指示してください。
