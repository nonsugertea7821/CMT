        - 計画:
          - [済] 1.5B で語の名前を意味のない名前に変えたら、理由を言う使い方が上がり、一貫して使えた割合も上がった（E63）。4B では、当てはめる使い方が一貫して使えた割合の足を引っぱっていた → 4B では、当てはめる使い方を上げるのが先だと決まった。
          - [今] 1.5B で、理由を言う使い方をベクトルで直接上げたとき、一貫して使えた割合も付いてくるか（E64、走っている） → 1.5B で足を引っぱっているのが、理由を言う使い方かどうかが決まる。
          - [次] 足を引っぱる使い方を上げる手を、正本から作る手順に組み込む → ベクトルを作る部品が、一貫性を上げる部品として使えるかが決まる。
