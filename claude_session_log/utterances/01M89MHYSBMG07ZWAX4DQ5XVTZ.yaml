      text: |
        フックが挙げた文を一つずつ見ました。一つは仮説として登録し、PR #866 にしました。

        - **「文章の側を直接書き換えない」**: 読んだ事実に、私の言い換えが混じっています。採択済みの決定に書かれているのは「変換した文は正本に頼る」までです。「直接書き換えない」は、そこからの私の読みです。
        - **「API だけのモデルは文章で教えるしかない」**: 読んだ事実です。採択済みの 2 つの決定から言えます。API だけのモデルは文章に頼り、概念ベクトルは重みのあるモデルに頼ります。
        - **「仮置きの部品」の見出し**: 主張ではありません。
        - **「部品の組み合わせが式に書かれていない」**: 確かめた事実です。grep で、本設計が出てくるのは目的の文の 1 か所だけでした。
        - **「鎖は私の頭の中と commit の文にしかない」**: 確かめていない主張です。PR の本文などに書いてある可能性を調べていません。
          - この裏には「本設計の部品を式で書けば、各実験が設計のどこを確かめているかが体系から読める」という提案があるので、仮説として登録しました（PR #866、`h_design_consists_of_adopted`、目的 d_goal に結んでいます）。
          - 式は「本設計は、型付きグラフ・変換した文・概念ベクトル・文章での注入から成る」です。
          - この 4 つで足りるかは、確かめる側で問います。
        - **「見ていないところで進んでいると感じられた原因は、たぶんここ」**: あなたの受け止め方についての私の推測です。体系についての主張ではないので、登録していません。当たっているかは、あなたが判断してください。

        ロードマップの位置:
        - 目的: モデルに言葉の新しい意味を教え、4 つの使い方で一貫して使えるようにする。一貫して使えた割合で測る
        - 設計: 今は、本設計の組み立てが名前しかない。#866 でそれを式で書く仮説を置いた。E64 は、仮置きの「説明は文章に頼る」とは逆向きの手（説明をベクトルで教える）を使う
        - 計画:
          - [済] 一貫して使えた割合を測り、大きいモデルでは「当てはめる」が足を引っぱると分かった（E58・E63） → 成績を上げるには、足を引っぱる使い方を上げればよい
          - [今] 小さいモデルで「理由を言う」を上げる（E64、学習中） → 小さいモデルでは「理由を言う」も足を引っぱっているかが分かる
          - [次] 本設計の部品を式で書いて、足りるかを確かめる（#866） → どの部品を変えれば成績が上がるかを、体系から読めるようになる
          - [先] 足を引っぱる使い方を上げる道（検査器か区画）を本設計に組み込み、定義を置くだけのときより成績が上がるかを測る → 本設計で新しい意味を教えられるかが言える
        - 分かれ目: E64 で成績が付いてくれば、「判定はベクトル、説明は文章」という分担を見直す。付いてこなければ、分担はそのままで「当てはめる」を上げる部品に絞る
