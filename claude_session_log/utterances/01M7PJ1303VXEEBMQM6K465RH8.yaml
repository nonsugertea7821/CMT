        その仮説は `h_tops_derivable` で、**反証**になっています。ただし反証されたのは「シグネチャで書けるか」ではありません。「シグネチャで書いた定義に、今の体系の置き方が一致するか」です。

        ## 仮説と導いた定義

        - 中身は「最上位の置き場は、シグネチャから定まる分類に依存する」です。
        - 持続体と生起体を、self と same とフレームの変化で次のように書きました。
          - **持続体**：どのフレームでも自分と同じであるもの（∀t, t'. same(self_t, self_t')）
          - **生起体（D2、あなたが選んだ方）**：前後のフレームを同じでなくするもの（¬same(frame_t, frame_t+1)）
        - 判定は、どれか一つでも不一致があれば反証、と先に決めてありました。

        ## 結果（`sys_tops`）

        | 確かめたこと | 結果 |
        |---|---|
        | 個体 1054 がすべて持続体の下にある | 合う |
        | 動的な動詞（pre か post を持つ）36 がすべて生起体の下にある | 合う |
        | 静的な動詞（holds だけ）82 が生起体の下にない | **合わない**：82 とも生起体の下にある |
        | 生起体の名詞 49 がすべて動的な動詞に届く | **合わない**：届くのは 14 |
        | ontology.concept が動的な動詞に届く | **合わない**：届かない |

        外れた 3 点が反証の根拠です。

        ## 読み

        - **持続体は、self と same の定義で今の体系とそのまま合いました。**
        - **食い違うのは生起体の側です。** 今の体系は「動詞ならすべて生起体」と置いています（前回の一覧の 1119 行の検査「動詞は生起体の下に置く」がそれです）。D2 で読むと、静的な動詞はフレームを変えないので、生起体ではなく関係になります。直す先は次の二つのどちらかで、まだ決めていません。
          - 体系の置き方を D2 に合わせる（静的な動詞を生起体から外す）
          - 定義を D1 にする（「限定 λself. v(self, X) の v であるもの」。今の置き方と合うが、展開することを使わない）

        ## 今回の結果とのつながり

        今回の `sys_above_sound` で根拠のない偽が 941 組出たのは、最上位が式を持たない（座標がゼロ）からでした。`h_tops_derivable` で書いた定義も、式（修飾の座標）にはなっていません。フレームの上の性質で、実行の側で決まるものです。なので今の体系では、持続体と生起体の区別は次のどちらにも現れず、名前だけが担っています。

        - 型検査の静的な座標（式の包含）
        - 名前での読み（1119 行のような検査）

        一致しなかったことと座標がゼロだったことは、同じ欠けを別の側から見たものだと思います。

        この続きをどちらから考えるか決めてください。
        - 生起体を D1 と D2 のどちらに寄せるか
        - 持続体と生起体の区別を、静的な座標で書けるかどうか
