      text: |
        名前を「制御体系言語」に改め、3つの語を別々のノードとして正本に置きました。検査は通っており、プッシュ済みです。

        ## 3つの語

        | 語 | 指すもの |
        |---|---|
        | 制御体系言語 | 書き方そのもの。言語 |
        | 制御体系言語の体系 | その言語について述べ、概念式を部分として持つ、情報の全体 |
        | 概念式 | 体系が持つものの一部。1つの概念についての記述 |

        ## 正本での式

        ```
        制御体系言語       = 言語のうち、設計されたもので、定義を書くのに使われるもの
        制御体系言語の体系 = 情報のうち、制御体系言語について述べ、概念式を複数、部分として持つもの
        概念式             = 定義のうち、制御体系言語で書かれ、制御体系言語の体系の部分であるもの
        ```

        前回の提案どおり、概念式は定義の下に置きました。自然言語で書かれた定義と概念式が、同じ「定義」の下で、書かれた言語と所属の違いとして並びます。

        ## 実物との対応

        - **制御体系言語**: `spec/ontology.yaml` の書き方（冒頭に書いてある規則）。
        - **制御体系言語の体系**: `spec/ontology.yaml` の全体。
        - **概念式**: その中の、1ノードぶんの記述。

        ファイルの冒頭の説明も、この3語に合わせて直してあります。

        ## 確かめておきたい点

        「体系」が持つものは、概念式だけではありません。基礎の関係（6個）と分類の軸（5本）も、同じファイルにあります。いまの式では、体系は「概念式を複数、部分として持つ」としか書いておらず、基礎の関係と軸が体系の一部であることは表せていません。「概念式は体系が持つものの一部」という言い方は、体系が概念式以外も持つことを含んでいると理解しましたが、それらを体系の式に加えるべきかどうかは、判断を聞かせてください。

        「制御自然言語」という語は、`spec/` からすべて消しました。凍結した文書（`docs/design.md`、`experiments/README.md`）には残っていますが、更新しない取り決めなので、そのままにしてあります。
