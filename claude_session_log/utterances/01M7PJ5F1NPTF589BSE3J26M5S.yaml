      text: |
        `above`、D2、座標の三つは、**静的な座標空間（一つのフレームの中）**と、**フレームをまたぐ時間の方向**の二層に分けると整理できます。`above` は前者の中の関係で、D2 は後者で持続体と生起体を分けます。

        ## 1. 三つが何を指しているか

        | | 何か | 決まる場所 |
        |---|---|---|
        | 座標 | 概念は修飾の次元（動詞と位置の組）の上の点。self が原点、any がゼロ、same が符号 | 一つのフレームの中（静的） |
        | above | 概念どうしの順序。extends から導く | 一つのフレームの中。実行で変わらない |
        | D2 | 持続体はどのフレームでも自分と同じもの。生起体は前後のフレームを同じでなくするもの | フレームをまたぐ（時間の方向） |

        ## 2. 幾何の類比

        **静的な層は配置空間です。**
        - 概念は点で、修飾が座標です。
        - 「y が x の上位」は、y の座標がすべて x にあることです。錐（cone）で決まる順序に当たります。
        - 名前の上位（above）は、この座標の順序に地図（chart）として名前を付けたものです。
        - `sys_above_sound` の結果をこの類比で読むと次のとおりです。
          - 真の側は健全でした。名前で上位なら、座標でも上位です。
          - 偽の側に根拠のない組がありました。中身は二種類です。
            - 最上位（941 組）：continuant と occurrent は座標がゼロで、区別は名前にしかない。
            - deep_kind（440 組）：順序から作った座標で、概念が分け直されていた。

        **時間の層は、フレームの列（軌跡）です。**
        - D2 の生起体は、フレーム t から t+1 への**変位**に当たります。
        - 持続体は、フレームが変わっても位置（同一性）が変わらない**点**です。
        - 静的な動詞（holds だけを持つ）は、どのフレームの中でも成り立つ**関係**（点どうしの位置関係、方程式のような制約）です。点でも変位でもありません。

        **点と変位の区別は、アフィン幾何に似ています。**
        - アフィン空間では、点と変位（ベクトル）はどちらも座標を持ちます。区別するのは、もう一つ足した座標（斉次座標の w。点なら 1、ベクトルなら 0）です。
        - 体系で最上位が座標ゼロになり、持続体と生起体を静的な座標では区別できなかったのは、この w に当たる時間方向の座標が静的な空間にないからだと読めます。
        - `h_tops_derivable` が反証されたことと、`sys_above_sound` で 941 組に根拠がなかったことは、同じ欠けを二つの側から見たものです。
          - `h_tops_derivable`：D2 の時間側の定義と、今の置き方が合わなかった。
          - `sys_above_sound`：静的な座標では、持続体と生起体を区別できなかった。

        ## 3. 類比の中での above の位置

        - **above は静的な関係です。** 点（概念）どうしの順序で、どのフレームでも同じに成り立ちます。D2 で読めば、`v_above` は holds だけを持つ静的な動詞なので、生起体（変位）ではありません。
        - **今の体系は D1 の置き方です。** 動詞をすべて生起体の下に置いているので、`v_above` も変位として型付けされています。`sys_above_sound` の残りに出た `above_order` → `top_placement` の組は、この型付けから含意で生まれたものです。
        - **deep_kind は、順序から作った高さの関数です。** 順序（above の数）で新しい座標を作ると、その等高線で点が分け直されます。FCA の類比で予想した再分類が実際に起きていて（440 組）、局所の候補の外にあったので V には出ていませんでした。

        ## 4. 確かめたことと解釈の区別

        - **観察として確かめたこと**
          - `sys_tops`：D2 は持続体の側と動的な動詞では合い、静的な動詞 82 では合わない。
          - `sys_verbs`：静的な動詞は限定されず、順序の関係が多く、端に生起体を持つものがある。
          - `sys_above_sound`：真の側は健全。偽の側で根拠がないのは 1535 組（最上位 941、残り 594）。
        - **私の解釈で、まだ確かめていないこと**
          - アフィン幾何の w との対応（時間方向の座標がないので、持続体と生起体を静的に区別できない）
          - 静的な動詞は、点でも変位でもない関係に当たること
          - 体系の中で D2 の「関係」が、基礎の関係の形にあたるのかどうか

        この整理で合っていれば、アフィンの w に当たる時間方向の座標を体系の何で表すか（実行のフレームか、静的な式か）が、次に決めることになると思います。
