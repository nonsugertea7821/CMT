      text: |
        この含意を、未検証の仮説3つとして PR #253 に登録しました。登録だけで概念は足していないので、自動マージに乗るはずです。手元では tc と ec が通っています。

        **つながり**
        - CSCL では、修飾の掛かり先は式の mod（of と with）で一意に決まります。
        - 自然言語では、同じ役を韻律の句切り（話し言葉の切れ目。書き言葉なら読点など）が担っています。
        - 曖昧性解消は、この二つが交わるところです。

        **登録した仮説**
        | 仮説 | 中身 |
        |---|---|
        | `h_ja_text_needs_prosody` | 式から訳した日本語が掛かり先を一意に読ませるには、韻律の句切りが要る |
        | `h_mod_fixes_prosody` | 句切りは修飾の構造に従って決まる（構文の副産物とする見方） |
        | `h_ambiguity_calls_prosody` | 句切りは、係りの多義があるところで要る（文脈が解けないときに話者が出すとする見方） |

        - 1つ目を立てた理由: 支持済みの `h_ja_roundtrip` は、決まった語彙で表示語を丸ごと読んだ測り方でした。そのため名詞句の中の係りはまだ測られておらず、ここを問います。
        - 2つ目と3つ目は、先行研究の論争から対で出しました。

        **置き場所を変えた点**
        - 日本語訳の側の主張は、実験側の語（韻律句）を参照できないという検査の規則があり、最初の置き場所では落ちました。
        - そこで3つとも `exp/src/exp.yaml` に置き、日本語訳の概念のほうを参照しています。

        測るには、書き言葉で韻律の句切りをどう数えるか（読点・改行・箇条・句の長さ）を決める必要があります。これは次の周期の事前登録で決めます。
