      text: |
        はい、一部被っています。二つの設定ファイルを読んで分かったのは次のとおりです。

        **被っているところ**
        - 型検査（tc）は、同じ PR について spec と auto-merge の両方で走っています。
          - spec は、PR を main にマージした形で検査します。
          - auto-merge は、PR の head をそのまま検査します。
        - どちらも Python の準備と `pip install pyyaml` を、それぞれ別に行っています。

        **片方にしかないところ**
        - exp の検査（ec）は auto-merge でしか走りません。spec には入っていません。
        - 次の検査は spec にしかありません。
          - 実行の記録
          - 世界の対称性
          - 同期と判定のテスト
          - README の確認

        **被りより気になる点**
        - auto-merge は、spec の結果を待たずにマージを呼びます。
          - ブランチの保護で spec が必須になっていなければ、spec にしかない検査が落ちていてもマージされることがあります。
          - 保護の設定は、このセッションからは確かめられていません。

        直す方向として「自動マージの判定は spec の結果を読んで決め、同じ検査を走らせ直さない」を、未検証の仮説 h_merge_verdict_by_spec として #632 に登録しました。わき道です。登録だけの PR なので、自動でマージされるはずです。

        確かめ方は、次の二つを考えています。
        - spec が落ちていたのにマージされた PR が過去にあったかを数える。
        - 二つのワークフローで tc にかかった時間を足し合わせる。

        本線 a 識別子化、d_cscl_display_derived の下（同期とマージの件はわき道）
