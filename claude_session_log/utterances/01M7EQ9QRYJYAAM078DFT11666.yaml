      text: |
        実験記録と測定結果をオントロジーへ移しました。検査を通してプッシュ済みで、数は移行前と一致しています（測定値380、観察69、仮説37、決定17、残り項目20）。

        ## 変えたこと

        - **`claims.yaml` と `measurements.yaml` を廃止**：中身は `spec/exp.yaml` に移しました。これは領域 `exp` のファイルで、体系の一部として同じ検査にかかります。
        - **記録は個体として書く**：どの記録も `is` で種類に属します。たとえば観察は `{is: observation, s: ..., p: ..., o: ...}` です。測定の族は `is: measurement_family`、残り項目は `is: backlog_item` です。
        - **種類ごとの項目は体系から読む**：検査は、体系の `records` の記述を見て個体を種類ごとに分けます。種類がノードでなければエラーにします。
        - **識別子の重複を検出**：同じ識別子を2度書くとエラーになります。以前は後のものが黙って上書きしていました。
        - **実行の記録の個体も同じ形**：`{sys1: {is: system}}` に揃えました。

        領域の宣言は `exp: {uses: [core, run]}` です。`exp` から `core` は参照できますが、逆はできません。

        ## ファイルを1つにまとめなかった理由

        `ontology.yaml` に全部を入れると1300行を超えます。そこで、プログラミング言語の前例（名前空間とファイルを対応させる）に倣い、領域ごとにファイルを分けました。書き方と検査は共通です。1ファイルにまとめるほうがよければ、そうします。

        ## まだ移していないもの

        実験に固有の種類（モデル、注入の手段、設問の群、指標など約250個のノード）は、`core` に残っています。本来は `exp` に属するものです。移すには、識別子の付け替えと、検査の中の参照の解決を全面的に書き換える必要があります。記録の移行とは別の作業として、まだ着手していません。

        これを移すと、`core` には BFO の区別・動詞・文法の語だけが残り、「体系制御言語そのもの」と「それで書いた実験の語彙」が分かれます。次にやるならこれだと考えています。

        ## そのほか

        - 定期確認の文面が古いファイル名を指していたので、新しい構成に合わせて書き換えました。
        - 単一層（L20）のベクトル学習がコンテナの再起動でまた止まっていたため、再開しました。24概念のうち数個ずつ進んでは止まる状態が続いています。
