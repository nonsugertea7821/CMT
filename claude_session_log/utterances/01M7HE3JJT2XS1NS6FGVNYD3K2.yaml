      text: |
        今の spec にある「部分になる」の限定を全部（30件ほど）、向きを確かめました。逆向きのものは見つかりませんでした。

        **共通成分の向きは正しかった**
        前回「共通成分は逆向きに読める」と言ったのは、私の読み違いでした。`[v_compose, from] with X` は「このノードが X の部分である」という意味です。共通成分（概念ベクトルの部分）は v = m + s の向きどおりです。
        - 確かに逆向きに書いたのは、隠れ状態のずれの最初の下書きだけです。「隠れ状態がずれの部分になる」と書いていたのを、すでに直してあります。
        - 兄弟概念の組（新しい語2つと上位概念1つを部分に持つ）と、自由生成（選択肢を部分に持たない）は意図どおりと読めます。

        **ただ、ご懸念どおり法則は足りません**
        その逆向きの下書きは検査を素通りしました。理由は二つです。
        1. 部分についての既存の法則（推移的・反対称的）は、個体どうしの事実に掛かります。種類の定義（mod）には掛かりません。
        2. 掛かったとしても、逆向きの式は種類としてはどちらも正しく、循環も作りません。種類の検査では原理的に捕まりません。

        ## 足すべき法則の候補

        1. **事例による裏づけ（効き目が一番大きい）**
           「X の部分である」と限定した種類の個体には、X の個体の部分であるという事実が実際にあることを求めます。向きの誤りは事実との食い違いとして出ます。ただし、個体を持たない種類（ベクトルなど）には効きません。
        2. **種類の水準での反対称**
           A を「B の部分」、B を「A の部分」と限定するのを禁じます。上位概念をたどった先も含めます。安くて確実ですが、捕まえられる誤りは限られます。
        3. **表示名の書き方を決める**
           自動で作る表示名「X から部分になる」は、どちらが部分か読めません。私が読み違えた原因もここにあります。「X を部分に持つ」（to）、「X の部分である」（from）と書くよう求めます。人が読んで逆向きに気づける形にします。

        勧めるのは 3 と 2 をまず入れることです。2 は検査器に一つ規則を足すだけで、3 は表示名の生成規則を変えて既存の表示名を書き換えます。1 は個体のある種類が限られるので、その後に検討します。進めますか。
