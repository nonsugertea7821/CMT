        Step 1 is done: h_rule_roles_read_by_frame came out refuted (#875).

        **What worked:** reading the three law roles from the frame instead of the hard-coded verb-name list left the laws and the derived relations exactly the same (419,475 relations). The control variant changed them heavily, so the frame-based reading really was in effect.

