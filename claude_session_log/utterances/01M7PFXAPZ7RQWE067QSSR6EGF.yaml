        h_hierarchy_in_object は、登録した判定どおり支持になりました。PR #145 の Draft を外したので、確認してマージしてください。assign 済みで、文法を変えたうえ訂正もあるので、自動マージの対象外です。

        **やったこと**
        - 上位の関係を基礎の関係 `above` にし、動詞 `v_above` と、深さの限定を持つノード `deep_kind` を置きました。
        - 法則の関係 `r_ancestor` を `above` に訳す法則も足しました。これで深さを、ノードの限定（mod）として書けるようになりました。

        **経過（訂正あり）**
        - 最初の after は外れでした。型検査に「基礎の関係は、どこかの法則に現れなければならない」という規則があり、`above` を法則に置いていなかったためです。
        - `r_ancestor` を `above` に訳す法則を足す訂正を手順に書き足し、after2 で測り直しました。
        - after2 は、深さが一致し（495 / 495）、違反の組も増えませんでした（3 のまま）。

        **見込みが外れたこと**
        - 登録した見込みは反証でした。FCA の類比では、順序を属性にすると概念が分類し直されるはずだったからです。
        - 違反が増えなかった理由は、違反を探す範囲が局所的だからです。候補になるのは「自分の上位の下にあって、互いに上下でない概念」だけで、`deep_kind` を候補に持つ概念は 1 つしかありませんでした。
        - 登録していない追加の確認として数えると、`deep_kind` の限定をすべて持つのにその下にない概念が 495 あります。分類し直しの圧力はあり、検査に見えていないだけです。
        - なので支持は「この体系の違反の検査のもとで、分類を変えずに書ける」という意味に限られます。この限界は commit メッセージと PR に書きました。

        **ほかの限界**
        - 深さを数える法則は、閾値 2 の限定にしか効きません。法則の中の個数は定数で、限定に書いた数を読めないためです。

