        ここまでの流れも日本語でまとめ直します。
        - **#628（同期の高速化）**: マージされました。マージ後の最初の同期は約 40 秒で、前の回の約 124 秒からおよそ 3 倍速くなりました。残る遅さは、体系が変わったときの組み立ての時間です。仮説ごとの増分キャッシュ（参照する語の表示語まで含めて比べるもの）は、まずわき道の仮説として登録します。
        - **#629（h_reading_excludes_claims）**: 反証で、マージされました。
          - 主張の項（仮説・観察・残り項目）を除くと、対象の動詞 15 語のうち 6 語の読みが動きました。2 語は使う領域が二つ未満になり、4 語は形式と実在が入れ替わりました。
          - v_express は 0.399 から 0.533 になり、#619 の追記で手で見積もった値と合いました。
          - 体系を測るときは、主張の項を除く必要がある、という結果です。
          - #619 の結論も一部変わりえます。主張の項を除くと、6 語のうち v_express と v_stage が形式の側に移ります。#619 の状態は書き換えていません。読み直すなら、別の仮説として事前登録します。
        - **#630**: 上の含意から出した解き方の一つです。主張を種類で除く方を登録しました。もう一つの解き方、主張を別の領域に置く方は、#622 として登録済みです。どちらも d_metric に結んでいます。

