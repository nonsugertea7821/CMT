      text: |
        検討していませんでした。定義しないまま、少なくとも4通りの意味で使っていました。

        ## 私が「修飾」と呼んでいたもの

        | 使い方 | 例 |
        |---|---|
        | 上位の概念に、軸と値の組を付ける | 語 [元の意味の有無＝ある] → 一般語 |
        | 関係の両端の種類を狭める | 関与する [始点＝特定依存持続体] → 実現される |
        | 関係に論理的な性質を付ける | 依存する [相手は1つに決まる] → 宿る |
        | 形を変えたものに、さらに条件を付ける | 「道具は修飾で書く」 |

        しかも「原子は、最上位の2つと、修飾の操作と、論理の結合子」と書き、修飾を体系の外にある操作として扱っていました。すべてをノードと辺で書くと決めたのに、修飾だけが体系の中で定義されていません。

        ## いま考えられること

        体系の中の要素だけで書くなら、修飾は新しい操作ではなく、関係のノードの中で位置を占めることだと考えます。

        「自然言語で書かれた語」を例にします。

        - 「書く」という関係のノードがあり、始点と終点を持つ。
        - 終点を「自然言語」に固定する。
        - そのとき始点に来るもの、が「自然言語で書かれたもの」。
        - それと「語」の両方に当たるもの、が求める概念。

        つまり、修飾とは次の2つの組み合わせです。

        1. ある関係の、ある位置（始点か終点）に来るものを指す。もう一方の端は固定してもよい。
        2. それを、上位の概念と重ねる。

        ## 形の変化と同じものになる

        こう書くと、前回の表の「形」と修飾が区別できなくなります。

        - **-er の形**: ある関係の始点に来るもの。もう一方の端は固定しない。
        - **修飾**: ある関係の始点に来るもの。もう一方の端を固定する。

        違いは、相手の端を固定するかどうかだけです。「届けるもの」（deliverer）は形で、「定義を届けるもの」は修飾ですが、どちらも「届ける」の始点を指しています。

        そうだとすると、私の `where: {軸: 値}` という書き方には欠落があります。常に「始点に来るもの」しか書けず、「終点に来るもの」（届けられたもの、依存される側）を修飾として書く手段がありません。位置を指定していないからです。

        ## 分からない点

        - **「重ねる」が何であるか。** 上位の概念と、関係の位置に来るものの両方に当たる、という操作は、まだ体系の中の要素で書けていません。上位・下位の辺（〜の一種である）がこれを担うのかもしれませんが、それ自体も関係のノードとして書くべきものなのか、判断がつきません。
        - **「関係そのもの」の行に当たる修飾があるか。** 表には3つの位置があります。始点と終点を使う修飾は上のとおりですが、関係のノード自体を指して修飾する、という使い方（副詞に当たるもの）もあるはずです。

        修飾は「関係の中の位置を占めること」である、という理解で合っていますか。
