      text: |
        体系に書き込み、検査を通してプッシュしました（ノード325）。CI にも実行の検査を加えてあります。

        ## 入れたもの

        - **法則の節（`laws`）**：公理を11個置きました。基礎の関係の4つ（推移的など）、真偽の区別、継承の3つ（引き継ぐ・狭めるだけ・循環しない）、実行の3つ（1歩・枠・停止）です。どの法則も、当てはめる検査がなければエラーになります。逆に、検査が当てはめているのに書かれていない法則もエラーになります。
        - **論理の語**：`not`、`all`、`any`、`between` をノードにしました。体系の外に残る論理の語はゼロになりました。
        - **個体の層**：「属する」「個体」「個体についての文」「個体の状態」を足しました。
        - **実行器**：書き換えの規則に依存する役割として定義しました。担い手は限定していません。
        - **実行の検査（`tools/run_spec.py`）**：実行の記録（`spec/runs/*.yaml`）を、動詞の `before`／`after` に照らして確かめます。誰が実行した記録でも同じ検査にかかります。

        例として「決定を採用 → 取り下げ → 再び採用」の3歩を置きました。否定テスト6件（前の状態が成り立たない、種類が合わない、法則違反、停止の誤り、期待の誤り、未定義の法則）はすべて検出されました。

        ## 厳密でないまま残っているもの

        - **継承の法則は検査の実装が先にある**：`inherit` と `narrow` は、既存の検査がやっていることに名前を付けただけです。法則の文から検査を導いてはいません。
        - **論理の語の定義は近似**：`universal` は「存在の数量化についての否定」と書いただけで、内側の否定までは表せていません。
        - **法則の中身は表示語だけ**：「推移的」などの意味は検査プログラムの中にあります。これは前回の「適用は書けない」に当たる部分です。
        - **算術はまだない**：数の比較はできますが、足し算は入れていません。

        ## チューリング完全性の現状

        個体・状態・1歩・停止がそろったので、有限の個体の上の書き換えは動きます。まだ万能ではありません。実行の記録で個体を先に全部宣言する形にしたため、記憶が有限だからです。個体を実行中に増やせるようにすれば、際限のない記憶になります。必要になったら足します。

        ## 実験：下書き（E9）の 4B の結果

        1.5B とは逆の結果になりました。

        | 再定義の型 | モデル | 直接答える | 下書きしてから答える |
        |---|---|---|---|
        | 規則型 | 1.5B | 0.33 | 0.25 |
        | 規則型 | 4B | 0.75 | 0.92 |
        | 付け替え型 | 1.5B | 0.83 | 0.58 |
        | 付け替え型 | 4B | 0.75 | 0.75 |

        4B では下書きが規則型に効き（12問中9問 → 11問）、付け替え型は下がりませんでした。「下書きは規則型を上げる」は 4B で支持、1.5B で反証、という記録にしてあります。1.5B の失敗は数の大小の照合の誤りだったので、下書きが効くかどうかは、書き出した手順をモデルが正しく実行できるかで決まる、と読めます。ただしこれは解釈で、まだ検証していません。

        実験の列は、単一層（L20、次に L4）の実行に進んでいます。
