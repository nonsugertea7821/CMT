        **含意**
        - 種差を書けば衝突を 0 にできること自体は示せました。
        - 誤りが書き方の問題なら、別の種差で書き直します。体系の法則と両立しないのなら、承認と入金はいまの法則のもとでは同じ形でしか書けないことになります。その場合は「名前（鍵）が意味を運んでいる」印として、#975（`same` を形で定める仮説）の判定に効きます。

