        - **書き足す前:** 796 の概念のうち、名前でしか分かれない組は二類だけでした。承認と入金、それとその動詞（承認する／入金する）です。法則の文の三つ組（前提・導く・求める）は、その後の書き分けでもう分かれていました。
        - **書き足したもの:** 事前に決めたとおり、体系にすでにある文から読める限定を、一つずつ足しました。
          - 入金には「金額で測られる」を足しました。売上の式から読めるものです。
          - 承認には「検収の時間的な部分になる」を足しました。承認まで済んだ検収の式から読めるものです。
        - **書き足した後:** 796 の概念がすべて別々に分かれ、衝突は 0 になりました。ただ、型検査の誤りが 6 件出ました。

