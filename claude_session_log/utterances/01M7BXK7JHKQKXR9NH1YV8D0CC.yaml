        変わりそうな点は5つあります。いずれも 1.5B モデル・24概念での結果に基づく暫定の見立てです。

        ## 1. 正本の中身：定義文だけでは足りず、適用例が要る

        当初は「概念式（定義）が正本で、重み側はそこからコンパイルした派生物」としていました。実験では、定義文だけから作ったベクトルは暗唱を覚えるだけで適用に効かず、適用例を教師にして初めて境界が移りました。

        したがって、概念の正本は「定義＋境界を示す適用例」の組になります。適用例は検証層のテストと同じものなので、テストの位置づけが変わります。

        - **当初**: 生成後に確かめるもの（検証層）
        - **変更後**: 概念を成立させる材料でもある（学習用と、検証用に取り分けたものの2組が要る）

        以前に提案した「差異とテストの1対1対応」が、検証の規則からコンパイルの入力に格上げされる形です。

        ## 2. 文章での注入：用語集を渡す方式は成り立たない

        - 全定義を用語集として渡すと、再定義は定義なしとほぼ同じ（0.42 対 0.38）で、分化や置換も落ちました。
        - 関係する定義だけを直前に置けば、新しい語（分化・置換）には従います（1.00）。

        用語サーバーは、問い合わせごとに関係する概念だけを選んで渡す役割を持つ必要があります。「概念体系を文脈に載せる」のではなく「引く」設計になります。

        ## 3. 命名の規則：一般語の再定義を避ける

        - 一般語に別の意味を与えると、定義を直前に置いても元の意味に負けます（0.58）。
        - 新しく作った語なら、文章だけで従います。

        「同音異義は許さない」の規則を、プロジェクト内だけでなく**モデルが元から持つ意味との衝突**にも広げるのが合理的です。衝突する語は改名するか、改名できない場合だけ概念ベクトルを使う、という振り分けになります。

        ## 4. 用語サーバー：実行時の束縛を担う

        概念ベクトルは「入力のどの位置がどの概念の語か」が分かって初めて加えられます。用語サーバーの仕事は、正規化と同一性の解決に加えて、推論のたびに語の範囲を特定することまで広がります。「会社員」の中の「社員」のような語の境界の判定も、ここの責任になります。

        また、定義文とベクトルを併用すると下がったので、1つの概念をどの経路（文章かベクトルか）で渡すかを一意に決める振り分けも必要です。

        ## 5. 接続層の優先順位：差分重みの必要性が下がる

        当初は「不安定な変更は入力・中間層で保持し、安定したら重みへ固定」の二段構えでした。中間層のベクトルは次の性質を示しています。

        - 1概念あたり1本で済む。
        - 外せば元に戻る。
        - 24概念を同時に入れても干渉がほぼない。

        固定先は差分重みでなく中間層のベクトルで足りる可能性があります。差分重み（C2）は、規模を増やして干渉が出たときの次の手、という位置に下がります。

        ## 変わらない部分、未検証の部分

        - **外部の記号的な正本、型付きグラフ、版と置換**は変わりません。ベクトルが派生物であるという関係もそのままです。
        - **系譜（親＋差分）、分化、取り消し、意図の解釈**はまだ実験していません。
        - **数値の境界を持つ概念**（25歳未満、10個以上など）はベクトルで学習しきれませんでした。こうした条件は検証側の規則として持つ方がよいかもしれません。

        生成させたときにも効くかの評価は、いま実行中です。この結果次第で、5番目の見立ては変わりえます。

