      text: |
        はい、先行研究はあります。乳幼児の学び方を手本にして LLM の学習を良くしようという流れは、一つの研究分野になっています。今回は検索結果の要約を読んだだけで、論文の本文までは読んでいません。

        - **BabyLM Challenge**: 子供が実際に聞く程度の量（1,000 万語か 1 億語）のデータで、どれだけ効率よく学習できるかを競う共同課題です。2023 年から毎年開かれています（[募集の論文](https://arxiv.org/pdf/2301.11796)、[2024 年](https://aclanthology.org/events/babylm-2024/)、[2025 年](https://aclanthology.org/events/babylm-2025/)）。
          - 第 2 回のまとめでは、トークン化への関心が高まっていると報告されています（[第 2 回のまとめ](https://arxiv.org/html/2412.05149v1)）。
          - 「サブワードのトークン化は、語やそれより小さい単位の学び方のモデルとしては足かせになる」として、音素や文字の単位で学習させる研究があります（[Bielefeld の論文](https://www.arxiv.org/pdf/2410.01487)）。
          - BPE・Unigram・SuperBPE を比べて、結果がトークン化しだいで変わると報告した研究もあります（[2025 年の比較](https://preview.aclanthology.org/ingest-emnlp/2025.babylm-main.16.pdf)）。
        - **乳児の語の切り出しを計算モデルで再現する研究**: 心理言語学の側に、統計・韻律・既知語といった手がかりを組み合わせて語を切り出すモデルの研究が多くあります。たとえば[文脈を使って切り出しを良くする研究](https://arxiv.org/pdf/2503.10023)です。
        - **Bortfeld らの研究**: 書誌を確かめました。Bortfeld, Morgan, Golinkoff, Rathbun (2005), Psychological Science 16, 298–304 です（[誌のページ](https://www.psychologicalscience.org/journals/psychological-science/j.0956-7976.2005.01531.x/)、[報道](https://sciencedaily.com/releases/2005/05/050513230407.htm)）。後の文献では「既知の語から周りを切り出す、上からの切り出し」とまとめられています。

        **このリポジトリとの違い**: 先行研究の多くは、トークン化の単位を変えて学習効率や文法の成績を上げることを狙っています。#982 の二つの仮説が問うのは、そこではありません。概念の識別子（辞書の鍵）や韻律句の切れ目が、モデルの中で概念の区画を切り出す足場になるか、です。今回の検索の範囲では、この形の研究は見つかりませんでした。探し方が浅いので、無いとは言えません。

        #982 はマージ済みです。二つの仮説は、式と区画の対応を測る実験に条件として足すときに確かめます。
