      text: |
        Stop フック「Wait—turn that observation into a hypothesis?」を組み、PR #707 に上げました。まだ main に入っていないので、今のセッションでは効いていません。

        **動き**
        - 応答を終える前に、最後の応答から否定の文を拾います。拾う形は「ません」「ていない」「がない」「はない」「もない」「できない」「られない」などです。
        - 一つでもあれば、止まるのを一度だけ止めて、拾った文を見せます。そのうえで、それぞれを次の三つのどれかに分けさせます。
          1. 確かめた事実なら、そのまま終える。
          2. 確かめていない主張なら、仮説として登録する（h_・b_・v_ground まで）。
          3. 進みの報告なら、そのまま終える。
        - 一度止めて続けた後の停止では、二度は止めません。
        - コードの部分は拾いません。

        **確かめたこと**: 手元で入力を流して、4 つの場合が思ったとおりに動きました。否定のある応答では止まり、否定のない応答では何も出ず、続けた後の停止では止まらず、記録の末尾から読む道も働きました。

        **気をつけること**
        - 「異常はありません」のような進みの報告でも止まります。そのときは「進みの報告」と短く答えて終える形にしました。うるさいようなら、拾う形を狭めます。
        - 効くのは #707 が main に入り、セッションが設定を読み直した後です。このセッションの元の作業場所（/home/user/CMT）は古い版のままなので、マージ後にそこを新しい main に合わせる必要があります。

        ロードマップ上の位置: 運用の仕掛けなので、わき道です。H2（d_metric の直下の E36）は走っています。
