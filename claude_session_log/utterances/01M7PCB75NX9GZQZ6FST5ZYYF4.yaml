      text: |
        その見方なら、display は「まだ式にしていない意味の借用書」で、薄いノードの display に入っているのは返していない借りです。そうすると、これまでの話が一つにまとまります。

        - **借りの大きさは測れます。** 前に測った display の残り（sys_display_residual。display のうち式から説明できない部分）が、そのまま借りの総額の目安になります。広辞苑くらいの辞書が要りそうに見えるのは、借りがまだ多いことの裏返しです。
        - **返済は二通りです。** 一つは、式を足して display が式から訳せるようにすること（お金を軸にしたのがこれ）。もう一つは、対応辞書に移すことです。辞書に残るのは、式から訳しても決まらない慣用の名前だけ、というのが理想の形です。
        - **コメントは借用書ですらありませんでした。** display は少なくとも語に結び付いていて、翻訳の先として一意な場所を持ちます。コメントはどこにも結び付かず、検査もかかりません。だから消すか、式か display か commit に振り分けるのが筋で、今の手順と合っています。

        claims の「読み」も同じ扱いにできます。仮説の個体を立てて形を式で書き、まだ式にできない中身は、とりあえずその語の display に借りておく。そうすればコメントは要りません。

        そのとき式として要るのは、前に挙げた「観察から着想した（支持ではない）」という関係だけです。これは display に借りられません。仮説の状態（未検証かどうか）を決める式に効くからです。

        `v_suggest`（観察 → 仮説。`v_agree` の下には置かない）を足して、「読み」3つほどで試してみてよいですか？
