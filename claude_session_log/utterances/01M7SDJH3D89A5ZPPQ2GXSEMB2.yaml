      text: |
        **#297 のコンフリクトは直しました。**
        - **原因:** 先にマージされた #296 の観察と、#297 の観察が、`claims.yaml` と `exp.yaml` の同じ位置に足されていました。どちらも行を足すだけで消す行はないので、両方を残しました。
        - **確認:** 手元で tc と ec は通りました（ec の仮説数は 148）。取り込みの commit（9685c09）は push 済みです。
        - **後片付け:** #296 はマージ済みなので、手元のブランチ `claude/h_above_individual` を消し、main を最新に揃えました。

        ---

        **#296 の欠陥は、概念系の側から検知できる見込みがあると考えます。ただ、いまの体系のままではできません。**

        **なぜ今は見えないか:** #296 では、法則を足した変種の事実を変える前と比べたとき、足した法則自身の宣言の文（`domain`・`is`・`r_written`）まで「変わった」と数えてしまいました。どの法則を足したかはスクリプトの中にしか書かれていないので、ec からは「何を足した比べなのか」が見えません。

        **検知に要るもの:** 次の 3 つを式で書ければ、ec が走らせる前に欠けを導ける見込みがあります。
        1. 測定の族が、変えた法則を体系の中で参照する。
        2. 「法則を宣言すると、その名前に触れる事実が必ず増える」という法則を体系に置く。
        3. 測る量（「変わった事実の数」など）が、どの語を数えるかを式で持つ。

        **導ける内容:** 1 と 2 から、「新しく宣言した語を除かない比べは、作りからして 0 にならない」が導けます。3 と合わせれば、ec がそういう比べを、結果を見る前に指摘できます。

        **同じ種類の欠陥:** #147 と、#298（名のない mod の項）の欠陥も、比べの範囲に入れるべき語と除くべき語を取り違えた点で同じです。この仕組みができれば、3 つともまとめて捕まえられる見込みがあります。

        **登録した仮説:** 取り決めに沿って、前提の 1 を未検証の仮説 `h_family_refers_laws` として登録し、PR #311 を立てました。登録だけの PR なので自動でマージされます。2 と 3 は新しい概念が要るので、登録していません。仮説を確かめる段階で、手で見る PR として出します。
