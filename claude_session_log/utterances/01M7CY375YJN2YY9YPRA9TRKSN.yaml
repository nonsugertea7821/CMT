      text: |
        そのとおりです。関手は次元から次元への写し方そのものなので、写す先の次元と同一視したのは、矢印と行き先を取り違えた誤りでした。表の行や列は次元であり、関手はその間を動かす操作なので、表の上の位置としては現れません。

        ## 推測を重ねるのをやめます

        ここ数回、私は足りない理解を推測で埋めて、そのたびに外しています。関係・分類・修飾という3つの関手が、それぞれ何を何へ写すのかは、今の私には特定できていません。

        手元にある材料は、これまでにいただいた言葉だけです。

        - 関係は、それ自体を記述する述語論理として BFO の下に定義され、グラフによって接続される。
        - 分類は関係を利用して記述される。軸は関係を抽象として見たもので、値はその抽象に対する具体。
        - 持続体の形を変えると生起体になり、その逆もある。
        - 生起・持続・修飾で3次元。関係・分類・修飾はその関手。

        ## 1つだけ、根拠のある読み

        推測ではなく、前回自分で確かめたことから言える点が1つあります。

        - 関係は、始点と終点の両方が開いている。
        - その一方の端を固定すると、残った端に来るものを限定する働きになる。これが修飾だった（「自然言語で書かれた」は、「書く」の終点を固定したもの）。
        - 両端とも具体を捨てて、関係を1つの物として見ると、軸になる。固定されていた端の具体が、値になる。

        この3つは、同じ関係について「開いている端の数」を変える操作として並びます。次元を変える、という言い方とは合います。ただし、これがあなたの言う3つの関手に当たるのかは分かりません。

        ## 教えてほしいこと

        3つの関手それぞれについて、何を受け取って、何を返すのかを教えてください。たとえば「関係は、◯◯を受け取って ◯◯ を返す」という形です。

        それが分かれば、3×3 の表のどの移動がどの関手によるものかを、私の側で導けます。分からないまま作り直すと、また外します。
