      text: |
        はい、この体系は閉世界仮説です。法則の決まりも「導く文は否定にしない（書かれていない文は成り立たない）」になっています。そして指摘のとおり、読み方は選ぶものではなく導かれます。**「全てについて」です。**

        ## なぜ「全て」になるか

        閉世界仮説では、種類に属するものは、書かれた個体で尽きます。

        - **「ある」と読む場合:** 「h の何かと v の何かを合わせると h′ の何かになる」は、そういう個体が存在するという主張です。閉じた世界では、その個体についての事実がもう書かれていれば、その事実から導けるので書く意味がありません。書かれていなければ偽です。つまり、種類どうしの事実として新しく足せる中身がありません。
        - **「全て」と読む場合:** 個体の事実からは導けない、種類についての一般的な主張になります。新しく書く意味が残るのはこちらだけです。

        ## 既存の限定とも食い違わない

        限定（mod）も、外側は「全て」です。

        - `state_shift: mod [v_sum, from] with h′` は、「ずれに属するどれについても、ある相手 z があって、合わせると h′ になる」と読めます。
        - 「ある」は、合わせる相手 z を問わないという内側の話です。種類全体への読み方は、限定も種類どうしの事実も「全て」で揃います。

        ## もう一つ導かれること：否定は事実ではなく制約になる

        閉じた世界では、書かれていない文は最初から偽です。そのため「h は注入に依存しない」を否定の事実として書いても、何も足しません。

        前回捕まらなかった誤りは、偽だったはずの文を誰かが書き足した場合でした。これを止めるのは事実ではなく制約、つまり `v_require` で書く法則です。

        - 否定の錨は「事実の neg」ではなく、「導かれてはならない」という制約になります。
        - 形は今の `kdep_antisymmetric` と同じ種類のものです。例えば「h（層の出力）から、注入したものへの依存が導かれてはならない」です。

        ## 実装の形

        | 書くもの | 書く場所 |
        |---|---|
        | 肯定 `{is: v_sum, from: h, to: v, new: h′}` | 事実（種類どうし）。「全て」と読み、部分と依存を導く |
        | 否定「h は h′ に依存しない」 | 法則の制約（require） |

        前回心配した「どちらの読み方にするか」は、もう決める必要はありません。決める必要が残るのは、check_spec が事実の位置に種類も受け付けるように広げることだけです。

        進めてよければ、次の3つをやります。

        1. 文法を広げて、種類どうしの事実を受け付けるようにします。
        2. h′ = h ⊕ v と v = m ⊕ s を事実として書き、h′ の限定を「h を部分に持つ」に戻します。
        3. 生成順序の制約を法則として書き、前回漏れた「h の一種が h′ に依存する」も捕まるか確かめます。
