      text: |
        まだ網羅的には捕まえられていません。どの水準で起きるかで状況が違うので、分けて整理します。

        | 水準 | 例 | いま捕まえられるか |
        |---|---|---|
        | 個体 | 二つの名前が同じ個体を指す | 捕まえる対象にならない。法則 unique_names（名前が違えば別の個体）が、それを公理として禁じている |
        | 概念（式が字面まで同じ） | 二つのノードが同じ式を持つ | 捕まえる。ただし法則ではなく、型検査のコードの検査（「式が … と同じ」） |
        | 概念（式は違うが意味が同じ） | 端の上下まで含めると、互いに相手を満たす二つのノード | まだ。含意の規則を specific に効かせると、互いが相手の候補になり、どちらも欠けがないので違反として出る。いまは残る 14 件のため止めている |
        | 書き方（文法） | quant: some と at: {count: {ge: 1}} | 捕まえられない。今回たまたま気づいて書き直した |
        | コードと体系 | type_checker（モジュール名とノード）、法則の名前の表（LAWS_HERE）と law_given の個体 | 捕まえられない。体系の外にあるので、名前の付け替えでも見えず、定義の変異でやっと一部が見えた |

        **それぞれの穴の塞ぎ方**
        - **概念の水準**：二つ考えられます。
          - コードの「式が同じ」の検査を、規則の法則にします。互いに相手の式をすべて持てば同じものとみなし、名前が違えば違反とします。
          - 含意を入れれば、「互いに相手の式を（含意によっても）持つ」に広がり、意味の同じ別の書き方も捕まえられます。
          - この二つは同じ法則にまとめられます。
        - **書き方の水準**：書き方の部品（quant、at、neg など）の値に、それ自身の定義を通して意味を与える必要があります。たとえば quant: some を、some ノードの定義（個数 1 以上）に置き換えて読むようにすれば、at の個数と同じ式に落ちて、上の法則で捕まえられます。逆に言えば、今は書き方の部品が意味を持たない印になっていて、同じものの別の綴りが見えません。quant は、その典型でした。
        - **コードと体系の水準**：コードが名前で持つものを、体系から読むように置き換えるしかありません。いま進めている、シグネチャ以外の語をコードから除く作業そのものです。

        **順序の提案**
        1. 「互いに相手の式を持てば同じもの、名前が違えば違反」という法則を書く。コードの「式が同じ」の検査を置き換え、含意を通して意味の同じ別の書き方も捕まえる。
        2. その前提として、止めている含意の 14 件を片づける必要があります。

        not と all の判断はいったん置いて、こちらを先に進めますか。
