      text: |
        候補2の書き方で 56個のノードを試し書きし、検査を通しました。表示語だけの値を使わずに書けましたが、動詞の語根 16個が、互いを区別する式を持たないまま残っています。

        ## 書き方

        - **関係**は、生起体の下にあるノードで、両端（from と to）を持ちます。動詞の語根に当たります。
        - **形**は、関係のどちらかの端に来るもの全体です（届ける の from ＝ 届けるもの）。
        - **修飾語**は、関係のある位置を占めているという性質です。質か実現可能体の下に置きます。
        - **修飾**は、「その関係の、その位置を占めるもの」に限定することです。もう一方の端を固定できます。

        ```
        独立持続体   = 持続体のうち、「依存する」の from に来ないもの
        特定依存持続体 = 依存するもののうち、相手が1つに決まるもの
        情報         = 汎用依存持続体のうち、「述べる」の from に来るもの
        言語         = 情報のうち、「書く」の to に来るもの
        自然言語     = 言語のうち、「設計する」の to に来ないもの
        語           = 情報のうち、自然言語で書かれるもの
        一般語       = 語のうち、元の意味に依存されるもの
        新しい語     = 語のうち、元の意味に依存されないもの
        用語集の先頭 = 定義のうち、用語集の部分で、どの定義の後ろにも置かれないもの
        固定されている = 質。「固定する」の to を占めていること
        見える       = 実現可能体。「見る」の to を占めうること
        ```

        ## 前回までの問題が、どう変わったか

        | 前回までの問題 | 試し書きでの扱い |
        |---|---|
        | 表示語だけの値（130個） | 使わずに書けた。「元の意味がない」「見えない」は否定、「1つの層」は数量化で書いた |
        | 生起体の下位を修飾で作れない | 書けた（文章での注入 ＝ 届ける のうち、文脈で起こるもの） |
        | 終点の側からの修飾が書けない | 書けた。修飾 35回のうち 13回が to の位置 |
        | 1つの端に複数の中身（組） | 修飾を2つ並べて書けた（適用例 ＝ 事例を部分に持ち、判定を部分に持つ情報） |
        | 数 0 を使っていた（用語集の先頭） | 否定で書けた（どの定義の後ろにも置かれない） |
        | 修飾語の置き場所がない | 質・実現可能体の下に置いた。「可能」は実現可能体で書けた |

        検査は、型の合わない修飾（生起体を、持続体しか来られない位置に置く）、置き場所の誤った修飾語、式の重複を検出します。

        ## 残った問題

        ### 動詞の語根が、区別できていない

        これが最大の問題です。関係 16個は「生起体で、両端がこれこれ」としか書いていません。両端とも持続体である語根が 12個あり（固定する、見る、届ける、判定する、設計する など）、式の上では互いに区別がつきません。区別しているのは表示語だけです。

        意味の底が、値の表示語から、動詞の語根の表示語に移っただけとも言えます。「原始的なのは最上位の2つだけ」を満たすには、語根どうしを修飾で区別する必要があります。前に作った、関係を分類する軸（推移性、対称性など）がその手段になりますが、それだけで 12個を区別できるとは思えません。

        ### 書けなかったもの

        - **数**: モデルのパラメータ数のように、数そのものを中身として置く場所がありません。
        - **端が3つ以上ある関係**: 「届ける」には届け先があります。「で起こる」という別の関係に分けて書きましたが、これが正しい分け方かは分かりません。
        - **結果や産物**: 「判定」は「判定すること」の結果ですが、位置は from と to しかなく、産物を指せません。「事例に答えるもの」と書いて避けました。
        - **概念の定義**: 「語が述べる生起体」としか書けず、推論であることが落ちました。

        ## 次の手

        動詞の語根の区別が、次に解くべき問題だと考えます。語根 16個を並べて、どんな軸があれば互いを区別できるかを、同じ試験の形で調べます。「結果や産物」を指せない問題も、語根の構造（始まりと終わりを持つか、何かを生むか）に関わるので、同じ調査で扱えるはずです。

        記録は `spec/trial/pilot3.yaml` に置きました。
