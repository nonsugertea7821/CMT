      text: |
        上位（`above`）の健全性を、座標の類比で測りました。**真の側は健全でしたが、偽の側は健全ではなく、仮説 `h_above_sound` は反証です。** 偽の組の一部に、偽であることの座標上の根拠がありませんでした。

        ## 類比：幾何の順序

        前に話した座標の読みを使いました。概念は修飾の次元（動詞と位置の組）の上の点で、self が原点、any がゼロ、same が符号です。

        幾何では、順序を錐（cone）で決めます。「y は x の上位」を「y の座標（積み上がった式）がすべて x にもある」（`acc[y] ⊆ has[x]`）と定義すると、名前を使わない順序になります。

        これに照らすと、名前の上位 `above`（extends から導く）は次のようになります。
        - **真（上位である）**：extends の鎖が根拠になる。
        - **偽（上位でない）**：閉世界の「書いていない」から来るだけで、根拠があるとは限らない。偽にも「y にあって x にない式」という座標上の根拠があれば、真と偽の両方が座標で決まる。これを「健全」と呼んで確かめました。

        ## 結果（`sys_above_sound`、手順を先に commit してから測定）

        概念 541 個、組 292140 で測りました。

        | 項目 | 値 | 読み |
        |---|---|---|
        | 真の側で座標が合わない組 | 0 | 構成から 0 になるはずのもので、そのとおり |
        | 偽の組 | 290350 | — |
        | **偽なのに座標の根拠がない組** | **1535** | 反証 |
        | ├ 上位の側が座標を持たない | 941 | 上位が continuant か occurrent |
        | ├ 座標が等しく、名前だけが違う | 0 | — |
        | └ 残り | 594 | うち `deep_kind` が 440。違反の組の候補に入るのは 4 |

        ## 解釈

        - **最上位は座標でなく、地図の選び方です（941 組）。** continuant と occurrent は式を持たず、座標がゼロです。なので座標の上では、どの概念も両方の下に入ります。持続体と生起体を分けているのは名前だけで、多様体を覆う地図（chart）のどれを選ぶかに近いものです。最上位がシグネチャから導けないという `h_tops_derivable` の反証と同じ根です。
        - **名前が同じ点を重ねていることはありません（0 組）。** 座標が等しいのに名前の違う概念はありませんでした。順序の反対称は座標の上でも成り立っていて、part の反対称（両向きなら same）に当たる性質は今の体系では破れていません。
        - **深さを修飾にした影響は、局所の外に出ていました（594 組）。** `has_by_depth` によって深い概念はすべて `deep_kind` の式を持ちます。そのため座標の上では、深い概念が `deep_kind` の下に入ります（440 組）。`sys_hierarchy_object` で FCA の類比から予想した「順序を属性にすると概念が分類し直される」は実際に起きていました。ただ、違反の組の数え方は近くの候補だけを見るので、V には出ていなかったわけです。
          - 前回は予想が外れたように見えましたが、外れていたのは見る範囲のほうでした。
          - ほかに `std.hypothesis` 55 組、`lang.v_not_depend` 20 組、`runtime.run` 12 組など、座標の上では下にあるのに名前の上では下にない組があります。
          - 今回私が足したノード `above_order` も、含意によってこういう組を一つ作っています。
        - **対称性への含み。** `above` の偽を座標で裏付けられないのは、名前が座標にない区別を担っているところ（最上位）と、座標が名前にない分類を作っているところ（深さの修飾など）です。前回登録した `h_above_closed` の逆向きの法則（`above` なら祖先）は真の側を閉じるだけで、この偽の側は閉じません。

        ## 状態

        - ブランチ `claude/h_above_sound` に push しました。中身は事前登録、結果、観察と反証の順の commit です。tc と ec は通っています。
        - 仮説の登録そのもの（4 件）は `claude/model-concept-language-mapping-g0lw1i` にあり、まだ main に入っていません。

        PR を二つ立てますか？ 順番は次のとおりです。
        1. 登録のブランチの PR。マージすると issue が立ちます。
        2. `h_above_sound` の PR。issue を参照して立てます。

        それとも先に、594 組の残りを「座標を正とみて名前を直すもの」と「名前を正とみて座標を直すもの」に分けて検討しますか？
