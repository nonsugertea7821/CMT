        そうでした。推移性や反対称性は、ontology の「部分」や「後ろ」という関係についての法則です。ontology に属しています。それを移して公理の層を作ろうとしたのは、axiom という名前に中身を合わせようとしただけで、根拠がありませんでした。公理の層は作りません。

        ## 直した方針
        - **層の名前：** 今の axiom の層を signature に改めます。公理の層は置きません。
        - **signature に置くもの：** 層の法則 `layered` を上の語なしで書くのに必要な原始の語だけです。
          - 今ある、基礎の関係、分類の軸、変数
          - 基礎の関係「使う」（領域 → 領域）と「属する領域」（語 → 領域）
          - 法則を書く原始の語（前提・導く・求める）
        - **ontology の法則：** 推移性などは ontology に残します。
        - **層の法則：** `layered` と `visible_*` を、signature の語だけで書き直します。
        - **syntax の語：** syntax の `v_use` や `law_rule` などは、signature の原始の語の上の語にします。
        - **検査器：** 層の並びを「使う」の事実から読みます。`LAYERS` の決め打ちと、`v_use` の特別扱いは外します。

        ## 残る一点：言語の決定 `d_cscl_std_on_axiom`
        - これは採用済みの決定で、「std は公理の層に依存する」という主張です。
        - 公理の層を置かないので、この主張の指す先がなくなります。
        - 扱いの候補は二つです。
          - (a) 取り下げる。
          - (b) 「std は signature に依存する」と書き直す。
        - 主張を変えるのは言語の決定に関わるので、決めてください。

        この方針で進めてよいですか。
