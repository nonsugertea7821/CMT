        - **1.5B:** joint が上がったのは、apply ではなく explain（0.833 → 0.958）と para の上がりによるものです。
        - **全体:** 事前に決めた規則で、判定しないモデルがあれば他方の判定を採ります。なので 4B の判定を採り、h_consistency_bound_by_apply は支持です。
