        | モデル | apply の変化 | joint の変化 | 判定 |
        |---|---|---|---|
        | 4B | 0.750 → 0.917 | 0.708 → 0.833 | 支持（joint の上がりは apply の上がりの半分以上） |
        | 1.5B | 0.583 → 0.583 | 0.458 → 0.542 | 判定しない（apply が上がらず、前提を満たさない） |

