      text: |
        はい、そのとおりです。考え方は同じです。

        「在る」を時間の関数として、在れば 1、在らなければ 0 と書くと、出現は階段関数になります。

        > f(t) = 0（t < t₀）、1（t ≥ t₀）

        t₀ で値が跳びます。

        - 左から近づいた極限は 0、右から近づいた極限は 1 で、食い違います。
        - 極限では t₀ ちょうどの値が決まらないので、どちらかに約束で決めるしかありません。
        - 右側の極限に合わせる（右連続にする）のが、さきほどの半開区間 [t₀, ∞) です。確率の分布関数や、ヘヴィサイドの階段関数の多くの流儀が右連続を採るのも、継ぎ目を一度だけ数えるためです。

        体系に当てはめると、きれいに対応します。

        | 微積分 | 体系 |
        |---|---|
        | 左極限 f(t₀−) | pre（前の状態） |
        | 右極限 f(t₀+) | post（後の状態） |
        | t₀ ちょうどの値 f(t₀) | 決めていない |

        出現の枠「pre で在らず、post で在る」は、「左極限が 0、右極限が 1」とちょうど同じ形です。動詞は跳びの点 t₀ に置かれていて、そこでの値そのものは、今の体系では語っていません。

        前の答えで、境目の瞬間をどちらに入れるかが決まらないと書いた空白は、この「跳びの点での値を決めていない」ことに当たります。右連続を採れば、境目は post の側に入ります。左連続を採れば、pre の側に入ります。どちらかを約束すれば決まります。
