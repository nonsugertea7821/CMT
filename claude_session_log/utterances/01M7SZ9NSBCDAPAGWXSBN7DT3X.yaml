      text: |
        理解できたと思います。あなたの言う質的な限定は、範囲を狭めることではありませんでした。**ある分類を、どの軸（量）で測って分けるかを決めること**ですね。

        - 「色」という分類を、「波長」という量の軸で分ける。
        - 「資産」という分類を、「金（金額）」という量の軸で分ける。

        量的な限定は、その軸の上で値の範囲を決めることです（何 nm から何 nm まで、何円以上）。

        ## 幾何で読むと
        - refer の述べる領域は、高い次元の空間です。前に話したとおり凸です。
        - 質的な限定は、その空間から一本の軸への写像 f を一つ選ぶことです。f は物の点に「波長」や「金額」という値を割り当てます。
        - 量的な限定は、軸の上の区間を決めることです。区間は軸の上ではいつも凸です。
        - 問題は、その区間を元の空間に引き戻した範囲（f の値がその区間に入る点の集まり）です。
          - f がアフィン（一次式）なら、引き戻した範囲は二枚の平行な面にはさまれた板になり、凸です。
          - f がアフィンでなければ、引き戻した範囲は一般に凸ではありません。

        あなたの二つの例は、どちらも f がアフィンでない例になっています。
        - **色と波長**: 見えている色を波長で測ると、紫（赤紫）には対応する単一の波長がありません。紫はスペクトルの両端の混ぜ合わせです。色の分類は、波長の軸の上では凸になりません。
        - **資産と金額**: 物や権利に金額を割り当てる関数は、相場や時点で変わります。線形でもありません。「X 円以上の資産」は、物の空間では凸になりません。

        ですから「限定すると凸でなくなる」は、こう言い直せます。**凸でなくなるのは、分類を測る軸への写像がアフィンでないとき**。

        ## Gärdenfors との関係
        二つは矛盾しません。凸を見ている場所が違います。
        - Gärdenfors は、分類がちょうど凸になるような軸を「質の次元」として選んでいます。色なら、波長ではなく、色相・彩度・明度という知覚の軸です。色相は環になっていて、紫はそこでは赤と青の間に入ります。
        - つまり彼の凸は、測る軸の側の空間での凸です。あなたの言う凸でないところは、元の領域の側（あるいは物理の軸の側）です。
        - 言いかえると、Gärdenfors の理論は「凸になる軸を選べば概念は凸」と言っていて、軸を選ぶこと自体の中身は扱っていません。あなたの言う質的な限定は、その選ぶところを指しています。

        ## 体系の語との対応
        - 軸の選択に近いのは、`at`（修飾の中の値の指定）と、値の軸です。法則 `at_axis`（`syntax.yaml:276`）は「限定が値を指定する軸は、比べる概念の値の軸かその上位（円の量で年齢を比べない）」です。
        - 今の体系が見ているのは、軸が合っているかだけです。軸への写像がどういう形か（アフィンかどうか）は書かれていません。
        - 量的な限定は、`at` の値（`count: {gt: 1}` のような閾値や範囲）にあたります。

        ## 測れること（まだ登録していません）
        モデルの表現空間で、ある軸の値（金額、年代、大きさなど）が線形に読み出せるかを調べれば、写像がアフィンに近いかどうかが分かります。線形に読み出せるなら、その軸で区切った範囲は表現空間で凸に近いはずです。読み出せないなら、凸でないはずです。

        モデルが空間や時間を線形に表している、という先行研究があったと記憶しています。確かめてから出します。

        この読みで合っていますか。合っていれば、仮説として登録して進めます。
