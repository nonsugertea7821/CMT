      text: |
        あると思います。ゴールの「一貫した概念認識」と、いま E33 で見えている「往復が効かない」に、直接つながりそうな線を挙げます。文献は記憶から挙げているので、登録の前に出典を確かめます。

        **1. 生物学・発達: 「分化」として見る（いちばん近い）**
        - Saxe, McClelland, Ganguli (2019, PNAS) は、深い線形ネットワークの学習を解析しました。粗い区別（上位概念）が先に、細かい区別（兄弟概念）が後に、段階的に分かれていくことを示しています。
        - その背景には、Waddington の発生の地形（後成的地形）があります。細胞は、谷が分かれていくように運命づけられていきます。
        - **示唆**: 兄弟の弁別は、上位概念の「谷」が既にあって、それが分かれることで生まれます。そうなら、ゼロから二つを同時に作る (B) の形づくりは、もともと難しいはずです。新しい語を使う E33 で round が効かないことと合います。
        - さきほどの対の仮説のうち、h_round_trip_bounds_present（境界づけ）が通り、h_round_trip_forms_absent（形づくり）が落ちる、という予想になります。

        **2. 物理学: 対称性の破れとしての分化**
        - Landau の相転移では、上位の状態がもつ対称性が破れ、区別できる複数の状態に分かれます。
        - **示唆**: 兄弟概念は「上位概念の対称性が、ある軸で破れたもの」と書けます。弁別に要るのは、その破れの軸（秩序変数）です。
        - 体系では、限定の軸（at・axis）が秩序変数にあたります。「兄弟の差は、一つの軸の値の差に集まる」という仮説が立ちます。

        **3. 幾何: 階層は直交、分類は単体（体系に既にある線の延長）**
        - 体系には Park ら（2025）の「下位 = 上位 + 直交する差分」が既に入っています。
        - これを延ばすと、往復で足しているベクトルが上位の方向に沿っているなら、直交する兄弟の差は作れないはずです。round が効かない理由の候補になり、E33 の隠れ状態で測れます。
        - さらに、木のような深い階層は、ユークリッド空間では歪みます。双曲空間なら低い歪みで埋め込めます（Nickel & Kiela 2017）。層ベクトルを足していく方式が、深い階層で破綻するかどうか、という問いになります。

        **4. 力学・微分幾何: 一貫性を「ホロノミー」として測る（一番面白いと思うもの）**
        - 体系には領域を「チャート（座標の地図）」として扱う系列があります（h_signature_all_charts など）。多様体の言葉で言えば、一貫した概念認識は、チャートの間の写しが矛盾しないこと（コサイクル条件）にあたります。
        - **示唆**: 抽象→具体→抽象の往復は、ループです。ループを一周して元の概念に戻らないずれは、曲率（ホロノミー）として測れます。
        - 「一貫性」を、往復一周での隠れ状態のずれとして数で定義できます。これは d_metric に直接つながる可能性があります。

        **5. 物理学: くりこみ群としての抽象化**
        - Mehta & Schwab (2014) は、くりこみ群と深層学習の対応を論じています。粗視化（抽象化）は情報を捨てるので、具体へ戻る向きは一意に決まりません。
        - **示唆**: 抽象から具体への向きには、何か別の前提が要ります。これは (A)（具体が既に暗黙にある）を要求する、というのが 1 と同じ結論への物理からの道です。

        **このあと**
        - 1・3・4 を未検証の仮説として登録します。
          - 1 と 5 は、さきほどの往復の対の仮説の根拠として先行研究を足し、d_consolidation_in_vector に結びます。
          - 3 は、E33 の隠れ状態で兄弟の差と上位の方向が直交するかを問う仮説で、d_road_region に結びます。
          - 4 は、一貫性をホロノミーで定義する仮説で、d_metric に結びます。
        - 先行研究の出典は確かめてから入れます。新しい概念を足すので、手で見ていただく登録になります。

        （いまは E33 の 5 組目の round の最中です）

        本線 a 識別子化、d_consolidation_in_vector と d_road_region・d_metric に結ぶ予定の新しい示唆
