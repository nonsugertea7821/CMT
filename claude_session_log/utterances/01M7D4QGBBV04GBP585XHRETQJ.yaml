      text: |
        明確にする案を出します。2つの語は「言語」と「その言語で書かれた1つの文」の関係にある、と区別するのが筋だと考えます。

        ## 案

        | 語 | 指すもの | たとえ |
        |---|---|---|
        | 制御自然言語 | 書き方の体系そのもの。語彙と文法 | 日本語 |
        | 概念式 | その体系で書かれた、1つの概念の記述 | 日本語で書かれた1つの文 |

        最初の構成にあった「概念式の体系は、制御自然言語で記述する」は、「概念式の体系」と「制御自然言語」が同じものを指していた、と読めます。体系のほうを制御自然言語と呼び、個々の記述を概念式と呼べば、両方の語が残り、役割が重なりません。

        ## 正本での書き方

        前回、2つを別のノードとして加えていました。いまの式は次のとおりです。

        ```
        制御自然言語 = 言語のうち、設計されたもので、定義を書くのに使われるもの
        概念式       = 文のうち、制御自然言語で書かれ、概念について述べるもの
        定義         = 文のうち、概念について述べるもの
        ```

        並べると、概念式は「定義のうち、制御自然言語で書かれたもの」だと分かります。私は概念式を定義の下に置かず、文の下に直接置いていました。次のように直すべきです。

        ```
        概念式 = 定義のうち、制御自然言語で書かれたもの
        ```

        こうすると、自然言語で書かれた定義（実験でモデルに渡してきたもの）と、概念式とが、同じ「定義」の下で、書かれた言語の違いとして並びます。前回の「実験では概念式を使っていない」という話も、この区別で正確に言えます。

        ## もう1つの選択肢

        2つを同じものとして1語にまとめる方法もあります。この体系は、同じ式を持つノードを2つ置くことを許さないので、同義語は検査で弾かれます。その場合はどちらかの語を捨てることになります。

        ただし、体系と個々の記述は実際に別のものです（「制御自然言語を設計する」と「概念式を書く」は違う行為です）。1語にまとめると、どちらを指しているかが文脈頼みになります。私は区別する案を推します。

        区別する案でよければ、概念式を定義の下に置き直します。
