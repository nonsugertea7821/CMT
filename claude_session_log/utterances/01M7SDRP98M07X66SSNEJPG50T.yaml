      text: |
        日本語が硬く、読みにくくなっていたと思います。気をつけます。これまでの流れを、大きく四つに分けてまとめます。

        **1. 目標**

        このリポジトリの目標は、言語モデルが概念を一貫して扱えるかを測ることです。ある概念を定義し直したとき、説明・適用・判定と使い方を変えても、その定義に従えるかを見ます。実験には Qwen2.5-1.5B を使っています。

        **2. モデルの実験（体系に頼らないもの）**

        概念のベクトルを足す、限定の差分ベクトルを使う、といった介入で、定義し直した意味への追従が上がるかを調べてきました。
        - 結果は反証か mixed が多く、介入で一貫性が素直に上がる、という結果はまだ出ていません。
        - 結論の出ていないものが、Draft の PR #282・#286・#287・#289 として残っています。

        **3. 体系（CSCL）そのものの健全性**

        型検査器と法則に、穴や矛盾がないかを確かめてきました。
        - #147・#296・#298 では、法則を足したときに体系がほかに何も変わらないかを測りました。
        - 三回とも、足した法則自身の宣言まで「変わった」と数えてしまう、測り方の欠けが出ました。
        - これについて「概念系の側から検知できないか」とご質問をいただき、検知の前提を `h_family_refers_laws` として登録しました。
        - いま、その前提を確かめる実験（#313）を裏で走らせています。

        **4. モデルに CSCL を書かせる実験（E29〜E32）**

        - E29: 1.5B のモデルは、形は正しく書けますが、体系にない語を作ってしまいます（24 件中 5 件だけが通りました）。
        - E30: 型検査の誤りの文を返して書き直させても、通る数は増えませんでした（反証）。
        - E31: 使える語の一覧を先に見せると、作った語がなくなり、通る数が 5 件から 8 件に増えました（支持）。残った誤りは、動詞の端の型や法則への違反でした。
        - E32: 概念ベクトルの固有成分の似かたは、概念式の似かたと弱く合っていました（支持）。ただ、定義文の語の重なりによる可能性と区別できていません。

        **CSCL から日本語への翻訳について**

        扱う価値はあると思います。理由は二つです。
        - 表示語（display）は「式から訳した名前」という建前ですが、実際には、式にできていない意味の置き場にもなっています。
        - E31 でモデルに見せた用語集も、表示語を使っています。訳が式を正しく反映しているかは、モデルの実験の土台にもなります。

        体系には、近い仮説がすでにあります。
        - `sys_ja_roundtrip`（日本語との往復）の実験の記録
        - 未検証の `h_ja_connective`

        正面から扱うなら、たとえば「式から機械的に訳した日本語で、元の式を復元できるか」を仮説として立てる形になります。どこまで扱うかは方向の選択なので、ご判断ください。扱うことになれば、取り決めどおり、先に仮説として登録します。
