        I've started the test of whether the high-variance dimensions track how a word is written rather than which group it belongs to (h_spread_band_by_display). It is running now in Draft PR #808, assigned to you and watched.

        The procedure and verdict rule are committed (4f9e805) before seeing any numbers. The test splits dimensions the same way as #806: the 256 with the most variance (top) and the remaining 1,280 (low). For each band it measures what share of the variance is explained by:
        - whether a word is written the original way or the swapped way;
        - which word it is;
        - which group it belongs to.

        The verdict uses layer 8. If the "how it's written" share is at least 0.05 higher in the top band than in the low band, the hypothesis is supported. If it isn't higher at all, it's refuted. Anything in between gets no verdict.

        The hypothesis itself is registered in #807, which hasn't merged yet. I'll merge main into #808 and link the issue once #807 lands, before recording the results.

