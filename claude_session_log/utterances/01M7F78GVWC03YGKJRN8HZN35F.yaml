      text: |
        一つ目の段階として、題材の 24 語（実験の G2 群で再定義した語）を概念式で書き、新しい領域 `subj` として `spec/subj.yaml` に置きました（8d32e6c、push 済み）。`check_spec.py` と `run_spec.py` は両方とも通っています。

        **書き方**
        - **限定の積み重ね:** 1 つのノードに限定は 1 つだけなので、条件が 2 つ以上ある語は、上位に限定を積み重ねて書きました。たとえば在庫は「商品 ← 倉庫にある商品 ← 注文に引き当てられていないもの」です。
        - **数の条件:** 「25 歳未満」「10 個以上」「9 時から 13 時」のような条件のために、体系に軸 `amount`（量）を足しました。値は `{lt: 25}` のような範囲の判定式で書きます。
        - **固有のもの:** 日曜、本州、トマトなどは個体として書き、式の中から参照しています。
        - **「も含む」型の定義:** 果物や魚類のように、本来は含まれないものを含める定義は式だけでは書けません。そこで、「トマトが分類される分類」に属する商品、という式にしました。トマトやエビが分類されることは事実として書いています。

        **検査器の修正（2 点）**
        - 軸についての誤りを報告するときに落ちる不具合がありました。直しています。
        - 個体はどれも exp 領域のものとして扱われていたので、領域ごとに区別するようにしました。

        **判断を仰ぎたい点**
        - **商品の式が不自然です。** 商品は「注文に引き当てられうるもの」で区別しています。ノードは何かで区別して書く必要があり、人・法人・商品のような一番基本的な名詞では、その手がかりを関係から取るしかありませんでした。
        - **用語の対応づけが単純化されています。** 一部は近いもので置き換えました。たとえば「権限を持つ」は「権限を与えられる」、「欠席」は「開始時刻に席にいなかった、という質を持つ出席の記録」としています。

        次は二つ目の段階です。それぞれの概念式を、上位までたどって読める文字列に変換する処理を作ります。そのうえで、同じ設問に対して、日本語の定義を与えた場合と概念式を与えた場合の正答率を比べます。学習はせず推論だけなので、CPU でも回せる見込みです。ただし L4 の計算と CPU を取り合うので、L4 が終わってから走らせるつもりです。
