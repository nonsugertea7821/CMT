        まだ手を付けていません。`spec/exp.yaml` には未着手の残り項目として、次の 3 つが積まれたままです。

        - `b_write_subject_concepts_in_controlled_language`：実験で使う語（概念）を体系制御言語で書く
        - `b_definitions_given_as_concept_expressions`：その定義を、日本語ではなく概念式としてモデルに与える
