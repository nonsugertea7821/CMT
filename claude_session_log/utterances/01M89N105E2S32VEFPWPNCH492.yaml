      text: |
        今の実験からの見立てでは、CSCL は「モデルに読ませる文」としての効き目は、まだはっきりしていません。期待できそうなのは、「教える材料の作り元」と「答え合わせ（検査器）」の役です。いちばん肝心の「一貫性を上げるか」は、まだ測っていません。役割ごとに分けて書きます。

        **1. モデルに CSCL の文を見せる（前置きに置く）**: 混ざった結果
        - E10: 定義を書き替えた（元の意味とぶつかる）設問では、CSCL の文を見せると正答が上がりました。
        - 同じ E10 で、書き替えと関係のない、ふつうの設問では正答が下がりました。
        - 「CSCL は書き替えへの追従を上げる」という仮説（h_cscl_raises_following）は、支持と反証が両方出て、判定は混ざった結果（mixed）です。
        - モデルが自分で CSCL を書く道も弱いです。
          - E29: モデルが書いた CSCL の行は、多くが型検査を通りませんでした（h_model_can_write_cscl は反証）。
          - E11: モデルに書かせてから答えさせると、直接答えるより下がりました。

        **2. 教える材料の作り元（ベクトルの学習の教師）**: 支持が一つ
        - E3: CSCL の表現から作った教師でベクトルを学習すると、書き替えた設問の正答が上がりました。
        - ただし、同じ中身を自然な日本語で書いた教師と比べて、CSCL の方が良いかは測っていません。CSCL を元にする利点がこの比べで決まるので、ここがいちばん大事な空白です。

        **3. 検査器（型検査の結果をモデルに渡す）**: 効くが、条件つき
        - E54: 検査の結果をただ渡しても、モデルは使いませんでした。
        - E55・E56: 読み方を教えると、使う場合と使わない場合がありました（mixed）。
        - E61（4B）: 定義を外すと、モデルは検査器の行にほぼ従いました。正しい行で 0.969、誤った行で 0.094 です。
          - 誤った行にも引っぱられるので、検査器が正しいことが前提になります。
          - 一方で、定義がそろっていると、誤った行を退けました。

        **4. 正本（人とプログラムが管理する元の記述）**: 実験では測っていない
        - 定義を一か所に式で持ち、文章とベクトルをそこから作るという設計の側の利点です。いま実験に使っている材料もこの形で作っていますが、モデルの成績では測れない種類の価値です。

        **まとめ**
        - 今のところ CSCL の強みは、モデルの外にあります。きちんとした定義の置き場であり、教える材料の作り元であり、答え合わせの道具です。
        - モデルに直接読ませる言語としての強みは、まだ示せていません。
        - 目的の「使い方をまたいだ一貫性」に CSCL が効くかを直接問う仮説は、登録済みで未検証です。
          - 検査器の出力で教えると一貫性が上がるか（h_consistency_by_checker_teaching）
          - CSCL から作った教材で教えると一貫性が上がるか（h_consistency_by_formal_corpus）
          - 教材がモデルによらず作れるか（h_formal_teacher_independent_of_model）

          この三つが「どのくらい役立つか」への本当の答えになります。どれも学習を伴い、CPU では重いので、E64 の後に回る順です。
