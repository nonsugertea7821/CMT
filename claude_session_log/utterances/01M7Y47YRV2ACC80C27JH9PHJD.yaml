        そのとおりです。自動マージの判定を spec のジョブの中に入れ、Python の準備も検査も一度で済むようにしました（#634）。ワークフローの変更なので手で見てください。CI はまだ走っていません。

        - **一つのジョブに:** spec の検査がすべて通った後、同じジョブの最後で判定とマージをします。ブランチを消す・issue の同期・衝突の知らせの段も移し、`auto_merge.yml` は消しました。
        - **ec を足した:** これまで exp の検査（ec）は auto-merge でしか走っていなかったので、spec に入れました。
        - **前より厳しくなる点:** 型検査は PR を main にマージした形で走ります。これまでの auto-merge は PR の head で検査していました。
        - **spec の結果を待たない問題も消える:** 前の段が一つでも落ちれば、判定の段は走りません。
        - **Draft を外したとき:** そのときも spec が走るようにしました。判定が走る時機は、これまでの auto-merge と同じです。
        - **CLAUDE.md:** 「ワークフロー auto-merge」と書いていた二か所を「spec の自動マージの段」に直しました。

        `test_auto_merge.py` と yaml の読み込みは手元で通りました。ワークフローそのものは手元では回していません。この PR は .github を触るので、判定は「手で見る」になり、コメントが付くはずです。新しい段が動いているかは、そのコメントで確かめられます。

        これは #632 で登録した h_merge_verdict_by_spec の実装です。仮説の確かめではないので、issue #633 は閉じません。

