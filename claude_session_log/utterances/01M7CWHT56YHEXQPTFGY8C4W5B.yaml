        直しました。説明文を持つ実体は持続体と生起体の2つだけになり、残る124の実体はすべて、この2つから修飾を重ねた概念式で書いてあります。検査でもこの規則を強制していて、他の実体に説明文を付けると失敗します。

        ## 概念式の例

        展開すると、どの実体も最上位の2つのどちらかから始まります。

        ```
        質     = continuant[dependence=on_specific_bearer][realization=needs_no_process]
        役割   = continuant[dependence=on_specific_bearer][realization=needs_process][grounding=external_circumstance]
        情報   = continuant[dependence=on_any_bearer][aboutness=describes]
        定義   = 情報[content=concept, speech_act=states, unit=sentence]
        再定義 = 定義[agreement_with_prior=differs, target=common_word]
        概念   = occurrent[temporal_extent=extended][performed_by=model][triggered_by=word]
        元の意味 = continuant[dependence=on_specific_bearer][realization=needs_process][grounding=internal_makeup][bearer=weights, target=word]
        ```

        「汎用依存持続体」は、ご指摘のとおり持続体を「依存のしかた＝担い手を替えても同一である」で修飾した式になっています。

