      text: |
        E16として、E3 のベクトルを概念間の共通成分 m と概念ごとの固有成分 s に分け、片方ずつ足しました。予想は半分外れました。spec/exp.yaml に記録し、check_spec と run_spec を通してコミット・プッシュ済みです（6a74eed）。

        | | none | full（m＋s） | 共通 m だけ | 固有 s だけ |
        |---|---|---|---|---|
        | G2c 正答率 | 0.38 | **0.79** | 0.58 | 0.75 |
        | G2c 両方正しい | 0.29 | **0.71** | 0.50 | 0.38 |
        | G2k 正答率 | 0.75 | **0.92** | 0.75 | 0.79 |
        | G2k 両方正しい | 0.50 | **0.88** | 0.71 | 0.33 |

        大きさの平均は full 25.2、共通 11.9、固有 22.1 で、ベクトルの大半は固有成分です。

        ## 読めること

        **1. 衝突側の伸びの大半を運んでいるのは固有成分です（予想と逆）。**
        固有成分だけで G2c は 0.75 まで上がりました。共通成分が元の意味を抑えて衝突側を上げる、という予想は主役ではありませんでした。予想していた仮説「共通成分は対照側を下げる」も外れで、共通成分だけでも G2k は 0.75 と none のままでした。

        **2. 共通成分は答えを安定させる役のようです。**
        共通成分だけだと、正答率はあまり上がりませんが、「両方正しい」は両群で上がります（G2c 0.29→0.50、G2k 0.50→0.71）。逆に固有成分だけだと、正答率は高いのに「両方正しい」は低いままです（0.38 / 0.33）。

        **3. 二つは足して初めて完成します。**
        full は両方の指標で、どちらの成分単独よりも高くなりました。

        - **固有成分:** どちらの答えかという内容を運びます。ただ単独では、選択肢の順序に答えが左右されます。
        - **共通成分:** 内容は持たず、選択肢の位置に引きずられる癖を消して、判断を安定させているように見えます。

        ## 含意の更新

        - **前回の見立ての修正:** 前回、near・概念式・無意味化に共通する「衝突側を上げると対照側が下がる」型は、共通の抑制の量で説明できるかもしれないと言いました。この仮説は弱まりました。
        - **残る共通の見方:** 代わりに、「内容（概念ごとの成分）」と「判断の安定（概念によらない成分）」の二つの軸で見る方が合いそうです。文章の経路で E15 に出た、概念によらない大きなずれも、後者の側にある可能性があります。
        - **次の 3 への意味:** 意味の候補の差でベクトルを作る実験では、狙うべきは固有成分です。固有成分さえ作れれば、共通成分は全概念で一つ学習しておいて使い回せる見込みがあります。学習しない作り方の現実味が上がりました。

        ## 記録した内容

        - **族と観察:** 族 e16（条件は none / full / common / specific）を足しました。観察は3件です。
        - **仮説:**
          - 「固有成分は追従を上げる」は支持です。
          - 「共通成分は対照側を下げる」は否定です。
        - **ノード:** 「概念ベクトルの共通成分」と「概念ベクトルの固有成分」を足しました。

        共通成分だけは、「部分になる」の向きに不安が残ります。最初は「語に依存しない」と書きましたが、入れ替えベクトルと同じ式になって検査に弾かれました。そこで「どの概念ベクトルにも部分として含まれる」と書き直しています。ただ v = m + s という分解の向きどおりに読めば、本来は「共通成分が各概念ベクトルの部分になる」で、今の書き方はその逆向きに読めます。直すかどうか確認させてください。

        次は 3（語の意味の候補どうしの差で、固有成分を学習なしに作る）に進むのがよいと考えます。そのためには、各語が目的の意味で使われている自然な文と、元の意味で使われている文を、それぞれ数文ずつ用意する必要があります。
