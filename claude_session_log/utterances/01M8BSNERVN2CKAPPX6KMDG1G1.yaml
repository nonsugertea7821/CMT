        2. Key Technical Concepts:
           - **Midpoint test (#960 and #963)**:
             - Data: the 759 concepts with string extends and display. Groups are same-extends sets of 4 or more: 42 groups, 10009 pairs.
             - For each pair (a, b), find the group member c* nearest to the cosine midpoint.
             - Score: c*'s percentile rank, among the other members, of min(Jaccard(c, a), Jaccard(c, b)) over expression features.
             - Features: (path, leaf) pairs, plus (path, `<extends of referent>`) for node-name leaves.
             - Statistic T = mean percentile. Null = shuffle features within each group, 2000 runs, np.random.default_rng(0).
             - Verdict at layer 8: support if T − null ≥ 0.05 and p ≤ 0.05.
             - Surface control: Jaccard of display character 2-grams.
             - Vectors come from geo_axis_readout_midpoint.vectors (Qwen2.5-1.5B, text 「+w, mean over the token positions of w, layers 8/14/20).
           - **Opaque rendering**:
