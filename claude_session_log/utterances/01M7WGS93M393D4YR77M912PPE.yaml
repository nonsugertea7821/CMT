      text: |
        機械にとってはまだ問題ありません。でも私（モデル）にとっては、もうきつい状態です。

        **いまの数字**
        - exp.yaml は 8596 行、約 700KB です。claims.yaml と合わせると約 1万行です。
        - yaml を読み込むだけなら 2 秒です。tc と ec はそれぞれ約 20 秒かかりますが、時間の大半は法則の評価で、読み込みではないと見ています（分けて測ってはいません）。行が増えても、すぐ破綻はしません。

        **私にとってきつい点**
        - 700KB は、一度に読める量をすでに超えています。だから私は grep で欲しい行だけを拾って読んでいます。
        - そのせいで見えるのは断片だけで、名前で探すことになります。これは h_model_reads_by_name（モデルは名前で読む）が指していることそのものです。今日の、並びを直積と取り違えた誤りも、全体を見ずに名前の並びの見た目で書いたのが原因でした。

        **行が膨らんでいる中身**
        - 8596 行のうち、`_cond_` を含む行（測定の族の軸の値の行）が 4878 行あり、半分を超えています。
        - これは結果ファイルの要約の鍵を、私が機械的に写しているものです。私が測るたびに 20〜30 行ずつ増えます。
        - 値は結果ファイルが与えているので、体系に手で書く理由は薄いです。検査が結果ファイルから直接読めば、この行は消せるはずです。

        そこで、これを仮説 **h_axis_value_from_result**（軸の値は結果ファイルから定まる）として登録しました（#492、登録だけの PR）。運用の仮説なので、ロードマップの決定には結ばず、**わき道**としてあります。

        確かめるときは、軸の行を結果ファイルから生成した写しで、ec の照合が変わらないかを数えるつもりです。通れば、exp.yaml はおよそ半分になります。
