        h_extends_derived_with_mod を確かめました。結果は反証ですが、一致は #549 のときより大きく増えました。

        - **結果（#553、Draft を外し済み）**: 比べる中身に `mod` を足すと、導いた親と書いた親が揃ったのは、下位の動詞 70 のうち 69 でした（#549 では 60）。最上位の 49 は、前と同じくすべて親なしになりました。
        - **分かったこと**: channel 系の 9 動詞は名前だけの違いではなく、`mod` で区別されていました。#549 で親が決まらなかったのは、比べる式に `mod` が欠けていたためです。
        - **残った一つ**: teacher_both です。from に入っている def_and_examples は、definition_text と examples_only の両方の下にあります。そのため式で見ると teacher_recite と teacher_examples の二つが親の候補になり、どちらかに決まりません。書いた extends は、その二つに共通する親 teaching を選んでいます。
        - **含意（新しい仮説）**: 直し方を二通り、登録だけの PR #554 に対で出しました。条件を満たせば自動でマージされます。
          - h_extends_meet_of_minimal（導出の側を直す）: 最小の候補が複数あるときは、その共通の親を導く。これで 70 すべてが揃うと見込みます。
          - h_extends_multi_parent（体系の側を直す）: extends に複数の親を書けるようにする。
        - **#529**: 変わらず、利用者が見てマージするのを待っています。

