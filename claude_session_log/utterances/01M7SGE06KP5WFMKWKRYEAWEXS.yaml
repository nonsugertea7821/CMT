      text: |
        はい、選ぶ必要があると思います。選び方の候補を整理します。

        **まず分けておきたいこと：表すことと、行うこと**
        - 「名付ける」という操作を、体系の中に概念として書くこと自体は、一意化とぶつかりません。書いてあるだけで、評価器がそれを実行しないなら、新しいノードは増えないからです。今の `definition_cycle` のように、性質として述べるだけの形です。
        - ぶつかるのは、評価器（法則・型検査）がその操作を実行して、ノードを作り出せる場合です。

        **行える形にするなら、選択肢は 2 つです**
        1. **書けなくする。** refer の先に、自分と同じ層の文を置けないようにします。論理学でいうタルスキの階層や、ラッセルの型の階層と同じ発想です。「真である」は一つ下の層の文にしか言えない、という形です。名付けは上の層からしかできないので、どの層の中でも一意化が保たれます。
        2. **制約を掛けて書けるようにする。** 同じ層の中でも refer を許す代わりに、入れ子の深さに上限を置く、または新しいノードを作る規則の形を限る（ガード付き）、などをします。止まることと、同じかどうかの判定ができることを、制約の側で守ります。

        **今の体系はどこにいるか**
        - `with` には名前しか置けません。そして名付けは規則の外（人か、登録の手順）で行っています。結果として、1 の「書けない」に近い位置にいます。ただし、層を式で決めたうえで禁じているのではなく、文法がたまたま許していないだけです。
        - ですから、今のままでは「なぜ書けないのか」が式になっていません。これも、前に言われた「式にできていない区別は負債」の一つだと思います。

        どちらを選ぶかは、体系の方向そのものなので、決めていただきたいです。決まったら、その制約を仮説として登録し、今の体系がそれを満たしているかを確かめるところから始めます。
