      text: |
        悩みどころは、いまの docs が「凍結した文章」で、しかも中身が言語と実験の両方にまたがっていることだと思います。案を三つ挙げて、最後におすすめを書きます。

        **1. 凍結した文章は「当時の記録」として退避する**
        - docs/design.md と exp/experiments/README.md を、たとえば `docs/archive/` に移します。冒頭に「この時点の記録。パスや用語は古い。正本は cscl.yaml の範囲」と一行だけ足します。
        - 本文は触らないので、凍結の扱いは崩れません。中の旧パスが今と合わないことも、記録だと明示すれば問題になりません。

        **2. 新しい docs は層ごとに分ける**
        - `cscl/docs/`：言語の説明。文法、型の規則（axiom と std の法則）、bootstrap の使い方。
        - `exp/docs/`：実験の説明。E1〜E19 の目的と結果の要約。
        - 言語の変更は claude/cscl、実験は claude/exp で直せるので、ブランチの分け方とも合います。

        **3. docs を体系から生成する**
        - 正本は体系で、自然言語は表示だけ、という方針と最も合う形です。
        - 法則の一覧（display 付き）、std の語彙、仮説と観察の状態は、型検査器と render から機械的に出せます。手で書く必要があるのは、設計の意図や経緯など、体系に書けない部分だけになります。
        - 生成した文書なら、言語や実験が変わっても古くなりません。

        **おすすめ**
        1 と 3 を組み合わせるのがよいと思います。
        - 凍結した文章は archive に移して触らない。
        - 言語のリファレンスと実験の状況一覧は体系から生成する（cscl/docs、exp/docs）。
        - 手書きは「なぜそう設計したか」を書く短い文章だけにする。

        気になるのは、design.md が今でも「設計の意図」を書いた唯一の文章なのかどうかです。もしそうなら、退避するだけでは意図の置き場がなくなります。その場合は、新しい設計メモを cscl/docs に書き起こす必要があります。

        どうしますか。生成の仕組みから作るなら、まずは言語のリファレンス（法則の一覧と std の語彙）から始めるのが小さくて済みます。
