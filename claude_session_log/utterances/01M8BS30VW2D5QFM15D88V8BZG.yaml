        ご記憶のとおり、近い実験が四つ見つかりました。どれも結果は反証です。ただ、#963 とまったく同じ問いを測ったものはありませんでした。

        ## 近い実験
        **1. E35（h_expression_makes_state_unique、反証）: 目的がいちばん近い**
        - **問い:** 概念式を文脈に与えると、語を隠した状態が一つの語に絞れるか。
        - **結果:** 絞れた割合は、式なし 0.42 → 式あり 0.28 で、かえって下がりました。
        - **#963 との違い:** 式を「設問の前置き」として与え、答えの絞れ方を見ました。区画の形（中点）は見ていません。

        **2. geo_genus_region_immune_display（h_genus_region_immune_display、反証）: #960 の「字の重なり」に直接かかわる**
        - **問い:** 表示語の書き方（漢字→ひらがな など）を替えても、上位概念の区画は保たれるか。
        - **結果（層 8 で区画にまとまる率）:**

          | 語彙 | 率 |
          |---|---|
          | 元の書き方 | 0.78 |
          | 書き替えた語だけ | 0.23 |
          | 元と書き替えを混ぜたもの | 0.44 |

        - 書き方を替えるだけで区画が崩れました。区画は字面に強く引かれる、ということです。#960 で字の重なりが式の重なりと同じくらい効いたのと、向きが合っています。

        **3. 表示語の字面と上位概念の実験（二つ）**
        - **geo_state_by_genus_display（反証）:** 表示語を「上位の語のうち、〜」と組んでも、状態は上位概念にあまり沿いませんでした。
        - **geo_genus_last_token_by_suffix（反証）:** 語尾が同じ組を除いても、上位概念による分かれは残りました。字面だけでは説明しきれない部分がある、という結果です。

        **4. E10（opaque 条件）: 名前を無意味な記号にした式そのものを使った実験**
        - 名前を無意味な記号にした式を与えて、モデルが定義に従うかを見ました。
        - 衝突する設問では上がり、衝突しない設問では下がりました。
        - 見たのは答えの正しさで、隠れ状態の形は見ていません。

        ## #963 との関係
        - 名前を無意味にした式そのものをモデルに通し、その隠れ状態の区画を測るのは、#963 が初めてです。
        - ただ、事前登録の開示には、これらの系列（とくに E35 と表示語の書き替え）を書くべきでした。書いていなかったのは私の見落としです。
        - 二つの結果は、#963 にとって次の見込みになります。
          - E35 では、式を与えても状態は式に沿いませんでした。
          - 書き替えの実験では、区画は字面に強く引かれました。
          - どちらも、#963 が反証になる側の見込みです。
        - 実行はもう始まっているので、スクリプトは書き替えません。系列と見込みは、#963 の本文の開示に書き足します。
