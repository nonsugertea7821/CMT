        | Stale facts left in (c) | 0 |
        | Facts in (c) about names never declared | 0 (423 in #943) |

        So with new declared in the moves' before/after conditions, which names exist is decided by the moves alone, and the scheme follows the freeze.

        Two limits:
        - The definitions in the files are not changed yet. That goes in a separate adoption PR.
        - The checker that lists verbs using new without declaring it only reads what a move states afterward. So the 5 verbs fixed in their preconditions still show up in its list. The verdict doesn't use that list.

        Results and observations are pushed. Once CI passes I'll take #950 out of Draft, and you can review and merge it.
