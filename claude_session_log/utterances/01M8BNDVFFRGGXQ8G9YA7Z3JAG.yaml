        The experiment for #949 finished, and the hypothesis is supported (PR #950).

        **Correction:** earlier I said the third category was already non-zero in the first 10 walks. I misread which log column was which. The non-zero column was (ii), the moves that rely on stale facts. (iii) stayed at 0 for the whole run.

