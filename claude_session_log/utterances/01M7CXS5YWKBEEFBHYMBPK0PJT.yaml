      text: |
        そのとおりでした。形の一覧を思いつきで並べる前に、表から導くべきでした。作ります。

        ## 形を決めるマトリクス

        関係はノードで、始点への辺と終点への辺を持ちます。すると、1つの関係について指せる位置は3つ（関係そのもの、始点、終点）で、そこに来るものは持続体か生起体のどちらかです。形は、この組み合わせで決まります。

        | 位置 ＼ 見る形 | 持続体として | 生起体として |
        |---|---|---|
        | **関係そのもの** | -tion / -ence（delivery、dependence） | -ing（delivering、depending） |
        | **始点** | -er / -ent（deliverer、dependent） | 始点に来る生起体（trigger、cause） |
        | **終点** | -ee / -ed（deliveree） | 終点に来る生起体（result、effect） |

        形は 3×2 の 6つです。

        ## 表から分かったこと

        - **前回の4つには、2つ抜けがありました。** 始点や終点に生起体が来る場合です。「前に起こる」では両端とも生起体なので、-er と -ee（持続体の形）では書けません。抜けていた2マスがこれに当たります。
        - **「道具」と「場所」は、独立した形ではありません。** 1つの関係のノードには辺が2本しかないので、表に入る位置は3つだけです。道具は、その関係の第3の端ではなく、別の関係（使う）の終点として書くことになります。前回の私の見立て（修飾で書く）は結論としては合っていましたが、理由はこの表によるものでした。
        - **先に作った 2×2 の表とは、同じものの別の切り口です。** あちらは「始点の種類 × 終点の種類」で関係を4つのマスに分けたもの、こちらは「1つの関係のどこを、どちらの形で指すか」です。始点の列と終点の列を組み合わせると、2×2 の4マスが出てきます。

        ## 自信がない箇所

        「関係そのもの」を持続体として見る形（-tion / -ence）に、2種類が混ざっている可能性があります。

        - delivery：届けるという出来事を、1つの物として指す。
        - dependence：依存しているという状態を指す。

        これを1マスとして扱ってよいか、それとも表の行か列が1つ足りないのかは、判断がつきません。

        この表の形で合っていますか。
