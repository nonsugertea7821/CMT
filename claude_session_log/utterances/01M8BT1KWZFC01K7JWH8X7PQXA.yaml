      text: |
        半分は一発で片づきますが、残り半分は法則で禁じるべきではない、というのが見立てです。「名前を伏せる」の伏せ方が二通りあるからです。提案は仮説として #970 に登録しました（登録だけなので、CI が通れば自動マージに乗るはずです）。

        **一発で片づく方: 展開した形で比べる場合**
        - 型検査にはすでに「動詞の式が同じ」という検査があります。ただ、動詞しか見ず、名前のまま比べています。
        - これを名詞にも広げ、名前を伏せた形で比べる法則にすれば、#331 で残った 4 類 10 ノードは入れた時点で誤りになります。承認／支払いと、法則の文の「前提／導く／求める」、それぞれの動詞です。
        - 誤りになるので、種差を書かないと通らなくなります（#968 の作業を法則で強いる形です）。今後、同じ形の概念が増えることも防げます。

        **禁じるべきでない方: 一段だけ伏せた文の場合**
        - #963 で使ったのは、指している先の概念まで X01 のような記号にする伏せ方でした。
        - これだと 759 の概念が 511 通りの文にしかなりません。#963 の結果ファイルを見直すと、承認と支払いは、日（subj.day）とも同じ文で、モデルの中でも完全に一致していました。
        - 日と承認は、指している先が違うので、展開すれば分かれます。この伏せ方で一致を禁じると、正しい概念まで誤りになります。
        - ここで違いを運んでいるのは、指している先の名前（鍵）です。法則で消すものではなく、辞書の受け持ちだと読んでいます。

        **未定の点**
        「展開して同じ形」を、規則で書いた法則だけで表せるかは分かりません。書けなければ、検査器のコードが意味を与える法則（law_given）になります。それは「法則は cscl の中に書く」という決定に照らすと弱い形なので、判定は mixed（支持と反証の中間）にすると #970 の本文に書きました。
