      text: |
        どれも使えます。四つとも、「境界をどう定めるか」「小さな変化がいつ線形でなくなるか」「一貫性をどう測るか」に、はっきりした先行の形を持っています。先行研究は記憶から挙げているので、登録のときに出典を確かめます。

        **材料力学**
        | 領域 | 先行研究 | 体系へのつながり |
        |---|---|---|
        | 線形弾性・重ね合わせ | Hooke (1678) | 小さな変形の間だけ、足し算が効く。層ベクトルを足す方式が効く範囲（線形の範囲）を問う形になる |
        | 降伏条件 | Tresca (1864)、von Mises (1913)、Drucker (1951) の安定性公準 | 降伏曲面は応力空間の中の凸領域で、凸であることが安定性から導かれる。h_convex_prior_resists_redefinition に根拠を与える |
        | 弾性・塑性・破壊の段階 | 応力ひずみ曲線 | ある閾値を超えると、元に戻らなくなる。再定義への追従が、どこで不可逆になるか |
        | 履歴（ヒステリシス）と疲労 | Wöhler の S-N 曲線 | 繰り返しの負荷で閾値が下がり、経路にも依存する。教える順序の効果や、繰り返しの再定義で概念が崩れることにあたる |
        | 座屈 | Euler (1744) | 荷重が臨界を超えると、形が分岐する。上位が兄弟に分かれる点 |
        | 破壊力学 | Griffith (1921) | 小さな欠陥が広がる条件をエネルギーで決める。一つの誤りが概念全体に広がる条件 |
        | サン・ブナンの原理 | Saint-Venant | 局所の乱れは、遠くでは消える。知識の編集が近い概念にしか効かないこと（局所性）の先行の形 |

        **量子力学**
        | 領域 | 先行研究 | 体系へのつながり |
        |---|---|---|
        | 縮退の分裂 | ゼーマン効果、摂動論 | 縮退した準位が外場で分かれる。上位概念＝縮退した準位、限定（mod）＝外場、兄弟＝分かれた準位、と読める。往復の仮説に一番近い |
        | 準位の反発（避けられた交差） | von Neumann & Wigner (1929) | 近い二つの状態は、交差せずに反発する。兄弟の弁別を、反発の大きさとして測る |
        | 量子論理・部分空間 | Birkhoff & von Neumann (1936)、Widdows (2003) の直交否定 | 概念を部分空間として、否定を直交補空間として見る。体系の neg の幾何的な読みになる |
        | 文脈依存性 | Kochen & Specker (1967)、Bell | 値が文脈なしには決まらない概念 |
        | 演算子の非可換と順序効果 | Wang & Busemeyer (2013) | 問う順で答えが変わる。往復の順序（抽象→具体と具体→抽象）が等しくない理由の候補 |
        | もつれ | 合成系の非分離 | 合成した概念が、部分の組に分けられないこと |

        **加工工学**
        | 領域 | 先行研究 | 体系へのつながり |
        |---|---|---|
        | 公差とはめあい | ISO 286 | 概念の境界を、許される幅（公差域）として書く |
        | 幾何公差とデータム | ASME Y14.5 | 形体を、基準（データム）からの相対で定める。概念を上位からの相対で定める形そのもの |
        | 粗加工から仕上げへ | 工程設計 | 粗く取ってから精度を出す。粗加工なしに仕上げはできない。境界づけ (A) の工学の側の根拠になる |
        | 部品の分類コード | Opitz (1970) のグループテクノロジー | 形・寸法などのファセットで部品をコード化する |
        | 統計的工程管理 | Shewhart (1931) の管理図、工程能力 Cp・Cpk | ずれ（ドリフト）を検出する。一貫性を見張る運用の形 |
        | 測定システム解析 | ゲージ R&R | ばらつきを、繰り返し性（同じ条件）と再現性（条件を変えたとき）に分ける。d_metric の雛形になる |

        **電子工学**
        | 領域 | 先行研究 | 体系へのつながり |
        |---|---|---|
        | 標本化定理 | Nyquist、Shannon (1949) | 何点あれば元に戻せるか。概念を決めるのに要る事例の数を問う形 |
        | 時間と周波数の不確定性 | Gabor (1946) | 細かい区別ほど、広い材料が要る。兄弟の弁別の分解能 |
        | ノイズマージンとヒステリシス | シュミットトリガ | 境界の近くでも判定がばたつかないよう、閾値に幅を持たせる。一貫した判定の回路の形 |
        | 負帰還 | Black (1927)、Bode | 帰還で利得が部品のばらつきに強くなり、ループの利得が過ぎると発振する。往復をループとして見ると、ずれを抑えるか増やすかの条件になる |
        | 誤り訂正符号 | Hamming (1950) | 符号語の最小距離が、見分けられる数を決める。兄弟の間の距離と、表示語の衝突 |
        | 等価回路 | Thevenin、Norton | 中身を、端子での振る舞いが同じ等価物に置き換える。抽象を「外から見た振る舞いの同値類」として定める形 |
        | キルヒホッフの法則 | Kirchhoff (1845) | 保存則を制約として書く。体系の法則（law）と同じ置き方 |
        | 半導体のドーピング | バンド理論 | わずかな不純物で性質が変わる。小さな限定が分類を変えること |

        **特に効きそうなもの**
        - 量子のゼーマン効果と、加工の「粗加工から仕上げへ」は、往復の対の仮説（境界づけ・形づくり）に、物理と工学の両側から根拠を与えます。
        - 材料の重ね合わせの範囲と降伏の凸性は、ベクトルを足す方式がどこまで効くか、という問いを測れる形にします。d_consolidation_in_vector と d_road_region に結びます。
        - ゲージ R&R とシュミットトリガは、「一貫した認識」を測る量（d_metric）の雛形になります。
        - 等価回路は、表示を式から導く核（d_cscl_display_derived）にもつながります。抽象を名前ではなく振る舞いで定めるからです。

        この四分野も、前の一覧に足します。体系へは前と同じ形で入れます。
        - 分野ごとに先行研究を pw_、主張を pwc_ として入れます。出典を確かめてから、こちらの言葉の要旨と式だけを入れます。
        - 「先行研究の領域で材料の量が足りる」の仮説と同じ PR で登録します。

        本線 a 識別子化、d_road_region・d_consolidation_in_vector・d_metric の下（先行研究の領域の一覧に、四分野を足した）
