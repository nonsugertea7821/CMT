      text: |
        直観を式に寄せて読んでみます。合うところ、先行研究とぶつかるところ、確認したいところに分けます。

        ## 前半「refer で広げた次元全体が領域で、それは凸」
        数学とはそのまま合います。
        - refer が新しい referent を述べるたびに、座標が一つ足される。そう読むと、refer で述べられる領域は、広げた次元全体が張る空間です。
        - 空間全体や、その中の平らな部分空間（アフィン部分空間）は、どれも凸です。ですから「高次元から見た領域は凸」は、前提を置けば必ず成り立ちます。
        - 以前の「refer で修飾の次元は増えそう」という話とも、一続きになっています。

        ## 後半「限定すると凸でなくなる」
        ここは Gärdenfors とぶつかります。
        - Gärdenfors では、限定は凸の集合どうしの交わりです。凸どうしの交わりは必ず凸なので、限定しても凸のままです。性質（赤など）は凸だ、というのが彼の基準でした。
        - あなたの直観どおりなら、凸が崩れるのは、限定に使う条件の側が凸でないときだけです。体系の限定を見ると、そうなる候補がいくつかあります。
          1. **量の限定（count、quant）**: 「2 つより多い」は、個数という離散の値の条件です。整数の集合は、連続の空間では凸ではありません。また「成員が 2 つ以上ある」は、個々の点の条件ではなく、点の集まりについての条件です。
          2. **特定の referent を指す質の限定（mod の with: X）**: 「X に関わるもの」の X が個別のノードなら、範囲は有限個の点か、その周りの寄せ集めになります。2 点以上の有限集合は凸ではありません。
          3. **否定（neg）**: 補集合になるので、凸ではなくなります。
          4. **次元のあいだの相関**: Bechberger らが凸を星形に緩めた理由がこれでした。
        - 1 と 2 が当たっているなら、凸を崩すのは「限定」一般ではありません。数えることと、個別のものを指すことです。
        - そうだとすると、像はこうなります。凸なのは refer の述べる領域のほうで、限定で作った概念は、その中の凸でない部分（離散の点や寄せ集め）になる。Gärdenfors の「概念＝凸な範囲」とは、凸を置く場所が一段ずれています。

        ## 確認したいこと
        「量的・質的な限定」は、体系の語でいうと次のどちらに近いですか。
        - 量的 ＝ count・quant、質的 ＝ with・neg
        - それとも、もっと広く、「上位から下位へ狭めること」全般

        前者なら、上の候補 1・2・3 がそのまま当てはまります。後者なら、ふつうの区間による限定でも凸が崩れることになります。そこは Gärdenfors と正面から食い違うので、確かめる価値が大きいと思います。

        ## 測れるかどうか
        モデルの表現空間で、凸かどうかを近似的に確かめる方法があります。ある範囲に属する 2 つの例の中間点も、同じ範囲に属すると判定されるかを調べるものです。
        - refer の領域全体の例どうし
        - 量で限定した概念の例どうし
        - 質で限定した概念の例どうし

        この三つで、中間点が属する率を比べれば、直観を直接に測れます。Qwen の既存の道具で組めそうです。お答えを聞いて形を決め、仮説として登録してから進めます。
