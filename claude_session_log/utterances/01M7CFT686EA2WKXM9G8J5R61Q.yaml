      text: |
        E7 の続きが終わりました。再定義が無視される原因は、文脈の深さではなく、同じ形式の定義が前に並ぶことでした。

        ## 結果（Qwen3-4B、再定義で衝突する設問 24問、正答率）

        | 関係する定義の前にあるもの | 正答率 |
        |---|---|
        | なし | 0.67〜0.71 |
        | 無関係な文章 約500トークン | 0.67 |
        | 無関係な文章 約2000トークン | 0.67 |
        | 14定義 | 0.62 |
        | 27定義 | 0.54 |
        | 41定義 | 0.50 |
        | 54定義 | 0.54 |
        | 一般の意味どおりの定義だけ19個 | 0.54 |
        | 他の再定義だけ23個 | 0.58 |

        ## 読み取れること

        - **文脈の深さは原因ではありません。** 無関係な文章を2000トークン前に置いても落ちません。
        - **前に並ぶ定義が増えるほど下がり、20〜30個で底に着きます。** 0個で 0.71、14個で 0.62、27個以上で 0.50〜0.54 です。定義なしのときは 0.38 でした。
        - **前に並ぶ定義の種類は問いません。** 一般の意味どおりの定義だけでも、他の再定義だけでも、同じ程度に落ちます。

        ## 解釈（未検証）

        同じ形式の項目が並ぶと、関係する定義を引き当てる処理が弱まり、モデルは語が元から持つ意味に戻る、と考えています。新しい語には戻る先がないので、影響を受けません。

        あなたの含意に引きつけて言い直すと、こうなります。落ちるのは文脈が広がるからではなく、**似た形式の情報が積み重なるから**です。実際の長い作業では、定義・仕様・規約といった似た形式の記述が文脈に溜まっていくので、同じ現象が起きると予想されます。ただしこれは今回の範囲（最大約1500トークンの用語集）からの推測で、数万トークンの規模では測っていません。

        ## 設計への反映

        用語サーバーの渡し方を、次のように改めました。

        - 問い合わせごとに関係する概念だけを選び、少数を渡す。
        - 再定義は先頭に置く。

        ## 進行状況

        層を変えた学習が自動で始まっています（第14層、第4層、第20層の順、各2時間あまり）。定義と適用の両方を教えたときに、定義の言い換えまで揃って変わる層があるかを探します。全層の結果が出るのは6〜7時間後の見込みです。

        結果は `experiments/README.md` と `docs/design.md` に記録し、プッシュ済みです。
