        残っています。会話の記録と、いまのコードを見直しました。

        **層の話で止まっているところ**
        1. **層の並びが、検査器に名前で直接書かれている。** `type_checker.py:168` の `LAYERS = ("axiom", "ontology", "syntax", "runtime", "std")` がそれで、今もこのままです。
        2. **下の層が、自分を書くのに上の層の語を借りている。**
           - axiom.yaml と ontology.yaml は、syntax の `domain` と `v_use` で自分を領域として宣言しています。
           - 層を検査する法則 `layered` と `visible_*` も、syntax の語（`v_use`、`r_visible`、`domain`）で書かれています。
           - これが「自己記述していない」という指摘の中身でした。
        3. **「シグネチャから論理演算的に定められる分類」を探す話が、途中で止まっている。**
           - 前回の測定では、今の層の境界は基礎の関係の組では切れませんでした。
           - 「refer を含むか」と「pre/post（変化）を含むか」で分けると、3つに分かれました。述べない・変わらない、述べる・変わらない、変わる、です。これは ontology → syntax → runtime と大筋で重なりました。
           - ずれもありました。ontology の中に「述べる」で定義された語が14個あり、v_design だけが ontology の中で変化を持っていました。
           - 否定をどう数えるかで分類が大きく変わったので、「この体系での否定とは何か」に話が移り、そこで止まりました。

        **その後に決まったことで、前提が変わった点**
        - **否定の意味が決まった。** neg は「述べられていない」と読み、偽は `val: {truth: false}` で別に書きます。前回の表はこの区別がない頃のものなので、そのままでは使えません。
        - **定義の循環には、否定の限定を通るものがない。** 7件の循環をすべて調べた観察と、法則 definition_stratified で確かめています。分類を、定義の辺をたどって決めても循環で壊れない、という土台になります。
        - **限定の文法は4つの象限に分かれる。** 関係・真偽・量・質です。限定できないもの（シグネチャ側）と、限定で作るもの（概念側）の区別も、話の中で出ています。

        **次の手（提案）**
        前回の分類の測定を、今の体系と否定の3つの読み方でやり直します。新しい実験 `sys_layers` として、基準を先に登録してから走らせます。
        - 各ノードについて、定義の辺（上位・限定・with・動詞の holds/pre/post）をたどって行き着く基礎の関係の集まりを求めます。
        - 「述べられていない」としての否定は、語彙として依存に数えます。
        - 「シグネチャの論理式で定まる分類」と、今の層の置き場所との一致と、ずれを数えます。

        層の並びを決めたり、`LAYERS` を外したり、`layered` を書き直したりするのは、この観察を見てから導きます。この順でよければ始めます。
