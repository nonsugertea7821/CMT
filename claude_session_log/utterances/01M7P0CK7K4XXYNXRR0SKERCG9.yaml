      text: |
        手順 2 は some の 3 か所までを書き直しました（ea46d91、push 済み）。all の 4 か所はまだです。手順 1（not と neg を一つにまとめる）は、調べると前提が成り立たなかったので、何も変えていません。

        **手順 1：not と neg は、式の上では同じものではなかった**
        - 文法の語どうしで、自分で足した限定が同じ組を数えました。not と neg はたしかに同じ限定（事実について述べる）を持っていました。
        - ただし、world も同じ限定を持っています。上位がそれぞれ違い、not は文、neg は書き方の部品、world は定義です。
        - ほかにも、限定が同じで上位が違う組が 7 組ありました。たとえば holds と base、facts と binding です。どれも「印と、その印で作られるもの」のような、区別されてよい組でした。
        - つまり not と neg は、「否定の文」と「否定の印」の関係です。同じものに二つの名前がある重複だ、という私の前回の説明は言い過ぎでした。
        - 実際に問題なのは別の点です。文法の logic の節は not を論理の語として挙げていますが、否定はすべて neg で書かれていて、not という語を否定の役で書く文はありません。どう直すかは判断が要るので、まだ手を付けていません。
          - not を「neg を部分に持つ文」と定義し直して、二つを結ぶ。
          - not を logic の節から外す。

        **手順 2：some を個数で書く（済み）**
        - quant: some の 3 か所を `at: {count: {ge: 1}}` に書き直しました。汎用依存持続体と、subj の 2 か所です。
        - 汎用依存持続体は「個数 1 以上に依存する」になりました。特定依存持続体の「個数 1」と対になります。
        - 書き直す前後で、規則から導かれる文を比べました。違ったのは書き直した限定の見出し（限定を指す文字列）だけで、ほかは同じでした。CI は GitHub 側に任せています。
        - 一つ気になる点があります。subj の weekday_base（日曜でない日）は、否定と some が両方付いた限定です。some がもともと意味を持っていなかったように見えますが、書き直しは字面どおりにしました。

        **残っていること：all の 4 か所**
        - exp の all の 4 か所（shared_inference など）は、個数だけでは書けません。「すべて」は、関係しないものの個数が 0 である、という否定と個数の組み合わせが要ります。
        - ところが、否定の付いた限定に個数を付けたときの意味が、今の文法では決まっていません。コードは評価せず、文法にも説明がありません。
        - この意味を先に決める必要があります。決めるまでは、all は quant のまま残しています。

        **このあと決めることは二つです**
        1. not：neg を部分に持つ文として結ぶか、logic の節から外すか。
        2. all：否定の付いた限定に個数を付けたとき、何を数えるとみなすか（「示されていないものの個数」とするか）。
