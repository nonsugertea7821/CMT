        先ほどの問いの詳しいところです。

        **いま分かっていること（測った・読んだ事実）**
        - 概念を定義の中身で分けると、795 個が 793 のまとまりになります（表示語と注は除いて分けています）。
        - ぶつかるのは、subj（売買の例を書いた小さな領域）の二組だけです。
          - 「承認」と「入金」：どちらも「過程」の一種です。「承認」は「承認する」の行き先、「入金」は「入金する」の行き先として定義されています。
          - 「承認する」と「入金する」：どちらも「行う」の一種で、始まりは同じ「行為者」です。行き先が、それぞれ「承認」と「入金」です。
          - つまり二組は互いを指し合っているだけで、ほかに違いがありません。名前を伏せると、定義からは区別できない形です。
        - 以前の「中身の全部」の案（h_identifier_by_bisimulation）は、ぶつかる組を 4 つと予測し、実際には別の組（「前提に置く」まわり）も加わったので反証になりました。その組は、いまの体系ではもうぶつかりません。
        - #954 の「類と種差だけ」の案では、区別できない組が 775 組まで増えます。役割の指し方（form）、動きの前後（pre・post）、否定（neg）なども区別に効いているためです。

        **三つの選択肢の中身**
        1. **ぶつかりを定義の不足と読む**
           - 中身の全部による分け方をそのまま識別子にします。名前の違う二つが同じまとまりに入ったら、定義に区別が足りないとして、検査で拒みます。
           - 体系には「名前の違う個体は同じでない」（runtime の unique_names）という掟がすでにあります。それを定義どうしにも当てはめる形です。
           - そのうえで subj の二組には、違いを式で足します（例：何が承認され、何が支払われるか）。
           - ただし「ぶつかるのは subj だけ」は、もう見てしまった結果です。なので予測の当たり外れは試せません。試せるのは「検査を入れても、ほかの定義は壊れないか」「足した違いで二組が分かれるか」です。
        2. **足りる鍵の組を探す**
           - 類と種差の鍵に、どの鍵を足せば全部の鍵と同じ分け方になるかを確かめます。
           - 識別子を短く読みやすくできる見込みがあります。ただし、#954 で form・pre・post・new_kind・neg・cmp・axis などがみな効いていたので、ほぼ全部の鍵が残る可能性もあります。
        3. **#945 へ進む**
           - 識別子の作り方は決めないまま、表示語と読み（韻律）を添えて、モデル（Qwen）が別の使い方でもそろって答えるかを測る実験の設計に入ります。
           - 識別子が決まっていないので、何を添える対象にするかが、仮置きになります。

        どれにするかは、まだ決めていません。1 か 2 を進める場合は、先に仮説として体系に登録してから確かめます。
