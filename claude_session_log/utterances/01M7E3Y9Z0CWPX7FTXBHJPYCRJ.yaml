      text: |
        3つの直観は、どれも条件つきで成り立つと論証できました。順に示します。`extends` への改名は実施済みで、検査を通してプッシュしました。

        ## 1. `is` ではなく `extends`

        成り立ちます。根拠は3つです。

        - **`is` は2つの関係を兼ねていた**：「注文は文書である」（種類と種類）と「この注文は注文である」（個体と種類）は別の関係です。実際に体系の中で混ざっていました。ノードの `is` は前者、`records` の `is: observation` は後者（個々の記録が観察の個体である）でした。
        - **ノードの `is` の働きは継承そのもの**：下位は上位の端・位置・修飾をすべて引き継ぎ、修飾を足すか端を狭めることしかできません。検査もそう実装しています。
        - **「属性が増える」と「当てはまるものが減る」は同じこと**：オブジェクト指向は属性を足すと言い、こちらは限定を足すと言いますが、同じ操作を内側と外側から見ているだけです。

        「ほぼ」の差は1点です。オブジェクト指向は上書き（上位の振る舞いを別のものに差し替える）を許しますが、こちらは狭めることしか許しません。つまり「上書きのない継承」とイコールです。

        そこでノードの側だけ `extends` に改名し、`records` の `is` は個体の関係として残しました。チューリング完全性で欠けていた「個体の層」を足すとき、この `is` がそのまま使えます。

        ## 2. 述語論理の語は「について述べる」の修飾で書けるか

        6語のうち5語は書けます。残るのは1つの公理です。

        | 語 | 還元先 |
        |---|---|
        | `true`、`false` | すでに真偽の軸の値。軸は「について述べる」から作られている。論理の語の一覧から外しました |
        | `between` | 「以上」かつ「以下」。`mod` の並びは AND なので、既存の比較の動詞2つで書ける |
        | `any` | 「成り立つものの個数が1以上」。個数の軸で書ける |
        | `all` | 「成り立たないものの個数が0」。個数の軸と `not` で書ける |
        | `not` | 「ある文について述べる文で、真偽の値が相手と違うもの」 |

        `not` の定義に「違う」が出てきます。「違う」は「同じでない」なので、ここで循環します。止めるには「真偽の軸の値は2つで、互いに違う」と1つ置くしかありません。これが公理です。同一性のほうは「正準形が同じなら同じ」という体系の前提がすでに与えています。

        つまり述語論理は「について述べる」＋個数の軸＋区別の公理1つに還元できます。

        ## 3. メタ層はすべて「について述べる」の精緻化で解けるか

        「記述する」ことについては解けます。ただし、原理的に残るものが1つ、守るべき条件が1つあります。

        - **解けるもの**：入れ物の構造は、並び＝部分＋前後、対応表＝「関係づける」の文の集まり、と書けます。語の働き（`extends` で性質が引き継がれる）は、「文についての文」として法則に書けます。`base` にはすでに `laws` の置き場があります。
        - **残るもの＝規則を当てはめる行為**：法則を書いても、法則は自分で自分を適用しません。「この法則を適用せよ」という法則を足しても、それを適用するものがまた要ります（ルイス・キャロルの亀の議論）。これは「について述べる」が体系自身の行為で解けない、というご指摘と同じ場所です。
        - **守るべき条件＝階層**：文が自分自身の真偽について述べられると、「この文は偽である」が書けて矛盾します（タルスキの定理）。いまは定義の参照が循環を禁じているので安全です。この禁止は外せません。

        結論として、公理で解決するという直観は正しく、最後に残るのは「区別」と「適用」の2つだけです。前者は公理として書け、後者は書けません。

        これはチューリング完全性の議論とも揃います。「適用」が体系の外に残るので、LLM か検査プログラムが実行役を担うことになります。

        ## 次にやること

        2と3は論証だけで、体系にはまだ書いていません。次の順で入れます。

        1. 区別の公理を `base` の法則に足す。
        2. `not`、`all`、`any`、`between` をノードとして定義し、`logic` の一覧を空にする。
        3. 継承の規則を法則として書き、検査がそれを読む形にできるか試す。
