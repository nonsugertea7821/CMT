      text: |
        今の法則では見つけられません。調べると、`any` は法則の検査より手前で、型検査のコードが特別扱いしていました。法則は書き方を事実に直したものの上で働くので、事実になる前に扱いが分かれていると、法則からは見えません。

        ## 今どうなっているか

        | 場所 | 書いた `any` の解決先 | コードの説明 |
        |---|---|---|
        | 限定の `with`（type_checker.py:101, 108） | `syntax.any` | 「存在の数量化（構文の語）」 |
        | 動詞の端（type_checker.py:86 の `qn`） | どのノードでもない `any` という語のまま | — |
        | 事実を作る所（type_checker.py:812） | 端の `any` を `syntax.any` だとして `exists any` を手で足す | — |

        - 同じ綴りが、置かれた位置によって別のものに解決されています。しかも説明では「同じもの」とされています。
        - その上で `is_a` は、`any` に対して常に真を返します（type_checker.py:928）。
        - 端と `with` にある、宣言のない語も数えました。個体を除くと、端の `any` だけでした。

        ## 見つけられる法則の候補

        **1. 同じ綴りは同じものを指す（綴りの一意）**
        - 1つの領域のファイルの中で、同じ語が書かれた所はどれも同じノードか個体に解決される、という法則です。
        - 書き方の事実として、語が出てきた所ごとに「綴り」と「解決先」を置けば、規則で書けます。
          - 綴り(o1, w) ∧ 綴り(o2, w) ∧ 領域が同じ → same(解決先(o1), 解決先(o2))
        - `any` はここで引っかかります（`with` では syntax.any、端では宣言のない語）。
        - これは前に入れた no_confusion と同じく、ライプニッツの法則の「同じなら区別できない」向きです。no_confusion は個体の水準でしたが、こちらは語の水準です。

        **2. 持続体と生起体は重ならない**
        - もし端の `any` も `syntax.any` に揃えると、法則 below_any（すべては any の下）によって、生起体まで「文」の下、つまり持続体の下に入ります。
        - 最上位どうしが重ならないという法則があれば、ここで矛盾として出ます。
        - 今の体系にはこの法則がありません。表示語を検索しても見つかりませんでした。保留中の top_placement（T1〜T3）とも関わります。

        ## もう1つ見えたこと
        法則で検出できるのは、事実にしたものだけです。だから型検査のコードの中にある語の特別扱いは、混同が隠れる場所になります。`== "any"` のような特別扱いは、型検査のコードに10か所ほどあります。

        **次の一手の案**
        1. 語が出てきた所と解決先を書き方の事実にし、法則 1 を入れる。
        2. `any` の特別扱いを外す。
        3. 法則 1 が `any` 以外に何を見つけるかを観察する。前と同じく、見込みを先にコミットしてから当てます。

        この順で進めてよいですか。`any` をシグネチャに置く件は、法則 1 が実際に `any` を検出したのを見てから直すのが、観察から導く順番だと考えます。
