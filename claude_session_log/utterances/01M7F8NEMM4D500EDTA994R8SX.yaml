      text: |
        定期確認で見ると L4 の計算が止まっていたので（コンテナの再起動によるものと見られます）、再開しました。あわせて E11 の準備ができました（df8d80b、push 済み）。E10 も E11 もまだ一度も走らせていないので、結果はありません。

        **E11 の手順**
        1. 語の概念式を、`subj.yaml` に書いたまま設問の前に置きます。
        2. 事例を、概念式と同じ書き方で 1 行ずつ書かせます。行の形は次の 3 つです。
           - 個体: `名前: {is: 種類}`
           - 事実: `{is: 動詞, from: 名前, to: 名前}`
           - 帰属: `{is: is, from: 名前, to: 種類}`（属さないときは `neg: true` を付ける）
        3. 書かれた行を `tools/check_line.py` で 1 行ずつ検査します。動詞や種類が体系に実在するか、宣言した個体の種類がその位置に来られるか、を確かめます。
        4. そのあとで番号を答えさせます。番号だけを即答させる場合（E10 の条件と同じ）とも比べます。

        検査器の働きは、手で書いた例で確かめました。たとえば `{is: v_store, from: 倉庫, to: 商品}` は、始点と終点が逆なので不合格になります。存在しない動詞も不合格になります。名前 `o` は体系の識別子と重なるので弾かれました。

        **実行の順番**
        `after_layers.sh` を待機させてあります。L4 が終わると、E10、E11 の順に自動で走ります。E11 は生成を伴うので、CPU では数時間かかる見込みです。

        **気になっている点**
        `subj.yaml` の表示名には、「直近一年間に取引がない相手」のように中間ノードの意味をそのまま言い表したものがあります。式を渡すと、この表示名から日本語の手がかりも一緒に伝わります。正答が式の構造によるのか表示名によるのか、この実験だけでは切り分けられません。

        結果が出たら `spec/exp.yaml` に測定値と観察として記録します。
