      text: |
        おそらく、その研究は Bortfeld らの 2005 年の論文です（"Mommy and me: Familiar names help launch babies into speech-stream segmentation", Psychological Science）。出典は記憶から挙げていて、このセッションでは原文を確かめていません。

        - **研究の中身**: 生後 6 か月の乳児は、自分の名前や「ママ」のような慣れた語のすぐ後ろに来た語を、ほかの位置の語より聞き分けられたという報告です。題名の "launch" の通り、慣れた語が切り出しの起点になる、という主張です。それより前から、音のつながりの起こりやすさで切れ目を見つける学習（Saffran ら 1996）があることも知られています。
        - **いまの LLM との違い**: 語の切れ目を決める部分（トークナイザー）は、モデルを学習させる前に、文字の組がどれだけよく出てくるかだけで作って固定します。学習の途中で、知っている語を足場にして切れ目を作り直す仕組みはありません。仕組みとしては同じではありません。
        - **この研究との関係**: 子供の「知っている語を足場に、周りを切り出す」段が LLM にあるとすれば、切れ目の段ではなく、学習の中の表現の側だろうと見ています。これはまだ確かめていない見立てです。
          - このリポジトリで言うと、識別子（辞書の鍵）を足場にして、周りの式が示す区画（モデルの中の位置）を切り出せるか、という問いになります。
          - そこで「概念に専用の固定したトークンを与えると、それが足場になり、周りの式の区画への落ち方が上がる」という仮説を登録しました（h_dedicated_token_anchors_region、#982、領域の道に結んだもの）。

        この登録は、概念を足さない登録だけの PR なので、CI が通れば自動でマージされる見込みです。#981 はマージの判定を待っています。
