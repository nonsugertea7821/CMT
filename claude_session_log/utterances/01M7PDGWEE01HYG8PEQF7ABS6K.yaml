        (a) で測り直した after2 は、登録した判定をすべて満たしました。浅さを法則として書けるようになり、claude/cross に push してあります（b2faef9）。

        | 項目 | after2 |
        |---|---|
        | 型検査の誤り（tc / ec） | 0 / 0 |
        | 浅い概念（法則が導いた数 / スクリプトが数えた数） | 86 / 86 |
        | 法則とスクリプトの不一致 | 0 |
        | ほかの規則の結果の変化（changed / extra） | 0 / 0 |

        **入れた変更**
        - **評価器:** 規則の前提に `at: {count: ...}` が付いた原子があれば、「満たす組の数がその範囲に入る」と読みます。
        - **法則の形の検査:** 前提の原子に限って `at: {count}` を受け付けます。
        - **syntax:** 法則 `deep_end` と `shallow_ends` を足しました。閾値は count の値 `{gt: 2}` で、端はノードだけを数えます。
        - **記録:** sys_draw_on と sys_count_atom の測定の族と観察 8 つを、体系に足しました。

        **解釈**
        - 型階層の深さが書けなかった2つの欠けのうち、欠け2（統語は数えると約束しているのに、翻訳が数えていなかった）は、コードの翻訳を直すだけで埋まりました。定義の語は1つも増えていません。前に組み立てた「直すべきは定義ではなく翻訳」という筋のとおりです。
        - 一階の言語では鎖の長さを一様に書けません。そのため以前は、閾値が式の形（変数の数）に埋め込まれていました。今は閾値が count の値 `{gt: 2}` になっています。
        - 浅さは、display とスクリプトに借りていた意味から、法則が導く関係 `r_shallow` になりました。sys_draw_on で「役割」と区別できなかった「浅い端だけの定義」も、今は式で区別できます。

        **途中の失敗**
        確かめのつもりで after2 をもう一度走らせ、結果ファイルを上書きしてしまいました。走らせたのは、記録用の族を足した後の状態でした。測った時点の状態に戻して作り直し、同じ結果を得たものを記録しました。経緯は commit メッセージに残しています。

        **残り**
        - **欠け1（階層を動詞にする）:** ノードの限定 `mod` で浅さを書くときに要ります。法則は導いた関係を直接数えられるので、今回は要りませんでした。
        - **個体の深さ（b）:** 個体の上位を法則で導く案です。`r_ancestor` が広く変わるので、別の実験にします。
        - **sys_draw_on のやり直し:** 「浅い端だけの定義」を `r_shallow` を使って書き直せば、named_mod の誤りなしに読みを式で書けるか、試せます。

        どれから進めますか？
