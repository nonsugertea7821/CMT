          - Facts go before `  - {is: v_file_of, from: ops_sync_duration.json, to: ops_sync_duration}`:
            - v_file_of, v_axis_of, then v_value_of and v_spell per key, v_entry_of '{cond}', v_metric_of mean_value.
            - Then `v_refer(o, v_level(F.key.mean_value, val))` and v_support or v_contradict.
          - Mixed is recorded as one v_support and one v_contradict observation, with status hyp_mixed.
