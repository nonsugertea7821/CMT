        2. Key Technical Concepts

        - Claim items
          - Items (nodes, individuals, axes values, facts per domain file) that contain an individual whose `is` resolves, via T.is_a, to std.hypothesis, exp.observation or exp.backlog_item.
        - J(v)
          - The mean pairwise Jaccard, across domains, of the ontology anchors of words co-occurring with verb v. J ≥ 0.5 counts as formal, < 0.5 as real.
        - Exp recording pattern (exp.yaml)
          - Nodes: the measurement_family, `_cond` family_axis and `_cond_<k>` axis_value nodes are inserted before `  ops_sync_duration: {is: measurement_family}`.
