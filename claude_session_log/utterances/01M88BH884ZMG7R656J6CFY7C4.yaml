          - tpc = tokens per character of the swapped form.
          - Corrected split: hi = tpc < max (18 words), lo = tpc == max (22 words).
          - d_B = (acc_swap_hi − acc_swap_lo) − (acc_orig_hi − acc_orig_lo); p_B from 2000 random splits.
