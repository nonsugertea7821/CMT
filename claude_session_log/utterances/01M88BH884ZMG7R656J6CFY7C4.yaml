          - keep = (G_swap − R_swap) / (G_orig − R_orig).
        - **Genus separation G (#771/#792)**
          - G = mean cosine of same-parent pairs − mean cosine of different-parent pairs.
          - Vectors are centered and normalized; verbs come from collect() of v_ verbs with display and extends.
