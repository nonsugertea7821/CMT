        2. Key Technical Concepts:
        - **Static system reading** (from sys_domain_in_formula, reused via `sys_domain_sep_by_extends.reader()`)
          - shape = holds/pre/post atoms.
          - Ends from/to and new_kind compared by inclusion (`sub`).
          - Genus = W.extends. dom from tc.LOCALS. reach via tc.USES.
          - Reading A: no domain condition. Reading B: reach(dom(x), dom(W)).
          - sep = cross_A − cross_B.
          - The new reader excludes W's ancestors from extra.
        - **Checker laws**
          - narrow_from / narrow_to: a subordinate's ends must narrow the parent's ends.
          - layered: a domain may refer only to itself and the domains it uses.
          - Law names (e.g. syntax.layered) are not referenceable nodes.
          - Verbs (syntax.v_use) cannot sit at v_depend's to-end (continuant).
          - syntax.use_word = the word that composes a domain declaration.
        - **How tc identifies v_depend** (type_checker.py ~line 731):
          ```
          self.v_depend = one("依存する", [x for x in under_o if atoms(x) == [("depend", "from", "to", False)] and N[x].get("from") == self.top_c and N[x].get("to") == self.top_c])
          ```
          - `under_o` = nodes whose extends == top_o (directly under occurrent).
          - Role grounding (`grounding()`, ~line 1190) looks for mods `of: [self.v_depend, from]`.
          - So moving v_depend under another verb breaks role grounding ("役割だが、根拠となる定義（依存する定義）がない").
        - **Domain uses** (tc.USES)
