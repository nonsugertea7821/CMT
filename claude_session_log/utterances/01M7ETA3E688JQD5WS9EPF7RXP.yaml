             - Statuses are subkinds (`is: hyp_supported`, `design_dec_adopted`, `item_queued`).
             - An individual acts as a kind with exactly one member: it may appear in `with`, and `is_a` follows its kind.
           - Facts are individuals of verbs with named positions:
             - Form: `{is: verb, from, to, new?, at?, neg?}`.
             - A sentence's content is the end of `v_refer` (`to: {is: v_lower, from: X, to: Y, new?: tolerance}`). It is not asserted. `is: extends` maps to p `is_a`.
