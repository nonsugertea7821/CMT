           - Ontology notation:
             - `extends` takes a single parent. Lists are forbidden.
             - AND is written as `{extends: A, mod: {of: [is, from], with: B}}` ("A のうち B に属するもの").
             - `mod` is single (law `single`). Monotone/specific laws apply.
             - Verbs carry from/to plus holds or pre/post. Forms are `form: [verb, pos]`.
