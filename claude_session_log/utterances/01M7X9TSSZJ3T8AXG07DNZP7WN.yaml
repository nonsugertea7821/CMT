        #549 の結果は反証でした。記録を済ませ、Draft を外しています。

        - **結果**: 式から導いた親（extends）が書かれた親と一致したのは、下位の動詞 70 のうち 60 でした。最上位の 49 は、導出でもすべて親なしになりました。
        - **外れた 10 の中身**: どれも、別の親を選んだのではなく、親を一つに決められなかったものです。
          - channel 系の 9 動詞（renaming、text_injection など）: 形も端も同じで、互いに包摂し合うため、一つに絞れません。
          - teacher_both: 候補は 4 つありましたが、その中に一番下が一つもありませんでした。理由はまだ確かめていません。
        - **見落としていた点**: 記録のあとで定義を見直すと、channel 系の動詞は `mod`（修飾の指定）で違いが書かれていました。導出のほうは、形・端・new_kind だけを比べて `mod` を見ていませんでした。

        この含意を、二つの仮説として登録だけの PR #550 に出しました。条件を満たせば自動でマージされます。
        - **h_extends_derived_with_mod**: 比べる中身に `mod` を足せば、外れた 10 も親が一つに決まり、書かれた親と揃う。
        - **h_undecided_from_indistinct**: 親が決まらないのは、端と `mod` まで含めても区別のつかない動詞の群があるところに限る。

        #549 と #550 は、マージを待っています。

