        - `docs/design.md` などの凍結した文書と、`spec/trial/` 関係のスクリプトには手を付けていません。

        改名のあと、わざと違反を入れて検査器にかけてみました。表示名の重複は `unique_in_domain` が、表示名以外の項目に書いた日本語は「自然言語は display にだけ書く」という検査が、それぞれ検出しました。

        **マスクの扱い**
        日本語は表示名にだけ置く、という当初の方針に合わせて、表示名を外した式を標準にしました。

        - E11 と、概念式で学習する E3 には、語そのもの以外の表示名を外した式を渡します。識別子はそのまま見えています。
        - E10 だけは、表示名を残した条件と外した条件を並べて比べます。表示名を外しても成績が落ちないかを確かめる対照です。

        L4 → E10 → E11 → 概念式で学習する E3（層 8）の順に、自動で走るのを待っています。
