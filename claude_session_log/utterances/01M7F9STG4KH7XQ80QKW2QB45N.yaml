        表示名の語を `ja` から `display` に改名しました（e845f0b、push 済み）。`check_spec.py` と `run_spec.py` は両方とも通っています。

        **改名した範囲**
        - `ontology.yaml`、`exp.yaml`、`subj.yaml` の表示名の項目と、文法の語の並びです。表示語のノード自体も `display` に改めました。
        - 法則 `unique_in_domain` の規則が参照していた関係も改めました。
