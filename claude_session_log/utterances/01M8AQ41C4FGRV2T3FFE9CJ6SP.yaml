        #911 は自動でマージされました。#911 のブランチと手元の作業場所は片づけてあります。続けて、残った 2 件を確かめる実験を事前登録して、走らせ始めました（#914、issue #913）。

        **#914 の中身**
        - **問うこと**: #911 で名指せなかった 2 件は、どちらも端の型が any で、相手が定義のない名（amount, people）でした。法則を 1 つ足せばこの形も名指せるかを確かめます。足すのは「限定の相手は名のあるもの（定義か個体）である」という法則です。
        - **判定**: 定義のない相手の誤りがすべてこの法則で名指され、全体でも 9 割以上がそろえば支持です。半分未満なら反証で、その間は決まらないとします。
        - **前もって伝えておくこと**:
          - 当てはまる誤りは、ほぼその 2 件だけになる見込みです。数の確かさより、仕組みが働くかを見る実験です。
          - 体系には相手を any とする限定があります（`ontology.deep_kind` など）。any が「名のあるもの」と扱われないと、何も足していない正しい行でも法則が誤りを出します。そのときは判定しない側に落ち、それを結果として残します。

        進みの確かめは 01:31 に置きました。
