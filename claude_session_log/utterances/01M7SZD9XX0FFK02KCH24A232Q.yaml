      text: |
        地図とものさしの例で言い直します。

        ## 例1: 家と「ものさし」
        日本中の家を、一枚の地図の上に点として並べたとします。
        - **領域**: 地図の上の家の全体です。一かたまりになっています。

        ここで、家を分ける**ものさし**を選びます。これが質的な限定です。

        **ものさし A: 広さ（㎡）**
        - 「100㎡以上の家」と切ります（量的な限定）。
        - 家を広さの順に一列に並べると、100㎡以上は列の片側にひと続きで固まります。
        - ものさしがまっすぐなので、切った結果もひと続きの一かたまりです。

        **ものさし B: 値段（円）**
        - 「5000万円以上の家」と切ります。
        - 地図の上で見ると、都心や駅前や海辺のあちこちに島のように散らばります。
        - 同じ広さ・同じ造りでも、場所で値段が変わるからです。ものさしが地図の上で曲がっている、と言えます。
        - 東京の 5000万円の家と大阪の 5000万円の家を選び、その「間」の地点を見ると、田舎の安い家に行き当たります。両端は仲間なのに、間が仲間ではありません。

        凸かどうかは、この最後の「間」で判断します。
        - **凸（一かたまり）**: 仲間を二つ選ぶと、その間もいつも仲間になる。広さで切ったときがこれです。
        - **凸でない（島に分かれる、穴がある）**: 仲間を二つ選んでも、間が仲間でないことがある。値段で切ったときがこれです。

        ## 例2: 色と波長
        虹の色を、波長のものさしで一列に並べます。紫（短い）から赤（長い）までです。
        - 「赤」は、列の端にひと続きで並びます。一かたまりです。
        - 「赤紫（マゼンタ）」は、赤と紫を混ぜた色です。この列の上には、どこにも居場所がありません。強いて言えば、列の両端に分かれて現れます。

        色を色相の輪（色の輪っか）のものさしで並べ直すと、赤紫は赤と紫の間に収まります。一かたまりになります。

        **同じ「色」という分類でも、どのものさしで測るかで、一かたまりにも、ばらばらにもなります。**

        ## まとめ
        | 言葉 | 例 |
        |---|---|
        | 領域（refer で述べる全体） | 地図の上の家の全体、見える色の全体 |
        | 質的な限定（ものさしを選ぶ） | 広さで測るか、値段で測るか／波長で測るか、色相で測るか |
        | 量的な限定（ものさしのどこで切るか） | 100㎡以上、5000万円以上、620nm 以上 |
        | 凸（一かたまり） | ものさしがまっすぐなとき |
        | 凸でない（島や穴） | ものさしが曲がっているとき |

        前に私が言った「写像がアフィンでないと凸が崩れる」は、「**ものさしが曲がっていると、切った結果が島に分かれる**」という意味です。

        あなたの直観の「限定すると凸でなくなるように感じる」は、ふだん私たちが使うものさし（値段、波長など）がたいてい曲がっている、ということと合っていますか。
