      text: |
        登録する前に数えたところ、私が前回言った「在らないことを要するのは `v_design` だけ」は誤りでした。このまま登録すると、すでに反証されたと分かっている仮説を置くことになります。なので、まだ登録していません。分かったことを報告します（体系は変えていません。数えたスクリプトは `/tmp/claude-0/-home-user-CMT/e05d2140-ce91-515f-a5fb-e6251e13d406/scratchpad/pre_readings.py` です）。

        ## 1. 「宣言されているのに在らない」を要する動詞は10個ある
        動的な動詞16個のうち、次の10個が該当します。
        - **在るようにする（9個）:** pre で「`exists` が述べられていない」を要し、post で在ると述べます。
          - `v_design`、`v_compute`、`v_speak`（終点が生まれる）
          - `v_execute`、`v_learn`、`v_judge`、`v_teach`、`v_see`、`v_expose`（new が生まれる）
        - **在らないようにする（1個）:** `std.v_freeze` は、post で「在る」を取り消します。

        どれも「生まれる・消える」を書いた動詞です。

        ## 2. 種類と個体で、話が分かれる
        - **種類（オントロジーの本体）:** 型検査器では、宣言 ＝ 存在です。宣言された種類はどれも在り、宣言されていない名前は文になりません。おっしゃるとおりです。
        - **個体（実行）:** 実行の記録は、名前を最初にすべて宣言しておき、在るかどうかを状態として時間とともに変えています。ここでの `exists` は時間で変わる文で、宣言とは別です。

        したがって、正確には次のように言えます。「宣言が存在を導く」のは、時間によらない種類についてです。時間の中の個体については、宣言が導くのは「名指せること」までで、在るかどうかは歩みが決めます。

        ## 3. 述べていない文の扱いが試されていない理由
        pre と post の読み方を数えました。

        | | 真と述べた文を要する | 偽と述べた文を要する | 述べられていないことを要する |
        |---|---|---|---|
        | pre | 6 | **0** | 12 |
        | post | 24 | **0** | 5 |

        - 「述べられていない」という読み方は、記録だけで決まります。世界は関係しません。
        - 世界が効くのは、pre が「真」を要するのに、その文が述べられていないときだけです。閉世界なら偽として扱われ、開世界なら決められずに止まります。
        - 1件しかない実行の記録では、真を要する pre（`v_withdraw`）は、どれも直前の歩みで述べられた文に当たっていました。**つまり、世界が判定を左右した場面は1度もありません。** 前回、世界に関わる変異がすり抜けた理由は、これで説明できます。
        - 「偽と述べる」を使う動詞は1つもありません。生まれることも消えることも、すべて「述べられていない」で書かれています。

        ## 登録する仮説の案（数え直した結果を踏まえて）
        - **(H1) 種類について：「宣言 ＝ 存在」**
          - 型検査器が `exists` を宣言からしか作らないことは、実装を見れば分かります。これは観察ではなく、作りの事実です。
          - 確かめられる形にするなら、「法則の `exists` の前提は、宣言されたものすべてについて真になる（述べていないままのものがない）」となります。
        - **(H2) 個体について：「在ることは、宣言ではなく歩みが決める」**
          - 10個の動詞は、どれも「述べられていない」から「在る」へ、またはその逆へ動きます。
          - 反証になるのは、「宣言しただけで在ることになっている」個体が実行の記録にある場合です。
        - **(H3) 世界について：「今の動的な動詞では、世界は真を要する pre にしか効かない」**
          - これを確かめるには、述べていない文に真を要する pre を当てる実行の記録を、開世界と閉世界の両方で書きます。前者では止まり、後者では pre が成り立たない、と予測します。これが、述べていない文の扱いの初めての試しになります。

        この3つで登録してよいですか。それとも、「宣言 ＝ 存在」を個体にまで広げる方向（名前は生まれたときに宣言される、と読み替える）で考えたいですか。
