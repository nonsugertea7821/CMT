      text: |
        not と some を、定義・書かれ方・コードの扱いの三方向から見ました。数は grep で手早く数えたもので、登録した測定ではありません。

        ## not

        **1. 同じ意味に名前が二つある**
        - 文法の語として、ノード `not`（否定、示されていない文を述べる文）があります。
        - 書き方の印として、`neg: true`（示されていないことの指定）があります。
        - 実際の否定は、すべて `neg: true` で書かれています（117 か所）。`not` という語は、文法の logic の節、all の上位、runtime の replace の限定の3か所にしか出てきません。
        - one_spelling は「一つの綴りが二つのものを指す」混同を見ますが、これは逆向きの「一つのものに二つの綴りがある」重複です。今の法則では見えません。

        **2. 意味は古典論理の否定ではない**
        - 定義のとおり「示されていない」、つまり Prolog や Datalog と同じ「導けないので否定」（失敗による否定）です。
        - 「偽である」と言えるのは、閉世界を前提に置いた領域だけです。
        - 失敗による否定の真偽は、「評価を終えた時点で導かれていない」ことで決まります。そのため、評価の順（層化）と一つの評価の終わりに依存します。
        - 論理の語というより、評価（step）の側の概念です。

        **3. 意味を与えているのはコード**
        規則を評価するコード、実行器の真偽の判定、型検査器の否定の扱いが、どれも `neg` の印を名前で読んでいます。

        ## some

        **1. 数で書ける**
        - some の定義は「参加するものについて述べ、その個数は 1 以上」です。
        - 一方、文法にはすでに `at: {count: {ge: 1}}`（個数の軸 count。端を限定しない any が元）があります。some はこれと同じ内容です。
        - all は「not と some」で定義されていますが、数で書けば「満たさないものの個数が 0」になります。
        - 型検査器の誤りの文言も「数は at で書く」と言っています。
        - 以前の「any と数（amount）」の案は、ここでもそのまま当てはまります。

        **2. 意味を誰も与えていない**
        - 限定の quant は 7 か所で使われています（some 3、all 4）。
        - コードは「quant の値が文法の logic にあるか」しか確かめず、評価もしません。
        - 前回足した含意の規則でも、quant の付いた限定は比べる対象から外しました。
        - つまり quant は、書かれているが意味のない印になっています。

        **3. 同じ語が別の役で使われている**
        runtime の `pre_rule: all / some` は、前の状態の文の並びを「すべて成り立つ（かつ）」か「どれか成り立つ（または）」で束ねる選択です。参加するものの数量化とは別の役です。

        **ついでに見つけたこと**
        文法の logic の節に between がありますが、between は値の範囲を判定する関数で、論理の語ではありません。

        ## シグネチャへの含意

        not と some を、そのまま芯としてシグネチャに置く必要はなさそうです。
        - **some, all**：個数の軸（count、元は any）と at で書き直せます。必要なのは個数の軸をシグネチャに下ろすことで、any と数で書く考えと一致します。
        - **not**：`not` と `neg` を一つにまとめます。意味の「示されていない」は、評価（step）と世界の前提（world）で決まるので、runtime の側に置きます。

        そうすると、シグネチャの芯の候補は「same、any、個数（数）、順序（after）」になります。否定と評価は runtime の binding と step にまとまる形です。

        ## 次の進め方の案
        1. not と neg の重複を法則で捕まえる（表示語の意味が同じ二つの語を見る、one_spelling の逆向き）。そのうえで一つにまとめる。
        2. quant の 7 か所を at の個数で書き直す。書き直す前と後で導かれる文が同じかを確かめる。
        3. 個数の軸 count と after を、シグネチャに下ろす。

        この順で進めてよいですか。
