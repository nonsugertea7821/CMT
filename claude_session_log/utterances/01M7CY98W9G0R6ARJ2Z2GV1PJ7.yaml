      text: |
        試験の結果、候補は一部で反証されました。ただし外れ方から、修飾が第3の次元だという直観を支える材料が2つ出ました。

        ## 試験の内容

        いまの語彙の実体 135個を、候補の3操作（関係 → 修飾 → 分類）の形に機械的に写し、それで足りるかを分類しました。

        ## 結果

        | 分類 | 件数（135個中） |
        |---|---|
        | 問題なく書ける | 5 |
        | 生起体を修飾して、生起体の下位を作っている | 42 |
        | 固定する端の中身が、実体でなく表示語だけの値 | 112 |
        | 固定する端の中身が数 | 3 |
        | 1つの端に複数の中身を入れている | 4 |

        ## 分かったこと

        ### 1. 修飾は、一巡の途中にある停留所ではない

        候補では、修飾は「生起から来て、持続へ抜ける」通過点でした。しかし実体の 31%（42個）は、生起体を修飾して生起体の下位を作っています（推論、使い方、接続手段など）。修飾は、持続にも生起にも当てられます。

        つまり修飾は、持続と生起の間をつなぐ経路の上にあるのではなく、その両方に直交しています。「3次元」という言い方の意味が、ここでようやく掴めました。候補のこの部分は誤りです。

        ### 2. 修飾語には、置き場所がなかった

        修飾の中身 217個のうち、130個が実体ではなく表示語だけの値でした。これを品詞で分けると、次のようになります（品詞の判定は私の手作業です）。

        | 値の品詞 | 使用回数 | 種類 | 例 |
        |---|---|---|---|
        | 修飾語的（形容詞・分詞・副詞） | 51 | 40 | 固定されている、見えない、推移的、学習に使った |
        | 動詞的 | 27 | 26 | 届ける、述べる、問う、公開する |
        | 名詞的 | 52 | 32 | 名前、文、一覧、トークン数 |

        値を列挙した軸 35本のうち、23本は修飾語的な値を持っていました。

        いまの語彙は最上位を持続と生起の2つしか持たないので、「固定されている」「見えない」のような修飾語は、どちらの木にも入れられません。行き場がなく、ツリーの外の表示語として溜まっていました。前回「意味の底が値の表示語に残っている」と報告したものの正体は、修飾の次元の住人でした。

        ### 3. 名詞的・動詞的な値は、二重持ちだった

        名詞的な値 32種類と動詞的な値 26種類は、本来なら持続と生起の木にあるべき実体です。以前に行き当たった重複（行為の値「届ける」と生起体「届けること」）は、その一部でした。

        ### 4. 「組」を書く手段がない

        1つの端に複数の中身を入れた実体が 4個ありました（適用例＝事例と判定の組、など）。候補にも現在の語彙にも、これを書く手段がありません。

        ## 次の候補が満たすべきこと

        試験から、次の3点が条件として出ます。

        - 修飾の次元に、それ自身の住人（修飾語）を持つ。
        - 修飾を、持続にも生起にも当てられるものとして扱う。
        - 値を、3つの次元のどれかの住人として持つ。表示語だけの値を無くす。

        ## まだ分からないこと

        3つの操作（関係・分類・修飾）が何を何へ写すのかは、今回の試験では決まりませんでした。分かったのは「修飾 → 持続」という向きだけでは足りない、という否定的な結果です。

        次は、上の3条件を満たす候補を作り、同じ試験にかけます。その際、次元の間の移動 6方向（3×3 の表の対角以外）のそれぞれについて、いまの語彙に実例が何個あるかも数えます。実例の多い移動が、3つの操作の正体に近いはずです。

        記録は `spec/trial/candidate1.yaml` に置きました。
