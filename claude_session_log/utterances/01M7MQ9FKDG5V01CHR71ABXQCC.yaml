        2. Key Technical Concepts

           **Statement semantics**
           - 3 readings: true; `val: {truth: false}` = stated false; `neg: true` = unstated.
           - The world gives a truth value only to unstated sentences.
           - runtime.py currently has `WORLDS = {"closed_world": False, "world": None}`.
           - syntax.yaml declares `closed_world: {..., extends: world, val: {truth: false}}`.

           **σ (truth-flip involution)**
           - Reading and step symmetry were observed at 1.0.

           **Limitation (制限)**
           - 44 neg-only nodes.
           - The mod grammar `[of, with, neg, quant, at]` has no val, so there is no stated-false mod. Neg mods are σ-invariant.
           - Closed-world domains (via `tc.presumed_worlds()`): syntax, runtime, std.
           - In a closed world, unstated ⊂ false; they are not equal (an earlier overclaim, corrected).

           **Preregistration**
           - The hypothesis plus the procedure script are committed before running. One-sided Fisher exact test, rule p<0.05.

           **exp_check mechanics**
           - `mean_value` averages rows that contain the cond key.
           - Observations are checked by the type checker. Changing a value makes the check fail; this was verified.
           - Hypothesis status is derived from v_support / v_contradict links.
           - lang claims may only reference layers plus lang words (check_sides).
           - named_mod law: identical inline mods in 2+ nodes must be named.

           **Physics analogy**
           - Gauge anomaly ↔ (A); parity violation; spontaneous breaking ↔ (B).

