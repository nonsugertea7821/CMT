      text: |
        h_any_not_vacuous（#153）を測り、結果は**反証**でした。PR #155 は Draft を外し、見張りを入れています。CI と自動マージの判定はまだ出ていません。

        **何を測ったか**
        - 体系の限定に現れる (動詞, 位置) の組は 87 あります。組ごとに、端に any を持つ限定 `{of: [v, pos], with: any}` を見本の種類として足しました。
        - 足すのは読み込んだ体系の上だけで、ファイルは変えていません。そのうえで型検査器の法則を回しました。
        - 確かめたのは、この限定を満たす概念が「その位置に何かの v を持つ概念」と一致するかどうかです。

        **結果**
        - 87 のうち 86 の組では、その位置に何かの v を持つ概念が実際にあります。
        - それでも、限定を満たす概念はどの組でも 0 でした。
        - 型検査器も ec もエラーは 0 です。

        **解釈**
        - 限定の端の any は、いまの法則の上では空虚です。
        - 原因は含意の規則 entail_by_with にあります。この規則は「端 w が端 any の祖先の鎖の下にある」ことを前提にしています。ところが any はノードではないので、その鎖に入りません（該当する事実は 0）。そのため、具体的な端の限定から any の限定へは含意が届きません。
        - 体系にもともとある any の限定は deep_kind の一つだけです。これが 444 の概念に満たされているのは、専用の法則 has_by_depth があるからにすぎません。この法則は動詞を v_above、位置を from、数を 2 より多くと決め打ちしています。位置の指定（of）に応じた一般の読み方は、体系にありません。
        - アフィンの類比で言えば、any は全体・ゼロの条件のはずです。それが法則では「どの端の下にもない、孤立した語」になっています。前回の w の欠けと同じく、意味が名前（専用の法則）にしかない形です。

        **判断していただきたいこと**
        1. **事前登録の弱さ:** 事前登録の前に、記録しない下書きで素案を一度走らせました。そのため、結果をほぼ知った上での確かめになっています。これは手順の中に開示してあります。判定の基準は変えていません。ただ、自動マージの条件「事前登録が結果より前」は commit の順序としては満たしています。自動マージに任せてよいか、手で見るかは判断してください。
        2. **次の仮説:** 具体的な端 w から any への含意を、祖先か含意の法則で書けば直りそうです。これを次の仮説として登録しますか。それとも h_w_from_frames（#152）に進みますか。
