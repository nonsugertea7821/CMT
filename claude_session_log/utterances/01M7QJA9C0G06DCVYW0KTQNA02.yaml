        2. Key Technical Concepts

        **Where checks happen**
        - tc (cscl/bootstrap/type_checker/type_checker.py) runs checkers from cscl.yaml (`exp: exp/src/exp_check.py`).
        - `gather()` in tc reads v_refer propositions into I[subj] with keys s/p/o via `end_word()`.
          - s/o are assigned directly, so a later v_refer of the same subject likely overwrites an earlier one (unverified).
          - A `from` list becomes multiple values, giving "関係 s の事実が2つ以上ある".
        - exp_check.py `triple()` checks proposition ends with `t not in T.N and t not in T.I` → "ノード … が未定義".

        **Individual namespace**
        - T.I holds bare names and is global across domains.
        - A bare individual name from another domain is accepted in reading-formula ends.
        - A qualified name (D.i) is rejected.
        - A top-level fact whose start is another domain's individual is rejected ("その位置の種類に当たる個体がない").

        **Other system facts**
        - `grammar.laws` = [law_rule, law_given] is a closed partition. tc rejects extra subclasses of laws.
        - v_govern: `{extends: v_refer, from: law_given, to: information_entity}`.
          - The 5 runtime laws (unique_names, step, frame, halt, no_confusion) each have `v_govern → runtime.run`.
        - WL color refinement is used for "determinable without names".

        **Experiment family registration in exp.yaml**
        - Nodes: `{F}: {is: measurement_family}`, `{F}_cond: family_axis`, and one axis_value per column. String columns are excluded: the `domain` column broke `stat`, so it was removed.
