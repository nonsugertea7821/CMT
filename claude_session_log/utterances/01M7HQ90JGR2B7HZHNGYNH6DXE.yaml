      text: |
        できます。仮説・決定・残り項目は「状態を持つ文」なので、issue との相性は良いです。ただ、作り方を間違えると「正本が二つ」になるので、そこだけ設計が要ります。

        **変換の形**
        - **1 仮説 = 1 issue** にします。
          - タイトルは仮説の表示名です。
          - 本文は display を使って「s が p で o に」を自然言語にし、根拠の観察（evidence / against）とその値の一覧を載せます。
        - **状態はラベルにします。** 未検証・支持・反証・混合を、型検査器が判定した状態そのものから付けます。
        - **開閉の扱い：** 支持か反証で決着した仮説は close、未検証と混合は open にします。これで、GitHub の一覧が「今調べている問い」になります。
        - **決定と残り項目も同じ形にできます。** 特に残り項目（24 件）は、そもそも issue 向きです。

        **大事な点：一方向の写しにする**
        - 正本は exp.yaml のままにします。issue は、体系から生成した表示の一つという扱いです。
        - 本文の冒頭に「この issue は exp.yaml から生成。編集は exp.yaml で」と書き、仮説の識別子を埋め込んでおきます。次に生成するときは、それで同じ issue を見つけて上書きします。
        - issue のコメント欄は議論の場として使えます。ただ、そこでの結論は exp.yaml に書き戻して初めて正になります。

        **実行のしかた（二案）**
        1. CI（GitHub Actions）で、main に入るたびに同期する。手間はかかりませんが、ワークフローに issue を書く権限が要ります。
        2. スクリプトを手元で実行して同期する。いつ反映するかを自分で決められます。

        **気になる点**
        - 仮説 55 件をすべて issue にすると、一覧が埋まります。まず open なもの（未検証と混合）だけ、という始め方もあります。
        - issue は公開リポジトリなら誰でも見られます。リポジトリの公開設定によっては、外に出したくない途中の仮説が見えます。
        - issue の作成は GitHub 上に残る操作なので、最初の一回は件数と中身を見てもらってから実行したいです。

        進めるなら、まず生成スクリプトを作り、GitHub に出す前の下書き（どの issue が、どんなタイトル・本文・ラベルで立つか）を一覧で見せます。それでよいですか。
