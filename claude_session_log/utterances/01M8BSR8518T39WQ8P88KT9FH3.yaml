      text: |
        その言い方そのままの仮説は見つかりませんでした。体系の中で探しても、モデルの隠れ状態という幾何空間を、シグネチャと文法の語だけで書けるかを問うものはありません。近いものは四つあり、三つが反証、一つが未検証です。どれも体系の式の側の話で、モデルの空間は測っていません。

        | 仮説 | 問うたこと | 結果 |
        |---|---|---|
        | `h_identifier_by_expansion`（#328） | どの概念の式も、シグネチャの語まで展開すれば識別子が一つに決まるか | 反証。展開しても名前でしか分かれない組が 5 つ残った |
        | `h_layers_unhardcode`（#210） | 型検査器は、シグネチャと文法の語のほかは名前を読まずに済むか | 反証。実行時の法則 5 つは、名前なしでは区別できなかった |
        | `h_signature_all_charts`（#602・#668） | 領域ごとの語彙を座標の張り（chart）と見て、シグネチャはその共通部分か | 反証。直に使う語で、24 の領域すべてに共通する語はなかった |
        | `h_charts_meet_at_ontology_roots` | すべての領域は、オントロジーの根で交わるか | 未検証のまま |

        同じ方向で反証されたものに `h_charts_meet_at_ontology_top`（#671）もあります。どの領域も「続く物」と「出来事」の区別に依存するか、を問うものでした。

        読み（解釈）としては、「シグネチャと文法だけで足りる」という方向は、式の側で二度、名前でしか分かれない残りに当たっています。辞書の見方に置き直すと、その残りこそが鍵（名前）の受け持ちで、一意性を空間の形だけで決め切れていない部分です。

        モデルの空間について近いのは #963 の結果だけです。表示語と、シグネチャ・文法以外の名前を伏せても、区画は式に沿っていました。ただし、伏せたせいで同じ文になった組もあり、その分だけ結果がかさ上げされている可能性はまだ見ていません。

        #963 は CI が通ったので Draft を外しました。確認とマージをお願いします。#966 は CI を待っています。
