        この周回で h_law_given_as_rule を確かめましたが、事前に決めた判定は「妨げを示せない」になりました。仮説は未検証のままで、#418 も Draft のままです。

        試したのは、意味を Python が与える法則（`law_given`）のうち named_mod の一つだけです。規則の法則は、検査器が作る文（`syntax_facts`）しか読めません。そこで写しに版を二つ作り、文の上で区別できるかを見ました。

        - **N:** 二つのノードが、名前を付けた修飾語 zz_m を名前で使う。
        - **I:** 二つのノードが、同じ中身をその場に書く。

        | | N | I |
        |---|---|---|
        | named_mod の誤り | 0 | 1 |
        | ほかの誤り | 5 | 5 |

        - **判定が分かれた:** named_mod の判定は見込みどおり N と I で分かれました。
        - **文は同じではなかった:** 二つの文の集まりは 1 つだけ違いました。N にだけ「名前 zz_m を書いた」という文（`r_written`）がありました。名前で書いたことは、展開されても文に残っていました。
        - **まだ分からないこと:** この文は「どのノードが書いたか」を持ちません。だから、ノードごとの判定に足りるかはまだ分かりません。
        - **版の作りの誤り（開示）:** zz_a と zz_b を同じ式にしたため、どちらの版にも別の誤りが 5 つ出ました。事前登録の「ほかの誤りが 0」という条件も外れています。

        次の周回では、手順の訂正を書き足して開示してから走らせます。

        - zz_a と zz_b を別の式にして、ほかの誤りを 0 にする。
        - 「一つは名前で、一つはその場に」書く版 M を足す。M と N の文が同じなら、ノードごとの区別は文にないことになる。

        新しい仮説は、この周回では出していません。

        ロードマップ a（識別子化）の続きとして h_law_given_as_rule を始め、named_mod の一回目を記録しました。
