        E55 が終わりました。適用例を 2 つ添えると、4B のモデルは検査器の出力を読むようになりました。1.5B のモデルは変わりませんでした。h_checker_output_read_when_taught（適用例があれば検査器の出力が読まれる）は、モデルで判定が分かれたので mixed です。

        数字は、名前を正しく答えた項目の割合です（32 項目）。

        | モデル | 例なし・依存の行あり | 例 2 つ・依存の行あり | 例 2 つ・依存の行なし | 判定 |
        |---|---|---|---|---|
        | 1.5B | 0.531 | 0.469 | 0.469 | 反証 |
        | 4B | 0.500 | 0.906 | 0.719 | 支持 |

        - **4B:** 例だけでも 0.500 から 0.719 に上がりました。そこに依存の行を足すと、0.906 まで上がりました。上がりの一部は例の形そのものの効きで、残りが出力を読んだ分だと読めます。
        - **1.5B:** 例を添えても、依存の行を添えても、動きませんでした。
        - **限界:** 添えた依存の行には答えが含まれます。このため 4B の支持が言えるのは、「この易しい条件で、例があれば出力を読める」ことまでです。
        - **途中の止まり:** 実行中にコンテナが落ち、途中保存から再開しました。1.5B は 2 回、4B は 6 回で、どちらも commit と PR の本文で開示しています。

