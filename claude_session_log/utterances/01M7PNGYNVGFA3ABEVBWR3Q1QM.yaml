      text: |
        PR #158 から法則 any_above_end を外して push しました。法則を外したあとも、型検査器と ec はどちらも通ります。main に入るのは、手順・4 つの結果ファイル・観察だけで、文法は変わりません。手順に訂正が入っているので、自動マージには乗りません。手でマージしてください。

        **自然言語の多義について**
        ご指摘のとおりです。表示の文を体系に読み戻すと元の式に戻る、という基準を置くと、多義があっても一つに決まる言い方しか使えなくなります。その制約の中で、どこまで自然に書けるかが問題になります。先行研究のうち、近いと思う系統を挙げます。どれも私の記憶からで、まだ調べてはいません。
        - **制御自然言語:** Attempto Controlled English（ACE）が代表です。曖昧さの出ない部分言語を決め、文と論理式を往復させます。多義は「解釈の規則を一つに固定する」ことで消します。
        - **オントロジーの読み下し:** OWL を英語にする研究です（OWL verbalizer、Rabbit、SOS など）。今回の「種類 ＝ 上位 ∧ 限定」の読み下しに一番近いと思います。
        - **文法を共有した翻訳:** Grammatical Framework（GF）です。抽象構文を一つにして、言語ごとの具象構文に線形化します。日本語の文法も含まれています。
        - **意味論からの文生成:** モンタギュー意味論の流れと、生成の側の研究（surface realization）です。
        - **日本語に特有の点:** 助詞・活用・ゼロ代名詞が多義の主な源です。日本語の制御言語の試みがあったはずですが、確かではありません。

        調べるなら、出典を確かめて、体系の論点（往復できるか、修飾を保つか、日本語）ごとに並べた形で持ってきます。調べますか。
