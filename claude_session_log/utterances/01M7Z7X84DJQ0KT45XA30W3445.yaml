      text: |
        ロードマップを左に木の形で置き、仮説を開くと確かめたときの PR の説明が出るように作り直しました。PR #698 に push し、プレビューも新しくしています。

        プレビュー: https://claude.ai/artifact/Qj5zABE8sP9DtnFYG6UHtw

        - **左のロードマップ**: フォルダのように開いたり閉じたりできます。
          - 決定の下には、その決定が依存する決定と、その決定を引き上げる決定が入ります。
          - その下に「ロードマップの外の決定」と「わき道」が続きます。わき道は「〜について」ごとのフォルダに分けました。
          - 決定を押すと、その根拠の仮説が右に並びます。
        - **仮説の中身**: 仮説を押すと、確かめたときの PR の本文（事前登録・結果の表・読み）がそのまま出ます。観察の文を出すのはやめました。
        - **PR が見つからない仮説**: 309 件のうち 194 件は、確かめた PR が見つかりました。80 件は確かめた PR がなく、その仮説に触れている PR のうち一番新しいものを出しています。この場合は、そうと断る注記を付けています。主に、まとめて登録したまま確かめていない仮説と、名前の付け方を決める前に確かめた古い仮説です。残る 35 件は、触れている PR もありません。
        - **安全**: 読む PR は、あなたか協力者が立てたマージ済みのものだけです。PR の本文は全部エスケープしてから表示するので、本文に生の HTML が入っていても動かず、文字として出ます。`session_log` は読みません。

        マージの前に、Settings → Pages で Source を「GitHub Actions」にしてください。

        ロードマップ上の位置: わき道（台帳の見せ方の改善で、どの決定の根拠にも結んでいません）。
