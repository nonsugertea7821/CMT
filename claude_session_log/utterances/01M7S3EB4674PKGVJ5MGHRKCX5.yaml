        h_checker_words_in_grammar（#232）は反証でした。役割（role）・定義（definition）・述べる（v_refer）の3語を文法の節に置くと、試した2通りのどちらも検査を通らないか、体系を変えました。訂正の後も判定は同じです。PR #298 の Draft を外したので、確認をお願いします。訂正が入っているので自動マージには乗らず、手で見てもらう PR です。

        **結果**
        - 試したのは一時コピーの上で、main の syntax.yaml は変えていません。
        - 節に置くノードを式なしで置く版（N1）は、「式がない」と法則 monotone への違反で落ちました。
        - 式 `with: nodes` を付けた版（N2）は、tc と ec を通りました。ただ、もとからある nodes が sentence・passage などの部品になる文が3つ増えました。足した式が既存の語の意味を変えています。この中身は使い捨ての探りで見たもので、記録はしていません。
        - v_refer を抜いた対照（M）では、型検査器が「節と、名前で読む語が違う」と言いました。等しさを確かめる仕組みそのものは働いています。

        **訂正（開示済み）**
        - 元の結果では、N2 で事実が9関係変わっていました。そのほとんどは、足した式の中の名前なしの限定についての文でした。名前での除外では外せなかった、#147・#148 と同じ型の測りの欠けで、これで3度目です。
        - 「前になかった項を含む文を除く」に基準を変えて測り直しました。判定の規則は変えていません。測り直しても、上の3つの文が残り、反証のままです。

        **含意**
        - 3語を文法に書いて等しさを確かめさせることはできます。足りないのは、節の名のノードに付ける、体系を変えない式です。そういう式があるかは、まだ確かめていません。
        - 体系の健全性の実験（sys_）で前後を比べるときは、名前ではなく項で除く方法を型にした方がよいと考えます。

        **新しい仮説（登録だけの PR #299）**
        - h_checker_words_by_formula: 型検査器が3語の名前でしている区別は、extends と mod の式から決まる。#232 の登録で挙げた「式で区別する道」の側です。
        - PR #299 は自動マージに乗る予定です。

        実験が終わったので、9分ごとの見回りは止めました。#297 と #296 はまだマージされていません。次の周回は 05:32Z です。
