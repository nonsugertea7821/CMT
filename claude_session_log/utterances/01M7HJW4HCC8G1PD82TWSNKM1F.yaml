        洗い出す前に、いちばん気になっていた点を2つデータで確かめました。一つは問題なしでしたが、もう一つで私の前回の説明に誤りが見つかりました。

        ## 先に訂正：E18 の平叙文の偏りの説明が間違っていました

        前回、「G2c の正解は主に否定（当たらない）なので、否定の文がもっともらしいという偏り」と書きました。これは誤りです。実際の正解の数は逆でした。

        | 群 | 正解「はい」 | 正解「いいえ」 |
        |---|---|---|
        | G2c | 15 | 9 |
        | G2k | 9 | 15 |

        正しくは、モデルは肯定の文（当たる）を好んでいます。そのため G2c が 0.71 と高く出て、G2k が 0.38 と低く出ていました。「平叙文の形式は言い回しの偏りに支配されていて、検出力が低い」という結論は変わりません。

        ## 確かめて問題なかったこと：E3 の学習と評価の重なり

        E3 は二択の設問で学習しているので、評価の設問を見ていないかを確かめました。

        - **評価と同じ設問は、学習に1つも入っていません**（0/96）。
        - **学習の答えは、どの語でも「はい」2問・「いいえ」2問で釣り合っています。** そのため、「この語には『いいえ』と答える」という答えの近道は学べません。

        ただし、学習の設問は評価と**まったく同じ二択の雛形**です。E18 で効果が二択に結びついていたことは、これで素直に説明できます。

        ## 気がかりの一覧

        ### 結論の強さに関わるもの（重い順）

        1. **検出力が小さいです。** 一つのモデル（Qwen2.5-1.5B）、一つの層（8）、各群24問です。正答率の 0.04 は1問分です。E3 のベクトルも1回の学習の結果で、乱数の種を変えて再現できるかは見ていません。
        2. **観察の許容幅を、データを見てから決めています。** `v_near` の許容幅（0.01、0.05、0.2 など）は、結果を見てから付けました。仮説の状態は、どの観察を支持・反証に結ぶかで機械的に決まります。その結び方も私が選んでいます。仮説の状態は、事前に決めた検定ではありません。
        3. **入れ替えの対照が中立ではありません。** ほかの語のベクトルは、ただ効かないのではなく、逆向きに押します（E15 の G2k で 0.92 → 0.62、E18 の用例で増分0）。そのため、「自分の語のベクトル > 入れ替え」という比較は、語に特有の効果を大きく見せています。同じ大きさのランダムなベクトルのような、中立な対照がまだありません。
        4. **用例の文は私が書いたものです**（E17、E18）。1語あたり3組しかなく、新しい意味の文には規程の言い回しの手がかりが入っています。E18 で共通成分 m が効いたのは、この文体のせいかもしれません。
        5. **E17 では、差のベクトルを s の大きさに合わせて約1.75倍に拡大しました。** 判定が壊れた（margin がほぼ0）のは、向きの問題ではなく大きさの問題かもしれません。元の大きさのままでは試していません。
        6. **E15 と E17 の「直交」は、一つの層の、語の位置の、平均ベクトルでの話です。** 別の層や、注意（attention）の経路で重なっている可能性は残っています（h_attention_carries_text_route は未検証）。

        ### 解釈に関わるもの

        7. **「s は二択の鍵」は推測のままです。** E18 で一部が否定されました（用例の形式でも語に特有の向きがある）。学習の雛形が二択だった、という素直な説明が残っています。
        8. **私の解釈は、これまで何度か外れています。** E12 の大きさ、E14 の壊れ方の原因、共通成分の向き、そして今回の平叙文の偏りです。説明として書いた文の確からしさは、数値より低く見てください。

        ### spec と検査の作り替えに関わるもの

        9. **今回の一連の拡張は、短い時間で一気に入れました。** 合成する、種類どうしの事実、2階、動詞を受け取る位置の型、検査の高速化です。確かめたのは、今の spec での一致と、わざと入れた誤りの十数通りだけです。閉世界での「すべてについて」という読み方を、ほかの種類どうしの事実にも広げたときに起きることは、まだ見ていません。
        10. **E16 の共通成分は、まだ成員の種類として近似したままです**（集まりの平均を、2階の性質として書いていない）。
        11. **合成について閉じた集合を層で分けていません。** 層0（E12）と層8（E3）のベクトルが、同じ集合として扱われています。
        12. **検査の中には、まだ位置や名前に頼っている所があります。** 例えば `space()` は「v_close で閉じる動詞」を名前で引き、`check_parts` は `v_sum` を名前で特別扱いしています。どちらも、まだ法則として書けていません。

        ## 優先するなら

        **3（中立な対照）と1（学習の種を変えた再現）が最優先だと思います。** どちらも安く、これまでの結論の多くがこの2つに乗っているからです。

        4 と 5 は、E17 と E18 の追試で対処できます。9〜12 は、実験が落ち着いてから spec 側で片付けられます。
