      text: |
        PR #93 を作りました（https://github.com/nonsugertea7821/CMT/pull/93）。claude/cscl の法則 placed_deduced に反していたのは、独立持続体、subj.object、subj.goods の3件でした。これを、体系そのものを数えた観察をもとに解消しました。

        **観察**
        `exp/experiments/sys_ends.py` が体系を数えて結果ファイルに書き、exp に族として加えました。
        - 「依存する」の終点に来るもの71件の割合:
          - 独立持続体: 0.155
          - 汎用依存持続体: 0.775
          - それ自身も何かに依存するもの: 0.901
        - holds・pre・post の原子107件は、すべて基礎の節に並ぶ関係でした。

        **主張**
        - `h_ic_is_bearer` は、上の2つの観察に反するので「反証された」にしました。
        - `d_sig_depend_to`（依存されるものは持続体）は、この反証を根拠に「採用済み」にしました。
        - 状態の関係は基礎の節の部分である、という仮説（支持された）と決定（採用済み）を加えました。根拠は107件すべてが基礎の関係だったという観察です。

        **書き換え**
        - 独立持続体と subj.object を体系から除き、それを上位にしていた agent・land・region・goods・warehouse・operator を持続体の下に置きました。
        - 販売するの終点は「部分になるもの」にしました。前の状態が「終点は始点の部分」だからです。

        **案から変えた点が2つあります。**
        1. **独立持続体を除く決定は、新しく加えず、`d_sig_depend_to` を採用済みにする形で記録しました。** 決定の中身には、除いた語（独立持続体）を書けないからです。「依存されるものは持続体であって、より狭い種類ではない」が、この決定の中身にあたります。
        2. **`h_ic_is_bearer` の中身を「依存されるものは、何にも依存しない」という否定の文に言い換えました。** 独立持続体の定義（何にも依存しない持続体）で置き換えたもので、意味は同じです。最初は、独立持続体がある状態で反証を記録して先にマージする案でした。しかし、その状態では新しい法則が CI で失敗するので、1つの PR にまとめました。

        **不具合の修正**
        言い換えの途中で、型検査器が文の中身の `neg` を読み落とし、否定の文を肯定の文として扱っていたことが分かりました。直したうえで、issue の下書きには「依存する（否定）(依存されるもの, 持続体)」と出ます。

        **注意**
        - `sys_depend_to.json` は、独立持続体を除く前の体系で測った記録です。測った版はファイルの `_commit` にあります。今の体系では測り直せないので、スクリプトはこのファイルを上書きせずに止まります。
        - 過去の実験を同じ入力で再実行するには、前の版の subj.yaml が要ります。

        **検査**
        - 型検査、実行の記録の検査、issue 同期の確認は、手元ですべて成功しました。
        - CI は2つのうち1つが成功し、もう1つは実行中です。結果が届いたら確かめて報告します。
