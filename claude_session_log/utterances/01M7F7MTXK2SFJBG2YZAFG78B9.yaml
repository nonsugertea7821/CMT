        その手順そのものは、記録の中に一つの手順としてまとまった形では見つかりませんでした。ただ、部品はすべて記録にあるので、それらをつなげて覚えていらしたのだと思います。記憶違いとは言えません。

        - `docs/design.md` の C3 に「語を出す前に概念の識別子を確定させる。出力後に語彙を検査する」とあります。
        - E9（済み）は、途中経過を書かせてから答えさせる実験でした。ただし書かせたのは日本語です。
        - 残り項目には「概念式で与える」と「モデルに概念式を書かせる」が別々の項目として積まれていて、二つを一つの手順につなげる記録はありません。

        とはいえ、つなげた形のほうが筋がよいので、その手順で進めます。

        1. **E10（いま作ったもの）:** 式を `subj.yaml` に書いたまま渡し、答えだけを選ばせます。比べる相手は、定義なしと日本語の定義です。次の段階で、式を読ませる効果と書かせる効果を切り分けるための基準になります。今回の作業で、式は変換せず書いたまま渡すように直しました（6e9896d、push 済み）。
        2. **E11（次に作る）:** 式を渡したうえで、途中経過も式で書かせます。
           - 設問の事例を事実として書かせ（例: `{is: v_allocate, from: …, to: …}`）、どの種類に当たるかを書かせてから答えさせます。
           - 書かれた行は 1 行ずつ検査器にかけ、動詞や種類が実在するか、それぞれの位置に来られるかを確かめます。
           - 測るのは、正答率と、検査に通る行の割合です。検査に通った場合と通らなかった場合とで正答率が違うかも見ます。

        E11 は文章を生成させる実験なので、二択に答えさせるよりかなり重くなります。GPU がないので、L4 が終わってから順に回します。いまの L4 の計算と CPU を取り合わないよう、それまでは E11 のスクリプトと、1 行ずつ検査する部分を作っておきます。
