        2. Key Technical Concepts

        - **Type checker (tc)**
          - `tc.build()` returns T, O.
          - `T.syntax_facts()` returns a list of (rel, tuple args).
          - `tc.Facts(items)`.
          - `tc.evaluate(tc.law_rules(O), F, tc.variables(O))` returns violations as (lid, bindings, f).
          - Relations live in F.by; derived relations start with `r_`.
        - **Laws that touch display, spelling and names**
          - unique_in_domain is the only law that reads display, and it only compares values for equality.
          - one_spelling reads r_written.
          - one_name.
        - **Signature**
          - Individuals in O get domain "signature" (fact line 999). The only node in the signature domain is `any`.
        - **How ec reads results (exp/src/exp_check.py)**
          - `rows_of(file, at)` follows the row path into the JSON.
          - `stat(rows, cond_entry, metric)` computes the metric; `mean_value` averages the values.
          - `v_keys_of` pattern (e.g. '#') together with list-valued v_spell filters rows by key.
        - **Observation verbs**: v_level, v_come_after (greater), v_come_before (less), v_near.
        - **Status kinds**
          - Hypotheses: hyp_untested, hyp_supported, hyp_refuted, hyp_mixed.
          - Backlog items: item_queued, item_done.
          - In claims.yaml these take the `exp.` prefix.
        - **v_depend's `to` end must be a continuant.** Putting ontology.occurrent there fails tc.
        - **Auto-merge (spec workflow)**
          - It gets 405 when the PR conflicts with main; the fix is to merge main into the branch.
          - It sends a PR to manual review when more than one commit touches the experiment script (that is, when there are corrections).

