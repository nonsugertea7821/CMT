      text: |
        あると思います。ただ、数学のどの道具で読むかで、0/1 の出どころが違います。2 通りに読めて、それぞれが mixed の別のグループに当たります。

        **1. 「依存する」を微分で読む → 向きが割れた mixed（グループ 1）に当たる**
        - 依存する：∂A/∂B ≠ 0（0 か 0 でないかで、ちょうど 0/1 になる）
        - 上げる・下げる：∂A/∂B の符号

        衝突する事例では上げ、衝突しない事例では下げた 4 件は、符号が事例の種類で変わっているだけで、どちらも 0 ではありません。つまり「上げる」と書いたから mixed になったので、「依存する」と書けば支持になる見込みがあります。これは既存の結果だけで確かめられるので、仮説として登録しました（#694、`h_channel_depends_while_raise_splits`）。

        **2. 割合の極限で読む → 「全部のはずが大半」の mixed（グループ 3）に当たる**
        ここは直観どおりにいく部分と、いかない部分があります。
        - 標本を増やしていくと、割合は真の値 p に近づきます。p が 0.74 なら、極限も 0.74 で、0/1 にはなりません。
        - 0/1 になるのは、閾値で切ったときです。たとえば「割合が θ を超えるか」という判定なら、n→∞ でほぼ確実に 0 か 1 に決まります。p がちょうど θ のときだけは決まりません（大数の法則、鋭い閾値の現象）。
        - もう一つ、自然密度という考え方があります。「密度 1」は「ほぼ全部」であって、「全部」とは別物です。h_real_axis_by_domain の 0.74 や h_claims_apart の 0.92 は、全部（∀）と、ほぼ全部と、割合の中間とのあいだで、式がどれも言い分けられないことが問題でした。
        - さらに、極限が存在しない（振動する）場合もあります。これはグループ 1 と同じで、隠れた変数で値が変わっている印です。

        **まとめると**
        - 0/1 の「依存する」は、量の極限そのものというより、極限の後に 0 か 0 でないかで切った形、と読むのが筋に見えます。
        - 体系の式に足りないのは、次の 2 つの区別です。
          - どの変数について微分するか：事例の種類を式に書くこと（グループ 1 と 2）
          - 極限の値そのもの：割合や密度を式に書けるようにすること（グループ 3）

        2 は言語の形を変える話なので、前に聞いた「割合を書ける形を足すか」の答え待ちのままです。今の読みからは、割合 p と、閾値で切った判定の両方を書ける形が自然だと思います。

        ロードマップの位置：#694 は d_goal に結んだ登録で、通れば自動でマージされます。E35 はまだ実行中です。
