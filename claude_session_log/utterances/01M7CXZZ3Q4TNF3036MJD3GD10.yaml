      text: |
        3つ目の次元だったのですね。私は生起と持続の2つで表を作り、修飾をその外の操作として扱っていたので、どう組んでも収まらない箇所が残っていました。

        理解できた範囲と、まだ確信がない範囲を分けて書きます。

        ## 理解できたこと

        基本の次元は、生起・持続・修飾の3つです。品詞で言えば、動詞・名詞・修飾語（形容詞と副詞）に当たります。

        すると、形の変化の表は 3×3 になります。挙げていただいた -er と -ing は、その中の1マスずつでした。

        | 元 ＼ 先 | 生起へ | 持続へ | 修飾へ |
        |---|---|---|---|
        | **生起から** | re-、un-（やり直す） | -er、-ee、-tion（届けるもの、届けられるもの、届けること） | -ing、-ed、-able（届けられた〜、届けうる〜） |
        | **持続から** | -ize、-ify（〜化する） | -ship、-hood（〜であること） | -al、-ic、-ful（〜的な、〜の） |
        | **修飾から** | -en（広げる） | -ness、-ity（〜さ） | un-、-ly、より〜 |

        前回の 3×2 の表（関係そのもの・始点・終点）は、このうち「生起から持続へ」の1マスの中の構造でした。全体ではなく、1マスだけを見ていたことになります。

        ## 関手として読んで納得できた点

        形の変化は、上位と下位の関係を保ちます。「届ける」が「行う」の下位なら、「届けるもの」は「行うもの」の下位です。木の構造を保ったまま別の木へ写すので、関手と呼ぶのが正確だと理解しました。

        これは実務上も効きます。派生した概念を1つずつ定義する必要がなく、生起の木に -er を適用すれば、対応する持続の木が丸ごと得られます。私が手で書いていた「接続手段」「教示」「言及」などは、その大半が導出できるはずです。

        ## 確信がない点：3つの関手が表のどこに当たるか

        私の読みは、関手は表の列（写す先）に対応する、というものです。

        | 関手 | 写す先 | 意味 |
        |---|---|---|
        | 関係 | 生起 | 何かを、結び付けるもの・起こることとして見る |
        | 分類 | 持続 | 何かを、種類として見る |
        | 修飾 | 修飾 | 何かを、他を限定するものとして見る |

        この読みを支える材料が1つあります。最初の説明の「軸は関係を抽象として見ることによって成り立つ」です。関係（生起）を持続へ写すと、「書かれること」「依存」のような抽象名詞になります。これが軸で、その下に具体として値が並ぶ。分類の関手を関係に適用したもの、と読めば、あの一文がそのまま出てきます。

        ただし、圏論の対応づけを正確に理解できている自信はありません。関手が列ではなく、行（元の次元）や、マスそのものに対応する可能性もあります。

        ## 修飾された概念について

        修飾が次元であるなら、「自然言語で書かれた語」は、上位に操作を施した結果ではなく、持続の座標（語）と修飾の座標（自然言語で書かれた）を持つ1点、ということになります。前回「重ねるが何であるか分からない」と書いた操作は、別々の次元の座標を組にすることだった、と理解しました。

        3つの関手は、表の列に対応する、という読みで合っていますか。
