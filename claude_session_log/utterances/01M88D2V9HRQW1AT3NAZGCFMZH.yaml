      text: |
        The test of #801 came out supported: if the 256 most variable dimensions are scaled down to the size of the next one, swapped words fall back into their region much more often. The results are pushed in #802 (c3331f7), and #802 stays Draft until CI passes.

        At layer 8, how often the midpoint falls inside its own group (G_rate):

        | Squeeze | Original words | Swapped words | Mixed | Lift |
        |---|---|---|---|---|
        | None | 0.779 | 0.229 | 0.436 | — |
        | Top 16 | 0.800 | 0.221 | 0.421 | −0.011 |
        | Top 64 | 0.793 | 0.229 | 0.429 | −0.004 |
        | Top 256 | 0.857 | 0.279 | 0.571 | 0.093 |
        | All dimensions | 0.871 | 0.314 | 0.593 | 0.121 |

        - **Verdict:** supported, because the top-256 lift (0.093) cleared the 0.05 line set before the run. Membership stayed well above the random baseline in every squeeze.
        - **Other layers:** squeezing the top 256 also raises swapped and mixed words at layers 14 and 20.
        - **Where the effect comes from:** squeezing only the top 16 or 64 does nothing. The lift appears once the squeeze reaches 256, and about three quarters of the all-dimension lift is already there. My reading, not yet tested, is that the many large dimensions pull the similarity scores together, while the group signal is spread through the smaller dimensions below them.

        Other changes:
        - **#799 merged.** I removed its worktree and local branch.
        - **#796:** I merged main into it to clear a conflict. It is still waiting for your review.

        I opened #803 to register h_spread_profile_transfers_to_unseen. #802 picked the squeeze from the same 240 words it then measured, so I didn't know whether a squeeze chosen on some groups also helps groups it never saw. #803 adds no new concepts, so the workflow should auto-merge it.

        ロードマップの位置: d_road_region（#376）。
