        - 中心化しただけの余弦では、その次元が近さを決めてしまい、類の区画を隠しうる、という読みです。
        - 確かめ方の案は、次元ごとに標準化してから中点を測ることです。

        **3. 役割は語の状態ではなく、注意に乗る（登録: h_roles_in_attention）**
        - h_refer_ops_share_direction は、「指す」のような関係の語を、項なしで単独で通していました。
        - トランスフォーマーでは、from・to の関係は語と語の間の注意で計算されるはずです。
        - 確かめ方の案は、「A が B を指す」のような文で、関係の語から各項への注意を見ることです。

