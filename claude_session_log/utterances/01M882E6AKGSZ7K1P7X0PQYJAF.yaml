        **1. 平均で読むと、語の意味が薄まる（#782 で測定済み）**
        - 反証された region 系統の多くは、語のトークン全部の平均で状態を読んでいました。#771（類の前置き）、h_refer_ops_share_direction、軸の読み出し、区間の切り方です。
