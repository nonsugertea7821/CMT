      text: |
        claude/cscl に入れてプッシュしました（コミット 970571b）。おっしゃった「述べる」の形で、肯定と否定、閉世界と開世界がつながりました。

        **読み方を決めた根拠**
        syntax の `not` は「否定（示されていない文を述べる文）」と定義されています。そこで neg は、字義どおり「述べられていない」と読むことにしました。これまで実行器は、neg を世界を通した「偽」として読んでいました。開世界で作る動詞が動けなかったのは、この読み違いが原因でした。

        **変えたこと**
        - **文の読み方は3つ**
          - 真である: 何も付けない文。
          - 偽である: `val: {truth: false}` を付けた文。公理の真偽の軸（refer の値）をそのまま使います。
          - 述べられていない: `neg: true` を付けた文。
        - **実行器の状態**
          - 状態を「文 → 述べた真偽」の記録にしました。
          - 真と述べた文と偽と述べた文は鏡の関係で、どの世界でも決められます。
          - 述べられていないかどうかは記録だけで決まるので、これもどの世界でも決められます。
          - 世界が与えるのは、述べていない文の真偽だけです。閉世界は偽を与え、world だけなら与えません。
          - post の neg は、述べたことを取り消します。val false の post は、偽と述べます。
          - 最初の状態に、偽と述べる文を書けるようにしました。
        - **open_world を除いた**
          open_world の定義は「閉世界に一致しない」という否定だけで、world に足す中身がありませんでした。独立持続体と同じ形です。そこで「world だけを置く」ことを開世界とし、閉世界を「それに『偽』を述べ足したもの」と書きました。

        **確かめたこと**
        - `cscl/bootstrap/runtime/test_worlds.py` を加え、CI（spec.yml）にも入れました。2つの世界それぞれで、上の対称性と、作る→壊す→作り直すを確かめます。手元で成功しました。
        - 古い読み方に戻すと、この検査は失敗します。
        - 実行の記録の検査（exp/tests）も通りました。
        - 型検査の誤りは、PR #93 で解消する既知の3件だけです。claude/cscl は、#93 がマージされるまでこの3件で失敗します。

        **残っていること**
        1. **偽と述べる文を書ける場所が限られる**
           今は pre・post と実行の記録だけです。領域の事実（facts）と、静的な動詞の holds には書けません。検査器の多くの箇所が、述べた真偽を読むようになる必要があるからです。書いた場合は誤りとして知らせます。
        2. **壊す動詞 v_freeze の意味**
           post の neg は「取り消す」なので、world だけの世界では、壊したあとの「在る」の真偽は決められません。「壊したら在らない」と述べるなら、post を `val: {truth: false}` にします。これは動詞ごとの決定なので、まだ変えていません。exp の動詞（v_judge など）も同じ形です。
        3. **記録がまだない**
           open_world を除いたことと neg の読み方を、claims.yaml に観察つきの決定としてはまだ記録していません。
        4. **main への入れ方**
           この変更は言語だけなので、#93 がマージされたあと、claude/cross に取り込んで別の PR にするつもりです。

        3 の記録と 2 の動詞の扱いを、どちらから進めるか指示してください。
