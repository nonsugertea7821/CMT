      text: |
        h_interval_cut_raises_midpoint の実験を測り終えました。結果は**反証**です。PR #361 の Draft を外したので、見てマージしてください。

        **何を確かめたか**
        「速い順」「重い順」のような量の順に並べた語を、ひと続きの区間（下・真ん中・上）で切った集まりと、両端（いちばん小さい側と大きい側）を合わせた集まりで比べました。区間のほうがまとまるかどうかを見ています。比べたのは、乗り物・果物・国のように、もとの上位概念が一つだけの量です。

        **結果**
        - 区間と両端の差の平均は 0.161 で、基準の 0.15 は超えました。
        - ただし乗り物の速さだけ差が負（−0.04）でした。「3 つの量すべてで正」という事前の条件を満たさないので、反証です。
        - 差のほとんどは国の人口（0.41）から来ています。果物の重さは 0.12 でした。

        **読み**
        「ひと続きに切ればまとまる」という切り方の形は、一般には効いていないようです。国の人口で効いて見えたのは、「大国」「小国」のような、もともとあるかたまりのおかげだと思います。果物の重さでは、真ん中の区間がいちばんまとまっていませんでした（0.21）。これも、効いているのが区間の形ではなく両端のかたまりだという見方に合います。ただ、量は 3 つ、語は 16〜20 語なので、ばらつきは大きいです。

        次に確かめるのは、対になる仮説 h_midpoint_depends_genus（#360、もともとのかたまりが効く）です。上位概念が混ざる量でも、すでに差を測って記録してあります（平均 0.12、判定には使っていません）。
