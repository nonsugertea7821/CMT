        | 970571b | runtime が neg を偽と読んでいた | 開世界で生成の動詞が動かず、「存在しない」を述べられなかった |

        この 3 例は根拠になりません。理由は 2 つあります。

        - **選び方が偏っている**：私が対称性を見ていたから見つけた例です。対称性と関係ない場所の欠陥と比べていません。
        - **数が少ない**：main の 229 コミットのうち、欠陥を直したと読めるものがそもそも数件です。履歴から割合を出すには足りません。

        ## 仮説として確かめる方法

        「対称性が崩れている場所には、欠陥がある」を仮説として、確かめる前に記録します。

        1. **崩れの一覧を先に固める**：これまでに数えた崩れを並べます。
           - 鏡の世界（述べていない文を真とする世界）を前提にするノードがない。
           - 法則は真と述べた文にだけ当たる。
           - 法則の否定は前提に 43、要求に 5 しかない。
           - 限定に「偽と述べる」読み方がない。
           - subj の制限 7 件に肯定の対がない。
           - 動詞の多くに否定の対がない。
        2. **欠陥の基準を、対称性と独立に先に決める**：例えば次のどれかが起きたら欠陥とします。
           - 型検査か実行の検査が失敗する。
           - 書いた主張と観察が食い違う。
           - 動詞が実行できない。
           - 実験の正解が定義と食い違う。
        3. **比べる相手を置く**：崩れていない場所を同じ数だけ決まった方法で選び、同じ基準で調べます。
        4. **欠陥の割合を比べる**：崩れの側で多ければ仮説を支持、同じなら反証です。

        1 と 2 を、調べる前に claims.yaml の仮説と観察の予定として記録します。結果を見てから基準を変えられないようにするためです。

