      text: |
        I ran the experiment for #920 and the hypothesis (`h_endpoint_law_replaces_code_check`) is supported. I've pushed the result and updated the PR body.

        **What was tested:** I removed the two checks hard-coded in the type checker that reject a word placed where it isn't allowed. In their place I added the rules #917 defined as declarations in `syntax.yaml`. Then I checked whether the same rows are still accepted and rejected. I ran this on a temporary copy, so the real checker is unchanged.

        | Result | Rows |
        |---|---|
        | Same verdict before and after | 50 |
        | Wrongly accepted after the change | 0 |
        | Wrongly rejected after the change | 0 |
        | Crashed after the change | 0 |
        | Not run (these 9 don't run before the change either) | 9 |

        - **Coverage:** all 54 targeted cases are covered, and the control set still produces no errors.
        - **Rows rejected only by the removed checks:** there were 12. After the change, the new rules reject every one of them.
        - **Error messages change:** one "can't go here" error now often appears as several rule errors. On the 50 matching rows the error count went from 170 to 178. So the line between accepted and rejected is the same, but what the reader is told is not.

        **Limits:**
        - This covers only these 59 rows. I haven't checked the rest of the system's files.
        - The 9 rows that don't run tell us nothing either way.

        **Next on this road:** put the rules into the real `syntax.yaml` and delete the two hard-coded checks. That changes the checker itself, so you'll need to review it, and it isn't in this PR.

        I'll mark #920 ready for review once CI passes. If it does, it should merge automatically.
