      text: |
        生成の順序を固定しました。前回残っていた「h′ から h を作る」という取り違えは、矛盾として捕まるようになりました。ただし、「h が h′ に依存する」と直接書く誤りはまだ捕まりません（下に書きます）。検査（check_spec と run_spec）は通り、コミットして push 済みです（ee7debf）。

        ## 入れたもの

        ontology.yaml の core に、種類としての依存 `r_kdep` と、それを導く規則を足しました。

        - **`kdep_by_mod`**：「X に依存する」と限定した種類は、X に依存します。
        - **`kdep_by_sum`**：合わせてできたものは、合わせた種類に依存します。`v_sum` の「new は from に依存する」を、規則として書いたものです。
        - **推移性と下位への継承**：依存する種類の下位も、同じものに依存します。
        - **`kdep_antisymmetric`**：互いに依存するなら同じ種類です。生成の順序が逆向きに回ることはない、という意味です。

        **錨**として、exp.yaml の h′（ずれを足した隠れ状態）を「h に依存する」と限定しました。h が先に計算され、h′ はその後にできる、という事実をそのまま書いたものです。

        既存の544ノードには、依存が逆向きに回っている所は見つかりませんでした。

        ## 逆向きをわざと入れて確かめたこと

        | 入れた誤り | 結果 |
        |---|---|
        | h′ の一種を「合わせると h になる」と書く | **捕まりました**（依存の反対称に反する） |
        | 錨を外して、同じ誤りを入れる | 通ってしまいました。捕まえているのは錨だと確認できました |
        | h の一種を「h′ に依存する」と書く | **捕まりません** |

        いずれも確かめた後、spec は元に戻してあります。

        ## 残る限界

        **3つ目は、種類どうしの関係としては矛盾になりません。** この誤りは「h の一種が h′ に依存する」と言っているだけです。h と h′ が互いに依存する形にはなっていないので、反対称に引っかかりません。これを捕まえるには「h（層の出力）は、注入したものには一切依存しない」という否定の錨が要ります。

        **錨の付け方に代償がありました。** 限定は1つしか書けないので、h′ の限定を「h を部分に持つ」から「h に依存する」に替えました。そのため「h は h′ の部分」は、今は書かれていません。

        これら2つと前回の制約（「合わせる」の三つの項を一度に書けない）の根は共通で、どれも限定を1つしか書けない、種類どうしの事実を書けない、という文法の制約から来ています。種類どうしの事実を文法で許せば、`{is: v_sum, from: h, to: v, new: h′}` を1行で書けます。部分の関係も依存の関係もこの1行から導けて、否定の錨も並べて書けます。次に手を入れるならここだと思います。これも core の文法に関わるので、進める前に確認させてください。
