      text: |
        PR を立てたら見張る仕組みを、フックの連鎖で作りました。#146 はもう見張っていて、CI やコメントはこの会話に届きます。

        **フックの連鎖の仕組み**
        - フックは MCP の道具を直接呼べません。そこで二段にしました。
          1. PR を立てる道具（`mcp__github__create_pull_request`）が終わると、`.claude/hooks/watch_new_pr.py` が動きます。結果の url から PR の番号を取り、「`subscribe_pr_activity` を呼ぶこと」という指示を私の文脈に差し込みます。
          2. 私がその指示を読んで、見張りを始めます。
        - 二段目は私が指示に従うことに頼っています。確実に止められる仕組みではありません。
        - 試したのは、作った入力をスクリプトに流して出力を見るところまでです。
          - 届いた指示文に番号が入ることを確かめました。結果の形が文字列の場合と、配列で包まれた場合の両方です。
          - url がない入力では何も出しません。
        - 実際に PR を立てたときにフックが働くかは、次に PR を立てるときまで分かりません。働かなければ設定を読み直します。

        **入れたもの**
        - `.claude/hooks/watch_new_pr.py` を新しく足しました。
        - `.claude/settings.json` の PostToolUse にフックを登録しました。今までのフックはそのまま残しています。
        - CLAUDE.md に「PR」の節を足し、「立てた PR は見張る」と書きました。利用者の名前は書いていないので、人が増えても使えます。

        **置き場所について**
        - 3 つとも commit 5913e56 で、PR #146 と同じブランチに入れました。本文にもその旨を足してあります。
        - そのため #146 は仮説だけの PR ではなくなり、マージの前に見てもらうものが増えています。分けたければ、別の PR に切り出します。

        **#146 のあとの流れ**
        - マージされれば issue が立ちます。
        - そのあと `h_above_sound` の Draft の PR を立てます。そのときがフックの初めての実地の試しになります。
