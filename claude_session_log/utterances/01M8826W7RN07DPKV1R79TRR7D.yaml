        **登録した仮説: h_midpoint_by_token_position（#780、自動マージ待ち）**
        - 中身は、中点の帰属が、語のどのトークン位置を読むかに依存する、というものです。
        - 体系にある「語のトークン位置」の概念で書いたので、新しい概念は足していません。根拠は d_road_region に結びました。

        **元になった読み（未検証）**
        - 複数のトークンに分かれた語の意味は、前の層で最後のトークンに組み上がるとされています（detokenization）。
        - これまでの測りは、語のトークン全部の平均でした。細かく分かれたひらがなの語では、意味の薄い断片が平均に混ざり、類の成分が薄まっていた可能性があります。

        **確かめ方（スクリプトは書いてあり、まだ commit していません）**
        - 同じ 240 語を、3 つの読み方で比べます。
          - 平均（今まで）
          - 最後のトークン
          - 最初のトークン（参考）
        - 判定は層 8 で、ひらがなの側の類の率が、最後のトークンで読むとどれだけ戻るかを見ます。
          - 支持: 戻りが 0.15 以上で、区画が偶然より上に保たれる。
          - 反証: 戻りが 0.05 未満。
        - 語のトークン数ごとの当たり方も、記録として残します。

