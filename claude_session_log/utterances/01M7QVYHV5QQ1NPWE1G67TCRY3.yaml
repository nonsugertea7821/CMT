      text: |
        2つの直観を、4つの未検証の仮説として登録しました（PR #248）。新しい概念を足しているので自動マージには乗らず、手で見てもらう PR です。

        | 仮説 | 中身 |
        |---|---|
        | h_prosody_carries_mod | 発話の自然さは、韻律で書かれる修飾に依る |
        | h_prosody_lowers_followup | 韻律で書かれる修飾は、応答に返る問いを下げる |
        | h_example_lowers_followup | 例示は、応答に返る問いを下げる |
        | h_contrast_lowers_followup | 対比は、応答に返る問いを下げる |

        - **下の3つの位置づけ:** 1つめを、Claude の応答に「進めて」のような簡易な答えが返ったか、問いが返ったかで測るための形です。
        - **「下げる」の向き:** 向きは仮に置いたものです。上げる結果が出たら、反証として記録します。

        **登録の途中で検査器が与えたもの**
        - 最初は「韻律」と「自然さ」を、どちらも「発話に依る質」として書きました。検査器は、同じ式の別名だとして通しませんでした。
        - 名前の違いしかなかったので、違いを式に置きました。
          - 韻律は、語がそれで書かれる質です。
          - 自然さは、あなた（運用者）が判定する質です。
        - その結果、1つめの仮説は「聞き手が判定する質は、語の書かれ方の質に依る」という形になりました。

        **対比の定義は弱い読みです**
        - 1つの概念には限定を1つしか足せないので、対比は「2つ以上へ述べる文」とだけ書けました。
        - 並べることは式にありますが、違いを示すことまでは入っていません。
        - 測るときの操作の定義で補い、そのとき開示します。

        **測り方の見込み**
        - データは、セッションの記録にある「応答」と「それに続くあなたの発言」の組です。
        - 応答の側では、例示・対比・韻律を数えます。韻律は文の拍の揃い・並列の型・文末の型など、規則で数えられる形に落とします。
        - 書き言葉では韻律の定義が一番難しいので、仮説ごとのブランチで事前登録してから測ります。

        #245（橋の仮説の登録）は、自動マージを待っています。
