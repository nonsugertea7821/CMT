        「識別子の作り方」を決めた設計の決定はありません。体系に書いてあるのは、次のことだけです。

        **目的と測り方（採択済み）**
        - 目的（d_goal）：この設計で、再定義がうまくいく度合いを上げる。
        - 測り方（d_metric）：それを、使い方をまたいでも答えがそろうか（使い方をまたぐ一貫性）で測る。

        **測り方を支える道（どれも仮置き）**
        - 領域の道（d_road_region）：答えがそろうかどうかは、二つの点の中点がその概念の範囲に落ちるかどうかで決まる。
        - 検査の道（d_road_checker）：書いた定義の正確さは、型検査器に依る。
        - 日本語の道（d_road_japanese）：表示語は自然さに依り、それが測る値を上げる。

        **三つの道の共通の土台（採択済み）**
        - 表示語は体系から決まる（d_cscl_display_derived）。

        **文法での定義（syntax.yaml）**
        - 識別子：概念の式をちょうど一つ指す、CSCL で書いた情報。
        - 表示語：識別子に合う語。

        なので、識別子と式の関係で設計が求めているのは「一つの識別子が一つの式を指す」ことだけです。識別子を中身から計算することまでは求めていません。

        「中身から計算できるか」を問うたのは、仮説の側です。
        - 展開の案（h_identifier_by_expansion）：反証。
        - 中身の全部の案（h_identifier_by_bisimulation）：反証。
        - 類と種差の案（h_identifier_by_genus_differentia）：反証。
        - 三つとも、表示語を体系から決めるという土台を「識別子まで中身から決まる」と読んで立てたものです。この読みは、決定として採ったものではありません。

        ここから先は私の読みで、確かめていません。この読みを外すと、subj の二組の問題は形が変わります。中身で区別できない二つの名前が別の式を指しているのか、同じ式を二つの名前で指しているのか、という「一つの識別子が一つの式を指す」の側の問いになります。この方向で進める場合は、先に仮説として登録します。
