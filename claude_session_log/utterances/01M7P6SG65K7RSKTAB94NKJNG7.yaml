      text: |
        型検査器のコードを読んで、確かめました。何も変えていません。

        **1. 尺度（axes）に上下関係は書けるか → 今は書けません**
        - 文法（syntax.yaml の grammar.axes）が、尺度に許している語は display・source・value の 3 つだけです。上位を書く extends はありません。
        - 尺度は ontology に 6 つが平らに並んでいるだけです（count, amount, text, truth, ratio, order）。

        **2. 含意の判定は尺度を見ているか → 見ています**
        - 尺度は、限定と同じく、概念が持つ特徴の集まり（r_acc）に入っています。money は "amount" を持ち、hour も "amount" を持っています。
        - なので、money の尺度を hour と違うものにすれば、hour は money の定義を満たさなくなります。違反は規則だけで外れるはずです。

        **ついでに見つけた穴**
        「午前は 9 時に始まる」のような値は `at: {amount: 9}` と書きます。このとき、書いた尺度が、その概念（hour）の尺度と合っているかは検査されていません。尺度を分ければ、この穴も問題になります。

        **進め方の選択肢**

        | | A. 平らに増やす | B. 尺度を分化させる |
        |---|---|---|
        | やること | 尺度に 円・歳・センチ・時・日 を、amount と並べて足す | 文法の尺度に extends を足し、円の量 ⊂ amount のような上下関係を書けるようにする。型検査器は「円の量を持つなら amount も持つ」と読む |
        | 変える所 | 領域の定義だけ | 文法（syntax）と、それを読む型検査器のコード |
        | 失うもの | 「どれも量である」という関係が式から消える。ontology の「単位は質の種類が決める」とずれる | なし（その分、変更が大きい） |
        | 分化の見方との合い方 | 尺度を差し替えるだけで、分化ではない | 尺度そのものが分化する。今回の発見に沿う |

        私は **B** を勧めます。
        - 「単位は量の分化」という今回の発見そのものを、式にできます。
        - 「文法は構文で決め、コードは訳すだけ」というあなたの原則にも合います。

        ただし B は型検査器の中心（概念の同一性を決める特徴の集まり）に手を入れます。既存の体系の検査と、実行器の試験（tc）が変わらないことを、確かめながら進める必要があります。

        **B にした場合の手順**
        1. 文法に尺度の extends を足し、型検査器が上位の尺度も特徴として数えるようにします。既存の体系では何も変わらないこと（違反の数・誤りの数が同じ）を確かめます。
        2. money の単位を「円の量（amount の下位）」として足す操作を登録して、測ります。
        3. 余裕があれば、`at` の尺度とその概念の尺度が合っているかの検査も足します。

        どちらで進めるか教えてください。
