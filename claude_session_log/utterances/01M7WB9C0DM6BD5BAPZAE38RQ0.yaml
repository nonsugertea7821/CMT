      text: |
        なるほど、見落とした中身より、なぜ見落としたかのほうが大事ですね。

        あの手順で私は、関係の差を「名詞の名前を含む行かどうか」で振り分けました。漏れたのは、名前のない中身の行です。つまり私は、事実が誰のものかを、式（定義の依存）でたどらずに名前で読んでいました。

        これは、この体系が直そうとしている読み方そのものです。名前で読むと、名前を持たないものが見えなくなります。法則 `named_mod_share` は「同じ中身を二か所で使うなら名前をつけよ」と求めます。これは、読む側が名前で読んでしまうことへの備えだとも読めます。今回、私はその法則に咎められ、同じ癖のせいで手順も書き損じたことになります。

        これを仮説として登録しました（PR #482、登録だけ）。

        - `h_model_reads_by_name`: モデルは識別子（名前）で読む。だから名前のない中身を落とす。
        - 確かめ方の見通し: モデルに、定義を変えたときの影響範囲を挙げさせます。そして、名前のある中身と名前のない中身とで、挙げ漏れの率を比べます。
        - ロードマップの `d_road_checker`（形式の正しさは検査器に依存する）に結びました。読む側が名前で読むなら、式で読む検査器が要る、という根拠になるからです。

        最初は lang の主張の側（claims.yaml）に置こうとしました。ところが、lang の主張からは exp の語「モデル」を参照できないと検査に言われ、exp.yaml に移しました。
