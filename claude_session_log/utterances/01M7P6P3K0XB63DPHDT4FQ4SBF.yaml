      text: |
        漏れではありませんでした。私の数え方（基準）の問題です。そして、おっしゃるとおり、そこに大事な含意がありました。

        **95% の中身**
        自前の式を 2 つ持つ辺は 24 本ありました。中を見ると、法則 single は破られていません。single が「1 つだけ」に縛っているのは、限定（mod）だけです。私の数え方（r_own）が、限定以外のものまで「自前の式」として数えていました。

        1. **22 本は、限定 1 つ + 尺度（axis）1 つ**
           - money: 限定「過程を測る」+ 尺度 amount（量）
           - age: 限定「人に依存する」+ 尺度 amount
           - accuracy: 限定「判定を測る」+ 尺度 ratio（割合）
           - chain_length: 限定「段を測る」+ 尺度 count（個数）
        2. **2 本は動詞（v_spell, v_close）**
           - 動詞の下位は、始点と終点の 2 つの端を一度に狭めます。single は限定の規則なので、動詞の端には掛かりません。

        **含意: 概念の特徴には 2 種類の置き場所がある**
        - **限定（mod）**: 何と関係するか。money なら「過程を測る」。1 歩に 1 つだけで、single が守っています。
        - **尺度（axis）**: 値がどんな目盛りの上にあるか。amount・ratio・count・order。限定とは別枠で、single に掛かりません。

        そして ontology の amount には、すでにこう書かれています。

        > amount: 量。単位は質の種類が決める

        **単位は、もともと尺度の側の特徴**です。ところが今は、money も age も height も hour も、尺度が全部同じ amount です。だから尺度で区別できず、名前の「円・歳・センチ・時」にしか区別が残っていません。

        **前回の操作への含意**
        money に単位を限定として足した前回の操作は、置き場所を間違えていました。single に反したのは、法則が「単位は限定ではない」と教えていた、と読めます。中間の概念を置いて 2 歩に分ける案も、同じ間違いを引き継ぎます。

        筋が通るのは、**尺度を分化させる**ことです。amount の下に「円の量」「歳の量」「センチの量」……を置き、money の尺度を「円の量」にします。こうすると、限定は 1 つのまま（single を守る）で、hour（尺度は時の量）は money の定義を満たさなくなるはずです。

        **確かめていないこと**
        - 尺度（axes）に上下関係を書けるか。今の ontology では、尺度は 6 つが平らに並んでいるだけです。
        - r_has（含意）が、尺度の違いを見ているか。尺度を変えても、違反の判定が変わらない可能性があります。

        **記録の訂正**
        - sys_differentiation の (b) について、前回足した訂正（「single が決めていること」）は不正確でした。正しくは「限定は single が 1 つに決めていて、残りの 5% は尺度と動詞の端」です。
        - 「新しい特徴を足す」の 238 にも、尺度が混ざっている可能性があります。

        **次の提案**
        1. まず、尺度に上下関係を書けるか、そして含意の判定が尺度を見ているかを、型検査器のコードで確かめます。読むだけなので、何も変えません。
        2. 書けるなら、money の単位を尺度の分化として足す手順を登録して測ります。
        3. 記録の訂正は、1 の結果と合わせて書きます。

        進めてよいか教えてください。
