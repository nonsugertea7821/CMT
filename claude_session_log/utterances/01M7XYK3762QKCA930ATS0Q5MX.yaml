      text: |
        幾何で読むと、語は表現空間の一点で、領域はその点をどう見るかを決める射影（座標の張り方）です。領域を選ぶことは、点を動かすことではなく、見る側を選ぶことになります。

        **部分にすることと、述べることの違い**
        - 部分にする（いまの v_compose での書き方）は、点が領域という区画の中にある、ということです。領域を移すと点も動きます。
        - 述べる（#599 の読み）は、点はそのままで、領域がそれを自分の射影で見る、ということです。一つの点を、いくつもの領域が同時に見られます。
        - 同じ名前が領域によって違う概念を指すのは、同じ点が違う部分空間に射影されて別の像になるからです。
        - 曖昧な語は、二つの射影の像がどちらにも近い位置、つまり境目にある点です。h_ambiguity_is_region_choice の「中点の帰属」はここに当たります。

        **std の定義の対（#596）を幾何で読むと**
        二つは、地図帳の二つの面になります。
        - h_std_by_shared_use: いくつかの座標が共に見ている点。座標どうしが重なる部分です。外延の側にあたります。
        - h_std_by_law: どの座標に乗り換えても変わらない構造。乗り換えに対する不変量です。内包の側にあたります。

        前の D(x) = D(親) + 差異 も同じ絵に収まります。x は親のベクトルに差異のベクトルを足したものです。領域の射影は、どの差異の成分を見えるようにするかを選びます。

        **登録した仮説**
        - `h_domain_as_projection`: 隠れ状態は領域に依存する。#600 で、d_road_region（本線 d）に結んであり、自動マージ待ちです。
        - 確かめ方の案: 同じ語を、領域を変えた文脈に置き、隠れ状態の差を取ります。その差がどう並ぶかを見ます。
          - 低い次元の部分空間に収まるなら、述べる（射影）の読みが合っています。
          - 領域ごとに離れた塊になるなら、部分にする（帰属）の読みが合っています。

        #599 は、#596 のマージで main とぶつかった箇所を取り込み直してあります。

        本線 a 識別子化、d_cscl_display_derived の下
