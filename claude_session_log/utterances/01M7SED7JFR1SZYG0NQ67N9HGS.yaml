      text: |
        そのほうが筋が良いと思います。前の返答で「最終的にはネイティブの読み手が要る」と書いたのは、早計でした。公開コーパスと比べるやり方には、利点が二つあります。

        - **判定者が要らない:** 人の判定は手間がかかり、ばらつきも出ます。モデルに判定させると、モデルの癖がそのまま基準に入ります。コーパスとの比較なら、どちらも避けられます。
        - **「LLM 以前」で汚染を避けられる:** 生成文が混ざったコーパスを基準にすると、モデル風の日本語が「自然」と判定されかねません。体系にある `h_model_utterance_less_reliable` の懸念とも合います。

        この提案は、仮説 `h_ja_text_agrees_public`（式から訳した日本語は、公開された文章と特徴量で一致する）として登録し、PR #316 を立てました。概念を足していないので、自動でマージされます。

        確かめるときに、事前登録で決めることが三つあります。
        1. **コーパスの選び方:** 「LLM 以前」の線を、公開年で引きます。たとえば 2020 年以前です。
        2. **比べる特徴量:** 韻律の句切りの数え方は D の最初の段で、これと重なります。ほかに、文の長さ、助詞の分布、修飾の深さが候補です。
        3. **一致の判定:** 訳文の分布が、コーパスの分布の範囲に入るかで見ます。

        「LLM 以前」を体系の概念として式にするかどうかは、今回は保留しています。概念を足す変更は手で見ていただくことになるので、必要になった段階で出します。
