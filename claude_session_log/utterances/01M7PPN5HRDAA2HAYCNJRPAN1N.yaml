      text: |
        h_ja_case_frame（#160）を確かめ、支持になりました。PR #165 は Draft を外してあり、自動マージの条件（事前登録が先、範囲の内のファイル、未検証から支持）に乗るはずです。

        **結果**
        「〜が〜を〈動詞〉」という一つの格の枠を、すべての動詞に当てて訳しました。
        - 動詞では、57 のうち 12（0.21）が機械的な規則で破れました。規則は、二重の格助詞、受け身に「を」、二重の「を」の三つです。
        - 項では、478 のうち 55（0.115）が破れました。
        - 事前に決めた基準（0.1 以上）を超えたので、支持です。

        **解釈**
        - **格の枠は動詞ごとに要ります。** 規則で数えられたのは下限です。例文を目で見ると、「何かを依存する」「会議がこれを始まる」「人がこれを住む」のような、語彙で決まる破れがさらにあります。
        - **枠は表示語の文字列からは出せません。** 表示語の形から作った枠でも、「何でもの上位に持つ」「これの成り立つことを求める」のように、多くは直りませんでした。格の枠は、動詞ごとに式として持たせる必要があります。
        - **h_identifier_by_expansion とつながります。** 「で書かれる」「に関わらせる」のように、動詞の表示語が助詞を抱え込んでいます。これは、式になっていない格の情報が表示語に逃げている例です。格の枠を式に移すと、表示語の残りの一部が消えるはずです。

        **限界**
        - 手順を書く前に、表示語をいくつか見ていました。そのため支持はほぼ見込めていて、強い確かめではありません。このことは PR に開示してあります。
        - 形態素解析器（fugashi）を入れようとしましたが、この環境で許可されなかったので、文字列の規則で測りました。

        次の候補は、動詞の格の枠を体系の式として足すことです。これは概念を足す変更なので、手で見てもらう必要があります。そのうえで、その枠を使って h_ja_roundtrip（訳した日本語から式を読み戻せるか）に進めます。
