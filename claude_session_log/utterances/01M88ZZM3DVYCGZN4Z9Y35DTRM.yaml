      text: |
        まず二つを仮説の対として登録しました（#840、登録だけなので自動マージに乗ります）。そのうえでの考えです。**推測を含みます。**

        **うまくいきそうな点**
        - 体系に落とすと、データは「型検査を通った概念式」になります。矛盾は入れる前に検査で弾かれるので、データそのものが一貫しています。
        - モデルから蒸留する場合、教師の揺れも一緒に写ってしまいます。体系を教師にすれば、教師のほうが揺れません。目的の「一貫した概念認識」に、学習の側から入る道になります。
        - 登録した仮説: `h_consistency_by_formal_corpus`（概念式のデータから学べば、使い方をまたいだ一貫性が上がる）。

        **外れうる点（ここまでの観察から）**
        - 説明で学ばせたものは、適用に転移しませんでした（h_explain_transfers_to_apply が反証）。例の往復で教えても、似た概念の区別は上がりませんでした（h_round_trip_raises_sibling も反証）。
        - 体系の中の言い方で一貫しても、自然な言葉での使い方に出てこない恐れがあります。
        - 登録した対の仮説: `h_formal_corpus_transfers_to_apply`（概念式で学んだものが、事例への適用に転移する）。成り立つかどうかは、ここで決まると見ています。

        **いちばん重い所は学習より翻訳**
        - 大きなデータを一つ一つ体系に落とす作業が、計算より先に詰まりそうです。
        - 落とす作業をモデルにさせるなら、その翻訳の正しさが要になります。後回しにしていた h_cscl_needs_translation・h_small_translation が前に出てきます。
        - 体系の語彙が足りなければ、落とすたびに概念を足すことになります。体系そのものが育つ、という副産物もあります。

        **この環境で小さく試すなら**
        - 材料には、既にある `cscl/library`（体系に落とし済みの定義）を使います。
        - 0.5B ほどのモデルに LoRA で学ばせ、学ばせていない概念で、一貫性と適用の両方を測ります。
        - 前に E4・E8 で学習が収束しなかった記録があるので、規模と収束の基準は事前登録のときに決めます。
        - E57 が走っている間は重い列が埋まっているので、その後の候補にします。

        ロードマップの位置: d_road_checker（E57 実行中。#839・#840 で「学習側から一貫させる」解き方を登録）。
