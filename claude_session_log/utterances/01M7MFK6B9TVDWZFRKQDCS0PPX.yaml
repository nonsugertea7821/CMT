        直観を「仮説」の形にすると、こう書けると思います。

        **目的と、いまの位置**
        - **目的:** 目的は `d_goal`（本設計が再定義の成功を上げる）です。その成功は、用法をまたいだ一貫性で測ると決めています（`d_metric`）。
        - **用法ごとの現在値（モデル 15b、単一層ベクトル）:**

        | 用法 | 結果 |
        |---|---|
        | 適用（衝突事例の正答率） | 0.79〜0.83 |
        | 暗唱（NLL） | 0.63（ベクトルなしは 2.70） |
        | 言い換えの選択 | 0.54（偶然の水準 0.5 とほぼ同じ） |

        - **用法どうしの関係（既存の仮説）:**
          - 用法どうしは転移しない: `h_recite_does_not_transfer_to_apply` ほか、支持済み。
          - 暗唱と適用は、同時に教えても互いを下げない: `h_recite_coexists_with_apply`、支持済み。
        - **抜けている用法:** 教師にしたのは「暗唱」と「適用例」だけです。**言い換えは一度も教師にしていません。**

        つまり、一貫性を下げているのは言い換えの用法だけです。しかもその用法は、まだ一度も教えていない状態です。「近いところまで来ている」という直観は、ここにあると思います。

        **仮説の案**
        1. `h_paraphrase_teacher_raises_paraphrase`: 言い換えを教師にすると、言い換えの選択が偶然の水準を超える。
        2. `h_paraphrase_coexists_with_apply`: 言い換えを足して教えても、適用の正答率は下がらない（暗唱と適用で示した同居が、言い換えでも成り立つ）。
        3. `h_all_usage_teacher_raises_consistency`: 用法をすべて教師にすると、用法をまたいだ一貫性が上がる。目的の指標に直接つながる仮説です。

        **裏付けの構造**
        - 用法は転移しないので、一貫性は「全部の用法を教える」ことでしか得られない、と読めます。
        - 3 の部品のうち、2つ（暗唱、適用）はすでに支持されています。
        - 1 と 2 が支持されれば、3 は新しい仕組みなしで成り立つ見込みが立ちます。
        - 逆に、1 か 2 が反証されれば、近くはない（ベクトルの形そのものに限界がある）とわかります。どちらに転んでも判定がつきます。

        **注意（限り）**
        - 証拠はすべて 15b の単一モデルです。
        - 多層ベクトル（E8）は収束していません。
        - 説明の用法（`usage_explain`）は、まだ測っていません。

