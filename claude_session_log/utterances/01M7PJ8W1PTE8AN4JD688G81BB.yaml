      text: |
        アフィン幾何の w は、**同じ数の組が「位置（点）」なのか「移動（ベクトル）」なのかを、もう一つの座標で区別するもの**です。点なら w = 1、ベクトルなら w = 0 にします。この 0 と 1 が、許される計算と許されない計算を自動的に分けてくれます。

        ## 1. なぜ要るのか：同じ (2, 3) が二つの意味を持つ

        平面で (2, 3) と書いたとき、意味は二通りあります。
        - **点**：原点から右に 2、上に 3 の「場所」
        - **ベクトル**：右に 2、上に 3 進むという「移動」

        日常の例にすると、次の違いです。
        - 「東京駅」は場所（点）
        - 「北へ 2 km」は移動（ベクトル）

        この二つは足し引きの規則が違います。

        | 計算 | 結果 | 例 |
        |---|---|---|
        | 点 − 点 | ベクトル | 大阪駅 − 東京駅 ＝ 東京から大阪への移動 |
        | 点 ＋ ベクトル | 点 | 東京駅 ＋ 北へ 2 km ＝ ある場所 |
        | ベクトル ＋ ベクトル | ベクトル | 北へ 2 km ＋ 東へ 1 km ＝ 一つの移動 |
        | 点 ＋ 点 | 意味がない | 東京駅 ＋ 大阪駅 ＝ ？ |

        座標を (x, y) だけで書くと、この区別は数に現れません。(2, 3) + (5, 1) は、点どうしの足し算（無意味）でもベクトルどうしの足し算でも同じ計算になってしまいます。

        ## 2. w を足すと、規則が数で守られる

        3 つ目の座標 w を足して、点は (x, y, 1)、ベクトルは (x, y, 0) と書きます。すると上の規則は、w を計算するだけで出てきます。

        | 計算 | w の計算 | 結果 |
        |---|---|---|
        | 点 − 点 | 1 − 1 = 0 | ベクトル |
        | 点 ＋ ベクトル | 1 + 0 = 1 | 点 |
        | ベクトル ＋ ベクトル | 0 + 0 = 0 | ベクトル |
        | 点 ＋ 点 | 1 + 1 = 2 | 点でもベクトルでもない（無意味だと分かる） |

        具体例です。
        - P = (2, 3, 1)、Q = (7, 4, 1) とします。
        - Q − P = (5, 1, 0) で、ベクトル（P から Q への移動）です。
        - P + (5, 1, 0) = (7, 4, 1) = Q で、点に戻ります。
        - 中点 (P + Q) / 2 = (4.5, 3.5, 1) は w = 1 なので点です。重みの和が 1 になる組み合わせなら、点どうしでも混ぜられます。

        ## 3. 平行移動で違いがはっきりする

        座標を (5, 0) だけ平行移動する変換は、行列で次のように書けます。

        ```
        | 1 0 5 |
        | 0 1 0 |
        | 0 0 1 |
        ```

        これを点とベクトルにかけると、結果が分かれます。
        - 点 (2, 3, 1) → (7, 3, 1)：場所が動く
        - ベクトル (2, 3, 0) → (2, 3, 0)：変わらない

        w = 0 だと、平行移動の 5 にかかる係数が 0 になるからです。意味の上でも筋が通っています。「北へ 2 km」という移動は、東京で考えても大阪で考えても同じです。場所に依存しません。

        コンピュータグラフィックスでは、位置と方向（面の向き、光の向き）を同じ行列で変換するために、この w を使っています。

        ## 4. 補足：w = 0 は「無限遠の方向」

        w が 0 と 1 以外の値も取るようにしたのが射影幾何（斉次座標）です。
        - (x, y, w) と (x/w, y/w, 1) は同じ点と見なします。たとえば (4, 6, 2) は (2, 3) の点です。
        - w = 0 は割れないので、「(2, 3) の方向の無限遠点」、つまり方向そのものを表します。

        ベクトルは位置を持たず、向きと大きさだけを持つ、という性質がここで幾何の形を取ります。

        ## 5. 体系への当てはめ（私の解釈で、確かめていません）

        D2 を、点と変位の規則に重ねると次のようになります。

        | アフィン | 体系（D2） |
        |---|---|
        | 点（w = 1） | 持続体。フレームをまたいで同一性を保つもの |
        | 点 − 点 ＝ ベクトル | 生起体 ＝ 前後のフレームの差（¬same(frame_t, frame_t+1)） |
        | 点 ＋ ベクトル ＝ 点 | frame_t に出来事をかけると frame_t+1（pre から post） |
        | ベクトル ＋ ベクトル | 出来事を合わせると過程になる |
        | 点 ＋ 点（無意味） | 持続体を二つ合わせても出来事にはならない |
        | 平行移動でベクトルは不変 | 出来事の型は、どの状態で起きるかに依存しない |

        この読みで、今の体系を見ると次のことが言えます。

        - **今の体系の静的な座標（修飾）は、w のない (x, y) に当たります。** 最上位の continuant と occurrent が座標ゼロで、`sys_above_sound` で 941 組の偽に根拠がなかったのは、区別が w にしかないのに、その w が静的な座標にないからだと読めます。今は w を名前（どちらの最上位の下に置くか）だけで持っています。
        - **w の痕跡は構造にもあります。** 動的な動詞が持つ pre と post は、「二つの状態の差」という形です。つまり w = 0 の形をしています。`sys_tops` で動的な動詞 36 がすべて生起体と合ったのは、ここで名前と構造が一致していたからです。
        - **一致しなかったところは、w の付け間違いに当たります。**
          - 静的な動詞 82（holds だけ）は差を持たないのに、生起体（w = 0）に置かれていました。
          - 生起体の名詞 49 のうち 35 は、動的な動詞に届きません。
        - **静的な関係（above を含む）は、点でもベクトルでもない第三のものです。** 射影幾何で言えば、直線 ax + by + cw = 0 のような、点に対する条件（双対の側）に近いと思います。「P は Q の上位」は、一つのフレームの中で点の組について成り立つ条件であって、場所でも移動でもありません。

        ## 6. 類比の限界

        - アフィン空間は連続で線形ですが、フレームは事実の離散的な集まりです。差を足し引きできる構造（ベクトル空間）があるとは限りません。
        - D2 の same は同一性で、座標が等しいこととは別物です。点が動いても同じ点、という読みは、アフィン幾何では「点を名前で追う」ことに当たり、幾何そのものの外にあります。
        - なのでこれは、w の 0 と 1 の区別を何で表すかを考えるための足場として使い、数学的に対応すると言うのは控えたいです。
