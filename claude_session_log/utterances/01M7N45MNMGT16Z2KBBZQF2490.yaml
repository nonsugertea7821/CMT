        反映し終えました。持続体と生起体の導きを仮説として登録してから測り、判定は**反証**でした。記録と push は済んでいます（0014808）。

        **結果**

        | 確かめたこと | 値 | 導いた定義との関係 |
        |---|---|---|
        | 個体の種類が持続体 | 1054/1054 | 合う（持続体の導き） |
        | 動的な動詞が生起体 | 36/36 | 合う（D2 の動的な側） |
        | 静的な動詞が生起体 | 82/82 | 合わない。D2 では関係で、生起体ではない |
        | 生起体の名詞が動的な動詞に届く | 14/49 | 合わない |
        | 概念が動的な動詞に届く | 0 | 合わない |

        - 登録の前に「動的な動詞は 16 前後」と書いたのは誤りでした。pre を自分で持つ語根だけを数えていました。上位から受け継ぐものを含めると 36 です。注に書いてあります。
        - 合った2つ（個体と、動的な動詞）は観察として残しました。仮説の支持には結んでいません。

        **食い違いから導けること**
        1. **静的な動詞 82 は、生起体ではなく関係になる。**
           - 依存する、部分になる、後ろに置かれる などは、フレームを変えません。D2 のもとでは、持続体でも生起体でもない、3つ目の「関係」です。
           - あなたが前に言った「関係は限定できない。シグネチャ側」とも合います。限定 λself. v(self, X) の v そのものです。
        2. **動的な動詞に届かない生起体の名詞 35 は、2種類に分かれる。**
           - **時間の区間:** subj の day、week、morning、meeting、time_span と、ontology の temporal_part・staged などです。D2 ではフレームを変えません。フレームの並び（後ろにあること）で決まる区間で、生起体そのものではありません。
           - **過程と推論:** ontology の process・inference・concept・performed・triggered、exp の usage などです。「起こること」として置かれているのに、変化の中身がありません。
        3. **概念は、宣言を在るようにする推論として書き直す必要がある。**
           - 今の定義は「語が引き起こす推論」だけで、何を変えるかがありません。
           - D2 で生起体にするには、pre で新しい概念の宣言が述べられておらず、post で述べられている、という中身が要ります。開世界の実行器の「在るようにする位置」と同じ形です。

        **どこから直すか**
        次の順を勧めます。
        - **(1) 静的な動詞を関係として置き直す。** 規模が一番大きく（82）、ontology の最上位の形が変わります。
        - **(2) 概念と推論・過程に、変化の中身を足す。** 概念が中心になるところです。
        - **(3) 時間の区間を、フレームの並びから導く。**

        (1) は持続体・生起体と並ぶ最上位「関係」を足す変更で、体系全体に及びます。(2) から先にやることもできます。どれから進めますか。
