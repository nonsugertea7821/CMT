        2. **Key Technical Concepts**
           - **CSCL as a broad type system.** Nodes are types and extends is subtyping. Verbs are function types. mod/cmp are refinements. kind_collection is the 2nd order. Closed sets act as algebraic closure checks.
           - **Self-reference.** Most type rules are written as law_rule in CSCL itself. Python is a stage0 bootstrap. The user expects future self-hosting, where the previous version becomes the trust root.
           - **Layers.** axiom (grammar, base, axiom laws) / std (derived vocabulary and laws, currently merged into the axiom namespace) / exp domains (subj, exp).
           - **Rule engine.** Semi-naive Datalog with var1..var5. Negation-as-failure is allowed with existential unbound variables. Unary relations use only `from`.
           - **Issue design (proposed).**
             - Each issue has three parts: an explanation by Claude (display only), a generated definition section from exp.yaml with a hash, and 経緯 (history) from the conversation.
