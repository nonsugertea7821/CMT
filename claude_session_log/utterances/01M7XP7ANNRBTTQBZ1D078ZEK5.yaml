        **含意**
        - 書いていない欄を「何でも当てはまる」と読む規則では、どちらが具体的かという順序ができません。
        - 規則の側で残る筋は、登録済みの h_extends_min_by_collected（#569）です。今回との違いは、None を包含とみなさない点だけです。違いがこの一点なので、#569 を確かめれば、この含意をそのまま問えます。
        - このため、新しい仮説は足しませんでした。

        #529 は、手で見てもらうのを待っています。次の周回は 00:24Z で、h_extends_min_by_collected（#569）を確かめます。

