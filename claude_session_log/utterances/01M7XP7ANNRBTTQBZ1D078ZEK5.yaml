        h_extends_unwritten_open（#574）を確かめた結果は反証でした。下位の動詞 70 のうち、書いた extends と一致したのは 7 です。上位の動詞は 49 のうち 47 が「親なし」と出ました。tc と ec は通り、PR は Draft を外しました。

        **結果**
        - 導いた親は exp.v_read が 31 で、None（親を決められなかったもの）が 27 です。
        - 走らせる前に書いておいた懸念のとおりでした。端が None のときに包含とみなすと、端を書かない動詞が順序の下に来ます。
