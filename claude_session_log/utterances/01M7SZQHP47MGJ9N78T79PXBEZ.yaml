      text: |
        その像は、数学でもかなり素直に成り立ちます。ただ、「点になる」には見る向きが二つあるので、分けて言います。

        ## 外から見ると点、内から見ると空間
        三次元の例に、もう一本軸を足して考えます。
        - 「広さ・築年数・駅からの距離」の三次元を、「東京で」という断面で切り出したとします。
        - **ほかの軸の側から見ると**、この切り出しは「場所＝東京」という一つの値です。つまり点です。
        - **切り出した中から見ると**、広さ・築年数・距離が自由に動く三次元の空間です。

        全体が無限次元なら、ほかの軸は無限にあります。どんな refer も、ほかの無限の軸から見れば一点に固定した断面です。一方、中から見れば、選んだ有限の軸だけが動く空間です。

        点はそれ自体で凸です（仲間が一つなので、「二つの間」がそもそも外に出ません）。平らな空間も凸です。だから、どちらの向きから見ても、refer で切り出したものは凸です。あなたの像と合います。

        ## 無限次元で起きることが、もう一つ効きそう
        次元がとても多い空間では、適当に選んだ二つの方向は、ほとんど直角になります。

        二次元なら、二本の矢印はいろいろな角度を取ります。千次元、一万次元と増やすと、でたらめに選んだ二本の矢印は、ほぼ必ず直角近くに落ち着きます。

        これを refer に当てると、こうなります。
        - 別々の refer で切り出した空間どうしは、互いにほぼ直角に立ちます。
        - 一方から他方を見ると、相手は自分の軸にほとんど影を落としません。点のように見えます。

        前に挙げた Park らの観察「上位と下位の概念は、言語モデルの中で直交している」は、この性質の現れとして読めます。あなたの「下位は常に点」は、これと同じことを外側から言っているように見えます。

        ## 区別しておくところ
        - 点になるのは、**外から見た refer の切り出し**です。中で量・質の限定をして立体を作る話は、切り出した中で起きます。限定で凸が崩れる、という前の話とはぶつかりません。
        - 体系そのもののノードの数は有限です。それでも、refer を足せば軸はいつでも増やせます。「無限次元」は、上限のない開いた空間、と読むのが体系には近いと思います。

        この話から、言語モデルの表現で確かめられる問いがいくつか出てきます。たとえば、別々の refer の方向がどのくらい直角に近いか、です。提案するときは、先に仮説として登録してから出します。
