      text: |
        理由は、変異を1つ作るたびに、体系全体の検査を最初から走らせているからです。

        - **変異の数:** h_reading_ends_resolved は 510 個、h_plural_from は 622 個（311 式 × 始点・終点）です。
        - **1回の検査:** 毎回、全部の yaml を読み、型検査と exp の検査器を通します。GitHub の CI で 14 秒ほどかかる検査で、この container でも10秒前後かかるはずです。
        - **変異ごとの準備:** 7.2MB・163 ファイルある結果のフォルダを、作業場ごとに写しています。exp の検査器が結果ファイルを読むためです。
        - **並列:** 1つの実験で4本ずつ並べていますが、この container は 4 コアです。2つの実験を同時に回しているので、いまの負荷は 8 を超え、互いに待ち合っています。

        ざっと見積もると、1つの実験は単独なら 510 × 10秒 ÷ 4 ≈ 20分ほどです。2つ同時なので、それぞれ倍近くかかります（いま 28 分と 24 分経過）。

        速くするなら、次の2つが効くはずです。

        - **体系を一度だけ組む:** 毎回の組み直しをやめ、変異は変えた事実の分だけを確かめ直す（インクリメンタルな検査）。数分の1以下になるはずです。
        - **作業場を写さない:** 結果のフォルダは写さずに参照させる。

        ただし、記録として信頼できるのは、CI と同じ「全部を最初から検査する」やり方です。その確かさと引き換えに、時間がかかっています。
