        2. Key Technical Concepts

           - CSCL works as a type system.
           - Laws are evaluated by a semi-naive Datalog engine (Facts, evaluate, _match; the `same` relation is special).
           - syntax_facts emits bare relation names (extends, mod, of, position, …). Rule relation names stay bare; rule arguments get qualified, except variables, the `to` of the `position` relation, and "any".
           - The layered law uses r_visible:
             - visible_self and visible_use exist and are non-transitive.
             - A transitive rule (visible_trans) probably needs adding in syntax, because scope resolution is transitive.
           - Meta-level writing words: individuals' `is` and fact verbs (law_rule, v_assume, domain, variable) are resolved via the syntax scope (function qw). The principle is that writing in syntax ≠ semantic dependency.

