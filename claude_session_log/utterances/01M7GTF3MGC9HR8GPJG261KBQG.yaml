      text: |
        「再定義とは、モデルが元から持つ複数の意味の候補から一つを選び、多義性を除くこと」と見ると、これまでの結果の読み方と、次の設計が両方変わります。含意を5つに整理します。

        ## 1. 再定義の仕事は「意味を注入すること」ではなく「意味を選ぶこと」になる

        - ベクトルに要るのは定義の全情報ではありません。候補の中から一つを選べるだけの情報です。
        - 日本語の定義文で教えても概念式で教えても、ベクトルの効果がほぼ同じでした（G2c 0.79 と 0.75、G2k 0.92 と 0.92）。教師の中身の細部ではなく、どの意味を選ぶかだけが学ばれたのだとすると、説明がつきます。
        - 単一層のベクトルが言い換えの設問に転移しなかったこと（E6）も、同じように読めます。ベクトルは「この位置ではこの意味」という局所的な選択を覚えただけで、意味そのものは書き込んでいない、という読みです。

        ## 2. 渡すべきなのは完全な展開ではなく、意味の候補どうしの差

        - 選ぶために必要なのは、目的の意味と競合する意味を分ける限定だけです。共通の上位（主体・組織など）は、モデルがすでに持っています。
        - 完全に展開した概念式は、モデルが知っている部分を長々と繰り返すことになります。E10 で概念式を置くと対照の設問が下がり、E3-expr で文とベクトルを両方与えると崩れたことと合います。
        - 「子 = 親 + 差分」（docs/design.md 5.5）と、「分化の条件は、兄弟概念では失敗しその概念では通るテストがあること」（docs/design.md 5.6）は、この見方では差分のほうが本体になります。
        - 前回の「完全展開を直接ベクトル化する」案は、この見方では筋が悪くなります。代わりに、意味の候補どうしの概念式の差をベクトル化するのが自然です。docs/design.md の案2（兄弟概念の定義文を読ませたときの活性化の差）が、ちょうどこれに当たります。

        ## 3. 再定義の難しさは「目的の意味が候補の中にあるか」で決まる、という予測が立つ

        - 目的の意味が、モデルが持つ少数派の意味のとき → 選ぶだけで済むので、ベクトルでも文でも効きやすいはずです。
        - 目的の意味が、モデルの候補にない新しい意味のとき → 選べないので、合成か新しい差分の書き込みが必要で、難しいはずです。
        - 対照の設問（G2k）は、目的の意味がもともと優勢な場合だと見なせます（「なし」で 0.75）。「なし」の正答率は、既存の意味の優勢度を測っていることになります。
        - 今の設問は、この区別をしていません。G2c の中で効く語と効かない語があるなら、この軸で分かれるかもしれません。これは検証できる形の予測です。

        ## 4. CSCL の役割は「意味の識別子」と「候補の一覧」になる

        - 概念式は、意味の候補それぞれの名前になります。再定義は「この語をこの概念式に結び付ける」宣言になります。
        - いまの体系では、語から概念への結び付けを文字列の一致で行っていて、多義を表す場所がありません。語から複数の概念式への対応（意味の候補）と、そこから一つを選ぶ再定義を、体系で書けるようにする必要が出ます。
        - d_term_server_selects（語の解決は用語サーバーが選ぶ）は、意味の選択そのものになります。そして、その判断をベクトルで行うという d_verdict_by_vector とつながります。

        ## 5. 測るものが変わる

        - まず語ごとに、モデルが既定でどの概念式に沿って振る舞うかを測る必要があります。候補の列挙と、優勢度の測定です。
        - 再定義の効果は、正答率よりも、選ばれる候補の分布がどれだけ移ったかで測るほうが自然です。

        ## 注意

        これはまだ仮説で、今のデータとは矛盾しない、という段階です。確かめるには、語ごとに次の2つを分けた設問が要ります。

        - (a) 目的の意味が、モデルの既存の候補にある
        - (b) 目的の意味が、モデルの候補にない

        そのうえで、(a) のほうが再定義しやすいか、また候補どうしの差から作ったベクトルが、定義全体から学習したベクトルと同等以上に効くかを見ます。

        この見方を、仮説（例えば h_redefinition_is_sense_selection と、3 の予測）として spec/exp.yaml に足しますか？ あわせて、体系に意味の候補を書く場所を設計し、(a)/(b) を分けた設問と、差分ベクトルの実験を残り項目に入れる案を出せます。
