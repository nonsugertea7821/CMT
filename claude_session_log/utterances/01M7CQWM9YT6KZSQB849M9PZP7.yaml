      text: |
        説明が抜けていました。「層」は、モデルが入力を処理するときに順番に通る処理段のことです。

        ## モデルの中で起きていること

        入力の文章は、まずトークン（語や文字の断片）に分けられ、各トークンが1本の数値の列（ベクトル）に変換されます。このベクトルが、同じ構造の処理段を下から上へ順に通過し、最後に「次に来るトークン」の予測になります。この処理段の1つ1つが層です。今回の Qwen2.5-1.5B は28層あります。

        各層は、2つの処理をします。

        - **注意機構**: 他のトークンの位置から、関係する情報を取り込みます。先ほどの「定義から設問へ情報を運ぶ」のはこの処理です。
        - **変換**: 取り込んだ情報をもとに、そのトークンのベクトルを書き換えます。モデルが重みとして持っている知識は、主にここで呼び出されます。

        層を通るたびに、各トークンのベクトルは少しずつ書き換えられていきます。

        ## 層の深さによる役割の違い

        既存の研究から、おおよそ次の傾向が知られています。境界ははっきりしたものではありません。

        | 位置 | 主な内容 |
        |---|---|
        | 浅い層（入力に近い） | 文字や語の形、品詞など、表面的な情報 |
        | 中ほどの層 | 語の意味、その語にまつわる知識。言語にあまり依存しない概念の表現 |
        | 深い層（出力に近い） | 次に何を出力するかの決定 |

        ## 今回の実験で「第8層に入れる」とは

        概念ベクトルは、ある層の出口で、対象の語（「社員」など）の位置のベクトルに足し込んでいます。足したあとのベクトルが、それより上の層すべてに流れていきます。

        - **第8層に入れる**: 28層のうち下から8番目の出口で足す。その上の20層が、書き換わったベクトルを使って処理を続けます。
        - **第14層、第20層に入れる**: より出力に近い位置で足す。影響を受ける層が少なくなります。
        - **第4層に入れる**: より入力に近い位置で足す。ほぼすべての層が影響を受けます。

        ## なぜ層を変えて試すのか

        語の意味がどの層で組み立てられるかによって、足す位置の適否が変わるからです。

        - 意味が組み立てられる前の層に足すと、モデルが後から元の意味を上書きしてしまうかもしれません。
        - 意味が使われた後の層に足すと、もう手遅れで、答えを直接押すことしかできません。

        「定義する」「適用する」など、どの使い方もが参照する共通の意味表現があるなら、それが作られる層に足したときに、すべての使い方が揃って変わるはずです。層を変える実験は、その位置を探しています。

        第14層の結果が悪かったのは、後者の「答えを直接押している」状態に近いと読めます。衝突する設問は上がったのに、衝突しない設問が何もなしの水準より下がったからです。

        ## メモリ不足との関係

        学習では、出力の誤差を、ベクトルを足した層まで逆向きにたどって修正量を計算します。浅い層に足すほど、たどる層が多くなり、途中の計算結果を多く保持する必要があります。第4層で失敗したのはこのためです。
