      text: |
        「分化の系譜とは何か」には、2 つの読み方があります。片方に決めるには、まずこの 2 つを分け、どちらなのかを観察で決めるのがよさそうです。

        ## 2 つの読み方
        - **(A) いまの定義どうしの関係（共時）**
          - 系譜とは「何の一種か」（類、extends）が連なったものです。
          - 類と差異で定義する立場では、類は定義の一部です。犬の定義に「哺乳類である」が入るのと同じで、自分の欄（差異）から後で導き出すものではありません。
          - ここまでの実験で、extends が自分の欄から導けなかった（#561〜#574）こととも合います。
        - **(B) 分化の出来事の記録（通時）**
          - 系譜とは「いつ、何から、何が分かれたか」の記録です。
          - 最初の design.md に、この読みがはっきり書かれていました。
            - 関係として「分化元・精緻化元・置換先・版」。
            - 変更の記録の種類として「新設・分化・精緻化・置換」。
            - 分化の条件として「兄弟では失敗し、自分では通るテストがある」。

        ## 2 つが一致する条件
        次の 2 つがどちらも起きないなら、(A) と (B) は同じものになります。
        1. **収斂**: 同じ差異が、別の類の下に出ること。
        2. **付け替え**: 定義（自分の欄）を変えずに、親だけを変えること。

        生物学にちょうど同じ対立があります。似ている形質でまとめる表形学と、分岐の歴史でまとめる分岐学です。両者がずれる原因が収斂（ホモプラシー）です。

        ## 決める観察
        - **収斂**: 自分の欄が同じなのに、書かれた extends が違う動詞の組を数えます。これは h_verb_extends_primitive の確かめ方そのものです。
        - **付け替え**: git の履歴で、自分の欄を変えずに extends だけが変わった節を数えます。いま #578 で、仮説 h_lineage_is_genus として登録しました（わき道）。

        ## 今わかっていること（解釈を含みます）
        - acda4d3 では、「具体概念を抽象に置けてしまう」のを直すために、10 節を付け替えています。
        - これは、記録より定義の正しさを優先した例です。つまり、これまでの実際の扱いは (A) 寄りでした。
        - ただし、数え上げはまだしていません。収斂がなく、付け替えが「定義に合わせる修正」だけなら、系譜 = いまの類（A）と決めてよくなります。動詞の extends は、そのとき原始概念の骨格として明示的に残します。
        - 逆に、収斂が見つかった場合は、(B) の記録を別の関係として持つ必要が出てきます。design.md の「分化元・版」に戻る形です。

        次は h_verb_extends_primitive（収斂の数）を先に測ります。

