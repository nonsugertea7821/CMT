      text: |
        `h_display_law_redundant`（#466）は支持でした。PR #469 の Draft を外したので、確認をお願いします。今回も手順を一度直したので、auto-merge には乗らず手で見る扱いです。

        **何をしたか**
        表示語の法則（`disp_*`）が、句を式から作るようにしたあとでも要るかを、一時の写しで確かめました。手書きの表示語には、わざと逆の向きの言い方を書き足しています（91 ノード）。法則を外した写しも走らせました。

        **結果**
        - 今の検査器では、法則は書き足した食い違いを 91 件すべて捕まえました。法則は手書きの表示語に対しては働いています。
        - 句を式から作る写しでは、同じ食い違いを 1 件も捕まえませんでした。
        - 法則を外しても、誤りの集合は変わりませんでした。句を式から作った写しの誤りは、今の検査器と同じです。
        - 書き足した表示語は、ほかの法則にも効きませんでした。

        **訂正**
        最初の手順は、差し込んだ 2 行の字下げがずれていて、測る前に落ちました。その結果は開示として commit し、字下げだけを直した `_fix` を走らせる前に事前登録しています。

        **解釈**
        表示語の法則は、表示語を手で書いていたあいだのつなぎだった、と読めます。句を式から作れば、検査は法則に頼りません。

        **新しく登録した仮説**
        次の変更として `h_phrase_in_checker` を登録しました。検査器が句を限定から作り、法則 `disp_*` を体系から除いても、tc と ec が通るか、という仮説です。今回の PR では、法則を体系から外す変更はしていません。それは別の PR で見てもらいます。

        ロードマップ: a（識別子化）で h_display_law_redundant を確かめた。次は h_phrase_in_checker。
