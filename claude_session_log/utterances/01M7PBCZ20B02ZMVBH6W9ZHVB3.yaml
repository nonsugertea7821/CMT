        C を測りました。予測は外れです。表示名の「余り」（式から来ない文字）で、定義の薄い概念を見分けることはできませんでした。

        ## 結果（sys_display_residual、手順は先に登録）

        違反が 9 組あった時点（2477928）の体系で測りました。

        | 値 | 結果 |
        |---|---|
        | 違反の組（前提） | 9（成り立つ） |
        | 違反の上の概念 6 つのうち、余りを持つ割合 | 1.0 |
        | 概念 526 個すべてのうち、余りを持つ割合 | 0.772 |
        | 比 | 1.30（登録した基準は 1.5 倍以上） |

        違反の上の概念は 6 つとも余りを持っていました。ただ、概念全体の 77% も余りを持っているので、区別にはなりません。今の体系（HEAD）でも、全体の割合は同じ 0.772 でした。

        手順の訂正を 1 つ、結果を見る前に入れています。最初の実行は、個体の表示名を読むところで止まりました（値は出ていません）。個体の表示名の読み先を直し、その訂正を commit してから測りました。

        ## 解釈（実行後の読みで、判定には使っていません）

        **文字の余りでは、2 つのものが混ざってしまいます。**
        - 式に取り残された意味。例えば、直す前の money の「円」です。
        - 日本語が 1 語に語彙化した名前。例えば「仮説」「売上」「年齢」です。

        語彙化した名前は、さっきの整理で言う「辞書の項目」なので、取り残しではありません。粗い近似ではこの 2 つを分けられないので、測り方の限界がそのまま出たと見ています。

        **ただ、直した概念では余りの中身が変わっていました。**

        | 概念 | 直す前の余り | 今の余り | 理由 |
        |---|---|---|---|
        | money | 円・金・額 | 金・額 | 円が軸 yen の表示名から来るようになった |
        | age | 年・歳・齢 | 年・齢 | 歳が軸 sai の表示名から来るようになった |
        | verb_ref | 動・詞・指 | 動・詞・指（変わらず） | 下を参照 |

        verb_ref で残っているのは、まず「動詞」です。これは「生起体」の日本語での別名、つまり辞書の側の語なので、取り残しではありません。

        つまり、余りがあるかどうかでは区別できませんでした。でも「式を直すと余りの中の特定の文字が消える」という形で、取り残しは見えていました。区別するには、辞書（語彙化した名前と別名）を体系の外に分けて持ち、辞書で説明できない余りだけを数える必要があります。これは前に話した「翻訳＝辞書＋組み立て規則」の、辞書の部分を作ることに当たります。

        ## 次

        推奨順では B（コメントを禁止するための棚卸し）が次です。

        C の結果は B にも効きます。コメントを式に移すと決めても、表示名と同じく「語彙化した名前（辞書の項目）」と「取り残された意味」を分ける必要がありそうです。B の分類にも、その区別を入れるつもりです。

        - このまま B に進む。
        - その前に、辞書を分けて C を測り直す。

        特に指示がなければ B に進みます。記録は 766e2b0 まで claude/cross に push してあります。CI は GitHub 側で走ります。
