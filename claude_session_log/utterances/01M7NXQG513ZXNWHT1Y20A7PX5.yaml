      text: |
        はい、塞ごうとしていたのはその穴です。

        **仕組み**
        - 「役割であること」は、式としては「定義に依存する、実現されうるもの」と書かれています。
        - 何かの式がこれを満たしているのに role の下に置かれていなければ、法則 specific が「より具体的な概念の下に置け」と誤りを出すはずでした。
        - 出なかったのは、specific が限定を字面の一致でしか比べず、「rule_consolidation に依存する」が「definition に依存する」を満たすことを見ていなかったからです。

        **塞ぎ方は2つあります**
        - **一般に塞ぐ**：前回書いた含意の規則を specific に入れます。役割に限らず、どの概念でも「式が上位の概念を満たすのに、その下に置かれていない」ものを捕まえられます。代わりに、いま式が区別していない 25 組（hour と money、height と age など）を一つずつ式に書き足して直す必要があります。
        - **役割だけ塞ぐ**：役割の式（定義への依存）を満たすものは role の下に、という法則だけを足します。すぐ入りますが、規則に role という語を名前で書き込むことになり、同じ穴はほかの概念に残ります。

        私は「一般に塞ぐ」を勧めます。25 組は、意味が表示語や置き場所にしかなく、式に書かれていないところで、これまで探してきた「体系に書かれていない意味」そのものだからです。

        一般に塞ぐなら、規則を入れて 25 組を一組ずつ直します。直し方に判断が要る組（たとえば money を「円で測る」とするか）は、まとめて相談します。この進め方でよいですか。
