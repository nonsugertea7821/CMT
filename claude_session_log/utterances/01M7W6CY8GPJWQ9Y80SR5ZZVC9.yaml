      text: |
        機械語への翻訳は、仮説を登録しただけで、まだ一つも確かめていません。この系列で測ったのは、その手前の self-hosting だけです。

        **いまある道具**
        - **意味の側（体系）:** 実行時の意味論が、ライブラリ `cscl/library/runtime/runtime.yaml` に書いてあります。実行器・実行の記録・止まった状態・ステップの列といった概念と、実行の戦略があります。戦略は、前の状態を確かめ、否定の文を取り除いて肯定の文を加え、1 歩ごとに法則を確かめる、というものです。
          - ただし、その意味を与える法則（一歩の置き換え・触れない文は変わらない・止まる条件など）5 つは、まだ `law_given` です。式ではなく、Python が意味を与えています。
        - **実装の側:** 実行器は `cscl/bootstrap/runtime/runtime.py` にある Python です。体系から機械語や、ほかの言語に翻訳する仕組みは、まだありません。

        **self-hosting の測定（`h_cscl_self_hosting`、反証）**
        検査器が誤りを出す箇所 119 のうち、cscl の規則で書けていたのは 1 つだけでした。

        | 分類 | 数 |
        |---|---|
        | 規則（rule） | 1 |
        | Python が意味を与える法則（given） | 10 |
        | 法則に結びつかない検査（文法・形・読み込みなど） | 108 |

        その後、残っていた法則を一つずつ規則に移す作業（#455 など）で、given の側は減りました。ただ、この測定はやり直していないので、今の数は出ていません。いちばん大きいのは、文法や読み込みの検査 108 です。これは「文法を法則として書く」系列（`h_grammar_as_laws` など）が担当です。

        **機械語への翻訳の仮説（5 つとも未検証）**
        あなたの「物理装置の概念を詰めたら、ごく一部の翻訳で済むのでは」という話から登録したものです。
        - `h_checker_by_executor`: 検査器は、実行器の上で動かせる。検査器は、体系の実行器に頼る。
        - `h_cscl_needs_translation`: cscl を動かすには、実行される言語への翻訳が要る。
        - `h_small_translation`: 検査器そのものは、実行される言語に頼らない。翻訳が要るのは、実行器のごく一部だけ。
        - `h_optimization_in_system`: 最適化の規則も体系の中に書ける。ステップの定義は、実行される言語に頼らない。
        - `h_meaning_preserving_rewrite`: 意味を保つ書き換えは、ステップの定義と「止まった状態」で式にできる。

        **順番の見立て**
        翻訳を小さくするには、先に検査器の判断をできるだけ体系の規則に移す必要があります。Python に残る部分が少ないほど、翻訳する部分も小さくなるからです。いまの a（識別子化）の作業、たとえば次の `h_phrase_in_checker` や文法を法則にする系列は、その下ごしらえにあたります。

        翻訳の系列に直接取りかかるなら、最初は `h_checker_by_executor` がよさそうです。検査器の一部、たとえば規則の当てはめを、runtime の実行器で動かせるかを確かめる仮説です。翻訳の土台を測る形になります。この系列を早めたければ言ってください。それまでは、a の本線（`h_phrase_in_checker`）を先に進めます。
