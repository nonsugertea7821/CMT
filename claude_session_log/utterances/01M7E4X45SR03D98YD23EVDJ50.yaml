      text: |
        ご指摘のとおりでした。前回は「語 → ノード」の対応表を置いただけで、`ja` や `of` という語そのものはノードではありませんでした。記録の項目は「項目名＝ノードの識別子」にしたのに、文法の語だけ別の扱いになっていました。直して、検査を通し、プッシュ済みです（ノード343）。

        ## 直した内容

        - **文法の語はすべてノードの識別子**：`ja`、`gloss`、`extends`、`of`、`with`、`neg`、`mod`、`val`、`cmp`、`quant`、`at` などは、その名前のノードが定義されています。節の名前（`base`、`axes`、`nodes`、`records`、`grammar`、`laws`）や、`gt`／`ge`／`lt`／`le`、`not`／`all`／`any`／`between`、`number`／`literal` も同じです。
        - **対応表を廃止**：`grammar` の節は、節ごとに使える語を並べるだけになりました。並んだ語がノードでなければ検査がエラーにします。

        ## 同音異義が見つかったので改名したもの

        語をノードにしたところ、同じ語が別の意味で使われている箇所が3つ出ました。

        | 以前の語 | 問題 | 改名 |
        |---|---|---|
        | 動詞の `before`／`after` | 基礎の関係 `after`（後ろにある）と同じ語 | `pre`／`post` |
        | 軸の `from` | 位置の `from`（始点）と同じ語 | `source` |
        | 軸の `values` | ノード `value` と単複だけが違う | `value` |
        | 法則の `of` | 修飾の `of`（位置の指定）と同じ語 | `scope` |

        ノードと動詞・修飾の `from`／`to`／`new` は、位置そのものを指す1つの意味に揃えました。`from: continuant` は「始点の位置に来るものは持続体」と読みます。

        ## 残っていること

        - **新しいノードの定義は粗い**：検査は「未定義でない・重複しない・型が合う」までしか見ていません。たとえば `gt` は「後ろに置かれる、の始点を占める関数」と書いただけです。
        - **凍結した文書は古い語のまま**：`docs/design.md` などは `before`／`after` のままです。正本ではない扱いなので触っていません。
