      text: |
        結論から言うと、**設計された概念式層はありません。ただし概念に相当する表現は、学習の結果として中間層に自然発生しています。** 明示的な概念層を作る試みは複数あり、多くは「無意味」というより、性能か意味の純度のどちらかを失って主流になりませんでした。

        以下は公開されている研究に基づく説明です。私自身の重みを覗いて確認したものではなく、この系統のモデル一般の話です。

        ## 設計上あるもの

        トークン → 埋め込み → 何十層もの注意機構と全結合層 → 次のトークンの確率、という構造だけです。学習目標は次トークン予測のみで、概念を置く場所は設計されていません。

        ## 自然発生しているもの

        解釈可能性研究で、次のことが分かっています。

        - **概念は、中間層の活性化空間の「方向」として存在する。** 次元数より多い概念を重ね合わせて詰め込んでいます。疎な辞書学習を使うと、解釈できる特徴量が数百万単位で取り出せます。
        - **中間層の概念は、言語にあまり依存しない。** 同じ概念は日本語でも英語でも共通の特徴量で表され、言語固有の処理は入口と出口に寄っています。つまり「概念 → 語」の対応に当たる機構は、暗黙の形で存在します。
        - **中間概念を経由した推論や、先の語を見越した計画も観測されている。**
        - **学習中には分化が起きている。** ニューラルネットは粗い区別から細かい区別へと段階的に学ぶことが、理論的にも示されています。

        ## それでも欠けているもの

        あなたの診断を、この事実に合わせて言い直すとこうなります。

        | 診断 | 実態 |
        |---|---|
        | 分化と精緻化がない | 学習中には起きるが、学習後は重みが固定される。推論時は文脈内の一時的な調整しかできない |
        | 系譜の記憶がない | そのとおり。分化の履歴はどこにも残らない |
        | 言語との対応がない | 暗黙には存在する。ただし連続的で文脈に依存し、外から番地を指定できず、同一性の基準がない |

        特に重要なのは、**概念の単位が定まっていない**点です。辞書学習では、辞書を大きくすると1つの特徴量が複数に分裂します。粒度は解析側の設定で変わるので、「これが1つの概念」と言える離散的な単位がモデルの中にあるとは言えません。曖昧な出力の原因は、細かい概念を持たないことより、どの概念を指すかを確定する工程がないことだと考えます。

        ## 明示的な概念層を作る試み

        - **概念ボトルネックモデル**: 人間が定義した概念を必ず通る層を挟む方式です。精度が下がるうえ、概念ユニットに名前以外の情報が漏れて流れることが知られています。あなたの言う「作ったが意味が無いものになる」に最も近い例です。
        - **知識グラフの統合**: 実体や関係を埋め込みとして注入する方式です。規模を大きくした素のモデルに追い抜かれました。
        - **意味解析（論理形式への変換）**: LLM以前の主流でした。網羅性の低さと壊れやすさで廃れました。
        - **文単位の埋め込み空間で予測するモデル**: 「概念」と称していますが、実体は文の埋め込みで、分化した概念の体系ではありません。
        - **離散的な潜在符号**: 符号帳の一部しか使われなくなる問題があります。

        失敗に共通する理由は3つです。

        1. 事前に決めた概念の語彙では、対象を覆いきれない。
        2. 端から端までの学習は、名前を付けた経路を迂回して情報を流してしまう。
        3. 制約を入れた分だけ、性能が落ちる。

        固定した概念体系を埋め込む方式は負け続けてきた、というのが実情です。変更が多発する前提で、系譜を持ち、外部に置かれた概念体系に接続する方式は、私の知る限り本格的には試されていません。
