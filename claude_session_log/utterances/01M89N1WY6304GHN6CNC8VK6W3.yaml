        一つ訂正があります。前の回答で「CSCL の教師を、同じ中身の自然な日本語の教師と比べていない」と書きましたが、比べてありました。E3 の結果ファイルを読み直したところ、次のとおりです（1.5B、層 8、書き替えた 24 問）。

        | 教師 | ベクトルなし | ベクトルあり |
        |---|---|---|
        | 自然な定義文＋設問（defqa） | 0.375 | 0.792 |
        | CSCL の表現＋定義文＋設問（exprdefqa） | 0.375 | 0.750 |

        CSCL の表現を教師に足しても、上がりませんでした（差は 1 問ぶんの下がり）。なので「教える材料の作り元」としての CSCL の役も、「中身が文章より良い」からではなく、「定義を一か所から作れる」という管理の側の利点だと読むのが正確です。前の回答の「2.」の見立ては、この分だけ弱めます。

        ほかの否定の文の扱い:
        - **E29「多くが型検査を通らなかった」**: 確かめた事実。結果ファイルで 24 概念のうち型検査を通ったのは 5 でした。
        - **E54「検査の結果をただ渡しても使わなかった」**: 確かめた事実（観察 o_e54a・o_e54b）。
        - **「一貫性はまだ測っていない」「モデルに読ませる言語としての強みはまだ示せていない」**: 体系を読んだ事実。一貫性を問う三つの仮説は未検証で、モデルに見せる道の仮説は mixed でした。
        - **「正本の利点は実験では測っていない」**: 体系を読んだ事実。正本の置き場の決定は、実験の観察ではなく設計として採択されています。

        どれも何かを見送る理由にはしていないので、新しい仮説は登録していません。比べが要ると思った件は、すでに E3 で測られていたので登録は要りませんでした。
