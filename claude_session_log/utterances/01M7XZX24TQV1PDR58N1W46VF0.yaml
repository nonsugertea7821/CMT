        PR の本文を英語で書いてしまっていました。すみません。#605 の本文を日本語で書き直しました。新しく立てた #606 は最初から日本語です。

        **語彙の実験（#605）**
        Draft を外したので、確認をお願いします。概念と領域を足しているため、自動マージには乗りません。
        - **h_basic_vocab_fits: 反証。** 日本語は 53 語のうち 23 語しか置けませんでした（0.434）。判定の線は 0.9 です。
          - 置けたのは、体系にすでにある動詞（部分・依存・述べる・設計する など）で書ける語だけでした。
          - 置けなかった語:
            - 為す（make・do・take）は、語義が「行う」なので v_perform と同じ式になる。
            - 所有・可能・印象は、基礎の関係で書けない。
            - 容器どうし・体の部分どうしは、互いを区別する式がない。
            - 感覚・感情・時間の単位・社会の制度の語がない。
        - **h_vocab_domain_invariant: 決まらず、未検証のまま。**
          - 英語は 0 語でした。英語に合わないからではありません。日本語と同じ式を別の領域に書くと、型検査器が one_name で「同じものの別名」として退けるためです。
          - そのため、英日の領域を並べる組み方では、この仮説は確かめられません。
          - ここから出た考え（訳語は別の領域の別のノードではなく、言語に依存する表示語）を、仮説 h_translation_by_display として登録しました（#606、登録だけ）。

        **誤りの傾向の記録（求められた分）**
        - 日本語:
          - 下書き 316 件 → 書き直しで 10 → 2 → 1 → 0。
          - 下書きは one_name が 156 件で、式のない語どうしが同じものと見なされたものが大半でした。
        - 英語: 39 → 8 → 0。最初の 39 件は、すべて日本語の領域との衝突でした。
        - 書き直しで目立った傾向（解釈）:
          - 型（生起体か持続体か）の見落とし。
          - 体系に名前のある中身を、その名前を使わずに書いてしまうこと。
          - どちらも、法則に指摘されてから既存の名前に寄せて直していました。
        - 書き直し 1〜3 は、作業中にファイルを残していませんでした。手の編集を逆にたどって復元しています。件数は、書いた時点に見たものと一致しました。

