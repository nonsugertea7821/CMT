      text: |
        そうです。ただ、対になりきってはいません。

        **対になっているところ**
        - `mod` は一つの歩みの中での限定です。「この動詞のこの位置に、この相手と一緒に来るもの」と書きます。幾何の類比でいう、静的な座標にあたります。
        - `always`・`sometime` は、歩みをまたぐ限定です。「どの歩みでも成り立つ」「ある歩みで前から後へ変わる」と書きます。不変（点、w=1）と変位（w=0）にあたります。
        - これまで時間方向の式は、動詞の `holds`・`pre`・`post` だけでした。今回、それを種類（名詞）の定義にも書けるようにした、という形です。

        **対になりきっていないところ**
        - `mod` は相手（with）との関係を書けます。新しい欄の原子は項が `self` だけなので、自分一つのことしか書けません。たとえば「ある歩みで、何かに関わるようになる」とは、まだ書けません。
        - `mod` は型検査で、端の型が合うかまで調べます。新しい欄は、基礎の関係と項の数しか調べていません。
        - 最上位の `mod`（持続体の「時間的な部分を持たない」）は、そもそも修飾の検査を通っていません。

        ですから今は、時間方向の限定は自分についての一項の文だけです。ここまでが PR #192 で足したものです。
