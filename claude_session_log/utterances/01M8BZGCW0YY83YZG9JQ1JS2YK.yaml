      text: |
        はい、その認識で合っています。

        **韻律の仮説は、まだ一つも確かめていません。** main の体系を読むと、韻律に関わる仮説は 14 本あり、すべて未検証です。

        - 日本語の道の仮説（書き言葉に韻律句が要るか、韻律が限定を運ぶか、など）
        - 一貫性は識別子・表示語・韻律句の組に頼る、という仮説（#945）
        - 今日登録した、韻律句が区画を切り出す足場になる、という仮説

        ロードマップでも、韻律の句切りの数え方を事前登録で決める段から先に進んでいません。

        **識別子化が先、という順も体系に書かれています。**

        - 日本語の道（韻律を含む）は、「表示語は式から訳した名前」という決定に依存する、と書かれています。識別子の実験はどれも、この決定の根拠に結んであります。
        - #945 は、識別子と表示語と韻律句を組で読む仮説なので、識別子が式で決まっていることが前提です。

        **識別子化の進み具合は半分です。**

        - 済んでいるのは、体系の中の側です。#981 で、名前でしか分かれない組が 0 になり、すべての識別子が式だけで分かれるようになりました。
        - まだなのは、モデルの側です。式で分かれた識別子が、モデルの中でも別々の区画に対応するかは、まだ測っていません。この区画との対応（#959 など）が、ロードマップで次の重い実験です。

        なので順としては、区画との対応を測る → 識別子が「式と区画の両方で一つに決まる」と言える → 韻律との対応（#945）、になります。韻律に入れるのは、区画の実験の後です。
