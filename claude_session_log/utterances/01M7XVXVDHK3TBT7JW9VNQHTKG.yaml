        系譜の対の仮説を、git の履歴（yaml を触った commit 331）から確かめました（#586）。結果は h_lineage_is_genus が**支持**、h_lineage_is_history が **mixed** です。途中で数え方を訂正したので、#586 は手で見ていただく PR になります。

        **結果**
        | | 名詞の付け替え（欄が先に変わった割合） | 動詞の付け替え | 率 名詞 / 動詞 |
        |---|---|---|---|
        | 元の数え | 44（0.84） | 20（すべて欄が先） | 0.071 / 0.168 |
        | 訂正後（de07f15 を除く） | 33（0.79） | 6（すべて欄が先） | 0.053 / 0.050 |

        - **訂正の理由**: 元の数えには、de07f15（類の鍵を is から extends に改名した commit）の 25 件が入っていました。これは付け替えではなく鍵の改名です。
        - 記録した結果ファイルは変えず、それを読んで数え直す別のスクリプトで訂正しました。
        - history は、元の数えでは反証、訂正後は判定の式の上では支持です。食い違うので、事前に決めたとおり mixed にしました。

        **解釈**
        - 名詞の付け替えの 8 割は、欄の変化の後に起きていました。中身が変わり、親が後を追う形です。演繹の向き（系譜 = いまの類）は時間の側でも見えています。
        - 動詞の付け替えの率は名詞とほぼ同じでした（差 0.003）。「動詞は親を固定する」という予想は、率としては出ていません。
        - ただし、親だけが単独で動いた付け替え 7 件は、すべて名詞でした。動詞では 0 件です。二つの象限の差は、率ではなく「親が単独で動けるかどうか」に出ているのかもしれません。数が少ないので、まだ仮説の段階です。

        **新しい仮説**（#587、`d_cscl_display_derived` に結んでいます）
        - **h_parent_alone_by_law**: 名詞の親が単独で動くのは、法則が変わったときだけ、という仮説です。
        - 名詞の配置は法則から演繹されるので、欄が変わらなくても、法則が変われば親が動くはずだと考えました。
        - 確かめは、その 7 件の区間で法則が変わったかを数えます。

