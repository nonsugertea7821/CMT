      text: |
        直近の PR #145（h_hierarchy_in_object）を、順を追って言い直します。

        ## 1. 何が問題だったか

        体系には、概念の上下関係（型階層）があります。たとえば「曜日 → 質 → … → 何でも」のような、上位をたどる鎖です。

        この鎖の長さ（深さ）を、体系の中の言葉で書きたい、というのが出発点でした。前の実験 sys_count_atom で「浅い端だけで定義された概念」が問題になったからです。

        ところが、上下関係は体系の中の言葉ではありませんでした。

        - 上下関係（`r_ancestor`）は、検査器の法則が裏で計算する関係です。
        - 概念の定義（限定、mod）に使える動詞や、仮説の中身に書ける語ではありません。
        - そのため「祖先を3つ以上持つ概念」という概念を、定義として書けませんでした。

        これが「欠け1」です。体系について語る言葉（メタ言語）にはあるのに、体系の中で使う言葉（対象言語）にはない、という状態です。

        ## 2. 何をしたか

        上下関係を、体系の中の言葉に持ち込みました。

        1. **基礎の関係 `above`（上位である）を足した。** 基礎の関係は、在る・依存する・部分である、などと並ぶ一番下の語彙です。
        2. **動詞 `v_above`（上位に持つ）を足した。** `above` を使って意味を定めた動詞です。
        3. **ノード `deep_kind`（上位を3つ以上持つ種類）を足した。** 定義は「上位に持つ、の始点で、相手が3つより多い」です。これで深さを、ふつうの概念と同じ書き方で定義できます。
        4. **橋渡しの法則を二つ足した。**
           - 検査器が計算した上下関係（`r_ancestor`）を、`above` に写す。
           - `above` を3つより多く持つ概念は、`deep_kind` の定義（限定）を満たしている、とする。

        ## 3. 何を測ったか

        - **書けるか**: 型検査と exp の検査が誤りなく通るか。
        - **合っているか**: 法則で「深い」とされた概念と、スクリプトが祖先を直接数えて「深い」とした概念が一致するか。
        - **壊さないか**: 違反の組（「この概念は、あの概念の下にあるべきなのに、ない」という検査の指摘）が増えないか。

        事前に決めた判定は、「書けて、合っていて、違反が増えなければ支持。違反が増えれば反証」です。

        ## 4. 途中の失敗（訂正）

        最初は、`above` を動詞の定義にだけ使い、法則では検査器の上下関係を直接数えていました。すると型検査が止まりました。体系には「基礎の関係は、必ずどこかの法則で使われていなければならない」という決まりがあるためです。

        そこで、上下関係を `above` に写す法則を足し、深さは `above` を数えるように直しました。直す前に、この訂正を手順に書き足して commit し、それから測り直しました（after2）。

        ## 5. 結果

        - 誤りは 0 で、深い概念は法則でもスクリプトでも 495 個と一致しました。
        - 違反の組は増えませんでした（3 のまま）。
        - 決めた判定どおり、支持です。

        ## 6. 予想と違ったところ（ここが一番大事です）

        私の予想は反証でした。理由は形式概念分析（FCA）からの類比です。

        - 上下関係（順序）を、概念の性質（属性）として書くと、その属性で概念が並べ替えられてしまう、と予想しました。
        - 体系でいえば、深い概念 495 個がみな「`deep_kind` の性質を持つのに、`deep_kind` の下にいない」状態になります。違反として大量に出るはずでした。

        実際には出ませんでした。理由を調べたところ、違反の検査は「近く」しか見ていませんでした。

        - 比べる候補は「自分の上位の下にいて、互いに上下でない概念」、つまり親戚どうしだけです。
        - `deep_kind` を候補として見る概念は、1つしかありませんでした。

        登録していない追加の確認として数えると、`deep_kind` の性質を満たすのにその下にいない概念は 495 個ありました。並べ替えの圧力自体はあって、検査の視野に入っていないだけです。

        ですから、この支持は「今の違反の検査のもとでは、深さを書いても分類を乱さない」という意味に限られます。「上下関係を性質として書いても無害だ」とまでは言えません。

        ## 7. ほかの限界

        深さの法則は「3つ以上」という一つの閾値にしか使えません。法則の中に書いた数は固定で、定義の側に書いた数を読み取れないためです。閾値を変えるなら、そのたびに法則が要ります。

        ---

        前の PR #144（個体の深さ）も説明が要るなら言ってください。
