      text: |
        自己記述を最後まで書き切りました。記録に使われる項目・値・入れ子の項目は、すべて体系のノードに結びついています。検査は通っており、プッシュ済みです。

        ## 曖昧だった4か所と、その解消

        ### 1. 仮説の状態

        状態を人が書くのをやめました。根拠の観察から機械的に決まり、書かれた値と食い違うと検査が失敗します。

        | 根拠 | 状態 |
        |---|---|
        | 支持する観察だけがある | 支持されている |
        | 反する観察だけがある | 反証されている |
        | 両方がある | 支持と反証の両方がある |
        | どちらもない | 未検証 |

        決め直した結果、仮説 34個は、支持 26、両方 3、未検証 5 になりました。

        「部分的に支持」と「測ったが決められない」は廃止しました。前者を「根拠が弱い」という意味でも使っていたのが、曖昧さの元でした。

        ### 2. 根拠の弱さ

        弱さの理由は、状態とは別の項目（留保）として、体系に書かれた 6種類から選ぶ形にしました。

        | 留保 | 式 |
        |---|---|
        | 結果を見たあとで分類した | 留保のうち、観察の後ろに置かれたもの |
        | 測った範囲が限られる | 留保のうち、要因について述べるもの |
        | 差が1問以内 | 留保のうち、設問1個について述べるもの |
        | 学習が収束していない | 留保のうち、学習の損失について述べるもの |
        | 1例だけ | 留保のうち、観察1個について述べるもの |
        | 数値化していない | 留保のうち、測定値について述べないもの |

        仮説 9個に留保が付いています。「差が1問以内」は、検査が実際の差を問数に直して確かめます。

        ### 3. 測定値の定義の細部

        「結果ファイルの部分」と粗く書いていた項目を、それぞれ別のノードに結びつけました。

        | 項目 | 当たるもの |
        |---|---|
        | file | 結果ファイル |
        | at | 行の集まり（結果ファイルの部分で、結果の行を複数持つもの） |
        | where、keyset | 結果の行を限定する（修飾） |
        | cond | 条件ごとの記録（結果の行の部分で、判定について述べるもの） |
        | axes | 測定値を分ける軸と値（分類） |
        | stats | 指標のノード |
        | meaning | 測定値が述べるノード。入れ子の項目も体系に書いた |

        測定値の族そのものが、体系の3つの仕組みで書かれていたことが分かります。行の絞り込みは修飾、パラメータの組み合わせは分類でした。

        ### 4. 観察の比較、許容幅、識別子

        - **比較**: 使える比べ方（より大きい、より小さい、ほぼ等しい など）を体系に列挙し、もとになる状態の関係を「後ろにある」としました。
        - **許容幅**: 大きさのうち、観察に依存するもの。
        - **識別子**: 情報のうち、体系制御言語で書かれ、概念式1個について述べるもの。記録の鍵は、すべて識別子です。

        ## 検査

        わざと入れた6種類の誤りは、すべて検出されます。

        | 入れた誤り | 検出 |
        |---|---|
        | 状態が、根拠と食い違う | 根拠からは別の状態になる |
        | 体系にない留保 | 書かれていない |
        | 「差が1問以内」と書いたが、実際の差はそれより大きい | 差が1問以内の観察がない |
        | 体系にない比べ方 | 書かれていない |
        | 測定条件の意味に、体系にない項目 | 書かれていない |
        | 状態の決まり方が欠けている | すべての値について書くこと |

        ## 作業中に見つけて直した、検査の不具合

        - **状態の決まり方が欠けているとき、エラーを出さずに異常終了していました。** エラーとして報告するように直しました。
        - **「差が1問以内」の確認が甘すぎました。** 「等しい」と述べる観察は差が 0 なので、どの仮説でもこの留保が通ってしまっていました。大小を述べる観察だけを対象にするよう直しています。

        ## まだ人の判断に残っているもの

        機械的に決まらない箇所が2つあります。曖昧さとして残っている、という意味で報告します。

        - **決定の状態**（採用済み、暫定、取り下げ）: 人が選ぶもので、何かから導かれるわけではありません。値の種類は体系に書いてあります。
        - **留保のうち5種類**: 「差が1問以内」以外は、検査が中身を確かめていません。種類は固定されていますが、付けるかどうかは私の判断です。

        現在の規模は、ノード 255、観察 63、仮説 34、決定 17 です。
