      text: "ジャンル別に調べました。結論から言うと、「形式言語の体系を LLM につなぐ」研究は大きく4つの系統に分かれます。CSCL の位置づけに効く含意があります。\n\n**1. 形式の体系を文章にして渡す（verbalisation）**\n- OWL の公理を文章にしてプロンプトに入れると、回答の質が上がる、という報告があります。Pizza Ontology で試した CEUR 2025 の論文です。\n- OWL を文章にする手法のサーベイ（2025 年の修士論文、23本）もあります。\n- **含意:** この研究の「体系から生成した文章で渡す」（`text_injection`、`d_rendered_text_is_derived`）は、この系統の主流と同じです。ここに新規性はありません。強い基準線として扱うべきです。私たちの `h_cscl_raises_following` が「混在」なのは、この系統の結果と比べる価値があります。\n\n**2. 形式の構造を埋め込みにして内部に入れる**\n- KnowLA: KG の実体の埋め込みを、層の間のアダプタで隠れ状態に混ぜます。\n- GraphToken を KG に広げた研究: KG の埋め込みをトークンにして入力に足します。LLM は凍結したままです。\n- オントロジー埋め込みのサーベイもあります（Chen ほか、TKDE 2025）。\n- **含意:** 概念ベクトルの路線は、この系統に入ります。ただし検索の範囲では、次の2点を測った研究は見つかりませんでした。\n  - 注入した知識が、モデルが元から持つ知識と衝突したときにどうなるか。\n  - 同じ対象への答えが、問い方をまたいで一致するか。\n  \n  これは、この研究の新規性の主張（元の意味との衝突、用法をまたいだ一貫性）が、まだ空いている場所にあることを示します。もう一つの差は、対象の性質です。この系統は**実体と事実**（外延）を入れます。この研究は**式で定義した概念**（内包）を入れます。\n\n**3. 自然言語を形式言語に直させる（autoformalization: NL → Lean / CycL / SMT）**\n- 向きが逆の系統です。主な課題は「構文は正しいが、意図と違うものを証明してしまう」ことだと報告されています（IJCAI 2026）。\n- 「型検査で autoformalization を改善する」という題の論文もあります（題名のみ確認）。\n- **含意:**\n  - 未検証の `h_model_can_write_cscl`（モデルは CSCL を書ける）に直結します。\n  - E11 では、モデルに CSCL を書かせると、直接答えるより下がりました（`o_e11_write_below_direct_conflict`）。これは「意図と違うものを書く」問題と同じ形に見えます。\n  - そうだとすると、型検査器の誤りを返して書き直させれば上がる、という仮説が立ちます。CSCL には検査器があるので、すぐ試せる位置にあります。\n\n**4. ハイブリッド論（Lenat & Marcus 2023）**\n- 信頼できる AI には、LLM と形式的な体系（Cyc）の混成が要る、という主張です。LLM に自然言語を CycL へ訳させてつなぐ案も出ています（二次情報）。\n- 弱点として、Cyc の知識ベースは深さと広さが足りず、しかも非公開だと書いています。\n- **含意:** `d_source_of_truth_in_cscl`（正本は CSCL）と同じ立場です。この研究の答え方は、知識を手作業で全部書くのではなく、再定義したい概念だけを体系に書いて注入する、というものです。Cyc の規模の問題を避ける位置づけとして書けます。\n\n**まとめ（新規性の候補）**\n次の組み合わせは、今回の検索の範囲では見つかりませんでした。\n1. 型検査された概念体系を正本にする。\n2. 概念を内包（式）で定義する。\n3. それを隠れ状態に注入する。\n4. 元の意味との衝突と、用法をまたいだ一貫性で測る。\n\nただし、これは検索の範囲で見つからなかったというだけです。網羅的に調べたとは言えません。\n\n**提案**\n- 先行研究の個体にする候補: Lenat & Marcus 2023、KnowLA、GraphToken の KG 版、ontology 公理をプロンプトに入れる CEUR 論文、type checking による autoformalization、CoLLEGe、Cartridges。\n- 新しい仮説の候補: 「型検査器の誤りを返すと、モデルの書く CSCL が上がる」。\n\nまず、各論文の要旨を確かめて主張を書き写すところから進めますか。\n\nSources:\n- [Getting from Generative AI to Trustworthy AI: What LLMs might learn from Cyc (arXiv:2308.04445)](https://arxiv.org/pdf/2308.04445)\n- [Beyond Statistical Parroting: Hard-Coding Truth into LLMs via Ontologies (CEUR)](https://ceur-ws.org/Vol-4079/paper10.pdf)\n- [Verbalisation Techniques of Ontologies for Use with LLMs (TU Wien)](https://repositum.tuwien.at/bitstream/20.500.12708/221741/1/Ganellari%20Artjola%20-%202025%20-%20Verbalisation%20techniques%20for%20ontologies.pdf)\n- [Ontology embedding survey (Chen et al., TKDE 2025)](https://arxiv.org/pdf/2406.10964)\n- [KnowLA (arXiv:2403.14950)](https://arxiv.org/pdf/2403.14950v1.pdf)\n- [Injecting Knowledge Graphs (arXiv:2505.07554)](https://arxiv.org/html/2505.07554v1)\n- [Verifiable PDE Reasoning and Modeling with Neurosymbolics (IJCAI 2026)](https://ijcai.org/proceedings/2026/903)\n- [Towards a Common Framework for Autoformalization (arXiv:2509.09810)](https://arxiv.org/pdf/2509.09810)\n- [NeurOWL (arXiv:2607.15776)](https://arxiv.org/pdf/2607.15776)\n- [Do General NLP Embeddings Capture Ontological Reasoning? (arXiv:2609.00177)](https://arxiv.org/pdf/2609.00177)\n"
