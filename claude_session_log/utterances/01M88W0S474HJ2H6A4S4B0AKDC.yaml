        2. Key Technical Concepts

        - **Midpoint membership:** G_rate on 120 words (Qwen2.5-1.5B).
          - Conditions: orig / swap / mixed (240 words), each centered.
          - lift = ((G(swap, x) − G(swap, base)) + (G(mixed, x) − G(mixed, base))) / 2.
        - **Bands:** top = the 256 highest-std dims; low = the rest.
          - a0 = sqrt(Σvar_low / Σvar_top), equal to 0.611 at L8.
          - Scaling: X[:, top] *= a0·f/100.
        - **Results chain**
          - #812 (eq): lift 0.057. Low: 0.111.
          - #815 (noise): refuted.
          - #822 (L8, f = 100/70/50/35/25/10/0): lift 0.057 / 0.071 / 0.100 / 0.118 / 0.118 / 0.107 / 0.111. Supported, merged.
