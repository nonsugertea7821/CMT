        E28（#18：前に並ぶ定義で追従が下がるのは、その定義へ届く注意を通るからか）は、事前に決めた規則では「注意が原因」と判定されました。ただし閾値ちょうどで、支持は弱いです。PR #292 の Draft を外したので、自動マージに乗る見込みです。

        **結果（Qwen3-4B、再定義・衝突の 24 問）**

        | 条件 | 正答率 |
        |---|---|
        | 関係する定義を先頭に置く | 0.708 |
        | 末尾に置く | 0.542 |
        | 末尾で、前の定義への注意を全部塞ぐ | 0.625 |
        | 末尾で、関係する定義の位置からだけ塞ぐ | 0.583 |
        | 末尾で、設問の位置からだけ塞ぐ | 0.417 |
        | 対照：先頭に置き、後の定義への注意を塞ぐ | 0.625 |

        - 先頭と末尾の差は 0.167 で、E7 と同じ値が出ました。
        - 全部塞いで戻ったのは 0.083（2問ぶん）で、判定に使う「差の半分」とちょうど同じでした。浮動小数の比較で等号の側に落ちたことは PR に書いてあります。
        - 塞ぐと、問ごとに正誤が両向きに大きく入れ替わります。差し引きで残ったのが +2 問です。1問違えば「原因ではない」の判定でした。

        **読み取れること**
        - 対照でも、後に並ぶ無関係な定義への注意を塞ぐと正答率が下がりました。無関係な定義も、前にあるか後にあるかを問わず、答えに効いているようです。
        - 設問の位置からだけ塞ぐと下がり、関係する定義の位置からだけ塞ぐと少し上がりました。前の定義が混ざって害になるのは、設問を読み出すときより、関係する定義を読み込むときのほう、という向きに見えます。ただ、事前に決めた閾値には届いていません。
        - この向きを仮説として登録するには、「定義の読み込み」を表す概念が体系にまだありません。そのため、今回は登録していません。

        **片付け**
        - E28 は終わったので、keep-alive の連鎖は止めました。
