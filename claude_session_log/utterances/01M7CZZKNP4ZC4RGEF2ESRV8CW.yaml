      text: |
        分類を加えたところ、内容が落ちていた 28個のうち 14個が書けました。値に関数を含めるという指摘も取り込んであります。

        ## 結果

        | 項目 | 分類なし（前回） | 分類あり（今回） |
        |---|---|---|
        | 概念の数 | 176 | 187 |
        | 内容が落ちた、または無理のあるもの | 28（16%） | 14（7%） |
        | 表示語だけの値 | 0 | 0 |

        分類で書けるようになったものは、次のとおりです。

        | 原因 | 件数 | 書き方 |
        |---|---|---|
        | 数と個数 | 4 | 「重みを部分に持つ（個数＝15億）」 |
        | 選択肢の中身 | 4 | 「選択肢のうち、文字列が『はい』であるもの」 |
        | 2つの判定の比較 | 2 | 「定義による判定と、元の意味による判定が、真偽の軸の上で違う」 |
        | 隣り合うこと | 2 | 「設問の前に置かれる（順番の差＝1）」 |
        | 順序を入れ替えた2回 | 1 | 「判定を部分に持つ（個数＝2）」 |
        | 暦の計算 | 1 | 順番の軸の値として扱える |

        実験の主題である「衝突する事例」が、ようやく書けました。

        ```
        衝突する事例   = 事例のうち、定義による判定と元の意味による判定が、真偽の軸の上で違うもの
        衝突しない事例 = 事例のうち、その2つが同じもの
        ```

        ## 関数としての値

        指摘を受けて、値を「固定値、または関数」としました。真偽を返す範囲の判定式（1より多い、25未満、9から13の間）を、値として置けます。「複数」を文字列でごまかしていた 4か所は、関数の値に直しました。

        これは実験の結果とつながります。再定義を2つの型に分けたとき、概念ベクトルは付け替え型では 12概念中 11概念で成功し、規則型では 7概念にとどまりました。この体系の言葉で言い直すと、次のようになります。

        - **付け替え型**: 軸の値が固定値（または固定値の集合）である再定義。
        - **規則型**: 軸の値が関数（範囲の判定式）である再定義。

        足し込むだけのベクトルが、固定値は運べても関数は運びにくい、というのは筋が通ります。以前は「数値や暦で決まる」という見かけで分類していましたが、値の種類の違いとして書けるようになりました。

        ## 検査が見つけた、私の誤り

        「個数」を「部分である」を抽象にした軸、と置いたところ、検査が 5か所を拒否しました。「依存する相手が1つ」「関わる層が1つ」のように、部分以外の関係にも個数を付けていたためです。

        個数は特定の関係の軸ではなく、どの関係についても「いくつと結ばれるか」を見られる軸でした。対して順番は「後ろにある」に固有の軸です。以前に関係の性質として置いた「相手は1つに決まる／替わってよい」も、同じ個数の軸の値だったことになります。

        ## 残った 14個

        | 原因 | 件数 | 例 |
        |---|---|---|
        | 役割の中身 | 4 | 正本、変更の固定先、要因、指標 |
        | 動詞の産物 | 3 | 教示（概念ベクトルという産物）、教えた使い方 |
        | 概念式の中での位置 | 2 | 修飾、上位概念 |
        | その他 | 5 | 様態（見る／読む）、兄弟であること、発話者、中身を除いた形式、永続することと型 |

        ## 読み取れること

        - **分類は、関係と修飾に還元できない第3の仕組みでした。** 関係と修飾だけでは具体を置けず、2つのものを比べることもできません。3つが揃って、はじめて語彙の 93% が書けています。
        - **残りは、分類では解けない種類の問題です。** 役割は「何であるか」ではなく「何として働くか」を指します。動詞の産物は、第三のものの位置を修飾でうまく使えていないことによります。概念式の中での位置は、体系が自分自身を指す箇所です。

        ## 次の手

        残り 14個のうち、役割（4個）と動詞の産物（3個）が半分を占めます。動詞の産物は、第三のものの位置を修飾で使う書き方を整えれば解けるはずです。役割は、質との関係（質が役割を担う、とは何か）の整理が要ります。次はこの2つを調べます。

        記録は `spec/trial/full4.yaml` に置きました。正本はまだ切り替えていません。
