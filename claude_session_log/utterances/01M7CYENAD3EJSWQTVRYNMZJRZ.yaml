      text: |
        試験の結果は、その指摘と合っていました。修飾語は BFO のツリーの外に第3の木を持つのではなく、持続か生起の語根から作られるものとして、ツリーの中に入ります。

        ## 候補2の試験結果

        候補2は「次元は3つだが、原始的な最上位を持つのは持続と生起だけ。修飾の次元の住人は、すべて持続か生起の語根から作られる」というものです。

        ### 修飾語的な値 40種類の語根

        | 語根 | 種類 |
        |---|---|
        | 動詞（生起）の語根から作れる | 34 |
        | 名詞（持続）の語根から作れる | 4 |
        | 数量詞 | 2 |

        「固定されている」は「固定する」から、「見えない」は「見える」から、「学習に使った」は「使う」から作れます。修飾の次元は実在しますが、それ自身の原始概念を必要としませんでした。「原始的なのは持続と生起だけ」と「修飾は第3の次元」は、両立します。

        ### 語根と補語のほかに必要だったもの

        | 必要なもの | 件数 | 置き場所 |
        |---|---|---|
        | 否定 | 8 | 述語論理の結合子 |
        | 数量化 | 4 | 述語論理の結合子 |
        | 受け身 | 4 | 関係のどちらの端を開けるかの選択 |
        | 可能（〜できる） | 4 | 試験の時点では不明 |

        「可能」だけが宙に浮いていましたが、いただいた指摘で置き場所が見つかりました。BFO には傾向性（実現されうる性質）があります。「触れられる」「見える」は、傾向性そのものです。同じ読み方で、「固定されている」は質、「動かす条件／測る量」は役割に当たります。修飾語は、BFO の依存する持続体（質・傾向性・役割）の枝に入ります。

        ### 次元をまたぐ使われ方

        いまの語彙で、ある次元のものが別の次元のものを作るのに使われた回数です。

        | 使われる側 ＼ 作られる側 | 持続へ | 生起へ | 修飾へ |
        |---|---|---|---|
        | **持続から** | 93 | 85 | 122 |
        | **生起から** | 62 | 84 | 253 |
        | **修飾から** | 166 | 47 | 51 |

        9マスすべてに使用例があります。対角以外で多い流れは、次の順です。

        1. 生起 → 修飾（253）：関係が、修飾語の動詞の部分になる。
        2. 修飾 → 持続（166）：修飾語を、持続の概念に当てる。
        3. 持続 → 修飾（122）：持続の概念が、修飾語の中身になる。
        4. 持続 → 生起（85）：持続の概念が、関係の端になる。
        5. 生起 → 持続（62）：関係を名詞として見て、軸にする。
        6. 修飾 → 生起（47）：修飾語を、生起の概念に当てる。

        ## 読み取れること

        - **修飾は、持続にも生起にも当たります**（166回と 47回）。候補1の誤りはここでした。
        - **主な流れは、やはり一巡です。** 持続が関係の端になり、関係が修飾語になり、修飾語が概念に当たる。候補1の一巡は主流としては合っていて、行き先が持続だけでない点が違っていました。
        - **「3次元」の意味を言い直せます。** 修飾は、ツリーの上の置き場所の違いではなく、同じツリーの実体を「何かを限定するもの」として使う、という使い方の向きです。置き場所は BFO のツリーの中、使い方が第3の次元、という関係だと理解しました。

        ## まだ決まっていないこと

        - **数と数量詞の置き場所。** 数が修飾語の中身になる例が4回、数量詞が2種類あります。質の大きさとして持続の枝に置けそうですが、確かめていません。
        - **関係・分類・修飾という3つの操作が、6方向の流れのどれに当たるか。** 一巡の3つの流れに対応する可能性がありますが、確定していません。

        判定のうち、値の品詞と語根の対応づけは私の手作業です。記録は `spec/trial/candidate2.yaml` と `spec/trial/modifier_roots.yaml` に置きました。

        次は、候補2に沿って語彙そのものを組み直します。表示語だけだった値を、語根から作った実体に置き換え、修飾語を BFO の依存する持続体の枝に入れます。その前に、止まっていた実験結果（E8、E9）の記録を済ませます。
