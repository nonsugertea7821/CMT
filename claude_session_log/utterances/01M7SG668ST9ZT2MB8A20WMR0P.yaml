      text: |
        半分はその通りだと思います。ただ、向きで分けると、もう少し細かく言えます。

        **点は無限、書き方は有限**
        - 単純な規則で式をいくらでも作れるなら、式の空間は無限です。
        - それでも、空間と尺度が決まっていれば、一つの点の書き方は有限の長さで、一つに決められます。数の書き方と同じで、数は無限にあっても、数字と位取りの規則は有限です。
        - 書き方が何通りにも分かれるのは、同じ点を指す別の式（同値な式）があるときだけです。型検査の「動詞の式が同じ」は、この重なりを見つけて止める役をしています。

        **式 → 自然言語：組み立てなら全部に届く**
        - どんな式も、一番下の辞書（基礎の関係・位置・つなぎ）と文法の規則で、言い換えの文にできます。数を「三百二十一」と読み上げられるのと同じです。
        - これはすべての式に使えますが、長くなります。

        **語 → 式：語があるのは一部の点だけ**
        - 「計算する」のような語は有限個で、式の空間の一部の点にしか付いていません。数で言えば「ダース」や「百」のような、特別に名前が付いた点です。
        - ですから語の対応は、語ごとに式を一つ与える向き（語 → 式）でしか全体を決められません。式の側から見ると、ほとんどの点には語がありません。
        - どの点に語が付くかは、体系の中からは決まりません。言語の使われ方の歴史で決まります。ここを外から確かめる先がコーパスだ、というのが前の話とつながります。

        **まとめ**
        - 式 → 言い換え文は、規則で全部に届きます（長い）。
        - 語 → 式は、有限の語の側からしか決まりません（短い）。
        - 自然な翻訳は、言い換え文の一部を、語がある点で短く置き換えたもの、と考えています。

        一つ残る問いは、空間そのものが固定されているかどうかです。式を広げる規則が新しい修飾の次元を作れるなら、空間の次元も増えていきます。その場合、「書き方が一つに決まる」が、広げたあとも保たれるかは別に確かめる必要があります。
