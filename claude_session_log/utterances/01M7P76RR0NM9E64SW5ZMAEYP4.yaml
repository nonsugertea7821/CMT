          - r_acc: accumulated formulas.
          - r_own: own formulas. Includes mod, axis, from/to, new_kind, val, cmp.
          - r_has: formulas held, including by entailment.
          - r_entail, r_parent, r_ancestor, r_concept, r_candidate.
        - Formula facts: of (verb), position, with, at, neg, quant.

        **Laws**
        - Law `single` restricts each node to one mod. Axis and verb ends are separate and not covered by single.
        - Grammar sections in syntax.yaml: `axes: [display, source, value, extends]`, `domain: [domain, axes, nodes, individuals, facts]`.
        - law_rule entries are pure data in syntax.yaml. Relations used in laws must be base, node short names, or law_relation individuals.

