        二つの実験は、どちらも反証でした。結果は体系に記録し、#224 と #227 の Draft を外しました。マージをお願いします。どちらも自動マージには乗らず、手で見てもらう扱いです。

        **h_plural_from（#224）: 反証**
        - 読みの式 311 個で、始点を並びにしたものと終点を並びにしたもので、検査の結果が違った式は 175 個ありました。
        - 始点の並びは 307 個が型検査器で弾かれました。理由はすべて「関係 s の事実が2つ以上ある」です。
        - 終点の並びは、型検査器では一つも弾かれませんでした。弾かれた 132 個は観察の式だけで、止めたのは観察を読む ec です。
        - 型検査器は終点の数を絞っていないので、many は始点と終点を同じようには決めていません。終点の並びは、文法ではなく ec が観察についてだけ止めています。
        - この実験は #223 の実験と同時に走ったので、実行時間は比べる値に使っていません。PR の本文にもそう書きました。

        **h_given_laws_as_rules（#227）: 反証**
        - 実行時に確かめている法則は5つです。そのうち4つは、1つの状態の事実だけでは確かめられないものを読んでいました。
          - step と frame は、動詞の前と後の状態を読みます。
          - halt は、実行の記録と、当てはまる動詞があるかを読みます。
          - no_confusion は、種類の木を読みます。
        - 残る unique_names も、規則として書かれてはいません。名前の照合に組み込まれた基本の語です。
        - いまの当てはめ方（1つの状態の事実に規則を当てる）では、法則を規則として書けないということです。
        - 実験は #224 が終わってから一つだけ走らせ、0.07 秒で終わりました。

        #224 と #227 は同じファイルの近い場所に書き足しています。書き足す位置は分けましたが、後からマージする方で衝突が出たら直します。

