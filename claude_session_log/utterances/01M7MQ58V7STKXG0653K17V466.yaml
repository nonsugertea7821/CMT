      text: |
        使えます。ただし、観察が根拠として支える法則は「σ 対称性」そのものではありません。「述べていない文の真偽は、宣言した世界から読む」という法則です。σ 対称性は、その帰結として出てきます。理由を順に書きます。

        ## 観察：検査をすり抜けた変異 6 件
        振る舞いを変えたのに、実行の記録の検査が通った変異は 28 件中 6 件です。

        | 変異 | 変えた所 | σ の確かめで見つかるか |
        |---|---|---|
        | m002 | 閉世界が述べていない文に与える値を「偽」から「真」へ | 見つかる |
        | m003 | 開世界（world）が述べていない文に与える値を「なし」から「偽」へ | 見つかる |
        | m052 | 「偽を与える世界では真偽を決めない」に変える | 見つかる |
        | m032 | 開世界の「決められない」を「偽」に変える | **見つからない** |
        | m024 | pre の判定の all と any を入れ替える | 見つからない |
        | m041 | new の種類の確かめを弱める | 見つからない |

        上の 4 件は、どれも「述べていない文に、世界がどんな真偽を与えるか」を変えています。σ の確かめが見つけるのは 3 件だけです。m032 は「決められない」を「偽」にする変更で、真偽を入れ替えても形が変わらないので、σ では見えません。

        ## ここから導ける法則
        - 4 件がすり抜ける理由は共通しています。runtime.py が、世界の意味を自分の中の表 `WORLDS` に書き写して持っているからです。
        - 体系の側には、すでに宣言があります。syntax の `closed_world` は `val: {truth: false}` を持ち、`world` は val を持ちません。実装はこの宣言を読んでいないので、写しが宣言とずれても、どの検査も気づきません。
        - そこで、次の法則を立てられます。

          **述べていない文に runtime が与える真偽は、領域が前提に置く世界の `val` である。`val` がなければ、真偽を与えない。**

          この法則があれば、4 件はすべて宣言と食い違うので見つかります。σ の確かめより 1 件多く見つかります。
        - σ 対称性はこの法則から出てきます。σ の像である鏡の世界を `val: {truth: true}` で宣言すれば、この法則がそのまま、読み方が σ で入れ替わることを保証します。つまり σ 対称性は、法則を立てる理由ではありません。法則が守られているかを確かめる手段の 1 つです。

        ## 別の欠け（σ とは関係ない）
        m024 と m041 は、世界とは関係ありません。どちらも、実行の記録が 1 件しかなく、試していない場所です。こちらが示すのは、法則の不足ではなく、実行の記録の範囲の不足です。

        ## 弱さ
        - 実行の記録は 1 件だけで、変異は 1 種類の作り方（構文木の 1 か所を変える）だけです。
        - 6 件という数は、この 2 つの条件に依存しています。

        ## 進め方の案
        1. この観察（すり抜けた 6 件、そのうち世界の意味に関わる 4 件、σ で見える 3 件）を記録する。
        2. それを根拠に、法則「世界の真偽は宣言から読む」を決定として置く。
        3. runtime.py の `WORLDS` を消し、世界の `val` を読む実装に変える。
        4. 同じ変異の手順で測り直し、すり抜けが減ることを確かめる。ただし `WORLDS` がなくなると、変異の箇所そのものが変わる点に注意が要ります。

        この順で進めますか。
