      text: |
        h_case_frame_by_relation は反証になりました（PR #171）。そこから出た次の仮説 h_case_frame_by_role を、PR #172 で登録しています。どちらも自動マージに乗るはずです。

        **結果**
        「格の枠は、動詞の基礎の関係の種類で決まる」と予想しましたが、関係の種類からの予測は 0.49 しか当たらず、表示語の形からの予測（0.63）を下回りました。ただし、関係ごとに見ると次の差がありました。
        - **よく決まる関係:** after と part です。「後ろ」「前」「部分」のように、位置や部分を表す動詞はほぼ「の」を取りました。
        - **散る関係:** refer、depend、involve は広すぎます。この下に、格の違う語彙が混ざっています。たとえば「一致する（と）」「住む（に）」「契約を結ぶ（と）」「雇用する（を）」です。
        - **既定の枠:** holds を持たない動詞は、ほとんど「を」でした。式が何も言わないときの既定として「を」を取る、と読めます。

        **次の仮説**
        格の枠は、相手の端が果たす役割（場所・相手・話題・基準）で決まる、という予想です。ここまでの三つの結果をつなぐと、こう読めます。
        - 格の区別は、今は表示語の中にある。
        - 式の側に移すには、refer・depend・involve を、端の役割で細かく分ける必要がある。

        これを確かめるには、動詞の端に役割を式で付けることになります。概念を足す変更なので、ユーザーに PR で見てもらう形で進めます。
