        #799 の判定は反証です。値のばらつきが大きい上位 16 次元を 0 にしても、書き替えた語の中点の帰属は上がりませんでした。CI が通ったら Draft を外します。

        測りは Qwen2.5-1.5B の L8 で、120 語です。数字は G_rate（類の語の中点が成員に落ちる割合）です。

        | 読み方 | 元の語 | 書き替えた語 | 混ぜた語 |
        |---|---|---|---|
        | そのまま | 0.779 | 0.229 | 0.436 |
        | ばらつき上位 16 次元を 0 にする | 0.764 | 0.229 | 0.400 |
        | ほかの次元から 16 個を無作為に 0 にする（20 回の平均） | 0.778 | 0.230 | 0.425 |

        - **判定:** 上がりは −0.018 で、事前に決めた線（0.03 未満なら反証）を下回りました。
        - **上位 16 次元の大きさ:** 中心化した分散の 11% を占め、標準偏差は中央値の 5.5〜8.6 倍です。値が桁違いに大きい次元（#788）と重なるのは、1 つだけでした。
        - **ほかの層:** L14 と L20 では、0 にすると元の語と混ぜた語が少し上がりました。書き替えた語は、どの層でも上がっていません。

        結果は 91b3eb6 で push 済みです。

        ここからの読み（未検証）です。#788 では、次元ごとに標準偏差で割ると上がりました（書き替えた語で 0.229 → 0.314）。少数の次元を消しても上がらないので、効いているのは多くの次元のばらつきを揃えることではないか、と考えています。
        - これを仮説 `h_midpoint_by_spread_profile` として、PR #800 で登録しました（登録だけなので、自動マージに乗る見込みです）。
        - 確かめ方の案は、標準偏差で割る範囲を上位 k 次元に限り、k を 16 から全部まで変えることです。

        ほかに、#791 がマージされたので、その作業フォルダとローカルのブランチを消しました。

        登録したのは `h_midpoint_by_spread_profile` だけです。「書き替えた語はどの読み方でも戻らない」は、試した 3 つの読み方の中での事実なので、登録していません。

        ロードマップの位置: d_road_region（#376）。書き替えた語の区画を、隠れ状態の次元の重み付けの側から探っています。
