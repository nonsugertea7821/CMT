        E65（PR #888）の結果は、事前登録の判定で**支持**です。E65 は、E64 で学習したベクトルの代わりに、同じ大きさの乱数の向きを足して apply（当てはめ）を測る対照の実験です。

        | | apply | para | explain | recite | joint |
        |---|---|---|---|---|---|
        | ベクトルなし | 0.583 | 0.958 | 0.833 | 0.958 | 0.458 |
        | 学習した向き（E64） | 0.833 | 0.958 | 1.000 | 0.958 | 0.750 |
        | 乱数の向き（E65） | 0.417 | 0.875 | 0.625 | 0.958 | 0.250 |

        - **判定:** apply の上がりは、学習した向きが +0.25、乱数の向きが −0.167 で、差は 0.417 です。支持の基準（0.083）を超えました。
        - **前提:** 乱数の向きでの para と recite の正答率は、どちらも 0.875 以上という前提でした。para はちょうど 0.875 で、ぎりぎり満たしました。
