      text: |
        h_concept_kind_excludes_verb と h_concept_kind_frame_free を、同じ手順で対で確かめました。excludes_verb は支持、frame_free は反証です。PR #406 は Draft を外してあります。測り方の訂正を含むので、自動マージには乗らず、手で見てもらう PR になります。

        **何を試したか**
        - 法則 concept_kind（何を「概念」とするかを決める法則）を、写しの上で二通りに変えました。
          - E: 上位をたどって動詞と分かるものは、概念から外す。
          - N: 概念かどうかを決めるときに、枠（pre・holds）を読まない。
        - それぞれに冗長な枠を足した版も作り、足す前と後で導いた関係が変わるかを見ました。

        **結果**

        | 版 | 型検査の誤り | ec | 動詞と概念の両方に入る項 | 枠を足しても関係が変わらない |
        |---|---|---|---|---|
        | 今のまま | 0 | 通る | 67 | いいえ |
        | E | 0 | 通る | 0 | はい |
        | N | 937 | 落ちる | 119 | はい |

        - N の誤りの多くは one_name（同じものの別名を禁じる法則）でした。動詞が概念に入ると、概念どうしを比べる法則が動詞の組にもかかります。

        **訂正の開示**
        - 最初の測りでは、写しに結果ファイルを入れ忘れていました。そのため、何も変えていない版でも ec が落ちました。
        - ec だけを測り直す手順を先に commit してから測り直しています。型検査の数は結果ファイルを読まないので、訂正していません。

        **含意**
        - 概念の分類は、自分の枠ではなく、上位をたどって「動詞かどうか」を読むのがよい、と読みます。
        - E は、frame_free が求めていた「枠を足しても関係が変わらない」も満たしました。対のうち E だけで、両方の性質が得られています。
        - 本物の文法の法則を E に変えるのは文法の変更なので、別の PR で手で見てもらう予定です。
        - 新しい仮説は登録していません。

        ロードマップ: 識別子化（a）の concept_kind の対を終えました。次は h_refer_stratified（#338）です。

