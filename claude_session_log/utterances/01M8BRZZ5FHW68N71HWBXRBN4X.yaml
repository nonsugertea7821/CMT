        前回の会話のあとに進めたことを、日本語でまとめます。

        ## 1. #960（h_region_by_expression）: 結果は支持。ただし、モデルが式を読んでいるとまでは言えない
        **問い:** モデルの中の概念の区画は、上位概念（extends）だけで決まるのか。それとも式の残りの部分にも沿うのか。あなたの見方（式が座標の空間を示し、鍵の一意性はその形から来る）の前半を、モデルの側で測るものです。

        **やり方:**
        - 体系の 759 の概念の表示語を Qwen に通しました。
        - 同じ上位概念を持つ群（42 群、組は 10009）の中で、二つの概念の中点に最も近い成員を選びました。
        - その成員の式の残りが、組の二つにどれだけ近いかを順位にしました。偶然なら 0.5 前後です。

        **結果（事実）:**
        - 0.615 で、偶然の 0.500 を大きく上回りました（p = 0）。事前に決めた線を越えたので、判定は支持です。
        - ただし、表示語の字の重なりで同じ量を測ると 0.624 で、同じかやや強い偏りが出ました。
        - 承認と入金は、体系では名前の入れ替えだけで式が同じ組です（#954 の衝突）。モデルの中では大きく離れていて（類似度 0.17）、それぞれ自分の動詞（承認する・入金する）の近くにあります。

        **解釈:**
        - 表示語は式から訳されるので、式の近さと字の近さが絡んでいます。モデルが式を読んだのか、字の似た語を近くに置いただけなのかは、この実験では分けられません。言えるのは「鍵（表示語）がモデルの中で、式の近さに沿った位置にある」までです。
        - 承認と入金は、式が区別していないものを鍵が区別している例です。これは未検証の読みで、#959（識別子の一意性は区画に頼るか）で確かめる範囲です。

        **状態:** 検査が通ったので Draft を外しました。その直後に #961 がマージされて衝突が出たので、main を取り込んで両方を残し、push し直しました。いまは検査の再実行を待っています。

        ## 2. #961: 次の仮説の登録（自動でマージ済み）
        字と式を分けるための仮説 h_region_by_opaque_expression を登録しました（issue #962）。

        ## 3. #963（h_region_by_opaque_expression）: いま実行中
        - **やり方:** 表示語を一切通さず、式の形だけをモデルに通します。
          - ontology・syntax の名前は残します。
          - ほかの名前は、式ごとに X01, X02, … という意味のない記号に置き換えます。
          - 例: 承認は `{extends: ontology.process, mod: [{of: [X01, to]}]}` になります。
        - **測り方と判定の線:** #960 と同じです。
        - **分かれ目:**
          - 支持なら、区画は字ではなく式の形に沿うことになり、式から鍵を作る根拠がモデルの側で立ちます。
          - 反証なら、区画を決めているのは表示語の字で、鍵の一意性は表示語の作り方（式からの訳し方）に頼る、と見ることになります。

        9 分後に実行の様子を確かめます。
