      text: |
        「固有の関係が書かれていない」を体系全体に広げて数えました。状態の式がほかの動詞とまったく同じ動詞の組が 12 あり、端の種類だけで分かれていました。手順は実行の前に登録し、結果を記録してプッシュしました（d248931）。検査は通っています。

        **抽象化**
        動詞の式は「類（共有する部分）＋種差（その動詞に固有の部分）」でできているはずです。種差が状態の関係（holds・pre・post）にあるか、端の種類だけにあるかを数えました。

        **結果**
        - 式の語根 56 のうち、状態の式がほかの語根と同じものの組が **12** ありました（動的 16 のうち 7、静的 40 のうち 19 が組に入る）。
        - 在るようにする動的な語根 9 のうち、産物に固有の関係を持たないのは、設計すると計算するの2つだけでした。

        **12 組の分かれ方**

        | 種差の置き場 | 組 |
        |---|---|
        | 端の最上位（持続体か生起体か） | 後ろに置かれる / 後に起こる（after）、部分になる / 時間的な部分になる（part）、引き起こす / の原因である |
        | 端の `any` | 計算する / 設計する、に頼る / 依存する、の影響を受けない / に依存しない、に転移しない / 引き起こさない |
        | new_kind（第三の位置の種類）だけ | 判定する / 見る / 学習する、取り下げる / 動かす、ほぼ同じ位置にある / 同じ位置にある |
        | 端を狭めただけ | 行う / 席にいる、述べる / について閉じている / 成員の種類にする |

        **読み取れること**
        1. **端の最上位による区別**：同じ関係（after・part）を持続体に当てるか生起体に当てるかで、別の動詞になっています。最上位の分類が、動詞を分けるのに実際に使われている、という観察でもあります。
        2. **`any` による区別は4例**：v_compute と同じ偽装が、ほかに3例ありました。`any` は continuant を含む型なので、「同じ式で、端が広いだけ」です。
        3. **端を狭めただけの組**：「席にいる」は「行う」の端を狭めたもので、本来は下位の動詞（extends）として書く形です。独立した語根として書かれています。
        4. **new_kind だけの組**：判定する・見る・学習するは、どれも「産物が在るようになり、何かに依存し、何かについて述べる」で、産物の種類（情報・性質・傾向性）だけが違います。発話の考察と同じく、それぞれに固有の関係が欠けているように見えます。「ほぼ同じ位置にある」は許容幅（tolerance）を new に置いていますが、式はその位置を一度も使っていません。

        **法則にできそうな形**
        - 2 と 3 をまとめると、「状態の式が同じで、一方の端の種類が他方の端の種類を含むなら、それは別の語根ではなく下位の動詞（extends）でなければならない」と書けます。これは型検査で判定できます。
        - 1 は、最上位の分類が法則（top_placement）で決まれば、正しい区別として残せます。
        - 4 は種類だけでは決められず、それぞれに固有の関係を見つける必要があります。発話の考察の続きにあたります。

        次は、上の法則（端が入れ子なら下位の動詞にする）を入れ、該当する語根を書き直すことを提案します。進めてよいか教えてください。
