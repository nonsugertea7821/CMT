      text: |
        はい、「名前」の範囲を広く取りすぎていました。分けて言い直します。

        **判定に使ってよいもの、使わないもの**
        - 使ってよいもの:
          - シグネチャ（v_refer、pre、holds、extends などの文法の語）
          - 論理演算（neg、量化、かつ）
          - 構造から幾何的に導かれるもの
        - 使わないもの: ノードの identifier（premise、v_assume、approval など）。前の答えで「名前を原子として比べている」と言ったのは、この identifier のことです。シグネチャの語まで一緒にしていました。
        - 双模倣（#331）は、identifier を伏せてシグネチャと構造だけで分けたものです。ですから、そこで分かれなかった 4 組は「この三つからは区別が導けない組」と読めます。

        **概念を座標の範囲と見たときの読み**
        今の体系の語に当てはめると、次のようになります。私の読みで、まだ測ってはいません。
        - extends（上位）は、範囲の包含です。
        - mod（限定）は、範囲を狭める制約です。限定の差分ベクトル（下位 − 上位）は、点の差がベクトルになるというアフィンの演算そのものです。
        - アフィンでは原点に特権がありません。概念ベクトルの実験で、差・共通成分・固有成分を使ってきたことと合います。
        - r_differ と one_name は、二つの範囲が等しくないことを求めます。範囲が式から導かれるなら、identifier を見ずに判定できます。
        - 双模倣で分かれなかった組は、同じ範囲として扱われます。approval と payment が別の概念であるためには、構造の側に違いが要ります。ドメインの多様性で吸収する、という前の判断と合います。
        - concept_kind の対も、この見方で言い直せます。動詞（生起体）と概念を同じ空間の別の範囲として置くか、別の空間に置くか、という問いになります。

        **一つ確認したいこと**
        範囲は凸と考えていますか。
        - 凸なら、限定は半空間との交わりで閉じます。
        - ただ、否定（neg）の補集合は一般に凸ではありません。体系には neg を使った限定があります。
        - 凸でない範囲も認めるか、否定を範囲の外の操作として扱うかで、one_name をどう式にするかが変わります。

        この見方から出る、確かめられる帰結は仮説として登録してから進めます。
