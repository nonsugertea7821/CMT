        `above` を他の基礎の関係と並べると、**順序としての性質は今の体系で事実として成り立っています。ただ、それを保証する法則がなく、`after` や `part` と揃っていません。** さらに、階層と `above` をつなぐ法則が祖先から `above` への一方向だけです。

        ## 基礎の関係ごとの法則

        | 関係 | 順序の法則 | 端が在ることの法則 | ほかの関係とのつながり |
        |---|---|---|---|
        | part | 推移・反対称 | なし | 反対称は same を求める |
        | after | 推移・非対称 | なし | なし |
        | depend | なし | 始点が在れば終点も在る | なし |
        | involve | なし | 始点が在れば終点も在る | なし |
        | **above** | **なし** | **なし** | **祖先ならば above（一方向のみ）** |

        ## 今の体系で測った値

        | 項目 | 値 |
        |---|---|
        | above の組の数 | 2478 |
        | 自分自身への above（反射） | 0 |
        | 逆向きもある組（対称） | 0 |
        | 推移で欠けている組 | 0 |
        | 両端は在るか | すべて在る |
        | depend と重なる組 | 0 |

        つまり今の時点で、`above` は `after` と同じ形の厳しい順序（推移・非対称）です。ただしこれは、`above` が祖先の関係から導かれ、祖先の関係が extends の閉包と非循環の法則でできているから成り立っているだけです。`above` 自身の法則ではありません。

        ## 解釈

        - **階層と `above` の対応が一方向です。** 祖先なら `above` ですが、`above` なら祖先、という逆向きがありません。そのため、動詞 `v_above` で `above` を直接書くと、順序にも階層にも縛られずに通ります。Tarski の対象言語とメタ言語の類比でいうと、メタ言語の判断（extends）は対象言語に写せたものの、対象言語の文がメタ言語の判断と食い違ってよい状態です。
        - **個体の側が別の仕組みです。** 個体の深さは `r_ind_kind`（個体の種類とその上位）で数えていて、`above` を通っていません。深さを一つの関係で数えるはずが、種類と個体で二つに分かれています。
        - **真偽の対称性での位置がまだ決まっていません。** `above` は型検査の段階で導かれるだけで、実行時の「真・偽・示されていない」の扱いを持ちません。直接書く道（`v_above`）がある以上、ここも決める必要があります。

        ## 登録した仮説（未検証）

        ルールに従い、提案を先に仮説として登録しました。
