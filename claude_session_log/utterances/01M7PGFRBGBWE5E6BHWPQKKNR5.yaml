        - tc と ec は通っています。
        - commit 46dce5d を `claude/model-concept-language-mapping-g0lw1i` に push しました。

        1. **`h_above_closed`（上位の順序は extends に依存する）**
           - 足すもの：`after` と同じ推移・非対称の法則と、逆向きの法則（`above` なら祖先）。
           - 予想：今の体系の事実と誤りは変わらない。祖先でない `above` を書いた世界は誤りになる。
        2. **`h_above_individual`（個体の深さは上位の順序に依存する）**
           - 足すもの：個体から種類への関係も `above` に含める。
           - 予想：`r_ind_kind` を使う法則を `above` で書き直せて、違反の組は変わらない。

        真偽の対称性での位置づけは、この二つを確かめてから考えるのがよいと思います。逆向きの法則が入れば、直接書いた `above` の偽を誤りとして扱えるようになるからです。

