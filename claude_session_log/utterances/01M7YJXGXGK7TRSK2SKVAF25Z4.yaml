      text: |
        はい、かなり解決すると思います。ここでの「量の問題」は、確かめに使える概念と兄弟の組の数が足りないことだと読みました。いまの E33 は 12 組で、組ごとの設問は 4 問しかありません。

        **効くところ**
        - **兄弟の組が、正解つきで大量に取れる**: 生物の分類（属・種）は、上位概念と兄弟概念の階層そのものです。物理の分類も同じです（粒子、力、相など）。どの組が兄弟で、上位は何かが、文献の側で決まっています。
        - **境界づけ (A) の材料になる**: これらはモデルが既に知っている概念なので、さきほどの h_round_trip_bounds_present を確かめる材料になります。新しい語を使う E33 は (B) の材料なので、両方がそろいます。
        - **領域が増えると、領域をまたぐ一貫性を測れる**: 分野ごとに領域を立てると、同じ語が分野で別の概念になる例が自然に入ります（エネルギー、場、選択、適応など）。
          - 4 のホロノミー（往復一周のずれ）を、分野をまたぐループで測れます。
          - h_ambiguity_is_region_choice（多義は領域の選び）の材料にもなります。
        - **体系の型検査が、そのまま量の検査になる**: 主張を式で入れるので、入れた量が多いほど、検査器と法則が多くの形で試されます。

        **効かない、または気をつけるところ**
        - **式にする手間が、そのまま量の上限になる**: 主張一つごとに概念を足す必要があり、手で書くと速くは増えません。
          - モデルに主張を式へ訳させれば量は出ます。ただ、訳の正しさは型検査では保証できません。検査が言えるのは、式の形が正しいことだけです。
          - これは h_cscl_needs_translation の系列と同じ問題になります。
        - **本文はリポジトリに入れられない**: 入れるのは、出典と、こちらで書いた式と、数えた値だけです。主張の要旨も、いまの pwc_ と同じく自分の言葉で書きます。
        - **新しい語の実験には使えない**: 既知の概念は、事前学習で既にモデルに入っています。(B) の形づくりの実験には混ざらないように、材料を分けます。

        **このあと**
        - これを仮説として登録します。中身は「先行研究の主張を分野ごとの領域として入れると、実験に使える兄弟の組の数が足りるようになる」です。
        - さきほどの 1・3・4 と合わせた一つの登録の PR にします。
        - 最初の試しは、生物の分類から既知の兄弟の組を 12 組取ることです。E33 と同じ none・both・round を、境界づけ (A) の確かめとして走らせます。
          - これは E33 と E34 の後に、重い列の次の候補に置きます。

        本線 a 識別子化、d_consolidation_in_vector の下（材料の量）と d_road_region の下（分野の領域）
