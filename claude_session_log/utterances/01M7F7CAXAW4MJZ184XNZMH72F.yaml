        | 商品 | 注文に引き当てられうるもの | 販売される物。「物」は「行為をしない独立持続体」として新たに置きました |
        | 倉庫 | 独立持続体 | 商品が保管される物 |
        | 法人 | 契約を結ぶ組織 | 法人格を持つ組織。法人格は、法律という定義に依存する役割です |
        | 管理者 | 権限を与えられる利用者 | 「設定の変更を許す規則」に依存する権限を持つ利用者 |
        | 利用者 | （権限の側から書いていた） | サービスに登録者として関わる人 |
        | 家族 | 住所を持つ人（全称で限定） | 二人以上が住む住所に住む人 |
        | 欠席 | 遅れたという質を持つ記録 | 会議の開始時刻に席にいなかった人について述べる出席の記録 |
        | 注文 | 発注されるもの | 商品について述べる情報のうち、発注されたもの |
        | プラン | 商品について述べる情報 | サービスについて述べる情報 |

