      text: |
        切り分けの測定（E7）が終わりました。文脈の長さそのものは原因ではなく、再定義の前に他の定義がどれだけ並んでいるかが効いていました。

        ## 結果（Qwen3-4B、正答率）

        | 条件 | 再定義で衝突する設問（24問） | 新しい語（12問） |
        |---|---|---|
        | 関係する定義だけを設問の直前に置く（E1 の値） | 0.75 | 1.00 |
        | 関係する定義だけをシステムプロンプトに置く | 0.67 | 1.00 |
        | 上に加えて、無関係な文章 約500トークン | 0.75 | 1.00 |
        | 上に加えて、無関係な文章 約2000トークン | 0.71 | 1.00 |
        | 5定義の用語集（順序は無作為） | 0.71 | 1.00 |
        | 15定義の用語集（順序は無作為） | 0.71 | 1.00 |
        | 55定義の用語集、関係する定義を先頭に置く | 0.71 | 1.00 |
        | 55定義の用語集、関係する定義を末尾に置く | 0.54 | 1.00 |
        | 55定義の用語集、関係する定義は中ほどから後ろ（E1 の値） | 0.46 | 1.00 |

        ## 読み取れること

        - **文脈の長さは原因ではありません。** 無関係な文章を2000トークン足しても落ちず、55定義の用語集でも、関係する定義が先頭なら落ちません。
        - **設問からの距離も原因ではありません。** 設問に最も近い末尾に置いた方が、最も遠い先頭に置いた場合より低くなりました。
        - **効いているのは、再定義の前に並ぶ定義の多さです。** 多数の定義のあとに置かれた再定義が無視されます。5〜15定義の規模では落ちませんでした。
        - **新しい語は、どの条件でも 1.00 です。** 落ちるのは、元の意味と競合する定義だけです。

        1問の差が 0.04 に当たる規模なので、0.67〜0.75 の間の違いには意味がありません。読める差は、0.71 に対する 0.54 と 0.46（4〜6問ぶん）です。

        ## あなたの含意との関係

        「文脈が広がるほど落ちる」は、この範囲では当たっていませんでした。ただし、実際の長い作業では文脈が伸びるにつれて定義の前に積み重なるものも増えるので、結果として同じ現象が起きる可能性はあります。その原因が「長さ」ではなく「先行する内容による抑制」だと分かったことで、対処の仕方が変わります。

        - 定義を文脈の先頭近くに置く。
        - 一度に渡す定義を少数に絞る。

        ## まだ区別できていないこと

        前に並ぶものが「他の定義」だから効いているのか、単に文脈の深い位置にあるから効いているのかは、区別できていません。無関係な文章のあとに定義を置く条件で分けられるので、続きの測定として予定に入れました。数千トークンを超える規模も未確認です。

        ## 進行状況

        予定どおり、第8層での「定義と適用の両方を教師にした学習」が自動で始まっています。約2時間後に結果が出る見込みです。E7 の結果は `experiments/README.md` と `docs/design.md` に記録し、プッシュ済みです。
