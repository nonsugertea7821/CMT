      text: |
        いいえ、最初の定義は韻の概念に合っていませんでした。私は韻律を「語がそれで書かれる質」としましたが、先行研究の韻律はそういうものではありません。先行研究を調べて、#248 の定義を直しました（tc と ec は通っています）。

        **先行研究での韻律**
        - 子音・母音より上の層の性質です。抑揚・句切り・強勢・リズムからなり、モーラ・フット・句・発話という階層をもちます。
        - 句の境界は、統語の境界と揃いやすいとされます。
        - 修飾との関わりでは、「句の切れ目が修飾の掛かり先を決める」ことがよく調べられています。あなたの直観に一番近いのはこの部分です。
          - Snedeker & Trueswell 2003: 話し手は、文脈で掛かり先が決まらないときに、掛かり先を示す韻律を作ります。聞き手はそれを使います。一方で、その韻律は統語の副産物だという対立する見方もあります。
          - Fodor 2002: 黙読でも、読み手は既定の韻律を文に当てはめ、その句切りで掛かり先を解釈します。こちらのデータは書き言葉なので、ここが測る根拠になります。
          - 日本語: 休止が文節単位の修飾の曖昧さを解くという研究があります。読点が統語の境界と揃うと読みが軽くなり、ずれると重くなるという研究もあります。

        **直した定義**
        - 新しく「韻律句」を置きました。発話の部分で、語をまとめる単位です。
        - 韻律は、韻律句に依る発話の質としました。
        - 修飾の側は、「掛かり先が韻律句で決まる修飾」としました。
        - 上の先行研究2つは prior_work として体系に置き、その主張を「修飾は韻律句に依る」という式で書きました。

        **決めてほしいこと: 「韻」をどちらで読むか**
        - 「韻」には、押韻や七五調・2モーラのような、音の繰り返しの型という読みもあります。
        - こちらの先行研究は韻文や標語が中心で、修飾の掛かり先と結ぶものは見つかりませんでした。
        - そのため今回は句切りの読みを採りました。直観が律の読みのほうなら、概念と仮説を別に足します。

        **限り**
        - 引用の書誌と要旨は、検索で見た引用元の論文と目録によるものです。原典の本文は読めていません。
        - Fodor 2002 の本文 PDF は取得できず、要旨は引用元の記述に拠っています。

        Sources:
        - [Snedeker & Trueswell 2003 (PDF)](https://nats-www.informatik.uni-hamburg.de/pub/CDG/EssentialReadingBib/SedekerTrueswell03.pdf)
