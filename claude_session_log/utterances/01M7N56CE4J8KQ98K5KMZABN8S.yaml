      text: |
        演繹の手順と、それを抽象化した形をまとめます。

        **今回の演繹の手順**
        1. 動詞の定義は、位置について文を述べている。v_design は「後で exists(to)」。
        2. 同じ位置に置かれている使い方を集める。設計の終点には、programming_language と model_design があった。
        3. 置かれたものごとに、定義の文が成り立つかを見る。
           - 設計書（model_design）は、設計の後に在る。成り立つ。
           - 作るもの（モデル、言語そのもの）は、設計しただけでは在らない。成り立たない。
        4. 成り立たないほうは、成り立つほうから関係でたどれる。設計書は作るものについて述べている（refer）。
        5. よって、programming_language の使い方は v_design そのものではない。終点を refer の先へずらしたもの、つまり「設計書を作り、それが言語について述べる」を、v_design と同じ名前で書いている。名前は1つでも、式が2つ混ざっている。

        **抽象化した形**
        動詞 v の定義を F（位置についての文の集まり）とし、位置 p での使い方を見る。

        - 使い方 v(…, p = b) で、F が b について成り立たない。
        - ところが、F が成り立つ c があり、基礎の関係 R で R(c, b) が成り立つ。

        このとき、その使い方は v ではなく **v ∘ R**（v の位置 p を R に沿ってずらした動詞）です。**混同とは、v ∘ R を v の名前で書くこと**、と定義できます。今回の例は次の2つです。

        | v | p | c（F が成り立つ） | R | b（置かれたもの） |
        |---|---|---|---|---|
        | 設計する | to | 設計書 | refer | 作るもの（言語・モデル） |
        | 計算する | to | 計算結果 | depend | 入力 |

        計算の側は、今の体系では混ざっていません。ただし、「層を計算する」のように入力を終点に置けば同じ形の混同になります。

        **self と same で書くと**
        混同は、c と b を同じもの（same(c, b)）として扱いながら、R(c, b) が成り立っている状態です。ここに same による置き換えを使うと、**R(c, c)**、つまり「設計書が自分自身について述べる」が出ます。refer や depend が自分自身に成り立つことは普通ないので、混同は「R(self, self) が出てしまうこと」として検出できます。これは、否定が循環すると self ≠ self が出る話と同じ種類の検出です。

        **v_design と v_compute の件との関係**
        この2つは、same（ライプニッツの法則）の2つの向きにあたります。

        | 向き | 内容 | 破れたときの姿 | 今の検出 |
        |---|---|---|---|
        | 見分けがつかないなら同じ | 式が同じ2つの名前は同じもの | v_design と v_compute。`any` は、見分けを偽装していた | 「動詞の式が同じ」の検査がある |
        | 同じなら見分けがつかない | 1つの名前の使い方は、定義の上で見分けがつかない | 混同（v ∘ R を v と書く） | まだない |

        混同は2つ目の向きの破れです。2つ目を検査にできれば、混同を型検査で見つけられることになります。

        この形は、まだ2例から抽象化した段階です。このまま仮説として claims に書き留めておくか、先に「同じ位置の使い方で、F が成り立たないもの」を体系全体で数える観察をするか、どちらで進めるかを指示してください。
