      text: |
        ここまでの道を目的に照らして並べ直すと、いちばん近いのは「目的の物差しそのものを測ること」です。次のように考えました。

        **目的と物差し（体系に書いてあること）**
        - 目的 d_goal は「この設計で再定義の成功（redefinition_success）を上げる」です。
        - 物差し d_metric は「再定義の成功を、使い方をまたぐ一貫性（cross_usage_consistency）で測る」です。使い方とは、定義の暗唱・事例への適用・言い換えの選択・説明の四つです。

        **いま足りないもの（読んだ事実）**
        - main の exp.yaml を検索しました。cross_usage_consistency を物差しにして測った記録は、一つもありませんでした。
        - これまでに測ったのは、使い方の対ごとの転移です。暗唱から適用へは転移しない、適用から言い換えへも転移しない、どちらも支持されています。「同じ項目で、四つの使い方がそろって新しい定義に従うか」は、測っていません。
        - 物差しがないままでは、検査器を渡す・例を見せる・体系で学習する、のどれが効いたのかを、目的の言葉で判定できません。

        **近い順（判断）**
        1. **物差しを測る**: Qwen で概念を再定義し、同じ項目に四つの使い方で問います。そろって従う割合を基準の値として出します。目的に最も近く、ほかのすべての手を判定する土台になります。
        2. **安く効きそうな手**: h_consistency_by_examples（使い方の例を文脈に置けば、一貫性が上がるか）。1 の物差しで測ります。
        3. **重みに入れる手**: h_consistency_by_formal_corpus（体系に落とした定義で学習する、#840）。1 の物差しで測ります。
        - E57（検査器の行を写すか）は、これより一段遠いです。「部分保存から再開できる」形で一度止め、重い列を 1 に空けます。止めた時点までの経過は #838 に残します。

        **進め方**
        - 次の三つを、ひとつの事前登録として決めます。
          - 1 の物差しの作り方（どの概念を、どう再定義し、四つの使い方を同じ項目でどう問うか）
          - 判定の線
          - 対になる仮説
        - 前の実験（暗唱・適用・言い換えを測ったもの）の材料と手順を読み返し、使えるものは使います。
        - 決めたら Draft の PR で出します。

        ロードマップの位置: d_metric（目的の物差しを、初めて一つの量として測る）。
