      text: |
        「一意性は幾何空間、一貫性は辞書」で、図がはっきりしました。私の読み方の誤りも見えたので、整理します。

        ## 受け取った図
        - **値（式）:** 概念の幾何的な座標の空間の中の場所です。
        - **一意性:** 場所の形そのものが決めます。形が違えば別の概念です。
        - **鍵（識別子）:** 自然言語の語を、その場所へ引く辞書の見出しです。
        - **一貫性:** 辞書が決めます。どの使い方（文脈）で語を引いても、同じ場所に着くこと。

        ## 体系の仮説との対応
        - **一意性は空間が決める:** h_identifier_unique_by_region（#959: 識別子は区画に頼る）に当たります。
        - **一貫性は辞書が決める:** h_identifier_read_with_display_and_prosody（#945: 使い方をまたぐ一貫性は、識別子・表示語・韻律句に頼る）に当たります。
        - どちらも登録済みで、まだ確かめていません。

        ## これまでの結果の読み直し
        - **#960 と #963:** 確かめているのは空間の側だけです。モデルの空間に、式の形に沿った場所がもともとあるか、という問いです。辞書は測っていません。
        - **E35（式を文脈に置いても状態が絞れなかった）:** 私は「モデルが式を読まない」と読んでいました。この図では、辞書がないまま式だけを置いても、語はその場所へ引かれない、と読めます。図の反証ではなく、辞書を作る必要を示すものになります。
        - **表示語の書き替えで区画が崩れた実験:** 今のモデルでは、表示語の字面が辞書の代わりをしている、と読めます。字面を替えると引く先がずれるので、一貫性は崩れます。

        ## 次の順番
        1. 空間の側: 式の形に沿った場所があるか（#963、実行中）。
        2. 一意性: 鍵の一意性が場所の形に頼るか（#959）。
        3. 一貫性: 辞書（鍵から場所への対応）で、使い方をまたいで同じ場所に着くか（#945）。

        #963 が反証でも、図そのものは崩れません。そのときは、空間の形を表示語なしでは取り出せない、ということになります。辞書を作るときに、表示語から引くしかない、という条件として扱います。
