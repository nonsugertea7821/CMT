      text: |
        ここで言う「原理的な限界」は、検査器の作りが甘いという話ではありません。spec の中だけを見る検査なら、どう作っても避けられない限界です。

        ## なぜか

        検査器にとって、識別子は意味を持たない記号です。分かるのは、spec の中にある文どうしが矛盾しないかどうかだけです。

        「ずれは隠れ状態の部分である」を「隠れ状態はずれの部分である」と逆に書き換えたとします。逆の版も、次の条件をすべて満たします。

        - 文の形として正しい
        - 種類の制約を満たす（どちらも情報なので、部分にも全体にもなれる）
        - 部分の関係に循環を作らない
        - 関わる事実がなく、表示名にも向きが書かれていないので、ほかのどの文とも食い違わない

        つまり、正しい版も逆の版も、spec 全体として矛盾のない読み方になります。二つが同じように成り立つ以上、spec しか見ない検査はどちらが正しいかを決められません。

        論理の言い方では、その文は spec の残りから**独立**しています。独立した文の真偽は、無矛盾性の検査では決まりません。

        これは前に話した「識別子は識別できるが無意味で、意味は core の論理演算子だけが運ぶ」と同じ構図です。検査器はまさにその立場で spec を読んでいます。部分と全体の役を入れ替えても、ほかの全部の文と矛盾しなければ、記号の上では区別がつきません。

        ## 限界ではあっても、手は打てる

        限界があるのは、spec が十分に絡み合っていないときだけです。向きを決める独立した手がかり（錨）を増やせば、逆向きは矛盾として現れるようになります。

        - **ほかの文との絡み:** 同じ二つのノードについて、別の関係を書きます。例えば「隠れ状態のずれは隠れ状態に依存する」と書き、「全体は部分に依存する」を法則にします。逆向きにすると依存の向きと食い違います。
        - **事実:** 個体どうしの部分の事実があれば、① が逆向きを捕まえます。
        - **外の世界との対応:** 測った値（E15 の |v|=25 と |h|=152 など）や、人が表示名を読むこと（③）です。spec の外の意味に照らす手段です。

        ## 測れる基準にできる

        これは確かめられます。「部分になる」の限定を一つずつ逆にして検査を走らせればよいのです。
        - 逆にすると検査が落ちる限定は、錨があり、向きが守られています。
        - 逆にしても通る限定は、向きを spec が何も決めていない、無防備な箇所です。

        ほかの限定も一つずつ反転させて同じように調べれば、spec のどこが絡み合いで支えられ、どこが孤立しているかの一覧が作れます。錨を足す優先順位がはっきりします。

        部分の限定は30件ほどで、1件の検査に1分前後かかります。走らせますか。
