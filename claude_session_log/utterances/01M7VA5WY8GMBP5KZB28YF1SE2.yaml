      text: |
        その方向で直して、#424 を立てました。ワークフローの変更なので、手で見てください。

        - **変更:** main に push があったとき、GitHub が衝突の有無を約 60 秒で計算し終えなかった PR があれば、30 分待ってからその PR だけをもう一度調べます。衝突していれば、これまでと同じコメントを付けます。
        - **待つ間に main が進んだら:** 待っている実行は打ち切られ、新しい実行が開いている PR をすべて調べ直します。古い main のまま判定することはありません。
        - **30 分後にも決まらなければ:** それ以上は追わず、次に main へ push されたときにまた調べます。
        - **定期実行にしなかった理由:** 決まらない PR があるときだけ待つので、何もない日は余計に走りません。代わりに、待つ間は runner を 30 分使います。

        確かめたのは、GitHub への呼び出しを差し替えて手元で走らせたところまでです。決まらない PR は持ち越され、衝突した PR にはコメントが一つ付き、2 回目はその PR だけを調べました。GitHub 上の実際の動きは、マージした後の main への push で確かめます。

        運用の変更で、ロードマップの決定には結ばない「わき道」なので、仮説としては登録していません。
