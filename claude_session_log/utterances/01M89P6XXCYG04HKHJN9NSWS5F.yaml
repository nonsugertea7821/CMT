        ご指摘のつながりは、そのまま成り立ちそうです。しかも、片側はもう測ってあります。

        **体系とモデル内部の対応について、分かっていること**
        - 区画は上位概念（extends）で決まります。これは支持済みです（h_midpoint_depends_genus）。層 8 で、上位概念でまとめると 0.93〜1.00、量の区間でまとめると 0.43〜0.70 でした。
        - 区画は表示語（字面）にも強く結びついています。表示語を入れ替えると 0.779 から 0.229 に落ちました（h_genus_region_immune_display は反証）。
        - つまり、モデルの内部では「上位概念」と「字面」の両方で概念が置かれています。いまの体系の識別子は名前（字面）なので、識別子をそのまま鍵にして内部と対応づけると、字面の側を拾ってしまいます。

        **だから識別子化が必須になる理由**
        - 識別子を「上位概念と種差」で決めれば（h_identifier_by_genus_differentia、未検証）、識別子と区画がどちらも extends の上に立ちます。体系とモデル内部の対応を、字面ではなく構造で引けるようになります。
        - この仮説はこれまで、表示を式から導く決定（d_cscl_display_derived）にだけ結んでいました。今回、領域の道（d_road_region）にも結びました。

        **登録したもの**（#868 に足しました）
        - **h_vector_effect_by_region**: 概念ベクトルの効き目は、区画に頼るか。ベクトルを足すのが「パラメータを絞った微調整」の一種なら、どこに足せば効くかは、内部の幾何との対応で決まるはずだ、という問いです。
        - **h_consistency_by_scale_and_formal_teaching**: 一つ前にいただいた「特化型モデルの道」の最後の段です。使い方をまたぐ一貫性は、規模と概念式で教えることの両方に頼るか、を問います。前の三段は既存の仮説でつながります。
          - 識別子化（h_identifier_by_genus_differentia）
          - 種と類差に基づく学習（包含・兄弟の対比）
          - 一貫性の測定（d_metric）
        - **ガードレールの道**: h_harness_raises_formalization を別の PR にしようとしたところ、GitHub が 500 を返しました。ブランチは push 済みで、5 分後に立て直します。この道の詰まりは、モデルが式を書く段です（E29 で型検査を通ったのは 24 のうち 5）。そこで、検査の結果を返して書き直させると上がるかを問います。

        **二つの道のつながり**
        二つの道は、識別子化を共有しています。ガードレールの道でも、検査器が判定するには、概念が式で同定されている必要があるからです。なので、識別子化はどちらの道でも先に来ます。現状は、事実（関係）の名前を中身から作る形が実験で支持済みで、検査器にはまだ入っていません。概念の名前を類と種差で決める形は、未検証です。
