      text: |
        #795（issue #794）の判定は「反証」です。最後のトークンが同じ対を除いても、類の分かれの上がりは残りました。CI の結果を待っていて、通ったら Draft を外します。

        Qwen2.5-1.5B、39 語・6 類、L8、元の言い方で測りました。G は「同じ類の対は、違う類の対よりどれだけ似ているか」です。

        | 使った対 | 平均で読んだ G | 最後のトークンで読んだ G | 上がり |
        |---|---|---|---|
        | 全部（#792 と同じ値） | 0.083 | 0.219 | 0.136 |
        | 最後のトークンが同じ対を除く | 0.035 | 0.114 | 0.079（p 0） |

        - **判定:** 事前に決めた線「上がり 0.05 以上、かつ p 0.05 以下」を越えたので、反証です。結果は 95c8c14 で push しました。
        - **他の層:** 除いた対での上がりは、L14 と L20 の元の言い方で 0.070 と 0.071、類の名前を前に付けた言い方で 0.042〜0.073 でした。
        - **読み（解釈）:**
          - 上がりのおよそ 4 割（0.136 → 0.079）は、語尾がまったく同じことで出ていました。
          - 残りのおよそ 6 割は、同じ語尾を除いても残ります。
          - 語尾が同じ対を除くと、平均で読んだ G も 0.083 から 0.035 に下がりました。語尾が同じことは、平均で読むときにも効いていました。
        - **残っている点:** 除いたのはまったく同じ語尾だけで、「する」と「される」のような似た語尾は残っています。なので、残った上がりが「語尾を越えた類」だとまでは言えません。

        この点を確かめる残り項目として `b_genus_state_by_similar_suffix` を登録し、PR #796 を立てました。#792 の仮説（最後のトークンで読むと類の分かれが上がる）の下に置いています。仮説を足さない、残り項目だけの登録なので、自動マージには乗らず、手で見てもらう見込みです。

        ほかの PR の状況です。

        - **#789・#790・#791:** #792 のマージで main とぶつかったので、両側を残して解き、push しました。CI を待っています。
        - **手で見てほしいもの:** #789、#791、#796、#736、#742。
        - **Draft のまま:** #790 と #782 は、判定が出ていないためです。

        ロードマップの位置: d_road_region（#376）。最後のトークンで類の区画が読めるかを、語尾の影響を除いて確かめているところです。
