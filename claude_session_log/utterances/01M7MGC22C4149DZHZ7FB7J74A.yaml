      text: |
        思い出そうとしている考えそのものは、私には分かりません。リポジトリと話の流れから組み立て直すと、たぶん次のことだと思います。

        ## 再構成：限定（mod）を演算子として扱う

        **1. CSCL では、概念は「親 + 限定ひとつ」で定義されている**
        `extends: 親` に `mod: {of: ..., with: ...}` を足す形です。この形は、ベクトルで言えば「親の表現 + 差分」と同じです。

        **2. 公理が保証するのは構造だけ**
        公理で決まるのは、限定の積み方が正しいことまでです。基底の概念が何を意味するかは保証しません。中身は事前学習で得た表現から来ます。つまり、存在論は形式の側にあり、接地は Transformer の側にあります。

        **3. 差分ベクトルそのものを教師にする**
        いまは概念ごとにベクトルを学習しています。そうではなく、限定ごとにベクトルを学習します。
        - 同じ限定（例えば否定）は、どの親に付けても同じ差分になるべきです。
        - これが成り立てば、概念のベクトルは親から限定のベクトルを足していって作れます。一度も教えていない概念にも作れます。

        **4. 言語側への含意（これが重大な点だと思います）**
        この見方では、限定は属性ではなく、名前を持つ演算子として独立している必要があります。いまの CSCL では次のとおりで、同じ限定を別の概念の上で同じものだと識別できません。
        - `mod:` は概念の中に書く無名の辞書です。
        - 名前は `information_entity_compose_to_case` のように、概念ごとに作られています。

        ## 既にある仮説との関係
        - `h_specific_agrees_with_sense_difference` は E17 で否定されています。これは「固有成分 = 意味の候補どうしの差」という仮説です。
        - ここで言う差分は「子 − 親」なので、別物です。
        - 一番近いのは `h_specific_composes_from_expression`（未検証）です。

        ## 既知のこと
        - 対比で作るステアリングベクトル（CAA、関数ベクトル）は、どれも差分ベクトルです。
        - 線形表現仮説（Park et al. 2023 など）も同じ方向です。
        - ただ、形式の体系の「限定」と対応づけた研究は、今回の調査では見つかっていません。これは調べた範囲での話で、無いと確かめたわけではありません。

        これで合っていれば、次の2つを用意できます。
        - 言語側：限定に名前を与えて、独立したノードにする
        - 実験側：同じ限定の差分ベクトルが、別の親にも移るかを試す仮説

        記憶とずれているところがあれば、教えてください。
