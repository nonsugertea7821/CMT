      text: |
        そう思います。そして体系はすでにその立場を一度採っています。claims に決定 `d_cscl_display_derived`（採用済み）があり、中身は「display は体系に依存する」です。名前を付けた限定の表示名もすでに導かれた形をしています。例えば「自然言語へで書かれる（始点）」は、動詞・位置・端の表示を組み立てただけの言葉です。

        この見方を進めると、次のことが言えます。

        **1. display は定義ではなく、日本語への翻訳の結果。**
        概念が何であるかを決めるのは式だけです。display は、日本語という変換先での語に当たります。英語や機械語へ変換すれば、別の語になるだけです。

        **2. 翻訳は 2 つの部分に分かれる。**
        - 基礎の語の辞書：same, any、基礎の関係、動詞などに、日本語の語を当てる。
        - 組み立ての規則：式から句を作る。例えば「動詞・位置・端」から「〜へ述べる〜」を作る。

        導けない display は、日本語が 1 語に「語彙化」した名前です。例えば「売上」は、「入金を測る金額」という式の集まりに日本語が付けた 1 語です。そういう名前は、辞書に「この式の集まり → この語」の項目として書けば済みます。

        **3. 今日の発見は、この翻訳の検査として言い直せる。**
        「金額（円）」の「円」は、式から導けない情報が display に混ざっていた例でした。翻訳は式から語への関数なので、display の中に式から来ない部分があれば、それは翻訳ではなく、式が持つべき意味の取り残しです。コメントの問題とまったく同じ構造で、式の外に意味が漏れている場所です。

        これは測れます。各概念について、display を式から組み立てた句（または辞書の項目）と比べ、余る部分を数えます。余りがある概念は定義が薄い（未分化の）候補になります。今の 6 件の違反の上の概念に余りが集中するかどうかを見れば、sys_specific_depth と同じ形の予測になります。

        **4. 決定や観察の display は、もっとはっきり問題になる。**
        claims の `d_…` や `o_…` の display は、語ではなく文です。翻訳の結果だとすれば、元の式（事実）があるはずです。しかし、多くは文章しか持っていません。コメントを禁止するとき、「display に文章を移せば済む」という逃げ道は、この見方では閉じます。中身は事実として書き、display はそこから導かれるべきだからです。

        **5. 一意な翻訳の裏返し。**
        翻訳が式から語への関数なら、違う概念が同じ語になることもありえます（日本語の多義語）。逆向き、つまり日本語から式へは一意になりません。体系の側で「別の式の概念は別の名前」（法則 one_name など）を守っていれば、日本語の側の衝突は辞書の側の問題で、体系の問題ではない、と分けて扱えます。

        ## 次の一手の候補

        前に挙げた A と B に、もう 1 つ加わります。

        - **A.** lattice：残る 6 件の違反は「交わり（meet）」か。
        - **B.** コメントを禁止するための棚卸し：406 個を種類に分けて数える。
        - **C.** display の検査：display のうち式から導けない部分を数え、定義が薄い概念の検出に使えるか（3 の測定）。

        C は B の前提にもなります。式と表示の境界がはっきりすれば、コメントの行き先も決めやすくなります。私の勧めは A → C → B の順です。どれから始めますか。
