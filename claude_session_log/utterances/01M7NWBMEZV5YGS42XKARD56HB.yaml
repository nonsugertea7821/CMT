        Sounds right. The mutation test is now running in the background (about 80 words × ~5s each, roughly 7 minutes).

        Design: every occurrence of a word is renamed in the YAML (e.g. `role` → `mut_role`), the checker and runtime are run, the name is mapped back in the output, and the result is compared with the unmutated baseline. A pure translator should behave the same after renaming. If behavior changes, the .py is branching on that name.

        - **Positive controls** (expected to change): grammar words `holds`, `extends`, `verbatim`, `many`.
        - **Negative controls** (expected not to change): library nodes whose names never appear in the .py source.
        - **Test set**: the 55 "outside" words from the previous scan.

        This is one-directional: a change proves name-dependence, but no change doesn't prove independence (the current inputs may just not trigger it). It also catches names built with f-strings, which the static scan missed. The procedure was committed before running (5fcb47a). I'll report when it finishes.
