      text: |
        E17 の結果が出ました。**固有成分 s は、語の意味の差（新しい意味の文と元の意味の文での隠れ状態の差）と一致しませんでした。** 仮説 h_specific_agrees_with_sense_difference は否定として spec に記録し、検査を通して push 済みです（c265917）。

        ## 1. 向き：s と意味の差のベクトルは、ほぼ直交

        24語それぞれで、新しい意味の文3つと元の意味の文3つから、層8の語の位置で差のベクトル d を取りました。概念をまたいだ平均を引いて中心化した上で、s と比べています。

        | 指標 | 値 |
        |---|---|
        | cos(s, 自分の語の d) | +0.005 |
        | cos(s, ほかの語の d) の平均 | −0.000 |
        | 並べ替え検定の p 値 | 0.21 |
        | 24語中、自分の d がいちばん近かった語の数 | 0 |
        | 自分の d が近い方から何番目か（平均） | 12.0（ランダムと同じ） |

        中心化しない d との cos も、全ベクトル v との cos も、ほぼ0でした。

        ## 2. 介入：意味の差を足しても、正答率は上がらない

        意味の差のベクトルを、s と同じ大きさにそろえて足しました。

        | 条件 | 書き換えた定義の群 G2c：正答率 | G2c：順序に頑健な正答率 | 元の意味の群 G2k：正答率 | G2k：順序に頑健な正答率 |
        |---|---|---|---|---|
        | なし | 0.38 | 0.29 | 0.75 | 0.50 |
        | E3（m + s） | **0.79** | **0.71** | **0.92** | **0.88** |
        | m + 意味の差 | 0.54 | 0.29 | 0.54 | 0.42 |
        | 意味の差だけ | 0.62 | 0.04 | 0.54 | 0.00 |
        | m + ほかの語の意味の差（対照） | 0.58 | 0.33 | 0.46 | 0.42 |

        - 自分の語の意味の差を足しても、ほかの語のものを足した対照と変わりませんでした。
        - 元の意味の群では、何もしないときより下がりました。
        - 判定の余裕（margin）がほぼ0に潰れました。E14（定義の有無の差を足した実験）と同じ壊れ方です。

        ## ここから言えること

        - **s は、文の中で語が新しい意味で使われたときにモデルが作る状態の差の向きではありません。** E15 で「定義文を前に置いたときの状態のずれと直交する」と分かっていましたが、「実際に新しい意味で使われた文の状態とも直交する」が加わりました。E3 のベクトルは、モデル自身が文脈から作る、どの意味表現の向きとも重なっていません。
        - **モデルが自然に作るずれを移植すると、判定が壊れます。** E14 と E17 で同じ形です。合わない文脈に持ち込まれたずれは、雑音として働くようです。
        - **したがって、s は「意味」ではなく、二択の設問形式で後ろの層が読む鍵のようなものかもしれません。** 学習で設問への答え方に合わせて作られているからです。これはまだ推測です。

        ## 限界

        - 文は1つの意味につき3文だけで、新しい意味の文には「土曜も」のような文脈の手がかりが含まれます。d には、語の意味だけでなく文脈の違いも混ざっています。
        - 測ったのは層8だけです。

        ## 次に考えるべきこと

        「s は意味か、設問形式の鍵か」を分けるのが次の問いです。

        - **一番安く確かめる方法:** E3 のベクトルを、二択以外の形式で試します。例えば「〇〇の例を一つ挙げよ」のような自由な答え方です。新しい意味に沿った答えが出れば、s は形式に依存しない中身を運んでいます。出なければ、二択の鍵です。
        - **結果が後に効く仮説:** s を概念式から合成できるか（h_specific_composes_from_expression）は、この結果で意味が変わります。s が二択の鍵なら、組み立てる部品は意味ではなく、答え方の側になります。

        形式を変える実験に進めてよいか、決めてもらえれば対応します。
