        2. Key Technical Concepts

        **Layers and mapping**
        - Geometric mapping (from the user):
          - ontology = points (existence)
          - runtime = displacements (steps)
          - syntax = relations between them (refer)
          - signature = variable range, the base (any)
        - Domain uses: signature ← ontology ← syntax ← runtime; std uses syntax; exp uses std and runtime; lang uses std, runtime, exp; subj uses std.
        - Visibility is the transitive closure of uses.
        - The `layered` law: refs must be visible. tc's `T.refs(nid)` covers parents, from/to/new_kind, of/form[0], mod of/with, and cmp.

        **Classification evolution**
        Each step changes one thing:
        1. sys_layers pos version: edges are extends, from/to/new_kind, and mod of/with; negation edges are skipped.
           - change if a reached node has pre/post.
           - refer if a reached holds/pre/post atom uses `refer`.
           - otherwise still.
           - Mapping: still → ontology, refer → syntax, change → runtime.
        2. Plus `form[0]` edges (roles move with their verb).
        3. change only if the verb's pre/post use a base relation other than `exists`. Exists-only verbs: ontology.v_design and std.v_compute.
        4. Plus nodes having a negated mod whose of-verb "moves" count as change. Reading: ◇ and □¬ are both step quantification, so the sign doesn't change the axis.

