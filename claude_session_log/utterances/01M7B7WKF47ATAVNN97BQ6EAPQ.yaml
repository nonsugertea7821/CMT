      text: |
        入れること自体は可能ですが、障害はあります。大きいものから並べます。

        ## 技術的な障害

        1. **書き込む場所が定まらない。** 概念は重ね合わせた方向として分散しており、離散的な単位がありません。1つの概念だけを書き換えようとすると、同じ重みを共有する他の概念に干渉します。破滅的忘却の原因もこれです。
        2. **1回の変更から学べない。** 勾配による学習は多数の例を必要とします。「この概念を今日こう変えた」という1件の出来事を、確実に、波及先まで含めて反映する方法は確立していません。
        3. **重みは状態であって履歴ではない。** 重みに入れた時点で、変更前の状態と変更の理由は失われます。系譜・版・取り消しを保つには追記型の構造が必要で、それは通常の重みとは別の部品になります。

        ## 運用上の障害

        4. **1つのモデルを多数の利用者が共有している。** 状態を持たない設計は技術的な限界というより、規模の拡大・再現性・安全性のための運用上の選択です。プロジェクトごとの概念体系を本体の重みに入れると、プロジェクトの数だけモデルが必要になります。
        5. **監査と合意ができない。** 内部状態は人間が読めません。あなたの構成の要である「人間との合意」が成り立たなくなります。
        6. **自分を書き換え続けるモデルの安全性。** 誤った変更や悪意ある入力が永続化し、気づかないまま蓄積します。巻き戻しの手段がなければ回復できません。

        ## 現実的な形

        これらを避けながら内側に入れるなら、次の構成になると考えます。

        - **本体の重みは固定する。** 一般的な言語能力と、記憶を読み書きする能力だけを持たせます。
        - **書き込み可能な記憶部品をモデルの構造の一部にする。** 概念の識別子で番地を指定でき、順伝播の計算に重みと同じように入ります。
        - **記憶の中身はプロジェクトごとに分離し、差し替え可能にする。**

        つまり内側に入れるのは**読み書きの機構**で、**中身**は分離できる形で持つことになります。こうすると、1と2は番地つきの書き込みで回避でき、4は中身の差し替えで解決します。3、5、6は、中身に対応する記号的な正本を並行して持つことで解決します。

        この方向の研究（推論時に更新される記憶層、記憶を増設したモデルなど）は存在しますが、系譜を持つ概念体系と結びつけたものは、私の知る限りありません。

        ## 結論

        最大の障害は実現可能性ではありません。あなたが求める性質（系譜、取り消し、監査、プロジェクト間の分離）が、状態を「構造化された、分離できる部品」として持つことを要求する点です。内側に入れても、その部品は本体の重みとは区別されたものになります。内か外かの境界は、結局その部品がモデルの計算にどれだけ直接入るか、という程度の問題になります。
