      text: |
        はい、その見方でぴったり重なります。

        | 国語辞典 | この体系 |
        |---|---|
        | 見出し語 | 鍵（識別子、表示語） |
        | 語釈 | 式 |
        | 「〜の一種で、…なもの」という語釈の型 | 上位（extends）と限定（mod） |
        | 「→〇〇」の参照 | 式の中の参照 |

        「すこぶる Formal」にすると、次のところが変わります。
        - **検査できる:** 語釈が文法に合っているかを、型検査が機械で確かめます。
        - **循環が止まる:** ふつうの辞書は、語釈をたどると循環します（「上る」の語釈に「下る」の反対、のように）。この体系は ontology・syntax の公理で止まります。
        - **一意性が語釈の形で問える:** 二つの見出しの語釈が同じ形なら、辞書としては区別できていません。#954 の承認と入金がそれでした。語釈は名前を入れ替えるだけで同じなのに、モデルの中では、見出し語の字面がはっきり分けています。

        モデルの側から見ると、モデルは使われ方から覚えた、書かれていない自分の辞書を持っています。いまはその辞書の見出しを、表示語の字面が担っています（書き替えると区画が崩れた実験）。このプロジェクトがしていることは、その書かれていない辞書を、形式の辞書に置き換えるか、結び付けるかです。
        - #963（区画が語釈の形に沿うか）は、置き換える先の空間に、語釈の形がもともと現れているかを問います。
        - #964（専用トークンで一貫性が上がるか）は、見出しを語釈の場所に結べるかを問います。
