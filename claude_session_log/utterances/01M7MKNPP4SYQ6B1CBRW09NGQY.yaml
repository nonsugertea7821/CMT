        2. **Key Technical Concepts**
           - Layers: axiom → ontology → syntax → runtime → std, plus domains exp, subj and lang (cscl/design/claims.yaml).
           - Negation means "示されていない". Each domain declares closed or open world with `v_presume`. Law world_declared checks this.
           - Named modifiers; law named_mod.
           - Law placed_deduced (syntax law_rules):
             - Roots are nodes with no extends/form/of/holds/pre. Only ontology.continuant and occurrent qualify.
             - A concept is placed via positive mod ends (including ancestor verbs' ends), form ends, or a placed non-root parent.
             - A declaration to a root alone doesn't place. Negation places nothing.
             - Every non-verb concept must be placed.
           - Signature records: form nodes plus `d_sig_<verb>_<pos>` lang_dec_tentative decisions with content `{is: extends, from: spot, to: continuant|occurrent}`.
           - Measurement families: results JSON plus facts `v_file_of`, `v_rows_of`, `v_axis_of`, `v_value_of`, `v_spell`, `v_entry_of`, `v_metric_of`, and metric `mean_value`.
           - Observations are `{is: v_refer, from: o_x, to: {is: v_come_after|v_come_before, from: fam.cond.mean_value, to: ...}}`.
           - Hypothesis links: `{is: v_support|v_contradict, from: o_x, to: h_x}`. Status kinds: exp.hyp_untested, hyp_refuted, hyp_supported, hyp_mixed. Lang decisions: lang_dec_adopted, lang_dec_tentative, lang_dec_withdrawn.

