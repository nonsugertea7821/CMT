      text: |
        ## 事実でないコメントについて

        その考えは筋が通っていると思います。次の二分法が成り立つからです。

        - コメントが**定義に効く**なら、それは式で書かれるべきで、コメントでは足りない。
        - **定義に効かない**なら、定義のファイルに置く理由がない。

        どちらでもコメントの居場所はないので、禁止してよいことになります。今日見たことともつながります。money の「円」は表示名にしかなく、式に無かったことが過大拡張の原因でした。コメントも同じで、式に入っていない意味の置き場所になっています。コメントを禁止すると、その意味を式にするか捨てるかを、必ず選ぶことになります。

        今あるコメントを数えると、cscl.yaml・cscl/library・cscl/design・exp/src の yaml で合わせて 406 個です（文字列の中の `#` は数えていません）。claims.yaml が 252 個、exp.yaml が 56 個、syntax.yaml が 36 個で、残りは各 16 個以下です。中身はおおよそ 4 種類に分かれます。

        | 種類 | 例 | 行き先 |
        |---|---|---|
        | 意味の説明 | 「否定は『その文が示されていない』」 | 式に書く。書けないなら、式が薄い（未分化な）しるし |
        | 節の見出し | 「===== BFO の区別 =====」 | 共通の上位で導けるなら消す。導けないなら、分類が式に足りていない |
        | 経緯と根拠 | 「以前は〜」「観察: 〜」「9 件残る」 | claims の決定や観察（`d_…`・`o_…`）と、`v_ground`・`v_refer` の事実にする |
        | コードについての主張 | 「型検査が確かめる」 | 検査そのものが根拠。消すか、翻訳する側についての事実にする |

        ただ、注意が 1 つあります。今の claims は、決定や観察の中身を `display` の文章で持っています。コメントを `display` に移すだけだと、文章の置き場所が変わるだけで、式で述べたことにはなりません。どこまでを式にし、どこからを「名前としての文章」として認めるかは、別に決める必要があります。

        禁止するなら、手順は次のようになると考えています。
        1. 文法（syntax）に「定義のファイルはコメントを持たない」と書く。読む側は、yaml の字句の上でコメントを見つけたら誤りにする。
        2. 406 個を上の 4 種類に分け、種類ごとに行き先を決めて移す。数が多いので、層ごとに進める。

        ## lattice について

        深掘りするなら、具体的には次の見方になります。

        - 概念を「持つ式の集まり」として、包含と含意で並べる。形式概念分析（FCA）と同じ形で、対象が概念、属性が式です。
        - そうしてできる束を、手で書いた `extends` の木と比べる。

        そのうえで、測れる問いが 3 つあります。

        1. **残る 6 件の違反は「交わり（meet）」ではないか。** 例えば `backlog_item→hypothesis` では、backlog_item は hypothesis の式をすべて持っています。もし backlog_item の式が「今の上位の式 ∪ hypothesis の式」で尽きるなら、これは誤りではありません。2 つの概念の交わりなのに、`extends` が 1 つしか書けないので片方を選ばされている、ということになります。束では普通にあり、木では書けない形です。これが当たれば、6 件は直す対象ではなく、文法の制約（上位を 1 つしか書けないこと）が見えている、という結論になります。
        2. **名前のない結び（join）はあるか。** 2 つの概念に共通する式の集まりが、どの概念とも一致しない場合です。それは「まだ名前のない一般化」で、抽象によって概念ができる場所の候補になります。分化（下へ式を足す）の逆向きの操作です。
        3. **木の辺は束の被覆か。** sys_differentiation では、ほとんどの辺が式を 1 つ足していました。これは、木の辺が束の被覆関係（間に何も挟まらない、すぐ上とすぐ下の関係）に当たることを示しているかもしれません。

        このうち 1 は、今の違反 6 件を対象にすぐ測れて、当たり外れもはっきり出ます。

        ## 次の一手

        どちらから始めますか。
        - **A.** lattice の問い 1（6 件の違反は交わりか）を、手順を先に登録して測る。
        - **B.** コメントの禁止に向けて、406 個を 4 種類に分けて数える（まず分類だけで、まだ何も消さない）。

        両方やる場合は A を先にするのがよいと思います。B は移す作業が大きく、A の結果（交わりを書く文法が要るかどうか）が、コメントの行き先の決め方にも効きそうだからです。
