      text: |
        構成を理解しました。会社の資産とは切り離して、こちらで独自に組みます。先ほど私が作った語彙は「語の一覧＋役割＋述語」という平たい作りだったので、いただいた構造に合わせて作り直します。

        私の解釈は次のとおりです。違っていたら直します。

        - **実体のツリー**: BFO に従い、最上位を持続体（コンティニュアント）と生起体（オカレント）に分ける。
        - **関係のツリー**: 実体のツリーとは別に持つ。各関係は「どの種類の実体と、どの種類の実体を結ぶか」と、その意味を述語論理で定義する。定義は BFO の種類を使って書く。
        - **分類のツリー**: 軸と値からなる。軸は関係を抽象として見たもの、値はその具体。
        - **概念式**: これらのツリーから取った識別子をつないで書く（上位の実体＋軸と値の組）。同じ式なら同じ概念とみなす。

        この形にすると、検査が一段強くなります。仮説「AはBを下げる」に対して、「下げる」という関係が結べる種類の実体かどうかを型として検査できます。
