      text: |
        あります。「関係や動詞を表すベクトルが、そのまま射影や変換として働く」という形は、いくつかの系統で研究されています。どれも記憶からの紹介で、いま原典には当たっていません。

        **1. 知識グラフの埋め込み（Trans 系）**
        - TransE（Bordes ら 2013）: 関係はベクトル r で、頭 h に r を足すと尾 t になる（h + r ≈ t）。関係を平行移動として読みます。
        - TransH（Wang ら 2014）: 関係ごとに1本の法線ベクトル w_r を持ちます。実体をその超平面へ射影してから平行移動します。1本のベクトルが射影を決めるので、「refer はベクトルでもあり射影でもある」という読みに最も近い形です。
        - TransR（Lin ら 2015）: 関係ごとの行列で、実体を関係専用の空間へ写します。「関係が自分の部分空間を切り出す」形です。

        **2. 言語モデルの中の関係（Hernandez ら 2023, "Linearity of Relation Decoding"）**
        - 「X の首都は」のような関係を当てたとき、主語の隠れ状態から答えへの写りが、関係ごとの一次変換（W_r s + b）でよく近似できる、という報告です。
        - 関係はモデルの中で、ほぼ一次の写像として実現されていることになります。

        **3. 関数ベクトル（Todd ら 2023, "Function Vectors"）**
        - 「反対語にする」のような操作が、隠れ状態の中の1本のベクトルとして取り出せます。
        - それを足すと、モデルがその操作を行います。動詞的なものがベクトルとして存在し、同時に操作として働く例です。

        **4. DisCoCat（Coecke・Sadrzadeh・Clark 2010）**
        - 前の話にいちばん近いものです。文法を圏（コンパクト閉圏、前群文法）として書き、そこからベクトル空間の圏への関手で意味を与えます。
        - 名詞はベクトル、他動詞はテンソル（名詞2つを受け取って文の空間へ写す多重線形写像）です。
        - 「体系は圏で、モデルの表現はそこからの関手」という読みは、この枠組みがすでにはっきり立てています。

        **この体系に当てはめると**
        - TransH の形なら、`v_refer` は1本のベクトルで決まる射影として読めます。19 語は、同じ射影の向きを共有し、端に来る種類だけが違う、という予測になります。
        - Hernandez らの方法なら、19 語それぞれについて、隠れ状態での一次変換 W_r を推定できます。そのうえで、19 語の W_r が互いに似ているか、v_agree・v_measure の W_r とは違う形になるかを測れます。これは前回の「関手が図の形を保つか」を、そのまま測れる形にしたものです。

        これも、測る前に未検証の仮説として登録します。
