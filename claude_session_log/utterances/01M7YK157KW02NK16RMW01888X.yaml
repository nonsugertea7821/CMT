      text: |
        絞らずに挙げます。分野ごとに、何を体系に持ち込めるか（階層・軸・幾何・動き・一貫性）と、つながる仮説や決定を添えました。先行研究は記憶から挙げているので、登録のときに出典を一つずつ確かめます。

        **物理学**
        | 領域 | 先行研究 | 体系へのつながり |
        |---|---|---|
        | 解析力学・対称性 | Noether (1918) | 保存量は対称性から決まる。概念を「変換で変わらないもの」として書く |
        | 統計力学・相転移 | Landau (1937)、Ising 模型 | 対称性の破れとしての分化。秩序変数を軸として書く |
        | スピングラス・連想記憶 | Hopfield (1982) | 概念を引き込みの谷（アトラクタ）として見る。一貫性を谷の深さとして見る |
        | くりこみ群 | Kadanoff (1966)、Wilson (1971)、Mehta & Schwab (2014) | 抽象化は粗視化で、具体へ戻る向きは一意でない |
        | 最大エントロピー | Jaynes (1957) | 定義が足りないときに、どう補うのが偏りがないか |
        | ゲージ理論・ファイバー束 | Yang & Mills (1954) | 領域の間の写しと、その矛盾（曲率）を測る（ホロノミー） |
        | 素粒子の分類 | Gell-Mann (1961) の八道説 | 群の表現による分類。兄弟を、同じ多重項の仲間として見る |
        | 次元解析 | Buckingham (1914) の π 定理 | 体系の軸と単位（cm、円など）を、次元として整理する |
        | 結晶学 | 230 の空間群 | 対称性だけで分類を出し尽くす例 |
        | 量子の文脈依存性 | Kochen & Specker (1967)、Busemeyer & Bruza (2012) の量子認知 | 文脈で値が変わる概念と、順序の効果 |

        **力学系・工学**
        | 領域 | 先行研究 | 体系へのつながり |
        |---|---|---|
        | 分岐理論・カタストロフ | Poincaré、Thom (1972) | 上位が兄弟に分かれる点を、分岐として見る |
        | 制御理論 | Kalman (1960) | 観測から内部状態を推定できるか（可観測性）。隠れ状態の読み出しにあたる |
        | 連続体力学 | 構成則 | 同じ法則の下で、材料ごとに定数が違う（領域と、領域ごとの値） |

        **数学・幾何**
        | 領域 | 先行研究 | 体系へのつながり |
        |---|---|---|
        | エルランゲン・プログラム | Klein (1872) | 幾何とは、変換群の下で変わらないもの。概念の同一性の定め方になる |
        | 多様体・アトラス | 微分幾何 | 領域を地図（チャート）として扱う。h_signature_all_charts につながる |
        | 層（シーフ）理論 | Abramsky & Brandenburger (2011) | 局所と大域の一貫性を形式化する。一貫した認識の定義の候補 |
        | 情報幾何 | Amari | 概念の間の距離（Fisher 計量） |
        | 双曲埋め込み | Nickel & Kiela (2017) | 深い階層は、ユークリッド空間では歪む |
        | 位相的データ解析 | Carlsson (2009) | 概念の領域の穴や連結性を測る |
        | 圏論 | 関手 | h_functor_preserves_shape に直接つながる |
        | 形式概念分析 | Wille (1982)、Ganter & Wille (1999) | 対象と属性から、概念の束（lattice）を導く。体系の extends と mod に近い |
        | 凸幾何 | Gärdenfors (2000) の概念空間 | 概念を凸領域として見る。d_road_region につながる |

        **化学**
        | 領域 | 先行研究 | 体系へのつながり |
        |---|---|---|
        | 周期表 | Mendeleev (1869) | 軸による分類が、空いた場所の元素を予言した |
        | 系統的命名法 | IUPAC | 名前を構造から導く。d_cscl_display_derived（表示を式から導く）の先行例 |

        **生物学**
        | 領域 | 先行研究 | 体系へのつながり |
        |---|---|---|
        | 分類学 | Linnaeus (1735) | 属と種の階層そのもの。正解つきの兄弟の組が大量に取れる |
        | 分岐学・系統学 | Hennig (1950) | 単系統群の定義。上位概念が成り立つ条件を書く |
        | 種の問題 | Mayr (1942) ほか | 「種」に複数の定義がある。多義を領域の選びとして見る（h_ambiguity_is_region_choice） |
        | 発生 | Waddington (1957)、Wolpert (1969) の位置情報、Turing (1952) | 分化。h_round_trip_bounds_present の根拠になる |
        | 意味の発達の理論 | Saxe, McClelland & Ganguli (2019) | 粗い区別が先、細かい区別が後に分かれる |
        | 生態のニッチ | Hutchinson (1957) | ニッチを n 次元の超体積として定義する。概念を領域として見る見方の先行例 |
        | 免疫 | Burnet (1957) のクローン選択 | 自己と非自己の弁別。兄弟の弁別の類比になる |
        | 神経科学 | O'Keefe (1971) の場所細胞、Hafting ら (2005) の格子細胞、Behrens ら (2018)、Quiroga ら (2005) の概念細胞 | 認知地図の幾何 |
        | タンパク質の折りたたみ | Anfinsen、エネルギー地形 | 安定な形が谷として決まる |

        **医学**
        | 領域 | 先行研究 | 体系へのつながり |
        |---|---|---|
        | 疾病分類 | ICD | 大規模な階層分類の運用 |
        | 鑑別診断 | 臨床推論 | 兄弟の弁別そのもの |

        **認知科学・心理学**
        | 領域 | 先行研究 | 体系へのつながり |
        |---|---|---|
        | プロトタイプと基本レベル | Rosch (1975, 1976) | 階層のどの段が認知の基本になるか |
        | 事例モデル | Nosofsky (1986) | 定義ではなく事例から分類する |
        | 構造写像（類推） | Gentner (1983) | 抽象と具体の往復 |
        | スキーマの帰納 | Gick & Holyoak (1983) | 事例から抽象を引き出して転移させる。h_explain_transfers_to_apply につながる |
        | 概念の起源 | Carey (2009)、Mandler | 形づくり (B) を人間がするかどうか |
        | 概念メタファー | Lakoff & Johnson (1980) | 領域の間の写し |

        **言語学**
        | 領域 | 先行研究 | 体系へのつながり |
        |---|---|---|
        | 語彙意味論 | Miller (1995) の WordNet | 上位語の網 |
        | フレーム意味論 | Fillmore | 格の枠。体系の case_frame |
        | 分布意味論 | Harris (1954) | 語の意味を、使われる文脈から決める |
        | 形式意味論 | Montague | 式から意味を組み立てる |

        **哲学・論理学**
        | 領域 | 先行研究 | 体系へのつながり |
        |---|---|---|
        | 類と種差による定義 | Aristotle、Porphyry の木 | 体系の extends と mod の形そのもの |
        | 家族的類似 | Wittgenstein | 類と種差で定義できない概念。体系への反例の側 |
        | 意味公準 | Carnap | 語の意味を公理で与える |

        **計算機科学・AI**
        | 領域 | 先行研究 | 体系へのつながり |
        |---|---|---|
        | 上位オントロジー | BFO（Smith）、DOLCE | 体系の ontology 層と比べられる |
        | 記述論理 | Baader ら (2003) | 概念の包摂の判定 |
        | 重ね合わせ | Elhage ら (2022) | 物理のような相図で表現を描く |
        | 線形表現仮説 | Park ら (2023) | 概念を方向として見る |
        | 神経崩壊 | Papyan, Han & Donoho (2020) | 分類の末に、クラスの平均が正単体に並ぶ |

        **情報理論**
        | 領域 | 先行研究 | 体系へのつながり |
        |---|---|---|
        | レート歪み | Shannon (1959) | 抽象化を、情報を捨てる圧縮として見る |
        | 情報ボトルネック | Tishby ら (1999) | 概念を、必要な情報だけを残した要約として見る |
        | 最小記述長 | Rissanen (1978) | 定義の短さで、概念の良さを測る |

        **図書館学・法学**
        | 領域 | 先行研究 | 体系へのつながり |
        |---|---|---|
        | ファセット分類 | Ranganathan (1933) のコロン分類 | 互いに独立な軸（ファセット）で分類する。体系の軸とつながる |
        | 十進分類 | Dewey | 純粋な木による分類 |
        | 法の定義 | 法令の定義規定 | 解釈の争いが記録されているので、多義と再定義の材料になる |

        **このあと**
        1. この一覧を体系に入れます。
           - 分野ごとに先行研究を pw_ として、主張を pwc_ として入れます。
           - 入れるのは、出典と、こちらの言葉で書いた要旨と、式だけです（本文は入れません）。
           - 出典は一つずつ確かめてから入れます。
        2. 「先行研究の主張を分野ごとの領域として入れると、実験の材料の量が足りる」を、未検証の仮説として同じ PR で登録します。
           - これは d_road_region と d_consolidation_in_vector に結びます。
        3. 一度に全部は式にできないので、入れる順だけを決めます。順は、既にある仮説に直接つながるものからです（発生と分類学、形式概念分析、層理論、IUPAC、類と種差など）。
           - 一覧そのものは絞りません。

        この一覧を、あとで見返せるページにもできます。

        本線 a 識別子化、d_road_region と d_consolidation_in_vector の下（先行研究の領域の一覧）
