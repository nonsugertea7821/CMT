      text: |
        「真偽の対の欠けは、定義の書き換えを引き起こす」という仮説を登録して確かめました。結果は「支持でも反証でもない」で、この確かめからは、対称性が健全性を示すかは決まりませんでした。

        ## 登録（8df596b、実行前）
        - **仮説**：`h_symmetry_soundness`。確かめの項目 `b_symmetry_soundness` も置きました。
        - **手順**：`exp/experiments/sys_soundness.py` に固定し、結果を見る前にコミットしました。
          - 対称性は、過去の版 48a43c9 で測りました。今の置き場（cscl/library）が初めて現れた版です。
          - 書き換えは、版 933ddd6 までで測りました。対称性を主題にした作業が入る前の、main の最後の版です。
          - 単位は、動詞と限定を持つノードの 481 件です。
          - 「対がある」の意味は 2 つです。
            - 動詞：否定をすべて反転した中身を持つ、別の動詞がある。
            - 限定：同じ of・with で否定が逆の限定が、体系のどこかにある。
          - 欠陥の基準は、C1 までにノードが消えたか、定義が変わったことです。
          - 判定の基準は 3 つ決めました。
            - 支持：対の無い側の書き換えが多く、かつ片側 Fisher 検定で p < 0.05。
            - 反証：対の無い側の書き換えが、対のある側以下。
            - どちらでもない：それ以外。

        ## 結果（89e4e41）

        | 単位 | 対なし | 対あり |
        |---|---|---|
        | 全体（主の判定） | 17/402 = 0.042 | 2/79 = 0.025 |
        | 動詞だけ | 1/41 = 0.024 | 1/13 = 0.077 |
        | 限定だけ | 16/361 = 0.044 | 1/66 = 0.015 |

        - 全体では向きは合っています。ただし p = 0.37 で基準の 0.05 に届かないので、判定は「どちらでもない」です。
        - 仮説の状態は、支持の観察と反する観察の両方を付けて「支持と反証の両方がある」にしました。
        - 動詞だけでは向きが逆、限定だけでは向きが合います。どちらも件数が少なすぎて、何も言えません。

        ## 登録した手順からのずれ（1 件）
        - 登録した版のコードには誤りがありました。`not x in y` は Python では `not (x in y)` と読まれるので、限定に対のあるノードが 0 件になっていました。
        - そのときの値は 0.038 と 0.077、p = 0.91 で、判定は「反証」でした。
        - 結果を見た後で直したので、この点は登録どおりではありません。直したのは、手順の説明（逆の否定を探す）にコードを合わせることだけです。
        - 直す前の値も、主張の注と PR の説明に残しました。

        ## この確かめの弱さ
        - 期間が約 1 日で、書き換えは 481 件中 19 件しかありません。もとから差を検出しにくい設計でした。
        - 「書き換え＝欠陥」は、この確かめのための取り決めです。拡張のための書き換えも数に入っています。
        - 期間内の b8d8c34（否定の意味の変更）は、対称性に近い動機の変更かもしれません。
        - 測ったのは同時に起こることだけで、「引き起こす」かどうかは示していません。

        ## 記録したもの
        - 「偽と述べる」読み方の使用数：動詞の原子でも 0 件でした（`o_sys_atom_no_stated_false`）。限定の 0 件と合わせて記録しました。
        - (a)〜(c) は観察として記録していません。
          - (b) の「設問文で関係が決まっているか」は、私が文を読んで分けた結果で、機械的に数えていないからです。
          - (a) と (c) は、コードの作り（runtime が限定から所属を決めない、型検査の `world_declared`）から 0 になる件数です。

        型検査・実行の検査・世界の対称性の確認・issue 同期の確認は、手元ですべて成功しています。PR #93 の説明も更新しました。CI は 1 本成功、もう 1 本は実行中です。

        もっと強い確かめにするには、今日の版で対称性を測っておき、これから先の書き換えを数える方法があります。ただし、書き換える作業がこの仮説を意識すると、結果が混ざります。
