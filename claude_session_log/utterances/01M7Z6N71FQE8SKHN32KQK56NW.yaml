      text: |
        調べたところ、割合は完全に書けないわけではありませんでした。ただ、形だけあって中身がない、という状態です。

        | 書けるか | 中身 |
        |---|---|
        | 書ける | 個数（`at: {count: …}`）、量（`amount`）、順番（`order`）、「ある」「すべて」の数量化（`some`・`all`） |
        | 形だけある | 割合（`ratio`）。軸の種類としては定義されていて、正答率などの測定値には使っています。しかし仮説や概念の式の中で `at: {ratio: …}` と書いた例は一つもありません。型検査器も、個数のときのように母集団を数えて確かめることをしません。分母を何にするかを書く場所もありません |
        | 書けない | 密度（極限）。「ほぼ全部」と「全部」を言い分ける形がありません |

        つまり、測った結果は割合で記録しているのに、仮説は「全部か無しか」でしか書けないという食い違いがあります。体系側の mixed 7 件は、この食い違いがそのまま出たものと読めます。

        ご指摘どおり、この欠けそのものを仮説として登録しました（#695、`h_mixed_from_missing_ratio`：mixed の仮説は、修飾の中の値の指定に依存する）。確かめ方の案はこうです。
        - 7 件を割合を使って書き直し、記録済みの観察だけで支持か反証かに決まれば支持。
        - 書き直しても割れるなら反証。その場合、原因は条件の変数のほう（#692・#694 の筋）にあることになります。

        書き直すには、分母を式で書く形、つまり文法の変更が要りそうです。そうなると自動マージではなく、手で見てもらう PR になります。前回聞いた「割合を書ける形を足すか」は、この仮説を確かめる流れの中で決めることにしたので、もう答えは要りません。

        ロードマップの位置：#695 は d_cscl_display_derived（表示語を式から導く）に結んだ登録です。#694 はテストのやり直し待ち、E35 はまだ実行中です。
