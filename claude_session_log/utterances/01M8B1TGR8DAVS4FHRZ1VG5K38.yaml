        体感では、あと3段です。うまく進めばセッションの時間で半日〜1日、途中で反証が出て設計を差し替えることになれば2〜3日くらいと見ています。根拠の薄い見積もりです。

        識別子化そのものに直接つながる3つの仮説は、main で見るとどれもまだ確かめていません。

        1. **追記専用の宣言でぶら下がりが起きるか**（`h_dangling_by_append_only_declaration`）
           - 「実行可能にする」仮説群で詰まった「内輪で追記専用になっている」話の続きです。
           - 宣言した範囲を固めた（`std.v_freeze`）ときに、参照先のない名前（ぶら下がり）が生まれるかを確かめます。
        2. **識別子が宣言の範囲によらずに決まるか**（`h_identifier_free_of_declaration`）
           - 1 が片づけば、識別子をどこで宣言したかに引きずられずに決められるかを見られます。
        3. **識別子を中身から決められるか**（`h_identifier_by_genus_differentia`）
           - 本題です。識別子を「何の一種か（extends）・何で区別されるか（mod）・何を持つか（holds）・どこからどこへの関係か（from・to）」だけから決められるかを確かめます。
           - 展開で決める案（`h_identifier_by_expansion`）と、構造が同じなら同じとみなす案（`h_identifier_by_bisimulation`）は、どちらも反証されています。残っているのがこの案です。

        この数時間やっていた検査器の法則化（#917〜#926）は、別の道（`d_road_checker`）の仕事でした。3 で中身から決めた識別子を検査器が式として扱えるようになる、という形で間接には効きます。ただ、上の3つを前に進めたわけではありません。

        **見積もりの内訳**
        - 1 と 2 は軽い実験で、モデルは使わず検査器で確かめられます。1つにつき、事前登録・実行・マージまで数時間です。
        - 3 は、作った識別子で体系全体を書き直して検査が通るかまで見ます。1と2より重く、#925 と同じくらいの規模になりそうです。
        - いちばん時間を食いそうなのは、どれかが反証されて設計を差し替える場合です。展開と構造の一致の案はどちらもそうなりました。

        識別子化がほかの仮説の前提だと言われていたので、順番を入れ替えます。次は `h_spot_kind_checks_as_law` ではなく、1 から始めます。
