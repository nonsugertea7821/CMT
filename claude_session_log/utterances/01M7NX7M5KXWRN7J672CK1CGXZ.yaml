        2. Key Technical Concepts

        **Verb order and tops**
        - Verb extension order = ends inclusion + formula (atom-set) inclusion.
        - any→any with formula F is the parent of every verb whose formula contains F.
        - `ontology.p` is the top relation.
        - `any` = the range of self. It is not definable from same, because same(x,x) ≡ exists and `any` includes non-existents. It is now in signature.

        **Confusion and its dual**
        - Confusion: one spelling refers to two things. The new law one_spelling (r_written facts) catches it.
        - Dual: one thing is named separately by the code and by the system with no link between them. Name mutation can't see this; definition mutation can.

        **Mutation tests**
        - Name mutation is one-sided:
          - changed ⇒ the code depends on the name.
          - unchanged ⇏ it doesn't.
        - Grammar sections now declare the keywords the code reads. The checkers verify equality between their own keyword sets and grammar.

