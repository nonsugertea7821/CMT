      text: |
        言い過ぎでした。さっきの「とても遅くなりがち」は、核を**解釈器**として作った場合の話です。核を**翻訳器**として作れば、速さの話は別になります。

        **解釈器として作る場合（遅くなりやすい）**
        - 実行のたびに、高い段の操作を原始的な命令へ一つずつたどります。
        - たどる手間が毎回かかるので、実行そのものが遅くなります。
        - 遅さは数倍から数十倍が目安です。

        **翻訳器として作る場合（遅くなるとは限らない）**
        - 高い段の操作を原始的な命令へ展開するのは、翻訳のときに一度だけです。
        - そのぶん、お察しのとおりコンパイルは遅くなります。
        - 実行の速さは、核の小ささではなく、展開したあとの命令列のよさで決まります。
        - よい命令列を作る最適化（無駄な計算を消す、まとめる、置き換える）は、ほとんどが「この形をこの形に書き換えてよい」という規則です。機械に依存しないので、核の上の体系の中に書けます。
        - 機械に依存するのは、命令の選び方とレジスタの割り当てぐらいです。そこは核の側に残ります。

        実例もあります。Chez Scheme は、ほとんどを自分自身の言語で書き、機械ごとに違う部分は小さく分けてあります。それでいて、生成するコードは速いことで知られています。LLVM も、機械に依存する部分を後段に閉じています。

        **CSCL の検査器に特有の点**
        検査器の重さの大半は、機械語かどうかではありません。事実の照合（どの文とどの文が合うか）を、どんなデータ構造で引くかで決まります。たとえば、索引を持つか、毎回全部をなめるかの違いです。これはアルゴリズムの問題なので、体系の中で規則として書けば、翻訳の核とは別に改善できます。

        まとめると、こうなります。
        - コンパイル（翻訳）は遅くなる。
        - 実行の速さは、核の小ささとは切り離せる。
        - 速さを決める最適化の規則は、体系の側に置ける。

        最後の点は、h_small_translation を測るときの見る所にできます。体系の側の最適化が効くかは、別の仮説として測れる形になったら登録します。
