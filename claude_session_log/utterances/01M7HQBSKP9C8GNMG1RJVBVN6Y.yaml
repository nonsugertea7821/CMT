      text: |
        できます。三つの要件（Claude の説明を GitHub で読める、定義の正本は exp.yaml、exp と cscl をタグで分ける）は両立します。設計案です。

        **issue の本文は二段に分けます**
        1. **説明（Claude が書く）：** 仮説が何を主張しているか、なぜ調べるのか、今の根拠から何が言えるか（言い過ぎない）を、自然言語で書きます。これは表示なので、正本ではありません。
        2. **定義（exp.yaml から機械的に生成）：**
           - 仮説の識別子、中身（例：「CSCL が 定義の書き換えへの追従 を 上げる」）、状態
           - 支持する観察と反する観察、それぞれの値、適用範囲
           - 定義のハッシュ

        **正本を exp.yaml に保つ仕組み**
        - 同期スクリプトは、定義の段だけを毎回作り直し、説明の段には触りません。
        - 定義のハッシュが前回と変わっていたら、`説明が古い` ラベルを付けます。そのときは私が説明を書き直す、という流れです。説明が定義から黙ってずれていくのを防げます。
        - issue の識別には仮説の識別子を使うので、二重には立ちません。

        **ラベル**
        - 状態：`未検証` `支持` `反証` `混合`。型検査器の判定をそのまま使います。支持と反証は close、未検証と混合は open にします。
        - 側：`exp` `cscl`

        **exp と cscl の分け方で一つ確認したいこと**
        - 今の 55 件は、すべてモデルについての仮説で、exp 側です。h_cscl_raises_following のように CSCL が出てくるものも、「CSCL で与えるとモデルの追従が上がるか」というモデルの実験です。
        - cscl 側の仮説（言語の設計についての主張。たとえば「閉世界で読めば型の誤りを見落とさない」）は、まだ一つも書かれていません。
        - 分け方は二案あります。
          - (a) 仮説が参照する語で自動的に決める。axiom と std の語だけなら cscl、exp の語を含めば exp。
          - (b) cscl 側の仮説は cscl の領域のファイルに書き、置き場所で決める。
        - (b) にする場合、「定義の正本は exp.yaml」という条件を「定義の正本は体系（exp.yaml と cscl 側のファイル）」に広げることになります。

        **進め方**
        1. 同期スクリプトを書く（exp 側。出力は下書きの一覧で、GitHub にはまだ出さない）。
        2. 55 件の説明を私が書く。
        3. 下書きを見てもらってから、ラベルと issue を作成する。55 件の issue は GitHub 上に残るので、ここは確認してから行います。

        cscl 側の分け方は (a) と (b) のどちらにしますか。
