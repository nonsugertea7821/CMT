      text: |
        了解です。シンボル（コード中で定義され、参照される名前付きの実体）として読み直します。結論の方向は同じで、根拠はむしろ強くなります。

        ## 識別子とシンボルの違いが効く点

        - **識別子の選定**は、新しく付ける名前の問題でした。
        - **シンボルの選定**には、既存のシンボルのうちどれを参照するかも含まれます。たとえば、ある概念に対応するのが `confirm` なのか `finalize` なのかを選ぶ場面です。

        シンボルには定義があり、コンパイラや言語サーバーが参照先を一意に解決します。したがって次のことが言えます。

        - **概念とシンボルの対応は、厳密な関係として持てます。** 型付きグラフに「この概念を実装するシンボル」という関係を置けば、選定はグラフを引く操作になります。
        - **検査も厳密にできます。** 生成されたコードの参照が、意図した概念のシンボルに解決されるかは、機械的に判定できます。語彙リントより一段確かな検証です。

        ## 懸念はシンボルの方が強く当てはまる

        シンボルの意味は、コード上の定義が正です。そこに自然言語側の概念ベクトルを足すと、定義が示す意味と食い違う方向へ表現を動かすおそれがあります。型やスコープといった言語固有の情報も同じ位置に載っているので、混ざって揺れるという懸念はそのとおりだと考えます。

        ## 分担の見立て

        | 仕事 | 担う側 | 理由 |
        |---|---|---|
        | 概念に対応するシンボルを選ぶ | 記号側（グラフと用語サーバー） | 対応関係を厳密に持てる |
        | 参照が正しい概念に解決されるかの検査 | 記号側（言語サーバーによる解決） | 機械的に判定できる |
        | その事例がどの概念に当たるかの解釈 | ベクトル、または文章 | 厳密に判定できず、モデルの解釈に頼る |

        シンボルの選定は、あなたの言い換え側の構成がそのまま適任です。ベクトルが役に立つとすれば、選定の一段手前の「いま書こうとしている処理は、どの概念の話か」を揃える部分に限られると考えます。

        ## 確かめるなら

        前回挙げた実験は、次のように読み替えます。

        1. 概念に対応する既存シンボルが複数の候補の中にある状況でコードを書かせ、正しいシンボルを参照する率を、文章で渡した場合とベクトルの場合で比べる。
        2. シンボルの位置にベクトルを加えたとき、生成されるコードが壊れないかを見る。

        E4 の次に入れるかどうかは、前回と同じくあなたの判断を待ちます。
