      text: |
        前回の報告からの差分と、観察から読める含意をまとめます。

        ## 前回の報告からの差分

        - E3-expr は残り4語（週・遅延・都市部・顧客）が終わった時点で報告していました。そのあと「魚類」の学習と評価が終わり、結果を記録しました。
        - 記録のコミット（E10・E11・E3-expr）をブランチにプッシュしました。その中身は次のとおりです。
          - spec/exp.yaml に e10・e11 の測定の族を足しました。e3 には、概念式で教えた実行（L8_exprdefqa）を足しました。
          - 観察を4つ足しました（73→77）。
          - h_cscl_raises_following を「未検証」から「支持と反証の両方がある」に変えました。
          - 概念式に関わる4項目を「済み」にしました。
        - 10分ごとの再開と、1時間ごとの継続確認は止めました。

        ## 観察から読める含意

        設問は各群24問しかなく、モデル1つ・層1つ・1回ずつの実行です。差の 0.04〜0.08 は1〜2問ぶんなので、下の読みは傾向にとどまります。

        **1. 概念式は、ベクトルを教える元としては、日本語の定義文とほぼ同じに使えそうです**
        - ベクトルだけの条件の正答率です。

        | 教えた定義 | 食い違う設問（G2c） | 対照の設問（G2k） |
        |---|---|---|
        | 概念式 | 0.75 | 0.92 |
        | 日本語の定義文 | 0.79 | 0.92 |

        - 「定義の正本は CSCL に置き、そこからベクトルを作る」という流れ（d_source_of_truth_in_cscl と d_verdict_by_vector）と食い違いません。

        **2. 概念式をそのまま文脈に置いても、日本語の定義文に勝ちません**
        - E10 の正答率です。

        | 条件 | 食い違う設問（G2c） | 対照の設問（G2k） |
        |---|---|---|
        | なし | 0.38 | 0.75 |
        | 日本語の定義文 | 0.58 | 0.75 |
        | 概念式 | 0.58 | 0.67 |

        - 食い違う設問では日本語と同じだけ効きますが、対照の設問では「なし」より下がります。
        - 語そのもの以外の表示名を外すと、さらに少し下がります（0.58／0.62）。このモデルは記号の構造よりも、表示名の自然言語の手がかりを使って読んでいるようです。

        **3. 概念式の文とベクトルを同時に与えると、対照の設問で崩れます**
        - E3-expr で両方を与えると、対照の設問が 0.58 まで下がります。ベクトルだけなら 0.92、日本語の定義文で教えた場合の両方なら 0.83 です。
        - 推論のときにモデルへ見せるなら、概念式ではなく、そこから変換した自然言語の文かベクトルのほうがよさそうです。これは d_rendered_text_is_derived（自然言語の文は正本から作る）の方向と合います。

        **4. 1.5B のモデルは概念式を書けず、書かせると悪くなります**
        - E11 で書かせた453行のうち、検査を通ったのは15行（約3%）でした。
        - 先に書かせてから答えさせると、食い違う設問で 0.54 から 0.42 に下がりました。
        - E9 で、途中経過を書かせると付け替え型の再定義への従いが下がった結果とも合います。
        - CSCL を「モデルが考えるための書き方」に使うのは、このモデルの大きさでは成り立っていません。ただし、モデルが書けるかどうかの仮説（h_model_can_write_cscl）は、通過率を表す指標がまだないため記録上は「未検証」のままです。

        **まとめ**
        今回の結果からは、CSCL を人と体系の間の正本として置き、モデルにはベクトルか自然言語の文に変換して渡す、という分担が妥当に見えます。モデルに CSCL を直接読ませたり書かせたりするのは、今のところ効果がないか、逆効果です。

        ## 確かめるなら次の一手

        - 大きいモデル（例えば 4B）で E10・E11 をやり直し、概念式が読めないのがモデルの大きさのせいかを確かめる。
        - 設問を増やすか、乱数の種を変えて複数回走らせ、1〜2問ぶんの差が本物かを確かめる。
        - 指標の計算方法を足して、E11 の検査通過率を観察として記録する。
