        はい、依存します。

        モデルが書いた式の正しさは、型検査器で判定します。そのため検査器が誤った式を通したり、正しい式を落としたりすると、測った値はモデルの力ではなく検査器の性質を写してしまいます。「型検査の返しで書く力が上がるか」（#90）は、返しそのものが検査器の出力なので、依存は二重になります。体系は今も変わり続けているので、測る時点の検査器の版によっても値が変わりえます。

        この指摘を「書いた式の正しさは型検査器に依存する」という仮説（`h_writing_depends_checker`）として登録し、PR #264 を立てました。登録だけなので、自動マージに乗るはずです。

        トリアージは次のように直します。
        - **B（モデルが式を書けるか）を、E（体系の内側の検査）の後に回します。**
        - B を測るときは検査器の版を固定し、その版の健全性の観察を範囲として添えます。

        18:05Z の周回はすでに動き出していますが、渡した指示は直す前の順のままです。次の周回の予約から、直した順の指示を渡します。最初に扱うのは A の先頭（#35、適用で学習したベクトルが説明に転移するか）なので、今回の周回はそのまま進めて問題ありません。
