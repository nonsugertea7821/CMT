      text: |
        できると思います。これは自己ホスティングの定番の作り方そのものです。

        **仕組み**
        - 機械語を直接知っている部分を、ごく小さな核に閉じ込めます。
          - 核は、ビット列、記憶（番地と値）、少数の命令（読む・書く・足す・比べて飛ぶ）を、実行器の言語に写すだけのものです。
        - それより上のもの（型検査器や推論の規則）は、すべてこの核の概念で書きます。
        - 実例もあります。
          - 数百バイトの手書きの機械語から始めて、C コンパイラまで段階的に立ち上げる試み。
          - Forth や Lisp の小さな評価器を核にして、残りをその言語で書く作り。

        **CSCL に当てはめると**
        - 二進数・記憶・命令を体系の概念として詰めます。
        - 「検査器の規則 → その概念 → 機械語」という二段に分けると、最後の一段だけが翻訳になります。
        - 今の検査器は、法則を規則（前提と、導く文・求める文）で書く方向に進めています。named_mod もそうしたところです。規則の評価器は小さく作れるので、この方向とよく合います。

        **ただ、注意点が三つあります**
        1. 小さくなるのは翻訳の「論理」です。命令の符号表、呼び出しの規約、OS とのやりとりは量が多いです。ただ、これは規則ではなく表（事実）として書けるので、核を大きくはしません。
        2. 核をすべて原始的な命令に落とすと、とても遅くなりがちです。小ささと速さは引き換えになります。
        3. 最初の核は、体系の外のもの（今の Python や手書き）で動かすしかありません。完全に体系の中だけで閉じることはできず、核の正しさは別に確かめる必要があります。

        この見込みを、未検証の仮説 `h_small_translation`（型検査器は、実行器が実行する言語に直に依存しない）として登録しました。PR は #430 です。#426 の「CSCL は翻訳を要する」と同じ決定（`d_cscl_display_derived`）に結んであります。概念を足さない登録だけなので、自動マージに乗るはずです。

        確かめ方としては、二つの数を見るのがよいと考えています。
        - 検査器が使う原始的な操作（集合・照合・比較など）が、いくつの概念に還元できるか。
        - そのうち、機械語に触れるものがいくつあるか。

        ロードマップ: a（識別子化）を進めつつ、自己ホスティングの見込みを仮説として一つ足した。
