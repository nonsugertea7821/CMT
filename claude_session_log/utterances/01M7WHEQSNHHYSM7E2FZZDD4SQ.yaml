      text: |
        **h_check_immune_parts は反証でした（#496）。訂正が入っているので、手で見てください。**

        **やったこと**
        - 部分のファイルを読む仕組みは、session_log のブランチの検査器にしかなく、main にはありませんでした。
        - そこで、写しの検査器にその仕組みを移し、exp.yaml の測定の族 217 個を `exp/src/families/<族>.yaml` に分けて比べました。

        **訂正**
        - 1回目は、移植のやり方を私が間違えていて、検査器が自分を呼び続けて止まりました。
        - 手順に訂正を書き足してやり直しました。1回目の結果のファイルも残しています。

        **結果**
        - 仕組みを移すだけの対照は、元と完全に同じでした。
        - 分けた版では、exp.yaml が 8601 行から 1707 行になりました。部分のファイルは最大でも 144 行で、私でも丸ごと読める大きさです。
        - 法則と関係の数は同じでした。ただ、元と違う点が 2 つありました。
          - 文法に `parts` という語がなく、エラーが 1 件出ます。
          - 関係のハッシュが変わりました。結果のファイルを書かない下見で見たところ、差はすべて事実の識別子でした。検査器が事実を「ファイル名＋何番目か」で名づけているので、並べ替えると番号がずれます。

        **含意**
        - 分けても中身は変わりません。
        - ただ、検査器は事実を「位置」で名づけています。これも、名前（置き場所）で読んでいる例の1つです。
        - 本体を分けるには、少なくとも次の 2 つが要ります。
          - 文法に `parts` を足す。
          - auto_merge の対象ファイルを広げる（いまは claims.yaml と exp.yaml だけです）。
        - 事実の識別子を中身で決めれば、関係の名前もファイルの並びに左右されなくなります。

        この 2 つの解き方（文法に parts を足す、事実を中身で名づける）は、次の周回で仮説として登録します。

        **ロードマップ:** わき道（運用）です。分けたあとの読みやすさは、h_model_reads_by_name の対策にもなります。
