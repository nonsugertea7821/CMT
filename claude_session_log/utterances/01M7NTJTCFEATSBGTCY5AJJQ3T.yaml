        2. Key Technical Concepts

        **Signature and tops**
        - Signature is {self, same}.
        - Continuant = ∀t,t'.same(self_t, self_t').
        - Occurrent (D2) = ¬same(frame_t, frame_t+1), i.e. pre/post verbs.
        - Proposed top_placement laws:
          - T1: individual kinds are under continuant.
          - T2: pre/post verbs (self or ancestor) are under occurrent.
          - T3: their from/to are under continuant.
        - T1–T3 pass except that v_compute needs to: continuant.

        **Confusion**
        - Definition: F (the verb's pre/post about position p) fails for b, but holds for a fresh c with R(c,b). The use is then v∘R; writing v∘R under the name v is a confusion.
        - Leibniz's law in two directions:
          - indiscernible ⇒ same: the existing "動詞の式が同じ" check.
          - same ⇒ indiscernible: confusion, now covered by the runtime law no_confusion.

        **Speech analysis**
        - 発話 = act (occurrent, depends on speaker) vs product (continuant).
        - Compute's product depends on its input; design's product refers to a thing to be made; speech's product refers to content and has a hearer.
        - An LLM output is computing and speaking overlapping in one event.

        **Differentia (種差)**
        - Verb formula = genus + differentia.
        - 12 groups of roots share identical state formulas and are separated only by:
