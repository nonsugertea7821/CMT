      text: |
        該当すると考えます。指摘されて式を見比べると、役割と再定義は、同じ構造を別々の場所に書いていました。

        ## 式の上での対応

        今回の書き直しでは、次のように書いていました。

        ```
        傾向性   = 実現可能体のうち、担い手の質に依存するもの
        役割     = 実現可能体のうち、担い手の質に依存しないもの
        元の意味 = 傾向性のうち、学習で得られ、重みに依存するもの
        再定義   = 定義のうち、元の意味と一致しないもの
        ```

        並べると、対応がはっきりします。

        | 担い手の成り立ちに由来する | 外から与えられる |
        |---|---|
        | 傾向性 | 役割 |
        | 元の意味 | 再定義された意味 |

        元の意味は、すでに傾向性として書いていました。その対になる「再定義された意味」は、担い手の成り立ちに由来せず、ある場面で外から与えられるものです。これは役割の定義そのものです。再定義とは、語に役割を与えることだった、と言えます。

        ## 役割が書けなかった理由

        「正本」「要因」「指標」「変更の固定先」が書けなかったのは、それらが「何であるか」ではなく「この場面で何として扱うか」を指しているからでした。

        - **正本**: この設計では、この記述を、他の記述が導かれる元として扱う。
        - **要因**: この実験では、この質を、動かす条件として扱う。
        - **指標**: この実験では、この質を、測る量として扱う。

        どれも「この場面では、X を Y として扱う」という形です。一般語の再定義「このプロジェクトでは、社員とは雇用契約を結ぶ全員を指す」と同じ形をしています。

        私は役割を担い手の条件として書こうとして失敗しましたが、担い手の性質からは出てこないのが役割なので、書けないのは当然でした。

        ## 書き方に欠けていたもの

        欠けていたのは「どの場面でのことか」です。いまの書き方には、定義が成り立つ範囲を指定する手段がありません。再定義も役割も、場面を伴ってはじめて意味を持ちます。

        残っていた問題のうち、少なくとも役割の 4個は、これで1つの欠落にまとまります。そしてそれは、語彙の側の問題ではなく、この計画が最初から扱っている問題そのものでした。

        ## 実験との対応

        この対応で読み直すと、これまでの結果が同じ言葉で言えます。

        - **文章での注入**は、文脈の中で役割を与える操作です。4B モデルでは、新しい語には完全に従い（1.00）、一般語の再定義は直前に置いても 0.75、他の定義が前に並ぶと 0.46 でした。傾向性を持たない語には役割がそのまま通り、傾向性を持つ語では、役割が傾向性に負けています。
        - **概念ベクトル**は、文脈ではなくモデルの内部に手を入れます。役割を与えるというより、傾向性の側を動かす操作に近いと言えます。
        - **規則型と付け替え型**の違いは、与える役割の値が関数か固定値か、でした。

        「再定義しても従わずに揺れる」という最初の問題は、「与えた役割が、元からの傾向性に対して安定しない」と言い換えられます。

        ## 確かめていないこと

        これは式の対応からの推論で、試験はまだしていません。場面を指定する書き方を加えたときに、役割の 4個と再定義が同じ形で書けるかを確かめる必要があります。書けなければ、対応は見かけだけだったことになります。

        ## 次の手

        書き方に「どの場面でのことか」を加え、役割 4個と再定義を同じ形で書き直して、検査にかけます。あわせて、残りの「動詞の産物」3個を、第三のものの位置を使って書き直します。
