        ご記憶のとおりでした。仮説の状態の検査は tc ではなく ec（`exp/src/exp_check.py`）にあります。ec は、状態のノードの式から「支持がある／反証がある」の決まり方を読み、根拠の有無と照らしています。私は下調べを tc だけで行い、「照らしていない」と間違って登録していました。

        - **ec で試し直した結果:** 未検証の仮説に `v_support` を足すと、ec は「根拠の有無からは hyp_supported になる」という誤りを出しました。
        - **記録:** 訂正は実験スクリプトの説明と commit に残し、push しました（b431b98）。

        **sys_draw_on の結果:** 登録した判定（tc の誤り 0、かつ新しい違反 0）では外れです。tc の誤りが 1 つ出ました（新しい違反は 0）。誤りは足した着想の関係からではなく、読みの中身に足した語から出ています。

        - **着想の関係（`v_draw_on`）:** これ自体は誤りも新しい違反も出していません。登録していない追加の確認として after の状態で ec も走らせました。3つの仮説に状態の誤りは出ず、着想は支持として数えられていません。
        - **誤りの中身:** 法則 named_mod が、私の作った「浅い端だけの定義」と既存の「役割（role）」が同じ限定を足していると指摘しました。私の式には「浅い」がどこにも入っておらず、式の上では役割と区別できなかったわけです。体系には深さを書く語がありません。
        - **中身に足した3語:** どれも自前の式が1つだけの薄い語でした。意味は display に頼っており、見込みどおりです。
        - **3つ目の読み（syntax は ontology の意味を使っている）:** 既存の語だけで書けました。ただし、「組み替えの本体は syntax の側」というニュアンスは書けていません。

        体系のファイルは操作の前に戻してあります。誤りのある状態を残さないためです。

        **解釈:** 読みの形（仮説・着想・未検証の状態）は今の体系で書けて、ec の検査も通ります。書けないのは中身のほうです。中身の語を作ると薄くなり、法則が既存の語との区別のなさを見つけます。

        display は借用書、という話がそのまま出ました。仮説の中身を足すたびに、式で返せない借りが増えます。

        次の進め方は二通りあります。
        - 深さのような、中身に要る語の式を作る。
        - 中身は display に借りたまま、形だけ式にして claims のコメントを移す。この場合、named_mod の誤りを避ける書き方が要ります。

        どちらにしますか？
