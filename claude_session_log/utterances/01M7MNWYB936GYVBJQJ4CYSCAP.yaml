      text: |
        (ii) を正当化する観察は、いまはありません。いま手元にある観察を挙げると、どれも (ii) を支える証拠になっていません。

        ## 手元にある観察が示すこと

        **1. `o_sys_mod_no_stated_false` = 0**
        - 示しているのは「限定に『偽と述べる』読み方がない」ことだけです。
        - 「ないから入れるべき」と言うには、「σ で閉じているべきだ」という前提が要ります。それは対称性の仮説であって、観察ではありません。

        **2. 「偽と述べる」は、文の側でも使われていない**
        - いま調べると、`val: {truth: false}` は pre・post・事実のどこにも使われていませんでした（0 件）。
        - 文法にはある読み方なのに、体系はどこでも必要としていません。
        - これはむしろ、いまの体系に (ii) は要らない側の観察です。

        **3. subj の 7 件は「偽の意味に読める」**
        - この根拠は、「日曜でない日」「席にいなかった人」などの表示名だけでした。
        - 表示名は人が付けた言葉です。それに体系がどう振る舞うかの観察ではありません。前回この点を根拠のように書いたのは言い過ぎでした。
        - また、subj は `exp/src/subj.yaml`、つまり実験の題材です。lang の領域ではありません。

        ## 正当化に要る観察

        「述べられていない」と読む場合と「偽」と読む場合で結果が分かれ、体系のどこかが「偽」の結果を必要としている。そういう箇所を見つける必要があります。候補は 3 つです。

        - **(a) 実行の記録（runtime）**：制限のノードの所属で歩みや法則の結果が変わり、その記録が「偽」の読みでしか通らない例。
        - **(b) 実験の正解（exp）**：subj の制限のノードを使う設問で、正解が「記録のない場合を除く」前提で作られている例。例えば、曜日の記録がない日を営業日に数えない正解。
        - **(c) 法則**：開世界の領域で、限定から「R は偽」を結論に使っている法則。いまの法則は否定を前提にするとき、閉世界でだけ働くので、ここには出ないはずです。

        (a)〜(c) が 1 件も見つからなければ、観察は (ii) を支えないことになります。そうなれば、体系の制限は意図どおり「述べられていない」で一貫していると言えます。見つかれば、その件数が (ii) の根拠になります。

        `val: {truth: false}` の使用数（0）を観察として記録したうえで、(a)〜(c) を数えますか。
