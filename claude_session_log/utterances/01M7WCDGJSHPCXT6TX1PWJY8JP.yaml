      text: |
        `h_rule_roles_by_named_mod` を確かめ、支持でした（PR #484）。

        **何を試したか**

        前回の反証は、役割の名詞（前提・導く文・求める文）を名前のない中身で書いたことで起きていました。今回は、法則が求めるとおり中身に名前をつけて書き直しました。足したのは「前の状態の指定へ述べる」と「どのステップでも成り立つ状態の指定へ述べる」の2つです。

        **結果**

        - 誤り（errors）は 0 件で、法則の集まりも元と同じでした。
        - 型検査は、動詞の名前を使わずに、名詞の式から役割を 3 つとも読めました。
        - 法則を評価した中身の差も 0 でした。残った差は、定義の参照の行 10 行と、足した名前そのものの行だけです。
        - 前回の除き方の穴（名前のない中身の行が漏れる）は、今回は事前登録で塞いでおきました。

        **解釈**

        前回落ちた 3 件の原因は、中身に名前がなかったことだけでした。体系の法則に従って名前をつければ、型検査は役割を式から読めます。

        写しの上では、型検査が持つ動詞の名前の並び（`RULE_VERBS`）は要らなくなりました。ただし、これを実際の体系に入れると検査器の変更になるので、別に手で見てもらう扱いにします。

        **含意**

        新しい仮説は立てていません。文法に残っている動詞の名前の扱いは、本線で次に来る `h_checker_words_by_formula`（#300）がそのまま受け持ちます。

        前提と実行器の「前の状態の確かめ方」は、今回同じ名前の中身を持ちました。とはいえ、これは `h_premise_agrees_pre_rule` の手がかりにとどまり、一致するかは別に確かめます。

        #484 の Draft を外したので、確認とマージをお願いします。

        ロードマップ: 本線 a（識別子化）で、法則の役割を名前でなく式で読む段が、写しの上で通りました。次は `h_frame_both_sides` か `h_checker_words_by_formula` に進みます。
