      text: |
        体系を起点に置き直し、言語の名前を「体系制御言語」に改めました。検査は通っており、プッシュ済みです。

        ## 変えた点

        前回は言語を先に置き、体系を「その言語の体系」として書いていました。順序が逆でした。体系がまずあり、言語はそれに制御されるものです。

        ```
        体系         = 情報のうち、概念式を複数、部分として持つもの
        体系制御言語 = 言語のうち、体系に依存するもの
        概念式       = 定義のうち、体系の部分であり、体系制御言語で書かれたもの
        ```

        - 体系の式は、言語に触れなくなりました。言語がなくても体系は定義されます。
        - 言語は、体系への依存で定義されます。「制御される」を「依存する」で書いています。
        - 「制御体系言語の体系」というノードは無くし、「体系」1つにしました。

        ## 実物との対応

        | 語 | 実物 |
        |---|---|
        | 体系 | `spec/ontology.yaml` の全体 |
        | 体系制御言語 | そのファイルの書き方 |
        | 概念式 | その中の、1ノードぶんの記述 |

        ## 留保

        - **「制御される」を「依存する」と書いた点。** いまの語彙には「制御する」に当たる動詞がありません。言語が体系に依存する、という書き方は、体系がなければ言語が成り立たないことは表せますが、体系が言語の書き方を決めている、という向きの強さは表せていません。専用の動詞を立てるべきかは、判断がつきません。
        - **体系が持つもののうち、概念式以外。** 基礎の関係と分類の軸が体系の一部であることは、まだ式に入っていません。
