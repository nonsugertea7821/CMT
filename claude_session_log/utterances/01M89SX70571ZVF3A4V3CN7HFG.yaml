      text: |
        #880's first CI run failed in the runtime step with `KeyError: 'post'`. #879 had only checked the type checker and ec, not the runtime, so this is new information.

        - **The cause:** the runtime treats any verb with a `pre` frame as an action that changes state, and expects it to have a `post` frame too. `v_assume` now has `pre` and no `post`.
        - **The fix:** I pushed a one-line change to `runtime.py` (283d375) so a missing `post` counts as empty. That's how the runtime already handles it when binding a verb, and with an empty `post` the runtime can never pick `v_assume` as a step to run.
        - **Open question:** `pre` and `post` mean "state change" to the runtime, so marking rule roles with the same keys makes `v_assume` look like an action to it. I wrote this in the PR body as unverified. The rerun of the runtime step and the world tests will show part of whether behaviour changes. If it does, I'll register a hypothesis to use different keys for rule roles.

        CI is running again.
