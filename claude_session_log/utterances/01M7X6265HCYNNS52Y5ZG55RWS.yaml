        あなたの「領域で区別されている」は、ここまでで次のように言い直せます。
        - 区別は new_kind の式でつく。
        - 層の向きは、広い動詞を名前でたどれる層に置くことで揃う。
        - それを妨げていたのは、検査器が語を「occurrent の直下」だけで探していたことでした。

        検査器そのものの変更は、まだ入れていません。別の PR にして、あなたに見てもらいます。

