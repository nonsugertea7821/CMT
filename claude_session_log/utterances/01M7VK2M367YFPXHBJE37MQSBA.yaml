      text: |
        world_declared を規則で書けるかを確かめ、支持という結果になりました（PR #443）。途中で手順を一度訂正したので、自動マージには乗らず、手で見てもらう形です。

        **何を確かめたか**
        - world_declared は「否定を前提に使う法則は、その領域が閉世界を置くときだけ当てはめる」という法則です。今は Python の検査（`check_world_declared`）が担っています。
        - 手順は、検査器と体系の一時の写しで、規則が読む文を三つ足し、そのうえに規則を置くものです。三つの文は、領域が置く前提、法則の領域、前提が否定かどうかです。
        - そのうえで四つの版を走らせ、Python の検査と規則が同じものを咎めるかを数えました。四つは、何も変えない版（B）、std から閉世界を除く版（R）、std が扱いを二つ置く版（D）、runtime から閉世界を除く版（Q）です。

        **手順の訂正**
        - 最初の実行では、版 D に余分な誤りが一つ出ました。足した二つ目の前提そのものに、既にある別の検査が出したものです。
        - 事前に決めた判定のとおり、これを手順の誤りとして開示し、状態は変えませんでした。
        - そのあと、版ごとに文も規則も足さない対照を走らせ、それと比べて数える手順に直しました。この手順は、実行の前に commit しています。

        **結果（訂正版）**
        - 四つの版すべてで、Python の検査と規則が咎めるものが一致し、余分な誤りは出ませんでした。
        - 版 R では、std の法則のうち否定を前提に使う 11 個を、両方がそろって咎めました。

        **含意**
        - 「一つの領域は扱いを一つだけ置く」という前半は、新しい規則がなくても既に咎められています。前提の終点の欄に一つしか値を持てないため、既にある検査が出す誤りです。対照の版 D に出ていました。
        - 本体に移すときに要るのは、後半の規則（world_rule）と、それが読む三つの文だけだと読んでいます。
        - h_law_given_by_facts の系列は、これで三つとも支持です（named_mod・definition_stratified・world_declared）。h_law_given_by_facts 自体は、まだ未検証のままにしています。
        - 新しい仮説は、今回は登録していません。

        **あなたに見てほしいもの**
        - **#439（definition_stratified）**: CI は通っていて、マージ待ちです。
        - **#443（world_declared）**: 訂正があるので、手で見てもらう必要があります。
        - 二つがマージされたら、まとめて本体の規則に移す PR を立てます。

        ロードマップ: a（識別子化）の中で、残る law_given を一つずつ規則にしています。三つ目まで終わり、残りは part_fact_direction と part_display_explicit です。
