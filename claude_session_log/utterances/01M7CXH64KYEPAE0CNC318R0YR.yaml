      text: |
        3次元ではないと考えます。表に収まらなかったのは、私が「値」を持続体・生起体とは別の、第3の種類の終点として扱ったためで、これは誤りでした。

        ## なぜ収まるはずか

        最初にいただいた定義はこうでした。

        > 軸は関係を抽象として見ることによって成り立ち、値はその抽象に対する具体にあたる

        これに従えば、値は関係の終点に来るものを具体として見たものです。関係は表の4マスのどれかにあるので、終点は必ず持続体か生起体です。値は表の外にある別物ではなく、表の中の実体です。

        | 軸 | もとの関係 | 値の正体 |
        |---|---|---|
        | 言語 | 〜で書かれる | 自然言語、プログラミング言語 → 持続体（情報） |
        | 単位 | 〜という単位である | 名前、文、文章 → 持続体（情報） |
        | 言語行為 | 〜という言語行為である | 述べる、問う、答える → 生起体 |
        | 行為 | 〜という行為である | 届ける、教える、選ぶ → 生起体 |

        `takes`（値を取る）という関係も、「値」という終点の種類も不要です。`has_unit` などは、表のマスにある普通の関係になります。

        ## 実際にある「もう1つの次元」

        表に直交する方向は、抽象と具体です。分類のツリーは、表の外にもう1本ある木ではなく、同じ表を抽象と具体の方向から見たものだと理解しました。

        - 関係を抽象として見ると、軸になる。
        - その終点の実体を具体として見ると、値になる。

        要素の種類が3つあるのではなく、2×2 の表に見る高さの違いがある、という構造です。

        ## 誤りの兆候は、すでに出ていました

        作業中に、次の2つの衝突に当たっていました。その場しのぎで表示語を変えて通しましたが、どちらも同じ原因です。

        - 行為の値「届ける」と、生起体の実体「届けること」が重複していた。
        - 言語行為の値「述べる」と、行為の値「言及する」が、同じものを別の名前で指していた。

        値と実体を別物として二重に持っていたので、同じ概念が2か所に現れていました。値が実体であれば、この重複は起きません。

        ## 残る疑問

        1点、まだ整理できていない箇所があります。関係を分類する軸（推移性、対称性など）です。同じ読み方をすると、これは「関係を始点とする関係」を抽象として見たものになります。始点が実体ではなく関係なので、ここは本当に表の外、つまり辺についての辺です。値は法則（述語論理の式）で、式は情報なので持続体に収まりますが、始点の側が収まりません。

        関係そのものも実体として扱う（たとえば情報の一種とみなす）なら表に収まりますが、それが意図に合うかは判断がつきません。

        ## 進め方

        値を実体として扱う形に直します。

        - `takes` と、終点の種類「値」を廃止する。
        - 列挙していた値を、終点の種類の下位にある具体として位置づける。
        - 値と実体で重複していたもの（行為と生起体の種類など）を1つにまとめる。

        その前に、止まっている実験結果の記録を先に済ませます。関係を分類する軸の扱いは、考えがあれば教えてください。
