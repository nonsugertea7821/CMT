        物差しの実験 E58 の事前登録のスクリプトを書きました。いまはスクラッチパッドに置いています（`/tmp/claude-0/-home-user-CMT/e05d2140-ce91-515f-a5fb-e6251e13d406/scratchpad/e58_cross_usage_consistency.py`）。

        **設計**
        - 材料は、再定義が元の意味と衝突する 24 概念です（E1・E6・E20 と同じもの）。
        - 条件は二つです。
          - none: 定義を置かない。
          - near: 設問の直前に、新しい定義を置く。
        - 使い方は四つです。適用、定義の言い換えの選択、説明、暗唱。暗唱は、二つの言い換え文のどちらを出しやすいかで比べます。
        - 一貫（joint）は、四つの使い方がそろって新しい定義に従う概念の割合です。目的の物差しを、初めて一つの量として出します。
        - 判定は near で行います。
          - 置換の区間: 使い方ごとの結果を概念の間で入れ替えると、使い方ごとの正答率を保ったまま、使い方を独立にした場合を作れます。これを 10000 回くり返して、一貫の 95% の区間を出します。
          - 実際の一貫がこの区間の外に出たら、h_consistency_beyond_accuracy は支持です（一貫は正答率からは決まらない）。区間の内なら反証です。
          - 24 概念では、差を見分ける力が低いことを開示します。

        **進め方**
        - 仮説 h_consistency_beyond_accuracy（#843）が main に入ったら、ブランチ `claude/h_consistency_beyond_accuracy` を切ります。そこで事前登録を commit し、Draft の PR を立て、1.5B で走らせます。
        - 1.5B は軽いので、E57 と並べて走らせます。E57 は最初の部分保存（8 項目）を書いたところです。4B での E58 は、E57 の後に回します。

        否定の文は、#843 がまだ main にないこと（main を検索して確かめた事実）と、24 概念では差を見分ける力が低いことの開示です。開示は、事前登録の判定の読み方を決めるもので、何かを見送る理由ではありません。なので、仮説は登録していません。

