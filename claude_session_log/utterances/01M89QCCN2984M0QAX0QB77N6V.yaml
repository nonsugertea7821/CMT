        **What I think happened (not yet checked):** the two nodes I added probably produce those extra relations themselves. If so, splitting into files isn't what changed anything. My rule didn't account for the fact that adding nodes adds relations. I registered this as a new untested hypothesis, h_grammar_parts_rel_by_new_nodes. I'll test it by checking whether every extra relation involves one of the two new nodes. If they all do, adding parts to the grammar can still be adopted.

