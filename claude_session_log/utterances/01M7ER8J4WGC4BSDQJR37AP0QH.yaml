      text: |
        ## `is` のノード

        あります。`is: {ja: 属する, extends: p, to: kind}` で、終点が種類である関係として `core` に定義済みです。

        ## 個体について数を述べる

        各個体が修飾として持つ、でよいと考えます。個体に値を直接書くのは新しい仕組みではなく、いまの軸の規則の延長になるからです。

        - **軸の値は「固定値か、関数」と決めてあります**：種類は関数で範囲を限定し（例：重みの数が10億より多い）、個体は固定値を取ります（例：15億）。
        - **個体は、すべての軸が固定された概念と見なせます**：階層を降りるほど限定が増える（法則 `monotone`）ので、その最下端が個体です。
        - **値は個体に書き、軸は種類が宣言します**：個体が無限に増えても、定義の場所は増えません。「モデルは重みの数を持つ」は種類の式に1度書き、個体は同じ `mod` の書き方で値だけを書きます。
        - **検査は、個体の値が種類の限定に入っているかを見ます**：種類の式にない軸を個体が書けばエラーです。

        ひとつだけ直感と違う点があります。重みの数は分類の値です。以前の書き方（重みが15億のモデルという種類）は、その値を持つものが1つしかない種類でした。

        ## 個体にしていないものの問題

        原因は1つで、種類の式が個体を参照する書き方がないことです。3か所で起きています。

        | 対象 | 何が参照しているか |
        |---|---|
        | `this_design`（本設計） | `decision` の式（「本設計の部分になる定義」） |
        | 選択肢（`opt_yes` など） | 設問形式の式（「『はい』と『いいえ』からなる形式」） |
        | 設問群（`g_sibling` など） | 参照はないが、`g_new_word` の下位として書かれている |

        対処は次のとおりで、どれも検査の拡張で済みます。

        - **個体を、成員が1つの種類として扱う**：`with` に個体を書けるようにします。「X は個体 a に当たる」は「X が a そのもの」のときだけ真です。OWL にも同じ仕組み（hasValue）があります。
        - **`decision` を2段に分ける**：`core` の `decision` が特定の設計を名指ししているのは、もともと誤りです。`core` では「設計の部分になる定義」とし、「本設計の決定」は `exp` に置きます。
        - **設問群の上下は、種類の上下ではなく部分の関係に直す**：設問の集まりは個体で、「兄弟概念の設問」は「新しい語の設問」の一部です。

        ## 進め方

        個体の値と、種類からの個体の参照は、どちらも「個体は限定が最も多い概念である」という1つの規則で扱えます。この方針でよければ、次の順で進めます。

        1. 個体に `mod` の値を書けるようにして、モデルの重みと層の数を戻す。
        2. `with` に個体を書けるようにして、`this_design`・選択肢・設問群を個体に移す。
