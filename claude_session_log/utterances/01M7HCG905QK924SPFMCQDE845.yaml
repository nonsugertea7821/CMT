        付け替えました。check_spec と run_spec はどちらも通り、コミットしてプッシュ済みです（ce150c6）。

        ```
        state_shift（隠れ状態のずれ）
        ├ concept_vector（概念ベクトル：語のトークン位置に依存）
        │  ├ single_layer_vector（層1つに依存）
        │  ├ multi_layer_vector（層が複数）
        │  └ contrast_vector（定義文に依存）
        └ key_token_vector（専用トークンに依存）
        ```

        - **何が変わったか:** これまで「接続手段（行為）」として定義していた5つのベクトルを、すべて「隠れ状態のずれ（情報）」の下に移しました。合わせて、限定の動詞を「関わらせる」から「依存する」に改めています。各実験の条件は「何を表すか」という関係でこれらのノードを指したままで、検査の上でも食い違いは出ていません。
        - **落ちた情報:** 「教示（学習）で得られた」という区別は、ずれの側の木には今は入っていません。E3（学習あり）とE14（学習なし）を木の形で分けたくなったら、`taught_shift`（学習で得られたずれ）を一段挟むのが自然です。
        - **残っているノード:** 元の上位だった `channel_involve_from_taught_vector` は、今は下位がなくなっていますが、検査は通るので残してあります。消すかどうかは指示に従います。
