      text: |
        sys_verbs として記録し、プッシュしました（72e0e42）。型検査・実行・世界・同期の検査はすべて通っています。観察の1つをわざと壊して、検査器が値を本当に照合していることも確かめました。

        **記録した観察**（動的な動詞 36、静的な動詞 82）

        | 観察 | 値 |
        |---|---|
        | 動的な動詞の from は持続体 | 36/36 |
        | 動的な動詞の両端が持続体 | **35/36**（前の報告の「例外なく」は誤りでした） |
        | 動的な動詞の端に生起体がある | 0/36 |
        | 静的な動詞の端に生起体がある | 14/82 |
        | 静的な動詞が限定（mod）を持つ | 0/82 |
        | 動的な動詞が限定を持つ | 8/36 |
        | exists を使う（動的・静的） | 21/36・2/82 |
        | after・involve を使う（動的・静的） | 1/36・24/82 |

        - 両端が持続体でない唯一の動詞は **std.v_compute** で、`to: any` です。
        - 限定を持つ動的な動詞 8 は、どれも exp の手法の語（renaming など）でした。「限定されるのは動的な動詞だけ」は、領域が偏っているので弱い観察です。

        **事前登録はできません**
        「動的な動詞の端は持続体」を仮説にして確かめるつもりでしたが、確かめに使えるデータはもう全部見てしまいました。同じデータで事前登録しても確かめになりません。

        **代わりに、観察をつないで演繹できる形**
        1. 動的な動詞の端は、歩みの中で宣言された名前で埋まります。名前で埋まらない端は文として書けないので、歩みになりません。
        2. 宣言された個体の種類は、すべて持続体の下にあります（o_sys_tops_ind_continuant、1054/1054）。宣言は減らないので（h_open_runtime、支持）、持続体の定義 same(self_t, self_t') にも合います。
        3. したがって、動的な動詞の端は持続体です。静的な動詞の端には、入れ子の文（生起）も入ります。静的な動詞で生起体を端に持つ 14 は、この形で使われています。

        この読みでは、v_compute の `to: any` は導けるものより緩い型になります。to は在るようにする位置で、そこにできるのは宣言された個体、つまり持続体です。

        **次に入れる型検査（案）**
        「pre か post を持つ動詞（自分か上位）の from と to は、持続体の下になければならない」。

        入れるときは、v_compute の to を continuant に直します。これは観察から導いた法則の最初の1つになり、最上位の分類のうち「動的なら端は持続体」の部分を扱います。静的な動詞の置き場は、まだ残ります。

        この演繹で法則を入れてよいか、v_compute の to を continuant に直すことも含めて教えてください。
