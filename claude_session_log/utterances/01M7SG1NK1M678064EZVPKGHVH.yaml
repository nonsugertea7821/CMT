      text: |
        はい、辞書は要ります。ただし、辞書に載せるのは一番下の語だけで済む、と考えています。いまの体系の決まりから言えることと、まだ決まっていないことを分けて書きます。

        **辞書が要るところ（閉じた、小さい辞書）**
        - 名前で読んでよいのは、シグネチャと文法の語だけ、という決まりがあります。具体的には、基礎の関係（exists・depend・refer・is・前後など）と、from・to・new という位置の語です。
        - これらは数が限られるので、自然言語の語と一つずつ対応させる辞書が作れます。
          - 「有る／無い」「〜に依存する」のような述語の辞書。
          - 位置を格助詞（が・を・に）に当てる辞書。こちらは h_ja_case_frame で扱っています。
          - 文と文のつなぎ（前提・結果など）を接続詞に当てる辞書。こちらは h_ja_connective で扱っています。

        **辞書を引かないところ（組み立てる）**
        - そのほかの概念は、式を下の辞書で訳して組み立てます。たとえば v_compute なら「（to が）無かったところから、有るようにする」になります。
        - display を廃止したあとは、display はこの組み立ての出力と同じものになるはずです。人が書く欄ではなく、式から作れる欄になります。

        **難しいところ（開いた語彙）**
        - 「計算する」「設計する」のような語は、組み立てた言い換えよりずっと短く、しかも意味が多く入っています。式と語の対応は一対一になりません。
        - 今回の v_compute がその典型です。式は出現の形そのものなのに、語の「計算する」には、それ以上の意味があります。この差がまさに「display にだけある意味」（前に測った約 77% の残り）です。
        - だから語の辞書は、「語 → 式」の向きに作るほうがよいと考えています。それぞれの語に式の定義を与え、式が足りなければ式を足します。式から語を選ぶのは、組み立てた言い換えを一番よく縮める語を探す問題になります。
        - その選びが自然かどうかを確かめる先が、LLM 以前の公開コーパス（h_ja_text_agrees_public）だと考えています。語がその式の格の形（何を・何に）で実際に使われているかを見る形です。

        **まだ決まっていないこと**
        - 一番下の辞書の語（「有る」「依存する」など）自体の意味は、体系の外に置くしかありません。ここが式と自然言語の接地点で、どこまで小さくできるかはまだ測っていません。
        - 開いた語彙を「語 → 式」で持つとき、その置き場（今の subj.yaml のような層を語彙として扱うのか）も決めていません。

        いまの体系の決まりから素直に読むと、こういう二層の形になる、というのが私の考えです。この形でよいかどうかは、方向そのものの話なので、決めていただければと思います。
