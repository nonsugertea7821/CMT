        - Midpoint test (Gärdenfors convexity on a finite vocabulary):
          1. Center the vocabulary.
          2. For each member pair, take the midpoint.
          3. Find the nearest word by cosine, excluding the two endpoints.
          4. Score 1 if that word is a member. The rate is the mean.
        - Linear classifiers are not used, because half-spaces are trivially convex.

