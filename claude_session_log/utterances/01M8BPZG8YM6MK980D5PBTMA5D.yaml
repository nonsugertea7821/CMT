      text: |
        二つの結果について、私の解釈を書きます。どれも確かめていない読みです。

        **1. 中身の全部による分け方は、方法としては外れていないと読んでいます**
        - 中身の全部の案（#331）が反証になった理由は、ぶつかる組の予測が外れたことでした。
        - ずれの元は、法則の役割（前提・導く文・求める文）が当時は式で区別されていなかったことです。その区別を式に入れた後は、ぶつかるのは承認・入金の二組だけで、795 個が 793 のまとまりに分かれています。
        - だから私は、あの実験は分け方の良し悪しを試したというより、体系の中にまだ式になっていない区別があることを見つけた、と読んでいます。
        - 残った承認・入金も、同じ種類のものに見えます。「承認」と「入金」の違いは、いまは名前の中にしかありません。

        **2. 類と種差の反証は、この言語での意味の置き場所を示していると読んでいます**
        - 古典的な定義（何の一種で、どこが違うか）で決まる概念は、全体の一部でした。
        - 残りは次の三種類で、区別が別の場所にあります。
          - 役割を指す概念（「置き換えられた語」＝置き換えるの行き先）は、どの動詞のどの位置かで決まります。
          - 動詞（採択する・渡す・判定する）は、何が何から何へ変わるか（前後の状態）で決まります。
          - 否定の対（採択された／採択されていない）は、否定の印で決まります。
        - つまり CSCL では、意味の多くが「何の一種か」ではなく、「出来事の中の位置」と「状態の変化」に置かれている、という読みです。

        **3. 二つを合わせると、識別子の役割を取り違えていたかもしれないと読んでいます**
        - 設計が求めているのは、一つの識別子が一つの式を指すことだけでした。
        - 三つの仮説は、どれも「識別子を中身から計算できるか」を問うていました。これは設計の要求ではなく、私たちの読みです。
        - 結果から見えるのは、中身の全部による分け方が「区別の足りない定義」を見つける道具としてよく働いていることです。識別子を作る道具としてではありません。
        - 表示語を体系から決める（d_cscl_display_derived）という土台にとって大事なのは、違う概念が違う中身を持っていることのはずです。そうでなければ、表示語を中身から訳したときに違いが出せません。その条件は、承認・入金を除いて、いまの体系で満たされています。

        この読みに沿って何かを進めることになったら、そのときに仮説として登録します。
