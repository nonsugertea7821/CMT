        その見方には根拠があります。今までのデータに、もうその手がかりが出ています。

        **すでに見えている規則性**
        正しい上下関係の 33 組（C）を、下の概念が上の概念からどう作られているかで見ると、こうでした。

        - 32 組は、上の概念の式を **1 つだけ** 選び、その端を狭めていました。
        - 狭める段数は、33 組中 25 組が **1 段** でした。

        つまり分化の典型は「式を 1 つ選んで、端を 1 段下げる」という小さな一歩です。

        ただし、C は「洗練の対があるもの」を選んで数えた組なので、この形になりやすい偏りがあります。体系の上下関係すべてで、分化の操作がどう分布しているかは、まだ数えていません。

        **操作の種類として考えられるもの**
        式の書き方から見ると、分化の操作はおそらく次のどれかです。

        | 操作 | 例 |
        |---|---|
        | 端を狭める | money の「過程を測る」→ sales の「支払いを測る」 |
        | 動詞を狭める | 「述べる」→ その下位の動詞 |
        | 新しい式を足す | 上にない特徴を加える。money に単位を足すのはこれ |
        | 数を限る | 「1 つと結ばれる」「2 つ以上」など（at: count） |
        | 否定する | 「〜しない」（neg） |

        数えてみて、ごく少ない種類でほぼすべての上下関係が説明できるなら、それが「分化の操作の文法」です。そうなれば、規則から「この概念の次の分化はこの形のどれか」と言えるようになります。

        **ここから見えそうなこと**
        - 違反の 9 件は、どれも「端を狭める」で説明できてしまう組でした。だから、規則だけで正しい分化と見分けられませんでした。
        - money を直すのに要るのは、「新しい式を足す」という別の種類の操作です。
        - 体系がどの操作をどれくらい使っているかが分かれば、「端を狭めるだけの分化」が本当に分化なのかを判断する材料になるかもしれません。

        **提案**
        体系のすべての上下関係（概念と、その直接の上位の組）を、上の 5 種類の操作に、規則で分けて数えます。どれにも入らない組は「その他」として書き出します。予測は「端を狭めるが大半で、操作の種類は少ない」です。いつものように、手順を先に登録してから走らせます。

        money に単位を足す操作は、この結果を見てから「新しい式を足す」の一例として位置づけ直すのがよいと思います。この順で進めてよいか教えてください。
