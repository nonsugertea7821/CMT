        h_observation_by_scale の測定が終わり、反証になりました（#616、レビュー待ち）。手順に訂正はないので、CI が通れば自動マージに乗るはずです。

        - **測り方:** main の履歴から 12 の時点の体系を取り出し、3 つの値（mod を書いたノードの割合、動詞の割合、祖先の深さの平均）が、規模が大きくなるほど今の値に近づくかを見ました。
        - **結果:** 12 のうち古い 4 つは型検査が通らず、使えたのは 8 つです。事前に決めた「近づく」の基準を満たした値は 1 つだけで、2 つ以上という支持の条件に届きませんでした。
          - mod の割合だけは近づいていました。
          - 動詞の割合は、もともと規模でほとんど変わりませんでした。
          - 深さは、いちばん小さい写し（561 ノード）では今の値と大きくずれていましたが、700 ノード台では逆に今の値から少しずつ離れていきました。
        - **解釈:** 値は規模とともに落ち着くというより、最近の追加（ja_basic など）で動いています。ただ、この手順では「規模の効果」と「書き方の取り決めが途中で変わった効果」を分けられません。この反証が言えるのは、一つの体系が時間とともに大きくなった範囲までです。
        - **誤記:** 結果の commit のメッセージで「規模が最も小さい写し」とすべきところを「ずれが最も小さい写し」と書きました。PR の本文で訂正しています。

        あわせて、#614（形式と実在の軸）があなたの確認待ちです。訂正があるので手で見る扱いです。

        次は合意した順のとおり、実在の軸を足したうえでの語彙実験のやり直しに進みます。

