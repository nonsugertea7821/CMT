      text: |
        式と字面と文脈を、隠れ状態の空間への写像として書くと、次のようになります。

        ## 置き方
        概念の現れ 1 つを、点 x = φ(式, 字面, 文脈) ∈ ℝ^d とします（ある層の隠れ状態）。

        一貫した概念認識とは、φ が式だけを通して決まることです。つまり、ある ψ について φ ≈ ψ(式) となり、字面と文脈を替えても点がほとんど動かない状態です。

        幾何で言い換えると、**同じ式の点の集まり（式のファイバー）が小さく、別の式のファイバーとは離れていること**です。概念ごとの領域に、互いに重ならないように収まる、ということでもあります。

        ## 観察を当てはめると
        1. **類の水準では、領域がほぼ凸になっています。**
           - 同じ類の 2 点の中点は同じ類に残り、類をまたぐ語を混ぜると残らなくなります（中点の支持 2 つ）。
           - 言語やモデルを替えても、この性質は変わりませんでした。
           - なので、空間を類で分けた粗い区画は、字面にあまり左右されません。
        2. **種の水準では、式のファイバーが広くなっています。**
           - 同じ表示語でも状態が 1 つに決まらず、式を書いても決まりませんでした（どちらも反証）。字面と文脈の方向へ大きく伸びている、ということです。
           - v_refer の下の動詞には、共通の方向がありませんでした（#756）。同じ式の部品を持つ点が、1 つの方向にまとまっていません。
        3. まとめると、点はおおよそ x ≈ g(類) + s(字面) + c(文脈) と分かれて見えます。類の成分 g は安定していて、種を分ける差は s や c と同じ大きさで混ざっています。

        ## ここから先の読み（解釈。確かめていません）
        - 式どおりに読ませるには、2 つの道があります。
          - 種の差が s と c より大きく出る部分空間を探す。中点の軸での読み取りと区間での切り分けは、この形の試みで、外れました。
          - 字面のほうを式に合わせて、s 自体を式の関数にする。
        - 後者が h_state_by_genus_display です。表示語を「類の語＋種差」で作れば、s が g と種差に沿う形になり、ファイバーが式ごとにまとまるはずです。
        - ベクトルを足す実験は、点を領域の境界の向こうへ押すことにあたります。追従と維持は動くのに一貫性が出なかったのは、押す先の領域（種のファイバー）が、使い方ごとに別の場所にあるからだと読めます。

        測れる形にすると、「同じ式の点のばらつき」と「別の式の点どうしの距離」の比です。この形は、すでに h_verb_state_by_display_surface（字面で決まる）と h_state_by_genus_display（類と種差の字面で揃う）として登録してあるので、新しく足すものはありません。

        ロードマップの位置: d_road_region（仮）です。次は h_state_by_genus_display で、字面を式に揃えたときに種のファイバーが縮むかを測ります。
