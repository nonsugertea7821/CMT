      text: |
        h_tops_from_primitives（#191）は**支持**になりました（PR #192）。ただし、確かめとしては弱いものです。評価器と文法を変えたので、マージ前に見てもらう必要があります。

        **足した形**

        | 欠けていたもの | 足した形 |
        |---|---|
        | 種類について在ることを述べる場所 | 原子の項に `self`（その種類の個体）を使える |
        | 歩みを動く量化 | `always`（どの歩みでも成り立つ）、`sometime`（ある歩みで前の状態から後の状態に変わる） |
        | 変数の範囲 | `ranges: <変数>` |

        **最上位の書き換え**
        - any: `ranges: self`
        - 持続体: 時間的な部分を持たない、かつ、どの歩みでも在る
        - 生起体: ある歩みで在るようになり、ある歩みで在らなくなる

        説明文（gloss）は三つとも消しました。6 節すべてが式に入り、型検査（tc）も照合（ec）も通っています。

        **弱いところ**
        - 確かめたのは「書ける」ことだけです。形も、式も、検査器の変更も私が書いたので、支持のかなりの部分は作り方から来ています。
          - 新しい欄は既存の規則で検査させました。間違った入力が誤りになることは、体系の写しで確かめています。
        - 式が説明文と同じ意味かは、機械では確かめていません。
        - 「時間的な部分を持たない」の式は、修飾の検査をそもそも通っていません。最上位のノードは、その検査の前に抜けるからです。
          - 検査に掛ければ、「持続体は v_stage の終点（生起体）には来られない」と言われるはずです。
          - 否定の限定が端の型を問うのかは、まだ決まっていません。
        - 次の二つは、この実験の外です。
          - 下のノードの置き場が、この式から導かれるか。
          - always と sometime が、実際の走りで成り立つか。

        次は h_layers_from_primitives（#190）です。いまの体系で、各ノードがこの三つの形のどれに届くかを数え、層と照らします。
