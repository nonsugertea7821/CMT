        GPT にとっての計算は、独立した演算機能ではなく、連想の組み合わせです。初期のモデルが計算できなかったのも、今のモデルができるようになったのも、そこから説明できます。

        ## モデルの中で「計算」として起きていること

        解釈可能性の研究で分かっている範囲では、次の3つが重なっています。

        1. **丸暗記した対応**: 「7×8=56」のような頻出の組み合わせは、事実と同じく連想として引き出されます。
        2. **近似的な経験則の束**: 足し算では、「だいたいの大きさを見積もる経路」と「一の位だけを正確に求める経路」が並行して働き、最後に合成されることが観測されています。大小比較にも、数の大きさを粗く表す特徴を使う専用の回路が見つかっています。筆算のような手順を実行しているわけではありません。
        3. **書き出しによる逐次処理**: 途中の桁や繰り上がりを文章として書き出すと、1歩ごとの処理は 1 や 2 の小さな連想で済みます。文脈が計算用紙の役割を果たします。

        興味深いのは、モデルに「どうやって計算したか」を尋ねると筆算の手順を説明するのに、内部では 2 の並行経路を使っている、という報告があることです。説明する経路と実行する経路が別だという点で、今回の「ベクトルで判定は変わるが理由は変わらない」と同じ構造です。

        ## 初期のモデルが計算できなかった理由

        - **数の区切られ方**: 数字が桁ごとではなく不規則な塊としてトークン化され、桁の位置合わせが難しかった。
        - **一度の処理で答えを出していた**: 書き出しをせず、層を一度通るだけで答える必要があった。層の数が、連鎖できる連想の段数の上限になります。
        - **経験則の精度が低かった**: 2 の束が粗く、桁数が増えると破綻した。

        今のモデルが計算できるのは、経験則が精密になったことに加えて、途中を書き出す使い方と、外部の計算機を呼ぶ使い方が加わったからです。モデル単体が「計算機になった」わけではありません。

        ## 前回の私の整理への反省

        前回、再定義を「付け替え型」と「規則型」に分け、規則型は「新しい計算の追加」だと述べました。この問いを受けて前提を見直すと、その二分法は怪しいと考えます。

        モデルにとって計算が連想の連鎖であるなら、「25歳未満か」の判定も、次の連鎖にすぎません。

        1. 語から、しきい値という属性を引く（未成年 → 25）
        2. 事例の数値と比べる（既にある大小比較の経路を使う）

        これは新しい計算ではなく、属性の書き換えと、既存の経路の再利用です。付け替え型との違いは種類ではなく、**一度の処理の中で連鎖させる段数**の違いだと考える方が筋が通ります。暦の規則（木曜始まりの週、火曜から土曜の平日）が特に弱かったことも、段数が多いことで説明できます。

        ## そこから出る予想

        段数が原因なら、途中を書き出させれば、規則型は文章の定義だけで解けるようになるはずです。しかも改善は規則型に集中し、付け替え型ではほとんど変わらないはずです。

        これは残り項目にある「途中経過を書かせる切り分け」で確かめられます。予想が具体的になったので、判定もしやすくなりました。当たれば、規則型への対処は「ベクトルを強くする」ではなく「書き出しを前提にする」か「検証側で規則として判定する」になります。外れれば、段数ではない別の要因があることになります。

