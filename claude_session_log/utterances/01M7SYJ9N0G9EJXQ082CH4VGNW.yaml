      text: |
        そう思います。そうだとすると、前の私の答えは基準を取り違えていました。

        **私の誤り**
        - 前の答えで、excludes_verb の利点として「表示語の『動詞でないものは概念』に合う」を挙げました。
        - 表示語は式から訳したものです。式を評価する基準にはなりません。
        - concept_kind では、表示語が式より多くを言っています。これは表示語に合わせて式を直すべきだという証拠ではありません。式にできていない意味が表示語に置かれている、つまり負債です。
        - どちらの方向を取るかは、式の側の帰結で決めることになります。r_concept を前提にする法則（sibling、one_name、specific_candidate など）が、それぞれの選び方で何を導き、検査が健全なままかどうかです。表示語に合うかどうかは理由になりません。

        **前提はまだ成り立っていない**
        - 「表示語を式に置き換えても体系全体が健全」という前提は、まだ示されていません。一か所では反証されています。
        - 反証は h_case_frame_formula です。動詞の格の枠を式から復元できたのは 0.39 で、表示語の形からは 0.63 でした。格の枠については、今は表示語が式にない意味を運んでいます。
        - 同じ系列の h_draw_on_with_shallow（読みの式は表示語に依存しない）は、まだ未検証です。
        - ですから今の体系では、表示語はまだ「意味論を演繹する道具」にまでなっていません。場所によっては意味の置き場として働いています。

        **concept_kind の対について**
        - この見方に立つと、二つの仮説は「どちらが表示語に合うか」で比べるものではなくなります。
        - 比べるのは二点です。表示語が言っている区別（動詞かどうか）を式で書けるか。書いたときに、比べる組の法則が健全なままか。
        - 前に言った frame_free の式の書き直しも、この方向で考えます。
