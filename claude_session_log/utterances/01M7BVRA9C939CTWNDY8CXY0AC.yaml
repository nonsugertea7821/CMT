      text: |
        E3 の2本目が終わり、良い結果が出ました。適用例を教師にして学習した概念ベクトルは、学習に使っていない設問でも定義どおりに答えを変えます。

        ## 結果（Qwen2.5-1.5B、24概念、評価は未見の事例）

        | 条件 | 定義が元の意味と衝突する設問 | 衝突しない設問 | 両方に正答した概念数 |
        |---|---|---|---|
        | 何もなし | 0.38 | 0.75 | 5 / 24 |
        | 定義文を文脈に置く | 0.58 | 0.75 | 10 / 24 |
        | 定義文と適用例4問を文脈に置く | 0.79 | 0.71 | 12 / 24 |
        | **ベクトルだけ（文脈には何も置かない）** | **0.79** | **0.92** | **17 / 24** |
        | 定義文とベクトルの両方 | 0.79 | 0.67 | 11 / 24 |

        ## 読み取れること

        - **語の位置に加える1本のベクトルが、概念の境界を担えます。** 衝突する設問と衝突しない設問の両方が上がりました。定義文の暗唱で学習した1本目のような「答えの反転」は起きていません。
        - **同じ教師情報なら、文章で渡すよりベクトルの方がよい結果でした。** 正答率の差は小さめです。差が大きいのは安定性で、選択肢の順序を入れ替えても正答する率は、衝突する設問で 0.67 対 0.50、衝突しない設問で 0.79 対 0.58 でした。確信の強さ（正答と誤答のロジット差）は約3倍です。
        - **定義文とベクトルを併用すると下がります。** 定義文の中の語にもベクトルが加わるのが原因と考えていますが、未検証です。
        - **数値の境界を持つ概念は学習しきれませんでした。** 損失が下がりきらなかったのは「国内」「大人」「大口注文」「無料」の4概念で、うち3つが数値の境界を持ちます。

        ## まだ言えないこと

        - 学習と評価の設問形式が同じなので、概念を獲得したのか、形式に適合しただけなのかは区別できていません。
        - 多数のベクトルを同時に入れたときの干渉は測っていません。
        - 正本（定義文）だけからはコンパイルできず、適用例という追加の教師が必要でした。設計上はここが重要な論点です。適用例は、設計文書の「差異とテストの1対1対応」のテストに当たるものなので、テストを教師として使う形に設計を寄せるのが自然だと考えています。

        ## いま回しているもの

        上の最初の2点を確かめる評価を裏で実行中です（20〜30分の見込み）。

        1. **形式の転移**: 空欄補充と正誤判定という、学習時と違う設問形式でも効くか。
        2. **干渉と局所性**: 24概念のベクトルを同時に入れても効くか、無関係な設問の答えが変わらないか。

        途中で起きたことも報告しておきます。

        - コンテナの再起動で実行が一度止まりましたが、途中保存から再開できました。
        - 結果ファイルが誤った名前（`near+vec.json`）で保存される不具合がありました。名前を戻し、コードも修正済みです。数値への影響はありません。

