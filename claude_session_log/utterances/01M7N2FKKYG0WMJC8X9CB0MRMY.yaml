        定理を先行研究（pw）として記録し、フレームの観察も済ませました。どちらも push 済みで、PR #93 の本文を更新し、CI も通っています。

        ## 1. 先行研究（定理）
        | 先行研究 | 要旨 | h_definition_positive との関係 |
        |---|---|---|
        | `pw_russell1902_paradox` | 否定を通る自己言及の内包 {x \| x ∉ x} は矛盾する | 同じ向き |
        | `pw_apt1988_stratified` | 否定を通る再帰を持たない論理プログラムは、標準モデルを1つ持つ | 同じ向き |
        | `pw_tarski1955_fixpoint` | 完備束の上の単調な写像は不動点を持つ | 要旨だけ記録 |

        - Russell と Apt の要旨は、体系の語で「定義の循環は否定に依存しない」と言い直しました。型検査器は、この中身が仮説と一致することを確かめています。ただし Russell については、定理の対偶として読んだものです。
        - Tarski は「否定を通らなければ定まる」という逆側の保証です。今の語では同じ文にならないので、要旨だけにしました。
        - 文献は記憶から書いており、外部で照合はしていません。

        ## 2. フレームの観察（`sys_frames`、判定の基準は置いていない）
        **動詞の側（動的な動詞 16）**
        - 在るようにする動詞は 9、在らないようにする動詞は 1（`v_freeze`）です。
        - `v_freeze` は exists のほかの文を取り除きません。真偽の軸だけを操作している、というあなたの読みと一致します。

        **歩みの側（実行の記録の 6 歩）**
        | | 歩みの数 |
        |---|---|
        | 宣言が増える / 減る | 0 / 0 |
        | 在るものが増える | 2 |
        | 在るものが減る | 1 |
        | 在らない個体についての文が残る | 1 |

        ## 見えたこと
        - **宣言の軸では、今の実行器は「全部を最初に宣言する」ことで閉じています。** そのため宣言の差分は常に 0 です。あなたの言う「概念差分が増え続ける」は、今の実行器では表せません。
        - **増えたり減ったりしているのは、真偽の軸（exists）のほうです。** 在るものは増えも減りもし、単調ではありません。
        - **`v_freeze` の後に残る文（在らない r1 についての文）は、真偽の軸の上では矛盾していません。** r1 は宣言されたままで、「在る」が述べられていないだけだからです。前回の検証は、この状態を宣言の軸の違反として数えていました。そこが誤りでした。

        ## 前回の誤りの記録
        h_open_declaration には、「基準が真偽の軸と宣言の軸を取り違えていた（あなたの指摘）」という注を足しました。判定は、登録した基準どおり反証のまま残しています。

        ## 次に決めること
        直した条件で確かめるには、前回挙げた2つを決める必要があります。
        - **(i) フレームの区切り。** 1歩ごとに区切るのか、宣言を足す歩みだけで区切るのか。観察では、真偽だけを変える歩みが 6 歩中 4 歩あります。1歩ごとに区切ると、「増え続ける」は「減らない」の意味になります。
        - **(ii) 巻き戻しで何を戻すか。** 宣言だけを戻すのか、真偽の文も一緒に戻すのか。今の実行器には巻き戻しがないので、exp の中で作ることになります。
