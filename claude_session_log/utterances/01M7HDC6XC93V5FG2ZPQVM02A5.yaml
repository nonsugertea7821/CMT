      text: |
        E15 を spec/exp.yaml に記録し、検査を通してコミット・プッシュしました（f31c3f7）。

        **記録した内容**
        - **族:** 三つ足しました。e15 は入れ替えの正答率、e15c は v と near のずれとの cos、e15r は大きさの比です。
        - **仮説:** 二つ足しました。
          - 「入れ替えたベクトルは対照側を下げる」は支持です。G2k が 0.62 で、none の 0.75 を下回りました。
          - 「E3 のベクトルは定義文が作るずれと一致する」は否定です。cos が約 0 で、大きさも半分でした。
        - **気にしていた点:** cos が G2c と G2k で同じ値になったのは偶然でした。設問ごとの値は異なり、どれも 0 の近くにあるので、平均が重なっただけです。

        ## 次に考えるべき含意

        E15 から、文章とベクトルは別の経路を通っていると分かりました。
        - **文章:** 定義文が文脈の中にあり、後ろの層が注意で読みにいきます。語の位置の状態は、概念によらず同じ向きに大きく動きます。
        - **ベクトル:** 語の位置の状態そのものを、小さく書き換えます。概念ごとの成分に、概念間で共通する成分（ベクトルどうしの cos が平均 0.19）が乗っています。

        ここから考えるべきことが四つあります。

        **1. 文章が衝突側で弱いのは、読む側で負けるからではないか**
        文章の経路では、後ろの層が語自身の状態（元の意味）より定義文を優先して読む必要があります。衝突する再定義では元の意味が勝ちます。ベクトルは読まれる元を書き換えるので、この競合が起きません。
        これは未検証の h_attention_causes_preceding_effect（注意機構が先行する定義の影響の原因）と直接つながります。答えの位置から定義文と語の位置への注意の量を比べれば確かめられます。

        **2. ベクトルの共通成分が「元の意味を抑える」役ではないか**
        v を概念間の平均（共通成分）と残り（固有成分）に分け、片方ずつ足して比べます。予想は次のとおりです。
        - 共通成分だけ：G2c は上がり、G2k は下がる。
        - 固有成分だけ：G2k を守る。

        そうなっていれば、near・概念式・無意味化で見てきた「衝突側を上げると対照側が下がる」型は、すべて共通の抑制の量で説明できる可能性があります。学習は不要で、評価だけで済みます。

        **3. 固有成分は「語の意味の候補の間の差」そのものではないか**
        再定義を候補からの選択と見るなら、固有成分は次の二つの差に近いはずです。
        - 語が目的の意味で使われている自然な文での h
        - 元の意味で使われている文での h

        これが成り立てば、学習しなくても有効なベクトルを作れます。E14 は「定義文があるかないか」の差を取ったため、位置の影響を拾って失敗しました。正しい作り方は「意味の差」を取ることになります。

        **4. 概念式との対応**
        固有成分が「上位 ∧ 限定」に従って合成的になっているかを見ます。v(概念) ≈ v(上位) + v(限定) が成り立つなら、概念式から代数的にベクトルを組み立てられます。既存の h_modifier_transfers_to_unseen_genus（限定が、見たことのない上位概念にも移る）が支持されているのが手がかりです。このプロジェクトが目指す「モデルの概念と言語の対応づけ」に一番近い問いです。

        **付記：二つの経路の干渉**
        E3 で文章とベクトルを併用すると、G2k で下がることがありました。二つは層8では直交しているので、干渉は後ろの層で読むときに起きていると考えられます。1 と同じ測り方で調べられます。

        ## 勧める順

        2 → 3 → 1 → 4 の順を勧めます。2 は数分で終わり、3 は文を用意すればすぐ測れます。1 は注意を測るので一手間かかります。4 は 3 の結果を前提にします。

        まず 2 を走らせますか。
