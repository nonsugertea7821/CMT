      text: |
        h_draw_on_with_shallow を確かめ、反証と記録しました（PR #403）。tc と ec は通り、Draft も外してあります。

        この仮説は、前の実験 sys_draw_on で落ちた読み「浅い端だけで定義された概念は、正しい下位も違反の下位も集める」を、法則の関係 r_shallow を使って書けば、型検査の誤りなく式にできるかを問うものです。

        **結果**

        | 版 | 型検査の誤り | うち named_mod |
        |---|---|---|
        | 何も足さない | 0 | 0 |
        | A: 前と同じ書き方（再現） | 6 | 2 |
        | B: 概念の定義の式に r_shallow を書く | 6 | 1 |
        | C: 新しい語を足さず、読みの中身に r_shallow を書く | 5 | 1 |

        - A では、前と同じ named_mod の誤りが再現しました。
        - B は「r_shallow は動詞でない」で落ちました。法則の関係は、今は概念の定義の式に置けません。
        - C では、r_shallow から来た誤りはありませんでした。
        - 事前登録の判定では、B も C も誤りが出たので反証です。

        **含意**
        - C に残った 5 件は、すべて別の原因でした。読みに足した語「過大拡張」が、前の実験の後に足された語「個体の深さ」とまったく同じ式を持ち、同じものの別名として落ちています。
        - つまり、外れの理由は「浅い」が書けないことから、「過大拡張」に名前のほかの区別がないことに移りました。
        - 「浅い」の部分は、読みの中身になら書けます。概念の定義には書けません。

        **新しい仮説**: h_law_relation_in_mod（登録だけの PR #404、識別子化の決定 lang.d_cscl_display_derived に結んであります）
        - 中身は、概念の定義の式に法則の関係を置けるよう、検査器を広げることです。そうすれば「浅い」のような区別を、名前でなく定義の式に書けます。
        - 対になる体系の側の解き方は C の書き方で、これは今も誤りなく書けます。

        ロードマップ: 識別子化（a）の h_draw_on_with_shallow を終えました。次は h_concept_kind_excludes_verb と h_concept_kind_frame_free を対で確かめます。

        マージ待ちは #387・#394・#395・#396・#397・#403・#404 の 7 件です。#403 以外の 5 件は、main と衝突しないことを確かめてあります。
