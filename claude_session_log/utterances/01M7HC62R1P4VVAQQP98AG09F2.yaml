      text: |
        E3が効いた理由を考える前に、一つ心配を確かめました。学習用の適用例の答えが、概念ごとに「はい」か「いいえ」に偏っていれば、ベクトルは意味を覚えなくても「この語ならこちら」と答えを寄せるだけで正答率を上げられます。それを調べると、偏りはありましたが、ショートカットではありませんでした。

        ## 確かめたこと：答えの偏りに寄せただけか

        「学習用の適用例で多い方の答えを、評価でもそのまま答える」という基準を作り、その正答率を出しました。

        | | この基準の正答率 | E3の正答率（none→vec） |
        |---|---|---|
        | G2c | **0.92** | 0.38 → 0.75 |
        | G2k | **0.08** | 0.75 → 0.92 |

        偏りは強くあります。G2cの正解は学習側で多い答えとほぼ同じで、G2kの正解はほぼ逆です。ベクトルが答えの偏りに寄せただけなら、G2cは上がり、G2kは下がるはずです。実際にはG2kも上がりました。ベクトルは同じ語の中で、どちらの設問かを見分けています。少なくとも、答えの偏りだけでは説明できません。

        ## 効いていそうな理由（仮説）

        **1. 足す場所が「語の意味を引く処理」に当たる**
        語の位置の層8あたりは、トークン列が語の意味の表現に組み上がるところと考えられます。ここを書き換えると、後ろの層は推論のやり方を変えないまま、書き換わった意味を読みにいきます。ほかの層との比較もこれと合います。
        - 入力埋め込み（E12）は早すぎます。足せる量も約0.4と小さすぎました。
        - 層14は遅すぎます。判断を組み立てる最中に割り込み、対照側を壊します（h_layer14_lowers_control）。

        **2. 既存のキーからのずれとして学習している**
        多義の語には意味の候補が元からぶら下がっています。E3が足すのは、そこから目的の意味へ寄せる小さなずれです。新しいトークンから意味を組み上げる必要はありません。前に話した「再定義は候補からの選択」という見方そのものです。専用キー（E12）が効かなかったのは、選ぶ候補がないからだと説明できます。

        **3. 教師が、評価と同じ「適用」になっている**
        定義を言えるようになっても、適用には移りません（h_recite_does_not_transfer_to_apply）。効いているのは適用例の方です。学習しないE14にはこの教師がなく、意味の向きを取れませんでした。

        **4. 狭い学習しかしていない可能性がある**
        単層のベクトルは、別の使い方までは一貫しません（h_single_layer_does_not_reach_shared）。言い換えや説明には移りません。「意味を書き換えた」というより、「適用の二択で境界を引き直した」に近いかもしれません。

        ## 確かめ方の候補（どれも安く測れます）

        - **ベクトルの入れ替え:** 概念Aの設問に概念Bのベクトルを足します。意味を運んでいるなら正答率は落ち、「定義に従う」という一般的な構えなら大して落ちないはずです。仮説1と2を分けられます。
        - **ロジットレンズでの射影:** ベクトルが「はい−いいえ」の方向に直接どれだけ向いているかを測ります。答えを直接押しているのか、意味を経由しているのかを分けられます。
        - **層の掃引:** 層4、6、8、10、12で両群の正答率を並べます。仮説1の「意味を引く処理の層」が山になっているかを見ます。
        - **教師の分解:** 定義を言わせる教師だけ、適用例の教師だけ、両方の3通りで比べます。仮説3を直接確かめます。

        この順に進めるのがよいと考えます。どれかを走らせますか。
