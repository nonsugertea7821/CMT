      text: |
        その見方は妥当で、既存の研究とも今回の結果とも合います。単一の層を探す実験の組み方そのものを改めるべきだと考えます。

        ## 裏づけ

        - **モデルの構造がそうなっている。** 各層は、トークンのベクトルを作り直すのではなく、前の層までの結果に少しずつ足し込みます。語の意味は、多くの層にまたがって徐々に組み上がります。
        - **知識の編集の研究でも同じ結論が出ている。** 1つの層だけを書き換える手法より、連続する複数の層に修正を薄く分ける手法の方が、多数の編集に耐えることが示されています。「知識がある層」を特定しても、そこが編集に最適な層とは限らない、という報告もあります。
        - **今回の結果にも兆候がある。** 第8層でも第14層でも、衝突する設問の正答率は同じ 0.79 でした。特定の層に鋭く依存しているなら、こうはなりません。

        ## これまでの実験の問題点

        1つの層に、大きなベクトルを1本足していました。ベクトルの大きさは 20〜28 あり、その位置の表現を強く押しています。依存関係が薄く分布しているなら、これは1か所を力ずくで押して答えを変えているだけで、分布した意味表現を書き換えてはいない可能性があります。教えた使い方しか変わらない、という結果とも整合します。

        ## 改める点

        概念ごとに、連続する複数の層へ小さなベクトルを1本ずつ足す形にします。

        - **対象**: 浅い層から中ほどの層まで（たとえば第2層〜第13層）。
        - **大きさへの罰則**: ベクトルを小さく保つ項を学習に加えます。力ずくの解を避け、薄く分布した解を選ばせるためです。
        - **学習後の観察**: 各層のベクトルの大きさを見ます。どの層に修正が集まるかで、依存関係が分布しているのか、どこかに偏っているのかが分かります。あなたの仮説を直接確かめる測定になります。

        見たいことは、これまでと同じです。教えた使い方（定義文の暗唱、適用）に加えて、教えていない使い方（定義の言い換えの選択）が揃って変わるかどうかです。

        ## 進め方

        実行中の第20層と、やり直しの第4層は、単一層の比較対象として最後まで回します。その後に、この複数層の版を回します。コードはこれから書きます。
