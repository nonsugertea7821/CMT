      text: |
        はい、つながります。しかも、そのための道具はすでに公理と syntax にあります。手元で確かめたことを並べます。

        **すでにあるもの**
        - **公理の真偽の軸:** `truth: {source: refer, value: [true, false]}` です。真偽は「について述べる（refer）」の値で、文そのものではなく「述べたこと」が真偽を持ちます。
        - **閉世界:** `closed_world: {val: {truth: false}}` です。つまり閉世界は「書かれていない文を偽と述べる」ことで、すでに真偽の値として書かれています。
        - **開世界:** `open_world: {mod: {of: [v_agree, from], with: closed_world, neg: true}}` です。「閉世界に一致しない」という否定だけの定義です。親の world があるので法則 placed_deduced は通りますが、独立持続体と同じ形をしています。

        **「述べる」で揃えると**
        文 s について、取りうる状態は3つです。
        - **真と述べた:** refer(s) が true を持つ。
        - **偽と述べた:** refer(s) が false を持つ。これが古典否定で、「在らない」はこれになります。
        - **述べていない:** refer(s) がない。これが今の neg（示されていない）です。

        世界もこの上で、「述べていない文を、どう述べるか」という文として書けます。
        - **閉世界:** 述べていない文を偽と述べる（今の `val: {truth: false}`）。
        - **開世界:** 述べていない文を、述べないままにする。真偽の値を持たない、という肯定の定義になり、否定だけの定義をやめられます。
        - 対称に見ると、「述べていない文を真と述べる」世界もありえます。閉世界と鏡の位置にあたります。この組を体系に置くかどうかは、使われるかどうか（観察）で決めるべきだと考えます。

        こう揃えると、次のように対称になります。
        - exists と not exists は、同じ文を真と述べるか偽と述べるかの違いになります。
        - 閉世界と開世界は、述べていない文に値を与えるか与えないかの違いになります。どちらも体系の中の文として「述べ」られます。検査器の動き方の切り替えではなくなります。

        **直すことになる場所（案）**
        1. **実行器（runtime.py）:** 状態を「文 → true / false」の対応にします。
           - post の否定は、文を消すのではなく false と述べることにします。
           - pre の否定は、false と述べられているかで確かめます。
           - 述べていない文は、宣言された世界の文に従って読みます。
        2. **最初の状態:** 否定を書くことを誤りにしている検査を外し、偽と述べる文として受け付けます。
        3. **事実の書き方:** 「示されていない」（neg）と「偽と述べる」を書き分けます。書き方は、`val: {truth: false}` を事実に許すのが、今ある軸の使い方に沿います。
        4. **open_world:** 「述べていない文は値を持たない」という肯定の定義に書き換えます。
        5. **観察を加える:** 開世界で作る動詞が動けるようになったこと、壊したあとが「偽」になることを、実行の記録（exp/tests）で示します。

        1〜3 は言語の変更なので claude/cscl で行い、4〜5 もそこで行うのがよいと考えます。PR #93 とは別にします。この方向で進めてよいですか。
