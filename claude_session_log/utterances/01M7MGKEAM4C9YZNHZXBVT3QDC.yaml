      text: |
        差分ベクトルの見方には、先行研究が既にあります。ただ、形式の体系の限定と対応づけ、それを教師にした研究は、今回の範囲では見つかりませんでした。今回は調べただけで、まだ何も記録していません。

        ## 近い先行研究と、その観察

        **1. Park, Choe, Jiang & Veitch 2024/2025（ICLR 2025）「The Geometry of Categorical and Hierarchical Concepts in LLMs」** — 一番近い研究です。
        - 主張：上位概念のベクトルは、「子 − 親」の差分と直交します。つまり、子 = 親 + 直交する差分です。CSCL の「extends + mod」と同じ形をしています。
        - 観察：
          - Gemma-2B で主に検証しています。LLaMA-3-8B でもおおむね同じ結果です。
          - 使った概念は WordNet の名詞 593、動詞 364 です。
          - 差分と親の cos は 0 に近く、親を無作為に選ぶと 0 から離れます。
          - 正確な平均値は本文になく、図だけです。
        - 条件：この構造は、因果内積（白色化）の空間でしか現れません。
        - 反論：Nava & Wyart 2026 は、階層の幾何は確かにあるが、厳密な直交方向から来ているとは限らない、としています。

        **2. Hernandez et al. 2024（ICLR）「Linearity of Relation Decoding」**
        - 主張：関係（例：「首都」）は、主語の表現に一つの線形変換をかけることで近似できます。異なる主語に同じ演算子が使えます。
        - 観察：
          - 一部の関係でしか忠実になりません。
          - Company CEO 関係では、どの手法でも忠実度は 6% 以下です。
        - 含意：限定を差分ベクトルではなく演算子として扱う、という見方の前例です。

        **3. Christ et al. 2025「The Structure of Relation Decoding Linear Operators」**
        - 主張：関係ごとの演算子は、関係そのものではなく、共有された性質を取り出しています（例：性別、国）。
        - 観察（GPT-J）：
          - 47 関係分の行列（約 7.9 億パラメータ）を、100 万パラメータ未満のテンソルネットワークに圧縮できました。それでいて忠実度はベースラインを上回ります。
          - 拡張データ（79 関係）での平均忠実度は 0.42 で、多数派ベースラインは 0.30 です。
          - 見ていない関係への汎化は弱いです。算術の関係だけは 0.96 まで汎化します。
        - 含意：限定が「性質」として共有されるなら、限定を独立したノードにする設計は裏づけられます。一方で、未知の組み合わせへの汎化が弱いという点は、警告になります。

        **4. ステアリングベクトルの合成**（ActAdd、CAA、関数ベクトル、2026 年の合成ステアリングの研究）
        - 差分ベクトルを足して合成すると、まとまりのある出力が崩れやすい、という報告があります。
        - ただ、「同じ属性のベクトルを別の概念に移す」ことだけを切り出して試した研究は、見つかりませんでした。

        **5. 記述論理の幾何埋め込み**（Box²EL など）
        - 包含関係を、ベクトルではなく領域（箱）で表します。
        - LLM とはつながっていません。ただ、公理を幾何的に保証するという点では、言語側の比較対象になります。

        ## 新規性として残りそうな点
        - 先行研究は、どれも「既にある表現に差分構造があるか」を観察しています。
        - 次の2点は、今回の範囲では見つかりませんでした。
          - 形式言語の限定を名前付きの単位にし、その差分ベクトルを教師として学習すること
          - 一度も教えていない「親 + 限定」の組み合わせに移るかを試すこと
        - Christ et al. の、見ていない関係には汎化しにくいという結果は、そのまま反証になり得る予測を与えます。仮説として立てる価値があります。

        ## 未確認の点
        - 2026 年の合成ステアリングの研究は、本文を読めていません。
        - Park et al. の数値は図にしかありません。
        - 今回は検索の要約と、取得したページの要約からの情報です。PDF はまだ精読していません。

        前回と同じように、これらを主張と観察として #88 か別の PR に記録しましょうか。その場合は PDF を読んで、表の数値だけを書き写します。

