        #669（h_charts_meet_at_ontology_top の登録）が、型検査で落ちていました。直して push し、本文にも経緯を書き足しました。

        - **原因**: 依存（v_depend）の終点は続く物（continuant）に限られていて、出来事（occurrent）は置けません。終点に continuant と occurrent を並べて書いていたのが誤りでした。
        - **直し方**: 終点を ontology.continuant だけにし、仮説を「どの領域も、続く物の最上位に依存する」としました。
        - **限界**: 出来事の側への依存は、この式では問えません。

