        **Entailment (`entail_by_with`)**
        Two mods with the same verb and position (`r_same_slot`), where A's `with`-end is a descendant (`r_ancestor`) of B's `with`-end, and neither has neg/quant/at (`r_qualified`): then A entails B.
        - `r_has` = `r_acc` + entailed formulas.

        **Order laws via entailment**
        - `monotone` (now uses r_has), `specific` (still r_acc) and `one_name` (mutual entailment = same thing) are all laws about the entailment order.
