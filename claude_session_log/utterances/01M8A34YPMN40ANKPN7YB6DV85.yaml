        1 時間ごとの見回りの報告です。

        **軽い枠：`h_domain_in_formula`（issue #528、PR #891）**
        - 問い：動詞を名前を使わずに式だけで分けるとき、どの領域で宣言したかの条件は、まだ要るか。
        - 結果は支持（要る）です。式の読みに「生む個体の種類」まで入れても、領域の条件がなければ別の動詞が下位に紛れ込みます。そういう対が 7 つあり、ほとんどは上流の領域の「依存」の動詞が、exp の「頼る」「転移する」の下位に読まれるものです。
        - 結果の commit のメッセージに読み違いを 1 つ書いてしまいました。「頼る」と「転移する」は、前の実験（#529）より前からあった動詞です。7 対がこれまで見えなかったのは、前の実験が領域の条件ありの数しか報告していなかったからです。PR の本文で訂正を開示しました。判定と数には影響しません。
        - CI の結果待ちです。通ったら Draft を外します。

        **含意から出した新しい仮説：`h_domain_sep_by_extends`（PR #892、登録だけ）**
        - 7 対の区別は、exp の動詞を上流の動詞の特化（extends）として書けば、領域の条件なしで立つのではないか、という仮説です。
        - 支持なら領域を式から外せます。反証なら領域を式に入れることになります。

        **重い枠：E66（PR #890）**
        - 3 概念目まで学習が済みました。1 概念あたり 5〜8 分かかっています。

        ロードマップでは、「表示語を式から導く」決定（`d_cscl_display_derived`）を支える仮説を 1 つ確かめ、次の仮説を 1 つ登録しました。重い枠では、使い方をまたいだ一貫性の物差し（H0）を進めています。
