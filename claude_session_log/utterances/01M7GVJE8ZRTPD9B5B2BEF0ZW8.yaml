        (a) と (b) の実験を用意し、(a) の E12 を走らせ始めました。(b) の E13 は、E12 が終わってから自動で走らせます。どちらもまだ結果は出ていません。コードと仮説・残り項目はコミット・プッシュ済みです。

        ## (a) E12：具象概念に専用のキーを与える（`experiments/e12_dedicated_key.py`）

        - 概念ごとに新しいトークン（`<概念00>` など）を1つ足し、その入力埋め込みだけを学習します。モデル本体の重みは固定です。
        - 初期値は、語のトークンの埋め込みの平均にしました。
        - 教師は E3 と同じく、定義文の暗唱と適用例の二択の両方です。プロンプトと設問の中の語を専用トークンに置き換えます。
        - 語を専用トークンに置き換えるのは、外側で文字列一致で行います（用語サーバーの役）。
        - 比べる条件は4つです。

        | 条件 | 内容 |
        |---|---|
        | none | 語のまま、何も与えない |
        | tok0 | 語を専用トークンに置き換えるが、埋め込みは学習前のまま。置き換えそのものの効果を見る |
        | tok | 語を、学習した専用トークンに置き換える |
        | word+tok | 語の直後に専用トークンを添える |

        - 1語で試したところ、学習率 0.01 では埋め込みの大きさ（約1）に比べて一歩が大きすぎ、損失が発散しました。0.002 にすると 1.85 から 0.39 まで下がり、E3 と同じくらい収束しました。
        - 埋め込みから全層を逆伝播するので、メモリが足りなくなりました。一度に流すトークン数の上限を引数にして対処しました（E3 の既定の動作は変えていません）。
        - 1語あたり約6分で、24語で2時間半ほどかかる見込みです。

        ## (b) E13：事実だけモデルに聞き、帰属は体系で決める（`experiments/e13_fact_then_symbolic.py`）

        - 概念式の1行「上位 ∧ 限定」から、はい／いいえで答える2つの問いを作ります。モデルには再定義された語を見せません。
        - 例えば「未成年」なら、「対象は『人』に当たるか」と「対象の年齢（歳）は25未満である」の2つを聞きます。
        - 帰属は、上位と限定の答えの連言で決めます。限定に否定（¬）がある概念は、肯定の形で聞いて体系の側で反転します。
        - 比べる条件は次のとおりです。
          - none：定義なしで即答
          - near：日本語の定義文を直前に置いて即答
          - symbolic：上の分け方で事実だけ答えさせ、帰属は体系で決める
          - symbolic_mod：限定の答えだけで決める。上位が「質」のように抽象すぎる概念があるため、比較用に足しました
        - 対象にする設問は48問のうち46問です。
          - 「週」の2問は「〈対象〉は〈語〉に当たるか」の形ではないため外しました。
          - 「国内」の2問は「国内への配送」を対象にしていて、上位の「土地」と噛み合いません。これは結果を読むときの注意点です。
        - 限定の文は概念式から機械的に作りました。「何かが対象に対して『契約を結ぶ』という関係が成り立つ」のように、ぎこちない文も残っています。

