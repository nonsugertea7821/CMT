      text: |
        関係がある可能性は高いと考えます。ただし、注意の重みそのものはまだ測っていないので、以下は結果からの推測です。

        ## 注意機構で説明できる部分

        モデルが文脈中の定義を使うとき、設問の側から定義の位置へ情報を運ぶのは注意機構です。注意の重みは合計が1になるように正規化されるので、似た候補が増えると1つあたりの取り分が減ります。

        - **同じ形式の定義は互いに競合する。** 「語：当プロジェクトでは〜を指す」という形の行は、注意の照合で似た見え方をします。数が増えると、関係する定義への注意が薄まります。
        - **無関係な文章は競合しない。** 形式が違うので、照合の候補になりません。

        これは、定義の種類を問わず落ちること、無関係な文章では落ちないこと、数が増えるほど下がることと合います。

        ## 新しい語が落ちない理由

        答えは、2つの情報源の競り合いで決まると考えられます。

        1. 注意機構が文脈の定義から運んでくる情報
        2. 設問中の語そのものが、重みから呼び出す元の意味

        1 が弱まると 2 が勝ちます。新しい語には 2 がないので、1 が多少薄まっても答えは変わりません。

        ## 単純な「薄まり」では説明できない部分

        1点、合わない結果があります。55定義の用語集で、関係する定義を先頭に置いたときは落ちませんでした（0.71）。競合する定義は54個あり、後ろにあるか前にあるかが違うだけです。単純な薄まりなら、順序に関係なく落ちるはずです。

        考えられる説明は2つあります。

        - **先頭の項目は注意を集めやすい。** 文脈の冒頭に近い位置へ注意が偏る傾向は、既存の研究で知られています。
        - **定義自体の表現が、前にあるものの影響を受ける。** モデルは左から右へ読むので、あとに置かれた定義は、前の定義群を見たうえで表現が作られます。「長い一覧の何番目かの項目」として埋もれた表現になり、「従うべき指示の直後の定義」という性格が薄れる可能性があります。

        どちらが効いているかは分かりません。

        ## 確かめ方

        2段階で検証できます。

        1. **観測**: 答えの位置と設問中の語の位置から、関係する定義へ向かう注意の量を条件ごとに測ります。正答率の高い条件ほど注意が多ければ、対応が確認できます。
        2. **介入**: 他の定義への注意を遮断したときに、正答率が戻るかを見ます。戻れば、競合が原因だと言えます。観測だけでは相関にとどまるので、こちらが決め手です。

        この検証を予定に加え、設計文書の残り項目に記録しました。層を変えた学習が終わったあとに実施します。
