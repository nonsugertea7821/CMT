      text: |
        これまでの実験はすべて同じ1.5Bモデルで、同じ二択の問題を使っているので、正答率をそのまま並べて比べられます。G2cは元の意味と衝突する再定義、G2kは対照です。

        ## 横並びの比較

        | 入れ方 | G2c | G2k | 型 |
        |---|---|---|---|
        | 何もなし | 0.38 | 0.75 | 基準 |
        | 定義文を直前に置く（near） | 0.54〜0.61 | 0.62〜0.75 | 衝突側が少し上がる |
        | 概念式を置く（E10 expr, masked_i） | 0.58前後 | 0.62前後 | 衝突側が上がり、対照側が下がる |
        | 無意味化した概念式（E10-opaque） | **0.67** | 0.58 | 同上で、振れ幅がより大きい |
        | 事実を聞き帰属は体系で決める（E13） | 0.43〜0.52 | 0.74〜0.78 | 衝突側がほとんど上がらない |
        | 専用キー（E12） | 0.46〜0.50 | 0.71〜0.75 | 効果なし |
        | 学習しない差分ベクトル（E14） | 0.50〜0.62（両方ほぼ0） | 0.46 | 判断が壊れる |
        | **学習した層8のベクトル（E3、定義＋適用例で学習）** | **0.75** | **0.92** | 両方上がる |

        ## 示唆

        **1. 両方を上げられたのは E3 だけです。** 衝突側を上げる手はどれも対照側を下げます。元の意味を抑えると、元の意味が正しい問題も落とすからです。中間層で、既存の語の位置に、適用例を教師にして勾配で学習したベクトルだけが、元の意味を消さずに目的の意味へ切り替えられました。再定義を「元からある意味の候補から一つを選ぶこと」と見る整理に合います。選ぶ操作はモデル自身の表現の中で学習したときだけ機能し、外から作った信号では機能していません。

        **2. 失敗した手には「入口」か「作り方」のどちらかに問題があります。**
        - **E12（入口の問題）:** 入力埋め込みに足したベクトルの大きさは約0.4しかなく、層8で働くには小さすぎます。学習の損失は下がったのに正答率は変わりませんでした。これは、定義を言えるようになっても適用はできないという既存の仮説（h_recite_does_not_transfer_to_apply）と同じ形です。新しいキーには、元の意味の候補が一つもぶら下がっていません。選べる候補がないので、選択という考え方では働きようがありません。
        - **E14（作り方の問題）:** ベクトルは各例と平均の cos が1.00で、語の意味ではなく、前に定義文を付けたことによる位置の差を拾っていました。学習しない差分は、意味の向きを取り出せていません。

        **3. 名前の意味を外すと計算させる方向に寄りますが、モデルの論理の弱さがそのまま出ます。** E10-opaque は、以前の改名の結果（h_opaque_renaming_raises と h_opaque_renaming_lowers_control が両方支持）を概念式でも再現しました。名前から元の意味が漏れなくなった分、衝突側は上がります。対照側は名前の手がかりを失って下がります。意味をcoreの論理演算子だけに運ばせる方針は、方向としては正しいと言えます。ただし1.5Bモデルでは、論理演算子だけから組み立てる力が足りていません。

        **4. 判断を分けると誤りが積み重なります。** E13の事実を問う設問は、選択肢の順序を入れ替えると答えが変わるものが多く、上位と限定の二つを掛け合わせると悪化しました。体系で記号的に決める部分が正しくても、入力される事実の判断が不安定なら全体は良くなりません。上位概念の問いはモデルにとって抽象的すぎ、限定の問いだけの方がましでした。

        ## 次の手の候補

        - **E3の教師を無意味化した概念式に替える:** 3で上がった衝突側を保ったまま、学習で対照側を守れるかを見ます。
        - **E12の専用トークンに、埋め込みではなく層8でベクトルを足す:** 入口の問題だけを切り分けられます。
        - **E14の位置の影響を消す:** 「無関係な定義文＋設問」との差を引きます。
        - **E13を限定の問いだけにし、順序に頑健な答えだけを採る:** 体系で帰属を決める考え方そのものが成り立つかを確かめます。

        各条件の問題は24問（記号で決めるE13だけ23問）なので、1問で正答率は約0.04動きます。E12の0.46と0.50（1〜2問の差）や、E13の0.39と0.43は誤差の範囲です。はっきり言えるのは、E3が両方を上げたこと、無意味化で衝突側が上がり対照側が下がる型、E14でロジット差が0になったことの三つです。
