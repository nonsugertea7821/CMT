        はい、少なくとも型検査器の側では、すでにそうなっています。ただし実行器の側は、そうなっていません。そのずれが、述べていない文の扱いを試していない場所と重なっています。コードを確かめました（体系は変えていません）。

        ## 型検査器：宣言 ＝ 存在
        - `type_checker.py:813-814` は、宣言されたノードすべてに `exists(nid)` を足しています。宣言すると、そのまま在ることになります。
        - 宣言されていない名前を使うと、真でも偽でもなく、「未定義」というエラーになります（`type_checker.py:1029` など）。宣言されていないものについての文は、そもそも文として成り立ちません。
        - 論理学では、これは Reiter の「領域閉包の仮定」（在るものは名前を持つものだけ）と「一意名の仮定」に当たります。開世界か閉世界かの問いは、この内側、つまり宣言されたもの同士の関係についてだけ起こります。

        この見方をとると、「述べていない文」は3段に分かれます。

        | 段 | 状態 | 扱い |
        |---|---|---|
        | 1 | 名前が宣言されていない | 文にならない（存在すらできない） |
        | 2 | 宣言されているが、シグネチャに合わない | 文にならない（述べられる条件を満たさない） |
        | 3 | 文として成り立つが、述べられていない | ここで初めて、世界が真偽を決める |

        シグネチャの位置もここで決まります。シグネチャは段 1 と段 3 の間にある、「在るものの組のうち、どれが文になれるか」の条件です。

        ## 実行器：宣言 ≠ 存在
        - 実行の記録 `exp/tests/adopt_withdraw.yaml` は、個体を宣言したうえで、`exists` を事実として別に書いています。
        - `v_design` は `pre: exists(to)` が述べられていないこと、`post: exists(to)` を要求します。つまり「宣言されているのに、まだ在らない」ものを前提にしています。
        - これが成り立つのは、閉世界の下で「述べていない exists は偽」と読むからです。実行器は、在るかどうかまで世界に任せています。

        ## つまり
        - 「宣言が存在を導く」を法則として立てると、`exists` は世界が決める対象ではなくなります。宣言で決まります。
        - その場合 `v_design` の「まだ在らない」は、段 1 の文、つまり述べられない文になります。設計するとは「宣言を足すこと」と読み替えることになります。
        - 逆に今のままなら、実行器では「在らない」も述べていない文として扱われます。この扱いは閉世界の 1 件の記録でしか試されていません。開世界で `v_design` を動かすと、pre が「決められない」になって止まるはずです。ここはまだ確かめていません。

        ## 観察にするなら
        これは今のところ仮説です。確かめ方の候補は次の2つです。
        1. 体系と記録の中で、宣言されているのに在らないことを要する箇所を数える。いま分かっているのは `v_design` だけです。それ以外が 0 件なら、「宣言 ＝ 存在」を法則にしても失うのは `v_design` の読み方だけ、という観察になります。
        2. 開世界で `v_design` を含む実行の記録を書き、今の実装で止まることを確かめる。こちらが、述べていない文の扱いの初めての試しになります。

        先に仮説として登録し、1 と 2 を確かめる、の順でよければ進めます。
