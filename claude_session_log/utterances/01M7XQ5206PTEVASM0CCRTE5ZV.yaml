      text: |
        原始概念とは、「それに当てはまるものが満たす条件（必要条件）」だけが書かれていて、「この条件を満たせば必ずそれだ」と言える条件（十分条件）までは書かれていない概念のことです。記述論理の KL-ONE が、この区別を明確にしました。

        **二つの種類の違い**
        - **定義済み概念**は、必要十分条件で書かれています。
          - 例：「母 ＝ 女性 かつ 子を持つ」。
          - 女性で子を持つものを見つければ、母だと判断できます。だから分類器は、定義を読むだけで位置を決められます（「女性」の下、「親」の下）。
        - **原始概念**は、必要条件しか書かれていません。
          - 例：「犬 ⊑ 動物」。犬は動物ですが、動物であることだけでは犬とは言えません。
          - 犬を犬にしている残りの部分は、式では書かれていません。そのため分類器は、犬の位置を導けません。「犬は動物の下」と宣言するしかありません。

        **なぜ原始概念が残るのか**
        世界のすべてを必要十分条件で書き切ることはできません。どこかで「これはこういうものだ」と名指しで置くしかない概念が残ります。それが原始概念で、ふつうは体系の土台に近いところに集まります。

        **この体系での当てはめ**
        - 名詞（動詞でない概念）は、mod と端で定義されています。法則 placed_deduced で位置を導けるので、定義済み概念として扱われています。
        - 動詞は、holds・端・mod を書いていても、それだけでは親が決まりませんでした。#561〜#574 の反証がそれを示しています。親を決める情報は、子が書かずに受け継いでいる欄（親の端・new_kind・mod）にありました。つまり、いまの動詞の自分の欄は必要条件どまりで、動詞は原始概念として振る舞っています。
        - その結果、動詞の extends は、導けるものではなく、宣言している情報になっています。

        **原始概念を定義済みにする方法**
        足りない条件を書き足して、必要十分にすればよいのです。動詞なら、受け継いでいる欄を全部自分で書くことにあたります。登録済みの h_verbs_state_own_kind_mod が、これを確かめる仮説です。ただしそうすると、書く量は増えます。宣言を親一つの木に限って、残りを推論に任せる Rector の正規化は、この二つの間の折り合いの付け方です。

        本線 a 識別子化、d_cscl_display_derived の下
