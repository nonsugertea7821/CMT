      text: |
        その方が筋が良いと思います。仮説として #971 に登録しました（登録だけなので、CI が通れば自動マージに乗るはずです）。

        **いまの same**
        - `signature.yaml` の `same` には中身の定義がなく、`{display: 同じである, arity: 2}` だけです。
        - 型検査器は、`same` を「名前が同じこと」（`x == y`）として評価しています（type_checker.py 594・604 行）。
        - つまり、いまの同一は名前の同一で、その意味は体系ではなく検査器のコードが与えています。

        **法則で禁じる場合（#970）との違い**
        - 法則で禁じると、`same` は名前のままです。同じ形の組は誤りになります。
        - `same` を形の同一にすると、同じ形の組は誤りではなく、同じ概念になります。分けたいなら種差を書きます。
        - 辞書の図にそのまま重なるのはこちらです。一意性（何が同じか）は形が決め、名前（鍵）はその「同じ形のまとまり」を指すだけになります。

        **気をつける点**
        - 個体は式を持たず、事実で書かれます。個体の `same` まで形の同一にすると、事実が同じ二つの個体が一つになります。そのため、まずは概念（種類）の `same` に限ると #971 の本文に書きました。
        - `same` の中身を、公理として式で書けるかは分かりません。書けずに検査器が与えるままなら、判定は mixed（支持と反証の中間）にすると、本文で事前に決めました。

        #970 は、この #971 と両立する仮説として残しています。
