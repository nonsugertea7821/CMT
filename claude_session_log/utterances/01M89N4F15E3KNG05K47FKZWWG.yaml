      text: |
        「上位概念ごとのまとまり（区画）」は、モデルの中に確かにあると言えます。モデルや言語を変えても出ます。一方で、その区画が、モデルが概念をどう使うかを左右しているかは、まだ測っていません。

        測り方は「中点のテスト」です。同じ集まりの 2 語について、モデルの途中（主に層 8）の状態の中点を取り、それが同じ集まりの語の近くに落ちる割合を見ます。

        **成り立つと分かったこと（支持）**
        - **上位概念は区画を作る**（h_cross_genus_lowers_midpoint）: 動物・果物・楽器・乗り物・家具の平均は 0.779 でした。「赤いもの」「丸いもの」のような性質の集まりは 0.193、でたらめな語の組は 0.054 です。区画になるのは性質ではなく、上位概念（CSCL の extends にあたるもの）です。
        - **量の近さより上位概念で決まる**（h_midpoint_depends_genus）: 重さや値段で半々に混ざる組で比べると、上位概念の方が 0.399 上でした（3 組とも同じ向き、層 14・20 でも同じ）。
        - **モデルの系統によらない**（h_midpoint_depends_model は反証）: llm-jp 0.579、sarashina 0.643、Qwen 0.586 で、どれでも出ました。
        - **言語によらない**（h_midpoint_language_invariant）: 英語の語でも出ました。
        - **ただし、その言語を読んで育ったモデルに限る**（h_midpoint_depends_pretext）: 日本語をほとんど学んでいないモデルでは、日本語の語からはまとまりが出ません（SmolLM2 0.571 → 0.086、OLMo 0.686 → 0.071）。

        **弱いところ（反証や、条件つき）**
        - **区画は語の字面にかなり頼る**（h_genus_region_immune_display は反証）: 語の表示を入れ替えると 0.779 から 0.229 まで落ちました。混ぜた条件では 0.436 で、偶然（0.048）よりはっきり上には残りました。意味だけで区画が立っているわけではなく、字面と結びついています。
        - **前から知っている語かどうかでは、状態の動きは変わらない**（h_state_by_prior_meaning は反証）: 実在の語と作った語で、差が出ませんでした。

        **ベクトルを足したときの振る舞い**
        - **区画をまたいで移る**: 限定や修飾のベクトルは、学習していない上位概念にも移りました（E22 で 0.50 → 0.75）。ただし組ごとの偏りが大きく、効かない組もありました。
        - **一つの層のベクトルだけでは、使い方をまたいだ一貫性に届かない**（h_single_layer_does_not_reach_shared は支持）。

        **まとめ**
        - 「上位概念は、モデルの中で区画として表れている」は、静かに読んだ範囲ではかなり強く出ています。モデル・言語・層をまたいで同じ向きです。幾何的に成り立つという読みは、この範囲では裏づけがあります。
        - 足りないのは次の二つです。
          - **区画が振る舞いを決めているか**: まだ測っていません。区画の幾何と概念の振る舞いをつなぐ仮説は、どれも未検証です。
            - あいまいさは区画の選び方か（h_ambiguity_is_region_choice）
            - 状態は区画を指しているか（h_state_points_region）
            - 兄弟概念の見分けは区画の上で起きるか（h_sibling_discrimination_on_region）
          - **書き替えとの関係**: 区画が字面と結びついているので、同じ語の意味を書き替えると、元の区画が抵抗するかもしれません。これは h_convex_prior_resists_redefinition として登録済みで、未検証です。目的の「書き替えた概念を一貫して使う」に直接かかわるのは、この仮説です。
        - 数の注意: 上位概念の集まりは 5 つ、概念は 24 程度と、少ない数での結果です。
