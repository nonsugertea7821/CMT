        過大拡張の予測を登録してから（1122b96）、すべての概念で測りました。

        **結果: 登録した判定では「予測は外れた」**

        | | 定義の端が浅い概念 | 深い概念 | 比 |
        |---|---|---|---|
        | 全体 | 12/86（14%） | 19/295（6%） | 2.2 倍 |
        | 前に見た概念を除く | 6/80（7.5%） | 14/281（5%） | 1.5 倍 |

        - 数えたのは、自分の定義を満たすのに自分の下に置かれていない概念を、1 つ以上持つ概念の割合です。
        - 浅い方が多いという向きは、予測どおりでした。ただ、登録した基準の「3 倍」には届きませんでした。前に見た概念を除くと、差はさらに小さくなります。
        - 走らせたら一度止まりました。定義の端に、概念ではなく個体（this_design）が来る式があったためです。結果を見る前に、個体の端を深さの計算から除く訂正をして、先に commit しました（b8deb03）。

        **どう解釈するか（登録していない、結果を見た後の読み）**
        「深くなるほど、なだらかに発達水準が上がる」という形ではありませんでした。端の深さごとに割合を出すと、こうなります。

        - 深さ 0（体系の一番上の端だけで定義）: 6/20、**30%**
        - 深さ 1 から先: ほぼ平らで 0〜11%

        集めすぎる数も、深さ 0 の概念が飛び抜けています。verb_ref は 80 個、hypothesis は 54 個を、定義は満たすのに下に置かれていない概念として抱えています。深い概念で一番多いものでも 6 個です。

        つまり見えた形は、**発達の段階が連続的に並んでいる**のではありません。**一番上の特徴だけで定義された、まったく分化していない概念が、大きく過大拡張している**という形です。

        あなたの直観に引きつけると、こう言えます。

        - 「分化していない概念は過大拡張する」は、データが支持しています。
        - 「階層の深さがそのまま発達の水準になる」は、今の数え方ではそう見えません。少なくとも、1 段目より先では差が出ていません。

        ただし、深さを「端の祖先の数」で数えた今のやり方が、発達水準をうまく表していない可能性もあります。例えば ontology の枝分かれの細かさは場所によって違うので、同じ「深さ 3」でも分化の度合いが揃っていないかもしれません。

        **記録**
        - 結果ファイル・exp.yaml の測定・claims.yaml の観察 3 件を足しました。
        - 検査ツール（exp_check.py）は通りました。
        - claude/cross に push 済みです（8885c6d）。

        **次: money を発達させる操作（予定どおり）**
        足す式の案です。money に「金額は金額とだけ大きさを比べられる」という式を足します。形は {of: [v_come_after, from], with: money} です。

        - ontology の注釈「単位は質の種類が決める」を、そのまま式にしたものです。新しい概念は増やしません。
        - sales は money の下にあるので、この式を受け継ぎ、正しい下位のまま残るはずです。
        - hour と days_overdue は、この式を持ちません。なので規則だけで money の下から外れるはずです。

        この形で、手順を登録してから測ってよいか教えてください。
