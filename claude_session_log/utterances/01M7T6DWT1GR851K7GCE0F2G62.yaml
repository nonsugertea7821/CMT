      text: |
        「英語でも同じか」を確かめた PR #368 は、結果が**支持**になったので Draft を外しました。見てマージしてください。

        **結果**（上位概念で集めた語と、性質で集めた語の、まとまりの差）

        | モデル | 英語 | 日本語（#364） |
        |---|---|---|
        | llm-jp | 0.69 | 0.58 |
        | sarashina | 0.36 | 0.64 |
        | Qwen2.5-1.5B | 0.56 | 0.59 |
        | Qwen2.5-0.5B | 0.66 | 0.50 |

        **読み**
        - 4 つのモデルすべてで、英語でも同じ形が出ました。上位概念で集めた語はまとまり、性質で集めた語はまとまりません。この形は言語の表面（日本語か英語か）によらないと言えます。
        - 目立つのは sarashina です。英語では、上位概念で集めた語のまとまり自体が 0.47 まで下がりました（日本語では 0.91）。sarashina は日本語を中心に学んだモデルです。形は残っていても、その言語の文章をどれだけ読んだかで、まとまりの強さが変わっているように見えます。
        - これは、次に確かめる「日本語を読んでいないモデルでは、日本語からまとまりが出ない」という見立ての向きと合います。
        - ただし、比べたのは日本語と英語の 2 つだけです。言語一般について言えるところまでは来ていません。

        **次**
        #368 がマージされたら、英語中心のモデル（SmolLM2・OLMo-2）で日本語と英語を測る実験（#367）に進みます。手順のスクリプトはもう書いてあり、#368 で足したスクリプトを読み込むので、マージを待ってから事前登録します。
