      text: |
        先に、割り込まれる直前の作業の結果を報告します。そのあと、ご質問の2点に答えます。

        ## 直前の作業：合わせ方が定義されていない種類をエラーにした

        - **入れた法則（sum_defined）:** 空間に属する種類は、自分か上位の種類について、合わせ方が書かれていなければなりません。書かれていなければエラーです。
        - **既存の spec で1件見つかりました。** 層の出力（layer_output）は空間に属していたのに、合わせ方がどこにも書かれていませんでした。
        - **直し方:** h′ = h ⊕ v を、層の出力について書き直しました。語の位置に限った隠れ状態（hidden_state）は、上位の層の出力からこの合わせ方を受け継ぎます。
        - **確認:** 合わせ方のない種類をわざと空間に置くと、捕まりました。「層の出力が h′ に依存する」も、依存の反対称で捕まります。
        - **代償:** 「隠れ状態（語の位置）が h′ に依存する」は、通るようになりました。前回の議論どおり、後の層の状態は h′ に実際に依存するので、私は正しい扱いだと考えています。

        検査（check_spec と run_spec）は通り、コミットして push 済みです（9193711）。

        ## 1. 実行時間

        check_spec の時間を測ってみました。プロファイラを付けた計測なので56秒と膨らんでいますが、普段は約14秒です。

        | 処理 | 時間 | 割合 |
        |---|---|---|
        | 法則の規則の評価（evaluate） | 約45秒 | 約8割 |
        | YAML の読み込み（34回） | 約10秒 | |

        遅さの主な原因は、言語よりもやり方にあります。

        - **規則の評価:** 毎回、全部の文に全部の規則を当て直しています（素朴な不動点の計算）。さらに、規則の文を解釈する処理（atom）が約850万回呼ばれています。前回の反復で新しく増えた文だけを使う方式（semi-naive 評価）にして、規則を最初に一度だけ解釈しておけば、Python のままでも何倍か速くなる見込みです。
        - **YAML:** 同じファイルを何度も読み直しています。一度だけ読み、C 実装の読み込み（CSafeLoader）を使えば、ほぼ消せます。

        Rust への移行は、規則の評価部分を切り出すなら効果があります。ただ、検査全体（約1400行）を書き直す費用は大きいです。まずこの2点を直して測り、それでも足りなければ、規則の評価だけを Rust に移すのがよいと考えています。

        ## 2. 「空間」は関係や軸と混同していないか

        結論から言うと、関係とも軸とも別物です。ただし、私の定義のしかたに問題がありました。

        **軸とは別物です。** この体系の軸（個数・割合・量・順番・文字列・真偽）は、関係について値を測る目盛りです。空間はそうではなく、種類の一つです。それに「合わせる」という操作が付いたもので、数学のベクトル空間（集合と演算の組）に当たります。

        「空間」という言葉は座標や次元を連想させるので、軸（とくに量）と紛れやすいです。名前は考え直したほうがよいかもしれません。

        **関係とも別物です。** 部分や依存のような基礎の関係は、二つのものの間に成り立つものです。空間はものの集まりの方です。

        **問題は定義のしかたにあります。** 私は空間を「合わせられる情報のすぐ下の種類」と、木の中の位置で決めました。これは最初の `v_compose` の向きと同じ種類の欠陥で、意味から導かれず、置き場所という約束で決まっています。

        概念式で書くなら、空間は「合わせることについて閉じた種類」です。属するものどうしを合わせた結果が、またその種類に入る、という意味です。こう定義すると、「同じ空間でしか合わせられない」は約束ではなく、閉じていることから導かれる帰結になります。

        ## 次の進め方

        次の2つを提案します。

        1. **空間の定義の書き直し:** 「合わせることについて閉じた種類」として定義し直し、名前も軸と紛れないもの（例えば「合わせられるものの集まり」）にします。
        2. **検査の高速化:** 規則の評価を、増えた文だけを使う方式にし、YAML の読み込みを一度にまとめます。

        1は core の定義に関わります。2は検査の作り直しです。どちらから進めるか、または両方進めてよいか、決めてもらえれば対応します。
