    display: 発言 728
    val:
      order: 728
      text: |
        その通りでした。「〇〇について閉じた」は限定なので、上位に「閉集合」があり、「合成について閉じた集合」はそれを合成で限定したもの、という形に直しました。検査（check_spec と run_spec）は通り、コミットして push 済みです（1c53027）。

        ## 変えた形

        ```yaml
        v_close:        {display: について閉じている, from: kind_collection, to: occurrent}
        closed_set:     {display: 閉集合, extends: kind_collection, mod: {of: [v_close, from]}}              # 何について閉じているかは下位で決める
        composable_set: {display: 合成について閉じた集合, extends: closed_set, mod: {of: [v_close, from], with: v_sum}}
        ```

        - 前は「合成できる情報の種類を成員にする」と書いていました。今は「合成について閉じている」です。成員が合成できることは、合成するの型から出てくるので、ここに書く必要がなくなりました。
        - 法則も合成に限らず、動詞一般で書き直しました。
          - `closed_under`：閉集合は、限定した動詞について閉じています。その動詞の事実の二つが同じ閉集合に属し、できたものもその中に入ることを求めます。
          - `op_defined`：閉集合に属する種類は、その動詞が定義されていなければなりません。

          前の sum_closed と sum_defined は、ここで動詞を合成にしたときに出てくる場合になりました。

        ## 確かめたこと

        | 入れた誤り | 結果 |
        |---|---|
        | 合成の結果が集合の外の種類になる | 捕まりました（closed_under） |
        | 合成が定義されていない種類を集合の中に置く | 捕まりました（op_defined） |
        | 種類の集まりそのものを成員にする | 捕まりました（collection_level） |
        | 何について閉じているかを書かない閉集合 | 捕まりました（closed_under） |
        | 二項の動詞（依存する）について閉じているとする | 捕まりました。二つから第三のものを作る動詞でなければ、閉じられないためです |

        最後の2行は、上位の概念を置いたことで新しく書けるようになった誤りです。

        ## 一点だけ判断したこと

        `v_close` の終点に入るのは、動詞（ノード）そのものです。ほかの限定では終点は「もの」の種類なので、ここだけ動詞を値として受け取ります。今の検査はそれを許していますが、型として「動詞を受け取る位置」をはっきり区別するかどうかは、まだ決めていません。閉集合が2階なので、動詞を受け取ってもおかしくないとは考えています。
