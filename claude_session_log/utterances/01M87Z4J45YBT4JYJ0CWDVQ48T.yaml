        内部の状態がどの概念にあたるかは、まだ特定できていません。分かったのは、概念どうしの関係が内部でどう表れるかの一部と、内部をいじって振る舞いを動かせる範囲です。以下の状態は、main の exp.yaml から読みました。

        ## 確かめて分かったこと
        **① 中点の帰属（2 つの概念の状態の中間がどちらに属するか）**: 6 つの仮説を確かめました。
        - 類（genus）で決まる（支持）。
        - 類をまたぐ語を混ぜると下がる（支持）。
        - 英語に替えても変わらない（支持）。
        - モデルを替えても違いは見えなかった（「モデルによる」は反証）。
        - 前に置く文章で変わる（支持）。

        ここが、領域の道でいちばん確かな足場です。

        **② 中点を内部から引き出す試み**: 軸で読み取る方法も、区間で切る方法も、中点の帰属を上げませんでした（どちらも反証）。

        **③ ある層に方向ベクトルを足して振る舞いを動かす**:
        - 1 つの層に足すと、再定義への追従も、対照の維持も上がる（支持）。
        - ただし、使い方をまたいだ一貫性には届かない（支持）。層を増やすと mixed で、説明させる使い方には移らない（反証）。
        - 層 14 に足すと、対照の維持が下がる（支持）。

        **④ 状態から概念を特定する試み**: 3 つとも反証でした。
        - 表示語ごとに状態が 1 つに決まる、は反証。
        - 式を書けば状態が 1 つに決まる、も反証。
        - 参照の演算子（v_refer の下の動詞）が共通の方向を持つ、も反証（#756）。

        ## まとめると
        - 内部は、類による「まとまり」は持っています。ただ、個々の概念の場所は、式ではなく字面や文脈で揺れます。
        - 内部から押せば振る舞いは動きます。ただ、それで一貫性が出るところまでは行っていません。
        - d_road_region は、まだ仮の決定（tentative）のままです。

        ## 残り
