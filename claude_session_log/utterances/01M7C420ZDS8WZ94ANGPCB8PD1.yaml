        「使い方をまたぐ転移」（E6）の最初の測定が終わりました。第8層の1本のベクトルは、教えた使い方だけを変え、別の使い方には転移しませんでした。

        ## 結果（Qwen2.5-1.5B、第8層、24概念）

        | ベクトルの教師 | 定義の二択でプロジェクトの定義を選ぶ率 | 定義文の出しやすさ（小さいほど出しやすい） | 適用する（衝突する設問／しない設問） |
        |---|---|---|---|
        | なし | 0.12 | 2.70 | 0.38／0.75 |
        | 定義文の暗唱 | 0.46 | 0.01 | 0.67／0.33 |
        | 適用例 | 0.33 | 3.01 | 0.79／0.92 |

        定義の二択は、定義文そのものではなく言い換えを選択肢にしています。文字列の一致ではなく内容で選べるかを見るためです。

        ## 読み取れること

        - **定義文の暗唱で学習したベクトルは、自分が暗唱する定義の言い換えを選べません。** 定義文は一字一句出せるのに、言い換えの二択は偶然の水準です。文字列を覚えただけで、内容は入っていません。
        - **適用例で学習したベクトルは、定義には転移しません。** 適用は変えますが、定義の二択は偶然の水準で、定義文はかえって出しにくくなりました。
        - **どちらのベクトルも、一般の意味への傾きは消しています。** 定義の二択でのロジット差は、なしの −2.57 から 0 付近に動きました。元の意味を弱めてはいるが、新しい意味を「定義する」使い方に入れてはいない、という状態です。

        あなたの抽象化で言えば、どちらも「使い方が共有している推論」には届いていません。再定義はまだ成功していない、というのが現時点の判定です。

        ## 次に回しているもの

        定義と適用の両方を教師にした学習を、第8層、第14層、第4層、第20層の順に連続で実行しています（このモデルは全28層）。層ごとに「適用する」側と「定義する」側の両方を測ります。

        見たいことは2点です。

        1. 両方を教えれば、両方が同時に成り立つか。それとも互いに干渉するか。
        2. 両方が揃って変わりやすい層があるか。

        1層あたり約2時間、全部で8時間ほどの見込みです。層ごとに保存するので、途中で止まっても続きから再開できます。あわせて学習の処理をまとめて実行する形に直し、1概念あたりの時間を4割ほど短縮しました。

        結果は `experiments/README.md` に記録し、プッシュ済みです。
