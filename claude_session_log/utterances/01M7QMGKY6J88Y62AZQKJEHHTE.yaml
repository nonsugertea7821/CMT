      text: |
        h_reading_ends_resolved は反証でした。PR #223 に結果を記録し、Draft を外しました。tc と ec は手元で通っています。

        宣言されていない名前を端に置いた読みの式 510 個のうち、490 個は検査に弾かれ、20 個が通りました。通った 20 個は2つの群に分かれます。

        | 群 | 数 | 理由 |
        |---|---|---|
        | 先行研究の主張（`pwc_…`） | 13 | 端の名前を確かめる処理が、仮説と決定の中身にしか掛かっていない。弾かれた残り 7 個も、端の確かめではなく、仮説と比べる別の確かめで間接に弾かれただけ |
        | 同じ主語の読みの式が2つあるときの、先に書いた方 | 7 | 型検査器が後の式で前の式を置き換えるので、前の式は読まれない |

        2つ目は、事前登録のときに「確かめていない」と書いていた心配が、実際に起きていたことになります。該当するのは `h_layers_unhardcode` と、`o_sys_money_*`・`o_sys_unit_axis_*` の観察 6 つで、先に書いた中身が検査にも使われていません。

        まとめると、名前を確かめているのは読みの式そのものではなく、それを読む検査の側です。読む検査のない種類や、読まれない式は、確かめられていません。

        この2つの群それぞれについて、次の仮説を登録しました（PR #226）。

        - `h_prior_claim_ends_resolved`: 先行研究の主張の読みの式も、宣言された名前に照らされる
        - `h_readings_many`: 「複数を許す」指定は読みの式に掛かる（同じ主語の式が2つあれば、両方が読まれる）

        1つ目を書くのに概念 `prior_claim_formula` を1つ足しました。体系の主張の側は実験の側の語を直接は指せないためです。概念を足したので auto-merge には乗りません。#226 は手で見てください。

        h_plural_from の実験はまだ走っています。
