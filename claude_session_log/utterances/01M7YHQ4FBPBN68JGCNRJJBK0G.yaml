      text: |
        示唆いただいた二つの読みを、対の仮説として PR #647 に登録しました。新しい概念を足すので、自動マージではなく手で見ていただく登録です。

        **往復の二つの読み**
        - **(A) 境界づけ**: 抽象と具体が既に暗黙に入った状態から、境界を引く操作です。`h_round_trip_bounds_present` として置き、教示の先を「兄弟概念の組を既に組み立てる層」にしたときに、兄弟概念の弁別が上がるか、を問います。
        - **(B) 形づくり**: 抽象も具体もない状態から、両方を認知する操作です。`h_round_trip_forms_absent` として置き、教示の先を「兄弟概念の組を組み立てない層」にしたときに、弁別が上がるか、を問います。
        - **E33 がどちらにあたるか**: E33 の兄弟概念の組は新しい語なので、E33 は (B) の形です。いまのところ round が効かないのは、「LLM は形づくりができない」側に寄ります。
        - **(A) の確かめ方**: モデルが既に知っている兄弟概念の組で、同じ none・both・round を比べます。E33 が終わったら、これを重い列の次の候補に加えます。
        - **式にできていないところ**: 「人間がどちらかをしていない」側は、体系に人間を表す概念がまだないので、今回は式にしていません。PR の本文にそう書きました。
        - 「どちらもある・どちらもない」を、兄弟の組を組み立てるかどうかで書いたので、否定の側は「まったく無い」より弱い書き方になっています。これも PR に書きました。

        **その他**
        - **E33**: また止まっていたので、途中の保存から再開しました。4 組目「赤納品/青納品」は both まで終わって 0/4 で、round はこれからです。
        - **PR #645**: h_law_without_domain の登録が自動でマージされました。
          - 下調べで、domain を前提に使う法則は、いまの syntax.yaml に 4 つ（sees・unique_in_domain・visible_self・layered）しかないとわかりました。4 つとも、名前の見え方と重なりの法則で、概念の分類の法則ではありません。
          - これを踏まえて事前登録を書きます。
        - **PR #644**: main との衝突を解き、取り込みを push しました。手で見ていただく判定のままです。

        本線 a 識別子化、d_consolidation_in_vector の下（E33 と、往復の対の仮説）と、d_cscl_display_derived の下（#644・#645）
