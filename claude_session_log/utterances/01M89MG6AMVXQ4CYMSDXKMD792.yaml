      text: |
        設計の話を、ふつうの言葉でまとめます。体系に書かれている設計の決定を読み直して書きました。

        ## 設計は何を目指しているか
        - モデルに、ある言葉の新しい意味（その現場だけの定義）を教えます。教えた後は、4 つの使い方のどれでもその意味で扱えるようにします。
        - 前の方針は「再定義を避けて、新しい語を作る」でした。今は「再定義そのものを通す」に置き換わっています。
        - 通ったかは、4 つの使い方で一貫して使えた割合で測ります。前の物差しは「再定義に従った割合」でしたが、これに置き換わっています。

        ## 採択済みの部品（もう決めたもの）
        1. **正本の置き場所**: 他の記述が頼る情報（定義など）は、型の付いたグラフにまとめます。
        2. **正本の書き方**: そのグラフは、このリポジトリの形式言語 CSCL で書きます。
        3. **文章は派生物**: モデルに見せる文章は、正本から作るものです。文章の側を直接書き換えません。
           - 言語の側にも対応する決定があります。表示の語（日本語の言い回し）は、体系（式）から導きます（d_cscl_display_derived）。
        4. **テストも材料**: テストの問いは「当てはめの例」の一種として扱い、教える材料にも使います。
        5. **どうやって教えるか**: モデルの種類で 2 通りに分けます。
           - 重みが手元にあるモデル（Qwen など）: 概念ベクトル（モデル内部に足し込む向き）が使えます。
           - API だけのモデル: 文章で教えるしかありません。

        ## 仮置きの部品（まだ決めていないもの）
        - 正本の中身は、定義と当てはめの例から成る。
        - 用語集は、その問いに関わる定義だけを選んで渡す。
        - 再定義は、用語集の先頭に置く。前に別の定義が並ぶと、追従が下がるため。
        - 判定（当てはめ）はベクトルに頼り、説明は文章に頼る。
        - 教えた変化を貯めておく場所は、教えたベクトルにする。

        ## 一貫性を上げる 3 つの道（仮置き）
        - **検査器の道**: モデルが CSCL で書いた文の正しさを、型の検査器が支えます。検査器の出力を、教える材料にも使います。
        - **区画の道**: 意味の空間で、2 つの例の中間がちゃんとその概念の側に落ちるか（概念の区画の形）が、一貫性を支えます。
        - **日本語の道**: 表示の語が自然な日本語なら、一貫性が上がります。
        - 3 つとも、言語の側の決定「表示の語は式から導く」に頼っています。

        ## 書いていて気づいた穴
        - 体系の中で「本設計」（this_design）は名前だけです。上の部品がどう組み合わさって本設計になるかは、式に書かれていません。grep で確かめると、出てくるのは目的の文の 1 か所だけでした。
        - なので、「採択済みの部品を組み合わせると、どう目的に届くか」という鎖は、私の頭の中と commit の文にしかありません。体系からは読めない状態です。
        - 見ていないところで進んでいると感じられた原因は、たぶんここにあります。

        #865 の書き方の決まりに、「設計:」の行を足しました。各報告で、その仕事が設計のどの部品を確かめているかを書きます。

        ロードマップの位置:
        - 目的: モデルに言葉の新しい意味を教え、4 つの使い方で一貫して使えるようにする。一貫して使えた割合で測る
        - 設計: E64 は、仮置きの「説明は文章に頼る」とは逆向きの手（説明をベクトルで教える）を使う。小さいモデルで、説明が一貫性の足を引っぱっているかを確かめる。足を引っぱっているなら、「判定はベクトル、説明は文章」という分担を見直す材料になる
        - 計画:
          - [済] 一貫して使えた割合を測る（E58） → 成績は、一番失敗する使い方で決まる
          - [済] 大きいモデルで「当てはめる」を上げる（E63） → 成績もそのまま上がった。足を引っぱるのは「当てはめる」
          - [今] 小さいモデルで「理由を言う」を上げる（E64、学習中） → 小さいモデルでは「理由を言う」も足を引っぱっているかが分かる
          - [次] 足を引っぱる使い方を、検査器の道か区画の道で上げられるか試す → 本設計にどちらの道を組み込むかが決まる
          - [先] 組み込んだ設計で、定義を置くだけのときより成績が上がるかを測る → 本設計で新しい意味を教えられるかが言える
        - 分かれ目: E64 で成績が付いてくれば、小さいモデルでは「当てはめる」と「理由を言う」の両方を上げる道を探す。付いてこなければ、「当てはめる」だけに絞る
