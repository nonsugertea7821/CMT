        2. Key Technical Concepts:

           **Checker architecture**
           - cscl.yaml `checkers: {exp: exp/src/exp_check.py}`.
           - tc build() loads all domains uniformly. check_all() imports the checkers and calls `check(T, O, Dm)`.
           - type_checker.py sets `sys.modules.setdefault("type_checker", sys.modules[__name__])` so the shared `errors` list is used.
           - `exp_check.build()` returns the compatible `(T, O, S, M, C)`.

           **syntax grammar.nodes declarations**
           - many, opposite, derive, via, verbatim.
           - verbatim replaced the old LITERAL list.

           **check_derived (after #87)**
           - A derive fact whose start states nothing via the `via` verb is an error.

           **compare_claims(T, a, b)**
           - Returns same, opposite, other, or None.
           - Compares through ancestors and uses the `opposite` declarations.

           **Measurement families**
           - Defined by facts: `v_file_of`, `v_rows_of`, `v_axis_of`, `v_value_of`, `v_denote`, `v_entry_of '{cond}'`, `v_metric_of`.
           - `stat()` metrics: accuracy, order_robust_accuracy, logit_margin, judged_accuracy, mean_value.
           - mean_value takes the mean over rows where `r[cond]` is numeric.
           - Value IDs look like "族.軸の値.指標", e.g. e6_L8_nll.none.mean_value.

           **Observations**
           - Form: `{is: v_refer, from: o_x, to: {is: v_come_before|v_near|..., from: id, to: id, new: tol}}`.
           - Observations are checked for truth.

