      text: |
        つまり、こういうことです。

        **一言で言うと**
        9 件の違反は、規則や x の側の誤りではありません。**y の定義が薄すぎる**ことの症状です。

        **仕組み**
        この体系は、「x が y の定義の式をすべて満たすなら、x は y の下に置くべき」と判断します。法則 specific がその判断です。判断の仕方そのものは正しいです。

        ところが、money の定義が「過程を測るもの」しかないとします。すると「hour は day を測る」「day は過程の一種」なので、hour は money の定義を満たしてしまいます。体系は筋の通った推論で「時間はお金の一種」と言っていることになります。

        おかしさは推論ではなく定義にあります。「犬」を「動物である」だけで定義したら猫も犬になる、というのと同じです。人間は名前から「money は通貨のこと」と分かるので、違反だと気づけます。式にはその知識が書かれていないので、体系には分かりません。これが前に言った「区別が名前にしかない」の中身です。

        **今回の測定が示したこと**
        定義が薄い概念には、式で見える特徴がありました。定義の端が「過程」「起きること」「人」のような、体系の一番上の方の一般的なものだけなのです。違反の y は 9 組中 8 組がそうでした。正しい上下関係では、33 組中 3 組だけでした。

        なので体系は、「この概念は定義が薄い（名前に頼っている）」と、式だけから自分で見つけられそうです。これはあなたの原則の「法則は式で検出できること」に合います。

        **ここから何が言えるか**
        - 違反を 9 件ずつ手で直すのは筋が違います。直すべきは money・verb_ref・age・opposite・hypothesis などの定義です。
        - 規則として持てるのは「定義の端が上の方だけの概念は、まだ定義が足りない」という検査です。これは違反が起きる前に警告できます。
        - ただし、今回の 8/9 は、見てから選んだ閾値で同じデータを確かめただけです。法則と言うにはまだ弱いです。

        **だから次は B（定義を厚くする）を勧めます**
        例えば money に「通貨の単位で測る」と式で足します。その結果、9 件が規則だけで外れるかを見ます。外れれば、「違反の原因は薄い定義」という読みが、観察だけでなく操作でも確かめられます。

        この方向で進めてよいか教えてください。
