        次は、歩ませ方を直した版を事前登録し直します。固定が十分に選ばれるようにし、歩んだ後の法則を見て手を選びます。ぶら下がりのもう一つの出どころ（`h_dangling_by_undeclared_new`）も同じ実験で見ます。

