      text: |
        大事です。調べると、concept は意図して生起体に置かれていました。しかも、今の導きの中心に来ます。

        **今の定義**
        - `concept: {display: 概念, extends: inference, mod: {of: [v_trigger, to], with: word}}`
          - 「概念とは、語が引き起こす推論」です。
        - `inference: {display: 推論, extends: process, mod: perform_to}`
        - `process: {display: 過程, extends: occurrent, ...}`

        concept は物ではなく、語を読んだときに起こる推論という出来事として定義されています。続いて残るのは語や定義（持続体の情報）のほうで、概念はそれが引き起こすものです。あなたが前に言った「概念を、限定によって特殊化する推論と定義するなら」とも一致します。

        **持続体の導き（self の範囲）から出ること**
        - 概念は生起体なので、self の位置に来られず、個体にもなりません。
        - 体系の中で名前を持って残るのは、ノード（定義・語）のほうです。概念は、その定義を作った推論です。
        - だから、「ノードを宣言すること」と「概念」は、別の側にあります。宣言されたノードは持続体の側、宣言を生んだ推論が概念の側です。

        **生起体の導きとのつながり**
        - **D2（前後のフレームを同じでなくするもの）** で読むと、概念は「限定で新しい宣言を足す歩み」になります。あなたの見立て「フレームからフレームへ、概念の差分は増え続ける」は、そのまま「概念（推論）が起こるたびに宣言が増える」と読めます。開世界の実行器でも、宣言が増えるのは在るようにする歩みだけでした。
        - ところが、今の concept の定義は変化に届きません。sys_layers の分類で、concept は refer（述べる・変わらない）でした。v_trigger も v_perform も、pre/post を持たない静的な動詞です。生起体と宣言されているのに、変化の中身がない状態です。
        - **D1（self を限定するもの）** で読めば、この食い違いは表に出ません。ただ、概念が何を変えるのかは書かれないままです。

        **まとめ**
        - 持続体を self と same から導くと、概念は「宣言を増やす推論」として、時間の向き（フレームの増大）の担い手になります。
        - 生起体を D2 で導くなら、concept の定義に「新しい宣言を在るようにする」中身が要ります。開世界の実行器の「在るようにする位置」と同じ形で、pre で新しい概念の宣言が述べられておらず、post で述べられている、という形です。
        - D1 なら今のままで矛盾はありません。ただ、概念が時間の向きを作ることは、言語の中に書かれないままです。

        D2 の側を見る価値は高いと考えます。まだ何も変更していません。進めるなら、次の3つを仮説として登録してから、体系の事実と照らし合わせます。
        - 持続体は self と same から導ける。
        - 生起体は D2 で導ける。
        - 概念は、宣言を在るようにする推論である。
