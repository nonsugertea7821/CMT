      text: |
        まとめられます。残った関係は、それぞれ別々の理由で残っていたのではなく、基本要素どうしの組み合わせの表の「どのマスを結ぶか」で決まっていました。

        ## 要素のマトリクス

        行は結ぶ側、列は結ばれる側です。持続体は、BFO の依存のしかたで3つに分かれます。

        | 結ぶ側 ＼ 結ばれる側 | 持続体 | 生起体 | 値 |
        |---|---|---|---|
        | **独立持続体** | part_of（部分である） | participates_in（関与する） | — |
        | **特定依存持続体**（質・役割・傾向性） | inheres_in（宿る） | realized_in（実現される） | has_value（値を取る） |
        | **汎用依存持続体**（情報） | is_about（について述べる） | is_about（同左） | — |
        | **生起体** | —（関与するの逆向き） | part_of（時間的な部分）、precedes（前にある） | — |

        原子関係は、このマスを埋める 7個です。part_of、participates_in、inheres_in、realized_in、has_value、is_about、precedes。

        ## 表にして分かったこと

        - **前回の一覧には抜けがありました。** 「独立持続体が生起体に関与する」（participates_in）のマスが空でした。動詞型の関係を「生起体＋関わる持続体」で定義するなら、ここが最も使う関係です。
        - **BFO の3分類は、表の行そのものです。** 「依存のしかた」という軸は、その実体がどの行の関係で他と結ばれるかを言い換えたものでした。独立して決めた分類ではなく、表から導かれます。
        - **順序（precedes）は、生起体どうしのマスにしかありません。** 私は「用語集の中で定義が前にある」のように、情報（持続体）の並びにも precedes を使っていました。表に従えば、これは原子ではなく、「その定義を読む処理が、先に起きる」という生起体の順序から導く関係です。実験で分かった「モデルは左から右へ読むので、前に並ぶ定義が効く」という事実とも、この形の方が合います。
        - **値に届くマスは1つだけです。** 質だけが値を取ります。分類の軸と値は、すべて「質が値を取る」を通して実体につながります。「持つ」型の関係（has_unit など）が一律に「質＋宿る＋値を取る」で定義できる、という前回の見立ては、ここから来ています。
        - **「生起体 → 持続体」のマスは空です。** 逆向きの関係（participates_in の逆）で足りるためです。

        ## 確認したいこと

        この表の形で合っているかを、一言で教えてください。合っていれば、これを土台に関係のツリーを作り直します。

        - 原子関係は上の 7個だけにする。
        - 他の関係はすべて、原子関係と実体の種類から述語論理で定義する。動詞型は生起体の種類、「持つ」型は質の種類を使う。
        - 検査に「原子関係は、表のマスを1つ指定しなければならない」という規則を加える。

        行や列の取り方が違う場合（たとえば、値の列を「分類」と「関係」に分けるべき、持続体を3つに割らず1行にすべき、など）は、その形を教えてください。

        実験は並行して進めます。E8 は学習の終盤で、結果が出たら `spec/` に記録します。
