      text: |
        そうですね。前の回答で「否定の限定は除くのが妥当」としたのは誤りでした。

        ## 論理演算での否定
        - ¬P は、P の真偽を反転させるだけです。
        - 式が使う記号は、P と同じです。
        - 「シグネチャから定まる分類」は、式がどの記号で書かれているかによる分類です。真か偽かによる分類ではありません。
        - だから否定があっても、分類は変わりません。

        ## 否定の主張の意味
        - 「設計されていない」と主張するには、「設計する」を語彙として持っている必要があります。
        - 否定の主張は、何も言っていないのではありません。P を前提にした、P についての主張です。
        - 「設計されていない言語」という定義は、「設計する」に依存しています。

        ## 結論
        1. 否定の限定も数えた版が正しい表です。
        2. その表では、syntax の 99 個のうち 67 個が「変わる」に入ります。原因は1つだけです。
           - `natural_language` は「設計されていない言語」と、否定で定義されています。
           - これを通じて、`word`、`concept`、`definition`、`role`、そして syntax の語の多くが、変化の語彙 `v_design` に依存しています。
        3. 前の回答では、この依存を「数え方の問題」として消していました。実際は、構造上の事実です。言語・語・概念という基本の語彙が、変化の語彙の上に立っています。

        ## 決めてほしいこと
        - **(a) この依存を正しいと認める。** 言語と、言語で書かれる記述は、すべて「変わる」の分類に属することになります。その場合、syntax は ontology より上の層だ、という今の並びとも矛盾しません。
        - **(b) `natural_language` の定義が不適切だと見る。** 否定によらない定義にするか、`language` との区別そのものを見直します。そうすれば、記述の語彙は「変わらない」側に戻ります。

        どちらを取るかで、層の境界が変わります。まだ何も変更していません。
