        **体系での今の状態:**

        1. **h_tops_derivable（反証）:** 中身は「依存する(最上位の置き場, シグネチャから定まる分類)」。
           - 持続体は、シグネチャからすべて導けました（ind_continuant 1.0）。
           - 生起体は、変化を持つものは導けました（dyn_occurrent 1.0）。
           - 外れたのは、生起体に置かれているのに、シグネチャ上は変化を持たない「静的な生起体」でした（static_occurrent 1.0、つまり当てはまるものがあった）。
           - 名詞の多くも静的で、変化に届くものは半分に満たない。概念を指す語は、変化を持つ割合が 0 でした。
           - つまり、今のシグネチャでは、持続体と生起体の境目の一部が式に出ていません。
        2. **後に立てた二つ（どちらも未検証）:**
