        **格の枠との関係（私の読み）:** 構図は同じだと思います。

        - **最上位:** 持続体か生起体かの区別の一部が、まだ式になく、説明文や表示語の側にあります。
        - **格の枠:** 動詞ごとの助詞の違いの多くが、まだ式になく、表示語の側にあります。

        どちらも、表示語に置いてある含意を式へ移せば、シグネチャから導ける、という仮説です。h_case_frame_by_signature を確かめる前に、h_w_from_frames と h_gloss_formula で最上位の側が導けるかを先に確かめるのが、順番として筋だと思います。最上位が導けないうちは、その下の格の枠も導けないはずだからです。
