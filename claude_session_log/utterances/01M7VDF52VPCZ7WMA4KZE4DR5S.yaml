        #427 の実験は「支持」になり、Draft を外しました。手順に訂正があるので自動マージには乗りません。PR で見てください。

        **最初の手順は誤りだった**
        - 足した二つの規則を、手順で `concept_expression` に結んでいました（`v_govern`）。ところが検査器は、規則で書いた法則がこの結び（掛かる節）を持つことを認めません。
        - そのため、どの版でも本題と関係のないエラーが 2 件ずつ出ました。
        - 事前の判定どおり、これは手順の誤りとして開示し、仮説の状態は変えていません。その結果も残してあります。

        **訂正した手順**
        - その二つの結びだけを除き、ほかは同じにしました。
        - 訂正の手順は、実行する前に commit してあります。

        **結果**
        - 試したすべての版で、規則が指すノードと、今の Python の検査が指すノードが一致しました。
        - 本題と関係のないエラーは 0 件でした。
        - 期待どおり、名前で書いていない版（M・I・S）だけが指摘され、名前で書いた版（B・N）は指摘されませんでした。

        **解釈**
        - 前の実験（#418）では、今ある文だけでは、named_mod（同じ限定は名前を付けた修飾語で書け、という法則）を規則で書けませんでした。
        - 今回わかったのは、問題が規則の書き方ではなかったことです。「どのノードが、どの中身を名前で書いたか」が文に入っていないことが原因でした。
        - その文と「名前を付けた修飾語の中身」の文の二つを足せば、named_mod は二つの規則で書けます。
          - 名前のある中身は名前で書く
          - 二つのノードが同じ中身を足すなら、その中身には名前がある
        - 実際に検査器と syntax.yaml を変えるのは、次の段です。

        tc と ec は、手元でエラーなく通りました。

        #426（実行器が実行する言語の概念を足すもの）も、引き続きあなたの手でのマージを待っています。

        ロードマップ: a（識別子化）で、named_mod は書き手の文を足せば規則にできるとわかった。次は、Python で書いた named_mod を規則に置き換える。
