      text: |
        はい、示唆します。ただし、実測値がそのまま要件になるわけではなく、分けて読む必要があります。

        ## 実測から言えること

        | 項目 | 実測（1.5B モデル、CPU 4コア） | 意味 |
        |---|---|---|
        | 概念1つのコンパイル | 約5.5分 | 短い設問8件の順伝播と逆伝播を30回、計240回ぶん |
        | 推論時の追加コスト | ほぼゼロ | 語の位置を探し、1つの層でベクトルを1回足すだけ |
        | 概念1つの保存量 | 約6KB | 1536次元のベクトル1本 |

        コストが掛かるのは変更のたびのコンパイルだけで、利用時には掛からない構造です。コンパイルの計算量は、おおよそ「モデルの大きさ × 適用例の数 × 反復回数」に比例します。

        今回の実装は最適化していません（CPU、適用例をまとめて処理していない）。5.5分は上限に近い値です。GPU なら同じ規模で数秒〜十数秒になると見込みますが、これは推定で、未計測です。

        ## 計算量より重い要件

        実行時間よりも、次の2点の方がシステム要件として効きます。

        1. **モデルの内部に手を入れられること。** コンパイルには勾配の計算が、推論には中間層への書き込みが必要です。重みが公開されていて自分で動かせるモデルでしか成り立ちません。API 経由でしか使えないモデル（Claude を含む）には、この方式は適用できません。そこでは文章での注入が唯一の経路になります。
        2. **推論基盤を自前で持つこと。** 中間層への加算は標準的な推論サービスにはない機能なので、自分で動かす推論環境が要ります。入力の途中計算を使い回す最適化（キャッシュ）も、ベクトルを変えるたびに無効になります。

        ## 設計への含意

        - **変更が多発する前提との相性は、コンパイルの待ち時間で決まります。** GPU で数秒なら、合意のたびにその場でコンパイルできます。数分かかる環境では、まとめて処理する運用になります。
        - **モデルを大きくすると、要件は急に上がります。** 逆伝播にはモデル全体を載せるメモリが必要です。数十億パラメータ級なら GPU 1枚に収まりますが、それ以上は複数枚が前提になります。
        - **API 型のモデルを使う場面は残ります。** そのため、文章での注入（関係する定義だけを直前に置く）と、衝突する語を避ける命名規則は、ベクトル方式が使えても必要であり続けます。

        まとめると、この改善を適用できるのは「重みを公開しているモデルを、自前の GPU 環境で動かせる場合」です。計算量そのものは小さく、障壁はアクセス権と推論基盤の側にあります。

        GPU での実測と、より大きいモデルでの計測は、いずれやっておくべき項目です。この環境には GPU がないので、今は推定にとどまります。
