      text: |
        はい、曖昧です。std は、何が入るかを式で決めていません。

        **体系にある std の定義は二つだけ**
        - 表示語「標準の語彙」。
        - 決定 `d_cscl_std_on_axiom`: std の層は公理の層に依存する。

        二つ目は必要条件でしかありません。std の上に積む exp も lang も公理に依存しているので、この条件では何が std に入るかが決まりません。「標準」という意味は表示語にしかなく、式になっていません。「名前で読んでよいのはシグネチャと文法の語だけ」という取り決めにも反した状態です。

        **さっきの実験への含意**
        「std は exp に偏っているか」は、基準がないので、そもそも問いとして立っていませんでした。実際に測ったのは「どの領域が使っているか」で、これは std の定義の候補の一つを暗に使っていたことになります。反証という結果は、その暗の定義のもとでの話です。

        **二つの解き方を対で登録しました（#596、自動マージ待ち）**
        以前の D(x) = D(親) + 差異 の、二つの向きにそのまま重なります。
        - `h_std_by_law`（下から、演繹の向き）: std の法則が推論に使う語を std とする。
          - #594 の結果で std に残った法則と、合成・閉集合の語がこれに当たります。
        - `h_std_by_shared_use`（上から、構成の向き）: 二つ以上の領域が共に使う語を std とする。
          - これを満たすのは、artifact と compose_from_model の二つだけです。法則はどの領域からも直接は使われていません。

        見込み（未検証）として、二つの定義が選ぶ集まりはほとんど重なりません。これが本当なら、あなたの言う「反する象限で成り立つ二つの性質」と同じ形になります。std は一つの集まりではなく、次の二つが重なる場所として定義すべきなのかもしれません。
        - 推論を担う語（法則の側）
        - 共有される語（使用の側）

        今の std は、この二つが区別されないまま一つのファイルに置かれていた、と読めます。

        **基礎語彙の実験への影響**
        この定義が決まらないと、基礎語彙を std に足すかどうかも決められません。なので、#596 を先に確かめます。

        本線 a 識別子化、d_cscl_display_derived の下
