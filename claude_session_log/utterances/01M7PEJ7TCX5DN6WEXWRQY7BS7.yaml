      text: |
        条件付きなら自動化してよいと思います。手でしか見られないのは「解釈が妥当か」の一点です。ほかの多くは機械で判定できます。ただし、PR に書かれた文や私の判断でマージするのではなく、GitHub の側にある条件で決まる形にします。

        **機械で見られる条件**
        - CI（tc と ec）が通っている。
        - 仮説の状態が、未検証から支持か反証に変わっている。
        - 事前登録が先にある。実験スクリプトの手順と判定が、結果ファイルより前の commit で入っている。その後の変更は「訂正」の書き足しだけである。
        - PR が触るのは、claims.yaml、exp の yaml、実験スクリプト、結果ファイルだけである。評価器や syntax を変える PR は対象外にする。

        **手で見るもの（自動にしない）**
        - 訂正を含む PR。訂正が妥当かは人が見る必要があります。sys_count_atom のような例です。
        - mixed になったもの。
        - 評価器や文法を変えるもの。

        つまり「事前登録どおりに走り、訂正なしで決着したもの」だけを自動にします。読みに判断が入るものは手に残します。

        **実装上の注意**
        - GitHub Actions の既定のトークン（`GITHUB_TOKEN`）でマージすると、その push では他のワークフローが起きません。そのため、issue を同期する sync（`issues.yml`）が走らず、issue が閉じません。
        - 対処は二つあります。マージした同じワークフローの中で sync も走らせるか、別のトークンを使うかです。

        上の条件は私の案で、まだ仮説として登録していません。進めるなら、取り決めどおり先に仮説として登録します。
