      text: |
        直観の裏付けを組み立てました。結論から言うと、型階層が書けない理由は二つの別々の欠けで、どちらも体系自身の定義から「埋めるべきだ」と導けます。

        ---

        ### 前提（体系が自分で言っていること）

        - **P1:** 文法は syntax で定義され、コードは訳すだけ（利用者の原則）。
        - **P2:** 個数の軸は `count: {source: any, value: number}`。つまり「どの関係についても、いくつと結ばれるかを見られる」と、ontology がすでに言っています。
        - **P3:** extends は文法の語です（grammar.nodes にある）。体系は文法の語を「自分の書き方について述べる語」として、自分の中に取り込んでいます。

        ### 欠け1: 階層が対象言語にない（反映の欠け）

        extends は事実 `extends(x, y)` になり、法則が `r_parent` と `r_ancestor` を導きます。ですが、限定の `of` に置けるのは動詞だけで、`r_ancestor` は動詞ではありません。体系は階層を使って推論しますが、階層について述べることはできません。

        - **論理学との類比:** Tarski の対象言語とメタ言語の区別です。型理論で言えば、部分型 `A <: B` が判断（Γ ⊢ ...）のままで、命題になっていない状態です。型の上で計算するには、宇宙（universe）や反映で、判断を対象の側へ持ち込む必要があります。
        - **形式概念分析との類比:** 概念束の順序は、形式文脈の属性ではありません。「この概念の深さ」は束を作った後の性質で、文脈の中の属性としては書けません。
        - **P3 と食い違う:** 体系は文法の語（extends）を取り込んでいるのに、その語が作る順序は取り込んでいません。語はあるのに、語が述べる関係がない。これは翻訳の途中で止まっている状態です。

        ### 欠け2: 数える意味論がない（数えることの欠け）

        かりに階層が動詞になっても、法則の評価器は否定つき Datalog で、集計を持ちません。

        - **計算機科学との類比:** 一階論理（と、集計のない Datalog）では、「鎖の長さ」を一様には定義できません。Ehrenfeucht–Fraïssé ゲームで示せる、よく知られた結果です。書けるのは「深さが k 以上」を k ごとに別の式で書くことだけです。私が抜け道として挙げた「祖先の鎖が3つ続けば深い」がまさにこれで、閾値が式の形（変数の数）に埋め込まれてしまいます。一様に書くには、数える能力を足すしかありません（記述計算量の FO+C、集計つき Datalog）。
        - **P2 と食い違う:** 体系は文法として `at: {count}` を持ち、個数の軸は「どの関係でも」と言っています。ところが評価器が数えるのは、個体が書いた数値だけです。統語は数えることを約束しているのに、意味論がそれを果たしていません。P1 に従えば、直すべきは定義ではなく翻訳（コード）の側です。

        ### 幾何学との類比: 深さは計量

        前に、self/any/same は原点・零・符号、mod と axis は次元、と見ました。その見方では、今の体系は次のような状態です。

        - 結合と順序の構造（refer、depend、値の after）はあります。
        - 概念空間そのものの計量がありません。
        - 深さは、頂（any）から概念までの距離、つまり概念のノルムです。

        Hilbert の幾何学で言うと、結合と順序の公理だけでは長さを定義できず、合同の公理を足して初めて「距離」が語れるのと同じです。「浅い」は、この体系が初めて必要とした計量の量だと読めます。

        ### 導けること

        1. 欠け1から: 階層を対象言語に取り込む。具体的には、「上位である」を基礎の関係にして、動詞を置く。P3 の整合性を回復する操作です。
        2. 欠け2から: 評価器に `at: {count}` の集計を足す。P2 の約束を果たす翻訳の修正で、言語の定義は増えません。
        3. 二つは独立です。1 だけでは数えられず、2 だけでは数える対象がありません。浅さを式で書くには両方が要ります。

        ### 弱点（正直なところ）

        - 深さを計量として使えるのは、階層の刻みが一様なときだけです。枝によって細かく分けられていると、同じ深さでも一般性が違います。グラフの測地距離が辺の密度に左右されるのと同じです。sys_specific_depth の傾向が、この非一様さにどこまで影響されているかは、まだ見ていません。
        - `is` も `r_parent` を導くので、親が複数ある場合の深さ（最長か最短か）を決める必要があります。

        この筋でよければ、まず「欠け2: 統語が約束した count を評価器が果たしていない」から進めるのがよいと思います。定義を変えずに翻訳を直すだけなので、P1 に一番素直です。事前登録して始めましょうか？
