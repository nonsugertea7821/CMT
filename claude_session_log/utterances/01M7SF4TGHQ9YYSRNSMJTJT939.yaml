      text: |
        前の答えで使ったのは「半開区間」でした。ここでは、半開区間を説明したうえで、名前の近い「半空間」も、これまでの座標の読みにつながるので説明します。

        ## 半開区間

        区間の両端のうち、片方だけを含むものです。

        - [a, b)：a は含み、b は含まない。a ≤ t < b
        - (a, b]：a は含まず、b は含む。

        **なぜ片方だけ含むのか**：区間をつないだとき、継ぎ目がちょうど一度だけ数えられるからです。

        > [a, b) ∪ [b, c) = [a, c)

        - 継ぎ目の b は、後ろの区間にだけ入ります。
        - 両端を含む閉区間 [a, b] と [b, c] をつなぐと、b が二度入って重なります。
        - 両端を含まない開区間 (a, b) と (b, c) では、b が抜けて隙間ができます。

        半開区間なら、時間を重なりも隙間もなく切り分けられます。

        **出現に当てはめると**：もの X が在る時間は、次のように書けます。

        > X が在る ⇔ t ∈ [t_出現, t_消滅)

        - 出現の瞬間 t_出現 には、X はもう在ります。在らない状態から在る状態へ切り替わる瞬間を、在る側に入れるということです。
        - 消滅の瞬間 t_消滅 には、X はもう在りません。
        - 消えない場合は [t_出現, ∞) です。前の答えで書いたのは、この形です。

        **体系との関係**：体系の pre と post は「前の状態」と「後の状態」で、境目の瞬間をどちらに入れるかは決めていません。この空白は、次のような場面で実際に効きます。

        - `pre_model_passage`（モデルより前の文章）を出現で書き直すとき、モデルの出現と同じ瞬間に公開された文章を、前に入れるかどうかが決まらない。
        - 二つの出来事が接するとき、たとえば `v_adopt`（採用する）の直後に `v_withdraw`（取り下げる）が起きるとき、境目の瞬間に役割が付いているかどうかが決まらない。

        半開の約束を一つ置けば、どちらも決まります。

        ## 半空間

        空間を一枚の平面（超平面）で二つに切った、片側のことです。

        > { x : a · x ≥ b }

        錐の順序とつながります。概念の座標は、限定を持つか持たないか（0 か 1）でした。

        - 「限定 i を持つ概念の集まり」は { x : x_i ≥ 1 } で、これは半空間です。
        - 「y の下位（y の限定をすべて持つ概念）の集まり」は、y が持つ限定 i ごとの半空間の共通部分です。

        > y の下位の集まり = ⋂_{i ∈ y} { x : x_i ≥ 1 }

        半空間の共通部分は凸で、錐の形になります。上位の関係は、半空間を重ねて切り出した錐として書けます。

        **意味**：上位と下位の関係は、名前の鎖（extends）がなくても、「どの限定を持つか」という半空間の条件だけで決まります。前に、上位の偽の側で座標の根拠がない組が見つかりました。これは、どの半空間でも切り分けられないのに、名前の鎖がないので「上位でない」とされていた組だと言い換えられます。

        ## まとめ

        | 道具 | 置く場所 | 体系で表すもの |
        |---|---|---|
        | ノルム | 概念の空間 | 深さ（積んだ限定の数） |
        | 錐の順序・半空間 | 概念の空間 | 上位と下位（限定を持つかの条件） |
        | 半開区間 | 時間の線 | 在る期間（出現と消滅の境目） |

        概念の空間の道具（ノルム、錐、半空間）は、「何であるか」を決めます。時間の線の道具（半開区間）は、「いつ在るか」を決めます。出現が概念の空間に置き場を持たないのは、出現が後者だからです。
