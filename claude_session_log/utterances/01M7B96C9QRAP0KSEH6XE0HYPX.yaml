      text: |
        日本語の題材で E1（定義を文章として渡したとき、モデルが定義に従うか）を実装して回しました。一般語の再定義では、定義を設問の直前に置いても従わない傾向が出ています。ただし問数が少なく、傾向の確認にとどまります。

        ## 測り方

        - **モデル**: Qwen2.5-1.5B-Instruct（0.5B も回しましたが、選択肢の位置への偏りが強すぎて解釈できませんでした）
        - **題材**: 日本語の二択 43問、定義は 44個
        - **判定**: 選択肢の順序を入れ替えた2回の平均

        条件は次の4種類です。

        - **定義なし**: 設問だけを出す。
        - **直前**: 設問に関係する定義だけを設問の直前に置く。
        - **用語集**: 全44定義をまとめてシステムプロンプトに置く。
        - **用語集＋無関係な文章**: 用語集のあとに無関係な文章を約500または約2000トークン挟む。

        ## 結果（正答率）

        | 設問の種類 | 問数 | 定義なし | 直前 | 用語集 | 用語集＋2000トークン |
        |---|---|---|---|---|---|
        | 一般の類義語・同音語（補償/保証/保障など） | 19 | 1.00 | 0.95 | 1.00 | 1.00 |
        | 一般語の再定義（元の意味と衝突する） | 12 | 0.42 | 0.58 | 0.25 | 0.33 |
        | 分化した兄弟概念（甲種注文/乙種注文など） | 8 | 0.38 | 1.00 | 0.62 | 0.62 |
        | 置換された用語（会員→利用者など） | 4 | 0.25 | 1.00 | 0.75 | 0.75 |

        ## 読み取れること

        - **再定義は、定義を渡しても従わない。** 定義なしで元の意味に強く傾いた5問のうち、定義を直前に置いて定義側に移ったのは1問、用語集では0問でした。「アルバイトも社員に含む」「役職を問わず権限があれば管理者」といった定義は、直前にあっても元の意味に負けています。
        - **分化と置換は、定義が直前にあれば従うが、用語集に埋めると落ちる。** 分化の設問では、内容にかかわらず兄弟の片方を選び続ける組が出ました。これは概念の混同そのものです。
        - **距離より、埋もれることが効く。** 無関係な文章を2000トークン挟んでも、用語集だけの場合からほとんど変わりません。

        ## 日本語の弱さは、まだ測れていない

        一般の類義語・同音語は、定義なしで満点でした。二択で選ばせる形式では、このモデルでも弱さが表に出ません。弱さが出るのは、おそらく文章を書かせたときの語の使い分けです。ここは設問を作り直す必要があります。

        ## 次の一手

        1. 再定義の設問を増やし、元の意味に強く傾くものだけに絞る（今回は衝突の弱い設問が混ざっています）。
        2. 日本語の弱さを測る設問を、文章を生成させて語の使い分けを検査する形に作り直す。
        3. 中間層への接続（E3）を同じ題材で実装し、今回の結果と比べる。

        設計文書はひとまず日本語のままで、実験を日本語で行う旨と今回の結果を追記してあります。英語にしたい場合は言ってください。

        コードと結果はブランチ `claude/model-concept-language-mapping-g0lw1i` にプッシュ済みです。

        - `experiments/README.md`（手順と結果）
        - `experiments/e1_context_injection.py`
        - `experiments/data/concepts_ja.json`
        - `docs/design.md`
