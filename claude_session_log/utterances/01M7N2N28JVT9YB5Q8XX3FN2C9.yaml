        2. Key Technical Concepts

           **Declaration and existence**
           - The type checker gives `exists` to every declared node, so for kinds, declaration = existence (domain closure).
           - The runtime pre-declares all individuals and treats `exists` as a truth-axis fluent.
           - 10 dynamic verbs create or remove existence: 9 creators, 1 remover (std.v_freeze).

           **Two kinds of openness**
           - Truth axis: closed_world vs world.
           - Declaration (domain) axis.
           - User: each frame is closed; the time direction is open; frame diffs only grow; v_freeze is truth-axis only; rewind is the only way to undeclare.

           **Pre/post readings**
           - pre: 6 true, 0 false, 12 unstated.
           - post: 24 true, 0 false, 5 unstated.
           - The world never decided anything in the existing run record.

           **Restriction and signature**
           - The mod grammar `[of, with, neg, quant, at]` = relation / concept / truth / quantity.
           - Named restrictions are qualities (54 of 57; the other 3 are role or disposition).
           - self is the implicit end of every mod (λself. v(self, X)).

           **Definition cycles (7, all positive)**
           - Fixed points; Russell's paradox if a cycle goes through negation; Knaster–Tarski; stratification (`strata()` already guards laws).
           - Law definition_stratified added.

           **exp_check rules**
           - Hypothesis status is derived from v_support / v_contradict. Support plus contradict → hyp_mixed, so partial-condition observations stay unlinked.
           - Prior work pattern: `pw_*` is `exp.prior_work`; `pwc_*` is `exp.prior_claim`; link with `exp.v_state` and a v_refer content. `exp.v_prior_same` requires the pwc content to equal the hypothesis content (check_derived).

