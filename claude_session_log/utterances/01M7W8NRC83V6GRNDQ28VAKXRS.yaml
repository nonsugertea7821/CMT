      text: |
        今回の結果も報告しておきます。

        **`h_mod_phrase_any_verb`（#472）は支持でした。PR は #473 です。** 訂正はなく、体系のファイルも変えていません。
        - 部分の動詞以外の限定 481 すべてに、「相手＋助詞＋動詞＋（位置）」という一つの型で句が付きました。検査も変わりません。
        - 名前を付けた限定 67 のうち 42 は、手で書いた表示語がすでにこの型と一字一句同じでした。人が手でこの型に従って書いていた、ということです。
        - 食い違った 25 は、態（述べられる）、助詞（に依存する）、名詞化（測る量である）といった、日本語の自然さの差でした。
        - 句は作れますが、自然ではありません（例: 「何でもへ上位に持つ（始点）」）。ここから先は b（日本語の自然さ）の仕事です。

        ロードマップ: a（識別子化）で、限定の句はすべて式から作れることまで確かめた。

        ---

        **再定義もその一種では、について**

        そう思います。再定義は、語彙化の歴史を、一つのプロジェクトの中で小さく速く起こすことです。プロジェクトが「この語はここではこの意味」と決めるのは、辞書の層を局所的に書き換えることにあたります。

        さっきの二層で整理すると、プロジェクトごとの語彙の揺れには二種類あります。
        - **辞書だけの揺れ**: 同じ概念に別の語を当てる。「顧客」と「利用者」、「出荷」と「発送」など。式は同じで、ラベルが違うだけです。
        - **式の揺れ**: 同じ語で、指す概念が違う。あるプロジェクトの「出荷」は返品の再出荷を含み、別のプロジェクトでは含まない、など。これは限定が違う、つまり概念そのものが違います。

        実務で困るのは、この二つが区別されないことだと思います。辞書の違いなら置き換えれば済みます。式の違いなのに同じ語が使われると、気づかないまま意味がずれます。「概念を正しく使う機構がない」というのは、語の層と式の層が分かれていないので、どちらの揺れかを判定できない、ということだと読めます。

        今日の結果は、この分離の土台になっています。限定の句が式から作れるので、概念の同一性は式で決まり、語はプロジェクトごとの辞書として差し替えられます。二つのプロジェクトで語が違っても式が同じなら同じ概念で、語が同じでも式が違えば別の概念だと、検査器が判定できるようになります。

        LLM の側から見ると、再定義が難しいのは、一般の日本語の慣習が作った凸な領域が強い引力を持つからです。プロジェクトの再定義は、その引力に逆らって、語を別の領域に付け替えることになります。d_goal の「再定義がうまくいくこと」は、この付け替えにモデルが従えるかという問題です。辞書の付け替えなのか式の付け替えなのかで、難しさが違うかもしれません。
