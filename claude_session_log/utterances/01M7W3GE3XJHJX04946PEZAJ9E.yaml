      text: |
        #456 は、仮説 h_display_as_part_tree を確かめた PR です。仮説は「表示語を一本の文字列で持つのではなく、式の部分（限定）ごとに句として持てば、検査はその句だけを読んで正しく判定できる」というものです。結果は支持で、訂正が一度入っています。

        ## 背景
        法則 part_display_explicit は、表示語がどちら向きに「部分」を言っているか（A が B の部分なのか、A が B を部分に持つのか）が、式の限定の向きと合っているかを検査します。

        今は、法則がノードの表示名を丸ごと一本の文字列として読みます。そのため、一つの表示名に句が二つ入ると、法則はどの句がどの限定のものか区別できません。例は「試しBの部分である試しCを部分に持つ試しA」です。前の #450 は、この混線のために反証になりました。

        ## やったこと
        体系のファイルは書き換えず、一時の写しで試しました。

        - 文法の写しで、限定（mod）に display を書けるようにしました。
        - 検査器の写しで、法則は限定に句があればその句だけを読み、なければ今までどおり表示名を読むようにしました。
        - 部分の限定と全体の限定を両方持つ試しのノード zz_a を作り、四通りで走らせました。

        | 版 | 内容 | 法則の誤り |
        |---|---|---|
        | F | 句なし（今と同じ、表示名だけ） | 2（どちらの向きでも咎めてしまう） |
        | M | 限定ごとに正しい句 | **0**（正しく分けて読めた） |
        | X | 句を入れ替えた | 2（逆向きを正しく咎めた） |
        | G | 曖昧な句（「試しBから部分になる」） | 1（曖昧さを咎めた） |

        体系そのものを写しの検査器にかけても、誤りは増えも減りもしませんでした（lost 0、gained 0）。

        ## 訂正
        - 判定には「法則以外の新しい誤りが出ていないか」（other）も入れていました。最初の比べ方は誤りの文面で比べたので、other が 2 と出ました。
        - 中身を見ると、どの版でも同じく出る法則 single の誤りでした。限定に句を入れたぶん、誤りの文面だけが変わって見えていました。
        - この結果を開示してから、法則の名前で比べる訂正のスクリプトを実行の前に commit しました。訂正後は other が 0 で、支持になりました。
        - 訂正があるので、auto-merge の対象外になり、手でのマージを待っています。

        ## 読み方の注意
        - 実は、両方の限定を持つノードは、今の体系では法則 single（一つのノードが足せる限定は一つだけ）で禁じられています。実際の体系にはそういうノードが 0 です（n_both 0）。
        - ですから、この結果は「今の体系で困っていることを直した」ものではありません。言えるのは「句を限定ごとに持たせる形にしても検査は壊れず、句は限定ごとに正しく読み分けられる」ということです。
        - これが後の #459・#464・#465 の土台になりました。そこでは、句を書き手が書くのではなく、限定の式から訳しています。

        ロードマップ: a（識別子化）の一段です。#456 と #464 が手でのマージを待っています。
