      text: |
        README に入れる「変わらない部分」は、採用済みの決定に限るのがよいと思います。体系を見ると、決定のうち「採用」の状態のものが、ちょうどその役に当たります。

        - **目的:** モデルに語を再定義させたとき、その再定義がどれだけ通るかを上げる（d_goal）。測る量は、使い方をまたいでも再定義が保たれるか（d_metric）。
        - **正本:** 他の記述が依存する記述は、概念体系制御言語（CSCL）で、型付きの式として書く（d_source_of_truth_in_cscl）。自然言語の文は、正本から訳したものにする（d_rendered_text_is_derived）。
        - **研究の進め方:** 仮説は、確かめる前に事前登録する。状態は ec が照合し、issue に写る。

        一方、未検証や暫定のものと、測った数は変わるので、README には写さないほうが安全です。

        ## インパクトの強い伝え方

        説明を並べるより、一つの例で一巡を見せるのが強いと思います。例えば、次の 3 行です。

        ```
        式:      {is: v_lower, from: prior_collision, to: redefinition_following}
        日本語:  元の意味との衝突が再定義への追従を下げる
        状態:    支持（issue #NN、事前登録 → 測定 → ec の照合）
        ```

        この 3 行で、四つのことが一度に伝わります。
        - 主張がすべて型付きの式であること
        - 日本語は、その式から訳したものであること
        - 仮説ごとに検証の履歴があること
        - 反証も残すこと

        この「日本語」の行は、さっきの h_ja_roundtrip の変換器の出力です。後で式に読み戻せることも確かめてあるので、例として出す根拠になります。

        冒頭の一文には、問題を置くのがよいと思います。たとえば「モデルに語の意味を再定義しても、元の意味に引き戻される」です。ただ、これは測った結果に当たるので、言い切らずに issue へリンクする形にします。

        ## 研究中の内容とずれないようにする仕組み

        issue の同期と同じ仕組みを、README にも使うのが筋だと思います。

        1. **README を二つに分ける:**
           - 手で書く部分: 目的の一文、入口の案内、作業の取り決めへのリンク
           - 生成する部分: 採用済みの決定の一覧と、上の 3 行の例。印で囲み、「体系から生成。手で編集しない」と書く
        2. **CI で検査する:** 生成する部分が今の体系と違えば、CI を落とします。手で書いた部分に出てくる識別子（`d_goal` など）が、体系にあって「採用」の状態であることも確かめます。決定が取り下げられたら、README も直さないと通らなくなります。
        3. **変わるものは写さない:** 数や未検証の仮説は、issue のラベル（未検証・支持など）へのリンクだけにします。

        この形なら、手で書く部分は「何を目指すか」と「どこを見ればよいか」だけになり、ずれる余地がほとんどなくなります。

        ## 取り決めとの関係

        CI での検査は「やったほうがいい」の提案に当たります。取り決めでは、伝える前に仮説として登録することになっていますが、今回はそれより先にここで伝えています。この形で進めるなら、まず仮説として登録します。そのとき「README」の概念を足すことになるので、自動マージには乗らず、手で見る PR になります。

        伝え方の方向（3 行の例を冒頭に置くか、別の見せ方にするか）だけ決めてもらえれば、そこから作ります。
