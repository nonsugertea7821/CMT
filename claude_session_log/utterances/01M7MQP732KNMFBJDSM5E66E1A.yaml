      text: |
        はい、その読みは筋が通ると思います。ただし「開く」ものが2つあるので、そこを分けて言う必要があります。

        ## 開き方は2つある
        | | 閉じている | 開いている |
        |---|---|---|
        | **真偽（今の closed_world と world の軸）** | 述べていない文は偽 | 述べていない文は決められない |
        | **宣言（名前の範囲）** | 在るものは、宣言された名前のものだけ | まだ名前のないものが、これから在りうる |

        - 型検査器が扱う、時間によらない種類は、宣言の軸で閉じています。宣言 ＝ 存在です。
        - 時間が入ると、「これから生まれるもの」は今はまだ宣言されていません。宣言の軸が開きます。これが、おっしゃる「宣言レベルの開世界化」だと理解しました。
        - 真偽の軸は、それとは別に閉じたままでも構いません。ある時点で在るもの同士の、述べていない関係を偽と読むことはできます。

        ## 今の実行器は、宣言を閉じたまま偽装している
        コードで確かめたことです。
        - 実行の記録は、これから生まれる個体の名前も含めて、すべてを `individuals` に最初から宣言させます。記録を書く人が、未来に在るものを全部知っている前提です。
        - `applicable()`（runtime.py）は、宣言済みの個体の組み合わせだけを調べます。
        - その代わりに「宣言されているが `exists` は述べられていない」という中間の状態を作り、これを「まだ在らない」の意味で使っています。前回数えた、生成する動詞9個の pre がこれです。

        宣言を時間ごとに足せるなら、この中間状態は要りません。各時点では「宣言 ＝ 存在」で閉じていて、時間をまたぐと宣言が増える。この形で、あなたの「宣言が存在を導く」と時間が両立します。論理学では、Kripke 意味論の「領域が増えていくモデル」（直観主義論理）が近い形です。

        ## 合わないところ
        - `std.v_freeze` は「在る」を取り消します。`v_withdraw` も、述べた関係を取り消します。時間は、宣言が増えるだけの方向には進んでいません。Kripke の単調に増える形にそのままは乗らず、「宣言を取り消す」をどう読むかが残ります。
        - 生成する9個の動詞は、今ある唯一の実行の記録では1度も動いていません（記録の歩みは `v_adopt` と `v_withdraw` だけです）。偽装が実際に必要になる場面は、まだ1度も試されていません。

        ## ここから出てくる帰結（確かめられる形）
        宣言が開くなら、生成する動詞のうち、pre が「new が在ると述べられていない」だけのもの（`v_see`、`v_judge` など）は、新しい名前を使えばいつでも歩めます。すると、`halted`（もう歩めない）は決められなくなります。これは、今の実行器が開世界（真偽の軸）で `halted` を決められないとしているのと同じ形です。

        つまり、「時間 → 宣言が開く → 停止は決められない」が、真偽の開世界と同じ結論に行き着くかどうかが、確かめどころになります。

        ## 登録の案（前回の H1〜H3 を置き換えます）
        - **(H) 時間を含む実行では、宣言の範囲は開いている。各時点では、宣言 ＝ 存在で閉じている。**
        - **確かめ方:**
          - 生成する動詞を使う実行の記録を書く。
          - 次の2つの書き方で、同じ歩みが表せるかを見る。
            - (a) 今の書き方：名前を先に宣言し、`exists` で在ることを足す。
            - (b) 宣言を歩みで足す書き方：実行器の側に試しの実装が要ります。exp の中だけで作り、tc には触れません。
          - (b) で、`halted` が決められなくなるかを見る。
        - **反証の条件:** (b) で書けない歩みがある場合。特に `v_freeze` のような「消える」を、宣言の取り消しとして矛盾なく書けない場合は、反証とします。

        この形で登録して進めますか。
