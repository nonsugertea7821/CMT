      text: |
        賛成です。体系の今の作りを調べると、理由が2つ見つかりました。

        **1. 今の `any` は2つの別のものを1つの名前で書いていて、これは混同です。**
        - 端に書く `any`（23か所）は「どんな個体でもよい」という、最も広い種類を表しています。
        - しかし型検査はこれを `syntax.any`（存在の数量化。sentence の下にある文の種類）として扱っています（type_checker.py:812）。
        - 「文の種類」と「全ての個体の範囲」は種類が違うものです。前に定義した「概念の混同」（別のものをその名前で書くこと）がここにも起きています。

        **2. `any` は same からは導けないので、シグネチャに置くことになります。**
        - シグネチャの説明にあるとおり、在る（exists）は same から導かれます（自分と同じであるものは在る）。
        - 一方 `any` の範囲は、在るものより広くなければなりません。例えば設計する（v_design）の終点は、pre で「まだ在らない」とされた個体です。
        - そのため `any` を same(self, self) で定義すると「在るもの」に縮んでしまい、使い方と合いません。
        - `any` は、関係で定義される種類ではなく、変数 self が動く範囲そのもの（何も限定しない self）と読めます。self と同じ水準のものなので、シグネチャに置くのが筋です。

        **ここから出てくる整理（見込み）**
        - 前回の話とつながります。端が any で式が空の関係が全ての関係の親になるのは、any が「何も限定しない self の範囲」だからです。
        - `ontology.p`（any→any で exists(from)・exists(to) を持つ）は、それより1段狭く、「在るものどうしの関係の親」になります。

        **進め方の案**
        1. signature に `any` を個体として置きます。self と同じく、syntax の語で書きます。
        2. 型検査では、端の `any` をこの signature の `any` として解決します。法則 below_any（すべては any の下）は、その上で成り立つようにします。
        3. 数量化の `syntax.any` は、別の名前に分けて混同をなくします。数量化として書かれているのは 4 か所で、ほかに grammar.logic にも出てきます。

        シグネチャは体系の土台です。今は self と same しか置かない、と明記されています。ここに足すかどうかはあなたの判断なので、この方針でよいか確認させてください。順番は、この整理を先にやってから、前回の A（下位の動詞が上位の式に原子を足せるようにする）に進むのがよいと考えます。A で親子を書くとき、親の端に any がたくさん出てくるからです。
