      text: |
        仮説2（ものさしがまっすぐなら、切っても凸を保つ）は**反証**になりました。PR #357 の Draft は外してあります。二回目は手順を選び直しているので、手で見てもらう扱いです。

        ## 結果
        二回目では、量を「読める」かどうかを、主成分 3 本からの予測の順位相関で測り直しました。読める量は 4 つになり、前提は満たしました。それでも判定は外れました。

        - 外れた理由の一つは「数」です。読める量なのに、上半分で切っても両端で切っても同じ 0.96 でした。
        - もう一つ、読めない量（体重・値段）の差の平均は 0.41 で、読める量の差 0.18 より大きくなりました。

        ## 読み
        まっすぐに切るほうが一かたまりを保つ、という向きは、6 つの量のうち 5 つで出ています。ただ、それは「量を線形に読めるから」ではありませんでした。

        候補として残る説明は二つです。
        - 切り方の形そのもの（ひと続きか、両端か）。
        - 語がもともと作っている小さなかたまり（たとえば体重の大きい側の大型動物）。

        ## 新しい仮説（PR #358 で登録、手で見る）
        - `h_interval_cut_raises_midpoint`: ひと続きの区間で切ると、凸を保ちやすい（切り方の形が効く）。
        - `h_midpoint_depends_genus`: 凸を保つかどうかは、成員の上位概念で決まる（もともとのかたまりが効く）。

        どちらか一方だけが効いている、とは限りません。両方が同時に効いている可能性もあります。そこで、二つを分けて確かめる設計にします。

        このために概念 `interval_cut` を一つ足しました。ただ、「ひと続き」の意味はまだ式にできておらず、表示語に置いたままです。PR 本文にそう書いています。

        次の周回は 14:54Z です。
