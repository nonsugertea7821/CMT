      text: |
        前回の 2 の書き方が足りませんでした。具体例で説明し直します。途中に言い過ぎがあったので、それも直します。

        ## 前提：文の読み方は 3 つ、世界が決めるのはその 1 つだけ

        文「R(x, y)」を記録と照らすと、次の 3 つのどれかになります。

        - 真と述べてある
        - 偽と述べてある（`val: {truth: false}`）
        - 述べられていない（`neg`）

        最初の 2 つは、世界と関係なく真偽が決まっています。世界が真偽を与えるのは、3 つ目の「述べられていない文」だけです。

        - **閉世界**（syntax・runtime・std が前提に置く）：述べられていない文は偽です。
        - **開世界**（ontology・exp・subj。前提を述べていないので world だけ）：述べられていない文は、真とも偽とも決まりません。

        ## 制限のノードは「〜と述べられていないもの」

        否定だけの限定（neg）を持つノードは、どれも「R(x, y) が**述べられていない** x」という意味です。「R(x, y) が偽である x」ではありません。違いは、この「述べられていない」から何が言えるかです。それが領域の世界で変わります。

        **閉世界の例：`runtime.halted`（止まった状態）**
        - 定義は「実行していると述べられていない状態」です。
        - runtime は閉世界なので、述べられていなければ偽、つまり「実行していない」と言えます。
        - 名前どおりの意味（止まっている）が、定義から出てきます。

        **開世界の例：`subj.business_day`（営業日）**
        - 定義は「日曜であると述べられていない日」です。
        - subj は開世界なので、曜日が記録されていない日もここに入ります。
        - その日が本当に日曜でないかは、決まりません（真偽なし）。
        - つまりこの定義は「日曜でない日」ではなく、「日曜という記録がない日」を集めています。

        2 の表で言いたかったのは、次のことです。

        - 制限の 44 件のうち、閉世界の領域にあるのは 5 件だけです。
        - 残り 39 件では、「述べられていない」から「偽」が出てきません。
        - そのうち subj の 7 件（営業日・在庫・人など）は、名前からは「偽」の意味に読めます。そして、どれも肯定の対を持ちません。

        ## 前回の言い過ぎの訂正

        前回、閉世界では制限が否定（偽）に「潰れる」と書きました。これは正確ではありません。

        閉世界での「偽」は、次の 2 つを合わせたものです。

        - 述べられていない文
        - 偽と述べてある文

        「述べられていない」はその一部にすぎません。閉世界で言えるのは「述べられていない ⇒ 偽」で、逆は言えません。正しくは「閉世界では、制限は否定に**含まれる**（同じにはならない）」です。

        ## (ii) を正しく述べると

        - いまの限定（mod）で書けるのは、2 つです。
          - 肯定：「R が真と述べてある」
          - 制限：「R が述べられていない」
        - 「R が偽と述べてある」（カントの否定）は、書き方がありません。`o_sys_mod_no_stated_false` = 0 がこれです。
        - 真偽を入れ替える σ をかけると、こうなります。
          - 肯定は「偽と述べてある」に移りますが、その移り先が限定の中にありません。
          - 制限は、σ で変わりません。
        - 限定に `val: {truth: false}` を入れると、肯定・否定・制限の 3 つがそろい、σ で閉じます。
        - そうすれば、営業日を「日曜であることが偽と述べてある日」と書けます。そう書けば、どの世界でも同じ意味になります。
        - ただし、これは文法（syntax の mod）を変える話です。subj の 7 件をどちらの意味で書くかは、あなたが決めることです。

        (iii) の記録は PR #93（d2072ff）に入れました。CI は 1 本成功、もう 1 本は実行中です。
