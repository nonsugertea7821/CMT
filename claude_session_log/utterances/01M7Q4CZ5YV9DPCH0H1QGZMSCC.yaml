      text: |
        二つとも確かめ終わりました。どちらも**反証**です。

        **h_w_from_frames（#152, PR #186、自動でマージ済み）**
        - 個体（1768）と、pre/post を持つ動詞（36）は、フレームの痕跡から導いた分類とすべて一致しました。holds だけの動詞 83 は、第三の分類（関係）として数えています。
        - 食い違ったのは名詞だけです。持続体の下の名詞で「動的な動詞に届かない」のは 0.51 でした。生起体の下の名詞で「届く」のは 0.29 でした。
        - 私の解釈では、定義の辺で届くかどうかは名詞の痕跡としては粗すぎます。exp の語は、ほとんどが判定や実験の動詞とつながっているだけで、動的な動詞に届きます。逆に day・week・process・temporal_part は、pre/post を持つ動詞に一つも結ばれていません。名詞に効くのは「その種類の個体が、走りの中で在るようになるか・無くなるか」のような個体の痕跡かもしれません。ただし、これは確かめておらず、仮説としても登録していません。

        **h_gloss_formula（#141, PR #187、Draft を外してマージ待ち）**
        - 説明文を 6 つの節に分けました。今の文法で式に移せたのは 2 節です。
          - 「何も限定しない」→ 限定のない種類
          - 「時間を通じて同一性を保つ」→ 時間的な部分を持たない
        - 残った 4 節は次のとおりです。
          - 「自分が動く範囲」と「存在する」：式の候補を書けませんでした。なので、反証は事前登録の時点で決まっていました。
          - 「展開する」：法則 named_mod に反しました。この式は `ontology.process` の定義と同じなので、生起体に置くと生起体と process の区別がなくなります。「展開する」は生起体の説明としては広すぎる、と私は読んでいます。
          - 「起こる」：型検査器が `KeyError` で落ちました。規則で退けられたのではなく、検査器の前提（pre/post を持つのは from を持つ動詞）の外で落ちたものです。なので、正しく退けられたとは言えません。

        **二つから言えること**
        両方とも、時間（歩みを動く量化）、存在（exists をどこで述べるか）、変数の範囲を書く形が、今の文法にないところで止まっています。持続体と生起体をシグネチャから導くには、まずこの三つを書ける文法が要りそうです。

        **ほかの PR**
        PR #185（h_case_frame_by_role の取り下げ）は、まだマージ待ちです。
