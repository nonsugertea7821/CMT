        そのとおりです。「観察の正当性は体系の規模に依存する」を仮説 h_observation_by_scale として登録しました（#609、登録だけ）。
        - 式は `v_depend(observation, [syntax.system, magnitude])` で、d_metric（使い方をまたぐ一貫性）の根拠に結んでいます。
        - 確かめ方はまだ決めていません。たとえば同じ測りを規模の違う体系で比べ、判定が変わるかを見る形が考えられます。

        その直前に h_std_by_law と h_std_by_shared_use を測りました（#608）。どちらも反証で、Draft は外してあります。
        - **法則で決める（h_std_by_law）:** 一致度は 0.107 でした。std の法則の式に出てくる std の語は、closed_set・v_close・v_sum の 3 つだけです。式のほとんどは公理の層の語で書かれていて、この定義だと std はほとんど空になります。
        - **領域の共用で決める（h_std_by_shared_use）:** 一致度は 0.246 でした。この定義だと、exp の状態の語（仮説・観察・決定など 24 語）が std に入るべきことになります。exp と lang の二つの領域が共に使っているためです。
        - **規模の弱さ:** この結果は、領域 10・std 28 語という小さな体系の上での観察です。共用の数は exp と lang の関係一つに強く左右されています。今回の示唆がそのまま当てはまる例なので、#608 の本文にも書きました。

