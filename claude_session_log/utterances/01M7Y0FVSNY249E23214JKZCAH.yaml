      text: |
        必要だと思います。その法則を仮説として、帰結とあわせて対で登録しました（#611、登録だけ）。
        - **h_formal_real_by_law**: 軸が形式的か実在的かは、法則で決まる（`v_depend(syntax.axis, syntax.law_rule)`）。
        - **h_real_axis_by_domain**: 実在的な軸は領域に属する。形式的な軸は、どの領域も使える（`v_depend(syntax.axis, syntax.domain)`）。

        **これまでの話とのつながり（解釈）**
        - **形式的な軸**（部分・依存・時間の順序・存在・参照）: どの領域でも同じ意味で使えます。すべての座標の乗り換えで保たれるもの、つまり signature の側（h_signature_all_charts）に来ます。
        - **実在的な軸**（空間・用途・材料・感覚・所有・可能・単位）: 何を区別するかが領域ごとに違います。領域という射影の座標の側（h_domain_as_projection）に来ます。
        - そうすると、いまの体系が「領域とは何か」を決められずにいるのは、実在的な軸がまったくないからだと読めます。
          - std の二つの定義は、どちらも反証されました。
          - 英日の領域は、同じ形式的な式しか書けず、one_name でぶつかりました。

        **トリアージへの効き方**
        - 前に出した (B)「関係を足して体系を大きくする」は、この法則が先にあれば、無秩序な追加になりません。足すのは実在的な軸で、それを領域に属させる、という形になります。
        - そのため順序としては、0 の前にこの二つ（法則と、軸の所属）を置くのがよいと考えます。そのあと実在的な軸をいくつか足して、語彙の実験を同じ標本でやり直せば、データ量の問題にも手が届きます。

