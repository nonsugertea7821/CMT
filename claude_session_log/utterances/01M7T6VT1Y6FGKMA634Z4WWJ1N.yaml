      text: |
        おっしゃるとおりです。リポジトリと記録を読み返して、大きいほうのロードマップを確かめました。

        **最終目標**（利用者の言葉）：「体系の健全性の目標は、display の廃止と式の識別子化」

        display（表示語）をやめて、概念の名前（識別子）を式だけから決められるようにする、ということです。そのためには、二つの壁を越える必要がありました。

        **壁 1：表示語が、式にない意味を担っている**
        - 表示語の約 77% は、式から導けない「残り」でした（sys_display_residual）。
        - 格の枠組みを当てる精度は、式から 0.39、表示語の形から 0.63 でした（h_case_frame_formula、反証）。
        - 語釈を式に移せたのは、6 件中 2 件だけでした（h_gloss_formula、反証）。

        **壁 2：検査器と分類が、名前に頼っている**
        - 識別子を一対一に付け替えると、検査の結果が変わりました（h_renaming_invariant、反証）。検査器が 7 つの名前を文字列で読んでいたためです。
        - 上位・下位の関係が、式ではなく extends の名前の鎖にしか支えられていない組がありました（h_above_sound、反証）。
        - 「名前の鎖にしかない上下関係は、識別子化で失われる負債」というのが、そのときの読みです。

        **識別子化の本体**
        1. h_identifier_by_expansion（#328）：反証でした。識別子をシグネチャの語まで展開すると、式では区別できず名前でしか分かれない組が 5 つ残りました。
        2. h_identifier_by_bisimulation（#331）：反証でした。循環を扱い直すと、衝突は予測どおり 4 つの類（approve/pay、derive/require の相互再帰）まで減りました。ただし、前提に置いていたものが新たに一つ加わりました。
        3. その次に、法則の役割を式で分ける仮説の組（h_rule_roles_by_frame / by_signature）と、概念の分類の仮説（#350・#351）へ進んでいました。

        **幾何の話は、このロードマップのどこに入るか**
        本来は、ここに入る予定でした。名前でしか分かれないもの（衝突する組、名前の鎖にしかない上下関係）に、式の座標を与えて区別するための道具です。
        - h_above_sound のときに、錐の順序で「上位とは、限定が包含されること」と読みました。これが最初の接点です。
        - 今日の結果は、ここに「上位概念は一かたまりの領域で、限定だけでは領域にならない」を足したことになります。

        ただ、ここまでの幾何の実験は、モデルの中のまとまりを測るところで止まっています。まだ識別子化に返していません。次にやるべきなのは、さっき予定した「限定だけで区別している概念を洗い出す」作業ではありません。今日の結果を、識別子化で残っている衝突（approve/pay、derive/require）と、名前の鎖にしか支えのない上下関係に当てて、幾何の座標で区別できるかを問う仮説を立てることです。次の周回で、まずその仮説を登録します。
