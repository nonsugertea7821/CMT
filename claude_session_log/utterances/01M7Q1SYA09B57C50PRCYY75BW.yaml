        できそうですが、一つ確かめが要ります。この repo で今使える type は、既定の Task・Bug・Feature の 3 つだけでした。

        **今の分け方:** 同期（`sync_issues.py`）は、種類をラベルで付けています。
        - 種類は「仮説」（hypothesis）と「決定」（decision）の 2 つです。
        - それに加えて、すべての issue に `claim` が付き、領域（cscl / exp）のラベルと状態のラベルが付きます。

        **type が合うところ:** type は 1 つの issue に 1 つしか付きません。仮説か決定かは互いに排他なので、複数付けられるラベルよりも type のほうが性質に合っています。状態（未検証・支持・取り下げなど）と領域は、ラベルのまま残すのがよさそうです。

        **確かめが要るところ:** 新しい type（仮説・決定）を足す設定は、私の知る限り organization の設定にあります。この repo は個人のアカウントの下なので、足せないかもしれません。ここは確かめていません。足せなければ、既定の 3 つに当てはめるしかなく、意味が合いません。

        **決めてほしいこと:** 「仮説か主張か」の「主張」は、今の「決定」のことですか。それとも、別の区分を作る考えですか。体系の中の区別にも関わるので、ここだけ伺います。

        type を足せると分かれば、同期が type を付けるように直す PR を立てます。
