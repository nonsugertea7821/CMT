        - Registration PR: touches only claims.yaml / exp.yaml and only adds h_ / b_ / v_refer / v_check lines.

        2. Key Technical Concepts

        **Type checker gather**
        - Reading formulas are collected by assignment, so a later v_refer of the same subject overwrites the earlier one.
        - The many-check exempts o and _at.

        **exp_check**
        - It checks a hypothesis formula only structurally (triple: names defined, verb ends fit).
        - It checks status against the presence of evidence/against links.
        - It does not relate the formula content to observations, so support/contradict links are declarations.

        **Measurement families in exp.yaml**
        - Node pattern:
          - `{F}: {is: measurement_family}`
          - `{F}_cond: {is: family_axis, val: {text: cond}}`
          - `{F}_cond_{c}: {is: axis_value, val: {text: c}}`
        - Fact pattern:
          - `v_file_of`, `v_rows_of [rows]`, `v_axis_of`;
          - `v_value_of` plus `v_spell` per column;
          - `v_entry_of '{cond}'`, `v_metric_of mean_value`.
        - Helper script `/tmp/claude-0/-home-user-CMT/e05d2140-ce91-515f-a5fb-e6251e13d406/scratchpad/addfam.py F col1,col2,...` inserts the family after the sys_reading_ends_resolved block. `addfam_before.py` inserts it before.

        **Observations**
        - Written as `o_x: {is: exp.observation}` in claims.yaml, or `{is: observation}` in exp.yaml.
        - Formula: `- {is: v_refer, from: o_x, to: {is: v_level, from: fam.col.mean_value, to: N}}`.
        - Linked with `exp.v_support` / `exp.v_contradict` (unprefixed in exp.yaml).

