      text: |
        そうですね。閉世界も開世界も、言語に組み込む性質ではありません。体系が前提として置く仮定で、領域ごとに選べるものです。

        ## そう考えたときの整理
        - **否定そのものの意味：** 「その文が成り立つと示されていない」の一つだけです。これは、事実の集合とそこから導けることについての記述です。
        - **閉世界の仮定：** 「示されていない文は偽」という法則として、前提に置きます。
          - 置いた領域では、否定が古典の否定（偽）と一致します。
          - 置かない領域は開世界です。示されていないことは「不明」で、偽ではありません。
        - **選び方：** 仮定は領域や範囲ごとに選べます。例えば次のようにできます。
          - 実行の記録では閉世界を置く。実行器が状態を完全に持っているからです。
          - 実験の領域では開世界にする。調べていないことを偽とは言えないからです。
        - **仮説としての扱い：** 閉世界の仮定が妥当かどうかは、主張として扱えます。この体系で言えば、`v_assume` で述べる前提で、「その領域の事実は完全に書かれている」という仮説です。

        ## 今の体系とのずれ
        - 閉世界は、実行器と規則の照合に決め打ちで入っていて、宣言されていません。
        - 構文の `neg: {truth: false}` は、閉世界を前提にしないと成り立たない定義です。前提を書かずに、古典の否定として定義しています。
        - 型検査は、否定の限定を「情報なし」として読み飛ばしています。

        ## 分類への含意
        - 否定は「示されていない」なので、事実の集合について述べることになり、シグネチャの上では refer の側に入ります。
        - 否定された動詞は、語彙として依存に数えます。中身は「その動詞の事実がない」です。
        - 例えば `natural_language` は、次のように分類されます。
          - 語彙としては、`v_design` に依存する。
          - 主張としては、変化ではなく「述べる」の側に入る。
        - 閉世界を置いた領域でだけ、これが「設計されたことはない」（偽）という主張になります。

        ## 進めるなら
        1. 構文の `neg` と `not` の定義を、「示されていない」に直す。
        2. 閉世界の仮定を法則として書き、使う領域が宣言する形にする（事実の `v_assume` など）。
        3. 実行器と規則の照合は、宣言がある範囲でだけ閉世界で判定する。宣言がなければ、否定は「不明」も区別する。
        4. 型検査で読み飛ばしていた否定の限定を、この意味で扱う。
        5. そのうえで、シグネチャからの分類の表を作り直す。

        これも言語の根本に触れる変更です。この整理で合っているか、進めてよいかを確認させてください。まだ何も変更していません。
