        2. Key Technical Concepts

        **Session-log hook**
        - Stop hook with `asyncRewake: true`: async; exit 2 wakes Claude with stderr.
        - Builds in the worktree `.git/session-log-worktree`, guarded by an flock on `.git/session-log.lock`.
        - Retry loop up to 3 times: fetch, reset --hard origin, build, commit, push.

        **build.py behavior**
        - Incremental build: existing ULID files are never rewritten or deleted.
        - `order` continues from the max found by `ORDER = re.compile(r"^(?:    val: \{|      )order: (\d+)", re.M)`.
        - Always redacted:
          - SECRET: private key blocks, sk-, gh[pousr]_, github_pat_, xox, AKIA, AIza, Bearer, token=[秘密の文字列を伏せた]
          - MAIL, CARD, PHONE (JP formats)
          - MODEL (model names)
        - SUSPECT words cause a hold: 住所, 本名, 氏名, 生年月日, 誕生日, 電話番号, 携帯番号, パスワード, 暗証番号, 口座, マイナンバー, 保険証, 免許証, 旅券, パスポート, クレジットカード, 〒, `\d{3}-\d{4}`, password, passwd, address, phone.
        - SUSPECT is matched on text with `[…を伏せた]` markers removed.
        - Held utterances are not written; build exits 2.
        - `decisions.yaml` holds `{ULID: {decision: keep|withhold, reason}}`. Withheld utterances are skipped and are not v_answer targets.

        **Law machinery**
        - `tc.build()` → `T, O, _`.
        - `F = tc.Facts(T.syntax_facts())`; `tc.evaluate(tc.law_rules(O), F, tc.variables(O))` adds derived facts into `F.by[rel]`.
        - Relation directions:
          - `r_ancestor(a, b)`: b is an ancestor of a.
          - `r_parent(a, b)`: b is the parent of a.
          - `r_candidate(x, y)`: x should go under y.
        - Violation of specific under r_has: every `r_acc(y, m)` has `r_has(x, m)`, so "missing" is empty by definition.

        3. Files and Code Sections

        **claude_session_log/build.py (branch claude/session-log, edited in the worktree)**
        - Usage:
          - `build.py <transcript>` or `build.py -` (stdin hook JSON)
          - `build.py --decide ULID keep|withhold reason`
          - `build.py --pending <transcript>`
