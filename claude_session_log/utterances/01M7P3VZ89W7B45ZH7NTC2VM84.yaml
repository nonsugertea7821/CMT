          - Default: Stop, reading stdin JSON.
          - `--decide <ULID> keep|withhold <reason>`
          - `--pending`: finds the transcript via `$HOME/.claude/projects/*/$CLAUDE_CODE_SESSION_ID.jsonl`.
        - The Claude-Session trailer is built from `CLAUDE_CODE_REMOTE_SESSION_ID` (`cse_` replaced with `session_`).
        - On exit 2 from build, it prints the build's stderr and exits 2. All other failures exit 0.

        **.claude/settings.json (claude/cross)**
        ```json
        {"hooks":{"Stop":[{"hooks":[{"type":"command","command":"\"$CLAUDE_PROJECT_DIR\"/.claude/hooks/session_log.sh","timeout":600,"asyncRewake":true}]}]}}
