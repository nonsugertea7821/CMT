      text: |
        その案で進めます。基礎語彙は、出典ごとに領域を分けて置きます。この見方を仮説として登録しました（#591、登録だけの PR です）。

        **領域に分けると何がよいか**
        - 同じ概念を英語の領域と日本語の領域に別々に書くと、両者を比べられます。
          - 置き場所が言語に依らず一致するなら、置き場所は定義から演繹されたものだと言えます。
          - 一致しない語は、言語ごとの切り分けの違いを示します。
        - 一致した概念だけを std に上げれば、std は二つの領域の共通部分として決まります。手で選ばなくて済むので、以前おっしゃった「恣意的であってはならない」に沿います。
        - 体系には、領域ごとに閉世界か開世界かを置く仕組み（world_declared）がすでにあります。出典ごとの前提の違いも、領域の単位で扱えます。

        **登録した仮説**
        - **h_vocab_domain_invariant**: 置き場所（extends）は領域に依らない、という仮説です。
        - 確かめは、両方の領域に書いた語の組で、置き場所が違う組を数えます。0 なら支持です。

        **出典について（一つ変更があります）**
        - (3) に考えていた分類語彙表は、この環境から取れませんでした。国語研のページは時間切れになり、GitHub の写しには接続が許されていません。
        - 代わりに、取れた日本語 WordNet を使います。
          - 英語の WordNet と同じ概念番号（synset）でつながっているので、二つの領域の語を対にするのに向いています。
          - そのかわり、分類語彙表のような日本語独自の階層ではありません。比べる相手として独立性は弱くなります。
        - Basic English 850 は取れました。内訳は、操作語 100（動詞は 18）、一般語 400、絵にできる語 200、性質 150 です。

        **次**
        1. #591 がマージされたら、事前登録に進みます。どの語を何語、どの順で取るかと、判定を固めます。
        2. そのうえで、二つの領域を足します。これは概念を足す変更なので、手で見ていただきます。

