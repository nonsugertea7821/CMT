      text: |
        「日本語をほとんど読んでいないモデルでは、日本語からまとまりが出ない」を確かめた PR #369 は、**支持**になったので Draft を外しました。見てマージしてください。SmolLM2 も OLMo-2 も、英語では #353 の基準を満たし、日本語では満たしませんでした。差はどちらも 0.5 前後下がっています。

        ロードマップについては、ご指摘のとおりです。目的は、式（体系の書き方）の欠陥を、幾何との類比で見つけることでした。正直に言うと、ここ 3 本（#364・#368・#369）はその本筋から少し外れた寄り道で、「LLM が概念をどう学ぶか」という問いのほうを追っていました。式の側には、まだ何も返せていません。

        **段階 1：幾何の事実を確かめる（ほぼ済み）**
        - 上位概念で集めた語は一かたまり（凸に近い）になる。上位概念をまたぐ性質で集めた語は散らばる（#353）。
        - これはモデルにも言語にもよらない。ただし、その言語の文章を読んでいることが要る（#364・#368・#369）。
        - 寄り道の 3 本は、この事実を式の根拠に使ってよいかの裏付けにはなりました。

        **段階 2：何がまとまりを作り、何が崩すかを分ける（途中）**
        - 反証：量で切る（読み出せる量でも、ひと続きの区間でも）だけでは、まとまりはできない（#354・#357・#361）。
        - 残り：もともとの上位概念のかたまりが決めているのか（h_midpoint_depends_genus、#360）。
        - 残り：性質による限定は、上位概念をまたいで共通の「向き」として働くのか（h_qualification_immune_genus、#355）。

        **段階 3：式に写す（未着手）**
        - 段階 1・2 の結果から、「この書き方は、幾何ではまとまりにならないものを、まとまりのように書いている」といった欠陥を特定します。
        - `cscl/design/claims.yaml` には、幾何から来た仮説がまだ一つもありません。ここが本題なのに、手が付いていない状態です。

        **段階 4：座標の読み（未着手）**
        - self・any・same を座標系として読めるか。
        - 異なる上位概念どうしが直交するか（同じでないことの条件を式で書く必要がある）。

        次は寄り道をやめます。段階 2 の残り 2 つ（#360・#355）を片づけたうえで、段階 1 と 2 の結果から読める式の欠陥の候補を、`claims.yaml` に仮説として登録するところから進めます。
