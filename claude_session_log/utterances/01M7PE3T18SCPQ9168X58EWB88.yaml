            - Tarski object language vs metalanguage; subtyping as a judgment rather than a proposition.
            - In FCA, lattice order is not an attribute.
            - FO / Datalog can't define chain length uniformly (Ehrenfeucht–Fraïssé); FO+C or aggregation is needed.
