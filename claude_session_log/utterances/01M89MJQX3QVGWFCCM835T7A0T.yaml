      text: |
        E64 の学習は動いています。CPU とメモリを使っていますが、最初の概念はまだ書き出されていません。

        ## 小さいモデル（Qwen2.5-1.5B）で追加学習をしているか

        **モデルの重みは一切変えていません。** 普通の意味の追加学習（ファインチューニングや LoRA）はしていません。

        **学習しているのは、概念ごとのベクトル 1 本だけです**（E64、E36 と同じ作り方）。
        - **何を学習するか**: モデルの内部表現と同じ長さ（1.5B では 1536 次元）のベクトルを、概念ごとに 1 本。ゼロから始めます。
        - **どこに入れるか**: 8 層目の出力に足します。足すのは、文中にその概念の語（例:「営業日」）が出てくるトークンの位置だけです。PyTorch の forward hook で差し込みます。
        - **どう学習するか**: モデルの重みは凍結したままにします（勾配を計算しない）。誤差を逆伝播させて、ベクトルだけを Adam で更新します（学習率 0.1、30 歩）。
        - **教師**: 学習用の別の設問（train_qa_ja.json）を使います。「答えは〇〇です。その理由として正しいほうを選べ」に、正しい番号を答えさせる誤差です。評価に使う 24 問は使いません。
        - **使うとき**: 評価の設問を流すときに、同じ層・同じ語の位置にそのベクトルを足します。

        技術としては、activation steering（内部表現への足し込み）を、勾配で学習させたものです。soft prompt に近いですが、入力の前に付けるのではなく、途中の層で語の位置に足すところが違います。

        ## ほかの実験
        - **E58・E63**: 学習はしていません。プロンプトを変えただけです。E58 は定義を前に置き、E63 はさらに語を「用語NN」に改名しました。
        - **4B（Qwen3-4B）**: これまで学習はしていません。プロンプトだけです。

        ## 設計との関係
        - 採択済みの決定に「概念ベクトルは、重みが手元にあるモデルに頼る」があります。ここで言う概念ベクトルが、このベクトルです。
        - 仮置きの決定に「教えた変化を貯めておく場所は、教えたベクトル」もあります。今の設計では、モデルの重みは触らずに、概念ごとのベクトルとして知識を持たせる方針です。

        ロードマップの位置:
        - 目的: モデルに言葉の新しい意味を教え、4 つの使い方で一貫して使えるようにする。一貫して使えた割合で測る
        - 設計: E64 は、本設計の部品「概念ベクトル」（重みは変えず、語の位置に足す）で「理由を言う」を上げる。仮置きの「説明は文章に頼る」とは逆向きの手
        - 計画:
          - [済] 一貫して使えた割合を測り、大きいモデルでは「当てはめる」が足を引っぱると分かった（E58・E63） → 成績を上げるには、足を引っぱる使い方を上げればよい
          - [今] 小さいモデルで、概念ベクトルを使って「理由を言う」を上げる（E64、学習中） → 小さいモデルでは「理由を言う」も足を引っぱっているかが分かる
          - [次] 本設計の部品を式で書いて、足りるかを確かめる（#866） → どの部品を変えれば成績が上がるかを、体系から読めるようになる
          - [先] 足を引っぱる使い方を上げる道（検査器か区画）を本設計に組み込み、定義を置くだけのときより成績が上がるかを測る → 本設計で新しい意味を教えられるかが言える
        - 分かれ目: E64 で成績が付いてくれば、説明もベクトルで教える方向に分担を見直す。付いてこなければ、分担はそのままで「当てはめる」を上げる部品に絞る
