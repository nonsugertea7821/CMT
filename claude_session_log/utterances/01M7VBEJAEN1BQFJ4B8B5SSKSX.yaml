      text: |
        h_named_mod_is_spelling（#425）は、事前登録の判定どおり支持になりました。修飾語を名前で書くか中身をその場に書くかは綴りだけの違いで、意味には入っていません。

        **結果**
        - 体系の全体で、名前で使っている修飾語 96 箇所（55 語、6 つの領域）を、その場の中身に書き換えて比べました。
        - named_mod 以外の誤りは、書き換える前も後も 0 でした。
        - 違った文は 50 で、すべて「名前を書いた」という文（`r_written`）でした。意味の文の違いは 0 です。
          - 55 語に対して 50 なのは、5 語がほかの場所でも名前で書かれていて、その文が残ったためです。
        - tc と ec は手元で通り、Draft は外しました。

        **含意**
        - named_mod は定義の法則ではなく、one_spelling（同じ綴りは同じものを指す）と同じ「綴り」の層の法則として置けます。
        - ただし、named_mod を規則で書くには「どのノードが名前で書いたか」の文が要ります（#418 の反証）。これは対のもう片方の h_named_mod_by_writer（#421）の問いで、新しい仮説は足していません。

        **ほかの確かめ**
        - a0（一つの決定から関係を二つ出す）の残りを見たところ、d_metric はもう二つの決定に結ばれていて、済んでいました。

        ロードマップ: a（識別子化）で、named_mod の対の片方（綴りの層）を支持で閉じました。
