      text: |
        反証になった二つの実験の設計を、それぞれまとめます。

        ## 1. 中身の全部で分ける案（h_identifier_by_bisimulation、#331、11 月 19 日）

        **問い**：識別子は、定義の中身の全部で決まるか。名前を伏せて中身だけで概念を分けたとき、ぶつかる（区別できない）のは、事前に予測した組だけか。

        **手順**
        - 型検査器が読み込んだ全概念から、表示語と注を除きます。
        - 中身の中に出てくる他の概念の名前は、その概念がいま属するまとまりの番号に置き換えます。並びは並べ替えて比べます。
        - 初めは全部を一つのまとまりにします。
        - 「自分のまとまり＋中身の形」で分け直すことを、まとまりの数が増えなくなるまで繰り返します。これは、たどり始める場所によらない分け方です。

        **判定（事前に決めたもの）**：ぶつかるまとまりが、予測した 4 組とちょうど一致すれば支持、ずれれば反証。
        - 予測した 4 組：
          - 承認／入金
          - 承認する／入金する
          - 導かれる文／求められる文
          - 導く／求める

        **結果**
        - ぶつかったまとまりは 4 つで、数は予測どおりでした。
        - ただし、予測外の「前提」と「前提に置く」が加わり、それぞれ 3 つ組になりました（全 10 ノード）。予測と一致しないので反証です。

        **そのとき書いた解釈**
        - 法則の「前提・導く文・求める文」の三つは、式の上では区別がない。区別は、名前と、それを読む型検査器の側にある。

        **その後**
        - 法則の役割を式で分ける仕事（h_rule_roles_by_frame、支持）が入りました。
        - いまの体系で同じ分け方をすると、ぶつかるのは承認・入金の二組だけです。

        ## 2. 類と種差だけで分ける案（h_identifier_by_genus_differentia、#954、今日）

        **問い**：識別子は、類と種差だけで決まるか。類と種差とは、上位（extends）・修飾（mod）・成り立つ状態（holds）・始点（from）・終点（to）のことです。

        **手順**
        - 上と同じ分け方を二通り作ります。
          - 全部の鍵で分けたもの（P）
          - 類と種差の鍵だけで分けたもの（G）。名前を付けた修飾の中身（of・with）も G に入れます。これは読みの選択だと事前に開示しました。
        - 二つを比べ、次の二つを数えます。
          - P では別なのに、G では同じになる組
          - その逆の組

        **判定（事前に決めたもの）**：両方とも 0 なら支持。どちらかが 1 以上なら反証。

        **結果**
        - P は 793 のまとまり、G は 712 のまとまりでした。
        - G でだけ同じになる組が 775（107 ノード）あり、反証です。
        - それらの組を分けていた鍵は、主に次のとおりでした。
          - 役割の指し方（form）
          - 動きの前後（pre・post）と、生まれるものの種類（new_kind）
          - 否定（neg）

        ## 二つの違い

        | | 1（中身の全部） | 2（類と種差だけ） |
        |---|---|---|
        | 見る鍵 | 表示語と注を除く全部 | 類と種差の 5 鍵（と of・with） |
        | 何で判定したか | ぶつかる組が予測と一致するか | 全部の鍵と同じ分け方になるか |
        | 外れた理由 | 予測外のぶつかりが出た | 鍵が足りず、区別が大きく潰れた |

        1 は、外れた理由が「予測が外れた」ことにあります。分け方そのものが識別子として使えないと示したわけではありません。2 は、類と種差の鍵だけでは足りない、ということを示しました。
