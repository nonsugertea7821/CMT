      text: |
        「句が付く」というのは、限定の式から、その限定が言っていることの日本語の言い回しを、検査器が自動で作ることです。

        **例: 倉庫**
        体系には、倉庫がこう書いてあります。

        ```yaml
        warehouse: {display: 倉庫, ..., mod: {of: [v_store, to]}}
        ```

        - `display: 倉庫` は、人が手で書いた名前です。
        - `mod` は、倉庫という種類を限定する式です。「v_store（保管する）の to の位置に来るもの」と言っています。

        検査器はこの式を読んで、次のように句を作ります。
        1. **部分か全体か**: v_store の定義（holds の part と位置）から、倉庫は保管されるものを部分に持つ側、つまり全体だと分かる。
        2. **相手**: with がないので、反対の位置の種類を見る。v_store の定義では、それは商品。
        3. **語幹**: v_store の上位の動詞の表示語「部分になる」から「部分」を取る。
        4. つないで「**商品を部分に持つ**」。

        この句を、検査器は限定の文の表示語として事実に書きます（`{is: display, from: その限定, to: 商品を部分に持つ}`）。

        **前との違い**
        - 前は、倉庫の限定が何を言っているかを日本語で表すものは、手で書いた表示語しかありませんでした。それが式と食い違っていないかを、表示語の法則が見張っていました。たとえば、全体なのに「…の部分である」と書いていないか、という検査です。
        - 今は、限定の言い回しを式から作ります。手で書いた「倉庫」は名前として残りますが、限定の向きを表す言い回しは式から来ます。食い違う余地がないので、見張る法則も要らなくなりました。

        **「99 すべてに句が付いた」の意味**
        部分か全体かを決める限定（部分の限定）が体系に 99 あります。そのすべてについて、この手順で句が作れた、ということです。

        **次の仮説（h_mod_phrase_any_verb）**
        今、句を作れるのは部分の動詞の限定だけです。「依存する」「参照する」など、ほかの動詞の限定でも同じように句を作れるかを確かめます。たとえば「ステップの列へ述べる」のような言い回しを、式から出せるかを見ます。
