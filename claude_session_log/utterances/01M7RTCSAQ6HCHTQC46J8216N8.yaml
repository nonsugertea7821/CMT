        **手順**
        文法（syntax.yaml）に、上位（above）について法則を4つ足しました。
        - 直接書いた上位も上位として扱う
        - 上位は祖先である
        - 上位は非対称である
        - 上位は推移的である

        **結果**
        - 今の体系は、法則を足しても誤り・exp の誤り・上位の文の数（2652）が変わりませんでした。上位はもともとこの形で閉じていた、ということです。
        - 祖先でない組（above_order → individual_depth）に上位を書いた写しは、「上位は祖先である」の法則に反する誤りが1つ出ました。祖先の組（above_order → quality）の写しは通りました。法則を足した後は、直接書いた上位も extends に縛られます。

        **訂正（開示済み）**
        足す前と後の事実の比べ（changed）は、記録した数え方では 4 で、規則どおりなら「外れ」でした。違いはどれも、足した法則そのものについての文（法則であること・領域・綴り・属する種類）だけでした。お手本の sys_individual_depth はこの文を比べる対象から除いていましたが、私の手順はそれを落としていました。除き方を手順に書き足して先に commit し、別の名前の結果ファイルで数え直すと 0 になりました。判定はこの数え直しで出しています。

        **決めてほしいこと**
        法則4つを main に入れるかどうかです。入れない場合は、仮説の状態だけを残す形にも直せます。PR で見てください。

