             - Hypothesis states: hyp_supported / refuted / mixed / untested.
           - **Laws:**
             - law_rule entries in ontology.yaml use v_assume / v_derive / v_require over syntax facts (mod, of, position, with, neg, extends, r_ancestor …).
             - law_given entries are implemented in check_spec (LAWS_HERE), each with a v_govern fact.
           - **Reversal limit:** a reversed part-of statement that is independent of the rest of the spec is undetectable, since it is an automorphism-like swap. The fix is anchors or definitions.
           - **Proposed v_sum:** two parts that are symmetric, plus a whole that is the new third term. part(x,y) ⇔ ∃z sum(x,z)=y. Direction then becomes a theorem through antisymmetry.

