        2. Key Technical Concepts:
           - **Model and setup:** Qwen2.5-1.5B-Instruct. Groups G2c (conflicting redefinition) and G2k (control), n=24 each. Binary-choice logit margins, with order-robust accuracy ("both").
           - **E3:** a layer-8 vector added at the word's token positions, trained with defqa. G2c 0.75–0.79, G2k 0.92. The only method that raised both groups.
           - **CSCL spec mechanics:**
             - nodes take `extends` plus a single `mod` (law single).
             - `mod {of: [v_compose, from], with: X}` means the node is part of X; `to` means the node has X as a part.
             - Families are declared with v_file_of / v_rows_of / v_axis_of / v_value_of / v_denote / v_filter_of / v_entry_of / v_metric_of (accuracy, order_robust_accuracy, mean_value).
