           - **Label-prior baseline:** G2c 0.92, G2k 0.08. E3 raises G2k anyway, so it is not a label shortcut.
           - **Interpretation:**
             - Text and the vector take different routes. Text works through attention to the definition, with a generic shift of the word's state. The vector rewrites the word's state.
             - The specific component carries the content. The common component stabilizes the verdict against option order.
             - Both are needed together.
