        5. Problem Solving — key results:
           - **E12:** G2c none 0.38, tok0 0.50, tok 0.46, word+tok 0.50; G2k 0.75 / 0.75 / 0.71 / 0.75.
           - **E13:** G2c none 0.39, near 0.61, symbolic 0.43, symbolic_mod 0.52; G2k 0.74 / 0.74 / 0.74 (both 0.13) / 0.78.
