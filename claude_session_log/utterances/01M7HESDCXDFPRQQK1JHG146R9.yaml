        8. Current Work:
           - Last assistant message: I proposed defining whole and part via concept expressions.
             ```yaml
             v_sum: {display: 合わせる, extends: occurrent, from: continuant, to: continuant, new_kind: continuant,
                     holds: [{is: part, from: from, to: new}, {is: part, from: to, to: new},
                             {is: depend, from: new, to: from}, {is: depend, from: new, to: to}]}
             # 部分 ≡ 何かと合わせると全体になるもの: part(x, y) ⇔ ∃z. sum(x, z) = y
             - {is: v_sum, from: hidden_state, to: state_shift, new: shifted_hidden_state}   # h' = h ⊕ v
             ```
           - Argument: the two parts are symmetric, so swapping them is harmless. The whole occupies a distinct generated slot, so a reversal cannot be written. A reversed statement elsewhere contradicts antisymmetry, so direction becomes a theorem.
           - Noted: the shift is part of h′, not of the original h, so the earlier draft was imprecise.
           - Existing mods "X の部分である" stay as shorthand for ∃z sum(this,z)=X, and the 404 existing facts remain valid.
           - Residual risk: swapping a part with the whole inside v_sum, which an anchor on generation order (h does not depend on h′) would catch.
           - Proposed steps:
             1. Add v_sum and the part ≡ sum law to the ontology.yaml core.
             2. Rewrite h′ = h ⊕ v and v = m ⊕ s in exp.yaml using v_sum.
             3. Inject a reversal and confirm it is caught as a contradiction.
           - I asked: "core に手を入れるので、進めてよいか確認させてください。"

        9. Optional Next Step:
