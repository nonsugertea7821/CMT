      text: |
        h_case_frame_by_role に取りかかる前に、一つ設計のずれが見つかりました。方向に関わるので、ここで伺います。

        **ずれ:** 仮説の中身は「依存する(動詞の格の枠, 役割)」で、この「役割」は存在論の層の `role` です。
        - 体系での `role` は、定義に依存する実現可能体（BFO の役割）です。例は「法人格」「権限」「動かす条件である」などで、世界の側のものが担う役割を指します。
        - 一方、仮説を立てたときの commit に書いた中身は「相手の端が果たす役割（場所・相手・話題・基準など）」でした。これは言語学の意味役割（着点・共同者・基準・話題・手段・対象）で、文の中で名詞が動詞に対して持つ関係です。世界の側のものではありません。

        つまり、仮説の式が指す「役割」と、確かめたいものが違っています。

        **確かめるのに要るもの:**
        - 57 の動詞の終点に、意味役割を式で付ける。体系には `{extends: role, of: [v_vary, to]}` のように、動詞の端に役割を結ぶ書き方がすでにあるので、形はそれに倣えます。
        - 意味役割の種類（着点・共同者・基準など）を、名前ではなく式で区別する。ここが一番重い作業です。
        - 役割から助詞への写し（着点 → に、共同者 → と、基準 → の、話題 → について、手段 → で、対象 → を）は、役割を付ける前に事前登録する。

        **弱さ:** 役割を付けるのは私で、私はすでに正解の助詞の表を見ています。役割を付けるときに正解の助詞に引きずられるおそれがあり、支持が出ても弱い確かめになります。

        **決めてほしいこと:**
        1. **意味役割を、文法（syntax）の層の新しい概念として置く:** 存在論の役割とは別のものとして扱います。仮説の中身も、その概念を指すように直します。私はこちらを勧めます。
        2. **存在論の `role` の下に置く:** 意味役割を BFO の役割の一種と見なします。体系の存在論の読み方が変わります。

        どちらにするかで、足す概念の置き場と、仮説の直し方が変わります。
