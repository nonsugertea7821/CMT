      text: |
        わき道にそれる理由は、ロードマップがどこにも書かれていないことだと思います。会話と記録のブランチにしかないので、要約をまたぐと薄れ、目の前の実験に引っ張られます。今回の幾何の実験（英語、事前学習、区間）も、一つずつは筋が通っていましたが、識別子化に戻る線は途中で消えていました。

        ## 案: ロードマップを体系の中に書く
        体系には、ゴールの `d_goal`（再定義の成功を上げる）、それを測る `d_metric`（使い方をまたぐ一貫性）、仮説と決定を結ぶ `v_ground` がもうあります。足りないのは途中の目標です。目標どうしの依存は次のとおりです。

        ```
        d_goal（再定義の成功）
         └ d_metric（使い方をまたぐ一貫性）
            └ 体系の健全性        ← いま教えてもらったつながり
               ├ display の廃止（式にない意味を式に移す）
               └ 式の識別子化（名前を読まずに区別する）
                  └ 幾何で座標を与える（衝突の 4 組と、名前だけで決まる上下関係を分ける）
        ```

        これを使って、次のように回します。

        1. **途中の目標を決定として置く。** どの目標が何のためにあるかが、式でたどれるようになります。
        2. **仮説は、どれかの目標の根拠として結ぶ。** 結べない仮説は、立てる時点で「わき道」と分かります。
        3. **ec か測定で、ゴールに届かない仮説を一覧にする。** たどり着けないものが機械的に見えます。
        4. **30 分ごとの見直しでは、届く仮説から選ぶ。** わき道を選ぶときは、そうと書いて選びます。

        試しに今の仮説に当ててみると、この前の幾何の実験は「上位概念ではまとまる」ことまでは示しました。ただ、識別子化の目標にはまだ結べていません。本来の次の一手は、幾何の座標で衝突の組（approve と pay、derive と require）を分けられるかを測ることでした。

        ## したこと
        - 案そのものを未検証の仮説 `h_roadmap_by_ground` として登録し、PR #371 を立てました。中身は「どの仮説もゴールに届くように書ける」です。登録だけなので、自動でマージされます。
        - 途中の目標を決定として置くことと、ec での検査は、まだ作っていません。マージ後に、事前登録から別の PR で進めます。

        一つだけ方向を決めてください。30 分ごとの見直しのプロンプトを、古い順番の一覧から「ゴールに届く仮説から選ぶ」に書き換えてよいですか。
