      text: |
        基本要素ではありません。また同じ誤りをしました。「原始概念は持続体と生起体だけ」と直したばかりなのに、その修飾である特定依存・汎用依存を表の行に使っていました。

        基本要素だけで組み直すと、表は 2×2 になります。

        ## 要素のマトリクス（組み直し）

        | 結ぶ側 ＼ 結ばれる側 | 持続体 | 生起体 |
        |---|---|---|
        | **持続体** | 持続体どうし | 持続体が生起体に関わる |
        | **生起体** | 上の逆向き | 生起体どうし |

        各マスに入る原子関係は、次のようになると考えます。

        | マス | 原子関係 | 意味 |
        |---|---|---|
        | 持続体 → 持続体 | depends_on | 一方が、他方なしには存在しない |
        | 持続体 → 生起体 | participates_in | 持続体が、生起体に関与する |
        | 生起体 → 生起体 | precedes | 一方が、他方より前に起こる |
        | 同じ種類どうし（対角） | part_of | 一方が、他方の部分である |

        ## 前回の 7個のうち、原子でなくなるもの

        - **inheres_in（宿る）**: depends_on を「特定の相手に依存する」と修飾したものです。特定依存持続体は「この関係で結ばれる持続体」として導かれます。関係の側の修飾が先で、実体の分類はその結果です。
        - **汎用依存**: 同じく depends_on を「相手を替えてもよい」と修飾したものです。
        - **realized_in（実現される）**: participates_in を「依存する持続体が関与する」と修飾したものです。
        - **has_value（値を取る）**: 関係ではありませんでした。値は分類のツリーの要素で、実体と値を結ぶのは修飾の操作そのものです。表に「値」の列を足したのが誤りでした。
        - **is_about（について述べる）**: 「述べる」は動詞なので、生起体として書くべきです。「情報と対象が、述べるという生起体に関与する」と定義できます。

        これで原子関係は 4個になります。

        ## 自信がない箇所

        - **part_of を原子に残してよいか。** 表の対角（同じ種類どうし）に置きましたが、これも「構成する」という生起体への関与として書けるかもしれません。その場合、原子は 3個（各マスに1個ずつ）になり、表として最もきれいな形です。
        - **関わり方の区別をどこで持つか。** 「届ける」に関与する持続体には、届ける側と届けられる側があります。この区別を役割（持続体の一種）で書くと、役割は担い手に依存するので depends_on を使うことになり、定義は循環せずに済みます。ただし、関与そのものに向き（する側／される側）を持たせる方が素直かもしれません。

        part_of を原子に残すかどうか、どう考えますか。
