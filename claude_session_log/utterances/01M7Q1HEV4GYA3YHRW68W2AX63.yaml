        1. **取り下げる（勧める）**
           - h_annotation_gold を `hyp_withdrawn` にし、取り出した結果は消す前の版の記録としてマージします。
           - 理由: 前提が崩れたのであって、測って外れたのではありません。これは、#182 で作った「取り下げ」の状態がちょうど受け持つ場合です。issue は not planned で閉じます。
        2. **反証として判定する**
           - 観察（対 7 つ、書き手は Claude だけ、そのうち 3 対は式とずれる）を置き、`v_contradict` で結びます。
           - 弱み: 判定の基準を事前に登録していません。そのため、結果を見た後に立てた判定（`lim_post_hoc`）の限定が付きます。自動マージにも乗らないので、手で見ることになります。
        3. **記録だけマージし、仮説は未検証のまま残す**
           - 注釈を、Claude 以外の書き手の材料で後から確かめる道を残せます。
           - ただ、体系のコメントはもう #177 で消えています。この仮説が指す「注釈」を、新しく得る道は今ありません。
        4. **マージせずに閉じる**
           - 消したコメント 295 行の原文は、#177 の結果（`sys_comment_ban.json` の texts）にすでに残っています。取り出しの材料が失われることはありません。
           - その代わり、7 対を並べた表と「読み」は、PR の本文にしか残りません。

        1 を選んでもらえれば、その形に直して Draft を外します。マージは、そのあと利用者にお願いします。
