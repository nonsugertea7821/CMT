        今回、仮説は何も登録していません。

        フックが指した文は、E64 の結果が期待どおりでなかったときの次の手順です。この手順は、事前登録した e64 のスクリプトの「開示」にもう書いてあります。確かめていない主張ではなく、これを理由に何かを見送ってもいないので、登録は要らないと判断しました。

        ロードマップの位置:
        - 目的: 言い直した概念を、モデルが 4 つの使い方（当てはめる・言い換える・理由を言う・定義を言う）のどれでも正しく使えた割合（一貫して使えた割合）を、この設計で上げる。
