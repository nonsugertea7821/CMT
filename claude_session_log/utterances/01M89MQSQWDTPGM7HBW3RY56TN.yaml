          - [済] 1.5B で、理由を言う使い方が上がったら、一貫して使えた割合も上がった（E63） → 1.5B で足を引っぱっているのは理由を言う使い方だ、という見立てが立った。
          - [今] ベクトルで理由を言う使い方を直接上げて、一貫して使えた割合が付いてくるかを見る（E64） → その見立てが当たっているかが決まる。
          - [次] 設計の部品を決める（#866） → どの部品を直せば目的に効くかが分かる。
          - [先] 言い直した概念で、手を入れる前と後の一貫して使えた割合を比べる → この設計が目的を上げるかを言える。
        - 分かれ目: E64 で一貫して使えた割合が付いてくれば、理由を言う使い方を上げる手を設計に組み込みます。付いてこなければ、ベクトルがほかの使い方を下げていないかを、概念ごとに見ます。
