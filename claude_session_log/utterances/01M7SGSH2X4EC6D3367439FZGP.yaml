        **直した形**
        - `refer_placement` は消しました。
        - 仮説は「型検査器は、文に述べられる文と、その領域に依存する」としました。式は `to: [referred_sentence, syntax.domain]` です。
        - 読みは「同じ領域の中では、文を述べる文を書けない。述べたいときは、別の領域を立てて上書きする」です。層（規則から導かれる分類）は、この仮説には入りません。
        - tc・ec は手元で 0 です。

        **気づいたこと**
        - 既存の h_layers_* の仮説群は、「`layer_placement`（式では領域）が signature_class（導かれる層）に依存する」と述べています。
        - 今回の区別で読み直すと、これらの仮説には「領域は層に従って決まる」という前提が入っていることになります。領域を上書きの単位と見るなら、この前提は成り立たなくてよいはずです。
        - この点は PR に事実として書くだけにしました。どう扱うかは、まだ決めていません。
