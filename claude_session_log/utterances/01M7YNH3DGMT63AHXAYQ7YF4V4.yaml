      text: |
        学習で動かしているのは、モデルの重みではありません。概念ごとに1本ずつ持たせた「足し込み用のベクトル」です。モデル本体（Qwen2.5-1.5B-Instruct）の重みは固定したままです。

        **1. 何を足すか**
        - 兄弟の2語（例: 丙票と丁票）に、1本ずつベクトルを持たせます。長さはモデルの内部の幅と同じ 1536 で、初期値はゼロです。
        - 入力の中でその語（丙票）を表すトークンの位置にだけ、第8層の出力にそのベクトルを足します。ほかの位置には何も足しません。
        - 2語が同じ文に出るので、2本は組ごとに一緒に学習します。

        **2. 何に合わせるか（損失）**

        教える行は2種類で、どちらも続きの部分のトークンの交差エントロピーを下げるように、ベクトルだけを勾配で動かします（Adam、学習率 0.1）。
        - **暗唱の行**: 「「丙票」とは何ですか。当プロジェクトでの定義を答えてください。」のような3通りの問いに、定義文「丙票：票のうち、社内だけで回覧するもの。」を続けさせます。1組で 3通り×2語＝6行です。
        - **設問の行**: 次のような問いに、正答の番号1文字（「1」か「2」）を続けさせます。選択肢の順を入れ替えた2通りを両方使うので、1組で 4問×2通り＝8行です。

          > 次の文の空欄に入る語として正しいほうを選び、番号だけで答えてください。
          > 部署の中だけで回して読む票は、＿＿である。
          > 1. 丙票
          > 2. 丁票

        **3. 条件ごとの違い**

        どの条件も、更新の回数は24段にそろえています。
        - **none**: 学習しません。ベクトルはゼロのままです。
        - **both**: 毎段、暗唱の6行と設問の8行を全部まとめて1回更新します。
        - **round**: 4回往復します。1回の往復は、抽象の3段と具体の3段です。
          - 抽象の段: その時点で教える設問を解かせ、外した問いの正答の側の語の暗唱の行で更新します。
          - 具体の段: 外した設問の行だけで更新します。外れがなければ、全部の行を使います。

        **4. 評価**
        - 評価の4問を、学習した2本のベクトルを入れて解かせます。定義文は文脈に置きません。
        - 最後のトークンで「1」と「2」の logit の差を取り、正答側が上なら正とします。これが余裕（margin）です。
        - 選択肢の順の2通りで両方とも正なら、acc_both に数えます。

        **この形から言える弱いところ**
        - 評価の問いでは、概念の語は選択肢の中にしか出てきません（本文は「＿＿」です）。
        - そのため、ベクトルは選択肢の位置に足されるだけです。本文の「社内だけ」「取引先にも」と照らし合わせるには、第8層より後の層が、その足し込みを読んで本文と結び付けなければなりません。
        - 足し込みが答えを動かす経路は二つ考えられます。
          - 本文と照らし合わせて、意味の違いを入れる。
          - 本文に関係なく、どちらかの語や番号へ答えを寄せる。
        - 後のほうが楽に損失を下げられます。それが、さっきの「語の好みを打ち消すだけ」「余裕がほぼ 0 に縮む」という形として出ている可能性があります。ただし、まだ確かめていない読みです。

