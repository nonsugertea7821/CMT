      text: |
        この考えを、仮説 `h_dimension_from_expression_parts` として PR #655 に登録しました。中身は「弁別に要る次元の数は、体系の概念式の部分によって決まる」です。成り立つかどうかを左右しそうな点を三つ挙げます。

        **1. 上限の見積もりは二通りあります**
        - **厳密に分ける場合**
          - 式の部分ごとに一本ずつ、互いに直交する向きを割り当てるなら、要る次元は部分の数と同じくらいになります。
          - 数百の部分から成る体系なら、数百次元です。
        - **少しの誤差を許す場合**
          - ほぼ直交でよいなら、N 個の向きを置くのに要る次元は、log N に比例する程度で済みます（Johnson–Lindenstrauss の補題）。
          - この場合、体系が大きくなっても、要る次元はゆっくりしか増えません。
        - どちらに近いかで、結論が大きく変わります。後者なら、小さいモデルでも大きな体系を扱えることになります。
        - 許す誤差の大きさは、求める弁別の正確さと結びつきます。

        **2. モデルの次元は、体系のためだけに空いているわけではありません**
        - モデルは、自然言語の概念をすでにたくさん持っています。
        - 体系の概念は、残っている余地に入るか、すでにある概念と干渉することになります。
        - E33 で見えた語の好み（丙票と丁票のどちらかへの元からの偏り）は、この干渉の一つの姿だと読めます。
        - ですから、効くのはモデルの次元そのものではなく、「事前の概念と干渉せずに使える次元」です。
          - これは、登録済みの `h_convex_prior_resists_redefinition`（凸の事前の領域は、再定義に抗う）とつながります。

        **3. 一つのモデルの中で確かめられます**
        大きさの違うモデルを並べなくても、次の手順で確かめられます。
        1. 隠れ状態を k 次元に落とします（主成分の方向か、ランダムな方向へ射影します）。
        2. 落とした状態のまま弁別が保たれる、最小の k を求めます。
        3. 体系から概念を 4・8・16・32… 個と取り出して、最小の k がどう伸びるかを見ます。部分の数に比例するのか、対数で伸びるのかを確かめます。

        この関係が分かれば、ご指摘のとおり「体系の規模から、使うべきモデルの規模を決める」ための物差しになります。

        本線 b 領域の道（d_road_region、PR #655）
