      text: |
        同質だと思います。前に出した二つの選択肢は、どちらも意味役割を名前のある種類として足すもので、方向が逆でした。

        **記録との照らし合わせ:** 「grossは消えるはず」という言い方は、記録のブランチでは見つかりませんでした。近い発言は次の三つです。
        - 01M7CWAEZ0B9N0GWEZKJK1DERG:「あー、glossがオカレントとコンティニュアント以外になっているのは誤りだね　汎用持続、とかはコンティニュアントを修飾しているから。」
        - 01M7MHKEG54Y253BCB1RTV7KZ6:「「シグネチャから論理演算的に定められる分類」を探すべきという話」
        - 01M7PP4MREBR6AZ9T8FT6TQMH4:「最終的にdisplayは帰納的に消滅すると予想しているのでそれも仮説にしたほうがいいかも？」

        **ここからの私の読み:** 着点・共同者・基準といった意味役割を、名前のある上位として足すのは、オカレントとコンティニュアント以外に上位を作る誤りと同じです。格の枠も、最上位の置き場と同じく、シグネチャから論理演算で定まる分類から出るはずのものです。

        **PR #185 にしたこと:**
        - h_case_frame_by_role を「取り下げ」にしました。式が指す「役割」が、存在論の role（法人格や権限など）でした。
        - 代わりに、h_case_frame_by_signature（中身は「依存する(動詞の格の枠, シグネチャから定まる分類)」）を、未検証として登録しました。
        - 状態を変える変更なので、自動マージには乗りません。マージは利用者にお願いします。

        **見込み:**
        - 前の二つの反証（h_case_frame_formula は 0.386、h_case_frame_by_relation は 0.491）が示しているのは、今のシグネチャがまだ粗いことです。端が持続体のままの動詞が多く、動詞どうしの違いの多くは、まだ表示語にしかありません。
        - なので、この仮説を確かめる前に、動詞の意味を表示語から式へ移す作業が要ります。これは、表示語が帰納的に消えていく流れと同じ作業です。
        - README の訳の破れ（「を依存する」など）も、その作業が進めば一緒に直るはずです。それまでは、今の形のまま出ています。
