          - 「前回のフレームにおける存在論は『閉じている』」
          - 「各フレームで宣言された者が次のフレームで消えることはあってはならない」
        - **私が足したこと:**
          - 仮説の中身の後半「各時点では、宣言＝存在で閉じている」
