      text: |
        Qwen 以外の 2 つのモデルで試しました。仮説 h_midpoint_depends_model（結果がモデルに依存する）は**反証**です。PR #364 の Draft を外したので、見てマージしてください。

        **何を比べたか**
        #353 で支持された結果をもう一度測りました。「動物」「果物」のような上位概念で集めた語はまとまり、「赤いもの」のように上位概念をまたいで性質で集めた語はまとまらない、という結果です。語の表と手順は同じにし、モデルだけを替えました。「まとまり」は、集めた語のうち 2 語の真ん中にいちばん近い語が、同じ集まりの語になる割合です。

        | モデル | 上位概念で集めた語 | 性質で集めた語 | 差 |
        |---|---|---|---|
        | llm-jp-3-1.8b（Qwen 以外） | 0.90 | 0.32 | 0.58 |
        | sarashina2.2-1b（Qwen 以外） | 0.91 | 0.27 | 0.64 |
        | Qwen2.5-1.5B（比べるために記録） | 0.78 | 0.19 | 0.59 |
        | Qwen2.5-0.5B（比べるために記録） | 0.64 | 0.14 | 0.50 |

        Qwen2.5-1.5B では #353 とまったく同じ値が出たので、手順はそのまま再現できています。

        **読み**
        - 上位概念ではまとまり、性質ではまとまらないという形は、Qwen だけの癖ではありませんでした。Qwen 以外の 2 つでも同じように、はっきり出ています。
        - モデルで違ったのは、まとまりの強さです。上位概念で集めた語のまとまりは、Qwen 以外の 2 つのほうがむしろ強く出ました。事前学習で得た特徴量は、まとまりの「形」ではなく「強さ」のほうに効いている、と読めます。
        - ただ、4 つとも日本語を学んだ同じ作りの言語モデルで、語の表も 1 つだけです。どのモデルでも成り立つ性質とまでは言えません。

        **変えた点**
        - Qwen3-4B は手元のメモリに載らないので外しました。外したことは結果を見る前の事前登録に書いてあります。
        - sarashina の語の区切りを読むために、sentencepiece と protobuf を入れました。
