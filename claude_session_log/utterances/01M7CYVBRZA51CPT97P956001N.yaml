      text: |
        動詞の語根 21個のうち 20個を、表示語に頼らず式だけで区別できました。書き方は、生起体を「持続体どうしの状態の関係が変わること」として表すものです。

        ## 書き方

        基礎に置いたのは、持続体どうしの状態の関係 6個です。

        | 状態の関係 | 論理的な法則 |
        |---|---|
        | 在る | — |
        | 依存する | 始点があれば終点もある |
        | 部分である | 推移的、反対称的 |
        | について述べる | なし |
        | 後ろにある | 推移的、非対称的 |
        | 生起体に持続体が関わる | 始点があれば終点もある |

        静的な語根は、成り立っている状態の関係で書きます。動的な語根は、起こる前と後の状態の関係の差で書きます。

        ```
        設計する:   前 = 終点が在らない                  後 = 終点が在る
        学習する:   前 = 第三のものが在らない             後 = 第三のものが在り、始点に依存し、終点について述べる
        教える:     前 = 第三のものが在らない             後 = 第三のものが在り、終点に依存し、始点について述べる
        固定する:   前 = 終点に依存する第三のものが在る     後 = それが在らない
        届ける:     前 = 終点は第三のものの部分でない       後 = 部分である
        置き換える: 前 = 終点が第三のものの部分             後 = 始点が、代わりに部分である
        ```

        ## 結果

        | 区別に使った情報 | 区別できた式（語根 21個中） |
        |---|---|
        | 状態の関係だけ | 16 |
        | ＋両端の種類 | 17 |
        | ＋終点・第三のものの種類 | 20 |

        区別できなかったのは「見る」と「読む」の1組です。

        ## 分かったこと

        - **動詞の語根は、持続体の側から書けます。** 「持続体の形を変えると生起体になる」を、文字どおりに取った形です。持続体どうしの状態が変わること、が生起体です。
        - **「結果や産物」と「端が3つ以上ある関係」は、同じ1つの事情でした。** 動的な語根 11個のすべてが、始点でも終点でもない第三のものを必要としました。届け先、判定の結果、学習で得たもの、はどれも「前と後の差の中に現れるもの」です。前回の試し書きで別々の問題として挙げた2つが、ここで1つにまとまりました。
        - **「学習する」と「教える」は、鏡像です。** 第三のものがどちらに依存し、どちらについて述べるかが入れ替わるだけです。式から関係が見えるようになりました。
        - **意味の底は、語根 21個から、状態の関係 6個に減りました。**

        ## 残った問題

        - **「について述べる」には法則がありません。** 6個のうち、これだけが表示語で立っています。使用回数は 9回と多く、情報に関わる語根（学習する、判定する、答える、一致する）のすべてがこれに依存しています。
        - **様態の違いは表せません。** 「見る」と「読む」は区別できず、「設計する」と「計算する」は、終点が持続体か何でもよいか、という弱い違いだけで分かれています。どのように行うかの違いは、前と後の状態の差には現れません。
        - **割り当ては私の手作業です。** 語根をどの状態の関係で書くかは、1通りには決まりません。また、試したのはこの計画の語彙に出てくる 21個だけです。

        ## 全体の見取り図

        ここまでの試験を合わせると、候補の姿は次のようになります。

        1. 最上位は持続体と生起体。
        2. 持続体どうしを、少数の状態の関係が結ぶ。関係は法則で区別する。
        3. 生起体は、その状態の関係の成立と変化として書く。
        4. 修飾は、関係のある位置を占めるものへ限定すること。修飾語は、質や実現可能体として持続体の枝に入る。
        5. 否定と数量化は、述語論理の結合子として使う。

        ## 次の手

        「について述べる」が残った最大の穴です。これを、在る・依存する・部分である・後ろにある、で書けるかを調べます。書ければ、底は法則を持つ関係だけになります。書けなければ、情報が何かを指すことは、この体系で原始的だということになります。

        実験の状況は、E8 が 24概念中19概念まで進みました。終わり次第、結果を記録します。

        記録は `spec/trial/verb_roots.yaml` に置きました。
