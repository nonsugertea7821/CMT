      text: |
        整理は、ひとまず区切ってよいと思います。残っている細かい点は2つです。

        - E16 の共通成分 m（概念ベクトルの集まりの平均）を、2階の集まりの性質として書き直すこと
        - 合成について閉じた集合を、層ごとに分けるかどうか

        どちらも急ぎではありません。

        ## 本題

        本題は「**E3 の概念ベクトルは、なぜ効くのか**」でした。整理に入ったきっかけは、E15 と E16 の結果を記録していて、概念式の向きが逆になっている箇所を見つけたことです。

        ここまでで分かっていることです。

        - **テキストとベクトルは別の経路で効いています。** 定義文を前に置いたときの状態のずれ（Δnear）と、E3 のベクトルの cos は、ほぼ0でした（E15）。
        - **ベクトルは概念ごとの中身を運んでいます。** ほかの語のベクトルに入れ替えると、両群で正答率が下がりました。対照群（G2k）は 0.92 → 0.62 で、何もしないとき（0.75）より下になりました（E15）。
        - **概念ベクトルは、共通成分と固有成分の和として二つの役を分けています（v = m ⊕ s、E16）。**
          - 固有成分 s は、中身を運びます（G2c 0.75）。
          - 共通成分 m は、選択肢の順序に対して判定を安定させます。対照群で both が 0.71、固有成分だけだと 0.33 でした。
          - 両方そろったとき（full）に、どちらの群でも最もよくなります。

        このとき「直前まで来ている」と言っていたのは、次の仮説群です（どれも未検証）。

        1. **固有成分は、語の意味の候補どうしの差と一致する**（h_specific_agrees_with_sense_difference）
           - s が、元の意味から新しい意味への向きなのかを確かめます。
           - 一致すれば、ベクトルを学習せずに、意味の差から直接作れる道が開けます。
        2. **固有成分は、概念式から合成できる**（h_specific_composes_from_expression）
           - 1が成り立てば、概念式の部品から s を組み立てられるかを試せます。CSCL と、モデルの中のベクトルが直接つながる所です。
        3. **共通成分は、学習していない語にも効く**（h_common_component_transfers_to_unseen）
           - m が「定義に従え」という汎用の信号なら、新しい語にも使い回せるはずです。

        ## 次の一手の提案

        **1から始めることを勧めます。** 2も3も、1の結果で意味が変わるからです。

        必要なものは、24語それぞれについて、新しい意味で使った自然な文と、元の意味で使った文です。これを作れば、差のベクトルを取り出して、s との cos を測れます。学習は要らず、E15 と同じくらいの重さで回せます。

        文の草案は私が作れます。作ってよいか、決めてください。
