      text: |
        私の判断では、コメント禁止を先にするのがよいです。ただし、コメントを消す前に一手間かけます。この判断の前提は、仮説 h_annotation_gold として PR #174 で登録しました。

        **理由1: 変換器を先に作っても、コメントの情報は救えない**
        - 変換器は「式から日本語」に訳すものです。コメントは初めから日本語なので、変換器の入力になりません。
        - 変換器があっても、コメントにしか書いていない中身は、訳されずにそのまま残ります。
        - また、消したコメントは git の履歴に残ります。失うのは「定義のすぐ隣で読めること」だけです。

        **理由2: コメント禁止のほうが分化を進める**
        - 式にできないコメントが出てくるたびに、体系に足りない概念が一つ見つかります。
          - 例: 「事前登録か事後か」の区別。
          - 例: 「誰の発想から立てた仮説か」という出どころ。
        - 今日の格の枠の三つの実験も、同じ方向を指していました。
          - 変換器を良くするには、refer・depend・involve を端の役割で分けるなど、式の側を分化させる必要がある。
        - 変換器を先に作ると、足りない区別を表示語やその場の規則で補ってしまいます。分化の圧が弱まります。

        **理由3: 変換器を先にすると、表示語に寄りかかる**
        - 今日の結果では、格の枠は式からは出ず、表示語の中にありました（式から 0.39、表示語から 0.63）。
        - 今変換器を作ると、表示語に頼った変換器になります。これは h_identifier_by_expansion の方向（表示語を消していく）と逆です。

        **ただし、消す前に一手間かける**
        - 仮説の中身を言い換えたコメントは、（式, 人の書いた日本語）の対になっています。
          - 例: 「中身は『定義の循環は、否定の限定を通らない』」
        - これは、変換器の正解として使える、ほぼ唯一の手持ちのデータです。
        - 消す前に、実験のデータファイルとして取り出しておきます。そうすれば、コメント禁止を先にしても、変換器の材料は失われません。

        **進める順番**
        1. コメントから（式, 日本語）の対を取り出し、データファイルにする。
        2. h_comment_ban として、コメントを分けて移す・消す（前の返事の 1〜5 の分け方）。式にできなかったものは、足りない概念として記録する。
        3. 増えた式と、取り出した対を使って、変換器と読み戻し（h_ja_roundtrip）に進む。

        方向が違えば言ってください。そうでなければ、1 から PR で進めます。
