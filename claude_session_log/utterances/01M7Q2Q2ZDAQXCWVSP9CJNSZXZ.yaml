      text: |
        はい、崩れます。指摘のとおりで、私の書き方は、名前が固定だという前提に乗っていました。

        **崩れる箇所:**
        - 手で書く部分に `d_goal` のような識別子を書くと、識別子が式から導かれる形になった瞬間に、その名前は指す先を失います。体系では、仮説 h_identifier_by_expansion（中身は「依存する(識別子, シグネチャから定まる分類)」）がその方向を指していて、まだ未検証です。
        - 3 行の例の「元の意味との衝突」も、表示語を手で写した形なので、表示語が消えれば同じように崩れます。
        - 私が挙げた「識別子が体系にあるかを CI で確かめる」検査は、そのときに一斉に落ちるだけです。ずれを知らせはしますが、ずれない作りにはなっていません。

        **直した考え方:** README は、体系の中の名前を一つも手で書かない形にします。
        1. **手で書く部分:** 体系の中身を指さず、仕組みだけを書きます。「主張は型付きの式で書く」「自然言語の文は式から訳す」「仮説は事前登録し、状態は照合で決まり、issue に写る」のようなことです。これらは、識別子や表示語がどうなっても変わりません。
        2. **生成する部分:** 名前ではなく、問い合わせで選びます。たとえば「採用の状態にある決定すべて」や、「支持された仮説のうち、事前登録が結果より前にあるもの一つ」です。文も、そのときの変換器で式から訳します。名前の出し方が変われば、README も同じ変換器を通って一緒に変わります。
        3. **CI の検査:** 「生成した部分が、今の体系から生成し直したものと同じか」だけを見ます。名前を固定で持たないので、閉包の後も検査そのものは成り立ちます。

        **同じ問題がほかにもあります:** issue の同期も、識別子を鍵にしています（本文の印 `<!-- cscl-claim: h_x -->`）。識別子が式から導かれるようになれば、式が変わるたびに識別子が変わり、issue との対応が切れます。README より先に、こちらが崩れるはずです。閉包に向かうなら、issue の鍵を何にするか（式から決まる値にするのか、別の不変な鍵を持つのか）を、先に決める必要があります。

        README は、仕組みだけを手で書き、残りは問い合わせで生成する形にするのがよいと思います。issue の鍵の問題は、h_identifier_by_expansion を確かめるときに一緒に扱う話だと考えています。
