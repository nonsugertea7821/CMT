      text: |
        この制限を直さないと、ロードマップの管理は難しいです。直してから、それ以降の仮説はロードマップに結びながら管理するように、周回の手順を書き換えました。

        **なぜ難しいか**
        ロードマップは、決定から決定へのつながりでできています。ところが今の型検査器は、一つの決定からそのつながりを一本しか出せません。そのため、次のことが書けない状態です。
        - 「d_metric は d_road_region と d_road_checker に依存する」のような枝分かれ。今はリスト一つにまとめてごまかしています。
        - 「d_road_japanese は d_metric を上げ、しかも識別子化を前提にする」のような、種類の違うつながりの並置。

        **原因**
        `type_checker.py` の 448〜470 行は、個体の事実を、動詞ではなく「もう一方の端の種類」で分けてしまっておきます。その種類が `many` でなければ、一つしか入りません。
        - v_depend と v_raise は、どちらも終点が continuant です。そのため同じ欄でぶつかり、「関係 continuant の事実が2つ以上ある」で落ちます。
        - v_ground は終点が basis（`many: true`）なので、いくつでも出せます。

        **含意**
        - 式の上では別の関係が、検査器の中では一つに潰れています。これまで避けてきた「名前だけの区別」とは逆向きの潰れです。
        - 一つしか持てないか、いくつも持てるかは、関係ごとではなく端の種類ごとに決まっています。決定どうしのつながりが一本しか出せないのは、設計した結果ではなく偶然です。
        - 領域をまたぐ v_ground（exp の決定から lang の仮説へ）が落ちるのは、原因が別です。h_refer_stratified（#338）の範囲に入ります。

        **登録した仮説（PR #380）**
        登録だけの PR です。あなたを assignee にして、見張っています。
        - `h_fact_slot_by_end`（lang）: 検査器は事前を、位置・端の種類・many で区別していて、動詞では区別していない。原因の見立てです。
        - `h_decision_link_by_role`（exp）: 決定どうしを結ぶには、basis のように many の役割を終点に持つ動詞が要る。体系の側の直し方です。
        - 検査器の側の直し方（欄を動詞と位置で分ける）は、一つ目の結果を見てから対で出します。

        **周回の進め方（次は 15:58）**
        1. #380 がマージされたら、最小の例を一時ファイルで tc に通して、見立てを確かめます。
        2. 結果を見て、直すのを体系の側にするか、検査器の側にするか、両方にするかを決めます。検査器の変更は PR で見てもらいます。
        3. 直ったら、#379 で結べなかった決定どうしのつながりを体系に足します。
        4. そのあとに登録する仮説は、登録と同じ PR で、どの決定の根拠かを v_ground で結びます。結べないものは「わき道」と明記します。

        ひとつ注意があります。#380 の二つの仮説は、まだどの決定にも結んでいません。登録だけの PR として自動マージに乗せるためです。手順 2 の PR で決定に結びます。

        いってらっしゃい。
