      text: |
        凸（convex）とは、図形の性質のひとつです。図形の中から2点をどう選んでも、その2点を結ぶ線分がまるごと図形の中に収まるとき、その図形を「凸」といいます。

        **例**
        - 凸のもの: 円、三角形、四角形、球、半平面（直線の片側全体）
        - 凸でないもの: 三日月形、ドーナツ形、星形、離れた2つの丸
          - 三日月形なら、両端の2点を結ぶ線分が、欠けた部分を通って図形の外に出ます。

        **式で書くと**
        集合 C が凸であるとは、C の中のどの2点 x, y と、0 以上 1 以下のどの t についても、点 (1−t)x + t·y が C に入ることです。

        この点は、アフィン空間で「x と y の間の点」にあたります。原点を使わず、点の差と比だけで書けるので、凸はアフィン幾何で自然に扱える性質です。

        **概念の話と関わる性質**
        - 凸どうしの共通部分は、いつも凸です。なので、限定を重ねても範囲は凸のまま閉じます。
        - 凸の補集合は、ふつう凸ではありません。円の外側がその例です。「〜でないもの」を範囲として表すと、凸でなくなります。
        - 凸どうしの和集合も、ふつう凸ではありません。離れた2つの丸がその例です。

        前に「範囲は凸か」と聞いたのは、この3つ目までが理由です。限定（交わり）だけなら凸のまま閉じますが、否定と選言（または）を入れると凸から外れます。

        もうひとつ、凸には「意味の中間」と関わる面があります。ある概念の例2つの間にあるもの（たとえば、赤と少し暗い赤の中間の色）も、同じ概念に入るはずだ、という考え方です。Gärdenfors の概念空間（conceptual spaces）は、自然な概念は凸な領域だと主張しています。あなたの見方と近いかもしれません。
