      text: |
        所有の面では外周、接続の面では外周とは限らない、と考えます。

        ## 外周に位置するもの

        概念体系の**中身と正本**は外周です。系譜、版、合意、プロジェクトごとの分離が必要な以上、本体の重みとは別の部品になり、これは今後も変わらないと考えます。

        ## 外周とは限らないもの

        その部品が**モデルの計算のどこに接続するか**は別の問題で、深さに段階があります。

        | 接続する場所 | 方式 | 効き方 |
        |---|---|---|
        | 入力（最外周） | 概念体系を文章として読ませる | 弱い。元の重みの意味に押し負ける |
        | 中間層 | 概念の識別子で引ける記憶を、注意機構や活性化に直接つなぐ | 概念が実際に表現されている場所に届く |
        | 重みそのもの | 変更を差分重みとしてコンパイルして足す | 最も強い。干渉の問題がある |
        | 出力 | 語を出す前に概念の識別子を確定させ、検証する | 揺れを検出できるが、内部の表現は変えない |

        今あなたが組んでいる構成は、入力と出力、つまり最外周での接続です。現行のモデルで実現できるのはここまでです。

        ただし先の話のとおり、概念は中間層に、言語に依存しない形で存在しています。入力と出力は言語固有の処理に寄っています。したがって概念体系を本当に効かせるなら、接続点は中間層であるべきです。外周から文章として渡すのは、概念を一度言語に戻してから再び概念に解釈させる遠回りで、曖昧さはその往復で入ります。

        ## まとめ

        概念体系は部品としては外周にあり、接続点は中心に向かって深くしていく、という配置になります。「モデル側を変える」方向の実質は、この接続点を入力から中間層へ移すことだと考えます。
