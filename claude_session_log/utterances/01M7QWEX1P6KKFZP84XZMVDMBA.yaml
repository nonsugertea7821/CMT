        **Precedent survey**
        - Prosody is suprasegmental and organized as a hierarchy. Phrase boundaries align with syntax and disambiguate modifier attachment.
        - Snedeker & Trueswell 2003 (JML 48(1) 103–130): speakers produce disambiguating prosody when context doesn't resolve it. Warren et al. see it as a by-product of syntax.
        - Fodor 2002 (NELS 32 pp. 113–132), Implicit Prosody Hypothesis: silent reading projects prosody that affects attachment; length matters.
        - Japanese: pause disambiguates 文節-level modification; 読点 aligned with syntactic boundaries lowers processing cost.
        - The rhyme/meter reading of 韻 (七五調, 2-mora foot) was not chosen. This was left for the user to decide.

