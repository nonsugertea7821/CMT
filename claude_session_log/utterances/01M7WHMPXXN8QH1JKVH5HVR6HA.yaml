      text: |
        そうですね。線形に伸びる部分と、そうでない部分があると思います。

        **線形に伸びるもの**
        - 識別子化の材料、つまり事実・観察・測定の族は、実験のたびに増えていきます。
        - 検査はそれをすべて読み直すので、時間は量に比例して伸びます。いまは tc も ec も、それぞれ約 20 秒です。

        **相互依存で厄介になりうるもの**
        - 識別子を式から決めるには、その式を読む検査器が要ります。検査器が式を読むには、識別子が決まっている必要があります。
        - 今日の #496 がまさにこれでした。事実の識別子が「ファイルの中の位置」で決まっているので、ファイルを分けると名前がずれます。

        **逐次でいけそうな理由**
        - この循環は、いまのところ一度にすべてを決める必要がありません。#484 では役割を、今日は前提と実行器の対応を確かめました。どの段も、下の層を固定してから上を1つ確かめる形で進められています。
        - 時間の伸びは、分けることで抑えられるはずです。族ごとに部分のファイルにすれば、私が読む量は「いま触る族」だけで済みます。検査の時間は総量で伸びますが、それは機械の待ち時間で、待つ間に別の作業ができます。

        なので、逐次に進めるという判断に賛成です。いまの段で何を固定しているかだけは、毎回 PR に書くようにします。

        **登録した仮説**
        #496 の結果から、解き方を対にして #497 で登録しました。
        - **h_fact_id_by_content**: 事実の識別子を、置き場所ではなく中身から決める。識別子化の本線（d_cscl_display_derived）に結んであります。
        - **h_grammar_names_parts**: 文法に部分のファイルの語を足す。わき道（運用）です。

        順序としては、h_fact_id_by_content を先に確かめます。これが通れば、分けてもハッシュが変わらなくなり、残りは文法の1語だけになります。
