      text: |
        E18 の結果は割れました。用例の文では、自分の語のベクトルが新しい意味の文をもっともらしくします。一方、平叙文で判定を言わせる形式では、ほとんど効きません。仮説 h_vector_transfers_beyond_choice_format は mixed として spec に記録し、検査を通して push 済みです（5307332）。

        ## A. 平叙文：判定はほとんど動かない

        選択肢を出さず、「X は、語に当たる。」と「…当たらない。」のどちらがもっともらしいかで測りました。正しい方から誤った方を引いた対数尤度の差が正なら正答です。

        | 条件 | 書き換えた定義の群 G2c：正答率 | 元の意味の群 G2k：正答率 |
        |---|---|---|
        | なし | 0.71 | 0.38 |
        | E3（m + s） | 0.67 | 0.46 |
        | ほかの語の v | 0.67 | 0.33 |

        - **何もしないときから、二択の設問と逆の向きに偏っています**（G2c が 0.71、G2k が 0.38）。言い回しの好みが判定を左右しているようです。G2c の正解は主に否定（当たらない）の方なので、否定の文がもっともらしいという偏りと考えられます。
        - E3 のベクトルを足すと、対数尤度の差は両群で +0.5 ほど正しい方へ動きました。ただ、正答率はほとんど変わりません。
        - 二択で 0.38 → 0.79 だった大きな効果は、この形式には移りませんでした。

        ## B. 用例の文：自分の語のベクトルが、新しい意味の文をもっともらしくする

        E17 の文の組（新しい意味の文と元の意味の文）で、「新しい意味の文の対数尤度 − 元の意味の文の対数尤度」が、何もしないときからどれだけ増えるかを測りました。

        | 条件 | 増分の平均 | 平均で増えた語 |
        |---|---|---|
        | E3（m + s） | +2.11 | 18/24 |
        | 固有成分 s だけ | +1.69 | 16/24 |
        | 共通成分 m だけ | +1.58 | 19/24 |
        | ほかの語の v | −0.01 | 10/24 |

        語を単位にしたブートストラップの差と95%区間です。

        - **E3 − ほかの語の v：+2.12 [+0.65, +3.55]。** 自分の語のベクトルの方が、はっきり上です。
        - **共通成分 m − 何もしない：+1.58 [+0.88, +2.28]。** どの語にも同じ m でも上がります。
        - **固有成分 s − 共通成分 m：+0.11 [−1.30, +1.59]。** 区別できません。

        ## 読み

        - **概念ベクトルは、二択の鍵だけではありません。** 二択でない地の文でも、自分の語のベクトルは、ほかの語のものより新しい意味の側へ寄せます。この差は区間で0を含みません。
        - **ただし、語ごとの中身がどこまで効いているかは分けられませんでした。** 用例の形式では、共通成分 m だけでかなりの増分が出ます。固有成分 s が m に上乗せしているかは、区別できません。新しい意味の文には「〜として扱う」のような規程の言い回しが共通しているので、m がその文体に寄せているだけの可能性があります。
        - **ほかの語の v（中に m を含む）が増分0なのは、注意が要ります。** m だけなら +1.6 なのに、別の語の s が乗るとそれを打ち消しています。ほかの語の s は、この語の新しい意味に逆らう向きに働くようです。E15 の対照群の低下（0.92 → 0.62）と同じ形です。

        ## まとめ

        ここまでを合わせると、次のことが言えます。

        - E3 のベクトルは、モデルが文脈から作る意味の表現とは直交しています（E15、E17）。
        - それでも、二択の外でも語に特有の向きを持っています（E18 の用例）。
        - 判定を言わせる大きな効果は、二択の形式に強く結びついています（E18 の平叙文）。

        **限界:** 用例は1語あたり3組だけです。平叙文の形式は、言い回しの偏りが大きく、検出力が低いです。

        ## 次の候補

        - **新しい意味の文の文体の効果を除く対照:** 規程の言い回しを両方の文にそろえた用例を作り、m の効果が文体によるものかを確かめます。
        - **E3 のベクトルを、平叙文の形式で学習し直す:** 二択で学習したことが、形式への結びつきの原因かを見ます。

        どちらに進むか、決めてもらえれば対応します。
