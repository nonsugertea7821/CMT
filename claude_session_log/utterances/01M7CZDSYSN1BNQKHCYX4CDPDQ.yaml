      text: |
        その見方に納得します。試験の結果とも合っています。

        ## なぜ解けないか

        「について述べる」は、体系の中にある関係の1つではなく、体系そのものがしていることです。概念式は何かについて述べるために書かれています。それを式で定義しようとすると、式が何かを述べるという働きを、式自身に説明させることになり、定義の中で定義されるものを使ってしまいます。

        試験で出ていた2つの兆候は、これで説明がつきます。

        - **法則がなかった。** 他の5個の関係は、推移的・反対称的などの法則で区別できました。法則は式で書きますが、式は「述べる」ことで成り立っています。「述べる」自身の法則を、同じ道具では書けません。
        - **情報に関わる語根のすべてが、これに依存していた。** 学習する、判定する、答える、一致する。どれも「何かについての何か」が生まれることを含みます。

        ## そこから言えること

        「について述べる」は、他の5個と同列の基礎ではなく、体系の境界に当たります。置き方を変えるべきです。

        | 区分 | 中身 |
        |---|---|
        | 体系の中の基礎 | 在る、依存する、部分である、後ろにある、生起体に持続体が関わる |
        | 体系そのものの行為 | について述べる |

        体系の中の基礎は、5個すべてが法則を持ちます（「在る」は端が1つなので別扱いですが、表示語に頼ってはいません）。法則のないものは、体系の外に1つだけ、という形に整理できます。

        ## 推測を1つ

        確かめていない考えですが、書いておきます。関係・分類・修飾の3つが、表のどこにも置けなかった理由も、同じかもしれません。この3つは体系の中の対象ではなく、体系が述べるときのやり方、つまり「について述べる」の3つの仕方だった、という読みです。

        - 関係づけて述べる
        - 分類して述べる
        - 修飾して述べる

        そうであれば、「次元を変える操作であって、次元そのものではない」という言葉とも、表に直接は現れないという指摘とも合います。ただし、これは今の時点では根拠が1つ（解けない理由が同じ形をしている）しかありません。

        ## この計画との関係

        もう1点、気づいたことがあります。解けないと分かったこの関係は、実験が測っているものそのものです。「一般語を再定義したとき、その語が再定義された概念について述べるようになるか」が問いでした。体系の中では定義できませんが、モデルの振る舞いとしては測れます。使い方をまたぐ一貫性は、その測り方でした。

        ## 次の手

        「について述べる」を他の関係に還元する調査は、やめます。代わりに、ここまでの試験で固まった形（状態の関係 5個＋体系の行為 1個、生起体は状態の変化、修飾は位置の占有）で、語彙の全体を書き直せるかを試します。56個の試し書きを、全体の 135個に広げる作業です。

        E8 は、あと数概念で学習が終わります。
