      text: |
        これまでの座標の読みに沿って説明します。

        ## 前提：概念を座標で見る

        - 体系の限定（`mod` の動詞・位置・相手の組）を一つずつ「次元」と見ます。
        - 概念は、それぞれの次元を持つか持たないか（1 か 0）で決まる点です。
        - 概念が持つ限定には、自分で書いたものと、上位から積み上がったものがあります。その全部が、その概念の座標です。

        例：
        - `日` = (0, 0, 0, …)
        - `平日` = `日` ＋ 限定 a = (1, 0, 0, …)
        - `平日の午前` = `平日` ＋ 限定 b = (1, 1, 0, …)

        頂の `any` は、どの限定も持たないので零ベクトルです。

        ## ノルム：概念の「深さ」

        ノルムは、ベクトルの大きさです。0/1 の座標なら、1 の数を数えたもの（L1 ノルム、ハミング重み）がいちばん素直です。

        - `any` のノルムは 0、`平日` は 1、`平日の午前` は 2 です。
        - ノルムは「頂からどれだけ限定を積んだか」、つまり概念の深さです。
        - 前に「浅い」を論じたとき、この体系が最初に必要とした計量の量だと話したのが、これです。

        ヒルベルトの幾何では、結合と順序の公理だけでは長さを定義できず、合同の公理を足して初めて距離が語れます。同じように、体系には extends や refer のような構造はありましたが、深さという計量はありませんでした。

        注意点が一つあります。体系の深さは、extends の鎖を何段たどったか（段数）で数えている箇所があります。座標のノルム（限定の数）と、段数とは、必ずしも一致しません。一段で限定を二つ足す概念があれば、ずれます。

        ## 錐の順序：概念の「上位」

        ベクトル空間では、錐 K（足し算と正の倍で閉じた集合）を一つ決めると、次のように順序が定まります。

        > x ≤ y ⇔ y − x ∈ K

        いちばん身近なのは、K を正の象限（成分がすべて 0 以上）に取った場合です。このとき「x ≤ y」は「すべての成分で x ≤ y」になります。

        体系に当てはめると、こうなります。

        - **下位に降りることは、限定を足すこと**、つまり正の象限の向きに動くことです。
        - **y が x の上位である**とは、y が持つ限定を x がすべて持つこと（y の座標 ⊆ x の座標）です。
        - この順序は名前を使いません。式（座標）だけで決まります。

        体系の法則 `monotone`（階層を降りるたびに限定が増える）は、この読みでは「下に動くと、必ず錐の向きに進む」という約束です。その結果、ノルムは順序に沿って増えます。ノルムと錐の順序は、`monotone` を通して噛み合っています。

        ## 使ったところ：上位の健全性（`h_above_sound`）

        体系の上位 `above` は、extends の名前の鎖から導いています。これと錐の順序を比べました。

        - **上位である側（真）**：extends の鎖に沿って限定が積み上がるので、錐の順序と一致しました。健全です。
        - **上位でない側（偽）**：多くは「y にあって x にない限定がある」という座標の根拠を持っていました。しかし、一部の組にはその根拠がありませんでした。
          - それらの組では、座標の上では上位に見えるのに、名前の鎖がないので「上位でない」とされていました。
          - 偽が、閉世界の「書いていないから偽」にしか支えられていない、ということです。
          - この結果で、仮説は反証になりました。

        display の廃止と識別子化にとっての意味は、こうです。上位が名前（extends）でなく座標（式）から決まるなら、名前を替えても分類は変わりません。逆に、名前の鎖にしかない上下関係は、識別子化で失われる負債です。

        ## 今日の話とのつながり

        前の答えで「出現は概念の空間に置き場がない」と言ったのは、この座標の上に「在る・在らない」の成分がないからです。出現は点の座標ではなく、時間の線の上で、どの点が在るかという集まりの変化です。そのため、ノルムにも錐の順序にも現れません。
