      text: |
        「基礎の関係」は、体系の式が最後に行き着く 8 つの関係のことです。same（同じ）、exists（ある）、refer（述べる）、depend（依存する）、part（部分である）、after（後に来る）、involve（関わる）、above（上位にある）。動詞も概念も、最後はこの 8 つの組み合わせで書きます。

        この体系では、二つの概念を区別するには、式が違わなければなりません。式が同じなら、型検査器は one_name で「同じものの別名」とみなして退けます。そのため、語どうしの違いが 8 つの関係で書けないと、その語は置けません。

        #605 で実際に置けなかった例です。

        | 語 | 違いの中身 | 書けない理由 |
        |---|---|---|
        | 洗面器 と 水槽 | 形（鉢か、浸す器か）、用途 | 形・用途・中に入れる、を表す関係がない。part は「部分である」で、「中に入っている」ではない |
        | 胸元 と 雁首 | 体のどこにあるか（首の下か、上か） | 空間の位置関係がない。above は概念の上下（階層）で、空間の上下ではない |
        | 有する・得る | 所有 | 所有は部分でも依存でもない |
        | 許す | 起きるのを妨げない（可能） | 可能・必然を表す関係がない |
        | 見える | 見る人に、そう見える（印象） | 見かけと実際を分ける関係がない |
        | 週間 | 7 日という量と単位 | 大きさの概念（magnitude）はあるが、単位や数の関係がない |
        | 匂い | 嗅覚という感覚の種類 | 感覚を種類で分けられない。同じ理由で、ご覧になる も「知覚する」までしか書けず、視覚に限れなかった |

        日常の語は、空間（位置・形）、用途、材料、感覚、所有、可能、量と単位、といった軸で互いを区別しています。いまの 8 つの関係は、部分・依存・時間の順序・存在・参照という形式的な軸に偏っていて、これらの軸がありません。そのため、兄弟にあたる語（容器どうし、体の部分どうし）は同じ式になり、置けなくなります。下書きの誤り 316 件のうち、one_name が 156 件を占めたのも、この現れだと読んでいます。

        これは 53 語の標本から引いた解釈で、まだ仮説として確かめたものではありません。たとえば「空間の関係を一つ足せば、置ける語が増える」という形にすれば、測れる仮説になります。前の質問の (B) は、こうした関係を足すことを指しています。

