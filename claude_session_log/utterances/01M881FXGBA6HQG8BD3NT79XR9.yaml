      text: |
        #776 の結果が、ちょうど 2 つ目の結論に関わるので、合わせて書きます。

        ## #776 の結果（h_state_by_prior_meaning）
        事前登録の判定は**反証**でした。

        - 元の意味を持たない作り語でも、類の前置きにはほとんど寄りませんでした（層 8 の上がり：作り語 0.012、実在の語 0.025）。
        - 一方、表示語だけのときの類の分かれは、実在の語で 0.082、作り語で 0 前後でした。

        ここから、2 つのことが分かります。
        - 状態のまとまりそのものは、語の元の意味が与えています。
        - ただし、文脈が状態を動かせないのは、元の意味が逆らうからではありません。元の意味がない語でも、前置きの文脈はほとんど効きません。

        事前登録で測ったのは「逆らう」形だけでした。この狭さは PR の本文で開示しています。

        ## 2 つの結論について
        **1. 能力は「大規模」であること**
        手元の事実はこれと合います。
        - 適用例を読んだのは 4B で、1.5B は動きませんでした（E55）。
        - mixed の分かれ目の一つも、モデルの大きさでした。

        ただ、測ったのは 2 つの大きさだけです。規模そのものを変えて確かめたわけではありません。

        **2. 学習した内容から離れるには、機構か再学習が要る（疑える側）**
        これは h_departure_relies_on_mechanism として #777 で登録しました。
        - 支持の側の事実：
          - 衝突は追従を下げます（支持）。
          - 層にベクトルを足す機構は、追従を上げます（支持）。
        - 疑う余地：
          - #776 は、この結論に一つ留保をつけます。文脈は、元の意味と争う前に、そもそも語の位置の状態にあまり届いていません。
          - 「汚染から離れられない」のか、「文脈の届く量が小さい」のかは、まだ分けられていません。
          - 前者なら、離れる力は元の意味の強さに応じて要ります。後者なら、元の意味の有無に関係なく要ります。#776 は後者の形に見えます。

        Claude を対象にしないことは了解しました。これまでの実験は、どれも Qwen の公開モデルで行っています。

        ロードマップの位置: d_road_region の h_state_by_prior_meaning は反証（#776、CI 待ち）です。利用者の 2 つ目の結論を #777 で登録しました。#765 は確認待ちです。
