      text: |
        その抽象化は的を射ていると思います。ただし、今回の実験結果に照らすと、1点補う必要があります。

        ## 同意する点

        概念を「語に対応する表現」ではなく「その語を使うときに走る推論」と捉えるなら、再定義はその推論の内容を変えることです。定義文の出力は、その推論が外から見える形の1つです。

        ## 補う点：定義文の出力と推論は、別々に変えられてしまう

        定義文だけで学習したベクトル（E3 の1本目）が、まさにこの区別を突いていました。

        - 定義文の**出力**は完全に変わりました（新しい定義を暗唱できる）。
        - しかし、定義文を出すときの**推論**は変わっていませんでした。事例への適用は反転しただけで、境界は移っていません。

        モデルは「定義を答えよ」という問いに対して、概念の推論を経由せず、文字列を直接出す近道を作れます。したがって、出力が変わったことは推論が変わったことの証拠になりません。

        ## 言い直すと

        再定義とは、その語のあらゆる使い方が共有している推論を変えることだ、と言えます。使い方には少なくとも次の3つがあります。

        | 使い方 | 内容 |
        |---|---|
        | 定義する | 定義文を述べる |
        | 適用する | 事例がその概念に当たるかを判定する |
        | 説明する | 判定の理由を述べる |

        人間なら、この3つは同じ理解から出てきます。モデルでは別々の経路になりえます。実験結果を並べると、次のとおりです。

        | 学習の教師 | 定義する | 適用する | 説明する |
        |---|---|---|---|
        | 定義文（E3 の1本目） | 変わった | 変わらない | 未測定 |
        | 適用例（E3 の2本目） | 未測定 | 変わった（3形式と自由生成に転移） | 変わらない |

        どちらも、1つの使い方を変えただけで、共有された推論は変えていません。再定義が成功したと言える条件は、**1つの使い方で教えたら、他の使い方も揃って変わること**です。

        ## 共有された推論はモデルの中にあるか

        ここが核心の問いです。手がかりは2つあります。

        - **あるという側の証拠**: 適用例で学習したベクトルは、学習していない設問形式や自由生成での判定にも効きました。適用という使い方の中では、共有された何かを動かしています。
        - **ないという側の証拠**: そのベクトルは説明を変えませんでした。定義文の教師は適用を変えませんでした。

        既存の研究では、モデルは語の位置で、中間層にかけてその語の属性を呼び出し、後段がそれを読んで出力を作ることが知られています。再定義は、この「呼び出される属性」を差し替えることに当たるはずです。今回のベクトルは第8層で語の位置に加えていますが、属性の差し替えになっているのか、答えへの近道になっているのかは、まだ区別できていません。

        ## 確かめ方

        使い方をまたぐ転移を測ります。

        1. 適用例で学習したベクトルを入れた状態で定義を問い、新しい定義を述べる方向に動くかを見る（上の表の未測定の欄。学習は不要で、すぐ測れます）。
        2. 定義と適用の両方を教師にして学習し、説明まで変わるかを見る。
        3. 層を変えて、3つの使い方が揃って変わる位置があるかを探す。

        揃って変わる位置が見つかれば、そこが再定義を書き込むべき場所です。見つからなければ、このモデルには共有された推論がなく、使い方ごとに教える必要がある、という結論になります。

        1 は大きいモデルの実行が終わり次第測ります。この見方は、主要な指標を「再定義への追従率」から「使い方をまたいで揃って変わるか」に改めるものなので、設計文書にも反映します。
