        2. Key Technical Concepts

           **Layered CSCL**
           - Layers: axiom, ontology, syntax, runtime, std.
           - Domains: exp, subj, lang (cscl/design/claims.yaml).
           - Nodes are stored as "layer.name".
           - Grammar keys are declared in syntax.yaml `grammar:`. Every grammar word must also be a node.
           - Kinds are defined by mod expressions. The law "specific" rejects two nodes with the same expression, so new kinds need distinct expressions.

           **gather()**
           - Stores facts on an individual under the relation name = short name of the other end's kind.
           - Multiple facts per relation are allowed only for relations declared many.

           **sync_issues sections**
           - `obs` (観察の値) and `prior` (先行研究): generated, not hashed.
           - `def`: hashed.
           - Labels are now English: claim, hypothesis, decision, supported, refuted, mixed, untested, adopted, tentative, withdrawn, stale-explanation, exp, cscl.
           - RENAME (Japanese → English) and DEFAULTS (GitHub default labels to delete) are handled in apply.

