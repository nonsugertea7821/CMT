      text: |
        つながると思います。出典は記憶から挙げていて、このセッションでは原文を確かめていません。

        - **乳児の研究で言われていること**:
          - 乳児は最初、音のつながりの起こりやすさ（統計）で語の切れ目を見つけます（Saffran ら 1996）。
          - 統計と強勢（韻律）が食い違う音を聞かせると、7 か月児は統計に従い、9 か月児は強勢に従いました（Thiessen と Saffran 2003）。8 か月児で強勢が統計に勝ったという報告もあります（Johnson と Jusczyk 2001）。
          - 読み方としては、統計で切り出した語からその言語の強勢の型を覚え、そのあと韻律が切り出しの主な手がかりに移る、という流れです。
        - **LLM との対応**:
          - トークナイザーは、乳児で言えば統計の段で止まっています。名前を足場にする段も、韻律に移る段もありません。
          - この二つの段が LLM にあるとすれば、学習の中の表現の側だろうと見ています。これはまだ確かめていない見立てです。
        - **登録したこと**: 韻律の側も「韻律句の切れ目を与えると、まわりの式の区画への落ち方が上がる」という仮説にしました（h_prosody_anchors_region）。#982 に専用トークンの仮説と並べて足しています。どちらも領域の道に結びました。
        - **既存の仮説との違い**: 韻律句を扱う既存の仮説 #945（一貫性は識別子・表示語・韻律句の組に頼る）は一貫性を問うものです。今回の二つは、区画の切り出しを問います。
        - **次の段**: 式と区画の対応を測る実験に、二つの足場を条件として足せます。

        #981 はマージ済みで、承認と入金は式で分かれた状態で main に入りました。
