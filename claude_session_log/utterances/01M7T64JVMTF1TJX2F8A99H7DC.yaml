      text: |
        「英語でも同じか」と「日本語を学んでいないモデルではどうか」を、2 つの仮説として登録しました。PR #365 は登録だけの PR なので、自動マージを待っています。

        **登録した仮説**
        - h_midpoint_language_invariant：上位概念ではまとまり、性質ではまとまらないという形は、言語に依存しない。
          - 確かめ方：同じ語の表を英語に訳し（犬→dog など）、#364 の 4 つのモデルで測ります。
        - h_midpoint_depends_pretext：その形は、モデルが前に読んだ文章に依存する。
          - 確かめ方：日本語をほとんど学んでいない英語中心のモデルで、日本語の語の表を測ります。
          - 候補のモデルは SmolLM2-1.7B・OLMo-2-1B・Pythia-1.4B です。3 つとも取得できることを確かめました。
          - 前提の確かめとして、同じモデルで英語の語の表も測ります。英語ではまとまり、日本語ではまとまらなければ、効いているのは「その言語を読んだかどうか」だと切り分けられます。

        **ここから読み取りたいこと**
        2 つの結果を組み合わせると、概念を学ぶことについて、次のどちらに近いかの手がかりになります。

        | 結果 | 読み |
        |---|---|
        | 英語でも同じ形が出る。しかも日本語を読んでいないモデルでは、日本語から形が出ない | 概念の構造は言語の表面によらない。ただし、その言語の語に結びつけるには、その言語の文章を読む必要がある |
        | 日本語を読んでいないモデルでも、日本語から形が出る | 字面や、わずかに混じった日本語から、構造が漏れ出ている |

        ただし、英語中心のモデルの学習データにも、日本語はわずかに混じっています。「まったく読んでいない」とは言えないので、結果を見る前に開示しておきます。

        PR がマージされて issue が立ったら、英語の実験から事前登録に進みます。
