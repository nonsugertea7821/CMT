      text: |
        第8層で「定義と適用の両方を教師にした学習」が終わりました。教えた2つの使い方は1本のベクトルに同居できますが、教えていない使い方には広がりませんでした。

        ## 結果（Qwen2.5-1.5B、第8層、24概念）

        | ベクトルの教師 | 定義の言い換えを選ぶ率 | 定義文の出しやすさ（小さいほど出しやすい） | 適用する（衝突／非衝突） | 定義文と併用したときの適用（衝突／非衝突） |
        |---|---|---|---|---|
        | なし | 0.12 | 2.70 | 0.38／0.75 | 0.58／0.75（定義文だけ） |
        | 定義文の暗唱 | 0.46 | 0.01 | 0.67／0.33 | 0.67／0.25 |
        | 適用例 | 0.33 | 3.01 | 0.79／0.92 | 0.79／0.67 |
        | 定義文の暗唱＋適用例 | 0.54 | 0.63 | 0.79／0.92 | 0.88／0.83 |
        | （参照）ベクトルなしで定義文を文脈に置く | 0.96 | — | 0.58／0.75 | — |

        ## 読み取れること

        - **両方を教えても、互いに邪魔はしません。** 適用は適用例だけのときと同じで、定義文もおおむね出せるようになりました。途中経過で懸念した競合は、判定には表れませんでした。
        - **文章との併用で下がる問題が解消しました。** 両方を教えたベクトルを定義文と併用すると 0.88／0.83 で、これまでの全条件の中で最もよい値です。判定はベクトル、説明は文章、という使い分けを両立できる見込みが出てきました。
        - **定義の言い換えは、依然として選べません（0.54、偶然は 0.50）。** 同じモデルは、定義文を文脈に置けば 0.96 で選べます。解ける課題なので、ベクトルが定義の内容を運んでいないということです。

        あなたの抽象化で判定すると、第8層の1本のベクトルは「教えた使い方を個別に変える」ことはできても、「使い方が共有する推論を変える」ことはできていません。再定義はまだ成功していません。

        ## 次に回しているもの

        1. **E7 の続き（4B、約1時間）**: 再定義が無視される原因が「前に並ぶ他の定義」なのか「文脈の深い位置」なのかを区別します。無関係な文章のあとに定義を置く条件、用語集の中での位置を細かく動かす条件、前に並ぶ定義の種類（一般の意味どおりの定義だけ、他の再定義だけ）を変える条件を測ります。
        2. **層を変えた学習（第14層、第4層、第20層、各2時間あまり）**: 両方を教える形で、定義の言い換えまで揃って変わる層があるかを探します。

        結果は `experiments/README.md` と `docs/design.md` に記録し、プッシュ済みです。
