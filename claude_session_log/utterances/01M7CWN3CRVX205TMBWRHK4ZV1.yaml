        ## 自分で見て気になる点

        一覧にして見直すと、粗い箇所があります。

        - **終点の型が形だけのものがある。** たとえば `has_unit`（単位）の終点は「情報」ですが、実際の値は「名前」「文」「一覧」といった列挙値で、実体ではありません。列挙値を取る軸のもとになる関係は、終点の指定が意味を持っていません。
        - **原子関係が多すぎる。** 56個のうちかなりの数は、1つの実体を定義するためだけに作ったものです（`has_weight_state`、`has_option_order`、`substitutes_word` など）。より少ない一般的な関係の組み合わせで書けるはずです。BFO 系の関係（部分である、担い手である、関与する、実現される など）に寄せて整理する余地があります。
        - **`has_target` と `has_content` が何でも受ける。** 始点も終点も「すべての実体」で、型の検査が効きません。便利な逃げ道になっています。
        - **述語論理で定義した17個は、すべて仮説と決定で使う関係です。** 属性の関係は1つも定義していません。

        どこから手を入れるべきか、方針があれば教えてください。なければ、まず2点目（BFO 系の少数の関係に寄せて原子関係を減らす）から進めるのが筋だと考えます。
