        **足したノード**
        - `verdict_stability`（選択肢の順序に対する判定の安定）
        - `sense_difference_vector`（語の意味の候補どうしの差のベクトル）

        **判定が付いた仮説（E16 の観察で裏づけ）**

        | 仮説 | 状態 | 根拠 |
        |---|---|---|
        | 共通成分は判定の安定を上げる | 支持 | 両方正しい：G2c 0.29→0.50、G2k 0.50→0.71 |
        | 固有成分は判定の安定を上げない | 混合 | G2k 0.50→0.33 で下がる。G2c は 0.29→0.38 と2問分上がった |
        | 共通＋固有は、固有だけより安定を上げる | 支持 | 両方正しい：G2c 0.38→0.71、G2k 0.33→0.88 |

        **未検証の仮説（次に確かめるもの）**
        - **固有成分 ≈ 意味の候補どうしの差:** 次の実験で確かめます。成り立てば、学習しなくても固有成分を作れます。
        - **固有成分は概念式から合成できる:** 「上位 ∧ 限定」との対応を見ます。
        - **共通成分は見ていない概念にも転移する:** 一つ学習して使い回せるかを見ます。
        - **定義文が作る共通のずれも判定の安定を上げる:** 文章の経路も「安定」の軸を持つかを見ます。
        - **文章の経路は注意機構を通って効く:** E15 で見た二つの経路の区別を確かめます。

        「固有成分は安定を上げない」を混合にしたのは、G2c の2問の上昇を反証として正直に残したためです。

        次の「意味の候補どうしの差」の実験には、各語について二種類の自然な文が数文ずつ要ります。目的の意味（再定義後）で使われている文と、元の意味で使われている文です。私が24語分の下書きを作ってよいですか。ご自分で用意したい語があれば、それに合わせます。
