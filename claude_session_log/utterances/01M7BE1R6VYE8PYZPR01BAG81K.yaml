      text: |
        E3 の1本目（定義文の暗唱だけを教師にして、概念ベクトルを中間層に加える方式）が終わりました。結果は失敗で、この方式では概念の境界は移りません。

        | 設問 | 問数 | 何もなし | ベクトルだけ | 定義文だけ | 両方 |
        |---|---|---|---|---|---|
        | 定義が元の意味と衝突する | 24 | 0.38 | 0.67 | 0.58 | 0.67 |
        | 定義と元の意味が一致する | 24 | 0.75 | 0.33 | 0.75 | 0.25 |

        - ベクトルは定義の暗唱を覚えます（学習の損失は 0.01 前後まで下がる）。
        - 衝突する設問の正答率は上がりますが、衝突しない設問が同じだけ下がります。両方を合わせると 0.50 で、偶然と同じです。
        - 選択肢の順序を入れ替えても両方正答する率は、ほぼ 0 に落ちます。

        つまり、語の表現を壊して答えを反転させているだけです。定義を暗唱できることと、定義を適用できることは別だと分かりました。正本（定義文）だけからコンパイルする方法としては、このままでは使えません。

        いまは2本目を裏で回しています。適用例の二択（概念あたり4問、評価とは別の事例）を教師にしたベクトルが、未見の設問に通用するかを見ます。これで「語の位置に加える1本のベクトルが、概念の境界を担えるか」が分かります。1時間ほどかかる見込みです。

        結果はここまで `experiments/README.md` に記録し、プッシュ済みです。
