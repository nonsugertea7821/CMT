      text: |
        転移と干渉の評価が終わりました。概念ベクトルの効果は設問形式を変えても保たれ、24概念を同時に入れてもほぼ劣化しませんでした。

        ## 形式の転移

        数値は正答率です。

        | 設問形式 | 設問の種類 | 何もなし | 文章（定義文＋適用例4問） | ベクトル |
        |---|---|---|---|---|
        | 学習時と同じ（はい/いいえ） | 衝突する | 0.38 | 0.79 | 0.79 |
        | | 衝突しない | 0.75 | 0.71 | 0.92 |
        | 空欄補充（当たる/当たらない） | 衝突する | 0.42 | 0.71 | 0.79 |
        | | 衝突しない | 0.71 | 0.67 | 0.75 |
        | 正誤判定（正しい/誤り） | 衝突する | 0.50 | 0.58 | 0.79 |
        | | 衝突しない | 0.67 | 0.75 | 0.71 |

        - **衝突する設問への効果は、3形式とも 0.79 で変わりません。** 学習した形式への適合だけでは説明できず、語の表現そのものが定義側に移っていると読めます。
        - **衝突しない設問での上積みは、形式を変えると消えます。** 何もなしの水準（0.67〜0.71）に戻るだけで、壊れてはいません。
        - **文章で渡す方式は、形式によって揺れます。** 衝突する設問で 0.58〜0.79 でした。

        ## 干渉と局所性

        - **24概念を同時に入れても、正答率の低下は最大 0.04 でした。** ベクトルは語が現れた位置にしか加わらないので、干渉が起きるのは語が重なる場合（「週に二日」の「週」など）に限られます。
        - **無関係な設問（一般の類義語 19問）は満点のままでした。** 確信はわずかに下がりました（ロジット差 +5.11 → +4.41）。

        ## 限界

        - 24概念までしか試していません。数百の規模での干渉は未確認です。
        - いずれも二択の1トークンで測っています。

        ## 次に回しているもの

        2つ目の限界を埋めるため、選択肢を示さず自由に答えさせたときにもベクトルが効くかを測る評価を、裏で実行中です。

        結果は `experiments/README.md` に記録し、プッシュ済みです。
