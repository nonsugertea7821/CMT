        プロジェクトごとの辞書は、体系では「領域」（syntax.domain）に当たります。今の題材の領域 subj が、その一つです。共通の公理（ontology・syntax）の上に、プロジェクトごとの専用辞書を重ねる形になります。国語辞典に、専門分野の用語集を足すのに近いです。

        ここから設計に効く問いが一つ出るので、h_identifier_unique_within_domain として登録しました（#966）。鍵は、体系の全体ではなく、共通の公理と一つの領域の中で一意なら足りるか、という問いです。
        - 足りるなら、プロジェクトごとに辞書を作って区画に結べます。ほかの領域の同じ字面の語とぶつかっても構いません。
        - 足りないなら、辞書は全体で一つにそろえる必要があります。

        あわせて、#963 の結果が出ました。判定は支持です。表示語を一切通さず、名前を無意味にした式だけを通しても、区画は式に沿いました。

        | 層 8 | 区画が式に沿う度合い（偶然なら 0.5） | 表示語の字の重なりで測った値 | 式の近さと位置の近さの相関 |
        |---|---|---|---|
        | #960（表示語を通す） | 0.615 | 0.624 | 0.32 |
        | #963（式だけを通す） | 0.681 | 0.567 | 0.65 |

        - 空間の側には、式の形が表示語なしでも現れます。#960 の偏りは、字だけによるものではありませんでした。
        - 限りが二つあります。
          - 同じ文字列になる概念は同じ位置に置かれるので、その分が値を押し上げています。その大きさは記録していません。
          - 言えるのは「式の書き方の近さに沿う」までで、モデルが式の意味を読んでいるとまでは言えません。

        結果は体系に書いて、#963 に push しました。検査が通ったら Draft を外します。
