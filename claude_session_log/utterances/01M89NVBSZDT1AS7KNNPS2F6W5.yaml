      text: |
        「式の識別子化」は、半分まで進んで止まっています。進んだのは、体系の中の関係（事実）に付ける名前です。止まっているのは、概念そのものの名前の方です。

        #868 の型検査の失敗は、先に直して push しました（最後に書きます）。

        **事実（関係）の名前: 実験では支持、検査器にはまだ入れていない**
        - 始まりは #496（h_check_immune_parts）の反証です。exp.yaml を複数のファイルに分けたら、検査の結果が変わりました。原因は、事実の名前が「どのファイルの何番目か」で決まっていたことです。
        - 対の解き方として、事実の名前を中身（動詞・始点・終点）から作る案を立てました。これが h_fact_id_by_content で、#502 で支持されました。名前を中身から作ると、ファイルを分けても関係は同じになり、名前の重なりも出ませんでした。
        - ただし、main の型検査器はいまも位置で名前を作っています（type_checker.py の `ifact <ファイル> <位置>`）。支持された形は、検査器にはまだ取り込んでいません。
        - 分けたときに残ったもう一つの障害は、文法に「部分のファイル」の語がないことです。これは h_grammar_names_parts として登録済み（未検証、わき道）です。

        **概念の名前: 自分の欄だけから導く案は反証が続いた**
        - 概念の名前を、その概念自身の式（holds・from・to・mod）から導く試みは、二つとも反証でした。
          - 展開した形で決める案（h_identifier_by_expansion）
          - 振る舞いの同値で決める案（h_identifier_by_bisimulation）
        - 表示語や extends を自分の欄だけから導く案も、同じ形でいくつも反証されています。
        - そこで 11/24 に、反証の共通の形から仮説を立てました（#759、h_identifier_by_genus_differentia）。中身は「名前は自分の欄だけでなく、上位概念（extends）と種差の組で決まる」で、未検証のままです。確かめ方の案は登録の commit に書いてあります。展開が同じになった名前の組が、extends の連鎖を足すと分かれるかを数えます。

        **今回 #868 で起きたことも同じ形でした**
        - 「上位概念への包含を教える」という区別を式で書こうとして、型検査に落ちました。教示は出来事なので、「extends に依る」という依存の始点に来られなかったためです。
        - そこで、教示の元を型付きグラフとするだけに直し、表示語も式から訳した「型付きグラフを教師にする」に直しました。
        - 「包含を」の区別は、いまは式になっていません。仮説の名前と PR の本文にだけあります。これも、名前を式から決めきれていない例の一つです。
