      text: |
        そのとおりでした。残っていた 7個は、すべて限定として書けました。書けなかった印が残る概念は、198個中 0個になっています。

        ## 私の取り違え

        「について述べる」は定義できない、という結論から、それに関わる語は書けないと決めつけていました。定義できないことと、限定できないことは別でした。定義できない行為も、端の種類を狭めれば、他の語と同じように修飾できます。

        ## 7個の書き方

        | 概念 | 書き方 | 限定の種類 |
        |---|---|---|
        | 修飾 | 語のうち、依存するものについて述べるもの | 述べる の終点の限定 |
        | 上位概念 | 語のうち、依存するものについて述べないもの | 述べる の終点の限定 |
        | 設問形式 | 設問と判定という種類について述べ、事例については述べない情報 | 述べる の終点の限定 |
        | システムプロンプト | 文章のうち、運用者が発話したもの | 発話する の始点の限定 |
        | 型付きグラフ | 概念と関係について述べ、すべての推論に関わる情報 | 述べる の終点の限定と、数量化 |
        | 兄弟概念の組 | 新しい語を2つと、上位概念を1つ含むもの | 分類の値（個数） |
        | 読む | 見る の終点を情報に限定したもの | 動詞の端の限定 |

        「見る」と「読む」は、様態の違いとして書けないと報告していましたが、上位と下位を逆に置いていただけでした。読むことは、見ることのうち相手が情報であるもの、です。

        ## 書き直しの推移

        | 版 | 加えたもの | 内容が落ちた概念 |
        |---|---|---|
        | 第1版 | 関係と修飾 | 28 |
        | 第2版 | 分類 | 14 |
        | 第3版 | 定義に依存する役割、動詞の産物 | 7 |
        | 第4版 | 「について述べる」の限定 | 0 |

        ## 「について述べる」への依存

        数えてみると、概念 198個のうち 54個が、「について述べる」を含む動詞を修飾に使っていました。定義できない行為は1つだけですが、語彙の4分の1強が、それを限定することで成り立っています。この計画が情報とその意味を扱うものなので、当然の比率とも言えます。

        ## 留保

        0個という数字は、割り引いて読んでください。

        - **意味を正しく捉えている保証ではありません。** 0個というのは、私が「書けなかった」と印を付けた箇所が残っていない、という意味です。検査が確かめているのは、型の整合と式の重複だけです。
        - **検討の浅い書き方が2つあります。** 運用者を「実験の取り決めを設計するもの」としたこと、型付きグラフの永続を「すべての推論に関わる」としたことです。どちらも、今回の試験のために置いた書き方です。
        - **式の割り当ては私の手作業で、1通りに決まるものではありません。**

        ## 現在の形

        - 基礎は、法則を持つ状態の関係 5個と、体系そのものの行為 1個（について述べる）。
        - 動詞は、状態の関係の成立と変化。
        - 修飾は、動詞のある位置を占めるものへの限定。動詞の端を狭めることも含む。
        - 分類は、関係を軸として見て、値（固定値か関数）を置くこと。比較の土台。
        - 役割は、定義に依存する実現可能体。

        ## 次の手

        書き直しの試験は、ここで区切りがつきました。次は正本の切り替えです。`spec/ontology.yaml` をこの形に置き換え、測定値の定義と、仮説・決定を載せ直します。対象外にしていた「仮説と決定で使う関係」17個も、そこで書きます。

        規模が大きいので、この形で固めてよいかの判断をください。

        実験は、E8 が学習を終えて評価に入るところです。結果が出たら記録します。記録は `spec/trial/full6.yaml` に置きました。
