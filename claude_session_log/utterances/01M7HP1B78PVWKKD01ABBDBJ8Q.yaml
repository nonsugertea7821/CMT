        - **std に移せたのは 8 つだけです。** 実験・傾向性・合成について閉じた集合などです。v_sum・閉集合・種類の集まり・役割・仮説は、法則か型検査器が参照しているので core に残りました。言語と標準の語彙の境目は、まだ薄いです。
        - **動作は移動前と同じです。** 型検査、実行の検査、render、check_line は通ります。測定値 608 件は、移動前と完全に一致しました。

