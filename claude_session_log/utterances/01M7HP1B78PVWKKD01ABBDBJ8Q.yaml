        - `claude/cscl`（言語用）と `claude/exp`（実験用）を作りました。今はどちらも同じコミット（6cd2bc3）です。
        - 言語の更新は claude/cscl で行い、claude/exp に取り込む（merge）運用を考えています。
        - 今の作業ブランチ claude/model-concept-language-mapping-g0lw1i も同じコミットのまま残しています。

        **注意**
        - E3 の再学習（種 1）は、移動前に起動したのでまだ動いています。古いパスを使っているので、根に `experiments → exp/experiments` のシンボリックリンクを一時的に置きました。git には入れていません。学習が終わったら消します。
        - docs/design.md と experiments/README.md は凍結しているので、中に出てくる旧パスは直していません。

        次からは、言語の変更は claude/cscl、実験は claude/exp で作業する、でよいですか。
