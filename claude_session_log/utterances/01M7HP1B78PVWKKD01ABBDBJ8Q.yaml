        - **kernel ではなく bootstrap にしました。** セルフホストのご指摘を受けて、Rust の stage0 に倣っています。今の Python 実装は「最初の版」という位置づけで、将来は前の版が信頼の基点になる、と cscl/bootstrap/README.md に書きました。
