        フォルダを言語と実験に分けて、ブランチも 2 本作りました。どちらもプッシュ済みです。

        **今の配置**
        ```
        cscl.yaml                 範囲の設定（workspace）
        cscl/
          library/core/ontology.yaml   文法・基礎・法則（型の規則もここに CSCL で書く）
