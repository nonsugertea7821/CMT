        前の続きとして、静的な動詞（82）と動的な動詞（36）を比べました。まだ記録もコミットもしていない、探索の観察です。

        **動的な動詞（36）と静的な動詞（82）の比較**

        | 観察 | 動的 36 | 静的 82 |
        |---|---|---|
        | 自分の限定（mod）を持つ | 8 | **0** |
        | ほかのノードの限定の動詞として使われる | 18 | 42 |
        | 端の型や個体の種類として使われる | 0 | 0 |
        | 端が 持続体→持続体 | 35 | 52 |
        | 端に生起体か any を含む | 1（持続体→any） | **30** |
        | 関係 exists を使う | 21 | 2 |
        | new_kind（新しく作る）を持つ | 17 | 2 |
        | 関係 after・involve を使う | 1・0 | 16・8 |
        | 反対語（opposite）を持つ | 0 | 4 |

        **ここから言えそうなこと**

        1. **動的な動詞の端（from・to）は、例外なく持続体です（36/36）。**
           - 静的な動詞は、生起体どうしの関係も持ちます（after など）。
           - これは定義からも筋が通ります。「フレームが変わった」と言うには、前後のフレームで同じものだと言える相手が要ります。それが持続体、つまり same(self_t, self_t') が成り立つものです。
           - 観察と定義の両方から立つ法則の候補になります。
        2. **限定を持つ動詞は、どれも動的です（8/8）。** 静的な動詞は一度も限定されていません。ただし標本が 8 と少ないです。
        3. **端の型や種類として使われないことは、動的・静的の区別に効きません。** どちらも 0 なので、動詞であることの性質で、上位の分類の性質ではありません。

        **弱いところ**
        - 動的な 36 のうち 20 は、動的な動詞を継承したものです。独立に pre・post を持つのは 16 で、数が小さいです。
        - 静的な動詞 82 が持続体・生起体のどちらに当たるかは、まだ決まっていません。生起体の名詞 49 のうち、動的な動詞に届くのは 14 だけです（sys_tops）。今の観察では、最上位を決める型検査の全体はまだ導けません。

        **型検査に使える部分の候補**
        「フレームを変えるもの（生起体）の端は持続体である」です。これは signature の語（same とフレーム）だけで書け、syntax に頼りません。

        次は、この比較を sys_verbs.py として判定基準なしの観察で記録したいと考えています（sys_frames と同じ形です）。そのうえで、上の候補 1 を仮説として事前登録し、確かめる順番を提案します。静的な動詞の置き場は、そのあとに別の観察で扱います。この方向で進めてよいか教えてください。
