      text: |
        反証と mixed の共通の形を合わせ、目的（使い方をまたいで一貫した概念認識）に向けて体系を変える点を 3 つ、#763 に登録しました。どれもまだ確かめていない仮説です。

        ## 1. 表示語を、類と種差から組み立てる（h_state_by_genus_display、d_road_region）
        - もとにした形は 2 つです:
          - 体系の側: 自分の欄だけから名前を決めると落ち、類を先に置くと通る。
          - モデルの側: 隠れ状態は式よりも字面に沿う。
        - 合わせると、**字面のほうを式に合わせればよい**、という向きになります。表示語を「類の語 ＋ 種差」で組み立てれば、モデルが字面に沿ったまま、類に沿ってまとまるはずです。
        - 確かめ方の案: #756 と同じ測り方で、表示語だけを組み立てたものに替えて比べます。1.5B で数分で済みます。

        ## 2. 体系に、適用例を持たせる（h_consistency_by_examples、d_road_checker）
        - もとにした形: 補助を置くだけでは使われないが、読み方の例を添えると 4B は読んだ（E55）。
        - これを実験の条件ではなく、**体系の持ち物**にする向きです。定義と並べて「検査器の出力からこう読む」という適用例を置けば、一貫性が上がる、という仮説です。
        - いま走っている E56（答えを含まない辺）が、その例の効く範囲の下限を測っています。

        ## 3. 一貫性を、追従と維持の組で測る（h_consistency_pairs_control、d_metric）
        - もとにした形: 追従を上げる補助は対照を崩す（mixed の分かれ目）。
        - **測り方の側**を変える向きです。一貫性は、衝突する事例での追従と、衝突しない事例での維持の両方で決まる、という仮説です。これが支持されれば、追従だけで「上がった」とした過去の判定は見直しが要ります。

        mixed のもう一つの形（大筋は当たり、例外が残る）は、1 と、#759 の h_identifier_by_genus_differentia が扱います。

        順番としては、**1 が一番安く、目的に一番近い**と考えます。字面と式が揃えば、名前で読むモデルでも式どおりに読めることになり、検査器の道と領域の道の両方に効くためです。E56 の 1.5B が終わったら 4B を回します。その待ち時間に、1 の事前登録を進めます。

        ロードマップの位置: d_metric と 2 つの道（領域・検査器）に、体系を変える点の仮説を 1 つずつ結びました（#763）。E56 は実行中です。
