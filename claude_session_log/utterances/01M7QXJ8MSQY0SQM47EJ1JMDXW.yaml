      text: |
        A4 の2つは事情が違います。片方はもう答えが手元にあり、もう片方は体系に依存します。

        **A4a: `h_text_shift_raises_stability`（#52）— 記録済みの結果でほぼ答えが出ています**
        - 仮説は「定義文の有無による活性化の差のベクトル（contrast_vector）が、選択肢の順序を入れ替えても判定が変わらない安定性を上げる」です。
        - e14 は、まさにこのベクトルを足して、順序を入れ替えた2回とも正答する率（acc_both）を記録しています。

        | 条件 | 何もしない | vec1 | vec2 | vec4 |
        |---|---|---|---|---|
        | 定義と元の意味が衝突する設問（G2c） | 0.29 | 0.17 | 0.04 | 0.00 |
        | 定義と元の意味が一致する設問（G2k） | 0.50 | 0.08 | 0.00 | — |

        - 安定性は上がるどころか下がっており、仮説には反する向きです。
        - ただし、これは結果を見た後の読みで、事前登録の判定ではありません。
        - そのため、新しく回して確かめる意味はあまりありません。e14 の値を観察として書き、事後の照合だと開示したうえで結ぶのが妥当です。
        - 一貫性への寄与としては「この経路は効かない」と分かったことになり、優先度は下げます。

        **A4b: `h_specific_composes_from_expression`（#55）— 体系に依存します（B に近い）**
        - 仮説は「概念ベクトルの固有成分が、概念式と一致する」です。
        - 比べる相手の概念式は、体系から組み立てて CSCL で書いた定義そのものです。
        - そのため、式が健全でないと一致の度合いは式の性質を写し、B と同じ型の依存になります。
        - さらに、ベクトルと式を比べるには、式をベクトルに写す手順が要ります（例：式から訳した文の活性化）。ここで日本語への訳と読み戻しの仮説（`h_ja_roundtrip` の系列）にも依存します。
        - 兄弟の `h_specific_agrees_with_sense_difference`（固有成分が意味の差のベクトルと一致する）は e17 で反証済みです。先行きも明るくありません。

        **トリアージの直し**
        - A に残すもの：#35（説明への転移）、手で作った組での #91・#56・#92。
        - A4a（#52）は、記録済みの e14 から観察を書いて結ぶ軽い作業に回します。事後の照合だと開示します。
        - A4b（#55）は、B と一緒に体系の健全性（E）の後に回します。
