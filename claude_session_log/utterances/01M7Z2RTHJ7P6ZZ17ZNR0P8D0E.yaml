        2. Key Technical Concepts

        - **Type checker (tc)**
          - `tc.build()` returns T, O, _.
          - `T.syntax_facts()` returns (rel, args) pairs.
          - `tc.Facts(items)`; `tc.evaluate(tc.law_rules(O), F, tc.variables(O))` returns violations as (lid, bindings, f).
          - After evaluate, `F.by` holds derived relations, including above, r_ancestor, r_parent, r_kind_up, and r_placed.
        - **Relation shapes in syntax facts**
          - extends(w, parent); is(w, parent).
          - form(w, verb); position(w, slot).
          - from(verb, type); to(verb, type).
          - domain(w, dom).
        - **ontology.yaml details**
          - `dependent: {display: 依存するもの, form: [v_depend, from]}`.
          - specifically_ and generically_dependent_continuant both have `extends: dependent`.
          - v_depend has from: continuant, to: continuant.
        - **Signature constraints**
          - v_refer: from continuant, to any.
          - v_depend: `to` must be a continuant.
          - A verb such as ontology.v_above cannot be the from of v_refer.
        - **Recording pattern**
