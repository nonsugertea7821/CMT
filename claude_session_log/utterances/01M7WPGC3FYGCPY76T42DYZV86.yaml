      text: |
        おっしゃるとおりです。今回やったことに、幾何と呼べる要素はほとんど入っていません。

        **今回やったことの中身**
        - 位置（from・to・new）を点に、基礎の関係をラベル付きの矢印にした、小さな有向グラフを作りました。
        - 「形が一致する」は、この図がそのまま等しいという意味です。
        - 距離も、「間にある」も、凸も、次元も使っていません。

        なので、これを「幾何」と呼んだのは言い過ぎでした。圏論の言葉のほうが合います。
        - **v_refer:** 矢印が1本だけの図。
        - **v_agree:** from → new ← to と、二つの矢印が一点に集まる図（余スパン）。
        - **一致の測り方:** 「refer の共通の相手」で一致を測っていたのは、この余スパンが立つかどうかを見ていたことになります。
        - **19 語の区別:** 19 語は同じ図を持ち、違いは対象（端）に何の種類が来るかだけです。

        今回の比べ方には、圏論から見て粗いところもあります。位置の名前をそのまま使った文字どおりの一致で、同型（位置を付け替えて同じになるもの）までは見ていません。

        **では、幾何はどこから入るか**

        いまのところ体系の側で幾何らしいものは、same（同じなら 1、違えば 0 の内積のような働き）くらいです。凸や直交は、Qwen の隠れ状態のほうで測っています。役割を分けると、次のように読めます。
        - 体系が与えるのは圏（対象と矢印と、それらの組み合わせ）。
        - 言語モデルの表現は、その圏からベクトル空間への写し（関手）。
        - 凸や直交は、その写した先（像）が持つ性質。

        この読みが正しければ、「refer は無限次元から軸を切り出す」という話は、体系そのものの性質ではありません。矢印を表現空間に写したときに、断面として実現される、という主張に変わります。

        ここから確かめられる問いも出てきます。体系で同じ図を持つ動詞（v_refer の下の 19 語など）は、モデルの表現でも同じ向きの変換として写るのか、です。関手が図の形を保つかどうかを見る問いになります。これも未検証の仮説として登録します。
