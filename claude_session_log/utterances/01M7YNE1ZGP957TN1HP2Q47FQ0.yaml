      text: |
        組 5 の none が 2問当たったのは、意味が分かったからではありません。学習前のモデルが、丁票という語のほうを好んでいたからです。

        組 5 の評価の4問の、条件ごとの余裕（margin）です。正の値は正答側に傾いたこと、◎は選択肢の順を入れ替えた2通りでどちらも正しかったことを表します。

        | 問 | 正答 | none | both | round |
        |---|---|---|---|---|
        | 1 社内の掲示板にだけ回覧 | 丙票 | −0.12 | +0.53 | −0.04 |
        | 2 仕入れ先にもメール | 丁票 | +1.28 ◎ | +0.52 | +0.06 |
        | 3 経理部と営業部の間だけ | 丙票 | +0.16 | +0.86 | −0.01 |
        | 4 外部の取引相手にも | 丁票 | +0.50 ◎ | −0.14 | +0.07 |

        - **none**
          - 当たった2問は、どちらも正答が丁票の問いです。丙票が正答の2問は、一方の順で外しています。
          - ベクトルがゼロのとき、モデルはどの問いでも丁票のほうへ傾きます。この傾きが正答と重なった2問だけが ◎ になりました。
          - 組 1〜8 の none は、どれも同じ形です。正答の語によって余裕の符号が交互に変わります。強い例が組 7 で、松返品の問いは +3.4、竹返品の問いは −1.9 でした。
          - つまり、none の acc_both は語の好みでかさ上げされた見かけの値です。
        - **both**
          - 4問のうち3問で、順の平均の余裕は正です。それでも ◎ は1問もありません。
          - 余裕は順の2通りの平均なので、平均が正でも一方の順では外れます。どの問いでも一方の順で外しているので、語の好みは消えた代わりに、「1」か「2」の番号の好みに置き換わった、と読めます。
          - 1問ずつの、順ごとの余裕は記録していないので、この読みはまだ確かめていません。
        - **round**
          - 余裕は ±0.07 に縮み、どちらにも決めない状態になっています。
          - 組 3 を除く組 1〜7 で同じでした（組 8 の round はまだです）。round の判定で外れの数が「4」ばかりだったのは、このためです。余裕がほぼ 0 なので、教える4問のどれもが、どちらかの順で 0 以下になります。

        まとめると、学習は語の好みを打ち消してはいても、二つの意味の弁別を入れられていません。弁別が入ったと言えるのは、両方の条件で大きく当たった組 3 だけです。

        事前登録した判定の主の指標は acc_both なので、E33 の判定はそのまま行います。語の好みに左右されにくいのは、副の指標の mean_margin のほうです。正答の語の好みによる足し引きが、平均で打ち消し合うからです。記録するときは、none の値が語の好みによるものだと開示します。

        本線 a 往復の教示（h_round_trip_raises_sibling、PR #640）
