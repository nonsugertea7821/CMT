        E58 を 1.5B で測り終え、結果を体系に書いて push しました（#847）。いま CI を待っています。

        **結果（Qwen2.5-1.5B-Instruct、24 概念）**

        | 条件 | 適用 | 言い換え | 説明 | 暗唱 | 四つそろう（joint） | 正答率の積 |
        |---|---|---|---|---|---|---|
        | none（定義なし） | 0.375 | 0.125 | 0.417 | 0.500 | 0.042 | 0.010 |
        | near（定義を直前に置く） | 0.583 | 0.958 | 0.833 | 0.958 | 0.458 | 0.446 |

        - near の joint は、使い方を独立に並べ替えた置換の区間 [0.375, 0.542] の内に入りました。事前登録どおり、h_consistency_beyond_accuracy は**反証**です。
        - ただし 24 概念では、差を見分ける力が低いです。「独立と区別できない」と読みます。

        **含意（解釈です）**
        - **物差しの基準の値が出ました。** 定義を文脈に置くと、目的の量（四つの使い方がそろって新しい定義に従う割合）は 0.04 から 0.46 に上がります。この後の手は、この 0.46 を上げられるかで判定します。
        - **一貫は、使い方ごとの正答率の積でほぼ決まっています。** 同じ概念の中で、使い方どうしが結びついている様子は見えません。なので、一貫を上げるには、いちばん弱い使い方を上げればよいことになります。
        - **弱いのは適用です（0.583）。** 言い換えと暗唱はほぼ天井です。定義を「言える」けれど「当てはめられない」状態です。
          - 次に近い手は、適用の例を見せる h_consistency_by_examples です。既に登録してあり、適用を直接ねらう手なので、この結果で優先が上がります。
          - 学習の道（#840 の、体系に落としたデータで学ばせる手）も、まず適用が上がるかで見ることになります。

        **この後**
        - CI が通ったら、#847 の本文を結果で書き直し、Draft を外します。
        - 4B での E58 は、E57（残り 8 項目）が終わってから走らせます。判定はモデルごとに出すと事前登録したので、4B が支持なら状態は mixed に変わります。
        - その次は h_consistency_by_examples を、同じ物差しで測ります。

        否定の文の扱い:
        - 「同じ概念の中で使い方どうしが結びついている様子は見えない」は、測った結果です。
        - 「区別する力が低い」は、事前登録で書いた開示です。
