        I fixed the ec failure on #868 and pushed it as 991a27d. CI is running on it now.

        The failure was 「basis の仮説 lang.h_identifier_by_genus_differentia が未定義」. ec files the language hypotheses under their names without the `lang.` prefix, but the grounding line in exp.yaml writes the name with the prefix, so ec couldn't find it.

        I changed `exp/src/exp_check.py` to accept a grounding written as `lang.<name>` when `<name>` is a language-side hypothesis. Because this changes the evaluator, the PR needs your review rather than the auto-merge.
