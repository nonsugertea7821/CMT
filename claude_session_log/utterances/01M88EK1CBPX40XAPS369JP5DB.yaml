        #819 の判定は出ませんでした。L8 で t = 0.050 で、支持の境 0.1 にも反証の境 0 にも届いていません。仮説は未検証のまま残し、PR は Draft のままにします。結果の commit は 28a9a58 で、PR の本文に表と読みを書きました。

        **何を測ったか**
        分散の大きい上位 256 次元（上の帯）と残りの次元（下の帯）のそれぞれで、元の語から作った類の重心を使って、元の語と書き替えた語の類を当てました。書き替えで当たる率がどれだけ落ちるかを、帯ごとに比べています。当てずっぽうなら 0.2 です。

        **結果**
        | 帯 | 元の語 | 書き替えた語 | 落ち幅 |
        |---|---|---|---|
        | 上の帯 | 0.825 | 0.250 | 0.575 |
        | 下の帯 | 0.900 | 0.375 | 0.525 |

        - 書き替えると、どちらの帯でも類の当たりが大きく落ちました。書き替えに移らないのは、上の帯だけの性質ではありません。
        - 上の帯のほうが移りにくいという差は L8 でだけ小さく出て、L14 と L20 では逆向きでした。
        - #815 で元の語の帰属だけが下がった理由も、この値から説明がつきます。上の帯は元の語の類をよく運ぶ一方、書き替えた語の類はほとんど運んでいません。だから上の帯を雑音にすると、失うのは元の語だけです。

        **ほかの PR**
        - #815（反証）: 確認とマージを待っています。
        - #817: 前の CI 失敗は、main との衝突で自動マージの段が止まったものです。main を取り込んで push したので、新しい CI を待っています。

        **登録したもの**: 今回はありません。上の読みは測った値から出したもので、確かめていない主張ではないためです。

