        今回の周回では h_factor_depends_value（#246）を確かめ、結果は**反証**でした。PR は #346 で、Draft を外してあります。

        **仮説**
        要因と比べの条件は、「要因が軸の値に依る」という事実を橋として足せば結べる、というものです。

        **結果**
        - 仮説と観察が会わない結びは 37 ありました。そのうち 19 は、仮説の側に要因がなく、橋を置けませんでした。転移や注意の仕組みを述べる仮説で、仮説の変数が要因ではありませんでした。
        - 置けた 18 の結びには、橋の事実が 29 要りました。橋は結びどうしで共有されず、結びの宣言を写すだけになりました。
        - 橋を足すと、tc が 4 件誤りました。一つの軸の値に二つの要因が「依る」と、型の制約に反するためです。

        **含意**
        橋の置き方は、定義をたどる方法（反証済み）と、事実を足す方法（今回）の二つがありました。どちらも「仮説の変数は要因で、条件はその値を一つ動かす」という前提に立っていて、その前提が全体では成り立っていません。

        **新しい仮説（PR #347、登録だけなので auto-merge に乗ります）**
        - `h_hypothesis_depends_factor`: 仮説は要因に依る。転移や仕組みの仮説の変数も、要因として書けるという読みです。
        - `h_value_composes_factors`: 軸の値は要因から成る。一つの条件が複数の要因を動かすことを、「依る」でなく「成る」で書くという読みです。

        #345（概念の分類の対の仮説）は、引き続きあなたの確認待ちです。次の周回は 13:18Z です。
