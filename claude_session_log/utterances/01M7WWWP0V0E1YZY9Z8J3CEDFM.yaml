        **Shape reading of verbs**
        - shape = atoms of holds, pre and post. Each key is found as the nearest definition among self and ancestors.
        - Ends are the from and to values. They are compared by subsumption: sub(a, b) is true when b is None or "any", when a == b, or when is_a(a, b).

        **Original sources (verified via subagents)**
        - Coecke–Pavlović–Vicary, arXiv:0810.0812.
          - Thm 5.1: commutative †-Frobenius algebras correspond to orthogonal bases; adding "special" gives orthonormal bases.
          - In basis terms: δ(e_i)=e_i⊗e_i; unit = Σe_i; m(e_i⊗e_j)=δ_ij e_i.
          - Copyable elements are exactly the basis.
          - Cor 7.2: the category is equivalent to FinSet, so structure fixes the basis only up to relabeling.
        - Frobenius anatomy I, arXiv:1404.5278: relative pronouns are built purely from Frobenius maps, with no corpus data for the pronoun.
        - DisCoCat, arXiv:1003.4394: a meaning is a pair (W, p) of vector space and type (Def 3.1); verbs are 0/1 entries on basis pairs.
        - ICS, arXiv:1703.08314:
          - ConvexRel is compact closed.
          - The adjective "yellow" is a diagonal relation restricted on one domain.
          - Domain-restricting relations are the closest match to the user's "refer cuts axes".

