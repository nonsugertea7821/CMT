        - `tc.build()` returns T, O, D.
        - T.N is a dict of nodes; T.ancestors(x), T.is_a(x, y), T.resolve(w, "signature").
        - tc.LOCALS maps a domain to the short node names declared there, e.g. 'exp': ['accuracy', ...]. Full keys are `f"{d}.{n}"`.
        - tc.USES maps a domain to the domains it uses: signature:[], ontology:[signature], syntax:[ontology], runtime:[syntax], std:[syntax], lang:[exp, runtime, std], exp:[runtime, std], subj:[std].
