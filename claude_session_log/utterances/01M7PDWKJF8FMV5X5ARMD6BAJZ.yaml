        残りの提案を、未検証の仮説 5 つとして登録しました。それぞれに確かめるための残り項目（未着手）を対で置き、claude/cross に push してあります（d804a35）。

        | 仮説 | 式に書いた中身 | 言いたいこと |
        |---|---|---|
        | h_hierarchy_in_object | 深さの限定は基礎の節に依存する | 欠け1。上位の関係を基礎の関係にして動詞を置けば、ノードの式で深さを書ける |
        | h_draw_on_with_shallow | 読みの式は表示語に依存しない | `r_shallow` を使えば、sys_draw_on の読みを named_mod の誤りなしに式で書ける |
        | h_gloss_formula | 最上位の置き場は説明文に依存しない | continuant / occurrent / any の gloss を式にできる |
        | h_negation_formula | 否定の限定は型検査器に依存しない | any の範囲や否定の限定の意味を、検査器のコードから式に移せる |
        | h_comment_ban | 定義は注釈に依存しない | コメントを全面禁止にしても定義は失われない |

        - **中身の語:** 中身を書くために、`depth_limitation`、`reading_formula`、`annotation` の 3 語を足しました。どれも自前の式が 1 つの薄い語で、意味の大半は表示語と commit メッセージに頼っています。
        - **名前を付けた修飾語:** `reading_formula` の限定が既存の語と同じになりました。法則 named_mod の指示どおり、名前を付けた修飾語 `exp.refer_from_hypothesis` を置きました。
