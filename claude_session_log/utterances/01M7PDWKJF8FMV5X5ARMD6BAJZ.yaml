        - **Issue になる時期:** 前回の `h_individual_depth` と合わせて 6 つあり、main に入って同期されると Issue になります。

        **途中の失敗:** 違反の数を見るために sys_draw_on を走らせ、記録済みの結果ファイルを上書きしてしまいました。HEAD の版に戻したので、commit には入っていません。同じ失敗が2回続いたので、確かめに実験スクリプトは使わず、結果ファイルに書かない検査（tc / ec）だけを使うようにします。

        **取り決めを残す場所:** 「提案は仮説にしてから伝える」は、このセッションでは守ります。ただ、この会話の外には残りません。後のセッションでも守らせるなら、リポジトリに `CLAUDE.md` を置いて書いておくのが確実です。置きましょうか？
