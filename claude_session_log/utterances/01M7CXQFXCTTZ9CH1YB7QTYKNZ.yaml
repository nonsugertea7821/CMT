      text: |
        そういうことですか。置き場所を決めようとしたこと自体が的外れでした。同じ語根が、形を変えることで持続体にも生起体にもなる。どちらに置くかは語根ではなく形で決まる、ということですね。

        ## 理解したこと

        - **deliver + ing → delivering**：生起体（届けること）
        - **deliver + er → deliverer**：持続体（届けるもの）
        - **deliver + ee → deliveree**：持続体（届けられるもの）

        逆向きもあります。

        - **definition（持続体）→ defining（生起体）**
        - **dependent（持続体）↔ depending（生起体）↔ dependence（持続体）**

        前回の案A（状態の関係は持続体）と案B（すべて生起体）は、どちらも「依存」の形の1つを指していただけでした。

        ## これで何が1つにまとまるか

        - **関係の両端は、形の変化そのものです。** 「x が y に届ける」は、「届けること」という生起体があり、x がその -er の形、y がその -ee の形に当たる、ということです。グラフの辺（始点と終点）は、-er と -ee でした。
        - **私が「関わり方」の軸に並べた値（する側、される側、入力になる側 など）は、形の変化を列挙したものでした。** 軸の値として表示語だけで持っていたので、法則がないと自分で書いた箇所です。
        - **2×2 の表の「持続体 → 生起体」「生起体 → 持続体」のマスに入るのは、個別の関係ではなく、この形の変化です。** 表の対角でないマスの中身が、ここで初めてはっきりしました。
        - **行為の値、生起体の種類、関係の3重化は、1つの語根の3つの形でした。**

        ## 作り直しの形

        語根ごとに1つの概念を置き、形の変化で持続体と生起体を行き来させます。

        ```
        delivering   = occurrent 側の形（-ing）
        deliverer    = delivering の -er の形   … 持続体
        deliveree    = delivering の -ee の形   … 持続体

        「接続手段は定義をモデルへ届ける」
          = delivering で、deliverer が接続手段、deliveree が定義
        ```

        形の変化として、まず次の4つを置くつもりです。

        | 形 | 向き | 意味 |
        |---|---|---|
        | -ing | 持続体 → 生起体 | それが行われること、起こること |
        | -er | 生起体 → 持続体 | それを行うもの |
        | -ee | 生起体 → 持続体 | それを受けるもの |
        | -tion / -ence | 生起体 → 持続体 | その結果や状態として在るもの |

        ## 確認したい点

        形の変化はこの4つで足りますか。たとえば「道具」（-er とは別の、それを使って行うもの）や「場所」（そこで行われるところ）は、4つの形に修飾を加えて書くのか、独立した形として持つのか、判断がつきません。私は前者（4つを基本にして修飾で書く）と考えています。

        この理解でよければ、作り直しに入ります。
