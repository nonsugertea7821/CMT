      text: |
        まず #313 の結果です。`h_family_refers_laws` は支持になりました（測り方の訂正の後）。族から法則を参照することは、いまの体系で書けて、ほかの事実も変えません。

        ただし、体系にない法則を参照した変種も、検査を通ってしまいました。領域の付いた名前（`syntax.…`）は、存在を確かめずに通るように見えます。どの経路で通ったかは、まだ確かめていません。#296 型の欠けを検知するには、参照先が宣言されていることを検査させる段が、別に要ります。PR は Draft を外しました。訂正があるので、手で見てください。

        **E22 と E23 について**

        E23 はまだ決着していません。判定が決まらず、Draft #282 のまま残っています。支持が出たのは E22（限定の差分ベクトルが、見ていない上位概念に転移する）です。方向性を後押しする結果ですが、それが追従そのものを上げるかどうかは、E23〜E25 が決まらない限り言えません。

        **display の廃止と、式の識別子化について**

        正直に言うと、進んでいません。この方向の仮説は、反証が続いています。

        - **表示語が式にない意味を持っている**
          - `sys_display_residual`: 表示語 526 件のうち、約 77% が式から導けない「残り」でした。
          - `h_case_frame_formula`: 格の枠組みを当てる精度は、式からだと 0.39、表示語の形からだと 0.63 でした。
          - `h_gloss_formula`: 語釈を式に移せたのは 6 件中 2 件だけで、4 件が残りました。
        - **型検査器が名前で読んでいる**
          - `h_renaming_invariant`: 識別子を一対一に付け替えると、検査の結果が変わりました。
            - 原因は、型検査器が `syntax.v_collect` などの名前を文字列で読んでいることでした。
            - そうした名前は 7 つあり、そのうち `v_collect` と `v_agree` は、これまでの数えから漏れていました。
          - `h_checker_words_in_grammar`: それらの語を文法の節に移すことはできました。ただ、節の名にあたるノードに式が要り、試した式では体系のほかの部分が変わりました。
        - **今日の結果**: 領域を書いた名前は、存在を確かめずに通るように見えます（未確認）。識別子が体系の中で検査されていない部分が、まだあるということです。

        **残っている作業**

        - 本丸は、未検証の `h_identifier_by_expansion` です。識別子を、シグネチャの分類から展開して作れるか、という仮説で、まだ手をつけていません。
        - 表示語の数は、いまも体系全体で 1000 件を超えています。

        **見立て**

        display を廃止するには、二つの壁を両方越える必要があります。
        - いま表示語が担っている意味（7 割強）を、式に移すこと
        - 検査器から、名前に頼る読み方をなくすこと

        一つ目の壁は、さきほどの日本語への翻訳の話と表裏の関係にあります。display をなくせば、日本語は式から生成するしかありません。そのため、「式から生成した日本語が、今の表示語と同じ働きをするか」は、廃止の判定基準そのものになります。翻訳の仮説を立てるなら、display 廃止の系列の一部として位置づけるのが自然だと思います。

        次の周回では、`h_identifier_by_expansion` に進むつもりです。
