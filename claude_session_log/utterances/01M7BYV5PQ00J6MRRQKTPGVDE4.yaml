        未検証ですが、今の仕組みのままでは識別子の選定には届かない、というのが私の見立てです。あなたの懸念ももっともだと思います。

        ## 今のベクトルが扱っているのは「読む側」だけ

        実験したのは、入力に現れた語を定義どおりに解釈させること（語 → 概念）です。識別子の選定は逆向きで、概念に対してどの語を出力するか（概念 → 語）です。

        - ベクトルは入力中の語の位置に加えています。生成中の語には加えていません。
        - 出力側に近い実験は「置換された用語」（会員 → 利用者）ですが、これは文章でしか測っておらず、ベクトルでは試していません。

        「どの識別子を出すか」をベクトルで制御できるかは、まだ何も分かっていません。

        ## 懸念について

        混ざって揺れる可能性は高いと考えます。根拠は3つあります。

        - **表層の形が変わる。** ベクトルは日本語の「社員」という文字列の位置で学習しました。コード中では `Employee`、`emp`、`staff_member` など、形もトークンの切れ方も違います。同じベクトルが通用する保証はありません。
        - **識別子の表現には別の情報が重なっている。** コード中の識別子の位置には、型、スコープ、変数かクラスかといったプログラミング言語上の役割が載っています。そこに自然言語の意味を動かすベクトルを足すと、そちらを乱すおそれがあります。
        - **今回の実験にも兆候がある。** ベクトルを入れると、無関係な設問の確信がわずかに下がり、生成では理由の文が崩れました。境界以外も動かしているということです。

        加えて、今回は28層中の第8層という浅めの層に入れています。言語に依存しない概念表現はもっと中央の層にあるとされるので、日本語で学習したベクトルが英語の識別子に効くかは、層の選び方にも左右されます。

        ## 識別子の選定は記号側に置く方が筋がよい

        識別子は離散的な記号です。「現行の概念に解決できるか」「廃止された語を使っていないか」は、文字列の照合で厳密に判定できます。

        - **識別子の選定と検査**は、用語サーバーと語彙リントが担う。あなたの言い換え側の構成がこれに当たり、API 型でも公開モデルでも同じように使えます。
        - **ベクトル**は、厳密に判定できない部分、つまり「この事例はその概念に当たるか」という解釈の揃えに使う。

        ベクトルで識別子まで制御しようとするより、この分担の方が堅いと考えます。当初の設計でいう出力側の接続（概念の確定と検証）が、識別子ではそのまま主役になる形です。

        ## 確かめるなら

        次の2点を測る実験が組めます。

        1. 概念体系（置換と分化を含む）を与えてクラス名や関数名を書かせ、文章で渡した場合とベクトルの場合で、現行の語を使う率を比べる。
        2. コード中の識別子の位置にベクトルを加えたとき、生成されるコードが壊れないか（構文として通るか）を見る。

        あなたの実運用に直結する項目なので、E4 の次に入れる価値があると思います。入れてよければ、E4 の結果が出たあとに着手します。
