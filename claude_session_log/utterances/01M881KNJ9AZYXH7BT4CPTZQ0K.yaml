      text: |
        #776（反証）は CI がまだ走っているので、通ったら Draft を外します。

        まず、両方の問いに答えるうえでの土台です。ロードマップ（exp.yaml の d_ の決定）には、再定義の形がすでに仮置きで書かれています。今日までの事実は、その形を変えるより、どの部分に重みを置くかを決めるほうに効いていると考えます。

        ## 再定義をどう実現するか

        **事実（ここまでで確かめたこと）**
        - 元の意味と衝突すると、追従が下がります（h_collision_lowers_following、支持）。
        - 隠れ状態の類の寄り（約 0.08）は、学習した意味から来ています。作り語ではほぼ 0 でした（#776）。
        - 文脈で状態を動かす試みは、ほぼ届きませんでした。
          - 類の語を前に置く試み（#771）。
          - 教示（E56）。4B が読めたのは例を付けたときだけで、それも答えを写しただけの見込みがあります（#772 で登録済み）。
        - 例外として、前に置く文章は中点の帰属を変えます（h_midpoint_depends_pretext、支持）。
        - ベクトルは、追従と制御を上げます。用法をまたいだ一貫性は上げていません。

        **解釈（あなたの結論 2 と同じ向きです）**
        再定義を、モデルの中に「新しい意味の場所」を作ることとして実現するのは、筋がよくないと考えます。学習した意味の引力が強く、文脈だけでは離れられないからです。

        既存の決定に沿うと、再定義は次の分担になります。

        | 役割 | 担うもの | 決定 |
        |---|---|---|
        | 定義そのもの | モデルの外。CSCL に置く | d_source_of_truth_in_cscl |
        | 置く位置 | 用語集の先頭 | d_redefinition_at_head |
        | 判定（どちらの意味か） | 概念ベクトル（機構） | d_verdict_by_vector |
        | 用法の説明 | 文字で渡す | d_explanation_by_text |
        | 変更の定着 | 教えたベクトル（実質、再学習の側） | d_consolidation_in_vector |
        | 出力の正しさ | 型検査器が外から確かめる | d_road_checker |

        検査器について、E55・E56 から言えるのは「モデルは検査器の出力を読んで直すのが苦手」までです。そこで私の読みは、検査器はモデルへの入力としてより、外の判定役として効く、というものです。これはまだ解釈です。

        残る弱点は、ベクトルが一貫性を上げていないことです。これが、あなたの言う「相応の機構」がまだ足りていない場所です。#777（h_departure_relies_on_mechanism）は、文脈だけで足りるのかを、同じ衝突項目でベクトルと並べて確かめる登録です。

        ## CSCL の役割

        モデルが汚染された大規模な記憶なら、CSCL はその反対側の、汚染されていない小さな正本です。

        - **閉じた世界**（d_cscl_closed_world）
          - 書いてないことは真でない、という世界です。学習の事前分布を持ち込まない唯一の場所です。
        - **派生の元**（d_cscl_display_derived、d_rendered_text_is_derived）
          - 表示語も、モデルに渡す文章も、式から作ります。
          - 字面が状態を引きずる以上、字面を人が自由に選ばず、式から決めることに意味があります。
        - **選ぶ・確かめる**
          - 関係する定義を選んで渡します（d_term_server_selects）。
          - 出力を型で検査します（d_road_checker）。
        - **ベクトルの宛先**
          - どの概念へ寄せるかを指定するのは、CSCL の式です。

        つまり CSCL は、モデルに概念を「覚えさせる」ためのものではありません。モデルの外で概念を固定し、モデルの出力をそれに照らすための基準です。これが今の事実に合う読みです。

        ## 方向の問い（あなたが決めること）

        d_road_region（モデル内部の状態に概念の場所を特定する道）は、場所を固定しようとした試みがすべて反証になりました。残っている足場は、中点の帰属だけです。

        この道を検査器とベクトルの補助に下げるか、主な道として続けるかは方向の判断なので、あなたに委ねます。

        ロードマップの位置: d_metric → d_road_region（仮置き。#776 は CI 待ち、#777 は登録中）/ d_road_checker（#765 は確認待ち）
