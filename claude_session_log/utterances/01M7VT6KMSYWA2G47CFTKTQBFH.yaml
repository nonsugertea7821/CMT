        h_part_display_own_phrase は支持でした。法則 part_display_explicit が表示名のうち自分の句だけを読めば、式から訳した表示語はすべて通ります。結果を #454 に書いて Draft を外しました。事前登録の後に訂正はないので、自動マージに乗るはずです。

        - **自分の句の決め方:** 表示名が上位の表示語で終わるとき、その末尾を除いた部分です。
        - **今の体系への影響:** この読み方に変えても、今の体系で出る誤りは一つも増えず、一つも減りませんでした。
        - **合成の 8 つの版:** すべて期待どおりでした。
          - 咎めるべき 5 つの版（曖昧な言い方、部分の向きに逆、全体の向きに逆、時間的な部分で逆、上位の表示語で終わる逆向き）は、どれも咎めました。
          - 咎めないはずの 3 つの版は、咎めませんでした。否定の限定、向きの合う言い方、逆向きの言い方が上位の表示語の中にしかない版です。
        - **式から訳した表示語:** #450 と同じ 99 個に置き換えて走らせました。part_display_explicit の誤りも、ほかの検査の新しい誤りも 0 です。
        - **含意:** #450 の反証の原因は、表示名を平らな文字列の全体として読む法則の側にありました。表示語は、自分の限定から訳した句と、上位の表示語を組み合わせてできています。法則が読む単位をこれに合わせれば、表示語を式から導く道が開けます。
        - **まだ手当てしていないところ:** 一つのノードに部分の限定と全体の限定が両方あると、平らな文字列では句を分けられません。これは対の仮説 h_display_as_part_tree（表示語を式の部分の木として持つ）が扱います。新しい仮説は足していません。
        - **待っているもの:** #439・#443・#450 は、手で見てもらうマージを待っています。

