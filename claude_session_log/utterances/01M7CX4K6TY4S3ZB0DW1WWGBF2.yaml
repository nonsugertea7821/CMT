      text: |
        なるほど、from_to（向きを持つ結び付きそのもの）が底にあるなら、筋が通ります。私が各関係に付けていた「始点の種類」と「終点の種類」は、まさに from と to でした。原子は個々の関係ではなく、この有向の結び付き1つになります。

        ## from_to を原子にした場合の形

        2×2 の表は、from_to の両端にどの基本要素が来るか、の4通りです。

        | from ＼ to | 持続体 | 生起体 |
        |---|---|---|
        | **持続体** | from_to(持続体, 持続体) | from_to(持続体, 生起体) |
        | **生起体** | from_to(生起体, 持続体) | from_to(生起体, 生起体) |

        個々の関係は、このどれかに述語論理の条件を加えたものとして定義します。

        ```
        depends_on(x, y)      iff  from_to(x, y) and (exists(x) implies exists(y))          # 持続体 → 持続体
        participates_in(x, p) iff  from_to(x, p)                                            # 持続体 → 生起体
        precedes(p, q)        iff  from_to(p, q) and not from_to(q, p) and 推移的            # 生起体 → 生起体
        ```

        これは最初にいただいた説明「関係はそれ自体を記述する述語論理として定義され、グラフによって接続される」と一致します。グラフの辺が from_to で、関係の意味は辺に課す論理的な条件です。

        ## part_of を残さない場合

        途中まで書かれた問いにも答えます。part_of は原子でなくなりますが、関係としては失われません。対角のマス（同じ種類どうし）の from_to に、条件を加えて定義します。

        ```
        part_of(x, y)  iff  from_to(x, y) and 推移的 and 反対称的 and (y に結ばれるものは x にも及ぶ…ではなく、x に宿るものは y の中にある)
        ```

        同じマスにある他の関係とは、条件の違いだけで区別されます。

        | マス | 関係 | 区別する条件 |
        |---|---|---|
        | 持続体 → 持続体 | depends_on | from の存在が to の存在を要する |
        | 持続体 → 持続体 | part_of | 推移的で反対称的な包含 |
        | 生起体 → 生起体 | precedes | 推移的で非対称な順序 |
        | 生起体 → 生起体 | part_of | 推移的で反対称的な包含（時間的な部分） |

        part_of という関係そのものを体系から外した場合は、「モデルの層」「用語集の先頭」のような構成を depends_on で書くしかなくなり、「部品である」と「性質として宿る」の区別が消えます。原子にはしないが、定義された関係としては持つ、が妥当だと考えます。

        ## この形での関係のツリー

        ```
        関係
        └ from_to                                  … 唯一の原子
           ├ 持続体 → 持続体
           │   ├ depends_on（依存する）
           │   │   ├ 特定の相手に依存する（宿る）
           │   │   └ 相手を替えてもよい
           │   └ part_of（部分である）
           ├ 持続体 → 生起体
           │   └ participates_in（関与する）
           │       └ 依存する持続体が関与する（実現される）
           ├ 生起体 → 持続体
           │   └ 上の逆向き
           └ 生起体 → 生起体
               ├ precedes（前にある）
               └ part_of（時間的な部分である）
        ```

        それより下の関係（届ける、置き換える、単位を持つ、など）は、前々回の案のとおり、生起体や質の種類を使って定義します。

        ## 確認したい点

        1点だけあります。区別のための条件（推移的、反対称的、存在を要する、など）は、述語論理の式としてその場で書くつもりです。これらの性質を、関係を分類する軸と値として持つべきでしょうか。たとえば「推移性：あり／なし」という軸です。最初の説明の「分類は関係を利用して記述される」は逆向き（関係から分類を作る）なので、関係の性質は式で書くのが正しいと理解していますが、違っていれば教えてください。

        この形でよければ、作り直しに着手します。
