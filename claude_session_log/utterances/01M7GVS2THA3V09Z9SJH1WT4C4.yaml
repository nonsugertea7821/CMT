        ## 識別子を無意味にした概念式（E10 の変種）

        subj の種類・動詞・個体の名前を X01、X02… に置き換え、次のものだけを残します。

        - core の識別子（`independent_continuant`、`v_compose` など）
        - 式の構造のキー（`extends`、`mod`、`of`、`neg`、`at` など）
        - 表示名は、語そのもの（顧客）と、設問に出てくる個体（日曜など）だけ

        「識別はできるが意味を持たない名前」で、意味は core と構造だけが運ぶ、という整理の形です。「顧客」はこうなります。

        ```
        X01: {extends: occurrent, from: X02, to: X02, holds: [...]}
        X02: {extends: independent_continuant, mod: {of: [v_perform, from]}}
        ...
        X08: {display: 顧客, extends: X07, mod: {of: [X01, to]}}
        ```

        **作っている途中で、これまでの渡し方の不具合が見つかりました。**
        - 限定が参照する個体の行（`sunday: {is: weekday, display: 日曜}` など）が、出力から落ちていました。原因は、限定が並びで書かれている場合を読み飛ばしていたことです。
        - E10・E11・E3-expr では、モデルは「sunday が日曜」という対応を見ていません。英語の識別子から推し量るしかありませんでした。
        - 無意味化すると X05 が何なのか分からなくなるため、個体の行を出すように直しました。
        - 既定の動作は変えていないので、これまでの結果の文字列はそのまま再現できます。これは実際に確かめました。

        **比べる条件**
        - none
        - expr_masked_i：日本語の表示名を外した版に、個体の行を足したもの
        - expr_opaque：それをさらに無意味化したもの

        expr_masked_i と expr_opaque の差が、無意味化そのものの効果になります。

        ## (c) E14：定義の有無による活性化の差をベクトルにする（学習なし）

        学習用の適用例は境界の両側にありますが、モデルの既定の意味と並べた対にはなっていませんでした。そこで docs/design.md の案2の形で作ります。

        - 同じ適用例を「定義あり」と「定義なし」で読ませます。
        - 設問の中の語の位置で、第8層の出力の差を取り、例について平均します。
        - これを「既定の意味から再定義した意味へずらす向き」と見なします。
        - 評価の条件は none、near、vec×1／×2／×4（足す強さを変える）、near+vec×1 です。
        - 前向き計算だけなので、数分で終わる見込みです。

