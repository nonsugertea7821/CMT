      text: "#384 のコンフリクトを解きました。原因は、先にマージされた #383 で h_fact_slot_by_end が「支持」に変わり、同じ箇所を #384 も書き換えていたことです。main 側の状態を残し、#384 で足した二行を加えました。型検査と ec はどちらも通っています。#385 がもう入っているので、この push で #384 は自動マージの判定にもう一度かかるはずです。\n\nこの周回では、仮説 h_decision_link_by_role を確かめ、**支持**でした（PR #387、Draft は外してあります）。\n- **やったこと**: 決定どうしのつながり用に、「前提となる決定」という役割と、それを終点に持つ動詞「前提にする」を、体系の写しに足しました。形は、仮説の根拠（basis）と根拠にする（v_ground）を写したものです。\n- **結果**: 一つの決定から次の組み合わせで二つ出しても、すべて通りました。\n  - 「前提にする」を二つ\n  - 「前提にする」と「上げる」（v_raise）\n  - 「前提にする」と「根拠にする」（v_ground）\n  \n  比べるために置いた、v_depend を二つ出す見本だけが、これまでどおり落ちました。\n- **訂正があります**: 一回目は、何も足さない基準の見本まで落ち、判定どおり外れでした。体系の法則 named_mod（同じ限定を足す概念が二つ以上あれば、その限定に名前を付ける）に掛かったためです。足した役割の限定が、仮説の根拠の限定と同じでした。限定に名前を付けて両方から使う形に直し、走らせ直しました。訂正があるので、#387 は手で見てください。\n- **含意**:\n  - 決定の前提と仮説の根拠は、同じ限定（決定が依存する先）を分け合い、上位が決定か仮説かだけで分かれます。\n  - 判定には使っていない見本ですが、この形なら、exp の決定から lang の決定へも、領域をまたいで前提にできました。\n\nロードマップでは、一つの決定から関係を二つ出せない制限の、体系の側の直し方が確かめられたところです。#387 がマージされたら、この役割と動詞を本物の体系に足し、#379 で書けなかった決定どうしの関係を書きます。概念を足す変更なので、PR で見てもらいます。\n"
