        E27（#289）は inconclusive で、Draft のままにしています。結果を PR の本文に書き、そこから出た仮説を #290 で登録しました。

        **E27（#8 の確かめ、Qwen2.5-1.5B の規則型 18 項目）**
        - 数の照合だけを問う bare 条件（例「22は25未満か。」）は、正答率 0.67 でした。ただし順序を入れ替えても正しい割合は 0.056 で、ほぼ「はい」と答えているだけでした。この設問の形では、照合の力そのものは測れていません。
        - 概念の語を意味のない語「ラモク」に置き換えても、元の意味と衝突する組（G2c）の正答率は上がりませんでした（元の語 0.33、置き換え 0.22）。規則型の失敗は、元の意味との衝突から来ているのではなく、規則を当てはめるところか数の比較でつまずいている、と読んでいます。

        **登録（#290、登録だけなので自動マージに乗る想定です）**
        - 新しい仮説 `h_collision_not_lower_rule_following`：1.5B の規則型では、元の意味との衝突は再定義への追従を下げない。
        - #8 に残り項目 `b_number_comparison_unbiased` を足しました。数値そのものを選択肢にするなど、「はい」に偏らない設問で照合を測り直すためのものです。

        次はトリアージの残りの #18 です。重い 4B モデルでの実験なので、その後に E（体系の健全性）へ進みます。

        前に聞いた質問は、まだ答えをもらっていません。ステップ数・初期化・層の帯の概念を足すかどうかです。足せば、E25 と E26 から出た含意も仮説として登録できます。
