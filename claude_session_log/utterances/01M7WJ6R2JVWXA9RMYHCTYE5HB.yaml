        #488 で残っていた食い違いを解く2つの向き、#490 と #491 を確かめました。どちらも体系の実ファイルには手を入れず、写しの上で変えて測っています。

        - **h_law_check_by_always（#500）: 支持。** 実行時の「法則を確かめる時点」(law_check) の中身を laws から always（どのステップでも成り立つ状態）に替えました。
          - これで、法則が求める文 (required) と共通の相手 always を持つようになりました。
          - 規則の名詞と実行時点の対応する3組がすべて一致し、対応しない組の一致は 0 のままです。
          - エラーは 0 で、法則の検査結果も基準と同じでした。
          - 読み取れるのは、law_check が laws を指していても検査の振る舞いには効いていなかった、ということです。
        - **h_required_by_laws（#501）: 反証。** 逆向きに、required の中身に laws を足しました。
          - 一致の形はでき、対応する3組とも一致しました。
          - ただしエラーが 3 件出ました。「1つのノードが足せる限定は1つだけ」という法則に反するためです。
          - この向きは、その法則を変えない限り取れません。

        #501 には測り方の都合で、#500 と同じ中身のスクリプトを実行前に足しました。中身が同一なので、どちらを先にマージしても衝突しません。

