        - [ACE 6.7 Interpretation Rules](https://attempto.ifi.uzh.ch/site/docs/ace_interpretationrules.html)
        - [Edinburgh demo（OWL と ACE の往復）](https://homepages.inf.ed.ac.uk/lperez/content/activities/demos-kcap11.pdf)
