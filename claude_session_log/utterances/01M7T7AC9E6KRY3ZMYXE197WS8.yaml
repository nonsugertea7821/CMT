      text: |
        その考えを仮説として登録しました（PR #373、登録だけなので自動でマージされます）。訂正のとおり、結びつけられるのは「概念」ではなく「用語」として書いています。

        ## 私の読み
        用語は、地図の上の一点ではなく、どこかの「範囲」を指している、という見方だと受け取りました。

        - 例えば「重い」は、ある場面では「物の重さ」の範囲に、別の場面では「気分の重さ」の範囲に結びつきます。
        - どちらの範囲を選ぶかが場面ごとに揺れると、外からは「曖昧」に見えます。
        - 範囲そのものがぼやけているのではなく、範囲の選び方が揃っていない。ここがこの考えの要だと思います。

        ## これまでの結果と合うところ
        - **範囲になっているかの実験**: 幾何の実験では、「動物」のような上位概念の語の集まりはひとかたまりの範囲になりました。「赤いもの」のように上位をまたぐ性質の集まりは、範囲になりませんでした。モデルと言語を変えても同じで、その言語の文章を読んだことが要りました。モデルの中に「範囲」と呼べるものはある、という裏付けにはなります。
        - **使い方をまたぐ実験**: 暗唱で覚えたベクトルが適用に効かないという結果は、すでに支持されています。これは、使い方ごとに別の範囲を選んでいる、とも読めます。

        ## #265 とのつながり
        - 体系の式は、範囲を描くもう一つの地図です。上位で大きく囲み、限定で絞る、という形です。
        - ところが今の検査器は、いくつかの用語を名前だけで区別していて、範囲を描けていません（approve と pay など）。
        - この検査器で「モデルが式を書けない」（E29・E30 の反証）と判定しても、原因がどちらかは分かりません。モデルが違う範囲を選んだのか、地図の側に範囲がなかったのか、です。
        - 識別子化とは、どの用語にも式で範囲を与えることだ、と言い換えられます。そうすると、幾何の実験はわき道ではなく、本線の一部です。

        ## まだ言えないこと
        - 登録した式は代わりの指標です。中身は「集まりがひとかたまりになるかで、使い方をまたいだ揃い方が決まる」です。
        - 同じ用語が使い方ごとにどの範囲を選ぶかは、まだ測っていません。
        - 次に測るなら、同じ語を暗唱・適用・説明の文脈で通します。そして、どの上位概念の範囲に入るかが揃うかを見て、それが使い方をまたぐ転移の成否と対応するかを調べます。これは事前登録から別の PR で進めます。
