      text: |
        二つの実験を、モデルの頭の中にある「語の地図」のたとえで言い直します。

        ## 前提: モデルの頭の中の地図
        モデルは、語を一枚の地図の上に置いていると考えてください。意味の近い語ほど、近くに置かれます。

        **「間」の試し**（二つの実験で共通して使った方法です）
        1. ある集まりから語を二つ選び、地図の上でその**ちょうど真ん中の地点**を見ます。
        2. その地点のいちばん近くにある語が、同じ集まりの仲間かどうかを確かめます。
        3. 仲間なら、その集まりは地図の上で一かたまりになっている、と判断します。

        ## 実験1: 「動物」と「赤いもの」
        - **動物**（犬、猫、馬、象…）: 犬と猫の真ん中を見ると、近くにはやはり動物がいました。どの二つを選んでもほぼそうなりました（10 回中 8 回）。動物は、地図の上で一かたまりです。
        - **赤いもの**（いちご、ポスト、消防車、金魚…）: いちごと消防車の真ん中を見ると、近くには関係のない語がありました。仲間に当たったのは 10 回中 2 回ほどです。
          - いちごは果物の近く、消防車は乗り物の近く、金魚は動物の近くに置かれています。「赤い」という共通点では集まっていません。

        **結論**: 「動物」のような上の概念で集めるとかたまりになり、「赤い」のような性質でまたいで集めると散らばります。あなたの直観どおりでした。

        ## 実験2: 重さで切る
        動物を軽い順に並べます。

        ネズミ・スズメ・リス・ウサギ・ネコ … ヒツジ・シカ … ウシ・キリン・ゾウ・クジラ

        ここで二通りに切りました。
        - **上半分**（ブタからクジラまでの重い 10 匹）: 真ん中の試しで、仲間に当たる率は高めでした（7 割）。
        - **両端**（ネズミ・スズメなどのごく軽いものと、ゾウ・クジラなどのごく重いもの）: 低くなりました（2 割弱）。ネズミとクジラの真ん中には、中くらいのイヌやヒツジがいるからです。

        ここまでは予想どおりです。

        **外れたのは、その理由のほうです。** 私の仮説は「モデルが体重を目盛りとして正確に読めるから、上半分がまとまる」でした。ところが調べると、モデルは体重を目盛りとしてはほとんど読めていませんでした。それでも、上半分はまとまっていました。

        これは、本棚にたとえると分かりやすいと思います。
        - 図書館の本は、ジャンルごとの棚に並んでいます。ページ数の順には並んでいません。
        - それでも「分厚い本」を集めると、辞典の棚にかなり固まります。辞典がもともと分厚いからです。
        - つまり、分厚い本が固まって見えるのは、図書館がページ数を測っているからではありません。もともと「辞典」という棚があるからです。

        動物でも同じことが起きていると見ています。重い側は「ウシ・ウマ・キリン・ゾウ」のような**大型の獣**で、モデルの地図の上にもともとそういうかたまりがあったのだろう、ということです。

        「数」だけは例外でした。どう切っても、真ん中の近くには数詞がありました。数詞は地図の上で一つの棚にまとまっていて、ほかに行き場がないからです。

        ## そこから出した次の二つの問い
        二つの説明が残っています。どちらが効いているかを分けて確かめます。
        - **切り方の形が効くのか**: ひと続きに切るとまとまり、両端のように分けて切ると崩れる。
        - **もともとの棚が効くのか**: まとまるかどうかは、仲間がもともと同じ棚（同じ上の概念）にいるかで決まる。

        分けるために考えている実験は二つです。
        - 動物だけのように、棚が一つしかない中で切り方だけを変える。
        - 切り方は同じまま、棚が混ざる場合と混ざらない場合を比べる。
