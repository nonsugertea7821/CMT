      text: |
        欠けているのは、主に3つです。状態を置く場所、規則を動かす取り決め、上限のない繰り返しです。逆に、材料はかなり揃っています。

        ## いまの言語が持っているもの

        | 計算に必要な要素 | いまの言語での対応 |
        |---|---|
        | 条件の判定 | 動的な動詞の「前」の条件。否定も書ける（在らない、依存しない） |
        | 状態の書き換え | 動的な動詞の「前」と「後」の差 |
        | 新しいものを生む | 第三のもの（new）が「在るようになる」 |
        | 消す | 「在らなくなる」 |
        | 順序 | 生起体どうしの「後に起こる」 |
        | 手順の入れ子 | 生起体の「時間的な部分になる」 |

        動的な動詞は、状態の関係を書き換える規則です。この形の規則（グラフの書き換え）は、繰り返し当てられるなら、一般に計算として万能です。

        ## 欠けているもの

        ### 1. 個体を置く層がない（状態）

        これが最も根本的です。いまの言語が書いているのは種類だけです。「依存する」という動詞は、依存という関係がどういうものかを述べていますが、「この利用者が、この口座に依存している」という個別の事実を置く場所がありません。

        規則が書き換える相手である「いまの状態」が、言語の中に存在しません。記憶がないというのは、正確にはこのことです。

        ### 2. 規則を動かす取り決めがない（実行の意味論）

        動詞は「前がこうなら、後はこうなる」と述べていますが、次のことは何も決まっていません。

        - 前の条件が成り立つとき、その動詞は必ず起こるのか、起こりうるだけなのか。
        - 複数の動詞が同時に当てはまるとき、どれが起こるのか。
        - 誰が起こすのか。

        検査が確かめているのは型と重複だけで、動詞を実行する処理はどこにもありません。

        ### 3. 上限のない繰り返しがない

        生起体に部分と順序を持たせれば、有限の長さの手順は書けます。しかし「条件が成り立つ間、繰り返す」は書けません。

        書き方としては2通りが考えられます。

        - 過程が、自分自身を部分として持つ（再帰）。上位・下位の循環は検査で禁じていますが、修飾の中での相互参照は許しているので、形の上では書けます。ただし、その意味を決めていません。
        - 当てはまる規則がなくなるまで、規則を当て続ける。これは 2 の取り決めの一部です。

        ### 4. 数を作る演算がない

        値として数と範囲の判定式は置けますが、「1を足す」のように、数から新しい数を作る手段がありません。個数を構造で表す（部分を1つ増やす）ことで代用はできますが、直接の演算はありません。理論上の万能性には影響しませんが、実用上は欠落です。

        ## NAND の議論について

        mod が AND、neg が NOT、結線が識別子、という対応は正しいと思います。ただしそれが示すのは、帰還のない論理回路としての完全性です。入力から出力を1回計算する回路は、どれだけ複雑でも有限の関数です。万能になるには、出力を次の入力に戻す経路と、それを保持する素子が要ります。あなたが「メモリと無界ループがない」と気づいたのは、この点でした。

        ## 版管理は、その2つを与えるか

        半分は与える、と考えます。

        - **与えるもの**: 版の連なりは、状態の履歴です。体系は情報という持続体で、それを変える動詞（採用する、取り下げる、置き換える）はすでに体系の中にあります。前回、体系が自分の記録を記述できるようにしたので、体系は自分自身を書き換えの対象にできます。体系そのものが記憶になり、版が時間になります。
        - **与えないもの**: 次の版を誰が決めるか、です。体系の中の規則が次の版を決めるなら、自分を書き換える規則の系になり、万能になりえます。LLM や人間が決めるなら、万能性は体系ではなく、決める側にあります。

        最初の構成には「LLM は状態を持たない解釈器で、記憶は外部の概念体系が担う」とありました。この分担をそのまま読むと、LLM が制御、体系が記憶、版が時間で、全体として1つの機械になります。この機械が万能であることは、ほぼ自明です。一方、あなたが言う「意味論的バイトコード」は、LLM なしで体系制御言語だけが実行の意味を持つことを求めています。こちらには、上の 1〜3 が必要です。

        ## 議論したい点

        万能性を、どこに持たせたいかで、設計が分かれます。

        1. **記述される対象の側**: 体系制御言語で書いたソフトウェアの振る舞いが、万能である。個体の層と、実行の意味論を足す方向です。
        2. **言語の定義の側**: 概念の定義そのものが、計算として万能である。こちらは避けるべきだと考えます。定義が万能だと、「この式は、あの式の下位か」「この2つは同じ式か」が一般には判定できなくなり、検査が止まらなくなります。

        静的な定義（修飾、分類）は判定できる範囲にとどめ、万能性は動的な動詞の側だけに持たせる、という分け方が筋だと考えます。この分け方で合っているか、それとも定義の側にも計算を持たせたい理由があるか、が次の論点です。
