      text: |
        **1. 内積で意味が定義されている場合**

        概念を1本の向き u とし、隠れ状態 h の「その概念らしさ」を内積 ⟨h, u⟩ で測る、という見方です。Park 2024 の線形表現の仮説がこれにあたります。

        - **成分の幾何**
          - ベクトル v は 1536 次元の空間の1点（原点からの矢印）です。第 i 成分は、i 番目の座標軸 e_i への射影 ⟨v, e_i⟩、つまりその軸に落とした影の長さです。
          - 内積が ⟨x, y⟩_M = xᵀMy の形（因果の内積）なら、M = I になるように空間を引き伸ばしたとき（白色化）に初めて、影の長さが比べられるようになります。
          - それでも、白色化した空間をどう回転させても内積は同じです。そのため、座標軸の取り方には特別なものがありません。名前が付くのは、概念の向き u そのものだけです。
          - この見方では、成分は意味に対応しません。対応するのは、u という一次の関数（h ↦ ⟨h, u⟩）です。
        - **この見方でも、すでに領域が出てくる**
          - 「丙票である」を ⟨h, u⟩ > t で判定するなら、丙票は超平面で切った半空間です。
          - 丙と丁の弁別は、「票」の領域を一枚の超平面で二つに切ることになります。
          - つまり、内積で定義するとは、凸で無限に広がる領域で概念を表すことと同じです。

        **2. これまでの観察**

        断定はしません。どちらとも読める結果があります。
        - 線形の見方に合うもの: E22 で、限定の差分ベクトル（下位 − 上位）が、見たことのない上位概念へ移りました（支持）。
        - 線形の見方に合わないもの
          - h_axis_readout_raises_midpoint は反証でした。直線の読み出しでは、「数」の量が曲がっていました。
          - E33 では、余裕がほぼ 0 に縮み、語の好みだけが動きました。一本の向きに乗る形は見えていません。

        **3. 内積が指すのが「概念空間」で、概念が立体の場合**

        内積の役目は、意味を与えることではなくなります。距離と形を測る物差しになります。概念は、その物差しで測った領域 R（立体）です。たとえば中心 c と形 M を持つ楕円体 {h : (h − c)ᵀM(h − c) ≤ r²} です。

        - **体系の式との対応**
          - `extends: 票` は包含 R_丙 ⊂ R_票 にあたります。
          - 兄弟は、同じ R_票 の中で交わらない、R_丙 ∩ R_丁 = ∅ にあたります。
          - `mod`（with 社内）は、R_票 と「社内」の領域の共通部分で切り出すことにあたります。
          - `neg` は、上位の領域の中での補集合にあたります。
          - 式の部品が、包含・共通部分・補集合の集合演算になります。Gärdenfors 2000（先行研究の領域 `pw_gardenfors2000_spaces`）の「概念は凸領域」と同じ形です。
        - **成分の幾何**
          - 立体を1本の座標軸に射影すると、区間（影）になります。第 i 成分を見ることは、この影の幅を見ることです。
          - 影からは、元の形は分かりません。丙票の立体と丁票の立体が、どの軸に落とした影でも重なっていて、斜めの向きでだけ離れていることもありえます。
          - 例外は、立体が座標軸に沿った箱（box embedding。Vilnis ほか 2018）のときだけです。そのときは各成分が区間 [下限, 上限] になり、包含も軸ごとに読めます。モデルの領域は一般に回転しているので、成分ごとの影は、多くの立体の影が混ざったものになります。
          - 立体は 1536 次元を満たしている必要はありません。もっと低い次元の厚みのある板のようなものでもかまいません。Elhage 2022 の重ね合わせは、薄い立体がほぼ直交にたくさん詰まっている姿と読めます。
        - **E33 の読み直し**
          - v_丙 は向きではなく平行移動です。丙票のトークンの点を、R_丙 の中へ運ぶための移動です。
          - 余裕がほぼ 0 というのは、点が R_丙 と R_丁 の境界の上に止まっていることにあたります。
          - 語の好みは、R_票 の中でどちらかの側に元から寄っていた位置にあたります。

        この直観は、ロードマップの領域の道 d_road_region と同じ向きです。すでに未検証の仮説としてあるのは、たとえば次の二つです。
        - h_convex_prior_resists_redefinition: 凸の事前の領域は、再定義に抗う。
        - h_ambiguity_is_region_choice: 曖昧さは、領域の選び方である。

        立体として測る具体的な手順は、別に仮説として登録してからお伝えします。

        本線 b 領域の道（d_road_region）、本線 a の E33 の読み直し
