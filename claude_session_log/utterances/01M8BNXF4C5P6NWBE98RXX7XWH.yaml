        今は識別子化の流れの途中で、#952 の CI 待ちです。#951 については、あなたに決めてほしいことが 1 つあります。

        **ここまでで済んだこと**
        - **#946・#947（マージ済み）**: 限定の検査 3 つは法則に置き換えてよい、という仮説が支持されました。その置き換えも入っています。
        - **#950（マージ済み）**: new を宣言せずに使う 9 つの動詞があり、その定義をそろえれば、宣言の範囲は言語の固定に従える、という仮説が支持されました。
        - **#952（Draft、CI が走っています）**: 識別子は宣言の範囲に依らない、という仮説が支持されました（#939）。
          - 中身で作った識別子から、宣言の文をすべて取り去っても、概念どうしがくっつくことも分かれることもありませんでした。
          - main と、9 つの動詞をそろえた木の両方で、そうでした。
          - CI が通ったら Draft を外します。

        **決めてほしいこと: #951**
        - #951 は、9 つの動詞のそろえ方をファイルに入れる PR です。#950 がマージされたときに、マージされないまま閉じられたので、main にはまだ入っていません。
          - 行き先が #950 のブランチだったので、そのブランチが消えて自動で閉じられたのかもしれません。あなたが閉じたのかどうかは、私には分かりません。
        - 入れるなら、そう言ってください。main に向けて、もう一度 PR を立てます。
          - そのときの CI は、前回は通っていました。

        **次にやること**
        - 識別子化の本命として、識別子を類（上位の概念）と種差（それとの違い）から作れるかを確かめます（h_identifier_by_genus_differentia）。
        - その後に、表示語の辞書と韻律を組にしてモデルに読ませる仮説（#945）に進みます。
