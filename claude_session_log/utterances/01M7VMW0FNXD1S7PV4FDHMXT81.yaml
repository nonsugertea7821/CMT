      text: |
        部分の法則 part_fact_direction も規則で書けることが、手順の訂正なしに確かめられました（PR #448、状態は支持）。

        この法則は「部分の事実は、種類の限定と向きが逆にならない」というもので、今は Python の検査が担っています。検査器の写しに、動詞の「部分である」という状態の式と、ファイルに書いた事実を、規則が読む文として足しました。そのうえで、Python の検査と規則が同じものを咎めるかを、五つの版で数えました。

        | 版 | 中身 | Python | 規則 | 一致 | 余分な誤り |
        |---|---|---|---|---|---|
        | B | 何も足さない | 0 | 0 | 1 | 0 |
        | P | 部分の向きに反する事実 | 1 | 1 | 1 | 0 |
        | W | 全体の向きに反する事実 | 1 | 1 | 1 | 0 |
        | S | 下位の種類の個体を通る | 2 | 2 | 1 | 0 |
        | K | 向きが合う事実 | 0 | 0 | 1 | 0 |

        **含意**
        - 限定が「部分」か「全体」かは、名前を読まずに導けました。使ったのは、動詞の部分の式、限定の位置、新しい種類の有無だけです。
        - 規則の中で位置の語（from・to・new）を書けるのは、位置の文だけでした。そこで、部分の式の位置も位置の文に直して渡しました。位置の語は、このまま文法の側で扱えそうです。
        - 種類の上下は、既にある規則（r_below）をそのまま使えました。版 S では、下位の種類の個体もそれを通して咎めています。
        - Python が持つ法則のうち、残るのは part_display_explicit だけになりました。こちらは、登録済みの二つの仮説を対にして確かめます。一つは規則で書く道、もう一つは表示名を式から訳して法則を要らなくする道です。
        - 新しい仮説は、今回は登録していません。

        **あなたに見てほしいもの**
        - 訂正がないので、#448 は CI が通れば自動マージに乗る見込みです。
        - #439（definition_stratified）と #443（world_declared）は、まだあなたのマージ待ちです。
        - 三つがマージされたら、まとめて本体の規則に移す PR を立てます。

        ロードマップ: a（識別子化）の中で、残る法則を一つずつ規則に移しています。四つ目まで確かめ終わり、残りは part_display_explicit だけです。
