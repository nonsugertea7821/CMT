      text: |
        `form` で合っています。打ち間違いではありません。`form` は文法の語で、表示語は「形の指定」です（`syntax.yaml:6` の語の一覧、`:70` に定義）。一方 `from` は動詞の端の位置の名前です。

        紛らわしいのは、役割の定義に両方が一行に並ぶからです。

        ```yaml
        referrer: {display: 述べるもの, form: [v_refer, from]}
        ```

        これは「`v_refer` の `from` の端に立つものの形」と読みます。キー（欄の名前）が `form` で、その値の中の `from` が「どちらの端か」を指します。`agreed: {form: [v_agree, to]}` なら、`to` の端に立つものです。

        今回の実験では次のことが起きました。
        - 層の法則が使う参照（`T.refs`）は、`of` と同じように `form` の先の動詞も参照に数えます（`type_checker.py:784`）。
        - 分類のほう（sys_layers の `edges`）は `extends`・`from`/`to`/`new_kind`・`mod` の `of`/`with` しかたどらず、`form` をたどりません。
        - そのため、役割（referrer など）は動詞に届かず still（点）と分類されて ontology に残ります。ところが、動詞（v_refer）のほうは syntax へ動きます。その結果、ontology から syntax への参照になり、層の法則に反しました。

        次の仮説 `h_layers_role_edges` は、この `form` の辺を分類でもたどるように直すと違反が消えるか、を確かめるものです。
