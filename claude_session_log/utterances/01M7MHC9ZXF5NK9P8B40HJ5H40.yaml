      text: |
        その指摘も当たっています。axiom の層には公理が一つもありません。axiom を移し先にする案は取り下げます。

        ## axiom の層に今あるもの
        - 基礎の関係：在る（exists）、同じである（same）、について述べる（refer）
        - 分類の軸：個数、量、文字列、真偽
        - 規則の変数：var1〜var5
        - ファイルの中に「法則は置かない」と書いてあります。

        どれも、言語が使う原始的な語の宣言です。言い切る命題（公理）ではありません。

        ## 公理に当たるものは、ontology にある
        基礎の関係についての法則は、ontology に置かれています。
        - 部分であることは推移的・反対称的
        - 後ろにあることは推移的・非対称的
        - 依存する始点が在れば、終点も在る
        - 関わられる始点が在れば、終点も在る

        ## 言語の主張とも食い違っている
        - `cscl/design/claims.yaml` の `axiom_layer` は、「法則について述べる節」と定義されています。
        - 採用済みの決定 `d_cscl_std_on_axiom` は、「std は公理の層に依存する」です。
        - ところが、実際の axiom の層には法則がありません。つまり、この決定が指しているものは、今の体系にはありません。

        ## 一つ前の指摘とのつながり
        axiom.yaml の冒頭に「書き方は syntax に従うが、意味は syntax に依存しない」と書いてあります。
        - 一番下の層が、自分を書くのに上の層の語を借りている、とファイル自身が認めています。
        - 決め打ちの `LAYERS` も、`v_use` の特別扱いも、ここから来ています。

        ## 直し方の案
        1. 今の axiom を、名前と中身が合う層にします。名前は、例えば「原始」（`primitive`）です。
           - 基礎の関係、分類の軸、規則の変数を置きます。
           - 基礎の関係に「使う」（`use`）を足します。
           - そうすれば、どの層も `{is: use, from: 自分, to: 下の層}` と、自分より下の語だけで書けます。
           - 領域を宣言するには、今は `{is: domain}` という syntax の語を使っています。代わりに、各ファイル冒頭の `domain:` と、`use` の事実で宣言します。
        2. 本当の公理の層を置きます。ontology にある基礎の関係の法則を、そこへ移します。`axiom_layer` と `d_cscl_std_on_axiom` は、この層を指すようになります。
        3. syntax の `v_use` は、基礎の関係 `use` の上の動詞にします。ほかの動詞が基礎の関係の上にあるのと同じ形です。
        4. 検査器は、層の並びを `use` の事実から読みます。
           - `LAYERS` の決め打ちと、`v_use` の特別扱いをなくします。
           - 法則 `layered` を、個体の種類と事実の動詞にも当てます。
        5. 状態の語彙は std へ移します。lang が exp を使わないようにするためです。

        ## 決めてほしいこと
        - **層の名前：** 原始の層を `primitive` にしてよいか。
        - **公理の層の扱い：**
          - (i) 原始の層と ontology の間に、新しく axiom の層を作る。
          - (ii) 公理の層は作らず、`axiom_layer` が ontology の法則を指すようにする。
          - 層の名前と中身が合うのは (i) なので、(i) を勧めます。
        - **進め方：** 1〜5 をまとめて claude/cross に積んでよいか。
