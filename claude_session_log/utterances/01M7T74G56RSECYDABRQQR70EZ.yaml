      text: |
        たぶん「**モデルが式を書けるか**」の前提になっていた件だと思います。過去のログと開いている issue に、次のとおり残っていました。

        ## 見つかったこと
        **1. 健全性は「モデルが式を書けるか」の前提（#265）**
        - トリアージで「B. モデルが式を書けるか」（#58、#90）を並べたとき、「Bは体系の健全性に依存しないか？」と指摘をもらっていました。
        - モデルが書いた式の正しさは型検査器で判定します。検査器が健全でなければ、測った値はモデルの力ではなく検査器の性質を写してしまいます。
        - これを `h_writing_depends_checker`（#265、未検証）として登録し、B を「体系の内側の検査」の後に回しました。
        - 気になる点があります。B の二つの仮説、式を書けるか（E29）と型検査の返しで上達するか（E30）は、どちらも反証済みです。しかし #265 が未検証なので、この二つの反証が検査器の健全性に左右されていないかは、まだ確かめていません。

        **2. 健全性の根拠としての対称性（#96）**
        - 「対称性が体系の健全性を示す根拠も欲しい。僕の直感であり、仮説だ」という発言がありました。
        - これは `h_symmetry_soundness`（#96）として、結果は mixed です。対になっていない上下関係が支持の側、差が有意でないことが反証の側です。

        ## つながりの全体（記録から組んだもので、私の読み）
        ```
        d_goal（再定義の成功）
         └ d_metric（使い方をまたぐ一貫性）
            ├ 体系の健全性
            │   ├ モデルが式を書けるかを正しく測るための前提（#265）
            │   ├ display の廃止（式にない意味を式に移す）
            │   └ 式の識別子化（名前を読まずに区別する。#334、#300、#338）
            │       └ 幾何で座標を与える
            └ 健全性の目印としての対称性（#96、mixed）
        ```

        #58・#90 の反証が検査器のせいでないかは、識別子化が進み、検査器が名前を読まなくなってから測り直すのが筋です。思い出したかったのがこれと違っていたら教えてください。
