      text: |
        h_translation_by_display（「訳語は、領域ではなく言語に依存する表示語」）は支持されました（PR #665）。ランナーの spec が通ったら Draft を外します。

        **E33**
        - 来たときには止まっていたので、途中保存から再開しました。いまは組 11 の round を走らせています。
        - 9 分ごとの再開の確かめを置き直しました。

        **h_translation_by_display の結果**
        - 体系のファイルは書き換えず、型検査が組んだ事実の列だけを変えて法則を当て直しました。
        - 表示語をすべて別の言語の仮の値に差し替えた場合も、二つの言語の表示語を並べた場合（表示語の事実 889 → 1778）も、法則が導く関係と違反の集合は元とまったく同じでした（違反は 0 件）。

        **わかったこと**
        - 法則が表示語について読むのは、「同じ領域の中で重複しない」（unique_in_domain）の値の等しさだけです。ほかの式は表示語の中身に依存しないので、表示語は言語ごとに替えられます。
        - 記述だけで回した #605 の道（一つの領域の概念を別の領域に写す）では、one_name ではなく one_spelling に 12 件当たりました。これは私の写し方が生んだ当たりで、#605 の再現ではないと読んでいます。写す領域は、概念が 10 以上ある中で最も少ない prior_mfg を規則で選びました。

        **限界**
        差し替えた値は概念ごとに必ず違う仮の値なので、本物の訳で起きる重なりは試していません。

        **含意と新しい仮説（#666、登録だけの PR）**
        - 実際の訳では、「語」と「単語」がどちらも word になるように、別々の語が一つの訳語に重なることがあります。一意を領域だけで問うと、この重なりが違反になってしまいます。
        - そこで h_display_unique_per_language（「表示語の一意は、領域と言語の組で決まる」）を登録し、d_cscl_display_derived に結びました。

        ロードマップ: 軽い列 L1（d_cscl_display_derived の決定を問う核）を進めました。重い列 H1（E33）は走行中です。
