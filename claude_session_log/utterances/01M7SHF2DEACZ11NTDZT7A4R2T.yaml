      text: |
        この周回では h_boundary_invariant（#323）を確かめました。結果は**支持**です。PR #325 の Draft を外しています。

        **何をしたか**
        - 今の検査器は、変化の動詞について pre の側だけを事実にしていて、法則も pre を見て動詞を分けています。つまり「変化を前の側で読む」取り方です。
        - 体系の写しで、これを post の側で読む形に書き換え、検査を走らせ直して比べました。

        **結果**
        - 検査の誤りは、どちらの読み方でも 0 でした。
        - 法則から導いた事実も、すべて同じでした。
        - 側の事実を持つ動詞も、どちらも同じ 16 でした。
        - pre と post の両方を事実にした変種でも、結果は同じでした。

        **含意**
        - 結論が変わらなかったのは、今の動詞がすべて前後の両方を書いているからです。pre だけ、post だけを書いた動詞は 0 でした。
        - 一方、検査器は「holds か、pre・post のどちらかがあること」しか求めていません。片側だけの枠も受け付けます。
        - つまり、境目の取り方によらないことは、今の書き方がたまたま支えているだけで、検査では守られていません。

        **新しい仮説（登録だけの PR #326）**
        - `h_frame_both_sides`：前の状態の指定は、後の状態の指定に依存する。前後の両方を書くことを、式で求めるという仮説です。

