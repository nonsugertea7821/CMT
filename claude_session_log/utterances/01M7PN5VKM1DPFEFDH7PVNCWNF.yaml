      text: |
        h_any_by_entail（#157）を測り、結果は**反証**でした。PR #158 は Draft を外して見張っています。文法を変えたうえに訂正も入っているので、自動マージには乗りません。手で見ていただく必要があります。

        **先にお伝えすべき訂正**
        - 測定の途中で、見本の種類を足す書き方の誤りに気づきました。型検査器が体系を読み込んだ後に、mod を辞書のまま足していました。そのため、限定の項が `"of"` や `"with"` という語そのものになっていました。
        - この誤りは前回の #155（h_any_not_vacuous）にもありました。#155 の反証は、意図した限定を測っていなかったことになります。
        - そこで訂正を手順に書き足して開示し、直した手順で取り直しました。直した手順で法則なしの体系を測っても一致は 0 で、#155 の結論は変わりません。
        - もう一つあります。ec が観察の名前 `match` を、表の各行の同じ名前の値の平均として読んでいました。#155 の観察の値 0 が正しく見えるのは、たまたまです。

        **結果**（直した手順、法則を足した後）

        | | 法則なし | 法則あり |
        |---|---|---|
        | 「pos に何かの v を持つ概念」がある位置 | 85 | 85 |
        | any の限定を満たす概念が出た位置 | 1 | 44 |
        | 両者が一致した位置 | 0 | 19 |
        | any_ancestor（端 w が any の下にある組） | 1 | 762 |
        | above（上位の組の数） | 2587 | 3348 |
        | deep_kind を持つ概念 | 444 | 526 |

        型検査器と ec は、どちらもエラー 0 で通りました。

        **解釈**
        - 端を any の下に置くと、端を持つ素の限定からは含意が届きます。そのため 44 の位置で、any の限定を満たす概念が出ました。
        - ただし、全部には届きません。食い違いの内訳は事後の下調べで、記録していません。
          - **付いた限定（495 組）:** その位置の項が、否定・数量・範囲の付いた限定だけでした。この 495 組には測り方の誤りも混じっています。否定の項は「その位置に v がない」という意味なので、「pos に何かの v を持つ概念」に数えるべきではありませんでした。
          - **端のない限定（307 組）:** その位置の項が、端（with）を持っていませんでした。
        - 副作用があります。any が上位として数えられるので、概念の深さが一つ増え、deep_kind を持つ概念が 82 増えます。
        - any の限定の中身は、上位の順序だけでは決まりません。

        **決めてほしいこと:** この PR は、syntax.yaml に法則 any_above_end を足したままです。そのままマージすると、上の副作用ごと main に入ります。反証の記録だけを残すなら、法則を外す commit を足してからマージするのがよいと考えています。外しますか。

        PR #158: https://github.com/nonsugertea7821/CMT/pull/158
