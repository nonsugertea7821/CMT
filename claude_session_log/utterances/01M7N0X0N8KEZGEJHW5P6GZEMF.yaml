      text: |
        CI は 929a71b でも通っています。

        ご指摘のとおり、検証の条件が間違っていました。私は (b) で、`exists` の真偽と宣言を同じものとして扱いました。そのため `v_freeze`（exists を述べられていない状態に戻す）を「宣言の取り消し」と読んでしまいました。これは真偽の軸の操作を、宣言の軸の操作として測ったことになります。反証されたのは私が書いた読み方で、あなたの見立てではありません。

        ## 理解した見立て
        - **フレームの中は閉じている。** 一度宣言されたものは、そのフレームの存在論の一部として固定されます。次のフレームで消えることはありません。
        - **開いているのは時間の方向。** 次のフレームでは宣言が増えるだけです。フレームの間の概念の差分が増え続けることが、証明の条件になります。
        - **`v_freeze` は真偽の軸の操作。** r1 は宣言されたまま、`exists(r1)` が述べられていない状態に戻るだけです。後に残る `depend(r1, sys1)` は、宣言された名前についての文なので、宣言の軸では問題になりません。
        - **宣言が減るのは、スタックの巻き戻しのときだけ。** 「宣言されていない名前を含む文が残らない」は、巻き戻した後に確かめるべき条件でした。

        ## 直した確かめの条件（案）
        1. **単調性：** どの歩みでも、前の宣言の集まりが次の宣言の集まりに含まれる。
        2. **軸の分離：** 消える動詞（`v_freeze`）は真偽の軸だけを変え、宣言の集まりを変えない。
        3. **巻き戻し：** フレーム k へ巻き戻すと、宣言が k の時点に戻り、k より後に宣言された名前を含む文が残らない。

        ## 決めてほしいこと（2つ）
        - **(i) フレームの区切り。**
          - 1歩ごとに1フレームとすると、`v_freeze` のような宣言を足さない歩みでは差分が 0 です。この場合「増え続ける」は「減らない」の意味になります。
          - 宣言を足す歩みだけがフレームを進め、真偽だけを変える歩みはフレームの中の出来事とする読み方もあります。この場合、フレームの間の差分は必ず増えます。
        - **(ii) 巻き戻しで戻すもの。**
          - フレーム全体（宣言と真偽の両方）を戻すと、条件 3 は確かめるまでもなく成り立ちます。
          - 宣言だけを戻して、真偽の文は残すとすると、条件 3 は試す意味のある条件になります。ただし、その場合に何が起こるべきかの決まりが要ります。

        ## すでに記録したものの扱い（案）
        h_open_declaration は、登録した基準での結果として反証のまま残します。そのうえで注に「基準が真偽の軸と宣言の軸を取り違えていた」と書きます。直した条件は、別の仮説として新しく登録します。判定を後から書き換えると、事前に登録した意味がなくなるからです。

        (i) と (ii) を決めてもらえれば、新しい仮説として登録してから確かめます。
