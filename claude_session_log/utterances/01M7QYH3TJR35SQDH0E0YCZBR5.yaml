      text: |
        E20（#35）は支持でした。適用で学習したベクトルは、「説明」の使い方には転移しません。結果は PR #268 に記録し、Draft を外しました。手元では tc と ec が通っています。

        設問は、再定義が元の意味と衝突する 24 問です（以下は正答率）。

        | ベクトル | 適用 | 説明 | 説明（順序を入れ替えた2回とも正答） |
        |---|---|---|---|
        | なし | 0.375 | 0.417 | 0.208 |
        | 適用例で学習（qa） | 0.792 | 0.458 | 0.042 |
        | 定義文と適用例で学習（defqa） | 0.792 | 0.417 | 0.000 |

        **読み**
        - ベクトルは適用を確かに動かしています（+0.42、E3 の記録と一致）。なしの条件の説明も 0.417 で天井ではないので、測れる条件はそろっていました。
        - それでも説明は動かず、qa でも 0.458 です。適用・言い換え・暗唱・説明の4つのうち、動くのは学んだ使い方だけでした。定義文を教師に足しても（defqa）、説明には届きません。
        - 判定には使っていない読みが一つあります。ベクトルを足すと、選択肢の順序を入れ替えた2回で答えが揃わなくなりました。判断がプロジェクトの意味へ寄るのではなく、選択肢の位置に任されるように崩れています。e14 で見えた安定の低下（#52）と同じ形ですが、結果を見た後の読みです。

        **含意として登録した仮説（PR #269、登録だけなので自動マージに乗るはず）**
        - 説明に届かない理由について、別々の解き方を対で出しました。
        - `h_multi_layer_transfers_to_explain`: 届かないのは単層だからで、複数層のベクトルなら説明に転移する。
        - `h_explain_transfers_to_apply`: 説明は適用を部分に持つ（体系で説明は適用を `extends` する）。部分から全体へは届かなくても、全体から部分へは届く。
          - これが支持されれば、教える使い方は、最も多くを部分に持つものを選べばよいことになります。

        E20 が終わったので、9分のチェーンは止めました。次の周回は 18:37Z です。
