      text: |
        0/1 ではありません。1個1個が、小数も負の値も取れる実数です。

        **次元**
        - 1本のベクトルは 1536 次元です。丙票用に1本、丁票用に1本あります。
        - 3072 は 1536×2 の、数の合計です。3072 次元のベクトルが1本あるのではありません。
        - 1536 という幅は、モデルの隠れ状態の幅と同じです。同じ幅でないと、隠れ状態に足せません。

        **1つ1つの数**
        - 中身は、たとえば v_丙 = (0.12, −0.87, 0.03, 1.40, …, −0.25) のように、1536 個の実数が並んだものです。
        - 計算機の中では 32 ビットの浮動小数点数（float32）として持っています。表しているのは、0.12 や −0.87 のような連続した値です。
        - 学習の始めは全部 0 です。Adam は学習率 0.1 で、1段に各成分をおよそ 0.1 前後ずつ動かします。そのため、24段の後でも各成分は大きくて ±2 程度と見込めます。ただし実際の値は保存していないので、確かめてはいません。

        **足すときの計算**
        - 第8層を出た「丙」の位置の隠れ状態も、1536 個の実数の並びです。
        - 足し算は成分ごとに行います。隠れ状態の1番目に v_丙 の1番目を、2番目に2番目を、……1536番目まで足します。
        - つまり、1536 次元の空間の中の1点を、v_丙 の向きと長さだけ動かす操作です。

        本線 a 往復の教示（h_round_trip_raises_sibling、PR #640）
