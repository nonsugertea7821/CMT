        修飾の合成を確かめる実験（E4）の題材とコードを用意し、生成の評価が終わり次第、自動で続けて走るように予約しました。

        ## E4 の内容

        - **題材**: 修飾を表す語の組を3つ用意しました。
          - 甲種／乙種（支払いが未確認／確認済み）
          - 青／赤（一部だけ／すべて）
