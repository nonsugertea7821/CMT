      text: |
        ご指摘のとおりだと思います。なぜそうなったかを、記録から辿りました。

        **どこで「識別子＝式」になったか**
        - 出発点は、最初の仮説 h_identifier_by_expansion の登録（6044c82、11 月 18 日）です。そこには「識別子は、シグネチャまで展開した概念式で定まる。表示語はそこから訳した名前になり、いずれ独立の置き場としては消える」と書かれています。
        - 根拠にしたのは「表示語は体系から決まる」（d_cscl_display_derived）です。けれどもこの決定が言っているのは表示語のことだけで、識別子が式で決まるとは言っていません。
        - 文法の定義では、識別子は「概念の式をちょうど一つ指す情報」です。「指す」であって「等しい」ではありません。
        - つまり「表示語を体系から決める」を「識別子も中身から決まる」へ広げたところに飛躍がありました。そこは確かめずに出発点に置かれていました。

        **その後の仮説も同じ前提の上にある**
        - 中身の全部の案（#331）、宣言の範囲に依らない案（#952）、類と種差の案（#954）は、どれも「識別子は中身の何に依るか」（v_depend の識別子）を問う形です。
        - 類と種差の案の登録（33e2c07）は、反証の並びから立てたものです。けれども、その反証たちも同じ前提で立てた仮説でした。前提そのものは問われないまま、依る先だけを替えていたことになります。

        **実験の結果は何を測っていたか**
        - 測った数（まとまりの数、ぶつかる組）そのものは、正しく取れています。
        - ただ、設計に沿って読むと、これは「識別子が何で決まるか」ではありません。「違う識別子が違う式を指しているか」という、一つの識別子が一つの式を指す側の点検の量です。
        - 仮説の文（識別子は〜に依る）は、設計にない関係を主張していました。なので、支持でも反証でも、設計について言えることは少なかったと思います。

        **記録の上で残ること**
        - 識別子の系列の仮説（#952 の支持も含めて）は、設計に沿わない前提の上で判定されています。
        - この読みを体系に書き込むには、前提そのものを仮説として登録する必要があります。たとえば「識別子は式に依る」を、設計の「識別子は式を一つ指す」と並べて問う形です。進める場合は、まずその登録から始めます。
