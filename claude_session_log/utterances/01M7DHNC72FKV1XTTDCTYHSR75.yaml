        継続確認の時点で、E9（途中を書き出させる実験）の 1.5B モデルぶんが終わっていました。結果を `spec/` に記録してプッシュしました。私の予想は外れています。

        ## E9 の結果（Qwen2.5-1.5B、正答率）

        定義文を設問の直前に置いたうえで、答えさせ方を2通り比べました。

        | 再定義の型 | 設問 | 即答 | 途中を書き出してから答える |
        |---|---|---|---|
        | 規則型（12概念） | 衝突する | 0.33 | 0.25 |
        | 規則型 | 衝突しない | 0.67 | 0.67 |
        | 付け替え型（12概念） | 衝突する | 0.83 | 0.58 |
        | 付け替え型 | 衝突しない | 0.83 | 0.42 |

        ## 予想との照合

        予想は「書き出させれば、規則型で改善する。付け替え型はほとんど変わらない」でした。

        - **規則型は改善しませんでした。** 1問ぶん下がっています。
        - **付け替え型は、大きく悪化しました。** 即答ではほぼできていたものが、書き出させると崩れます。

        「一度の処理で連鎖できる段数に上限があるから、規則型で失敗する」という説明は、この結果では支持されません。

        ## 書き出された文から分かること

        モデルが書いた途中経過を読むと、どこで誤っているかが見えます。

        > 22歳の大学生は、未成年には当たらない。定義によると、未成年は25歳未満の者を指すので、22歳は25歳以上であるため、未成年とはならない。

        定義の条件は正しく読み取れています。誤っているのは、数の大小の照合そのものです（22 を 25 以上としている）。段数が足りないのではなく、照合という1つの段が壊れています。途中を書き出しても、その段が正しくならないかぎり、改善しません。

        付け替え型が悪化した理由は、まだ分かりません。書き出した文が元の意味に沿った内容になり、それに引きずられて答えが変わっている可能性があります。

        ## 記録した内容

        - 仮説「途中経過の書き出しは、規則型の再定義への追従を上げる」は、**反証されている**になりました。差が1問なので、その留保を付けています。
        - 仮説「連鎖の段数は、再定義への追従を下げる」は、**支持と反証の両方がある**になりました。
        - 新しい仮説「途中経過の書き出しは、付け替え型の再定義への追従を下げる」を、支持されているとして加えました。

        状態は、根拠の観察から機械的に決まっています。前回の自己記述で入れた仕組みが、ここで初めて実際に働きました。

