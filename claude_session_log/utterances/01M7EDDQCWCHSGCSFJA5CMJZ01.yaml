      text: |
        まとめる。

        1. オントロジーのmodを2つ以上並べてAND扱いにするのはやめた方が良いかもしれない。普通にextendsをANDで代用したほうがいいかも。型階層を降りるに従って限定が単調に増えていくことを法則として強制する。そうしないと具体概念を抽象に置けてしまう。

        2. これでプログラムを書くってなると低レイヤの操作と高レイヤ操作で間違いなく識別子が衝突する。似たドメインの語彙は似たものになるからだ。修飾によって限定、動詞として利用されてもその動詞自体の識別子が衝突する。プログラミング言語の前例ではそれを名前空間の概念で解いているので倣うべきだ。一定の型階層でドメインを切ってドメイン間での識別子重複を許可する規則を追加する。また、この規則が出来れば現在ファイルを分けている計測結果や実験記録も名前空間の下に直接オントロジーとして書ける。

        3. run_specについて、実行戦略、実行時の意味論がハードコードされている疑惑がある。実行戦略、実行時意味論はそれ自体が概念を持っているからオントロジー側に定義されるのが正しい。オントロジーを正として、そこから識別子または構文糖衣で引っ張ってきて定義したい。余裕があればEBNF化もやりたいけど、そこまで行くと本筋からそれすぎるかも。
