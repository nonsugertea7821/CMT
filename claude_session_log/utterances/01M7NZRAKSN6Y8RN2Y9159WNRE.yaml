      text: |
        いくつかの分野に、今回の分け方とほぼ同じ問題があります。以下は記憶に基づく整理で、今回は文献に当たっていません。

        **1. 論理学：論理の語と、非論理の語（シグネチャ）**
        - 一階述語論理では、意味が固定されているのは論理の語（結合子、量化子、等号）だけです。それ以外の関係（シグネチャ）は意味を持たず、公理を満たす解釈によってだけ決まります。
        - いまシグネチャに same（等号）だけがあるのは、この形とよく一致しています。
        - 含意：refer・part・after は論理の語ではないので、意味は公理（規則で書いた法則）で与えるべきで、コードが与えてはいけません。
        - 法則にできそうなもの：**コードが意味を与える法則（law_given）は、シグネチャか文法の語にだけ掛かる**。いまは観察で数えているだけなので、これを法則にできます。

        **2. 形式オントロジー：形式的な関係と、内容的な分類**
        - Husserl に始まり B. Smith らが引き継いだ区別があります。部分・依存・順序のような**どの話題にも中立な関係**（形式的な関係）と、continuant・quality のような**内容に踏み込んだ分類**です。BFO や DOLCE は、この上に作られています。
        - 含意：sys_core で出た「コア」は、形式的な関係の側にあたりそうです。「コアが ontology」という見方とも整合します。
        - 法則にできそうなもの：**話題に中立な関係は、端を限定しない（端が any）**。端の種類で式から判定でき、形式と内容の境目を、判断ではなく観察から引けます。たとえば v_refer は始点が continuant に限定されているので、この基準では内容の側に入ります。これ自体が検討の材料になります。

        **3. プログラミング言語の意味論：束縛は構文、割り当ては実行**
        - 型理論やプログラミング言語の理論では、変数の束縛の構造は構文の側に置かれます（Harper の抽象束縛木）。代表的なのが de Bruijn の番号で、変数を名前ではなく番号で書きます。これは「any と数」の案そのものです。
        - 一方、変数にどの値が入るか（環境）は、実行時の意味論の側にあります。
        - 含意：変数の「形」は syntax に、「割り当て」は runtime の binding に置く、という分け方を先行研究が支持しています。
        - 法則にできそうなもの：**規則の変数の番号は、出てくる順に 1, 2, 3… と隙間なく振られている**（正規の形）。これを満たせば、変数の名前の付け替え（α変換）で意味が変わらないことが、形で保証されます。

        **4. Datalog：範囲の制限と層化**
        - 規則の評価器は、実質 Datalog です。Datalog には二つの条件があります。
          - **安全性**：結論や否定に出る変数は、肯定の前提にも出る。
          - **層化**：否定を通した循環がない。
        - どちらも、いまはコードの中の検査として書かれています。それぞれ、規則の形についての法則として書けます。
        - 今回の 233 万件は、結果は正しいまま、結合が爆発した例です。Datalog の評価の分野では、結合の順序や、必要な組だけ導く書き換え（magic sets）がこれへの対処として知られています。

        **5. 証明支援系：小さな信頼の核（de Bruijn の基準）**
        - Lean、Coq、HOL などは、すべてを小さな核で検査し直せるように作られています。核だけを信じればよい、という考え方です。
        - 含意：土台のコードを signature・syntax・runtime の翻訳だけにする、という今の方向は、この基準と同じです。

        **6. 層の積み重ね：保存的拡大**
        - 論理で層を積むときの標準の条件が、**保存的拡大**です。上の層を足しても、下の層の語だけで書ける新しい結論が増えない、という条件です。
        - 含意：この条件が成り立てば、下の層の検査結果をしまっておき、上の層の差分だけを検査できます。前の返答で、領域ごとの検証には「上の層が下の層のノードについて文を足さない」ことの確認が要る、と書いたのは、まさにこれです。
        - 法則にできそうなもの：**上の層の事実と規則は、下の層の語だけからなる文を導かない**。導いた文について式で確かめられます。

        **7. 制度の理論（Goguen と Burstall）**
        - 「記法を付け替えても、真偽は変わらない」ことを、充足条件として公理にしています。
        - 名前の変異（sys_mutation）は、これを手で試したものにあたります。これは法則というより、体系全体についての検査です。

        **どこから手を付けるか**
        いま抱えている問いに直接つながるのは、次の3つです。
        1. **保存的拡大**：領域ごとの検証を安全にします。
        2. **端が any かどうかで、形式と内容を分ける**：コアの範囲を観察から決めます。
        3. **変数の正規の番号付け**：変数を runtime に移す話の、syntax 側の土台になります。

        1 と 2 は、まず観察として違反や該当を数えてから、法則にするのがよいと考えます。これまでと同じく、手順を先に登録してから測ります。どれから進めましょうか。
