      text: |
        一般論として、発話を self・same・フレームの言葉で分解してみます。ここからは考察で、観察の裏づけはまだありません。

        ## 1. 「発話」という語は2つのものを指している

        | | 発話という行い | 発話されたもの（発言・文） |
        |---|---|---|
        | 最上位 | 生起体（前後のフレームを変える） | 持続体（宣言され、その後のフレームで自分と同じ） |
        | 話し手との関係 | 話し手が関わる（involve）。行いは話し手なしには起こらない | 話し手がいなくなっても残りうる（書かれた文、録音） |
        | 時間 | 終われば無い | 残る |

        今の v_speak の post `depend(to, from)` は、**行いについては正しく、産物については誤り**に見えます。
        - 行いは話し手に依存します。
        - 産物は、在るようにする位置（to）にあり、宣言された持続体です。

        つまり、v_speak の式自体が、行いと産物を同じ名前で書く混同の形（v と v∘R）になっている可能性があります。ここでの R は「行いが産物を生む」関係です。日本語の「発話」「設計」「計算」が、どれも行いと産物の両方を指すのと同じ構造です。前に見た非対称（発話にだけ産物の概念がない）は、産物の概念が行いの語に吸収されているせいかもしれません。

        ## 2. 発話を、計算・設計と分けるもの

        産物が作られた後に何と結ばれているかで並べると、次のようになります。

        | 行い | 産物 | 産物が結ばれる相手 | 基礎の関係 |
        |---|---|---|---|
        | 計算する | 計算結果 | 入力 | depend（入力から決まる） |
        | 設計する | 設計書 | 作るもの（まだ無い） | refer |
        | 発話する | 発言 | 述べる内容 | refer |
        | 発話する | 発言 | **聞き手** | （今の基礎の関係には無い） |

        発話だけが持つのは、**聞き手**です。発言は誰かに向けられていて、発話の効果は聞き手の状態の変化として現れます。言語行為論の言葉では、次の3層です。
        - 発語：文を作る（産物ができる）
        - 発語内：主張・約束・宣言（約束なら義務、宣言なら制度の事実ができる）
        - 発語媒介：聞き手が知る・信じる・動く

        体系の中では、v_adopt（決定を採用すると、役割がその決定に依存する）が、宣言にあたる行いをすでに状態の変化として書いています。発話の本質的な変化は「文が在るようになる」ことより、こちら（役割・約束・知識の変化）にあると考えられます。

        ## 3. 計算と発話の重なりの読み直し

        モデルが文章を出す出来事は、次のように読めます。
        - 産物は入力に依存する（計算）
        - 産物は何かについて述べる（発話の発語）

        つまり、**同じものでも混同でもなく、2つの行いが1つの出来事に重なっている**（計算による発話）という読みです。体系で式が同じに見えたのは、両方とも「産物が在るようになる」ことしか書かれておらず、それぞれに固有の関係（入力への依存、内容への refer、聞き手）が書かれていなかったからです。

        ## 4. まとめると（候補）
        - 発話（行い）は生起体で、話し手と聞き手が関わる。
        - 発話の産物は持続体で、内容について述べる（refer）。
        - 発話の固有の変化は、聞き手の側の状態の変化。

        **観察で確かめられそうなこと**
        1. **行いと産物の混同**：「発話」「設計」「計算」などの語が、体系の中で行いの位置と産物の位置の両方に使われているか。法則 no_confusion の形で数えられます。
        2. **産物は作り手より長く残るか**：結果ファイルとスクリプトでは、スクリプトが消えた例がありませんでした。実験の記録（モデルの出力と、使ったモデル）なら見つかるかもしれません。
        3. **聞き手**：place_system（システムプロンプト）は運用者が発話し、モデルが読みます（v_read）。聞き手の位置が、体系の中ですでに別の動詞で書かれているかを調べられます。

        この3つのうち、どの見方を観察で確かめたいかを指示してください。私は、いちばん一般的な 1（行いと産物の混同）を勧めます。
