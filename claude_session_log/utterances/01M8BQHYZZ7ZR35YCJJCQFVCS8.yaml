        あなたの見立てを、二つの仮説として登録しました（PR #957、登録だけなので CI が通れば自動でマージされます）。

        - **h_region_by_expression**：区画は、上位だけでなく式の全体で決まる。支持済みの「区画は上位概念で決まる」を広げたものです。
        - **h_identifier_unique_by_region**：識別子が一つの概念を指せることは、区画の形に頼る。
        - 体系には「区画の形」そのものを指す概念がないので、「中点が成員に落ちる度合い」（midpoint_membership）で代えました。ここは式にできていない部分です。

        **この見立てに立つと、私の前の読みは外れていました**
        - 識別子を式から作るのは、鍵と値を取り違えたのではありません。一意性の根拠が形にしかないことから出た、筋の通った要求です。
        - #331・#954 の問いは向きとしては合っていました。足りなかったのは、体系の中だけで確かめて、形（区画）の側を見ていなかったことです。

        **見立てから出てくること（未検証）**
        - 承認と入金は、式の全体で見ても区別がつきません。見立てどおりなら、次のどちらかです。
          - 区画の形も同じで、自然言語の側だけが違う。
          - 式に座標が足りない。
          - どちらかは、モデルの中で二つの区画が分かれるかを測れば決められます。
        - #954 で区別に効いていた form・pre・post・neg は、見立てどおりなら座標の一部です。#955 の仮説がそれを問う形になっています。
