      text: |
        sys_count_atom は、登録した判定で外れました。結果は commit して push してあります（5776083）。体系のファイルと評価器は操作の前に戻しました。

        | | before | after |
        |---|---|---|
        | 型検査の誤り（tc / ec） | 0 / 0 | **1 / 1** |
        | 法則が浅いとした概念 | 0 | 100 |
        | スクリプトが浅いとした概念 | 89 | 89 |
        | 不一致 | — | **11** |
        | ほかの規則の結果の変化（changed / extra） | — | 0 / 0 |

        **分かったこと**
        1. **数え方そのものは問題なく入りました。** 評価器に足した count の読み方は、`at` を持たない規則の結果を1つも変えませんでした。新しい法則も、浅さの2つの関係（`r_deep_end` と `r_shallow`）のほかは何も導きませんでした。
        2. **誤りの原因:** 法則の形を検査するコード（`check_laws`）も、規則の原子の `at` を受け付けていませんでした。評価器と同じく、ここでも統語の約束が果たされていません。欠け2は1か所ではなく、2か所にあったことになります。
        3. **不一致 11 の原因は私の訂正の読み違いです。** 11 件はすべて、限定の端が個体の概念でした（選択肢の opt_no、曜日の monday など）。
           - 私は「法則の側は is から個体の上位を導く」と読み、スクリプトで個体を「種類の深さ + 1」と数えました。
           - 実際には `parent_by_is` は種類についての規則で、個体には祖先を導きません。
           - その結果、同じ個体の端を、法則は祖先 0（浅い）、スクリプトは 4〜5（深い）と数えました。
           - 個体の端を除けば、89 件すべてで一致しています。

        **解釈:** 欠け2を埋めれば浅さは法則として書けて、スクリプトの浅さと一致する、という見込みはほぼ立ちました。残ったのは「個体はどの深さにいるか」です。束の見方では、個体は種類の下の点（最も具体的なもの）なので、私の直観は「深い」です。ただ、今の体系は個体に上位を導いていません。

        **直して測り直す案**（登録し直します）
        - 法則の形の検査が、前提の原子の `at: {count}` を受け付けるようにする。翻訳の修正で、定義は増えません。
        - 個体の端の扱いは次のどちらかにします。
          - (a) 法則でもスクリプトでも、個体の端を数えない。sys_overextension と同じ扱いで、今回の目的（count で浅さを書けるか）に絞れます。
          - (b) 個体の上位（属する種類とその祖先）を法則で導く。ただし `r_ancestor` が広く変わり、ほかの法則の結果（`r_acc` など）にも響くので、別の実験にすべき大きさです。

        (a) で測り直し、(b) は後で別の実験にするのがよいと思います。それでよいですか？
