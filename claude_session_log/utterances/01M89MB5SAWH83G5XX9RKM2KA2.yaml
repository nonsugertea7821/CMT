      text: |
        ごめんなさい、言葉が内輪向けでした。書き直します。#865 の決まりにも「ふつうの言葉で書き、仮説の名前は括弧に添えるだけにする」を足しました。

        **「律速」の意味**
        「一番足を引っぱっているところ」のことです。
        - この研究では、モデルが一つの言葉の新しい意味を、4 つの使い方でちゃんと扱えるかを見ています。
          - 当てはめる: 「この場合はどっち？」に答える
          - 言い換える: 正しい定義を選ぶ
          - 理由を言う: なぜその答えになるかを選ぶ
          - 定義を言う: 定義を口に出す
        - 4 つ全部できた言葉の割合を「一貫して使えた割合」と呼んで、これを成績にしています。
        - 4 つのうち一番よく失敗する使い方が、成績を押し下げます。それが「律速」です。

        **ここまでで分かったこと**
        - 一貫して使えた割合は、小さいモデル（1.5B）で 46%、大きいモデル（4B）で 71% でした（E58）。
        - 大きいモデルでは、「当てはめる」を上げる工夫を入れると、一貫して使えた割合もほぼそのまま上がりました（E63）。足を引っぱっていたのは「当てはめる」です。

        **今やっていること（E64）**
        - 小さいモデルでは、「理由を言う」も足を引っぱっていそうです。
        - そこで、「理由を言う」だけを上げる工夫を入れて、一貫して使えた割合が付いてくるかを見ています。

        **この先の計画**
        - 足を引っぱる使い方が分かったら、それを上げる方法として、この研究の設計が用意できる 2 つの道を試します。
          - 道 1: 型の検査器の出力を、教える材料に使う
          - 道 2: 意味の空間での位置関係に沿わせる
        - うまくいった道を設計に組み込みます。そして、単に定義を前に置くだけのときより、一貫して使えた割合が上がるかを測ります。上がれば、この設計で新しい意味を教えられる、と言えます。

        ロードマップの位置:
        - 目的: この研究の設計で、モデルに言葉の新しい意味を教えられるようにする。教えられたかは、4 つの使い方で一貫して使えた割合で測る（d_goal・d_metric）
        - 計画:
          - [済] 2 つのモデルで、一貫して使えた割合を測る → 成績は、一番失敗する使い方で決まる（E58）
          - [済] 大きいモデルで「当てはめる」を上げる → 成績もそのまま上がった。大きいモデルの足を引っぱるのは「当てはめる」（E63）
          - [今] 小さいモデルで「理由を言う」を上げる（E64、学習中） → 小さいモデルでは「理由を言う」も足を引っぱっているかが分かる
          - [次] 足を引っぱる使い方を、検査器の出力か意味の空間の位置関係を使って上げられるか試す → 設計にどちらの道を組み込むかが決まる
          - [先] その道を組み込んだ設計で、定義を置くだけのときより成績が上がるかを測る → この設計で新しい意味を教えられるかが言える
        - 分かれ目: E64 で成績が付いてくれば、小さいモデルでは「当てはめる」と「理由を言う」の両方を上げる方法を探す。付いてこなければ、両方のモデルで「当てはめる」だけに絞る
