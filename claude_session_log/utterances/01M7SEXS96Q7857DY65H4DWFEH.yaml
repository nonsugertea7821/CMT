      text: |
        これまでの座標の読みに当てはめると、答えは二つに分かれます。概念の空間の中には置き場がなく、時間の線の上では区間の境界の点になります。

        **これまでの座標の読み**
        - 概念は、修飾の次元（動詞と位置の組）の上の点です。
        - self が原点、any がゼロ、same が符号です。
        - 深さはノルム、上位は錐の順序です。

        **1. 概念の空間の中には、置き場がない**
        - 「在る・在らない」は、修飾の次元のどれでもありません。点の座標を変えず、空間に点が一つ加わるだけです。
        - 幾何で言えば、点の位置ではなく、点が属する集まりの側の変化です。
        - これは、今日の型検査器の振る舞いと合います。出現の枠を足すと `v_compute` と区別がつかなくなったのは、座標の上に出現を表す成分がないからだと読めます。そのため、差は表示語にしか残りませんでした。

        **2. 時間の線の上では、境界の点**
        - pre と post は、空間の座標ではなく、前後の順序（`v_come_before`）です。
        - 終点のものが在る時間を区間として見ると、「終点を在らせる」はその区間の左端、つまり在らないから在るに切り替わる境界の点です。
          - 半開区間 [t₀, ∞) の t₀ に当たります。
        - 動詞は、その境界の点に置かれます。
        - `occurrent` の `sometime` が持つ始まりと終わりは、出来事自身の区間の両端です。出現の枠は、それを終点のものの区間に移したものになります。
          - 偶然ですが、「終点」（動詞の矢の先）の存在区間の「始点」が、出現の位置になります。

        **3. 古典幾何との類比**
        - ユークリッドの公準は、「任意の二点を結ぶ直線を引ける」のように、作図によって図形を在らせる形で書かれています。
        - ヒルベルトは、これを「〜が存在する」という存在の公理に置き換えました。
        - 出現の枠は、この作図や存在の公理に当たります。ここから一つ読めることがあります。作図には「何から、どう決まるか」があります。たとえば、交点は二本の線から一意に決まります。
        - `v_design`・`v_compute`・`v_speak` の差は、出現そのものではなく、終点が始点からどう決まるかの側にあるはずです。`v_speak` は、post に「終点が始点に依存する」を持っています。一方、`v_compute` には、これに当たる式がありません。

        `h_appear_root` を確かめるときは、出現を時間の境界として置き、そのうえで各動詞の差を「終点の決まり方」として式に書けるかを見ることになります。
