      text: |
        物理学の対称性には、使えるものがあります。ただし観察の根拠にはならず、仮説の形をはっきりさせる材料になります。物理の結果は物理の理論についての観察で、概念の体系に移せばそれは類比だからです。それを前提に、関係する点を 3 つ挙げます。

        ## 1. 対称性の破れが「理論の矛盾」を示す例：量子異常（アノマリー）
        - ゲージ理論では、古典論で成り立つゲージ対称性が、量子化で壊れることがあります。これを量子異常と呼びます。
        - ゲージ対称性に異常が残る理論は、矛盾した理論になります。標準模型が成り立つには、異常が打ち消し合う必要があります。
        - これは「対称性の破れが欠陥を示す」の、いちばん強い実例です。ただし対象は「宣言した対称性を、実装（量子化）が壊す」場合に限られます。
        - cscl では、970571b の前の状態がこの形に当たります。文法は neg を「述べられていない」と宣言していたのに、runtime はそれを偽と読んでいました。その結果、開世界で生成の動詞が動きませんでした。

        ## 2. 対称性が破れていても正しい例：パリティの破れ
        - 1957 年の Wu の実験で、弱い相互作用は鏡映対称性（P）を破ることが分かりました。後に CP 対称性の破れも見つかっています。
        - σ は P と同じく、2 回かけると元に戻る離散的な対称性です。
        - 物理の教訓は、離散的な対称性が成り立つかは観察で決まることで、「成り立つべき」とは言えません。
        - 「対称でないから欠陥」と一般に言うことには、物理はむしろ反例を出しています。

        ## 3. 法則は対称で、状態は対称でない：自発的対称性の破れ
        - 法則（ハミルトニアン）は対称でも、実現する状態（真空）は対称性の一方を選ぶことがあります。強磁性体の磁化の向きがその例です。
        - cscl で測った結果は、この形によく似ています。
          - 読み方と歩み（法則の側）は、σ で食い違いません（1.0）。
          - 中身（状態の側）は非対称です。閉世界を選ぶ領域しかなく、限定はほとんどが肯定で、否定の対を持つ動詞も少数です。
        - 閉世界を前提に置くことは、真空を 1 つ選ぶことに当たります。

        ## ここから立てられる仮説

        物理に合わせると、仮説を 2 つに分けるのが筋です。

        - **(A) 異常型**：意味として宣言した対称性を、実装（type_checker・runtime）が壊すなら、それは欠陥である。
          - 物理では強く支持されている形です。cscl では既知の例が 1 件あります（970571b の前）。
        - **(B) 中身の対称性**：定義の中身が対を欠くこと自体は、欠陥ではない（明示的な破れや自発的な破れと同じ）。
          - 今回の `h_symmetry_soundness` の結果（向きは合うが有意でない）は、(B) と矛盾しません。

        今回確かめたのは、中身の対称性です。物理で裏付けがあるのは (A) のほうなので、これは測っていません。

        (A) を確かめる方法の候補もあります。runtime と type_checker の、意味の解釈に関わる箇所をわざと変える変異を作ります。σ を壊す変異と壊さない変異を同じ数だけ作り、σ と関係のない検査がどれだけ失敗するかを比べます。σ と関係のない検査とは、実行の記録の検査、exp の観察、issue 同期などです。

        (A) と (B) に分けて仮説を登録し直しますか。
