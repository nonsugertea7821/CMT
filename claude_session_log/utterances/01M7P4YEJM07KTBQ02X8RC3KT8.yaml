      text: |
        その直観は、今回見えたものとよく合っていると思います。言葉の発達の研究に、ほぼ同じ現象があります。

        **過大拡張（overextension）**
        - 子どもは、覚えたての語を広く使いすぎます。四本足の動物を全部「わんわん」と呼ぶ、というものです。
        - 語の意味が、まだ「四本足」のような一般的な特徴だけでできているからです。
        - 特徴が増えていくと、「わんわん」と「にゃんにゃん」が分かれます。これが分化です。

        体系で起きていることを並べると、こう対応します。

        | 発達の言葉 | この体系で見えたもの |
        |---|---|
        | 未分化な概念 | 一番上の方の端だけで定義された概念（money は「過程を測るもの」、verb_ref は「起きることを指すもの」） |
        | 過大拡張 | 定義の薄い概念が、時間や出席まで下に集めてしまう（違反の 9 件） |
        | 分化の一歩 | 式の端を 1 か所、1 段だけ狭める（正しい上下関係 33 組中 32 組がこの形。段数は 25 組が 1） |
        | 発達水準 | 定義の端の深さ |

        なので「違反」と呼んでいた 9 件は、誤りというより**まだ分化していない概念の過大拡張**と読めます。money に単位を足すのは、money を一段発達させることに当たります。

        **式で検出できる形にすると**
        この直観は測れる予測を出します。
        1. **過大拡張の予測:** 定義の端が浅い概念ほど、下に入れと言われる組（r_candidate）が多い。今回の 9 組だけでなく、すべての概念で測れます。今回の数を見てから選んだ問いではないので、新しいデータでの検証になります。
        2. **分化は一歩ずつの予測:** 正しい上下関係では、狭めるのは 1 か所・1 段が普通です。これはもう見えていますが、登録して測ったものではありません。
        3. **発達させれば過大拡張が消える予測:** money に単位を足すと、money への違反が規則だけで消え、sales のような正しい下位は残る。これが操作による確かめです。

        **気をつける点**
        - 今の「深さ」は、概念そのものの深さではありません。概念の定義の式の端の深さです。直観の「階層の深さ」がどちらを指すかで、測るものが変わります。私は、端の深さの方が「どれだけ分化した特徴で定義されているか」を表すので、発達水準に近いと考えます。
        - 深さは、ontology の枝分かれの細かさにも左右されます。土台側（ontology・syntax）と、話題の領域（subj）では、深さの意味がずれる可能性があります。

        **順番の提案**
        先に 1（過大拡張の予測）を登録して、すべての概念で測ります。そのあと 3（money に単位を足す）を「発達させる操作」として測ります。単位の式の足し方は検討の途中で、ファイルはまだ何も変えていません。

        この順で進めてよいか教えてください。
