        概念を立体として測るという考えを、仮説として登録しました。PR #653 です。

        **登録した仮説**
        - 名前は `h_sibling_discrimination_on_region` です。
        - 中身は「兄弟概念を見分けられるかどうかは、概念が立体として表されているかどうか、つまり中点が成員の中に落ちるかどうかで決まる」です。
        - 式は `v_rely(sibling_discrimination, midpoint_membership)` で、新しい概念は足していません。
        - そのため登録だけの PR として、検査が通れば自動でマージされる見込みです。
        - ロードマップの決定 d_road_region の根拠として結んであります。

        **立体として測る手順の案**
        まだ事前登録はしていません。確かめるときに、別のブランチで事前登録します。
        1. 一つの概念、たとえば丙票について、文脈を変えた文をたくさん作ります。
        2. それぞれの文で、ラベルの位置の隠れ状態を集めます。これが、その概念の点の雲になります。
        3. 兄弟の組ごとに、二つの雲の分かれ方を測ります。測るのは次の三つです。
           - 二つの成員の中点が、その概念の雲の中に落ちるか。
           - 雲が上位の概念（票）の雲に含まれるか。
           - 兄弟の雲と交わるか。
        4. その値から、E33 型の見分けの成績（両方の順で正解した数と余裕）を予測できるかを見ます。予測できれば、この仮説を支持します。

        **ほかの進み**
        - E33 はペア 9 の途中まで進んでいます。ペア 8 の round も、ほかのペアと同じく 4 問すべて外れのままで、両方の順で正解したのは 1/4 でした。
        - 先の三つの部品の名前を付ける登録（PR #652）は、修正後の検査が通りました。概念を足しているので自動マージはされず、手で見ていただく必要があります。

