        ご指摘のとおりで、「誤りの種類を表す概念がない」も確かめていない主張でした。それを登録しない理由にしていました。対になる 2 つの仮説として登録し、PR #704 を立てました。

        - **`h_error_kind_is_law`**: 型検査の結果の種類は、破られた法則で与えられる、という仮説です。式は `v_depend(type_check_result, syntax.laws)` です。
          - 正しければ、「誤りの種類」という概念を足す必要はありません。体系にある法則（syntax.laws）が、すでにその役を持っていることになります。
          - 反証なら、新しい概念が要ります。
        - **`h_rejection_by_few_laws`**: モデルが書いた行が退けられる理由は、少数の法則に集まる、という仮説です。式は `v_depend(formalization_accuracy, syntax.laws)` です。
          - 集まるなら、その法則を教えることで、書けた割合を上げる道が開けます。
          - E37 の結果ファイルには、退けられた行ごとに誤りの文が記録されています。前の仮説が立てば、それを法則ごとに数えるだけで確かめられます。

        どちらも d_road_checker に v_ground で結びました。登録だけの PR なので、ランナーの spec が通れば自動マージに乗るはずです。

        ロードマップ上の位置: 検査器の道 d_road_checker に、E37 の次の仮説を 2 つ足しました。H2（d_metric の直下の E36）は走っています。
