      text: |
        「言い換え」を、衝突しやすい語をそのまま使わせず、別の語や定義を展開した表現に置き換えさせる運用、と読んで答えます。違っていたら教えてください。

        その読みなら、効果があるという感触は今回の結果と合います。

        ## 実験結果との対応

        | 語の種類 | 定義を直前に置いたときの正答率 |
        |---|---|
        | 一般語に別の意味を与えた場合（衝突する設問） | 0.58 |
        | 新しく作った語（分化した兄弟概念） | 1.00 |
        | 新しい語への置換 | 1.00 |

        モデルは、元の意味を持たない語なら文章の定義に素直に従います。言い換えは、モデルが元から持つ意味との衝突を外す操作なので、効くのは理屈に合います。

        ## 想定される限界

        - **言い換える判断そのものが、同じ弱点を持ちます。** 「この『社員』はプロジェクトの意味だ」と気づいて言い換える工程は、元の意味に引かれたモデルが担います。気づかずに素通しする誤りは残るはずです。
        - **用語集に埋めると落ちます。** 新しい語でも、55定義の中に置くと 1.00 から 0.75、0.62 に下がりました。言い換え先の定義は、関係するものだけを近くに置く必要があります。
        - **出力側で元の語に戻る可能性があります。** 生成した文章で言い換え後の語を使い続けるかは、別途の検査（語彙リント）が要ります。

        ## 確かめ方

        「効果はありそうに見える」を数値にできます。いまの再定義の設問で、次の2条件を足して比べます。

        1. **改名**: 語を、元の意味を持たない新しい語に置き換え、同じ定義を渡す。
        2. **展開**: 設問の中の語を、定義の内容そのものに置き換える。

        これで「一般語のまま定義を渡す（0.58）」「改名」「展開」「ベクトル（0.79）」を同じ設問で並べられます。API 型のモデルで取れる最善手がどこまで届くかの目安になります。

        いま回している生成の評価が終わったら、続けてこれを実行します。
