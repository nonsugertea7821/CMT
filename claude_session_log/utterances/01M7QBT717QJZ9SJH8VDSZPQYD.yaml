        #210 の衝突を解いて push しました（284147b）。#211 で入った登録と、#210 の結果を、claims.yaml の同じ箇所で両方残しています。tc と ec は手元で通りました。#210 は CI が通れば、マージできる状態になるはずです。

        衝突が会話に返ってくるようにする仕組みは、PR #213 に出しました。

        - **なぜ届かなかったか:** PR を見張る仕組みで会話に届くのは、コメント、CI、review です。衝突そのものは届きません。
        - **どうしたか:** main への push のたびに、開いている PR が衝突していないかを調べます。衝突していれば、その PR にコメントを書きます。そのコメントが会話に届きます。
        - **自動マージの後:** 自動マージでできた push では、ほかのワークフローが動きません。そこで、自動マージのワークフローの最後にも同じ確認を足しました。

        「フック」と言われたのは、Claude Code のフックのことだったかもしれません。ただ、Claude Code のフックは GitHub 側の変化を受け取れないので、GitHub のワークフローにしました。

        ワークフローを変える PR なので、手で見てください。手元で確かめたのは構文だけです。実際に動くかは、マージした後の main への push で分かります。
