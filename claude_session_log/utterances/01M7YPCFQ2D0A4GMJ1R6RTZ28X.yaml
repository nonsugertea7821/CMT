      text: |
        はい、仕組みの上では「影を材料にしている」と言ってよいと思います。ただし、使っている影は座標軸（成分）への影ではありません。この想像は仮説として登録しました（PR #655）。

        **1. モデルは影を材料にしているか**
        - モデルの中で隠れ状態を読む操作は、どれも「ある向き w への射影 ⟨h, w⟩」です。つまり、ある向きに落とした影の長さです。注意の query と key も、MLP の各ニューロンへの入力も、すべてこの形をしています。
        - この w は斜めの向きなので、第 i 成分の影ではありません。
        - MLP は、その影の長さに非線形の関数をかけます。これは、影がある値を超えたかどうかで空間を二つに切る（半空間で切る）ことにあたります。
        - 半空間をたくさん組み合わせると、多面体のような立体を切り出せます。
        - このモデル（Qwen2.5-1.5B）の MLP は、1 層に 8960 個のニューロンを持ちます。つまり 1 層あたり 8960 方向から影を見ています。
        - ですから、モデルは立体そのものを一度に見ているわけではありません。たくさんの向きからの影を組み合わせて、立体を扱っているのだと思います。CT が多くの方向の投影から立体を組み立てるのに似ています。

        **2. 次元が多いと形を正しく扱えるか**
        これは見込みであって、確かめてはいません。
        - 次元が増えると、ほぼ直交する向きを置ける数は、次元に対して指数的に増えます。そのため、たくさんの概念を、互いに干渉させずに置けるようになります（Elhage 2022 の重ね合わせの議論）。
        - 次元が少ないと、兄弟の立体が同じ向きを分け合うことになり、互いに干渉しやすくなります。
        - 先行研究として、大きいモデルほど表現が互いに似ていく、という主張があります（Huh ほか 2024、Platonic Representation Hypothesis）。これは「大きいモデルほど、共通の概念空間の形に近づく」とも読めます。

        **3. 見る次元によって、立体の範囲の認識が変わりうるか**
        変わりえます。ご想像の「見る向き」がまさに要点です。
        - 高い次元で交わっていない二つの立体でも、低い次元へ射影すると影が重なることがあります。逆に、影が重ならなければ、元の立体も交わっていません。
        - ですから、低い次元で持つことで失われるのは、多くの場合「離れていること」の情報のほうです。
        - E33 で、丙票と丁票のどちらとも決めない（余裕がほぼ 0）状態になったのは、「1536 次元の影の中では、二つの立体が重なっている」と読むこともできます。これは解釈で、確かめてはいません。
        - ただ、厳密には、別々のモデルが「同じ立体を違う次元から見ている」わけではありません。それぞれのモデルが、それぞれ自分の空間に概念を写していて、写せる細かさが次元によって違う、と言うほうが正確です。

        **登録した仮説（PR #655）**
        - 名前は `h_width_raises_sibling_discrimination` です。中身は「隠れ状態の次元が多いほど、兄弟概念を見分けやすくなる」です。
        - 「次元の多い隠れ状態」という概念を新しく足したので、PR #655 は手で見ていただく必要があります。
        - 確かめ方の案: 同じ系列の Qwen2.5 の 0.5B（896 次元）、1.5B（1536 次元）、3B（2048 次元）で、同じ兄弟の組を見分けられるかを比べます。
          - この三つは、次元のほかに層の数や学習量も違います。そのため、次元だけの効果としては分けられません。この点は開示したうえで測ります。
          - 先に登録した立体の測り方（PR #653）と組み合わせると、「次元が多いほど兄弟の雲が交わりにくくなるか」も直接見られます。

        本線 b 領域の道（d_road_region、PR #653・#655）
