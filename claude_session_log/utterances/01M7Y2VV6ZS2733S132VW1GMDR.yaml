        同期の時間が「件数 × 行数」で増えるかを過去の実行時間で確かめたところ、判定は反証でした（#626）。ただしこれは、履歴からは見分けられなかったという意味です。二乗ではないと分かったわけではありません。

        **結果**
        - push で動いた過去 87 回の実行時間を、その時点の仮説・決定の数（78〜330）と yaml の行数（4614〜15254）に当てはめました。
        - 当てはまりの良さ（決定係数、1 に近いほどよく合う）は次のとおりです。

        | モデル | 当てはまり |
        |---|---|
        | 時間 ∝ 行数（線形） | 0.651 |
        | 時間 ∝ 件数 × 行数（二乗に近い） | 0.647 |

        - 事前の基準は「積のほうがよく合い、かつ 0.7 以上」でした。どちらも満たさないので反証です。

        **解釈**
        - 履歴の上では、件数と行数がほぼ一緒に増えてきました（相関 0.989）。そのため二つのモデルはほとんど区別できません。これは手順を書いたときに予め開示した懸念のとおりです。
        - 手元で内訳を測ると、1 件ごとの全行の読み直しが時間の約半分を占めていました。直す価値は変わりません。
        - 本当に二乗かを分けるには、行数を固定して件数だけを変える測りが要ります。

        **次にやること**
        直しの実装に入ります。索引化と、ご提案の増分化（キャッシュ）を一つの PR で出します。効果は、直したあとの実行時間で測ります。ワークフローを変えるので、手で見てもらう扱いになります。増分化の仮説の登録（#625）は、CI が通れば自動でマージされる見込みです。

