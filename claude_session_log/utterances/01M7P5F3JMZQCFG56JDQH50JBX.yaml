        登録してから（49fba98）測りました。分化の操作には、はっきりした規則性がありました。ただ、典型だと予想していた操作は外れました。

        **結果**
        体系のすべての直接の上下関係 466 辺で、下位の概念が上位に足した式 490 個を、操作の種類に分けました。

        | 操作 | 式の数 | 割合 |
        |---|---|---|
        | 新しい特徴を足す | 238 | 49% |
        | 端のなかった式に端を決める | 157 | 32% |
        | 否定する | 41 | 8% |
        | 端を狭める | 30 | 6% |
        | どれにも入らない | 18 | 4% |
        | 動詞を狭める | 6 | 1% |
        | 数を限る | 0 | 0% |

        登録した 3 つの判定は、次のとおりです。
        - (a) 操作の種類は少ない: 満たしました。どれにも入らないのは 4% です。
        - (b) 一歩ずつ進む: 満たしました。1 辺で足す式は、95%（442/466）が 1 つだけです。
        - (c) 端を狭めるのが典型: 外れました。6% しかありません。前に見た「32/33 が端を 1 段狭める」は、洗練の対がある組だけを選んだための偏りでした。

        **解釈**
        分化はこう進んでいる、と読めます。
        1. **一度に特徴を 1 つだけ足す。** 95% がそうなので、これは体系の規則と言ってよいほど強い傾向です。
        2. **足し方は、ほぼ 2 通り。** 「新しい特徴を加える」（49%）か、「すでにある特徴の相手を決める・狭める」（38%）です。残りは否定（8%）です。

        これを違反の 9 件に当てはめると、次のように説明がつきます。
        - money は、大きさから「過程を測る」を 1 歩足しただけの概念です。発達の 1 段目で止まっています。
        - 名前の「円」に当たる区別は、本来は「新しい特徴を足す」でもう 1 歩進めるべきものでした。それがされていないので、hour のような「相手を狭めただけ」の概念と区別できません。
        - money に単位を足すことは、体系で一番よく使われている操作（新しい特徴を足す）を 1 回行うことに当たります。

        **ここから出てくる考え（登録していない、結果を見た後の読み）**
        分化が「1 歩に特徴 1 つ」で進むなら、概念の発達水準は**根から何歩分化したか**で測れるはずです。つまり、受け継いだ分を含めて、その概念が持つ式の数です。前回の「端の深さ」は発達水準を測る物差しとしてずれていて、だから予測が 2.2 倍で外れたのかもしれません。違反の上側の概念は、どれも持つ式が 3〜5 個と少なかったので、筋は合います。

        **記録**
        - 結果ファイル・exp.yaml の測定・claims.yaml の観察 3 件を足しました。
        - 検査ツール（exp_check.py）は通りました。
        - claude/cross に push 済みです（f5373a1）。

        **次の候補**
        1. 発達水準を「持つ式の数（何歩分化したか）」として、過大拡張の予測を登録して測り直す。
        2. money に単位を足す操作（新しい特徴を 1 つ足す）をして、違反が規則だけで消えるかを測る。

        私は 1 → 2 の順を勧めます。1 で物差しが決まれば、2 は「money を 1 段発達させたら過大拡張が止まるか」という、はっきりした確かめになるからです。どうしますか。
