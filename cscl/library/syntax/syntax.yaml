domain: syntax

grammar:
  grammar: [system, nodes, mod, cmp, base, axes, run, position, rel, function, value, logic, runtime, strategy, world, laws, rule_word, use_word, domain, individuals, facts, grammar]
  system: [base, axes, nodes, individuals, facts, runtime, grammar]
  nodes: [display, gloss, extends, from, to, new_kind, holds, pre, post, always, sometime, ranges, form, of, with, at, neg, mod, val, cmp, axis, many, opposite, derive, via, verbatim]
  mod: [of, with, neg, quant, at]
  cmp: [axis, a, b, rel]
  base: [display, arity, system_act]
  axes: [display, source, value, extends]
  run: [individuals, facts, steps, expect, halted]
  position: [from, to, new]
  rel: [same, differ]
  function: [gt, ge, lt, le]
  value: [number, literal]
  logic: [not, all, some, between]
  runtime: [pre_rule, post_rule, law_check, binding, choice, progress]
  strategy: [replace, every_step, distinct, recorded, changes_state]
  world: [world, closed_world]
  laws: [law_rule, law_given]
  rule_word: [v_assume, v_derive, v_require, v_govern, variable, law_relation]
  use_word: [v_use, v_presume]
  domain: [domain, axes, nodes, individuals, facts]
  individuals: [is, display, val]
  facts: [is, from, to, new, at, neg, val]

base:
  above: {display: 上位である, arity: 2}

nodes:
  state: {display: 状態, extends: passage, mod: {of: [v_compose, to], with: facts}}
  role_depend_from_rewrite_rule: {display: 書き換えの規則へ依存する役割, extends: role, mod: {of: [v_depend, from], with: rewrite_rule}}
  rewrite_rule: {display: 書き換えの規則, extends: definition, mod: refer_from_post}
  refer_from_post: {display: 後の状態の指定へ述べる（始点）, extends: quality, of: [v_refer, from], with: post}
  refer_from_laws: {display: 法則へ述べる（始点）, extends: quality, of: [v_refer, from], with: laws}
  word: {display: 語, extends: information_entity_express_from_natural_language, mod: {of: [v_compose, from], with: sentence}}
  v_refer: {display: 述べる, extends: occurrent, from: continuant, to: any, holds: [{is: refer, from: from, to: to}]}
  v_agree: {display: 一致する, extends: occurrent, from: continuant, to: continuant, holds: [{is: refer, from: from, to: new}, {is: refer, from: to, to: new}]}
  sentence: {display: 文, extends: information_entity_compose_to_word, mod: {of: [v_express, from], with: language}}
  role: {display: 役割, extends: realizable_entity, mod: {of: [v_depend, from], with: definition}}
  referrer: {display: 述べるもの, form: [v_refer, from]}
  refer_from_concept: {display: 概念へ述べる（始点）, extends: quality, of: [v_refer, from], with: concept}
  refer_to_sentence: {display: 文から述べられる（終点）, extends: quality, of: [v_refer, to], with: sentence}
  natural_language: {display: 自然言語, extends: language, mod: {of: [v_design, to], neg: true}}
  language: {display: 言語, extends: information_entity, mod: {of: [v_express, to]}}
  information_entity_express_from_natural_language: {display: 自然言語へで書かれる情報, extends: information_entity, mod: express_from_natural_language}
  information_entity_compose_to_word: {display: 語を部分に持つ情報, extends: information_entity, mod: {of: [v_compose, to], with: word}}
  information_entity: {display: 情報, extends: generically_dependent_continuant, mod: {of: [v_refer, from]}, many: true}
  express_from_natural_language: {display: 自然言語へで書かれる（始点）, extends: quality, of: [v_express, from], with: natural_language}
  definition: {display: 定義, extends: sentence, mod: refer_from_concept}
  concept: {display: 概念, extends: inference, mod: {of: [v_trigger, to], with: word}}
  agreeing: {display: 一致するもの, form: [v_agree, from]}
  agreed: {display: 一致する相手, form: [v_agree, to]}
  refer_from_facts: {display: 事実へ述べる（始点）, extends: quality, of: [v_refer, from], with: facts}
  refer_from_occurrent: {display: 生起体へ述べる（始点）, extends: quality, of: [v_refer, from], with: occurrent}
  compose_from_system: {display: 体系へ部分になる（始点）, extends: quality, of: [v_compose, from], with: system}
  express_from_cscl: {display: 概念体系制御言語へで書かれる（始点）, extends: quality, of: [v_express, from], with: cscl}
  refer_from_p: {display: 関係づけるへ述べる（始点）, extends: quality, of: [v_refer, from], with: p}
  not_compose_from_mod: {display: 修飾の指定へ部分になる（否定）（始点）, extends: quality, of: [v_compose, from], with: mod, neg: true}
  refer_from_value: {display: 値へ述べる（始点）, extends: quality, of: [v_refer, from], with: value}
  refer_from_third_participant: {display: 第三のものへ述べる（始点）, extends: quality, of: [v_refer, from], with: third_participant}
  refer_from_state_relation: {display: 状態の関係へ述べる（始点）, extends: quality, of: [v_refer, from], with: state_relation}
  come_before_from_post: {display: 後の状態の指定へ前に置かれる（始点）, extends: quality, of: [v_come_before, from], with: post}
  refer_from_magnitude: {display: 大きさへ述べる（始点）, extends: quality, of: [v_refer, from], with: magnitude}
  refer_from_sentence: {display: 文へ述べる（始点）, extends: quality, of: [v_refer, from], with: sentence}
  refer_from_individuals: {display: 個体へ述べる（始点）, extends: quality, of: [v_refer, from], with: individuals}
  refer_from_variable: {display: 変数へ述べる（始点）, extends: quality, of: [v_refer, from], with: variable}

  v_collect: {display: 成員の種類にする, extends: v_refer, from: kind_collection, to: continuant}
  v_measure: {display: 測る, extends: occurrent, from: continuant, to: any, holds: [{is: refer, from: from, to: to}, {is: depend, from: from, to: to}]}

  kind_collection: {display: 種類の集まり, extends: information_entity, mod: {of: [v_collect, from]}}
  system: {display: 体系, extends: information_entity, mod: {of: [v_compose, to], with: concept_expression, at: {count: {gt: 1}}}}
  cscl: {display: 概念体系制御言語, extends: language, mod: {of: [v_depend, from], with: system}}
  definition_compose_from_system: {display: 体系の部分である定義, extends: definition, mod: compose_from_system}
  concept_expression: {display: 概念式, extends: definition_compose_from_system, mod: express_from_cscl}
  passage: {display: 文章, extends: information_entity, mod: {of: [v_compose, to], with: sentence}, verbatim: true}
  passage_express_from_natural_language: {display: 自然言語へで書かれる文章, extends: passage, mod: express_from_natural_language}
  information_entity_express_from_cscl: {display: 概念体系制御言語へで書かれる情報, extends: information_entity, mod: express_from_cscl}
  identifier: {display: 識別子, extends: information_entity_express_from_cscl, mod: {of: [v_refer, from], with: concept_expression, at: {count: 1}}}
  pattern: {display: 識別子の雛形, extends: information_entity, mod: {of: [v_refer, from], with: identifier, at: {count: {gt: 1}}}, verbatim: true}
  information_entity_refer_from_p: {display: 関係づけるへ述べる情報, extends: information_entity, mod: refer_from_p}
  axis: {display: 軸, extends: information_entity_refer_from_p, mod: {of: [v_compose, to], with: value}}
  value: {display: 値, extends: information_entity, mod: {of: [v_compose, from], with: axis}}
  expression_part: {display: 概念式の部分, extends: information_entity, mod: {of: [v_compose, from], with: concept_expression}}
  display: {display: 表示語, extends: word, mod: {of: [v_agree, from], with: identifier}, verbatim: true}
  gloss: {display: 説明文, extends: passage_express_from_natural_language, mod: refer_from_concept}
  extends: {display: 上位の指定, extends: expression_part, mod: {of: [v_refer, from], with: kind}}
  position: {display: 位置, extends: expression_part, mod: refer_from_p}
  form: {display: 形の指定, extends: position, mod: not_compose_from_mod}
  mod: {display: 修飾の指定, extends: expression_part, mod: {of: [v_compose, to], with: position}}
  with: {display: もう一方の端の指定, extends: expression_part, mod: {of: [v_refer, from], with: participant}}
  neg: {display: 示されていないことの指定, extends: expression_part, mod: refer_from_facts}
  many: {display: 複数を許す指定, extends: expression_part, mod: {of: [v_refer, from], with: kind, at: {count: {gt: 1}}}}
  opposite: {display: 反対の動詞の指定, extends: expression_part, mod: refer_from_occurrent}
  derive: {display: 中身から導く比較の結果の指定, extends: expression_part, mod: {of: [v_refer, from], with: rel}}
  via: {display: 比べる中身を述べる動詞の指定, extends: expression_part, mod: {of: [v_refer, from], with: occurrent, at: {count: 1}}}
  verbatim: {display: 値をそのまま持つ指定, extends: value_part, mod: {of: [v_refer, from], with: literal}}
  quant: {display: 数量化の指定, extends: expression_part, mod: {of: [v_refer, from], with: participant, at: {count: {gt: 1}}}}
  value_part: {display: 値の指定, extends: expression_part, mod: refer_from_value}
  at: {display: 修飾の中の値の指定, extends: value_part, mod: {of: [v_compose, from], with: mod}}
  val: {display: 概念が取る値の指定, extends: value_part, mod: not_compose_from_mod, verbatim: true}
  cmp: {display: 比較の指定, extends: expression_part, mod: {of: [v_refer, from], with: value, at: {count: 2}}}
  rel: {display: 比べた結果, extends: quality, mod: {of: [v_depend, from], with: cmp}}
  from: {display: 始点の位置, extends: position, mod: {of: [v_refer, from], with: s}}
  to: {display: 終点の位置, extends: position, mod: {of: [v_refer, from], with: o}}
  new_kind: {display: 第三のものの種類の指定, extends: with, mod: refer_from_third_participant}
  holds: {display: 成り立つ状態の指定, extends: expression_part, mod: refer_from_state_relation, verbatim: true}
  pre: {display: 前の状態の指定, extends: holds, mod: come_before_from_post, verbatim: true}
  post: {display: 後の状態の指定, extends: holds, mod: {of: [v_come_after, from], with: pre}, verbatim: true}
  always: {display: どのステップでも成り立つ状態の指定, extends: holds, mod: {of: [v_refer, from], with: state_relation, quant: all}, verbatim: true}
  sometime: {display: あるステップで起こる変化の指定, extends: expression_part, mod: {of: [v_compose, to], with: pre}, verbatim: true}
  ranges: {display: 変数が動く範囲の指定, extends: expression_part, mod: refer_from_variable}
  arity: {display: 端の数, extends: magnitude, mod: {of: [v_measure, from], with: state_relation}}
  sentence_refer_from_state_relation: {display: 状態の関係へ述べる文, extends: sentence, mod: refer_from_state_relation}
  laws: {display: 法則, extends: sentence_refer_from_state_relation, val: {truth: true}}
  law_rule: {display: 規則で書いた法則, extends: laws, mod: {of: [v_assume, from], with: premise}}
  law_given: {display: 意味を検査が与える法則, extends: laws, mod: {of: [v_assume, from], with: premise, neg: true}}
  premise: {display: 法則の前提, extends: sentence_refer_from_state_relation, mod: {of: [v_assume, to], with: law_rule}, many: true}
  derived: {display: 法則が導く文, extends: sentence_refer_from_state_relation, mod: {of: [v_derive, to], with: law_rule}, many: true}
  required: {display: 法則が求める文, extends: sentence_refer_from_state_relation, mod: {of: [v_require, to], with: law_rule}, many: true}
  v_assume: {display: 前提に置く, extends: v_refer, from: law_rule, to: premise}
  v_derive: {display: 導く, extends: v_refer, from: law_rule, to: derived}
  v_require: {display: 成り立つことを求める, extends: v_refer, from: law_rule, to: required}
  variable: {display: 変数, extends: expression_part, mod: {of: [v_refer, from], with: law_rule}}
  law_relation: {display: 導いた関係, extends: expression_part, mod: {of: [v_refer, to], with: derived}}
  v_govern: {display: 掛かる, extends: v_refer, from: law_given, to: information_entity}
  system_act: {display: 体系そのものの行為, extends: v_refer, from: system}
  grammar_rule: {display: 文法の規則, extends: sentence, mod: {of: [v_refer, from], with: expression_part}}
  grammar: {display: 文法の記述, extends: section, mod: {of: [v_compose, to], with: grammar_rule, at: {count: {gt: 1}}}}
  new: {display: 第三の位置, extends: position, mod: refer_from_third_participant}
  of: {display: 位置の指定, extends: expression_part, mod: {of: [v_refer, from], with: position}}
  section: {display: 体系の節, extends: information_entity, mod: compose_from_system}
  base: {display: 基礎の節, extends: section, mod: refer_from_state_relation}
  state_relation: {display: 状態の関係, extends: continuant, mod: {of: [v_compose, from], with: base}}
  axes: {display: 軸の節, extends: section, mod: {of: [v_refer, from], with: axis}}
  nodes: {display: ノードの節, extends: section, mod: {of: [v_refer, from], with: concept_expression}}
  source: {display: もとになる関係の指定, extends: holds, mod: {of: [v_compose, from], with: axes}}

  function: {display: 関数, extends: value, mod: refer_from_value}
  gt: {display: より大きいという判定, extends: function, mod: {of: [v_come_after, from]}}
  ge: {display: 以上という判定, extends: function, mod: not_before_from}
  lt: {display: より小さいという判定, extends: function, mod: {of: [v_come_before, from]}}
  le: {display: 以下という判定, extends: function, mod: not_after_from}
  number: {display: 数の値, extends: value, mod: refer_from_magnitude}
  literal: {display: 文字の値, extends: value, mod: {of: [v_refer, from], with: word}}
  value_not_before_from: {display: 前には置かれない値, extends: value, mod: not_before_from}
  between: {display: 範囲の判定, extends: value_not_before_from, mod: not_after_from}

  logic: {display: 述語論理の語, extends: word, mod: refer_from_sentence}
  rule_word: {display: 法則を組み立てる語, extends: word, mod: {of: [v_compose, to], with: laws}}
  use_word: {display: 領域の宣言を組み立てる語, extends: word, mod: {of: [v_compose, to], with: domain}}
  sentence_refer_from_sentence: {display: 文へ述べる文, extends: sentence, mod: refer_from_sentence}
  not: {display: 否定（示されていない文を述べる文）, extends: sentence_refer_from_sentence, mod: refer_from_facts}
  world: {display: 書かれていない文の扱い, extends: definition, mod: refer_from_facts}
  closed_world: {display: 閉世界（書かれていない文は偽）, extends: world, val: {truth: false}}
  v_presume: {display: 前提として置くと述べる, extends: v_refer, from: domain, to: world}
  some: {display: 存在の数量化, extends: sentence, mod: {of: [v_refer, from], with: participant, at: {count: {ge: 1}}}, many: true}
  all: {display: 全称の数量化, extends: not, mod: {of: [v_refer, from], with: some}}
  individuals: {display: 個体, form: [is, from]}
  facts: {display: 個体か種類についての文（種類についての文は、その種類のすべてについて）, extends: sentence, mod: refer_from_individuals}
  expect: {display: 期待する文, extends: facts, val: {truth: true}}

  domain: {display: 領域, extends: passage, mod: {of: [v_compose, to], with: concept_expression}, many: true}
  v_use: {display: 使う, extends: v_depend, from: domain, to: domain}

individuals:
  syntax: {is: domain, display: 構文}
  r_parent: {is: law_relation, display: 上位である}
  r_ancestor: {is: law_relation, display: 祖先である}
  r_deep_end: {is: law_relation, display: 深い端を持つ}
  r_shallow: {is: law_relation, display: 浅い端だけで定義される}
  r_end_from: {is: law_relation, display: 始点の種類である}
  r_end_to: {is: law_relation, display: 終点の種類である}
  r_end_new_kind: {is: law_relation, display: 第三のものの種類である}
  r_kind_up: {is: law_relation, display: 種類として上である}
  r_below: {is: law_relation, display: 種類として下である}
  r_limit: {is: law_relation, display: 限定である}
  r_own: {is: law_relation, display: 自分で足した式である}
  r_acc: {is: law_relation, display: 積み上がった式である}
  r_adds: {is: law_relation, display: 上位にない式を足している}
  r_concept: {is: law_relation, display: 概念である}
  r_written: {is: law_relation, display: 領域に書かれた語が指す}
  r_root: {is: law_relation, display: 根である}
  r_verb: {is: law_relation, display: 動詞である}
  r_placed: {is: law_relation, display: 定義から根の下に置かれる}
  r_mod_lacks: {is: law_relation, display: 同じ動詞の同じ位置の限定で、相手の語のどれかを持たない}
  r_mod_differ: {is: law_relation, display: 同じ動詞の同じ位置の限定で、どちらかが相手の語のどれかを持たない}
  r_near: {is: law_relation, display: 上位の下にある別の概念である（見えるかを問わない）}
  r_pair: {is: law_relation, display: 比べる組である（兄弟か、上位の下にある別の概念）}
  r_lacks: {is: law_relation, display: 相手の式のどれかを（含意によっても）持たない}
  r_differ: {is: law_relation, display: どちらかが相手の式のどれかを持たない}
  r_candidate: {is: law_relation, display: 具体的な候補である}
  r_missing: {is: law_relation, display: 候補の式が欠けている}
  r_same_slot: {is: law_relation, display: 同じ動詞の同じ位置の限定である}
  r_qualified: {is: law_relation, display: 否定・数量・範囲の付いた限定である}
  r_entail: {is: law_relation, display: 限定として含意する}
  r_has: {is: law_relation, display: 式を（含意によっても）持つ}
  r_visible: {is: law_relation, display: 参照できる}
  parent_by_extends: {is: law_rule, display: extends に書いたものは上位}
  parent_by_is: {is: law_rule, display: 「属する」の始点として限定した種類は上位}
  ancestor_by_parent: {is: law_rule, display: 上位は祖先}
  ancestor_by_step: {is: law_rule, display: 上位の祖先は祖先}
  acyclic: {is: law_rule, display: 定義は自分自身を参照しない（自分の祖先にならない）}
  inherit_from_own: {is: law_rule, display: 端 from は自分に書いたもの}
  inherit_from: {is: law_rule, display: 端 from を書かなければ上位から引き継ぐ}
  inherit_to_own: {is: law_rule, display: 端 to は自分に書いたもの}
  inherit_to: {is: law_rule, display: 端 to を書かなければ上位から引き継ぐ}
  inherit_new_kind_own: {is: law_rule, display: 端 new_kind は自分に書いたもの}
  inherit_new_kind: {is: law_rule, display: 端 new_kind を書かなければ上位から引き継ぐ}
  kind_up_by_parent: {is: law_rule, display: 上位は種類として上}
  kind_up_by_form_from: {is: law_rule, display: 形（from）は、その位置の端の種類の下}
  kind_up_by_form_to: {is: law_rule, display: 形（to）は、その位置の端の種類の下}
  kind_up_by_form_new: {is: law_rule, display: 形（new）は、その位置の端の種類の下}
  kind_up_by_form_new_any: {is: law_rule, display: 第三の位置の種類が書かれていない形は any の下}
  below_self: {is: law_rule, display: 自分は自分の下}
  below_any: {is: law_rule, display: すべては any の下}
  one_spelling: {is: law_rule, display: 同じ領域で同じ綴りの語は、どこに書かれても同じものを指す}
  below_by_step: {is: law_rule, display: 種類として上のものの下は下}
  narrow_from: {is: law_rule, display: 下位の動詞の端 from は、上位の動詞の端を狭める}
  narrow_to: {is: law_rule, display: 下位の動詞の端 to は、上位の動詞の端を狭める}
  limit_by_mod: {is: law_rule, display: mod は限定}
  limit_by_val: {is: law_rule, display: val は限定}
  limit_by_cmp: {is: law_rule, display: cmp は限定}
  single: {is: law_rule, display: 1つのノードが足せる限定は1つだけ}
  own_by_limit: {is: law_rule, display: r_limit は自分で足した式}
  own_by_from: {is: law_rule, display: from は自分で足した式}
  own_by_to: {is: law_rule, display: to は自分で足した式}
  own_by_new_kind: {is: law_rule, display: new_kind は自分で足した式}
  own_by_axis: {is: law_rule, display: axis は自分で足した式}
  acc_own: {is: law_rule, display: 自分で足した式は積み上がった式}
  acc_ancestor: {is: law_rule, display: 祖先が足した式は積み上がった式}
  adds: {is: law_rule, display: 上位に積み上がっていない式を自分で足している}
  concept_kind: {is: law_rule, display: 上位を持ち、修飾語・形・動詞でないものは概念}
  root_kind: {is: law_rule, display: 上位も形も位置の指定も状態も持たないものは根}
