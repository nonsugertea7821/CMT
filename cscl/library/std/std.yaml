# CSCL の標準の語彙（std）。公理（axiom）から定義できるもの。
# 領域は axiom（axiom と同じ名前空間）。axiom の語を使って書く。axiom から std は参照しない。
# 種類（nodes）に加えて、std の語についての法則（individuals の law_rule と、その規則の facts）も置く。
nodes:
  independent_continuant: {display: 独立持続体, extends: continuant, mod: {of: [v_depend, from], neg: true}}
  disposition: {display: 傾向性, extends: realizable_entity, mod: {of: [v_depend, from], with: quality}}
  composable_set: {display: 合成について閉じた集合, extends: closed_set, mod: {of: [v_close, from], with: v_sum}}
  v_close: {display: について閉じている, extends: occurrent, from: kind_collection, to: verb_ref, holds: [{is: refer, from: from, to: to}]}
  v_sum: {display: 合成する, extends: occurrent, from: summand, to: summand, new_kind: summand,
          holds: [{is: part, from: from, to: new}, {is: part, from: to, to: new}, {is: depend, from: new, to: from}, {is: depend, from: new, to: to}]}
  model_inference: {display: モデルの推論, extends: inference, mod: {of: [v_perform, to], with: model}}
  summand: {display: 合成できる情報, extends: information_entity, mod: {of: [v_sum, from]}}
  closed_set: {display: 閉集合, extends: kind_collection, mod: {of: [v_close, from]}}   # 何について閉じているかは、下位の限定で決める
  rewrite_rule: {display: 書き換えの規則, extends: definition, mod: {of: [v_refer, from], with: post}}
  role_depend_from_rewrite_rule: {display: 書き換えの規則へ依存する役割, extends: role, mod: {of: [v_depend, from], with: rewrite_rule}}
  run.executor: {display: 実行器, extends: role_depend_from_rewrite_rule, mod: {of: [run.v_execute, from]}}
  run.halted: {display: 止まった状態, extends: run.state, mod: {of: [run.v_execute, to], neg: true}}
  run.steps: {display: 歩みの並び, extends: information_entity, mod: {of: [v_refer, from], with: run.v_execute, at: {count: {ge: 1}}}}
  run.strategy: {display: 実行の戦略, extends: definition, mod: {of: [v_refer, from], with: run.v_execute}}
  run.runtime: {display: 実行時の意味論の節, extends: section, mod: {of: [v_refer, from], with: run.strategy}}
  run.world: {display: 書かれていない文の扱い, extends: run.strategy, mod: {of: [v_refer, from], with: facts}}
  run.closed_world: {display: 書かれていない文は成り立たない, extends: run.world, val: {truth: false}}
  run.pre_rule: {display: 前の状態の確かめ方, extends: run.strategy, mod: {of: [v_refer, from], with: pre}}
  run.post_rule: {display: 後の状態の作り方, extends: run.strategy, mod: {of: [v_refer, from], with: post}}
  run.replace: {display: 否定の文を取り除き肯定の文を加える, extends: run.post_rule, mod: {of: [v_refer, from], with: not}}
  run.law_check: {display: 法則を確かめる時点, extends: run.strategy, mod: {of: [v_refer, from], with: laws}}
  run.every_step: {display: 1歩ごとに確かめる, extends: run.law_check, mod: {of: [v_come_after, from], with: run.steps}}
  run.binding: {display: 位置への個体の割り当て方, extends: run.strategy, mod: {of: [v_refer, from], with: individuals}}
  run.distinct: {display: 位置ごとに別の個体を割り当てる, extends: run.binding, cmp: [{axis: text, a: from, b: to, rel: differ}]}
  run.choice: {display: 当てはまる動詞の選び方, extends: run.strategy, mod: {of: [v_refer, from], with: run.steps}}
  run.recorded: {display: 実行の記録が選び方を与える, extends: run.choice, mod: {of: [v_depend, from], with: run.run}}
  run.progress: {display: 当てはまるとみなす条件, extends: run.strategy, mod: {of: [v_refer, from], with: run.halted}}
  run.changes_state: {display: 前の状態が成り立ち後の状態がまだ成り立っていない, extends: run.progress, mod: {of: [v_come_before, from], with: post}}
individuals:
  r_kpart: {is: law_relation, display: 種類として部分である}
  r_kdep: {is: law_relation, display: 種類として依存する}
  r_in: {is: law_relation, display: 集まりに属する}
  r_ind_kind: {is: law_relation, display: 個体の種類か、その上位である}
  r_closed_op: {is: law_relation, display: その動詞について閉じている}
  r_closed: {is: law_relation, display: 閉じている}
  r_closed_verb: {is: law_relation, display: どこかの閉集合が閉じている動詞である}
  r_ternary: {is: law_relation, display: 二つから第三のものを作る動詞である}
  r_op_of: {is: law_relation, display: 事実の動詞である（上位の動詞を含む）}
  r_in_op: {is: law_relation, display: その動詞について閉じた閉集合に属する}
  r_collected: {is: law_relation, display: 集まりが直接集めた種類である}
  r_defined: {is: law_relation, display: その動詞が定義されている}
  kpart_by_mod_from: {is: law_rule, display: 「X の部分である」と限定した種類は、種類として X の部分}
  kpart_by_mod_to: {is: law_rule, display: 「X を部分に持つ」と限定した種類は、種類として X を部分に持つ}
  kpart_by_sum_part: {is: law_rule, display: 「合成して X になる」と限定した種類は、種類として X の部分（部分の定義。合成する相手は問わない）}
  kpart_by_sum_whole: {is: law_rule, display: 「X と何かを合成してできる」と限定した種類は、種類として X を部分に持つ}
  kdep_by_mod: {is: law_rule, display: 「X に依存する」と限定した種類は、種類として X に依存する}
  kdep_by_sum: {is: law_rule, display: 合成してできたものは、合成する種類に依存する（生成の順序）}
  kpart_by_sum_fact_from: {is: law_rule, display: 合成する事実の始点は、合成してできたものの部分}
  kpart_by_sum_fact_to: {is: law_rule, display: 合成する事実の終点は、合成してできたものの部分}
  kdep_by_sum_fact_from: {is: law_rule, display: 合成してできたものは、合成する事実の始点に依存する}
  kdep_by_sum_fact_to: {is: law_rule, display: 合成してできたものは、合成する事実の終点に依存する}
  kpart_by_compose_fact: {is: law_rule, display: 種類どうしの「部分になる」事実は、種類としての部分}
  kdep_by_depend_fact: {is: law_rule, display: 種類どうしの「依存する」事実は、種類としての依存}
  kdep_inherit: {is: law_rule, display: 依存する種類の下位も、同じものに依存する}
  kdep_transitive: {is: law_rule, display: 種類としての依存は推移的}
  kdep_antisymmetric: {is: law_rule, display: 種類としての依存は反対称的（互いに依存するなら同じ種類）。生成の順序は逆に回らない}
  kpart_transitive: {is: law_rule, display: 種類としての部分は推移的}
  kpart_inherit: {is: law_rule, display: 部分である種類の下位も、同じ全体の部分}
  kpart_antisymmetric: {is: law_rule, display: 種類としての部分は反対称的（互いに部分なら同じ種類）}
  closed_under: {is: law_rule, display: 閉集合は、限定した動詞について閉じている。その動詞の始点が閉集合の成員（の下位）なら、終点も成員（の下位）}
  closed_under_back: {is: law_rule, display: 閉じている動詞の終点が閉集合に属するなら、始点も同じ閉集合に属する}
  closed_under_new: {is: law_rule, display: 閉じている動詞でできたものは、二つと同じ閉集合に属する}
  closed_under_some: {is: law_rule, display: どこかの閉集合が閉じている動詞の事実では、二つとも、その動詞について閉じた閉集合に属する}
  closed_under_mod: {is: law_rule, display: 閉じている動詞による限定では、限定される種類と相手の種類が同じ閉集合に属する}
  closed_under_mod_back: {is: law_rule, display: 閉じている動詞による限定の相手が閉集合に属するなら、限定される種類も属する}
  closed_under_mod_some: {is: law_rule, display: 閉じている動詞による限定では、二つとも、その動詞について閉じた閉集合に属する}
  closed_has_op: {is: law_rule, display: 閉集合は、何について閉じているかを限定している}
  closed_op_ternary: {is: law_rule, display: 閉じている動詞は、二つから第三のものを作る動詞}
  collection_level: {is: law_rule, display: 種類の集まりの成員は、1階の種類。種類の集まりそのものを成員にしない}
  op_defined: {is: law_rule, display: 閉集合に属する種類は、自分か上位の種類について、閉じている動詞（の事実か限定）が定義されている。集まりが直接集めた種類は、閉じていることで定義される}
  in_by_collect: {is: law_rule, display: 集まりが集めた種類は、その集まりに属する}
  in_inherit: {is: law_rule, display: 集まりに属する種類の下位も、その集まりに属する}
  ind_kind_self: {is: law_rule, display: 個体の種類}
  ind_kind_step: {is: law_rule, display: 個体の種類の上位}
  closed_op_by_mod: {is: law_rule, display: 閉集合が閉じている動詞は、その種類か上位の限定「V について閉じている」の V}
  closed_by_op: {is: law_rule, display: 閉じている動詞を持つ集まりは、閉じている}
  closed_verb: {is: law_rule, display: どこかの閉集合が閉じている動詞}
  ternary_verb: {is: law_rule, display: 第三のものの種類を持つ動詞}
  op_of_self: {is: law_rule, display: 事実の動詞}
  op_of_up: {is: law_rule, display: 事実の動詞の上位の動詞}
  in_op: {is: law_rule, display: 種類が、動詞 V について閉じた閉集合に属する}
  collected_kind: {is: law_rule, display: 集まりが直接集めた種類}
  defined_by_fact_from: {is: law_rule, display: 事実の始点の種類には、その動詞が定義されている}
  defined_by_fact_to: {is: law_rule, display: 事実の終点の種類には、その動詞が定義されている}
  defined_by_fact_new: {is: law_rule, display: 事実でできた種類には、その動詞が定義されている}
  defined_by_mod: {is: law_rule, display: 動詞による限定を持つ種類には、その動詞が定義されている}
  defined_by_mod_with: {is: law_rule, display: 動詞による限定の相手の種類には、その動詞が定義されている}
  defined_inherit: {is: law_rule, display: 上位に定義された動詞は、下位にも定義されている}
