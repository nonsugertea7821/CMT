# CSCL のシグネチャ（signature）。自分（self）と、同じである（same）だけを置く。ノードは持たない。
# self は、限定（mod）の暗黙の端。限定は λself. v(self, X) で、否定の限定は「self は肯定の限定が定める概念のどれとも同じでない」（∀s. ¬same(self, s)）。
# 在る（exists）は same から導く（ontology の法則 exists_self_same, self_same_exists。自由論理の E!x ≡ ∃y. same(y, x) に当たる）。
# について述べる（refer）、分類の軸、規則の変数は、self と same からは導けないので ontology に置く。
# ほかの層（ontology, syntax, runtime, std）と領域（exp など）は、すべてこの上に定義する。
# このファイルの個体は、syntax の語（domain, variable）で書く。書き方は syntax に従うが、意味は syntax に依存しない。

domain: signature

base:
  same: {display: 同じである, arity: 2}

individuals:
  signature: {is: domain, display: シグネチャ}
  self: {is: variable, display: 自分}   # 限定の暗黙の端。規則の変数と同じく、個体やノードの代わりに置く
