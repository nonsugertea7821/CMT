# 領域 lang（言語そのものについての主張）。CSCL の設計の決定と仮説を置く。実験（exp）の主張とは分ける。
# 主張の中身は、言語の層（signature, ontology, syntax, runtime, std）と、この領域 lang の語だけを参照する（type_checker の check_sides が確かめる）。
# 状態の種類（採用済み・暫定・未検証など）は、いまは exp の語を使う。std へ移すまでの仮の置き場。
domain: lang
nodes:
  # ===== 名前を付けた限定（法則 named_mod）。2つ以上の概念が足す限定は、名前で書く
  is_from_lang_decision: {display: 言語の設計の決定へ属する（始点）, extends: quality, of: [is, from], with: lang_decision}

  axiom_layer: {display: 公理の層, extends: section, mod: refer_from_laws}
  std_layer: {display: 標準の語彙の層, extends: section, mod: {of: [v_depend, from], with: axiom_layer}}
  lang_decision: {display: 言語の設計の決定, extends: exp.decision, mod: {of: [v_compose, from], with: cscl}}
  lang_dec_adopted: {display: 言語の採用済みの決定, extends: exp.dec_adopted, mod: is_from_lang_decision}
  lang_dec_tentative: {display: 言語の暫定の決定, extends: exp.dec_tentative, mod: is_from_lang_decision}
  lang_dec_withdrawn: {display: 言語の取り下げた決定, extends: exp.dec_withdrawn, mod: is_from_lang_decision}
  # 否定の動詞（中身の否定は、否定の動詞で書く。exp の v_not_transfer と同じ形）
  v_not_depend: {display: に依存しない, extends: v_immune, from: continuant, to: continuant, opposite: v_depend}
  type_checker: {display: 型検査器, extends: artifact, mod: refer_from_laws}
  previous_checker: {display: 前の版の型検査器, extends: type_checker, mod: {of: [v_come_after, to], with: type_checker}}
  # 真偽の対称性と健全性（h_symmetry_soundness）の語
  symmetry_break: {display: 真偽の対の欠け, extends: quality, mod: {of: [v_refer, to], with: definition}}
  definition_change: {display: 定義の書き換え, extends: process, mod: {of: [v_involve, from], with: definition}}
  # 実装の対称性（h_anomaly_defect）と中身の対称性（h_content_asymmetry_harmless）の語
  implementation_break: {display: 実装が壊す真偽の対称性, extends: quality, mod: {of: [v_depend, from], with: artifact}}
  check_failure: {display: 検査の失敗, extends: process, mod: {of: [v_involve, from], with: artifact}}
  # 定義の循環（h_definition_positive）の語
  definition_cycle: {display: 定義の循環, extends: quality, mod: {of: [v_refer, from], with: definition}}
  # 時間を含む実行での宣言の範囲（h_open_declaration）の語
  declared_scope: {display: 宣言の範囲, extends: quality, mod: syntax.refer_from_individuals}
  # 層とシグネチャ（h_layers_signature）の語
  layer_placement: {display: 層の置き場, extends: quality, mod: {of: [v_depend, from], with: syntax.domain}}
  signature_class: {display: シグネチャから定まる分類, extends: quality, mod: {of: [v_depend, from], with: syntax.base}}
  # 否定は self でないこと（h_neg_not_self）の語
  negated_limitation: {display: 否定の限定, extends: quality, mod: {of: [v_refer, from], with: syntax.neg}}
  # 持続体と生起体を導く（h_tops_derivable）の語
  top_placement: {display: 最上位の置き場, extends: quality, mod: syntax.refer_from_occurrent}
  individual_depth: {display: 個体の深さ, extends: quality, mod: {of: [v_depend, from], with: kind}}
  depth_limitation: {display: 深さの限定, extends: quality, mod: {of: [v_refer, from], with: syntax.mod}}
  above_order: {display: 上位の順序, extends: quality, mod: {of: [v_refer, from], with: syntax.v_above}}
  placement_by_above: {display: 上位で決まる置き場, extends: quality, mod: {of: [v_depend, from], with: above_order}}
  above_falsity: {display: 上位の偽, extends: quality, mod: {of: [v_refer, from], with: syntax.v_above, neg: true}}
  mod_lack: {display: 修飾の欠け, extends: quality, mod: {of: [v_refer, from], with: syntax.mod, neg: true}}
  name_choice: {display: 識別子の選び, extends: quality, mod: {of: [v_depend, from], with: syntax.identifier}}
  frame_trace: {display: 後の状態の痕跡, extends: quality, mod: runtime.refer_from_post}
  any_limitation: {display: 何でもを端に持つ限定, extends: quality, mod: {of: [v_refer, from], with: any}}
  reading_formula: {display: 読みの式, extends: quality, mod: exp.refer_from_hypothesis}
  annotation: {display: 注釈, extends: passage_express_from_natural_language, mod: {of: [v_refer, from], with: syntax.domain}}
  v_not_trigger: {display: 引き起こさない, extends: v_not_transfer, from: any, to: occurrent, opposite: v_trigger}

individuals:
  lang: {is: domain, display: 言語}

  # ===== 仮説
  h_cscl_self_hosting: {is: exp.hyp_untested}

  # ===== 決定
  d_cscl_laws_in_cscl: {is: lang_dec_adopted}
  d_cscl_closed_world: {is: lang_dec_adopted}
  d_cscl_std_on_axiom: {is: lang_dec_adopted}
  d_cscl_display_derived: {is: lang_dec_adopted}
  d_cscl_trust_previous_version: {is: lang_dec_tentative}

  # ===== 動詞のシグネチャ（端の型）。観察の記録がまだないので暫定
  d_sig_depend_from: {is: lang_dec_tentative}
  d_sig_depend_to: {is: lang_dec_adopted}
  d_sig_compose_from: {is: lang_dec_tentative}
  d_sig_compose_to: {is: lang_dec_tentative}
  d_sig_stage_from: {is: lang_dec_tentative}
  d_sig_stage_to: {is: lang_dec_tentative}
  d_sig_come_after_from: {is: lang_dec_tentative}
  d_sig_come_after_to: {is: lang_dec_tentative}
  d_sig_refer_from: {is: lang_dec_tentative}
  d_sig_agree_from: {is: lang_dec_tentative}
  d_sig_agree_to: {is: lang_dec_tentative}
  d_sig_express_from: {is: lang_dec_tentative}
  d_sig_express_to: {is: lang_dec_tentative}
  d_sig_involve_from: {is: lang_dec_tentative}
  d_sig_involve_to: {is: lang_dec_tentative}
  d_sig_perform_from: {is: lang_dec_tentative}
  d_sig_perform_to: {is: lang_dec_tentative}
  d_sig_trigger_to: {is: lang_dec_tentative}
  d_sig_come_before_from: {is: lang_dec_tentative}
  d_sig_come_before_to: {is: lang_dec_tentative}
  d_sig_not_before_from: {is: lang_dec_tentative}
  d_sig_not_before_to: {is: lang_dec_tentative}
  d_sig_not_after_from: {is: lang_dec_tentative}
  d_sig_not_after_to: {is: lang_dec_tentative}
  d_sig_level_from: {is: lang_dec_tentative}
  d_sig_level_to: {is: lang_dec_tentative}
  d_sig_design_from: {is: lang_dec_tentative}
  d_sig_design_to: {is: lang_dec_tentative}

  # ===== 否定だけで定義された種類（独立持続体 = 何にも依存しない持続体）の、肯定の定義の候補（法則 placed_deduced）。
  # 中身は「依存されるものは、何にも依存しない」。観察に反したので、独立持続体を体系から除き、d_sig_depend_to を採用済みにした
  h_ic_is_bearer: {is: exp.hyp_refuted}
  # ===== 状態の関係（holds・pre・post の原子の動詞）の置き場
  h_state_relation_in_base: {is: exp.hyp_supported}
  d_state_relation_in_base: {is: lang_dec_adopted}
  # ===== 真偽の対称性と健全性（利用者の直感から立てた仮説。結果を見る前に登録した）
  # 中身は「真偽の対の欠けは、定義の書き換えを引き起こす」。確かめ方（exp/experiments/sys_soundness.py の説明に固定）:
  #   版 48a43c9 の各ノード（動詞・限定）が真偽の対を持つかを測り、版 933ddd6 までに書き換えられたか消えたかと比べる。
  #   対の無いノードの書き換えの割合が、対のあるノードより大きく、片側 Fisher で p < 0.05 なら支持、以下なら反証。
  #   測るのは同時に起こることだけで、引き起こすことは示さない。書き換えを欠陥とみなすのは、この確かめでの取り決め
  # 結果（判定: どちらでもない）。対の無いノードの書き換えは 0.042、対のあるノードは 0.025 で向きは合うが、p = 0.37。
  # 動詞だけでは向きが逆（0.024 と 0.077）。登録した版の実行では、限定の対の判定に誤り（not と in の優先順位）があり、
  # 限定に対のあるものが 0 件になっていた（そのときの値: 0.038 と 0.077、p = 0.91）。手順の説明どおりに直して測り直した
  h_symmetry_soundness: {is: exp.hyp_mixed}
  b_symmetry_soundness: {is: exp.item_done}
  # ===== h_symmetry_soundness を、物理の対称性との類比で2つに分けた仮説（結果を見る前に登録した）
  # (A) 量子異常の型: 意味として宣言した真偽の対称性を、実装が壊すなら欠陥になる。
  #   確かめ方は exp/experiments/sys_anomaly.py の説明に固定。runtime.py の1か所の変異のうち、振る舞いを変えるものについて、
  #   σ を壊す変異が、σ と別の検査（実行の記録の検査）を失敗させる割合が、壊さない変異より大きく、片側 Fisher で p < 0.05 なら支持
  # 結果（判定: 反証）。振る舞いを変える変異 34 のうち、例外を出した 6 を除く 28 で、σ を壊す変異の失敗は 2/5（0.40）、
  # 壊さない変異は 20/23（0.87）、p = 1.00。実行の記録は閉世界だけを使うので、述べていない文の扱いだけを変える変異
  # （閉世界の既定値を真にするもの、開世界を閉世界にするもの）は、どれも検査を失敗させなかった
  h_anomaly_defect: {is: exp.hyp_refuted}
  b_anomaly_defect: {is: exp.item_done}
  # (B) 明示的・自発的な破れの型: 定義の中身が真偽の対を欠くことは、定義の書き換えを引き起こさない。
  #   確かめ方は exp/experiments/sys_content_symmetry.py の説明に固定（h_symmetry_soundness と重ならない期間 e845f0b → 6bfac2f）。
  #   対の無いノードの書き換えが多く、片側 Fisher で p < 0.05 なら反証。そうでなければ反証されない（差を見つけられなかっただけ）
  # 結果（判定: 反証されない）。対の無いノードの書き換え 7/370（0.019）、対のあるノード 0/77、p = 0.26。
  # 向きは反証の側だが、書き換えが少なく差を見つけられなかった。差がないことの証明ではない
  h_content_asymmetry_harmless: {is: exp.hyp_supported}
  b_content_asymmetry_harmless: {is: exp.item_done}
  # ===== 宣言と存在（利用者の見立てから立てた仮説。結果を見る前に登録した）
  # 種類（時間によらない）では、宣言 ＝ 存在で閉じている（型検査器は宣言されたノードにだけ exists を与える）。
  # 中身は「時間を含む実行では、宣言の範囲は歩みに依存する（開いている）。各時点では、宣言 ＝ 存在で閉じている」。
  # 確かめ方は exp/experiments/sys_declaration.py の説明に固定。生まれる動詞と消える動詞を含む同じ歩みを、
  #   (a) 名前を先に宣言し exists で在ることを述べる今の書き方と、(b) 宣言を歩みで足し取り消す書き方で実行し、
  #   (b) がすべて歩め、各歩みの後の状態が (a) と一致し、宣言されていない名前を含む文が残らなければ支持、どれかが破れれば反証。
  #   登録の前に確かめたのは、(a) の記録が今の実行器でエラーなく歩めることだけ
  # 結果（判定: 反証）。(b) は3歩ともエラーなく歩め、各歩みの後の状態も (a) と一致した。
  # しかし消える動詞 std.v_freeze で r1 の宣言を取り消すと、r1 についての文 depend(r1, sys1) と refer(r1, dec1) が残った。
  # (a) では同じ2文が「在らないものについての文」として残る（法則 depend_end_exists は始点が在るときだけを縛るので、違反にならない）。
  # 生まれることは宣言を足すことと読めたが、消えることは宣言の取り消しとは読めない。
  # 登録した基準は3つの条件がすべて成り立つときだけ支持なので、成り立った2つ（歩める・状態が一致する）は観察として残し、支持には結ばない
  # 利用者の指摘: この基準は真偽の軸と宣言の軸を取り違えていた。v_freeze は真偽の軸（exists）だけを操作し、宣言を減らさない。
  # 宣言が減るのはスタックの巻き戻しのときだけで、「宣言されていない名前の文が残らない」は巻き戻しの後に確かめる条件だった。
  # 判定は登録した基準どおりに残し、直した条件は別に扱う（フレームの観察 sys_frames を参照）
  h_open_declaration: {is: exp.hyp_refuted}
  b_open_declaration: {is: exp.item_done}
  # ===== 名前を最初に全部宣言しない実行器（開世界）。利用者の提案「全部を最初に宣言しない実行器を作ればいい。開世界仮説で」から。結果を見る前に登録した
  # 実行器と確かめ方は exp/experiments/open_runtime.py の説明に固定。世界は world（述べていない文に真偽を与えない）。
  # 最初に宣言するのは最初に在る個体だけ。歩みが宣言されていない名前を名指したら、在るようにする位置（pre で exists が述べられていない・post で真）でだけ宣言する。
  # 宣言は取り消さない（v_freeze は真偽の軸の exists を取り除くだけ）。フレームは1歩ごと。巻き戻しは扱わない。
  # 中身は「宣言の範囲は、状態（真偽の文の集まり）に依存しない」（v_freeze が状態を変えても宣言は減らない）。支持の基準は、exp/tests の記録すべてと sys_declaration の記録で、
  #   1. エラーなく歩め expect が決められて成り立つ、2. 宣言が減らない、3. 増えるのは在るようにする歩みだけ、4. halted: false の記録で halted: false と決まる、のすべて。
  #   2 と 3 は作りからほぼ決まり、経験的な中身は 1 と 4。登録の前には、スクリプトが構文として読めることだけを確かめた（実行はしていない）
  # 結果（判定: 支持）。2つの記録の6歩がすべてエラーなく歩め、expect も決められて成り立った。宣言は一度も減らず、
  # 増えた2歩（std.v_learn, exp.v_see）はどちらも在るようにする位置に新しい名前を使った歩みだった。v_freeze の後も r1 の宣言は残った。
  # 支持は弱い: 記録は exp/tests の adopt_withdraw と sys_declaration の2つだけ。adopt_withdraw は名前を足す歩みを含まない。
  # halted: false を書いた記録は adopt_withdraw だけで、今の名前だけで当てはまる歩みが見つかったので、新しい名前を試す部分は使われていない
  h_open_runtime: {is: exp.hyp_supported}
  b_open_runtime: {is: exp.item_done}
  # ===== 層とシグネチャ。利用者の指摘「層を分けるには、その層に分類されることを論理演算的に検出する法則が要る」「シグネチャから論理演算的に定められる分類を探すべき」から。
  # 結果を見る前に登録した。確かめ方は exp/experiments/sys_layers.py の説明に固定。
  # 各ノードから定義の辺（上位・限定の動詞と相手・動詞の端の種類）をたどり、届いたノードの holds・pre・post で分類する。
  # 変化する動詞に届けば change、そうでなく refer に届けば refer、どちらでもなければ still。否定の辺もたどる（否定は「述べられていない」で、語としては使う）。
  # 中身は「層の置き場は、シグネチャから定まる分類に依存する」。対応は ontology → still、syntax → refer、runtime → change。
  # 支持は、3つの層のすべてのノードが対応する分類に入るとき（層を法則で決めるには、どのノードも事実から判定できなければならない）。1つでも外れれば反証。
  # 登録の前に分かっていること: 前の版の体系で、似た表を会話の中で作り、外れるノードがあった。反証が見込まれる。目的は一致の度合いと外れの記録
  # 結果（判定: 反証）。3つの層の 202 ノードのうち、対応する分類に入ったのは 104（0.515）。
  # runtime は 24 すべてが change。syntax は 104 のうち 80 が change で、どれも否定の辺を通って変化する動詞に届いた（否定の辺をたどらなければ syntax の change は 0）。
  # 否定の辺をたどらない版では 177/202（0.876）。外れるのは ontology の情報と記述の語 14（refer）、ontology.v_design（change）、
  # runtime の状態の語 6（refer: state, halted, rewrite_rule など）、syntax の individuals と名前を付けた否定の限定 3（still）
  h_layers_signature: {is: exp.hyp_refuted}
  b_layers_signature: {is: exp.item_done}
  # ===== 否定は self でないこと。利用者の問い「否定って not self にならないか」「self があることで真偽が不要になるような」から。観察の後に立てた（事前の登録ではない）
  # 限定は λself. v(self, X)。肯定の限定が定める概念を S = {s | v(s, X)} とすると、否定の限定 λself. ¬v(self, X) は「self は S のどれとも同じでない」（∀s∈S. ¬same(self, s)）。
  # こう書くと真偽の軸は要らない（偽と述べるか述べられていないかの区別、閉世界か開世界かによらない）。否定の限定がシグネチャから使うのは same と self だけで、
  # v の成り立つ状態（holds・pre・post）は持ち込まない。v は S を名指す名前としてだけ現れる。
  # 否定が定義の循環を通ると C = {x | x は C のどれとも同じでない} で self ≠ self になる（Russell の逆理。法則 definition_stratified が禁じる形）。
  # 根拠の観察は sys_layers の比較版（否定の辺をたどらない版は、シグネチャからの分類と層の一致が高い）。この読みを syntax の neg の定義に反映するかは、まだ決めていない
  h_neg_not_self: {is: exp.hyp_supported}
  # ===== 持続体と生起体を self・same とフレームの変化から導く。利用者の問い「コンティニュアント・オカレントって導けないかな」から。結果を見る前に登録した
  # 持続体は「どのフレームでも自分と同じであるもの」（∀t, t'. same(self_t, self_t')）。gloss「時間を通じて同一性を保って存在するもの」を self と same で書いたもの。
  # 生起体は、利用者が選んだ D2:「前後のフレームを同じでなくするもの」（¬same(frame_t, frame_t+1)）。gloss「時間の中で起こり、展開するもの」を書いたもの。
  #   D1「限定 λself. v(self, X) の v」は今の体系の書き方（動詞はすべて生起体）と合うが、展開することを使わない。D2 では静的な動詞は生起体でなく関係になる。
  # 中身は「最上位の置き場は、シグネチャから定まる分類に依存する」。確かめ方は exp/experiments/sys_tops.py の説明に固定。
  # 支持は、個体がすべて持続体、動的な動詞がすべて生起体、静的な動詞がどれも生起体でない、生起体の名詞がすべて動的な動詞に届く、概念が動的な動詞に届く、のすべて。
  # 登録の前に分かっていること: 個体 1052 はすべて持続体。動詞 118 はすべて生起体で、動的なものは 16 前後。概念は変化に届かない（sys_layers）。反証が見込まれる。
  #   目的は、導いた定義と今の体系の食い違いを記録し、そこから直すものを導くこと
  # 結果（判定: 反証）。個体 1054 はすべて持続体、動的な動詞 36 はすべて生起体（持続体の導きと、D2 の動的な側は合う）。
