# 領域 lang（言語そのものについての主張）。CSCL の設計の決定と仮説を置く。実験（exp）の主張とは分ける。
# 主張の中身は、言語の層（axiom, ontology, syntax, runtime, std）と、この領域 lang の語だけを参照する（type_checker の check_sides が確かめる）。
# 状態の種類（採用済み・暫定・未検証など）は、いまは exp の語を使う。std へ移すまでの仮の置き場。
domain: lang
nodes:
  # ===== 名前を付けた限定（法則 named_mod）。2つ以上の概念が足す限定は、名前で書く
  is_from_lang_decision: {display: 言語の設計の決定へ属する（始点）, extends: quality, of: [is, from], with: lang_decision}

  axiom_layer: {display: 公理の層, extends: section, mod: refer_from_laws}
  std_layer: {display: 標準の語彙の層, extends: section, mod: {of: [v_depend, from], with: axiom_layer}}
  lang_decision: {display: 言語の設計の決定, extends: exp.decision, mod: {of: [v_compose, from], with: cscl}}
  lang_dec_adopted: {display: 言語の採用済みの決定, extends: exp.dec_adopted, mod: is_from_lang_decision}
  lang_dec_tentative: {display: 言語の暫定の決定, extends: exp.dec_tentative, mod: is_from_lang_decision}
  lang_dec_withdrawn: {display: 言語の取り下げた決定, extends: exp.dec_withdrawn, mod: is_from_lang_decision}
  type_checker: {display: 型検査器, extends: artifact, mod: refer_from_laws}
  previous_checker: {display: 前の版の型検査器, extends: type_checker, mod: {of: [v_come_after, to], with: type_checker}}

individuals:
  lang: {is: domain, display: 言語}

  # ===== 仮説
  h_cscl_self_hosting: {is: exp.hyp_untested}

  # ===== 決定
  d_cscl_laws_in_cscl: {is: lang_dec_adopted}
  d_cscl_closed_world: {is: lang_dec_adopted}
  d_cscl_std_on_axiom: {is: lang_dec_adopted}
  d_cscl_display_derived: {is: lang_dec_adopted}
  d_cscl_trust_previous_version: {is: lang_dec_tentative}

  # ===== 動詞のシグネチャ（端の型）。観察の記録がまだないので暫定
  d_sig_depend_from: {is: lang_dec_tentative}
  d_sig_depend_to: {is: lang_dec_adopted}
  d_sig_compose_from: {is: lang_dec_tentative}
  d_sig_compose_to: {is: lang_dec_tentative}
  d_sig_stage_from: {is: lang_dec_tentative}
  d_sig_stage_to: {is: lang_dec_tentative}
  d_sig_come_after_from: {is: lang_dec_tentative}
  d_sig_come_after_to: {is: lang_dec_tentative}
  d_sig_refer_from: {is: lang_dec_tentative}
  d_sig_agree_from: {is: lang_dec_tentative}
  d_sig_agree_to: {is: lang_dec_tentative}
  d_sig_express_from: {is: lang_dec_tentative}
  d_sig_express_to: {is: lang_dec_tentative}
  d_sig_involve_from: {is: lang_dec_tentative}
  d_sig_involve_to: {is: lang_dec_tentative}
  d_sig_perform_from: {is: lang_dec_tentative}
  d_sig_perform_to: {is: lang_dec_tentative}
  d_sig_trigger_to: {is: lang_dec_tentative}
  d_sig_come_before_from: {is: lang_dec_tentative}
  d_sig_come_before_to: {is: lang_dec_tentative}
  d_sig_not_before_from: {is: lang_dec_tentative}
  d_sig_not_before_to: {is: lang_dec_tentative}
  d_sig_not_after_from: {is: lang_dec_tentative}
  d_sig_not_after_to: {is: lang_dec_tentative}
  d_sig_level_from: {is: lang_dec_tentative}
  d_sig_level_to: {is: lang_dec_tentative}
  d_sig_design_from: {is: lang_dec_tentative}
  d_sig_design_to: {is: lang_dec_tentative}

  # ===== 否定だけで定義された種類（独立持続体 = 何にも依存しない持続体）の、肯定の定義の候補（法則 placed_deduced）。
  # 中身は「依存されるものは、何にも依存しない」。観察に反したので、独立持続体を体系から除き、d_sig_depend_to を採用済みにした
  h_ic_is_bearer: {is: exp.hyp_refuted}
  # ===== 状態の関係（holds・pre・post の原子の動詞）の置き場
  h_state_relation_in_base: {is: exp.hyp_supported}
  d_state_relation_in_base: {is: lang_dec_adopted}

  # ===== 観察（体系そのものを数えた族 sys_* の値。exp/experiments/sys_ends.py）
  o_sys_depended_ic_below_gdc: {is: exp.observation}
  o_sys_depended_mostly_depend: {is: exp.observation}
  o_sys_state_atoms_all_base: {is: exp.observation}

facts:
  - {is: syntax.v_use, from: lang, to: std}
  - {is: syntax.v_use, from: lang, to: runtime}
  - {is: syntax.v_use, from: lang, to: exp}
  - {is: v_refer, from: h_cscl_self_hosting, to: {is: v_express, from: type_checker, to: cscl}}
  - {is: v_refer, from: d_cscl_laws_in_cscl, to: {is: v_express, from: law_rule, to: cscl}}
  - {is: v_refer, from: d_cscl_closed_world, to: {is: syntax.v_presume, from: runtime, to: syntax.closed_world}}
  - {is: v_refer, from: d_cscl_std_on_axiom, to: {is: v_depend, from: std_layer, to: axiom_layer}}
  - {is: v_refer, from: d_cscl_display_derived, to: {is: v_depend, from: display, to: system}}
  - {is: v_refer, from: d_cscl_trust_previous_version, to: {is: v_depend, from: type_checker, to: previous_checker}}
  - {is: v_refer, from: d_sig_depend_from, to: {is: extends, from: dependent, to: continuant}}
  - {is: v_refer, from: d_sig_depend_to, to: {is: extends, from: depended, to: continuant}}
  - {is: v_ground, from: d_sig_depend_to, to: h_ic_is_bearer}
  - {is: v_refer, from: d_sig_compose_from, to: {is: extends, from: component, to: continuant}}
  - {is: v_refer, from: d_sig_compose_to, to: {is: extends, from: kind, to: continuant}}
  - {is: v_refer, from: d_sig_stage_from, to: {is: extends, from: temporal_part, to: occurrent}}
  - {is: v_refer, from: d_sig_stage_to, to: {is: extends, from: staged, to: occurrent}}
  - {is: v_refer, from: d_sig_come_after_from, to: {is: extends, from: later_one, to: continuant}}
  - {is: v_refer, from: d_sig_come_after_to, to: {is: extends, from: later_target, to: continuant}}
  - {is: v_refer, from: d_sig_refer_from, to: {is: extends, from: referrer, to: continuant}}
  - {is: v_refer, from: d_sig_agree_from, to: {is: extends, from: agreeing, to: continuant}}
  - {is: v_refer, from: d_sig_agree_to, to: {is: extends, from: agreed, to: continuant}}
  - {is: v_refer, from: d_sig_express_from, to: {is: extends, from: expressed, to: continuant}}
  - {is: v_refer, from: d_sig_express_to, to: {is: extends, from: medium, to: continuant}}
  - {is: v_refer, from: d_sig_involve_from, to: {is: extends, from: involving, to: occurrent}}
  - {is: v_refer, from: d_sig_involve_to, to: {is: extends, from: participant, to: continuant}}
  - {is: v_refer, from: d_sig_perform_from, to: {is: extends, from: performer, to: continuant}}
  - {is: v_refer, from: d_sig_perform_to, to: {is: extends, from: performed, to: occurrent}}
  - {is: v_refer, from: d_sig_trigger_to, to: {is: extends, from: triggered, to: occurrent}}
  - {is: v_refer, from: d_sig_come_before_from, to: {is: extends, from: earlier_one, to: continuant}}
  - {is: v_refer, from: d_sig_come_before_to, to: {is: extends, from: earlier_target, to: continuant}}
  - {is: v_refer, from: d_sig_not_before_from, to: {is: extends, from: not_earlier_one, to: continuant}}
  - {is: v_refer, from: d_sig_not_before_to, to: {is: extends, from: not_earlier_target, to: continuant}}
  - {is: v_refer, from: d_sig_not_after_from, to: {is: extends, from: not_later_one, to: continuant}}
  - {is: v_refer, from: d_sig_not_after_to, to: {is: extends, from: not_later_target, to: continuant}}
  - {is: v_refer, from: d_sig_level_from, to: {is: extends, from: a, to: continuant}}
  - {is: v_refer, from: d_sig_level_to, to: {is: extends, from: b, to: continuant}}
  - {is: v_refer, from: d_sig_design_from, to: {is: extends, from: designer, to: continuant}}
  - {is: v_refer, from: d_sig_design_to, to: {is: extends, from: designed, to: continuant}}
  - {is: v_refer, from: h_ic_is_bearer, to: {is: v_depend, from: depended, to: continuant, neg: true}}
  - {is: v_refer, from: o_sys_depended_ic_below_gdc, to: {is: v_come_before, from: sys_depend_to.ic.mean_value, to: sys_depend_to.gdc.mean_value}}
  - {is: v_refer, from: o_sys_depended_mostly_depend, to: {is: v_come_after, from: sys_depend_to.also_depends.mean_value, to: 0.5}}
  - {is: v_contradict, from: o_sys_depended_ic_below_gdc, to: h_ic_is_bearer}
  - {is: v_contradict, from: o_sys_depended_mostly_depend, to: h_ic_is_bearer}
  - {is: v_refer, from: h_state_relation_in_base, to: {is: v_compose, from: state_relation, to: base}}
  - {is: v_refer, from: o_sys_state_atoms_all_base, to: {is: v_level, from: sys_state_atoms.in_base.mean_value, to: 1.0}}
  - {is: v_support, from: o_sys_state_atoms_all_base, to: h_state_relation_in_base}
  - {is: v_refer, from: d_state_relation_in_base, to: {is: v_compose, from: state_relation, to: base}}
  - {is: v_ground, from: d_state_relation_in_base, to: h_state_relation_in_base}
