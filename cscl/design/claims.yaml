# 領域 lang（言語そのものについての主張）。CSCL の設計の決定と仮説を置く。実験（exp）の主張とは分ける。
# 主張の中身は、言語の層（axiom, ontology, syntax, runtime, std）と、この領域 lang の語だけを参照する（type_checker の check_sides が確かめる）。
# 状態の種類（採用済み・暫定・未検証など）は、いまは exp の語を使う。std へ移すまでの仮の置き場。
domain: lang
nodes:
  axiom_layer: {display: 公理の層, extends: section, mod: {of: [v_refer, from], with: laws}}
  std_layer: {display: 標準の語彙の層, extends: section, mod: {of: [v_depend, from], with: axiom_layer}}
  lang_decision: {display: 言語の設計の決定, extends: exp.decision, mod: {of: [v_compose, from], with: cscl}}
  lang_dec_adopted: {display: 言語の採用済みの決定, extends: exp.dec_adopted, mod: {of: [is, from], with: lang_decision}}
  lang_dec_tentative: {display: 言語の暫定の決定, extends: exp.dec_tentative, mod: {of: [is, from], with: lang_decision}}
  lang_dec_withdrawn: {display: 言語の取り下げた決定, extends: exp.dec_withdrawn, mod: {of: [is, from], with: lang_decision}}
  type_checker: {display: 型検査器, extends: artifact, mod: {of: [v_refer, from], with: laws}}
  previous_checker: {display: 前の版の型検査器, extends: type_checker, mod: {of: [v_come_after, to], with: type_checker}}

individuals:
  lang: {is: domain, display: 言語}

  # ===== 仮説
  h_cscl_self_hosting: {is: exp.hyp_untested}

  # ===== 決定
  d_cscl_laws_in_cscl: {is: lang_dec_adopted}
  d_cscl_closed_world: {is: lang_dec_adopted}
  d_cscl_std_on_axiom: {is: lang_dec_adopted}
  d_cscl_display_derived: {is: lang_dec_adopted}
  d_cscl_trust_previous_version: {is: lang_dec_tentative}

facts:
  - {is: syntax.v_use, from: lang, to: std}
  - {is: syntax.v_use, from: lang, to: runtime}
  - {is: syntax.v_use, from: lang, to: exp}
  - {is: v_refer, from: h_cscl_self_hosting, to: {is: v_express, from: type_checker, to: cscl}}
  - {is: v_refer, from: d_cscl_laws_in_cscl, to: {is: v_express, from: law_rule, to: cscl}}
  - {is: v_refer, from: d_cscl_closed_world, to: {is: v_refer, from: runtime.runtime, to: runtime.closed_world}}
  - {is: v_refer, from: d_cscl_std_on_axiom, to: {is: v_depend, from: std_layer, to: axiom_layer}}
  - {is: v_refer, from: d_cscl_display_derived, to: {is: v_depend, from: display, to: system}}
  - {is: v_refer, from: d_cscl_trust_previous_version, to: {is: v_depend, from: type_checker, to: previous_checker}}
