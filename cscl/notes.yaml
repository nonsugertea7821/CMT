# あとで扱う気づきの控え。正本ではない。検査の対象でもない。
notes:
  n1:
    title: 概念体系制御言語は、意味を伴う中間表現（意味論的バイトコード）になっている可能性
    raised_by: 利用者
    raised_on: 2026-11-14
    status: あとで扱う（本題から外れるため）
    idea:
      - 動詞を、オントロジーに基づいて BFO の下で式として構成できる。それなら、この言語で定義するだけで、ソフトウェアの振る舞いをすべて定義できるはず
      - 認証や認可も、修飾として書ける
      - データベースのスキーマやデータモデルなどの構成要素を持続体として定義し、その変化を生起体として定義する。それをプログラムに翻訳すれば、すべての操作を、定義された概念と対応づけて解釈できる
      - 翻訳先は、バイトコード命令でもよいかもしれない。あるいは、この言語自体がバイトコードかもしれない
      - LLM が直接保持できる中間表現になる
    argument_for_turing_completeness:
      - mod は、事実上 AND
      - neg は NOT。したがって NAND が表現できる
      - 論理演算子どうしの結線は、識別子の一意制約が暗黙に運んでいるとみなせる
      - メモリと、上限のない繰り返しは、まだない
      - それは、版管理で作ろうとしているものの正体ではないか
    assessment_by_claude:
      - NAND が表現できることは、真偽の式として完全であることを示すが、計算として万能であることは示さない。万能であるには、利用者の指摘どおり、上限のない記憶と繰り返しが要る
      - 計算に当たるものは、版管理よりも、すでにある動的な動詞のほうに近い。動的な動詞は、状態の関係の「前」と「後」を書いた書き換え規則で、第三のもの（new）を新しく生む。状態を表すグラフに規則を繰り返し当てれば、グラフは上限なく伸びる。グラフの書き換えは、一般に計算として万能である
      - ただし、いまの体系には、規則をいつ、どの順に当てるかの取り決め（実行の意味論）がない。いまは記述の言語であり、実行の言語ではない
      - 版管理は、状態の履歴（追記される記録）を与える。これは記憶に当たる。実行の意味論と版管理が揃ったときに、万能性を論じられる
      - 個々の部品には先例がある。前後の状態で操作を書く記述（計画問題の記述言語、時相論理による仕様記述）や、オントロジーに基づく記述論理。新しさがあるとすれば、動詞・修飾・分類・役割を BFO の下の1つの体系で書き、同じ式を LLM と検査の両方が扱う点。これは未検証
    open:
      - 実行の意味論を、体系の中の概念として書けるか
      - 状態の関係 5個で、実際のソフトウェアの状態（データ、権限、通信）を書き切れるか
      - 概念体系制御言語からプログラムへの翻訳を、機械的にできるか。LLM が行う場合、どう検査するか
