counted_side.before: {root: 前, root_dim: C, needs: []}
counted_side.after: {root: 後ろ, root_dim: C, needs: []}
option_order.averaged: {root: 判定する, root_dim: O, needs: []}
option_order.both_orders: {root: 数える, root_dim: O, needs: [quant]}
scope_of_use.all_usages: {root: 参照する, root_dim: O, needs: [quant]}
intermediate_output.not_written: {root: 書き出す, root_dim: O, needs: [not]}
intermediate_output.written: {root: 書き出す, root_dim: O, needs: []}
word_substitution.substituted: {root: 置き換える, root_dim: O, needs: []}
position_to_word.immediately_after_word: {root: 直後, root_dim: C, needs: []}
training_use.used: {root: 使う, root_dim: O, needs: []}
training_use.not_used: {root: 使う, root_dim: O, needs: [not]}
layer_count.one: {root: 一, root_dim: Q, needs: [quant]}
