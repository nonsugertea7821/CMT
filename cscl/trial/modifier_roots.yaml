# 修飾語的な値 40種類について、どの語根から、何を加えて作られているかを手作業で判定したもの。
# root_dim: O=動詞（生起）の語根、C=名詞（持続）の語根、Q=数量詞。
# needs: 語根と補語のほかに必要なもの。not=否定、quant=数量化、able=可能、passive=受け身。
dependence.on_nothing: {root: 依存する, root_dim: O, needs: [not]}
dependence.on_specific_bearer: {root: 依存する, root_dim: O, needs: []}
dependence.on_any_bearer: {root: 替える, root_dim: O, needs: []}
realization.needs_no_process: {root: 成り立つ, root_dim: O, needs: [not]}
realization.needs_process: {root: 実現する, root_dim: O, needs: [passive]}
grounding.external_circumstance: {root: 与える, root_dim: O, needs: [passive]}
grounding.internal_makeup: {root: 由来する, root_dim: O, needs: []}
temporal_extent.extended: {root: 持つ, root_dim: O, needs: []}
language.natural: {root: 自然, root_dim: C, needs: []}
language.programming: {root: プログラムする, root_dim: O, needs: []}
persistence.persistent: {root: 続く, root_dim: O, needs: []}
prior_meaning_presence.present: {root: ある, root_dim: O, needs: []}
prior_meaning_presence.absent: {root: ある, root_dim: O, needs: [not]}
agreement_with_prior.agrees: {root: 一致する, root_dim: O, needs: []}
agreement_with_prior.differs: {root: 食い違う, root_dim: O, needs: []}
boundary_kind.numeric_threshold_or_calendar: {root: 決まる, root_dim: O, needs: []}
boundary_kind.scope_widened_or_narrowed: {root: 決まる, root_dim: O, needs: []}
relevance_to_question.relevant: {root: 関係する, root_dim: O, needs: []}
relevance_to_question.irrelevant: {root: 関係する, root_dim: O, needs: [not]}
weight_state.frozen: {root: 固定する, root_dim: O, needs: [passive]}
weight_access.open: {root: 触れる, root_dim: O, needs: [able]}
weight_access.closed: {root: 触れる, root_dim: O, needs: [able, not]}
origin.learned: {root: 得る, root_dim: O, needs: [passive]}
experimental_role.varied: {root: 動かす, root_dim: O, needs: []}
