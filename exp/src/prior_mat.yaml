domain: prior_mat
individuals:
  prior_mat: {is: domain, display: 材料力学の先行研究}
  pw_hooke1678_elasticity: {is: exp.prior_work, display: "先行研究: Hooke 1678, De Potentia Restitutiva（Lectures de potentia restitutiva, or of spring）"}
  pwc_hooke1678_elasticity: {is: exp.prior_claim, display: "要旨: 伸びは力に比例する。小さな変形の範囲では、応答は荷重に線形で、重ね合わせが効く。"}
  pw_tresca1864_yield: {is: exp.prior_work, display: "先行研究: Tresca 1864, Sur l'écoulement des corps solides soumis à de fortes pressions（Comptes Rendus de l'Académie des Sciences 59, 754–758）"}
  pwc_tresca1864_yield: {is: exp.prior_claim, display: "要旨: 固体は、最大のせん断応力がある値に達すると流れ始める（降伏）。"}
  pw_vonmises1913_yield: {is: exp.prior_work, display: "先行研究: von Mises 1913, Mechanik der festen Körper im plastisch-deformablen Zustand（Nachrichten von der Gesellschaft der Wissenschaften zu Göttingen, 582–592）"}
  pwc_vonmises1913_yield: {is: exp.prior_claim, display: "要旨: 降伏を、偏差応力の二次の不変量がある値に達することで定める。降伏の境は応力空間の中の滑らかな曲面。"}
  pw_drucker1951_stability: {is: exp.prior_work, display: "先行研究: Drucker 1951, A more fundamental approach to plastic stress-strain relations（Proceedings of the 1st U.S. National Congress of Applied Mechanics, 487–491）"}
  pwc_drucker1951_stability: {is: exp.prior_claim, display: "要旨: 材料の安定性の公準から、降伏曲面は凸であり、塑性ひずみの増分は曲面に垂直であることが導かれる。"}
  pw_wohler1870_fatigue: {is: exp.prior_work, display: "先行研究: Wöhler 1870, Über die Festigkeitsversuche mit Eisen und Stahl（Zeitschrift für Bauwesen 20, 73–106）"}
  pwc_wohler1870_fatigue: {is: exp.prior_claim, display: "要旨: 一度では壊れない応力でも、繰り返すと壊れる。応力の振幅と壊れるまでの回数の関係（S-N 曲線）があり、その下に疲労限度がある。"}
  pw_euler1744_buckling: {is: exp.prior_work, display: "先行研究: Euler 1744, Methodus inveniendi lineas curvas maximi minimive proprietate gaudentes（Appendix De curvis elasticis）"}
  pwc_euler1744_buckling: {is: exp.prior_claim, display: "要旨: 柱は、圧縮の荷重が臨界の値を超えると、まっすぐな形から曲がった形へ分岐する（座屈）。"}
  pw_griffith1921_fracture: {is: exp.prior_work, display: "先行研究: Griffith 1921, The phenomena of rupture and flow in solids（Philosophical Transactions of the Royal Society A 221, 163–198）"}
  pwc_griffith1921_fracture: {is: exp.prior_claim, display: "要旨: き裂は、広がることで解放されるひずみのエネルギーが、新しい面を作るエネルギーを上回るときに広がる。"}
  pw_saintvenant1855_principle: {is: exp.prior_work, display: "先行研究: Saint-Venant 1855, Mémoire sur la torsion des prismes（Mémoires présentés par divers savants à l'Académie des Sciences 14, 233–560）"}
  pwc_saintvenant1855_principle: {is: exp.prior_claim, display: "要旨: 力の加え方の違いは、加えた場所の近くにしか効かず、遠くでは合力だけで応答が決まる。"}
facts:
  - {is: syntax.v_use, from: prior_mat, to: exp}
  - {is: exp.v_state, from: pw_hooke1678_elasticity, to: pwc_hooke1678_elasticity}
  - {is: exp.v_state, from: pw_tresca1864_yield, to: pwc_tresca1864_yield}
  - {is: exp.v_state, from: pw_vonmises1913_yield, to: pwc_vonmises1913_yield}
  - {is: exp.v_state, from: pw_drucker1951_stability, to: pwc_drucker1951_stability}
  - {is: exp.v_state, from: pw_wohler1870_fatigue, to: pwc_wohler1870_fatigue}
  - {is: exp.v_state, from: pw_euler1744_buckling, to: pwc_euler1744_buckling}
  - {is: exp.v_state, from: pw_griffith1921_fracture, to: pwc_griffith1921_fracture}
  - {is: exp.v_state, from: pw_saintvenant1855_principle, to: pwc_saintvenant1855_principle}
