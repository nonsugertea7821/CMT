domain: prior_phys
individuals:
  prior_phys: {is: domain, display: 物理学の先行研究}
  pw_noether1918_symmetry: {is: exp.prior_work, display: "先行研究: Noether 1918, Invariante Variationsprobleme（Nachrichten von der Gesellschaft der Wissenschaften zu Göttingen, 235–257）"}
  pwc_noether1918_symmetry: {is: exp.prior_claim, display: "要旨: 作用が連続的な対称性を持てば、それに対応する保存量がある。変換で変わらないものが、量を定める。"}
  pw_landau1937_phase: {is: exp.prior_work, display: "先行研究: Landau 1937, On the theory of phase transitions（Zhurnal Eksperimental'noi i Teoreticheskoi Fiziki 7, 19–32）"}
  pwc_landau1937_phase: {is: exp.prior_claim, display: "要旨: 相転移は対称性の破れとして書け、破れの程度を秩序変数で表す。一つの相が、区別できる複数の相に分かれる。"}
  pw_hopfield1982_attractor: {is: exp.prior_work, display: "先行研究: Hopfield 1982, Neural networks and physical systems with emergent collective computational abilities（PNAS 79(8), 2554–2558）"}
  pwc_hopfield1982_attractor: {is: exp.prior_claim, display: "要旨: 対称な結合の網は、エネルギーの極小に引き込まれ、記憶をアトラクタとして持つ。部分の手がかりから全体が戻る。"}
  pw_kadanoff1966_block: {is: exp.prior_work, display: "先行研究: Kadanoff 1966, Scaling laws for Ising models near Tc（Physics Physique Fizika 2(6), 263–272）"}
  pwc_kadanoff1966_block: {is: exp.prior_claim, display: "要旨: 近い格子点をまとめたブロックで書き直しても、臨界点の近くでは同じ形の法則が成り立つ。粗視化の下で変わらない形がある。"}
  pw_wilson1971_rg: {is: exp.prior_work, display: "先行研究: Wilson 1971, Renormalization group and critical phenomena I（Physical Review B 4(9), 3174–3183）"}
  pwc_wilson1971_rg: {is: exp.prior_claim, display: "要旨: 粗視化を繰り返す変換の流れで、臨界の振る舞いが固定点とそのまわりの関係のある方向だけで決まる。細部の多くは効かない。"}
  pw_jaynes1957_maxent: {is: exp.prior_work, display: "先行研究: Jaynes 1957, Information theory and statistical mechanics（Physical Review 106(4), 620–630）"}
  pwc_jaynes1957_maxent: {is: exp.prior_claim, display: "要旨: 与えられた制約のもとで、エントロピーが最大の分布を選ぶのが、偏りの最も少ない推論である。"}
  pw_yang1954_gauge: {is: exp.prior_work, display: "先行研究: Yang & Mills 1954, Conservation of isotopic spin and isotopic gauge invariance（Physical Review 96(1), 191–195）"}
  pwc_yang1954_gauge: {is: exp.prior_claim, display: "要旨: 場所ごとに独立に選べる内部の座標の取り方（局所のゲージ）を許すと、その取り方をつなぐ場が要る。つなぎ方の矛盾が場の強さになる。"}
  pw_gellmann1961_eightfold: {is: exp.prior_work, display: "先行研究: Gell-Mann 1961, The Eightfold Way: a theory of strong interaction symmetry（Caltech Synchrotron Laboratory Report CTSL-20）"}
  pwc_gellmann1961_eightfold: {is: exp.prior_claim, display: "要旨: ハドロンは、対称性の群の表現（多重項）にまとまる。空いた場所から、まだ見つかっていない粒子が予言できる。"}
  pw_buckingham1914_pi: {is: exp.prior_work, display: "先行研究: Buckingham 1914, On physically similar systems; illustrations of the use of dimensional equations（Physical Review 4(4), 345–376）"}
  pwc_buckingham1914_pi: {is: exp.prior_claim, display: "要旨: 物理の関係は、次元を持たない量の組の間の関係に書き直せる。独立な無次元量の数は、量の数から基本の次元の数を引いたもの。"}
  pw_fedorov1891_space_groups: {is: exp.prior_work, display: "先行研究: Fedorov 1891, Symmetry of regular systems of figures（Zapiski Imperatorskogo Sankt-Peterburgskogo Mineralogicheskogo Obshchestva 28, 1–146）"}
  pwc_fedorov1891_space_groups: {is: exp.prior_claim, display: "要旨: 三次元の結晶の対称性は、230 の空間群で尽くされる。対称性だけから分類が出し尽くされる。"}
