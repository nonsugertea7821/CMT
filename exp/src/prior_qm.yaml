domain: prior_qm
individuals:
  prior_qm: {is: domain, display: 量子力学の先行研究}
  pw_zeeman1897_splitting: {is: exp.prior_work, display: "先行研究: Zeeman 1897, On the influence of magnetism on the nature of the light emitted by a substance（Philosophical Magazine 43(262), 226–239）"}
  pwc_zeeman1897_splitting: {is: exp.prior_claim, display: "要旨: 磁場の中では、一本のスペクトル線が複数に分かれる。同じ準位に重なっていた状態が、外場で区別される。"}
  pw_neumann1929_crossing: {is: exp.prior_work, display: "先行研究: von Neumann & Wigner 1929, Über das Verhalten von Eigenwerten bei adiabatischen Prozessen（Physikalische Zeitschrift 30, 467–470）"}
  pwc_neumann1929_crossing: {is: exp.prior_claim, display: "要旨: 同じ対称性の二つの準位は、パラメータを変えても交わらず、近づくと反発する（避けられた交差）。"}
  pw_birkhoff1936_quantum_logic: {is: exp.prior_work, display: "先行研究: Birkhoff & von Neumann 1936, The logic of quantum mechanics（Annals of Mathematics 37(4), 823–843）"}
  pwc_birkhoff1936_quantum_logic: {is: exp.prior_claim, display: "要旨: 量子の命題をヒルベルト空間の閉部分空間とすると、命題の束は分配律を満たさない。否定は直交補空間になる。"}
  pw_widdows2003_negation: {is: exp.prior_work, display: "先行研究: Widdows 2003, Orthogonal negation in vector spaces for modelling word-meanings and document retrieval（ACL 2003, 136–143）"}
  pwc_widdows2003_negation: {is: exp.prior_claim, display: "要旨: 語の意味のベクトルで、否定を直交補空間への射影として書くと、望まない意味を除いた検索ができる。"}
  pw_kochen1967_contextuality: {is: exp.prior_work, display: "先行研究: Kochen & Specker 1967, The problem of hidden variables in quantum mechanics（Journal of Mathematics and Mechanics 17(1), 59–87）"}
  pwc_kochen1967_contextuality: {is: exp.prior_claim, display: "要旨: 三次元以上では、測定の文脈に依らずに全ての観測量へ値を割り当てることはできない。"}
  pw_bell1964_nonlocality: {is: exp.prior_work, display: "先行研究: Bell 1964, On the Einstein Podolsky Rosen paradox（Physics 1(3), 195–200）"}
  pwc_bell1964_nonlocality: {is: exp.prior_claim, display: "要旨: 局所的な隠れた変数の理論は、量子力学の予言する相関を再現できない（ベルの不等式）。"}
  pw_busemeyer2012_quantum_cognition: {is: exp.prior_work, display: "先行研究: Busemeyer & Bruza 2012, Quantum Models of Cognition and Decision（Cambridge University Press）"}
  pwc_busemeyer2012_quantum_cognition: {is: exp.prior_claim, display: "要旨: 判断と意思決定の確率を、量子の確率の形式（射影と干渉）でモデル化する。古典の確率に合わない判断を説明する。"}
  pw_wang2013_order_effect: {is: exp.prior_work, display: "先行研究: Wang & Busemeyer 2013, A quantum question order model supported by empirical tests of an a priori and precise prediction（Topics in Cognitive Science 5(4), 689–710）"}
  pwc_wang2013_order_effect: {is: exp.prior_claim, display: "要旨: 問いの順で答えが変わる効果を、非可換な射影の列としてモデル化し、順序効果の間の関係を予言して確かめた。"}
  pw_schrodinger1935_entanglement: {is: exp.prior_work, display: "先行研究: Schrödinger 1935, Die gegenwärtige Situation in der Quantenmechanik（Naturwissenschaften 23, 807–812）"}
  pwc_schrodinger1935_entanglement: {is: exp.prior_claim, display: "要旨: 合成系の状態は、部分の状態の組に分けられないことがある（もつれ）。全体を知っても部分が決まらない。"}
