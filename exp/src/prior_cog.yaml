domain: prior_cog
individuals:
  prior_cog: {is: domain, display: 認知科学と心理学の先行研究}
  pw_rosch1975_prototype: {is: exp.prior_work, display: "先行研究: Rosch 1975, Cognitive representations of semantic categories（Journal of Experimental Psychology: General 104(3), 192–233）"}
  pwc_rosch1975_prototype: {is: exp.prior_claim, display: "要旨: 範疇の成員には典型の度合いがあり、典型的な成員ほど速く確かに範疇と判断される。"}
  pw_rosch1976_basic_level: {is: exp.prior_work, display: "先行研究: Rosch, Mervis, Gray, Johnson & Boyes-Braem 1976, Basic objects in natural categories（Cognitive Psychology 8(3), 382–439）"}
  pwc_rosch1976_basic_level: {is: exp.prior_claim, display: "要旨: 階層には、情報が最も多く区別も最も効く基本の段（椅子、犬など）があり、まずその段で物を認識する。"}
  pw_nosofsky1986_exemplar: {is: exp.prior_work, display: "先行研究: Nosofsky 1986, Attention, similarity, and the identification–categorization relationship（Journal of Experimental Psychology: General 115(1), 39–57）"}
  pwc_nosofsky1986_exemplar: {is: exp.prior_claim, display: "要旨: 分類は、蓄えた事例との注意で重みづけた類似で決まる。定義でなく事例から範疇を判断する。"}
  pw_gentner1983_structure_mapping: {is: exp.prior_work, display: "先行研究: Gentner 1983, Structure-mapping: A theoretical framework for analogy（Cognitive Science 7(2), 155–170）"}
  pwc_gentner1983_structure_mapping: {is: exp.prior_claim, display: "要旨: 類推は、対象の属性ではなく、関係の構造を領域の間で写すこと。高い階の関係ほど写されやすい。"}
  pw_gick1983_schema: {is: exp.prior_work, display: "先行研究: Gick & Holyoak 1983, Schema induction and analogical transfer（Cognitive Psychology 15(1), 1–38）"}
  pwc_gick1983_schema: {is: exp.prior_claim, display: "要旨: 複数の事例を比べると共通の抽象の型（スキーマ）が引き出され、新しい問題への転移が上がる。事例一つでは転移が乏しい。"}
  pw_carey2009_origin: {is: exp.prior_work, display: "先行研究: Carey 2009, The Origin of Concepts（Oxford University Press）"}
  pwc_carey2009_origin: {is: exp.prior_claim, display: "要旨: 新しい概念は、既にある記号を足場にして組み直す（Quine 的な足場かけ）ことで生まれる。生まれつきの核の概念から出発する。"}
  pw_mandler2004_foundations: {is: exp.prior_work, display: "先行研究: Mandler 2004, The Foundations of Mind: Origins of Conceptual Thought（Oxford University Press）"}
  pwc_mandler2004_foundations: {is: exp.prior_claim, display: "要旨: 乳児の概念は、粗い全体の区別（動物か乗り物か）から始まり、細かい区別へ分かれていく。"}
  pw_lakoff1980_metaphor: {is: exp.prior_work, display: "先行研究: Lakoff & Johnson 1980, Metaphors We Live By（University of Chicago Press）"}
  pwc_lakoff1980_metaphor: {is: exp.prior_claim, display: "要旨: 抽象の概念は、具体の経験の領域からの写し（概念メタファー）で組み立てられる。"}
  pw_kemp2008_structural_form: {is: exp.prior_work, display: "先行研究: Kemp & Tenenbaum 2008, The discovery of structural form（PNAS 105(31), 10687–10692）"}
  pwc_kemp2008_structural_form: {is: exp.prior_claim, display: "要旨: データに合う構造の形（木、環、格子、順序など）を、形を生む文法の上の確率の推論で選び、その形の具体の構造を見つける。"}
  pw_lake2015_program_induction: {is: exp.prior_work, display: "先行研究: Lake, Salakhutdinov & Tenenbaum 2015, Human-level concept learning through probabilistic program induction（Science 350(6266), 1332–1338）"}
  pwc_lake2015_program_induction: {is: exp.prior_claim, display: "要旨: 概念を、部品を組み合わせる確率のプログラムとして表すと、一つの例から人と同じ程度に学び、一般化できる。"}
  pw_mitchell2021_abstraction: {is: exp.prior_work, display: "先行研究: Mitchell 2021, Abstraction and analogy-making in artificial intelligence（Annals of the New York Academy of Sciences 1505(1), 79–101）"}
  pwc_mitchell2021_abstraction: {is: exp.prior_claim, display: "要旨: いまの AI の脆さの一因は、抽象と類推の力が欠けていること。理想化した領域、核の知識、複数の領域にまたがる評価で研究すべき。"}
