domain: prior_dyn
individuals:
  prior_dyn: {is: domain, display: 力学系と工学の先行研究}
  pw_poincare1892_celestial: {is: exp.prior_work, display: "先行研究: Poincaré 1892, Les méthodes nouvelles de la mécanique céleste（Gauthier-Villars）"}
  pwc_poincare1892_celestial: {is: exp.prior_claim, display: "要旨: 力学系を、解の式ではなく相空間の軌道の定性的な形で調べる。パラメータの変化で、解の形が質的に変わる。"}
  pw_thom1972_catastrophe: {is: exp.prior_work, display: "先行研究: Thom 1972, Stabilité structurelle et morphogenèse（W. A. Benjamin）"}
  pwc_thom1972_catastrophe: {is: exp.prior_claim, display: "要旨: 滑らかな変化から不連続な飛びが生じる仕方は、少数の基本の型（カタストロフ）に分類できる。形の発生の数学。"}
  pw_kalman1960_observability: {is: exp.prior_work, display: "先行研究: Kalman 1960, On the general theory of control systems（Proceedings of the First IFAC Congress 1(1), 491–502）"}
  pwc_kalman1960_observability: {is: exp.prior_claim, display: "要旨: 出力の観測から内部の状態が決まるか（可観測性）と、入力で状態を動かせるか（可制御性）は、系の構造で決まる。"}
  pw_truesdell1965_constitutive: {is: exp.prior_work, display: "先行研究: Truesdell & Noll 1965, The Non-Linear Field Theories of Mechanics（Handbuch der Physik III/3, Springer）"}
  pwc_truesdell1965_constitutive: {is: exp.prior_claim, display: "要旨: 保存則はどの材料にも共通で、材料の違いは構成則に入る。構成則は、観測者の取り方に依らない形（客観性）を満たす。"}
