domain: prior_ai
individuals:
  prior_ai: {is: domain, display: 計算機科学とAIの先行研究}
  pw_arp2015_bfo: {is: exp.prior_work, display: "先行研究: Arp, Smith & Spear 2015, Building Ontologies with Basic Formal Ontology（MIT Press）"}
  pwc_arp2015_bfo: {is: exp.prior_claim, display: "要旨: 上位オントロジーとして、持続するもの（continuant）と生起するもの（occurrent）を分け、その下に領域のオントロジーを置く。"}
  pw_gangemi2002_dolce: {is: exp.prior_work, display: "先行研究: Gangemi, Guarino, Masolo, Oltramari & Schneider 2002, Sweetening ontologies with DOLCE（EKAW 2002, 166–181）"}
  pwc_gangemi2002_dolce: {is: exp.prior_claim, display: "要旨: 認知と言語に寄せた上位オントロジーで、性質・質の空間・時間の中の存在を分けて書く。"}
  pw_baader2003_dl: {is: exp.prior_work, display: "先行研究: Baader, Calvanese, McGuinness, Nardi & Patel-Schneider 2003, The Description Logic Handbook（Cambridge University Press）"}
  pwc_baader2003_dl: {is: exp.prior_claim, display: "要旨: 概念と役割から概念を組み立てる論理で、概念の包摂と充足可能性を決定できる範囲を与える。"}
  pw_elhage2022_superposition: {is: exp.prior_work, display: "先行研究: Elhage et al. 2022, Toy Models of Superposition（Transformer Circuits Thread）"}
  pwc_elhage2022_superposition: {is: exp.prior_claim, display: "要旨: 網は次元の数より多い特徴を、ほぼ直交する方向に重ねて持つ。疎さに応じて、表現の相が切り替わる。"}
  pw_park2024_linear_representation: {is: exp.prior_work, display: "先行研究: Park, Choe & Veitch 2024, The Linear Representation Hypothesis and the Geometry of Large Language Models（ICML 2024, arXiv:2311.03658）"}
  pwc_park2024_linear_representation: {is: exp.prior_claim, display: "要旨: 高い階の概念は表現空間の方向として表され、その方向を正しく比べる内積（因果の内積）がある。"}
  pw_papyan2020_collapse: {is: exp.prior_work, display: "先行研究: Papyan, Han & Donoho 2020, Prevalence of neural collapse during the terminal phase of deep learning training（PNAS 117(40), 24652–24663）"}
  pwc_papyan2020_collapse: {is: exp.prior_claim, display: "要旨: 学習の終わりには、各クラスの特徴がその平均に縮み、平均たちは正単体の頂点に並ぶ。"}
  pw_chung2018_manifold_capacity: {is: exp.prior_work, display: "先行研究: Chung, Lee & Sompolinsky 2018, Classification and Geometry of General Perceptual Manifolds（Physical Review X 8(3), 031003）"}
  pwc_chung2018_manifold_capacity: {is: exp.prior_claim, display: "要旨: 線形に分けられる多様体（同じものの表現の集まり）の数は、表現の次元に比例して増える。比例の係数は、多様体の半径と次元で決まる。"}
  pw_cohen2020_object_manifolds: {is: exp.prior_work, display: "先行研究: Cohen, Chung, Lee & Sompolinsky 2020, Separability and geometry of object manifolds in deep neural networks（Nature Communications 11, 746）"}
  pwc_cohen2020_object_manifolds: {is: exp.prior_claim, display: "要旨: 深い網の層が進むにつれて、物体の多様体の半径と次元と、多様体どうしの相関が下がり、分けられる数が上がる。"}
  pw_sorscher2022_few_shot_geometry: {is: exp.prior_work, display: "先行研究: Sorscher, Ganguli & Sompolinsky 2022, Neural representational geometry underlies few-shot concept learning（PNAS 119(43), e2200800119）"}
  pwc_sorscher2022_few_shot_geometry: {is: exp.prior_claim, display: "要旨: 少数の例からの新しい概念の学習の正しさは、表現の幾何の測れる量（多様体の半径、次元、中心どうしの距離、信号と雑音の重なり）で予測できる。"}
facts:
  - {is: syntax.v_use, from: prior_ai, to: exp}
  - {is: exp.v_state, from: pw_arp2015_bfo, to: pwc_arp2015_bfo}
  - {is: exp.v_state, from: pw_gangemi2002_dolce, to: pwc_gangemi2002_dolce}
  - {is: exp.v_state, from: pw_baader2003_dl, to: pwc_baader2003_dl}
  - {is: exp.v_state, from: pw_elhage2022_superposition, to: pwc_elhage2022_superposition}
  - {is: exp.v_state, from: pw_park2024_linear_representation, to: pwc_park2024_linear_representation}
  - {is: exp.v_state, from: pw_papyan2020_collapse, to: pwc_papyan2020_collapse}
  - {is: exp.v_state, from: pw_chung2018_manifold_capacity, to: pwc_chung2018_manifold_capacity}
  - {is: exp.v_state, from: pw_cohen2020_object_manifolds, to: pwc_cohen2020_object_manifolds}
  - {is: exp.v_state, from: pw_sorscher2022_few_shot_geometry, to: pwc_sorscher2022_few_shot_geometry}
  - {is: syntax.v_refer, from: pwc_chung2018_manifold_capacity, to: {is: exp.v_raise, from: exp.wide_hidden_state, to: exp.sibling_discrimination}}
