domain: prior_bio
individuals:
  prior_bio: {is: domain, display: 生物学の先行研究}
  pw_linnaeus1735_systema: {is: exp.prior_work, display: "先行研究: Linnaeus 1735, Systema Naturae"}
  pwc_linnaeus1735_systema: {is: exp.prior_claim, display: "要旨: 生物を界・綱・目・属・種の入れ子の階層に分類し、属名と種小名の二つで種を名づける。"}
  pw_hennig1950_cladistics: {is: exp.prior_work, display: "先行研究: Hennig 1950, Grundzüge einer Theorie der phylogenetischen Systematik（Deutscher Zentralverlag）"}
  pwc_hennig1950_cladistics: {is: exp.prior_claim, display: "要旨: 分類群は、共通の祖先とその子孫のすべてからなる（単系統）ときに限って認める。共有派生形質で群を定める。"}
  pw_mayr1942_species: {is: exp.prior_work, display: "先行研究: Mayr 1942, Systematics and the Origin of Species（Columbia University Press）"}
  pwc_mayr1942_species: {is: exp.prior_claim, display: "要旨: 種を、互いに交配できて他から生殖的に隔離された集団として定める。種の定義はほかにも複数あり、争われている。"}
  pw_waddington1957_landscape: {is: exp.prior_work, display: "先行研究: Waddington 1957, The Strategy of the Genes（George Allen & Unwin）"}
  pwc_waddington1957_landscape: {is: exp.prior_claim, display: "要旨: 発生を、分かれていく谷の地形を転がる球として描く。分化は谷の分岐で、谷は乱れに対して道を保つ（運河化）。"}
  pw_wolpert1969_positional: {is: exp.prior_work, display: "先行研究: Wolpert 1969, Positional information and the spatial pattern of cellular differentiation（Journal of Theoretical Biology 25(1), 1–47）"}
  pwc_wolpert1969_positional: {is: exp.prior_claim, display: "要旨: 細胞は、座標のような位置の情報を読み、それを解釈して分化する。情報と解釈が分かれる。"}
  pw_turing1952_morphogenesis: {is: exp.prior_work, display: "先行研究: Turing 1952, The chemical basis of morphogenesis（Philosophical Transactions of the Royal Society B 237, 37–72）"}
  pwc_turing1952_morphogenesis: {is: exp.prior_claim, display: "要旨: 反応と拡散だけで、一様な状態から周期的な模様が自発的に生まれる。"}
  pw_saxe2019_semantic_development: {is: exp.prior_work, display: "先行研究: Saxe, McClelland & Ganguli 2019, A mathematical theory of semantic development in deep neural networks（PNAS 116(23), 11537–11546）"}
  pwc_saxe2019_semantic_development: {is: exp.prior_claim, display: "要旨: 深い線形網の学習では、階層の粗い区別が先に、細かい区別が後に、段階的に分かれて学ばれる。順序は入出力の相関の特異値で決まる。"}
  pw_hutchinson1957_niche: {is: exp.prior_work, display: "先行研究: Hutchinson 1957, Concluding remarks（Cold Spring Harbor Symposia on Quantitative Biology 22, 415–427）"}
  pwc_hutchinson1957_niche: {is: exp.prior_claim, display: "要旨: 種のニッチを、環境の変数の n 次元空間の中の超体積として定める。"}
  pw_burnet1957_clonal: {is: exp.prior_work, display: "先行研究: Burnet 1957, A modification of Jerne's theory of antibody production using the concept of clonal selection（Australian Journal of Science 20, 67–69）"}
  pwc_burnet1957_clonal: {is: exp.prior_claim, display: "要旨: 抗原に合う受容体を持つ細胞が選ばれて増える。自己に反応するものは除かれ、自己と非自己が見分けられる。"}
  pw_okeefe1971_place: {is: exp.prior_work, display: "先行研究: O'Keefe & Dostrovsky 1971, The hippocampus as a spatial map（Brain Research 34(1), 171–175）"}
  pwc_okeefe1971_place: {is: exp.prior_claim, display: "要旨: 海馬には、動物が特定の場所にいるときに発火する細胞（場所細胞）がある。"}
  pw_hafting2005_grid: {is: exp.prior_work, display: "先行研究: Hafting, Fyhn, Molden, Moser & Moser 2005, Microstructure of a spatial map in the entorhinal cortex（Nature 436, 801–806）"}
  pwc_hafting2005_grid: {is: exp.prior_claim, display: "要旨: 嗅内皮質には、空間を三角格子状に覆う位置で発火する細胞（格子細胞）がある。空間の座標系にあたる。"}
  pw_behrens2018_cognitive_map: {is: exp.prior_work, display: "先行研究: Behrens et al. 2018, What is a cognitive map? Organizing knowledge for flexible behavior（Neuron 100(2), 490–509）"}
  pwc_behrens2018_cognitive_map: {is: exp.prior_claim, display: "要旨: 空間の地図の仕組みが、空間でない知識の関係の構造にも使われ、柔軟な推論を支える。"}
  pw_quiroga2005_concept_cells: {is: exp.prior_work, display: "先行研究: Quiroga, Reddy, Kreiman, Koch & Fried 2005, Invariant visual representation by single neurons in the human brain（Nature 435, 1102–1107）"}
  pwc_quiroga2005_concept_cells: {is: exp.prior_claim, display: "要旨: 人の内側側頭葉には、特定の人や物に、見え方が違っても選択的に応じる単一の細胞がある。"}
  pw_anfinsen1973_folding: {is: exp.prior_work, display: "先行研究: Anfinsen 1973, Principles that govern the folding of protein chains（Science 181(4096), 223–230）"}
  pwc_anfinsen1973_folding: {is: exp.prior_claim, display: "要旨: タンパク質の立体構造は、アミノ酸の並びで決まり、自由エネルギーが最小の形に折りたたまれる。"}
  pw_bryngelson1987_landscape: {is: exp.prior_work, display: "先行研究: Bryngelson & Wolynes 1987, Spin glasses and the statistical mechanics of protein folding（PNAS 84(21), 7524–7528）"}
  pwc_bryngelson1987_landscape: {is: exp.prior_claim, display: "要旨: 折りたたみをエネルギー地形の上の動きとして描き、地形がじょうご状であることが速く確かに折りたたまれる条件になる。"}
