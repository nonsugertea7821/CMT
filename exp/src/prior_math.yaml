domain: prior_math
individuals:
  prior_math: {is: domain, display: 数学と幾何の先行研究}
  pw_klein1872_erlangen: {is: exp.prior_work, display: "先行研究: Klein 1872, Vergleichende Betrachtungen über neuere geometrische Forschungen（Erlanger Programm）"}
  pwc_klein1872_erlangen: {is: exp.prior_claim, display: "要旨: 幾何とは、ある変換群の下で変わらない性質を調べるもの。群を替えると、別の幾何になる。"}
  pw_abramsky2011_sheaf: {is: exp.prior_work, display: "先行研究: Abramsky & Brandenburger 2011, The sheaf-theoretic structure of non-locality and contextuality（New Journal of Physics 13, 113036）"}
  pwc_abramsky2011_sheaf: {is: exp.prior_claim, display: "要旨: 局所の観測の組が、一つの大域の割り当てに張り合わせられないことを、層の言葉で文脈依存性として書く。"}
  pw_amari2000_infogeom: {is: exp.prior_work, display: "先行研究: Amari & Nagaoka 2000, Methods of Information Geometry（AMS / Oxford University Press）"}
  pwc_amari2000_infogeom: {is: exp.prior_claim, display: "要旨: 確率分布の族を多様体として扱い、Fisher 情報を計量にする。分布の間の距離と、まっすぐな道（測地線）が定まる。"}
  pw_nickel2017_poincare: {is: exp.prior_work, display: "先行研究: Nickel & Kiela 2017, Poincaré embeddings for learning hierarchical representations（NeurIPS 2017）"}
  pwc_nickel2017_poincare: {is: exp.prior_claim, display: "要旨: 木のような階層は、双曲空間に低い次元で歪み少なく埋め込める。ユークリッド空間では大きな次元が要る。"}
  pw_carlsson2009_tda: {is: exp.prior_work, display: "先行研究: Carlsson 2009, Topology and data（Bulletin of the AMS 46(2), 255–308）"}
  pwc_carlsson2009_tda: {is: exp.prior_claim, display: "要旨: 点の集まりの形を、尺度を変えても残る連結性や穴（持続ホモロジー）で調べる。"}
  pw_maclane1971_category: {is: exp.prior_work, display: "先行研究: Mac Lane 1971, Categories for the Working Mathematician（Springer）"}
  pwc_maclane1971_category: {is: exp.prior_claim, display: "要旨: 対象と射の構造を保つ写し（関手）で、異なる数学の領域の間の対応を書く。"}
  pw_wille1982_fca: {is: exp.prior_work, display: "先行研究: Wille 1982, Restructuring lattice theory: an approach based on hierarchies of concepts（Ordered Sets, Reidel, 445–470）"}
  pwc_wille1982_fca: {is: exp.prior_claim, display: "要旨: 対象と属性の関係から、外延と内包の対として概念を定め、概念が束（lattice）をなす。"}
  pw_ganter1999_fca: {is: exp.prior_work, display: "先行研究: Ganter & Wille 1999, Formal Concept Analysis: Mathematical Foundations（Springer）"}
  pwc_ganter1999_fca: {is: exp.prior_claim, display: "要旨: 形式概念分析の体系。概念束の作り方、属性の含意、その基底を与える。"}
  pw_gardenfors2000_spaces: {is: exp.prior_work, display: "先行研究: Gärdenfors 2000, Conceptual Spaces: The Geometry of Thought（MIT Press）"}
  pwc_gardenfors2000_spaces: {is: exp.prior_claim, display: "要旨: 性質は質の次元の空間の中の凸領域で、自然な概念は凸である。概念の類似は距離になる。"}
