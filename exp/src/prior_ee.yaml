domain: prior_ee
individuals:
  prior_ee: {is: domain, display: 電子工学の先行研究}
  pw_nyquist1928_telegraph: {is: exp.prior_work, display: "先行研究: Nyquist 1928, Certain topics in telegraph transmission theory（Transactions of the AIEE 47(2), 617–644）"}
  pwc_nyquist1928_telegraph: {is: exp.prior_claim, display: "要旨: 帯域の幅が決まると、送れる独立な値の速さの上限が決まる。"}
  pw_shannon1949_sampling: {is: exp.prior_work, display: "先行研究: Shannon 1949, Communication in the presence of noise（Proceedings of the IRE 37(1), 10–21）"}
  pwc_shannon1949_sampling: {is: exp.prior_claim, display: "要旨: 帯域が限られた信号は、帯域の二倍の速さの標本から完全に戻せる。雑音のもとでの通信路の容量が決まる。"}
  pw_gabor1946_communication: {is: exp.prior_work, display: "先行研究: Gabor 1946, Theory of communication. Part 1: The analysis of information（Journal of the IEE Part III 93(26), 429–441）"}
  pwc_gabor1946_communication: {is: exp.prior_claim, display: "要旨: 信号の時間の幅と周波数の幅は同時に小さくできず、その積に下限がある。"}
  pw_schmitt1938_trigger: {is: exp.prior_work, display: "先行研究: Schmitt 1938, A thermionic trigger（Journal of Scientific Instruments 15(1), 24–26）"}
  pwc_schmitt1938_trigger: {is: exp.prior_claim, display: "要旨: 上がるときと下がるときで切り替えの閾値をずらす（ヒステリシス）と、境の近くの雑音で出力がばたつかない。"}
  pw_black1934_feedback: {is: exp.prior_work, display: "先行研究: Black 1934, Stabilized feedback amplifiers（Bell System Technical Journal 13(1), 1–18）"}
  pwc_black1934_feedback: {is: exp.prior_claim, display: "要旨: 出力の一部を逆の向きに戻す（負帰還）と、増幅の度合いが部品のばらつきに依らなくなり、ひずみが減る。"}
  pw_bode1945_feedback: {is: exp.prior_work, display: "先行研究: Bode 1945, Network Analysis and Feedback Amplifier Design（Van Nostrand）"}
  pwc_bode1945_feedback: {is: exp.prior_claim, display: "要旨: 帰還のループの利得と位相から、系が安定か発振するかを判定し、その余裕を定める。"}
  pw_hamming1950_codes: {is: exp.prior_work, display: "先行研究: Hamming 1950, Error detecting and error correcting codes（Bell System Technical Journal 29(2), 147–160）"}
  pwc_hamming1950_codes: {is: exp.prior_claim, display: "要旨: 符号語の間の最小の距離が、見つけられる誤りと直せる誤りの数を決める。"}
  pw_thevenin1883_equivalent: {is: exp.prior_work, display: "先行研究: Thévenin 1883, Extension de la loi d'Ohm aux circuits électromoteurs complexes（Annales Télégraphiques 10, 222–224）"}
  pwc_thevenin1883_equivalent: {is: exp.prior_claim, display: "要旨: 線形の回路は、二つの端子から見ると、一つの電源と一つの抵抗に置き換えられる。中身は端子での振る舞いで同値になる。"}
  pw_kirchhoff1845_laws: {is: exp.prior_work, display: "先行研究: Kirchhoff 1845, Ueber den Durchgang eines elektrischen Stromes durch eine Ebene（Annalen der Physik und Chemie 64（通巻 140）, 497–514）"}
  pwc_kirchhoff1845_laws: {is: exp.prior_claim, display: "要旨: 節点に入る電流の和は零、閉路を回る電圧の和は零。保存則を、回路の構造の上の制約として書く。"}
  pw_bloch1929_band: {is: exp.prior_work, display: "先行研究: Bloch 1929, Über die Quantenmechanik der Elektronen in Kristallgittern（Zeitschrift für Physik 52, 555–600）"}
  pwc_bloch1929_band: {is: exp.prior_claim, display: "要旨: 周期的な結晶の中の電子の状態は、帯（バンド）に分かれる。わずかな不純物で、帯の間の性質が大きく変わる（半導体）。"}
