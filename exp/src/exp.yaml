  item_running: {display: 実行中の項目, extends: backlog_item_refer_from_performed_experiment, mod: {of: [v_refer, from], with: measured_experiment, neg: true}}
  item_queued: {display: 未着手の項目, extends: backlog_item, mod: {of: [v_refer, from], with: performed_experiment, neg: true}}
