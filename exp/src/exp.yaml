  prior_contrasted: {display: 先行研究と結果が異なる主張, extends: hypothesis, mod: refer_to_prior_work, many: true}
  doubt: {display: 仮説への疑い, extends: sentence, mod: {of: [v_challenge, from], with: hypothesis}}
  number_comparison: {display: 数の大小の照合, extends: inference, mod: {of: [v_refer, to], with: number}}
  lim_unquantified: {display: 数値化していない, extends: limitation, mod: {of: [v_refer, from], with: measured_value, neg: true}}
  decision: {display: 決定, extends: definition, mod: {of: [v_compose, from], with: information_entity_design_to}}
  dec_adopted: {display: 採用済みの決定, extends: decision, mod: adopted}
  dec_tentative: {display: 暫定の決定, extends: decision, mod: not_adopted}
  dec_withdrawn: {display: 取り下げた決定, extends: withdrawn_sentence, mod: {of: [is, from], with: decision}}
  hyp_withdrawn: {display: 取り下げた仮説, extends: withdrawn_sentence, mod: {of: [is, from], with: hypothesis}}
  basis: {display: 根拠となる仮説, extends: hypothesis, mod: {of: [v_depend, to], with: decision}, many: true}
