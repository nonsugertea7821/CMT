  measured_experiment: {display: 結果ファイルが述べる実験, extends: experiment, mod: {of: [v_refer, to], with: result_file}}
  backlog_item: {display: 残り項目, extends: sentence, mod: refer_from_experiment}
  tests: {display: 確かめる仮説, extends: hypothesis, mod: {of: [v_refer, to], with: backlog_item}, many: true}
