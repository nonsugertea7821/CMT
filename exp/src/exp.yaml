  pw_stringli2025_inverse_redefinition: {is: prior_work, display: "先行研究: Stringli et al. 2025, Pitfalls of Scale: Investigating the Inverse Task of Redefinition in Large Language Models（Findings of ACL 2025, arXiv:2502.12821）"}
  pw_eisenschlos2023_winodict: {is: prior_work, display: "先行研究: Eisenschlos et al. 2023, WinoDict: Probing language models for in-context word acquisition（EACL 2023, arXiv:2209.12153）"}
  pw_xu2024_knowledge_conflicts: {is: prior_work, display: "先行研究: Xu et al. 2024, Knowledge Conflicts for LLMs: A Survey（EMNLP 2024, arXiv:2403.08319）"}
  pw_liu2024_lost_in_the_middle: {is: prior_work, display: "先行研究: Liu et al. 2024, Lost in the Middle: How Language Models Use Long Contexts（TACL 12, aclanthology 2024.tacl-1.9）"}
  pw_turner2023_activation_addition: {is: prior_work, display: "先行研究: Turner et al. 2023, Activation Addition: Steering Language Models Without Optimization（arXiv:2308.10248）"}
  pw_panickssery2023_caa: {is: prior_work, display: "先行研究: Panickssery et al. 2023, Steering Llama 2 via Contrastive Activation Addition（arXiv:2312.06681）"}
  pw_todd2024_function_vectors: {is: prior_work, display: "先行研究: Todd et al. 2024, Function Vectors in Large Language Models（ICLR 2024, arXiv:2310.15213）"}
  pw_fodor2002_implicit_prosody: {is: prior_work, display: "先行研究: Fodor 2002, Prosodic Disambiguation in Silent Reading（NELS 32, pp. 113-132）"}
  pw_snedeker2003_prosody_ambiguity: {is: prior_work, display: "先行研究: Snedeker & Trueswell 2003, Using prosody to avoid ambiguity（Journal of Memory and Language 48(1), pp. 103-130）"}
  pw_radevski2026_steering_tokens: {is: prior_work, display: "先行研究: Radevski et al. 2026, Compositional Steering of Large Language Models with Steering Tokens（ACL 2026, aclanthology 2026.acl-long.1435）"}
  pw_eyuboglu2025_cartridges: {is: prior_work, display: "先行研究: Eyuboglu et al. 2025, Cartridges: Lightweight and general-purpose long context representations via self-study（ICLR 2026, arXiv:2506.06266）"}
  pw_teehan2024_college: {is: prior_work, display: "先行研究: Teehan, Lake & Ren 2024, CoLLEGe: Concept Embedding Generation for Large Language Models（arXiv:2403.15362）"}
  pw_lenat2023_cyc: {is: prior_work, display: "先行研究: Lenat & Marcus 2023, Getting from Generative AI to Trustworthy AI: What LLMs might learn from Cyc（arXiv:2308.04445）"}
  pw_luo2024_knowla: {is: prior_work, display: "先行研究: Luo et al. 2024, KnowLA: Enhancing Parameter-efficient Finetuning with Knowledgeable Adaptation（NAACL 2024, arXiv:2403.14950）"}
  pw_coppolillo2025_kg_injection: {is: prior_work, display: "先行研究: Coppolillo 2025, Injecting Knowledge Graphs into Large Language Models（arXiv:2505.07554）"}
  pw_babaei2025_ontotruth: {is: prior_work, display: "先行研究: Babaei Giglou et al. 2025, Beyond Statistical Parroting: Hard-Coding Truth into LLMs via Ontologies（CEUR-WS Vol-4079）"}
  pw_poiroux2024_typecheck: {is: prior_work, display: "先行研究: Poiroux et al. 2024, Improving Autoformalization using Type Checking（arXiv:2406.07222）"}
  pw_park2025_hierarchical_geometry: {is: prior_work, display: "先行研究: Park, Choe, Jiang & Veitch 2025, The Geometry of Categorical and Hierarchical Concepts in Large Language Models（ICLR 2025, arXiv:2406.01506）"}
  pw_hernandez2024_lre: {is: prior_work, display: "先行研究: Hernandez et al. 2024, Linearity of Relation Decoding in Transformer Language Models（ICLR 2024, arXiv:2308.09124）"}
  pw_christ2025_relation_operators: {is: prior_work, display: "先行研究: Christ, Csiszárik, Becsó & Varga 2025, The Structure of Relation Decoding Linear Operators in Large Language Models（arXiv:2510.26543）"}
  pwc_wang2025_interference: {is: prior_claim, display: "要旨: retrieval accuracy declines log-linearly toward zero as interference accumulates（前に並ぶ古い値が多いほど、最新の値の検索が下がる）"}
  pwc_liu2024_middle: {is: prior_claim, display: "要旨: performance is often highest when relevant information occurs at the beginning or end of the input context（関係する情報が末尾から離れて中ほどにあると下がる）"}
  pwc_stringli2025_anchoring: {is: prior_claim, display: "要旨: prompting strategies do not stop models from anchoring to memorized values（よく知られた定数を再定義しても、覚えた値に引きずられる）"}
  pwc_eisenschlos2023_new_words: {is: prior_claim, display: "要旨: accuracy drops sharply when the key concept word is replaced by a synthetic word defined in the prompt（定義を与えた合成語では正答率が大きく下がる）"}
  pwc_goworek2026_later_context: {is: prior_claim, display: "要旨: 後に来る文が指示の意味を保つ・弱める・逆にするかで結果が変わり、モデルは後の文脈に反応し続ける（再定義は固定の規則として働かない）"}
  pwc_xu2024_context_memory: {is: prior_claim, display: "要旨: context-memory conflict（文脈と記憶した知識の衝突）は、モデルの信頼性と性能を大きく損なう"}
  pwc_turner2023_actadd: {is: prior_claim, display: "要旨: 対になるプロンプトの活性化の差を推論時に足すと、話題や感情などの性質を狙った方へ動かせる"}
  pwc_panickssery2023_caa: {is: prior_claim, display: "要旨: 正例と負例の残差の活性化の平均の差を足すと、振る舞いが大きく変わる（能力の低下は小さい）"}
  pwc_todd2024_function_vector: {is: prior_claim, display: "要旨: 少数の注意ヘッドが運ぶ関数ベクトルを足すと、例示なしの文脈でもその課題が実行される"}
  pwc_fodor2002_implicit_prosody: {is: prior_claim, display: "要旨: 黙読でも読み手は既定の韻律を文に投影し、その句切りが関係節の掛かり先の解釈を左右する"}
  pwc_snedeker2003_prosody_ambiguity: {is: prior_claim, display: "要旨: 話し手は文脈で掛かり先が決まらないときに、掛かり先を示す韻律を作り、聞き手はそれを使う"}
  pwc_radevski2026_steering_tokens: {is: prior_claim, display: "要旨: 振る舞いを入力の専用トークンに埋め込むと、学習していない組み合わせにも汎化し、活性化の操舵より効く"}
  pwc_eyuboglu2025_self_study: {is: prior_claim, display: "要旨: コーパスごとに学習した小さな KV キャッシュは、合成した多様な会話で文脈蒸留すると、文脈に全文を置く場合と同等になる（次トークン予測だけでは届かない）"}
  pwc_teehan2024_transfer: {is: prior_claim, display: "要旨: 少数の例文や定義から作った新しい概念の埋め込みは、課題ごとの学習なしに、定義の推測と言語推論の両方に効く（新しい語について）"}
  pwc_lenat2023_hybrid: {is: prior_claim, display: "要旨: 明示的な知識と推論機関を持つ形式的な体系は、推論の各段を元の知識までたどれるようにする。信頼できる AI は LLM とこれの混成が要る"}
  pwc_luo2024_kg_adapter: {is: prior_claim, display: "要旨: 入力に現れる実体の KG 埋め込みを、層に挟んだ適応層で混ぜると、知識を問う課題の成績が上がる"}
  pwc_coppolillo2025_graph_tokens: {is: prior_claim, display: "要旨: KG 埋め込みをトークンにして入力に足すと、LLM を学習し直さずに、KG についての推論が上がる"}
  pwc_babaei2025_axioms_in_prompt: {is: prior_claim, display: "要旨: オントロジーの公理をプロンプトに入れると、回答の正しさが上がる（Pizza Ontology、0.5B〜72B）"}
  pwc_poiroux2024_filter: {is: prior_claim, display: "要旨: 型検査を通らない候補を捨てると、自然言語から Lean への形式化の正しさが上がる（ProofNet で最大 +18.4 ポイント）"}
  pwc_park2025_orthogonal_refinement: {is: prior_claim, display: "要旨: 階層は直交として表される。下位の概念のベクトルは、上位のベクトルに、それと直交する差分を足したもの（Gemma, LLaMA-3、WordNet 900 以上の概念）"}
  pwc_hernandez2024_linear_relation: {is: prior_claim, display: "要旨: 一部の関係では、モデルの関係の読み出しは、主語の表現への1つの線形変換で近似できる"}
  pwc_christ2025_property_based: {is: prior_claim, display: "要旨: 関係ごとの線形演算子は関係に固有ではなく、関係をまたぐ性質を取り出している。そのため、学習していない関係への汎化は、近い関係にしか届かない"}
