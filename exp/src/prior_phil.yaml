domain: prior_phil
individuals:
  prior_phil: {is: domain, display: 哲学と論理学の先行研究}
  pw_aristotle_topics_definition: {is: exp.prior_work, display: "先行研究: Aristotle, Topics（Topica）"}
  pwc_aristotle_topics_definition: {is: exp.prior_claim, display: "要旨: 定義は、類と種差で与える。何であるかを、上の類と、同じ類の中で区別する差で言う。"}
  pw_porphyry_isagoge: {is: exp.prior_work, display: "先行研究: Porphyry, Isagoge"}
  pwc_porphyry_isagoge: {is: exp.prior_claim, display: "要旨: 類と種を、最上の類から最下の種まで、種差で二つに分けていく木（ポルピュリオスの木）として並べる。"}
  pw_wittgenstein1953_family: {is: exp.prior_work, display: "先行研究: Wittgenstein 1953, Philosophical Investigations（Blackwell）"}
  pwc_wittgenstein1953_family: {is: exp.prior_claim, display: "要旨: 「遊び」のような語の用例には、全部に共通する性質はなく、重なり合う類似（家族的類似）でつながる。"}
  pw_carnap1952_postulates: {is: exp.prior_work, display: "先行研究: Carnap 1952, Meaning postulates（Philosophical Studies 3(5), 65–73）"}
  pwc_carnap1952_postulates: {is: exp.prior_claim, display: "要旨: 語の間の分析的な関係を、意味公準として明示した公理で与える。"}
