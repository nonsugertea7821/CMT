domain: en_basic

nodes:
  come: {display: 到来, extends: occurrent, from: continuant, to: continuant, pre: [{is: part, from: from, to: to, neg: true}], post: [{is: part, from: from, to: to}]}
  go: {display: 動く, extends: occurrent, from: continuant, to: continuant, new_kind: continuant,
         pre: [{is: part, from: from, to: new}], post: [{is: part, from: from, to: new, neg: true}, {is: part, from: from, to: to}]}
  put: {display: 置く, extends: occurrent, from: continuant, to: continuant, new_kind: continuant,
          pre: [{is: part, from: to, to: new, neg: true}], post: [{is: part, from: to, to: new}, {is: depend, from: to, to: from}]}
  keep: {display: 続ける, extends: occurrent, from: continuant, to: continuant, new_kind: quality,
           pre: [{is: depend, from: new, to: to}], post: [{is: depend, from: new, to: to}, {is: depend, from: to, to: from}]}
  be: {display: ではある, extends: occurrent, from: continuant, to: quality, holds: [{is: depend, from: to, to: from}]}
  say: {display: 発語, extends: occurrent, from: continuant, to: any, new_kind: sentence,
          pre: [{is: exists, from: new, neg: true}], post: [{is: exists, from: new}, {is: depend, from: new, to: from}, {is: refer, from: new, to: to}]}
  see: {display: ご覧になる, extends: occurrent, from: continuant, to: continuant, new_kind: information_entity,
          pre: [{is: exists, from: new, neg: true}], post: [{is: exists, from: new}, {is: depend, from: new, to: from}, {is: depend, from: new, to: to}, {is: refer, from: new, to: to}]}
  send: {display: 向かわせる, extends: v_trigger, to: go}

  animal: {display: 動物, extends: performer, mod: {of: [go, from]}}
  invention: {display: 発明, extends: artifact, mod: {of: [v_design, to], with: performer}}
  science: {display: 科学, extends: information_entity, mod: refer_from_experiment}
  learning: {display: 修得, extends: process, mod: {of: [v_stage, to], with: v_learn}}
  step: {display: 方策, extends: inference, mod: {of: [v_stage, from], with: process}}
  chalk: {display: 白墨, extends: artifact, mod: {of: [v_express, to], with: sentence}}
  position: {display: 場所, extends: continuant, mod: {of: [come, to]}}
  meat: {display: 食肉, extends: component, mod: {of: [v_compose, from], with: animal}}
  addition: {display: 添, extends: process, mod: {of: [v_stage, to], with: v_sum}}
  grip: {display: 握っていること, extends: process, mod: {of: [v_stage, to], with: keep}}
  mark: {display: 点数, extends: magnitude, mod: computed}
  attraction: {display: 引力, extends: disposition, mod: {of: [v_trigger, from], with: come}}
  experience: {display: 経験, extends: information_entity, mod: {of: [see, new]}}
  cause: {display: 導因, extends: process, mod: {of: [v_trigger, from]}}
  name: {display: 呼称, extends: word, mod: {of: [v_refer, from], with: continuant}}
  map: {display: 軍用地図, extends: information_entity, mod: {of: [v_refer, from], with: position}}

individuals:
  en_basic: {is: domain, display: 英語の基礎語彙}

facts:
  - {is: v_use, from: en_basic, to: syntax}
  - {is: v_use, from: en_basic, to: std}
  - {is: v_presume, from: en_basic, to: closed_world}
