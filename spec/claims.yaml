decisions:
  # p は動詞。is_a だけは動詞ではなく、体系の上位・下位の関係そのもので、検査が構造から確かめる。
  d_goal:
    {s: this_design, p: v_raise, o: redefinition_success, status: dec_adopted, supersedes: [d_avoid_redefinition]}
  d_avoid_redefinition:
    {s: definition, p: v_refer, o: new_word, status: dec_withdrawn}
  d_metric:
    {s: cross_usage_consistency, p: v_measure, o: redefinition_success, status: dec_adopted, supersedes: [d_metric_following],
     basis: [h_recite_does_not_transfer_to_apply, h_apply_does_not_transfer_to_paraphrase]}
  d_metric_following:
    {s: redefinition_following, p: v_measure, o: redefinition_success, status: dec_withdrawn}
  d_source_of_truth_location:
    {s: depended_information, p: v_compose, o: typed_graph, status: dec_adopted}
  d_source_of_truth_content:
    {s: depended_information, p: v_consist, o: [definition, application_example], status: dec_tentative,
     basis: [h_recite_does_not_transfer_to_apply, h_vector_raises_following]}
  d_test_is_material:
    {s: test, p: is_a, o: application_example, status: dec_adopted, basis: [h_recite_does_not_transfer_to_apply]}
  d_term_server_selects:
    {s: glossary, p: v_consist, o: relevant_definitions, status: dec_tentative, basis: [h_preceding_definitions_lower]}
  d_redefinition_at_head:
    {s: redefinition, p: is_a, o: glossary_head, status: dec_tentative,
     basis: [h_preceding_definitions_lower, h_following_definitions_do_not_lower],
     note: "検査は、この決定を構造から確かめない（tentative）。用語集に入れる再定義は、先頭に置く、という取り決め"}
  d_verdict_by_vector:
    {s: verdict, p: v_rely, o: concept_vector, status: dec_tentative, basis: [h_vector_raises_following, h_vector_raises_following_free]}
  d_explanation_by_text:
    {s: usage_explain, p: v_rely, o: text_injection, status: dec_tentative, basis: [h_both_teachers_raise_control_in_combo]}
  d_consolidation_in_vector:
    {s: change_holder, p: is_a, o: taught_vector, status: dec_tentative, basis: [h_vector_count_does_not_lower],
     note: "検査は、この決定を構造から確かめない（tentative）。与えられた意味を保持するのは、教示で得られたベクトル、という取り決め"}
  d_source_of_truth_in_controlled_language:
    {s: depended_information, p: v_express, o: controlled_language, status: dec_adopted,
     note: "体系制御言語とは、ontology.yaml の書き方による記述そのものを指す"}
  d_rendered_text_is_derived:
    {s: rendered_text, p: v_rely, o: depended_information, status: dec_adopted,
     note: "自然言語の文は、正本から変換して得る表示。変換は LLM が行ってもシステムが行ってもよい"}
  d_symbol_selection_symbolic:
    {s: symbol_selection, p: v_rely, o: typed_graph, status: dec_tentative}
  d_vector_needs_open_weights:
    {s: concept_vector, p: v_rely, o: open_weight_model, status: dec_adopted}
  d_text_for_api_models:
    {s: api_only_model, p: v_rely, o: text_injection, status: dec_adopted}

