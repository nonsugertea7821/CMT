  sentence_refer_from_hypothesis: {display: 仮説へ述べる文, extends: sentence, mod: {of: [v_refer, from], with: hypothesis}}
  role_depend_from_rule_source_of_truth: {display: 正本の取り決めへ依存する役割, extends: role, mod: {of: [v_depend, from], with: rule_source_of_truth}}
