  untaught_usage: {display: 教えていない使い方, extends: usage, mod: {of: [v_refer, to], with: teaching_material, neg: true}}

  # ===== モデルと設計 =====
  layer: {display: 層, extends: artifact_compute_from, mod: {of: [v_compose, from], with: model}}
  open_weight_model: {display: 重みが公開されたモデル, extends: model, mod: {of: [v_expose, from], with: weights}}
  api_only_model: {display: APIでしか使えないモデル, extends: model, mod: {of: [v_expose, from], with: weights, neg: true}}
  attention: {display: 注意機構, extends: artifact_compute_from, mod: {of: [v_compose, from], with: layer}}
