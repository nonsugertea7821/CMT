# 領域 exp（実験）。体系（ontology.yaml）の一部で、同じ検査にかかる。
# nodes:       この領域の種類。書き方は ontology.yaml と同じ。領域の中の識別子は、領域を書かずに書く。
#              ほかの領域からは exp.名前 と書いて参照する。core と run は参照できるが、逆はできない（法則 layered）。
# individuals: 個体。is で種類に1つだけ属する（ほかに表示語 ja と、軸の値 val を持てる）。
#              仮説・決定・残り項目は、状態を表す下位の種類に属する（例 is: hyp_supported）。
# facts:       事実。1つの事実は、1つの動詞の個体で、位置に名前を付けて書く: {is: 動詞, from: 始点, to: 終点, new: 第三のもの}。
#              文（観察・仮説・決定）が述べる中身は、同じ形を v_refer の終点に置く。中身は主張されない（事実ではない）。
#              個数は at で書く: {is: v_compose, from: layer, to: model_15b, at: {count: 28}}（層が28個、部分になる）。
# 種類と個体の分け方: それ自体が個体を持つものが種類。1つしかないもの（特定のモデル、個々の観察）が個体。
domain: exp
nodes:
  # ===== 動詞 =====
  v_answer: {ja: 答える, extends: occurrent, from: continuant, to: continuant, holds: [{is: refer, from: from, to: to}, {is: after, from: from, to: to}]}
  v_judge: {ja: 判定する, extends: occurrent, from: continuant, to: continuant, new_kind: information_entity,
            pre: [{is: exists, from: new, neg: true}], post: [{is: exists, from: new}, {is: depend, from: new, to: from}, {is: refer, from: new, to: to}]}
  v_teach: {ja: 教える, extends: occurrent, from: continuant, to: continuant, new_kind: realizable_entity,
            pre: [{is: exists, from: new, neg: true}], post: [{is: exists, from: new}, {is: depend, from: new, to: to}, {is: refer, from: new, to: from}]}
  v_judge_case: {ja: 事例を判定する, extends: v_judge, to: case}
  v_adopt: {ja: 採用する, extends: occurrent, from: continuant, to: continuant, new_kind: role, pre: [{is: depend, from: new, to: to, neg: true}], post: [{is: depend, from: new, to: to}]}
  v_withdraw: {ja: 取り下げる, extends: occurrent, from: continuant, to: continuant, new_kind: role, pre: [{is: depend, from: new, to: to}], post: [{is: depend, from: new, to: to, neg: true}]}
  v_happen_after: {ja: 後に起こる, extends: occurrent, from: occurrent, to: occurrent, holds: [{is: after, from: from, to: to}]}
  v_use: {ja: 使う, extends: occurrent, from: any, to: continuant, holds: [{is: involve, from: new, to: to}, {is: depend, from: new, to: from}]}
  v_speak: {ja: 発話する, extends: occurrent, from: continuant, to: continuant, pre: [{is: exists, from: to, neg: true}], post: [{is: exists, from: to}, {is: depend, from: to, to: from}]}
  v_see: {ja: 見る, extends: occurrent, from: continuant, to: continuant, new_kind: quality,
          pre: [{is: exists, from: new, neg: true}], post: [{is: exists, from: new}, {is: depend, from: new, to: from}, {is: refer, from: new, to: to}]}
  v_expose: {ja: 公開する, extends: occurrent, from: continuant, to: continuant, new_kind: realizable_entity,
             pre: [{is: exists, from: new, neg: true}], post: [{is: exists, from: new}, {is: depend, from: new, to: to}]}
  v_deliver: {ja: 届ける, extends: occurrent, from: continuant, to: continuant, pre: [{is: part, from: to, to: new, neg: true}], post: [{is: part, from: to, to: new}]}
  v_substitute: {ja: 置き換える, extends: occurrent, from: continuant, to: continuant,
                 pre: [{is: part, from: to, to: new}, {is: part, from: from, to: new, neg: true}], post: [{is: part, from: to, to: new, neg: true}, {is: part, from: from, to: new}]}
  v_speak_definition: {ja: 定義文を発話する, extends: v_speak, to: definition_text}
  v_speak_reason: {ja: 理由を発話する, extends: v_speak, to: reason}
  v_judge_definition: {ja: 定義を判定する, extends: v_judge, to: definition}
  v_read: {ja: 読む, extends: v_see, to: information_entity}
  v_raise: {ja: を上げる, extends: occurrent, from: any, to: continuant, holds: [{is: after, from: to, to: new}, {is: depend, from: to, to: from}]}
  v_not_raise: {ja: を上げない, extends: occurrent, from: any, to: continuant, holds: [{is: after, from: to, to: new, neg: true}, {is: depend, from: to, to: from}]}
  v_lower: {ja: を下げる, extends: occurrent, from: any, to: continuant, holds: [{is: after, from: new, to: to}, {is: depend, from: to, to: from}]}
  v_not_lower: {ja: を下げない, extends: occurrent, from: any, to: continuant, holds: [{is: after, from: new, to: to, neg: true}, {is: depend, from: to, to: from}]}
  v_cause: {ja: の原因である, extends: occurrent, from: any, to: continuant, holds: [{is: after, from: to, to: from}, {is: depend, from: to, to: from}]}
  v_immune: {ja: の影響を受けない, extends: occurrent, from: any, to: any, holds: [{is: depend, from: from, to: to, neg: true}]}
  v_transfer: {ja: に転移する, extends: occurrent, from: any, to: any, holds: [{is: depend, from: to, to: from}]}
  v_not_transfer: {ja: に転移しない, extends: occurrent, from: any, to: any, holds: [{is: depend, from: to, to: from, neg: true}]}
  v_coexist: {ja: と同居できる, extends: occurrent, from: occurrent, to: occurrent, holds: [{is: depend, from: from, to: new}, {is: depend, from: to, to: new}]}
  v_consist: {ja: からなる, extends: occurrent, from: continuant, to: continuant, holds: [{is: part, from: to, to: from}]}
  v_rely: {ja: に頼る, extends: occurrent, from: any, to: any, holds: [{is: depend, from: from, to: to}]}
  v_near: {ja: ほぼ同じ位置にある, extends: occurrent, from: continuant, to: continuant, new_kind: tolerance, holds: [{is: after, from: from, to: to, neg: true}, {is: after, from: to, to: from, neg: true}]}

  # ----- 個体についての事実に使う動詞。終点か始点を、その関係で限定された種類に狭める
  v_scope: {ja: 適用範囲になる, extends: v_depend, from: scope, to: hypothesis}
  v_support: {ja: 支持する, extends: v_agree, from: evidence, to: hypothesis}
  v_contradict: {ja: 反する, extends: v_agree, from: against, to: hypothesis}
  v_qualify: {ja: 留保をつける, extends: v_refer, from: limitation, to: hypothesis}
  v_supersede: {ja: 取って代わる, extends: v_refer, from: sentence, to: supersedes}
  v_annotate: {ja: 注記する, extends: v_refer, from: note, to: sentence}
  v_ground: {ja: 根拠にする, extends: v_depend, from: decision, to: basis}
  v_check: {ja: 確かめる, extends: v_refer, from: backlog_item, to: tests}
  v_file_of: {ja: 結果ファイルとして部分になる, extends: v_compose, from: result_file, to: measurement_family}
  v_rows_of: {ja: 行の集まりとして部分になる, extends: v_compose, from: row_collection, to: measurement_family}
  v_filter_of: {ja: 行の限定として部分になる, extends: v_compose, from: row_filter, to: measurement_family}
  v_keys_of: {ja: 行の識別子による限定として部分になる, extends: v_compose, from: row_keys, to: measurement_family}
  v_entry_of: {ja: 条件ごとの記録として部分になる, extends: v_compose, from: condition_entry, to: measurement_family}
  v_axis_of: {ja: 軸として部分になる, extends: v_compose, from: axis, to: measurement_family}
  v_meaning_of: {ja: 意味づけとして部分になる, extends: v_compose, from: meaning, to: measurement_family}
  v_metric_of: {ja: 指標を述べる, extends: v_refer, from: measurement_family, to: metric}

  # ===== 修飾語。ある動詞の、ある位置を占めているという性質 =====
  varied: {ja: 動かす条件である, extends: role, of: [v_vary, to], mod: {of: [v_depend, from], with: experiment_protocol}}
  measuring: {ja: 測る量である, extends: role, of: [v_measure, from], mod: {of: [v_depend, from], with: experiment_protocol}}
  adopted: {ja: 採用されている, extends: quality, of: [v_adopt, to]}
  not_adopted: {ja: まだ採用されていない, extends: quality, of: [v_adopt, to], neg: true}
  withdrawn: {ja: 取り下げられている, extends: quality, of: [v_withdraw, to]}
  visible: {ja: 見える, extends: disposition, of: [v_see, to]}
  hidden: {ja: 見えない, extends: quality, of: [v_see, to], neg: true}

  # ===== 語・定義・再定義・文脈 =====
  disposition_learned: {ja: 学習で得られた傾向性, extends: disposition, mod: learned}
  prior_meaning: {ja: 元の意味, extends: disposition_learned, mod: {of: [v_depend, from], with: weights}}
  role_depend_from_redefinition: {ja: 再定義へ依存する役割, extends: role, mod: {of: [v_depend, from], with: redefinition}}
  assigned_meaning: {ja: 与えられた意味, extends: role_depend_from_redefinition, mod: {of: [v_depend, from], with: common_word}}
  common_word: {ja: 一般語, extends: word, mod: {of: [v_refer, to], with: prior_meaning}}
  definition_refer_from_common_word: {ja: 一般語へ述べる定義, extends: definition, mod: {of: [v_refer, from], with: common_word}}
  redefinition: {ja: 再定義, extends: definition_refer_from_common_word, mod: {of: [v_agree, from], with: prior_meaning, neg: true}}
  passage_express_from_natural_language_compute_to: {ja: 計算する先の自然言語へで書かれる文章, extends: passage_express_from_natural_language, mod: {of: [v_compute, to]}}
  rendered_text: {ja: 自然言語に変換した文, extends: passage_express_from_natural_language_compute_to, mod: {of: [v_agree, from], with: depended_information}}
  programming_language: {ja: プログラミング言語, extends: language, mod: {of: [v_design, to]}}
  new_word: {ja: 新しい語, extends: word, mod: {of: [v_refer, to], with: prior_meaning, neg: true}}
  replaced_word: {ja: 置き換えられた語, form: [v_substitute, to]}
  hidden_word: {ja: 見えなくなった元の語, extends: replaced_word, mod: hidden}
  visible_word: {ja: 見えている元の語, extends: replaced_word, mod: visible}
  modifier: {ja: 修飾, extends: word, mod: {of: [v_refer, from], with: dependent}}
  genus_concept: {ja: 上位概念, extends: word, mod: {of: [v_refer, from], with: dependent, neg: true}}
  seen_genus: {ja: 学習した上位概念, extends: genus_concept, mod: {of: [v_teach, from]}}
  unseen_genus: {ja: 学習していない上位概念, extends: genus_concept, mod: {of: [v_teach, from], neg: true}}
  code: {ja: コード, extends: passage, mod: {of: [v_express, from], with: programming_language}}
  information_entity_express_from_programming_language: {ja: プログラミング言語へで書かれる情報, extends: information_entity, mod: {of: [v_express, from], with: programming_language}}
  symbol: {ja: シンボル, extends: information_entity_express_from_programming_language, mod: {of: [v_compose, from], with: code}}
  rule_redefinition: {ja: 規則型の再定義, extends: redefinition, mod: {of: [v_refer, from], with: magnitude}}
  remap_redefinition: {ja: 付け替え型の再定義, extends: redefinition, mod: {of: [v_refer, from], with: magnitude, neg: true}}
  relevant_definitions: {ja: 関係する定義だけ, extends: definition, mod: {of: [v_agree, from], with: question}}
  other_definitions: {ja: 他の定義, extends: definition, mod: {of: [v_agree, from], with: question, neg: true}}
  ordinary_definitions: {ja: 一般の意味どおりの定義, extends: other_definitions, mod: {of: [v_agree, from], with: prior_meaning}}
  other_redefinitions: {ja: 他の再定義, extends: other_definitions, mod: {of: [v_agree, from], with: prior_meaning, neg: true}}
  preceding_definitions_set: {ja: 前に並ぶ定義, extends: other_definitions, mod: {of: [v_come_after, to], with: relevant_definitions}}
  following_definitions_set: {ja: 後ろに並ぶ定義, extends: other_definitions, mod: {of: [v_come_after, from], with: relevant_definitions}}
  reason: {ja: 理由, extends: sentence, mod: {of: [v_refer, from], with: verdict}}
  definition_text: {ja: 定義文, extends: passage, mod: {of: [v_compose, to], with: definition}}
  examples_only: {ja: 適用例だけ, extends: passage, mod: {of: [v_compose, to], with: application_example}}
  def_and_examples: {ja: 定義文と適用例, extends: definition_text, mod: {of: [is, from], with: examples_only}}
  filler_text: {ja: 無関係な文章, extends: passage, mod: {of: [v_agree, from], with: question, neg: true}}
  context: {ja: 文脈, extends: passage, mod: {of: [v_read, to], with: model}}
  glossary: {ja: 用語集, extends: information_entity, mod: {of: [v_compose, to], with: definition, at: {count: {gt: 1}}}}
  definition_compose_from_glossary: {ja: 用語集へ部分になる定義, extends: definition, mod: {of: [v_compose, from], with: glossary}}
  glossary_head: {ja: 用語集の先頭, extends: definition_compose_from_glossary, mod: {of: [v_come_after, from], with: definition, neg: true}}
  operator: {ja: 運用者, extends: independent_continuant, mod: {of: [v_design, from], with: experiment_protocol}}
  passage_compose_from_context: {ja: 文脈へ部分になる文章, extends: passage, mod: {of: [v_compose, from], with: context}}
  place_system: {ja: システムプロンプト, extends: passage_compose_from_context, mod: {of: [v_speak, to], with: operator}}
  place_adjacent: {ja: 設問の直前, extends: passage_compose_from_context, mod: {of: [v_come_after, to], with: question, at: {order: 1}}}
  preceding_text: {ja: 定義の前にある文章, extends: passage, mod: {of: [v_come_after, to], with: definition}}
  following_text: {ja: 定義の後ろにある文章, extends: passage, mod: {of: [v_come_after, from], with: definition}}
  information_entity_compose_to_new_word_n: {ja: 新しい語から部分になる（count2）情報, extends: information_entity, mod: {of: [v_compose, to], with: new_word, at: {count: 2}}}
  sibling_pair: {ja: 兄弟概念の組, extends: information_entity_compose_to_new_word_n, mod: {of: [v_compose, to], with: genus_concept, at: {count: 1}}}
  information_entity_refer_from_concept_n: {ja: '概念へ述べる（count{"gt": 1}）情報', extends: information_entity, mod: {of: [v_refer, from], with: concept, at: {count: {gt: 1}}}}
  information_entity_refer_from_concept_n_refer_from_v_depend: {ja: '依存するへ述べる概念へ述べる（count{"gt": 1}）情報', extends: information_entity_refer_from_concept_n, mod: {of: [v_refer, from], with: v_depend}}
  shared_inference: {ja: 使い方が共有する推論, extends: concept, mod: {of: [v_stage, from], with: usage, quant: all}}
  scratchpad: {ja: 途中経過の書き出し, extends: inference, mod: {of: [v_stage, to], with: v_speak_reason}}
  single_pass: {ja: 一度の処理, extends: inference, mod: {of: [v_stage, to], with: v_speak_reason, neg: true}}
  no_channel: {ja: 何もなし, extends: process, mod: {of: [v_stage, to], with: channel, neg: true}}
  note: {ja: 注記, extends: passage_express_from_natural_language, mod: {of: [v_refer, from], with: sentence}}
  expression_part_refer_from_identifier: {ja: 識別子へ述べる概念式の部分, extends: expression_part, mod: {of: [v_refer, from], with: identifier}}
  identifier_refer_to_meaning: {ja: 意味づけから述べられる識別子, extends: identifier, mod: {of: [v_refer, to], with: meaning}}

  # ===== 設問・事例・判定 =====
  information_entity_refer_from_verdict: {ja: 判定へ述べる情報, extends: information_entity, mod: {of: [v_refer, from], with: verdict}}
  case: {ja: 事例, extends: sentence, mod: {of: [v_judge, to]}}
  sentence_refer_from_case: {ja: 事例へ述べる文, extends: sentence, mod: {of: [v_refer, from], with: case}}
  question: {ja: 設問, extends: sentence_refer_from_case, mod: {of: [v_answer, to]}}
  verdict: {ja: 判定, extends: information_entity, mod: {of: [v_judge_case, new]}}
  information_entity_refer_from_verdict_refer_from_question: {ja: 設問へ述べる判定へ述べる情報, extends: information_entity_refer_from_verdict, mod: {of: [v_refer, from], with: question}}
  question_format: {ja: 設問形式, extends: information_entity_refer_from_verdict_refer_from_question, mod: {of: [v_refer, from], with: case, neg: true}}
  option: {ja: 選択肢, extends: information_entity_refer_from_verdict, mod: {of: [v_compose, from], with: question}}
  fmt_free: {ja: 自由生成, extends: question_format, mod: {of: [v_compose, to], with: option, neg: true}}
  verdict_by_definition: {ja: 定義による判定, extends: verdict, mod: {of: [v_agree, from], with: definition}}
  verdict_by_prior: {ja: 元の意味による判定, extends: verdict, mod: {of: [v_agree, from], with: prior_meaning}}
  conflict_case: {ja: 衝突する事例, extends: case, cmp: [{axis: truth, a: verdict_by_definition, b: verdict_by_prior, rel: differ}]}
  control_case: {ja: 衝突しない事例, extends: case, cmp: [{axis: truth, a: verdict_by_definition, b: verdict_by_prior, rel: same}]}
  information_entity_compose_to_case: {ja: 事例から部分になる情報, extends: information_entity, mod: {of: [v_compose, to], with: case}}
  application_example: {ja: 適用例, extends: information_entity_compose_to_case, mod: {of: [v_compose, to], with: verdict}}
  test: {ja: テスト, extends: application_example, mod: {of: [v_use, to], with: verification}}
  label_token_positions: {ja: 語のトークン位置, extends: information_entity_compose_to_word, mod: {of: [v_compose, from], with: context}}
  information_entity_compose_from_question: {ja: 設問へ部分になる情報, extends: information_entity, mod: {of: [v_compose, from], with: question}}
  position_after_word: {ja: 語の直後, extends: information_entity_compose_from_question, mod: {of: [v_come_after, from], with: word, at: {order: 1}}}
  question_format_compose_to_opt_yes: {ja: 選択肢「はい」から部分になる設問形式, extends: question_format, mod: {of: [v_compose, to], with: opt_yes}}
  fmt_yesno: {ja: はい・いいえの二択, extends: question_format_compose_to_opt_yes, mod: {of: [v_compose, to], with: opt_no}}
  question_format_compose_to_opt_applies: {ja: 選択肢「当たる」から部分になる設問形式, extends: question_format, mod: {of: [v_compose, to], with: opt_applies}}
  fmt_fill: {ja: 空欄補充の二択, extends: question_format_compose_to_opt_applies, mod: {of: [v_compose, to], with: opt_not_applies}}
  question_format_compose_to_opt_correct: {ja: 選択肢「正しい」から部分になる設問形式, extends: question_format, mod: {of: [v_compose, to], with: opt_correct}}
  fmt_truth: {ja: 正誤判定の二択, extends: question_format_compose_to_opt_correct, mod: {of: [v_compose, to], with: opt_wrong}}
  fmt_paraphrase_choice: {ja: 言い換えの二択, extends: question_format, mod: {of: [v_compose, to], with: definition, at: {count: 2}}}
  item_group: {ja: 設問群, extends: information_entity, mod: {of: [v_compose, to], with: question, at: {count: {gt: 1}}}}
  item_group_refer_from_common_word: {ja: 一般語へ述べる設問群, extends: item_group, mod: {of: [v_refer, from], with: common_word}}
  group_confusable: {ja: 一般の類義語・同音語の設問, extends: item_group_refer_from_common_word, mod: {of: [v_agree, from], with: prior_meaning}}
  group_redef_conflict: {ja: 再定義の衝突する設問, extends: item_group, mod: {of: [v_refer, from], with: conflict_case}}
  group_redef_control: {ja: 再定義の衝突しない設問, extends: item_group, mod: {of: [v_refer, from], with: control_case}}
  group_new_word: {ja: 新しい語の設問, extends: item_group, mod: {of: [v_refer, from], with: new_word}}
  group_sibling: {ja: 分化した兄弟概念の設問, extends: group_new_word, mod: {of: [v_refer, from], with: sibling_pair}}
  group_replaced: {ja: 置換された用語の設問, extends: group_new_word, mod: {of: [v_refer, from], with: replaced_word}}
  unrelated_items: {ja: 無関係な設問, extends: item_group, mod: {of: [v_refer, from], with: redefinition, neg: true}}
  verdict_pair: {ja: 選択肢の順序を入れ替えた2回の判定, extends: information_entity, mod: {of: [v_compose, to], with: verdict, at: {count: 2}}}

  # ===== 接続手段と教示。定義をモデルに届ける手段 =====
  teaching: {ja: 教示, extends: v_teach, to: layer}
  verification: {ja: 検証, extends: v_judge, to: application_example}
  symbol_selection: {ja: シンボルの選定, extends: v_judge, to: symbol}
  channel: {ja: 接続手段, extends: v_deliver, to: definition}
  text_injection: {ja: 文章での注入, extends: channel, mod: {of: [v_involve, from], with: context}}
  renaming: {ja: 改名, extends: text_injection, mod: {of: [v_stage, to], with: v_substitute}}
  opaque_renaming: {ja: 元の語が見えない改名, extends: renaming, mod: {of: [v_involve, from], with: hidden_word}}
  semi_renaming: {ja: 元の語が見える改名, extends: renaming, mod: {of: [v_involve, from], with: visible_word}}
  inline_expansion: {ja: 設問中での定義の展開, extends: text_injection, mod: {of: [v_involve, from], with: position_after_word}}
  channel_involve_from_taught_vector: {ja: 教示で得られたベクトルへに関わらせる接続手段, extends: channel, mod: {of: [v_involve, from], with: taught_vector}}
  concept_vector: {ja: 概念ベクトル, extends: channel_involve_from_taught_vector, mod: {of: [v_involve, from], with: label_token_positions}}
  single_layer_vector: {ja: 単一層の概念ベクトル, extends: concept_vector, mod: {of: [v_involve, from], with: layer, at: {count: 1}}}
  multi_layer_vector: {ja: 複数層の概念ベクトル, extends: concept_vector, mod: {of: [v_involve, from], with: layer, at: {count: {gt: 1}}}}
  text_and_vector: {ja: 文章と概念ベクトルの併用, extends: text_injection, mod: {of: [is, from], with: concept_vector}}
  delta_weights: {ja: 差分重み, extends: channel, mod: {of: [v_involve, from], with: weights}}
  teacher_recite: {ja: 定義文の暗唱を教師にする, extends: teaching, from: definition_text}
  teacher_examples: {ja: 適用例を教師にする, extends: teaching, from: examples_only}
  teacher_both: {ja: 定義文の暗唱と適用例の両方を教師にする, extends: teaching, from: def_and_examples}
  taught_vector: {ja: 教示で得られたベクトル, extends: realizable_entity, mod: {of: [teaching, new]}}
  teaching_material: {ja: 教示の材料, form: [teaching, from]}

  # ===== 使い方 =====
  usage: {ja: 使い方, extends: inference, mod: {of: [v_involve, from], with: word}}
  usage_recite: {ja: 定義文の暗唱, extends: usage, mod: {of: [v_stage, to], with: v_speak_definition}}
  usage_apply: {ja: 適用, extends: usage, mod: {of: [v_stage, to], with: v_judge_case}}
  usage_define_paraphrase: {ja: 定義の言い換えの選択, extends: usage, mod: {of: [v_stage, to], with: v_judge_definition}}
  usage_explain: {ja: 説明, extends: usage_apply, mod: {of: [v_stage, to], with: v_speak_reason}}
  taught_usage: {ja: 教えた使い方, extends: usage, mod: {of: [v_refer, to], with: teaching_material}}
  untaught_usage: {ja: 教えていない使い方, extends: usage, mod: {of: [v_refer, to], with: teaching_material, neg: true}}

  # ===== モデルと設計 =====
  layer: {ja: 層, extends: artifact_compute_from, mod: {of: [v_compose, from], with: model}}
  open_weight_model: {ja: 重みが公開されたモデル, extends: model, mod: {of: [v_expose, from], with: weights}}
  api_only_model: {ja: APIでしか使えないモデル, extends: model, mod: {of: [v_expose, from], with: weights, neg: true}}
  attention: {ja: 注意機構, extends: artifact_compute_from, mod: {of: [v_compose, from], with: layer}}
  term_server: {ja: 用語サーバー, extends: artifact, mod: {of: [v_judge_definition, from]}}
  model_design: {ja: モデルについての設計, extends: information_entity_design_to, mod: {of: [v_refer, from], with: model}}
  information_entity_design_to: {ja: 設計する先の情報, extends: information_entity, mod: {of: [v_design, to]}}
  typed_graph: {ja: 型付きグラフ, extends: information_entity_refer_from_concept_n_refer_from_v_depend, mod: {of: [v_involve, to], with: inference, quant: all}}

  # ===== 要因と指標 =====
  factor: {ja: 要因, extends: quality, mod: varied}
  context_length: {ja: 文脈の長さ, extends: factor, mod: {of: [v_depend, from], with: context}, axis: count}
  context_depth: {ja: 文脈の深さ, extends: factor, mod: {of: [v_depend, from], with: preceding_text}, axis: count}
  distance_to_question: {ja: 設問からの距離, extends: factor, mod: {of: [v_depend, from], with: following_text}, axis: count}
  preceding_definitions: {ja: 前に並ぶ定義の数, extends: factor, mod: {of: [v_depend, from], with: preceding_definitions_set}, axis: count}
  following_definitions: {ja: 後ろに並ぶ定義の数, extends: factor, mod: {of: [v_depend, from], with: following_definitions_set}, axis: count}
  prior_collision: {ja: 元の意味との衝突, extends: factor, mod: {of: [v_depend, from], with: redefinition}}
  format_variation: {ja: 設問形式の違い, extends: factor, mod: {of: [v_depend, from], with: question_format}}
  vector_count: {ja: 同時に入れる概念ベクトルの数, extends: factor, mod: {of: [v_measure, from], with: concept_vector}, axis: count}
  layer_choice: {ja: 単一層の選び方, extends: factor, mod: {of: [v_measure, from], with: single_layer_vector}, axis: order}
  chain_length: {ja: 連鎖の段数, extends: factor, mod: {of: [v_measure, from], with: v_stage}, axis: count}
  quality_measure_to: {ja: 測る先の質, extends: quality, mod: {of: [v_measure, to]}}
  redefinition_following: {ja: 再定義への追従, extends: quality_measure_to, mod: {of: [v_depend, from], with: conflict_case}}
  control_preservation: {ja: 衝突しない事例での判定の維持, extends: quality_measure_to, mod: {of: [v_depend, from], with: control_case}}
  redefinition_success: {ja: 再定義の成功, extends: quality_measure_to, mod: {of: [v_depend, from], with: redefinition}}
  cross_usage_consistency: {ja: 使い方をまたぐ一貫性, extends: quality_measure_to, mod: {of: [v_measure, from], with: usage, quant: all}}
  preceding_definition_effect: {ja: 前に並ぶ定義による追従の低下, extends: quality_measure_to, mod: {of: [v_depend, from], with: preceding_definitions_set}}

  # ===== 測定。結果ファイルから測定値を計算する。個体（測定の族）に書ける関係もここ =====
  accuracy: {ja: 正答率, extends: metric, mod: {of: [v_measure, from], with: verdict}, axis: ratio}
  order_robust_accuracy: {ja: 選択肢の順序に頑健な正答率, extends: metric, mod: {of: [v_measure, from], with: verdict_pair}, axis: ratio}
  training_loss: {ja: 学習の損失, extends: metric, mod: {of: [v_measure, from], with: teaching}}
  passage_compute_to: {ja: 計算する先の文章, extends: passage, mod: {of: [v_compute, to]}}
  result_file: {ja: 結果ファイル, extends: passage_compute_to, mod: {of: [v_refer, from], with: experiment}}
  information_entity_compose_from_result_file: {ja: 結果ファイルへ部分になる情報, extends: information_entity, mod: {of: [v_compose, from], with: result_file}}
  result_row: {ja: 結果の行, extends: information_entity_compose_from_result_file, mod: {of: [v_refer, from], with: question}}
  row_collection: {ja: 行の集まり, extends: information_entity_compose_from_result_file, mod: {of: [v_compose, to], with: result_row, at: {count: {gt: 1}}}}
  row_keys: {ja: 行の識別子による限定, extends: row_filter, mod: {of: [v_refer, from], with: identifier}}
  logit_margin: {ja: ロジット差の平均, extends: metric, mod: {of: [v_measure, from], with: verdict}, axis: order}
  judged_accuracy: {ja: 自由生成での正答率, extends: accuracy, mod: {of: [v_depend, from], with: fmt_free}, axis: ratio}
  measurement_family: {ja: 測定値の族, extends: information_entity, mod: {of: [v_refer, from], with: measured_value, at: {count: {gt: 1}}}}
  recital_nll: {ja: 定義文の出しにくさ, extends: metric, mod: {of: [v_measure, from], with: v_speak_definition}}
  axis_refer_to_row_keys: {ja: 行の識別子による限定から述べられる軸, extends: axis, mod: {of: [v_refer, to], with: row_keys}}
  pattern_compose_from_row_keys: {ja: 行の識別子による限定へ部分になる雛形, extends: pattern, mod: {of: [v_compose, from], with: row_keys}}
  value_compose_from_meaning: {ja: 意味づけへ部分になる値, extends: value, mod: {of: [v_compose, from], with: meaning}}
  measured_value: {ja: 測定値, extends: magnitude, mod: {of: [v_depend, from], with: result_file}}
  mean_value: {ja: 平均, extends: magnitude, mod: {of: [v_depend, from], with: measured_value, at: {count: {gt: 1}}}}
  tolerance: {ja: 許容幅, extends: magnitude, mod: {of: [v_depend, from], with: observation}}
  metric: {ja: 指標, extends: quality, mod: measuring}
  row_filter: {ja: 行の限定, extends: sentence, mod: {of: [v_refer, from], with: result_row}}
  condition_entry: {ja: 条件ごとの記録, extends: information_entity_refer_from_verdict, mod: {of: [v_compose, from], with: result_row}}
  meaning: {ja: 測定値の意味づけ, extends: sentence_refer_from_measured_value, mod: {of: [v_refer, from], with: identifier}}

  # ===== 観察・仮説・決定・残り項目 =====
  depended_information: {ja: 他の記述が依存する記述, extends: information_entity, mod: {of: [v_depend, to], with: information_entity, quant: all}}
  rule_source_of_truth: {ja: 正本の取り決め, extends: decision, mod: {of: [v_refer, from], with: depended_information}}
  change_holder: {ja: 与えられた意味が依存するもの, extends: continuant, mod: {of: [v_depend, to], with: assigned_meaning}}
  rule_consolidation: {ja: 変更の固定先の取り決め, extends: decision, mod: {of: [v_refer, from], with: change_holder}}
  sentence_refer_from_measured_value: {ja: 測定値へ述べる文, extends: sentence, mod: {of: [v_refer, from], with: measured_value}}
  observation: {ja: 観察, extends: sentence_refer_from_measured_value, val: {truth: true}}
  observation_agree_from_hypothesis: {ja: 仮説へ一致する観察, extends: observation, mod: {of: [v_agree, from], with: hypothesis}}
  evidence: {ja: 支持する観察, extends: observation_agree_from_hypothesis, cmp: [{axis: truth, a: observation, b: hypothesis, rel: same}]}
  against: {ja: 反する観察, extends: observation_agree_from_hypothesis, cmp: [{axis: truth, a: observation, b: hypothesis, rel: differ}]}
  hypothesis_agree_to_evidence: {ja: 支持する観察から一致する仮説, extends: hypothesis, mod: {of: [v_agree, to], with: evidence}}
  hyp_supported: {ja: 支持された仮説, extends: hypothesis_agree_to_evidence, mod: {of: [v_agree, to], with: against, neg: true}}
  hypothesis_agree_to_evidence_not: {ja: 支持する観察から一致することのない仮説, extends: hypothesis, mod: {of: [v_agree, to], with: evidence, neg: true}}
  hyp_refuted: {ja: 反証された仮説, extends: hypothesis_agree_to_evidence_not, mod: {of: [v_agree, to], with: against}}
  hyp_mixed: {ja: 支持と反証の両方がある仮説, extends: hypothesis_agree_to_evidence, mod: {of: [v_agree, to], with: against}}
  hyp_untested: {ja: 未検証の仮説, extends: hypothesis_agree_to_evidence_not, mod: {of: [v_agree, to], with: against, neg: true}}
  supersedes: {ja: 置き換えられた文, extends: withdrawn_sentence, mod: {of: [v_refer, to], with: sentence}}
  limitation: {ja: 留保, extends: sentence_refer_from_hypothesis, mod: {of: [v_refer, from], with: observation}}
  lim_post_hoc: {ja: 結果を見たあとで分類した, extends: limitation, mod: {of: [v_come_after, from], with: observation}}
  lim_range: {ja: 測った範囲が限られる, extends: limitation, mod: {of: [v_refer, from], with: factor}}
  lim_one_item: {ja: 差が1問以内, extends: limitation, mod: {of: [v_refer, from], with: question, at: {count: 1}}}
  lim_unconverged: {ja: 学習が収束していない, extends: limitation, mod: {of: [v_refer, from], with: training_loss}}
  lim_single_case: {ja: 1例だけ, extends: limitation, mod: {of: [v_refer, from], with: observation, at: {count: 1}}}
  lim_unquantified: {ja: 数値化していない, extends: limitation, mod: {of: [v_refer, from], with: measured_value, neg: true}}
  decision: {ja: 決定, extends: definition, mod: {of: [v_compose, from], with: information_entity_design_to}}
  dec_adopted: {ja: 採用済みの決定, extends: decision, mod: adopted}
  dec_tentative: {ja: 暫定の決定, extends: decision, mod: not_adopted}
  dec_withdrawn: {ja: 取り下げた決定, extends: decision, mod: withdrawn}
  basis: {ja: 根拠となる仮説, extends: hypothesis, mod: {of: [v_depend, to], with: decision}}
  performed_experiment: {ja: 行われた実験, extends: experiment, mod: {of: [v_perform, to]}}
  measured_experiment: {ja: 結果ファイルが述べる実験, extends: experiment, mod: {of: [v_refer, to], with: result_file}}
  backlog_item: {ja: 残り項目, extends: sentence, mod: {of: [v_refer, from], with: experiment}}
  tests: {ja: 確かめる仮説, extends: hypothesis, mod: {of: [v_refer, to], with: backlog_item}}
  item_done: {ja: 済んだ項目, extends: backlog_item, mod: {of: [v_refer, from], with: measured_experiment}}
  backlog_item_refer_from_performed_experiment: {ja: 行われた実験へ述べる残り項目, extends: backlog_item, mod: {of: [v_refer, from], with: performed_experiment}}
  item_running: {ja: 実行中の項目, extends: backlog_item_refer_from_performed_experiment, mod: {of: [v_refer, from], with: measured_experiment, neg: true}}
  item_queued: {ja: 未着手の項目, extends: backlog_item, mod: {of: [v_refer, from], with: performed_experiment, neg: true}}
  withdrawn_sentence: {ja: 取り下げられた文, extends: sentence, mod: withdrawn}
  design_decision: {ja: 本設計の決定, extends: decision, mod: {of: [v_compose, from], with: this_design}}
  design_dec_adopted: {ja: 本設計の採用済みの決定, extends: dec_adopted, mod: {of: [is, from], with: design_decision}}
  design_dec_tentative: {ja: 本設計の暫定の決定, extends: dec_tentative, mod: {of: [is, from], with: design_decision}}
  design_dec_withdrawn: {ja: 本設計の取り下げた決定, extends: dec_withdrawn, mod: {of: [is, from], with: design_decision}}
  sentence_refer_from_hypothesis: {ja: 仮説へ述べる文, extends: sentence, mod: {of: [v_refer, from], with: hypothesis}}
  role_depend_from_rule_source_of_truth: {ja: 正本の取り決めへ依存する役割, extends: role, mod: {of: [v_depend, from], with: rule_source_of_truth}}
  source_of_truth: {ja: 正本, extends: role_depend_from_rule_source_of_truth, mod: {of: [v_depend, from], with: information_entity}}
  consolidation_target: {ja: 変更の固定先, extends: role, mod: {of: [v_depend, from], with: rule_consolidation}}

