  shifted_hidden_state: {display: ずれを足した隠れ状態, extends: information_entity, mod: {of: [v_compose, to], with: hidden_state}}
  shift_unseen_by_layer: {display: 層から分けて見えない隠れ状態のずれ, extends: state_shift, mod: {of: [v_see, to], with: layer, neg: true}}
  term_server: {display: 用語サーバー, extends: artifact, mod: {of: [v_judge_definition, from]}}
  model_design: {display: モデルについての設計, extends: information_entity_design_to, mod: {of: [v_refer, from], with: model}}
  information_entity_design_to: {display: 設計する先の情報, extends: information_entity, mod: {of: [v_design, to]}}
  typed_graph: {display: 型付きグラフ, extends: information_entity_refer_from_concept_n_refer_from_v_depend, mod: {of: [v_involve, to], with: inference, quant: all}}

  # ===== 要因と指標 =====
  factor: {display: 要因, extends: quality, mod: varied}
  context_length: {display: 文脈の長さ, extends: factor, mod: {of: [v_depend, from], with: context}, axis: count}
  context_depth: {display: 文脈の深さ, extends: factor, mod: {of: [v_depend, from], with: preceding_text}, axis: count}
  distance_to_question: {display: 設問からの距離, extends: factor, mod: {of: [v_depend, from], with: following_text}, axis: count}
  preceding_definitions: {display: 前に並ぶ定義の数, extends: factor, mod: {of: [v_depend, from], with: preceding_definitions_set}, axis: count}
  following_definitions: {display: 後ろに並ぶ定義の数, extends: factor, mod: {of: [v_depend, from], with: following_definitions_set}, axis: count}
  prior_collision: {display: 元の意味との衝突, extends: factor, mod: {of: [v_depend, from], with: redefinition}}
  format_variation: {display: 設問形式の違い, extends: factor, mod: {of: [v_depend, from], with: question_format}}
  vector_count: {display: 同時に入れる概念ベクトルの数, extends: factor, mod: {of: [v_measure, from], with: concept_vector}, axis: count}
  layer_choice: {display: 単一層の選び方, extends: factor, mod: {of: [v_measure, from], with: single_layer_vector}, axis: order}
  chain_length: {display: 連鎖の段数, extends: factor, mod: {of: [v_measure, from], with: v_stage}, axis: count}
  quality_measure_to: {display: 測る先の質, extends: quality, mod: {of: [v_measure, to]}}
  redefinition_following: {display: 再定義への追従, extends: quality_measure_to, mod: {of: [v_depend, from], with: conflict_case}}
  control_preservation: {display: 衝突しない事例での判定の維持, extends: quality_measure_to, mod: {of: [v_depend, from], with: control_case}}
  verdict_stability: {display: 選択肢の順序に対する判定の安定, extends: quality_measure_to, mod: {of: [v_depend, from], with: verdict_pair}}
  redefinition_success: {display: 再定義の成功, extends: quality_measure_to, mod: {of: [v_depend, from], with: redefinition}}
  cross_usage_consistency: {display: 使い方をまたぐ一貫性, extends: quality_measure_to, mod: {of: [v_measure, from], with: usage, quant: all}}
  preceding_definition_effect: {display: 前に並ぶ定義による追従の低下, extends: quality_measure_to, mod: {of: [v_depend, from], with: preceding_definitions_set}}

  # ===== 測定。結果ファイルから測定値を計算する。個体（測定の族）に書ける関係もここ =====
  accuracy: {display: 正答率, extends: metric, mod: {of: [v_measure, from], with: verdict}, axis: ratio}
  order_robust_accuracy: {display: 選択肢の順序に頑健な正答率, extends: metric, mod: {of: [v_measure, from], with: verdict_pair}, axis: ratio}
  training_loss: {display: 学習の損失, extends: metric, mod: {of: [v_measure, from], with: teaching}}
  passage_compute_to: {display: 計算する先の文章, extends: passage, mod: {of: [v_compute, to]}}
  result_file: {display: 結果ファイル, extends: passage_compute_to, mod: {of: [v_refer, from], with: experiment}}
  information_entity_compose_from_result_file: {display: 結果ファイルの部分である情報, extends: information_entity, mod: {of: [v_compose, from], with: result_file}}
  result_row: {display: 結果の行, extends: information_entity_compose_from_result_file, mod: {of: [v_refer, from], with: question}}
  row_collection: {display: 行の集まり, extends: information_entity_compose_from_result_file, mod: {of: [v_compose, to], with: result_row, at: {count: {gt: 1}}}}
  logit_margin: {display: ロジット差の平均, extends: metric, mod: {of: [v_measure, from], with: verdict}, axis: order}
  judged_accuracy: {display: 自由生成での正答率, extends: accuracy, mod: {of: [v_depend, from], with: fmt_free}, axis: ratio}
  family_axis: {display: 測定の族の軸, extends: axis, mod: {of: [v_compose, from], with: measurement_family}}
  axis_value: {display: 軸の値, extends: value, mod: {of: [v_compose, from], with: family_axis}}
  measurement_family: {display: 測定値の族, extends: information_entity, mod: {of: [v_refer, from], with: measured_value, at: {count: {gt: 1}}}}
  recital_nll: {display: 定義文の出しにくさ, extends: metric, mod: {of: [v_measure, from], with: v_speak_definition}}
  measured_value: {display: 測定値, extends: magnitude, mod: {of: [v_depend, from], with: result_file}}
  mean_value: {display: 平均, extends: magnitude, mod: {of: [v_depend, from], with: measured_value, at: {count: {gt: 1}}}}
  tolerance: {display: 許容幅, extends: magnitude, mod: {of: [v_depend, from], with: observation}}
  metric: {display: 指標, extends: quality, mod: measuring}
  row_filter: {display: 行の限定, extends: sentence, mod: {of: [v_refer, from], with: result_row}}
  condition_entry: {display: 条件ごとの記録, extends: information_entity_refer_from_verdict, mod: {of: [v_compose, from], with: result_row}}

  # ===== 観察・仮説・決定・残り項目 =====
  depended_information: {display: 他の記述が依存する記述, extends: information_entity, mod: {of: [v_depend, to], with: information_entity, quant: all}}
  rule_source_of_truth: {display: 正本の取り決め, extends: decision, mod: {of: [v_refer, from], with: depended_information}}
  change_holder: {display: 与えられた意味が依存するもの, extends: continuant, mod: {of: [v_depend, to], with: assigned_meaning}}
  rule_consolidation: {display: 変更の固定先の取り決め, extends: decision, mod: {of: [v_refer, from], with: change_holder}}
  sentence_refer_from_measured_value: {display: 測定値へ述べる文, extends: sentence, mod: {of: [v_refer, from], with: measured_value}}
  observation: {display: 観察, extends: sentence_refer_from_measured_value, val: {truth: true}}
  observation_agree_from_hypothesis: {display: 仮説へ一致する観察, extends: observation, mod: {of: [v_agree, from], with: hypothesis}}
  evidence: {display: 支持する観察, extends: observation_agree_from_hypothesis, cmp: [{axis: truth, a: observation, b: hypothesis, rel: same}]}
  against: {display: 反する観察, extends: observation_agree_from_hypothesis, cmp: [{axis: truth, a: observation, b: hypothesis, rel: differ}]}
  hypothesis_agree_to_evidence: {display: 支持する観察から一致する仮説, extends: hypothesis, mod: {of: [v_agree, to], with: evidence}}
  hyp_supported: {display: 支持された仮説, extends: hypothesis_agree_to_evidence, mod: {of: [v_agree, to], with: against, neg: true}}
  hypothesis_agree_to_evidence_not: {display: 支持する観察から一致することのない仮説, extends: hypothesis, mod: {of: [v_agree, to], with: evidence, neg: true}}
  hyp_refuted: {display: 反証された仮説, extends: hypothesis_agree_to_evidence_not, mod: {of: [v_agree, to], with: against}}
  hyp_mixed: {display: 支持と反証の両方がある仮説, extends: hypothesis_agree_to_evidence, mod: {of: [v_agree, to], with: against}}
  hyp_untested: {display: 未検証の仮説, extends: hypothesis_agree_to_evidence_not, mod: {of: [v_agree, to], with: against, neg: true}}
  supersedes: {display: 置き換えられた文, extends: withdrawn_sentence, mod: {of: [v_refer, to], with: sentence}}
  limitation: {display: 留保, extends: sentence_refer_from_hypothesis, mod: {of: [v_refer, from], with: observation}}
  lim_post_hoc: {display: 結果を見たあとで分類した, extends: limitation, mod: {of: [v_come_after, from], with: observation}}
  lim_range: {display: 測った範囲が限られる, extends: limitation, mod: {of: [v_refer, from], with: factor}}
  lim_one_item: {display: 差が1問以内, extends: limitation, mod: {of: [v_refer, from], with: question, at: {count: 1}}}
  lim_unconverged: {display: 学習が収束していない, extends: limitation, mod: {of: [v_refer, from], with: training_loss}}
  lim_single_case: {display: 1例だけ, extends: limitation, mod: {of: [v_refer, from], with: observation, at: {count: 1}}}
  doubt: {display: 仮説への疑い, extends: sentence, mod: {of: [v_challenge, from], with: hypothesis}}
  number_comparison: {display: 数の大小の照合, extends: inference, mod: {of: [v_refer, to], with: number}}
  lim_unquantified: {display: 数値化していない, extends: limitation, mod: {of: [v_refer, from], with: measured_value, neg: true}}
  decision: {display: 決定, extends: definition, mod: {of: [v_compose, from], with: information_entity_design_to}}
  dec_adopted: {display: 採用済みの決定, extends: decision, mod: adopted}
  dec_tentative: {display: 暫定の決定, extends: decision, mod: not_adopted}
  dec_withdrawn: {display: 取り下げた決定, extends: withdrawn_sentence, mod: {of: [is, from], with: decision}}
  basis: {display: 根拠となる仮説, extends: hypothesis, mod: {of: [v_depend, to], with: decision}}
  performed_experiment: {display: 行われた実験, extends: experiment, mod: {of: [v_perform, to]}}
  measured_experiment: {display: 結果ファイルが述べる実験, extends: experiment, mod: {of: [v_refer, to], with: result_file}}
  backlog_item: {display: 残り項目, extends: sentence, mod: {of: [v_refer, from], with: experiment}}
  tests: {display: 確かめる仮説, extends: hypothesis, mod: {of: [v_refer, to], with: backlog_item}}
  item_done: {display: 済んだ項目, extends: backlog_item, mod: {of: [v_refer, from], with: measured_experiment}}
