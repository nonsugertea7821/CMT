# 領域 exp（実験）。体系（ontology.yaml）の一部で、同じ検査にかかる。
# nodes:       この領域の種類。書き方は ontology.yaml と同じ。領域の中の識別子は、領域を書かずに書く。
#              ほかの領域からは exp.名前 と書いて参照する。core と run は参照できるが、逆はできない（法則 layered）。
# individuals: 個体。is で種類に1つだけ属する（ほかに表示語 display と、軸の値 val を持てる）。
#              仮説・決定・残り項目は、状態を表す下位の種類に属する（例 is: hyp_supported）。
# facts:       事実。1つの事実は、1つの動詞の個体で、位置に名前を付けて書く: {is: 動詞, from: 始点, to: 終点, new: 第三のもの}。
#              文（観察・仮説・決定）が述べる中身は、同じ形を v_refer の終点に置く。中身は主張されない（事実ではない）。
#              個数は at で書く: {is: v_compose, from: layer, to: model_15b, at: {count: 28}}（層が28個、部分になる）。
# 種類と個体の分け方: それ自体が個体を持つものが種類。1つしかないもの（特定のモデル、個々の観察）が個体。
domain: exp
nodes:
  # ===== 動詞 =====
  v_answer: {display: 答える, extends: occurrent, from: continuant, to: continuant, holds: [{is: refer, from: from, to: to}, {is: after, from: from, to: to}]}
  v_judge: {display: 判定する, extends: occurrent, from: continuant, to: continuant, new_kind: information_entity,
            pre: [{is: exists, from: new, neg: true}], post: [{is: exists, from: new}, {is: depend, from: new, to: from}, {is: refer, from: new, to: to}]}
  v_teach: {display: 教える, extends: occurrent, from: continuant, to: continuant, new_kind: realizable_entity,
            pre: [{is: exists, from: new, neg: true}], post: [{is: exists, from: new}, {is: depend, from: new, to: to}, {is: refer, from: new, to: from}]}
  v_judge_case: {display: 事例を判定する, extends: v_judge, to: case}
  v_adopt: {display: 採用する, extends: occurrent, from: continuant, to: continuant, new_kind: role, pre: [{is: depend, from: new, to: to, neg: true}], post: [{is: depend, from: new, to: to}]}
  v_withdraw: {display: 取り下げる, extends: occurrent, from: continuant, to: continuant, new_kind: role, pre: [{is: depend, from: new, to: to}], post: [{is: depend, from: new, to: to, neg: true}]}
  v_happen_after: {display: 後に起こる, extends: occurrent, from: occurrent, to: occurrent, holds: [{is: after, from: from, to: to}]}
  v_use: {display: 使う, extends: occurrent, from: any, to: continuant, holds: [{is: involve, from: new, to: to}, {is: depend, from: new, to: from}]}
  v_speak: {display: 発話する, extends: occurrent, from: continuant, to: continuant, pre: [{is: exists, from: to, neg: true}], post: [{is: exists, from: to}, {is: depend, from: to, to: from}]}
  v_see: {display: 見る, extends: occurrent, from: continuant, to: continuant, new_kind: quality,
          pre: [{is: exists, from: new, neg: true}], post: [{is: exists, from: new}, {is: depend, from: new, to: from}, {is: refer, from: new, to: to}]}
  v_expose: {display: 公開する, extends: occurrent, from: continuant, to: continuant, new_kind: realizable_entity,
             pre: [{is: exists, from: new, neg: true}], post: [{is: exists, from: new}, {is: depend, from: new, to: to}]}
  v_deliver: {display: 届ける, extends: occurrent, from: continuant, to: continuant, pre: [{is: part, from: to, to: new, neg: true}], post: [{is: part, from: to, to: new}]}
  v_substitute: {display: 置き換える, extends: occurrent, from: continuant, to: continuant,
                 pre: [{is: part, from: to, to: new}, {is: part, from: from, to: new, neg: true}], post: [{is: part, from: to, to: new, neg: true}, {is: part, from: from, to: new}]}
  v_speak_definition: {display: 定義文を発話する, extends: v_speak, to: definition_text}
  v_speak_reason: {display: 理由を発話する, extends: v_speak, to: reason}
  v_judge_definition: {display: 定義を判定する, extends: v_judge, to: definition}
  v_read: {display: 読む, extends: v_see, to: information_entity}
  v_raise: {display: を上げる, extends: occurrent, from: any, to: continuant, holds: [{is: after, from: to, to: new}, {is: depend, from: to, to: from}]}
  v_not_raise: {display: を上げない, extends: occurrent, from: any, to: continuant, holds: [{is: after, from: to, to: new, neg: true}, {is: depend, from: to, to: from}]}
  v_lower: {display: を下げる, extends: occurrent, from: any, to: continuant, holds: [{is: after, from: new, to: to}, {is: depend, from: to, to: from}]}
  v_not_lower: {display: を下げない, extends: occurrent, from: any, to: continuant, holds: [{is: after, from: new, to: to, neg: true}, {is: depend, from: to, to: from}]}
  v_cause: {display: の原因である, extends: occurrent, from: any, to: continuant, holds: [{is: after, from: to, to: from}, {is: depend, from: to, to: from}]}
  v_immune: {display: の影響を受けない, extends: occurrent, from: any, to: any, holds: [{is: depend, from: from, to: to, neg: true}]}
  v_transfer: {display: に転移する, extends: occurrent, from: any, to: any, holds: [{is: depend, from: to, to: from}]}
  v_not_transfer: {display: に転移しない, extends: occurrent, from: any, to: any, holds: [{is: depend, from: to, to: from, neg: true}]}
  v_coexist: {display: と同居できる, extends: occurrent, from: occurrent, to: occurrent, holds: [{is: depend, from: from, to: new}, {is: depend, from: to, to: new}]}
  v_consist: {display: からなる, extends: occurrent, from: continuant, to: continuant, holds: [{is: part, from: to, to: from}]}
  v_rely: {display: に頼る, extends: occurrent, from: any, to: any, holds: [{is: depend, from: from, to: to}]}
  v_near: {display: ほぼ同じ位置にある, extends: occurrent, from: continuant, to: continuant, new_kind: tolerance, holds: [{is: after, from: from, to: to, neg: true}, {is: after, from: to, to: from, neg: true}]}

  # ----- 個体についての事実に使う動詞。終点か始点を、その関係で限定された種類に狭める
  v_scope: {display: 適用範囲になる, extends: v_depend, from: scope, to: hypothesis}
  v_support: {display: 支持する, extends: v_agree, from: evidence, to: hypothesis}
  v_contradict: {display: 反する, extends: v_agree, from: against, to: hypothesis}
  v_qualify: {display: 留保をつける, extends: v_refer, from: limitation, to: hypothesis}
  v_challenge: {display: 疑いを向ける, extends: v_refer, from: doubt, to: hypothesis}
  v_supersede: {display: 取って代わる, extends: v_refer, from: sentence, to: supersedes}
  v_ground: {display: 根拠にする, extends: v_depend, from: decision, to: basis}
  v_check: {display: 確かめる, extends: v_refer, from: backlog_item, to: tests}
  v_file_of: {display: 結果ファイルとして部分になる, extends: v_compose, from: result_file, to: measurement_family}
  v_rows_of: {display: 行の集まりとして部分になる, extends: v_compose, from: row_collection, to: measurement_family}
  v_filter_of: {display: 行の限定として部分になる, extends: v_compose, from: row_filter, to: measurement_family}
  v_keys_of: {display: 行の識別子の雛形として軸の部分になる, extends: v_compose, from: pattern, to: family_axis}
  v_entry_of: {display: 条件ごとの記録として部分になる, extends: v_compose, from: condition_entry, to: measurement_family}
  v_axis_of: {display: 軸として部分になる, extends: v_compose, from: family_axis, to: measurement_family}
  v_value_of: {display: 値として軸の部分になる, extends: v_compose, from: axis_value, to: family_axis}
  v_denote: {display: 軸の値が指す, extends: v_refer, from: axis_value, to: any}
  v_spell: {display: 結果ファイルでの書き方として指す, extends: v_denote, from: axis_value, to: passage}
  v_metric_of: {display: 指標を述べる, extends: v_refer, from: measurement_family, to: metric}

  # ===== 修飾語。ある動詞の、ある位置を占めているという性質 =====
  varied: {display: 動かす条件である, extends: role, of: [v_vary, to], mod: {of: [v_depend, from], with: experiment_protocol}}
  measuring: {display: 測る量である, extends: role, of: [v_measure, from], mod: {of: [v_depend, from], with: experiment_protocol}}
  adopted: {display: 採用されている, extends: quality, of: [v_adopt, to]}
  not_adopted: {display: まだ採用されていない, extends: quality, of: [v_adopt, to], neg: true}
  withdrawn: {display: 取り下げられている, extends: quality, of: [v_withdraw, to]}
  visible: {display: 見える, extends: disposition, of: [v_see, to]}
  hidden: {display: 見えない, extends: quality, of: [v_see, to], neg: true}

  # ===== 語・定義・再定義・文脈 =====
  disposition_learned: {display: 学習で得られた傾向性, extends: disposition, mod: learned}
  prior_meaning: {display: 元の意味, extends: disposition_learned, mod: {of: [v_depend, from], with: weights}}
  role_depend_from_redefinition: {display: 再定義へ依存する役割, extends: role, mod: {of: [v_depend, from], with: redefinition}}
  assigned_meaning: {display: 与えられた意味, extends: role_depend_from_redefinition, mod: {of: [v_depend, from], with: common_word}}
  common_word: {display: 一般語, extends: word, mod: {of: [v_refer, to], with: prior_meaning}}
  definition_refer_from_common_word: {display: 一般語へ述べる定義, extends: definition, mod: {of: [v_refer, from], with: common_word}}
  redefinition: {display: 再定義, extends: definition_refer_from_common_word, mod: {of: [v_agree, from], with: prior_meaning, neg: true}}
  passage_express_from_natural_language_compute_to: {display: 計算する先の自然言語へで書かれる文章, extends: passage_express_from_natural_language, mod: {of: [v_compute, to]}}
  rendered_text: {display: 自然言語に変換した文, extends: passage_express_from_natural_language_compute_to, mod: {of: [v_agree, from], with: depended_information}}
  programming_language: {display: プログラミング言語, extends: language, mod: {of: [v_design, to]}}
  new_word: {display: 新しい語, extends: word, mod: {of: [v_refer, to], with: prior_meaning, neg: true}}
  replaced_word: {display: 置き換えられた語, form: [v_substitute, to]}
  hidden_word: {display: 見えなくなった元の語, extends: replaced_word, mod: hidden}
  visible_word: {display: 見えている元の語, extends: replaced_word, mod: visible}
  modifier: {display: 修飾, extends: word, mod: {of: [v_refer, from], with: dependent}}
  genus_concept: {display: 上位概念, extends: word, mod: {of: [v_refer, from], with: dependent, neg: true}}
  seen_genus: {display: 学習した上位概念, extends: genus_concept, mod: {of: [v_teach, from]}}
  unseen_genus: {display: 学習していない上位概念, extends: genus_concept, mod: {of: [v_teach, from], neg: true}}
  code: {display: コード, extends: passage, mod: {of: [v_express, from], with: programming_language}}
  information_entity_express_from_programming_language: {display: プログラミング言語へで書かれる情報, extends: information_entity, mod: {of: [v_express, from], with: programming_language}}
  symbol: {display: シンボル, extends: information_entity_express_from_programming_language, mod: {of: [v_compose, from], with: code}}
  rule_redefinition: {display: 規則型の再定義, extends: redefinition, mod: {of: [v_refer, from], with: magnitude}}
  remap_redefinition: {display: 付け替え型の再定義, extends: redefinition, mod: {of: [v_refer, from], with: magnitude, neg: true}}
  relevant_definitions: {display: 関係する定義だけ, extends: definition, mod: {of: [v_agree, from], with: question}}
  other_definitions: {display: 他の定義, extends: definition, mod: {of: [v_agree, from], with: question, neg: true}}
  ordinary_definitions: {display: 一般の意味どおりの定義, extends: other_definitions, mod: {of: [v_agree, from], with: prior_meaning}}
  other_redefinitions: {display: 他の再定義, extends: other_definitions, mod: {of: [v_agree, from], with: prior_meaning, neg: true}}
  preceding_definitions_set: {display: 前に並ぶ定義, extends: other_definitions, mod: {of: [v_come_after, to], with: relevant_definitions}}
  following_definitions_set: {display: 後ろに並ぶ定義, extends: other_definitions, mod: {of: [v_come_after, from], with: relevant_definitions}}
  reason: {display: 理由, extends: sentence, mod: {of: [v_refer, from], with: verdict}}
  definition_text: {display: 定義文, extends: passage, mod: {of: [v_compose, to], with: definition}}
  examples_only: {display: 適用例だけ, extends: passage, mod: {of: [v_compose, to], with: application_example}}
  def_and_examples: {display: 定義文と適用例, extends: definition_text, mod: {of: [is, from], with: examples_only}}
  filler_text: {display: 無関係な文章, extends: passage, mod: {of: [v_agree, from], with: question, neg: true}}
  context: {display: 文脈, extends: passage, mod: {of: [v_read, to], with: model}}
  glossary: {display: 用語集, extends: information_entity, mod: {of: [v_compose, to], with: definition, at: {count: {gt: 1}}}}
  definition_compose_from_glossary: {display: 用語集の部分である定義, extends: definition, mod: {of: [v_compose, from], with: glossary}}
  glossary_head: {display: 用語集の先頭, extends: definition_compose_from_glossary, mod: {of: [v_come_after, from], with: definition, neg: true}}
  operator: {display: 運用者, extends: independent_continuant, mod: {of: [v_design, from], with: experiment_protocol}}
  passage_compose_from_context: {display: 文脈の部分である文章, extends: passage, mod: {of: [v_compose, from], with: context}}
  place_system: {display: システムプロンプト, extends: passage_compose_from_context, mod: {of: [v_speak, to], with: operator}}
  place_adjacent: {display: 設問の直前, extends: passage_compose_from_context, mod: {of: [v_come_after, to], with: question, at: {order: 1}}}
  preceding_text: {display: 定義の前にある文章, extends: passage, mod: {of: [v_come_after, to], with: definition}}
  following_text: {display: 定義の後ろにある文章, extends: passage, mod: {of: [v_come_after, from], with: definition}}
  information_entity_compose_to_new_word_n: {display: 新しい語を部分に持つ（count2）情報, extends: information_entity, mod: {of: [v_compose, to], with: new_word, at: {count: 2}}}
  sibling_pair: {display: 兄弟概念の組, extends: information_entity_compose_to_new_word_n, mod: {of: [v_compose, to], with: genus_concept, at: {count: 1}}}
  information_entity_refer_from_concept_n: {display: '概念へ述べる（count{"gt": 1}）情報', extends: information_entity, mod: {of: [v_refer, from], with: concept, at: {count: {gt: 1}}}}
  information_entity_refer_from_concept_n_refer_from_v_depend: {display: '依存するへ述べる概念へ述べる（count{"gt": 1}）情報', extends: information_entity_refer_from_concept_n, mod: {of: [v_refer, from], with: v_depend}}
  shared_inference: {display: 使い方が共有する推論, extends: concept, mod: {of: [v_stage, from], with: usage, quant: all}}
  scratchpad: {display: 途中経過の書き出し, extends: inference, mod: {of: [v_stage, to], with: v_speak_reason}}
  single_pass: {display: 一度の処理, extends: inference, mod: {of: [v_stage, to], with: v_speak_reason, neg: true}}
  no_channel: {display: 何もなし, extends: process, mod: {of: [v_stage, to], with: channel, neg: true}}
  expression_part_refer_from_identifier: {display: 識別子へ述べる概念式の部分, extends: expression_part, mod: {of: [v_refer, from], with: identifier}}

  # ===== 設問・事例・判定 =====
  information_entity_refer_from_verdict: {display: 判定へ述べる情報, extends: information_entity, mod: {of: [v_refer, from], with: verdict}}
  case: {display: 事例, extends: sentence, mod: {of: [v_judge, to]}}
  sentence_refer_from_case: {display: 事例へ述べる文, extends: sentence, mod: {of: [v_refer, from], with: case}}
  question: {display: 設問, extends: sentence_refer_from_case, mod: {of: [v_answer, to]}}
  verdict: {display: 判定, extends: information_entity, mod: {of: [v_judge_case, new]}}
  information_entity_refer_from_verdict_refer_from_question: {display: 設問へ述べる判定へ述べる情報, extends: information_entity_refer_from_verdict, mod: {of: [v_refer, from], with: question}}
  question_format: {display: 設問形式, extends: information_entity_refer_from_verdict_refer_from_question, mod: {of: [v_refer, from], with: case, neg: true}}
  option: {display: 選択肢, extends: information_entity_refer_from_verdict, mod: {of: [v_compose, from], with: question}}
  fmt_free: {display: 自由生成, extends: question_format, mod: {of: [v_compose, to], with: option, neg: true}}
  verdict_by_definition: {display: 定義による判定, extends: verdict, mod: {of: [v_agree, from], with: definition}}
  verdict_by_prior: {display: 元の意味による判定, extends: verdict, mod: {of: [v_agree, from], with: prior_meaning}}
  conflict_case: {display: 衝突する事例, extends: case, cmp: [{axis: truth, a: verdict_by_definition, b: verdict_by_prior, rel: differ}]}
  control_case: {display: 衝突しない事例, extends: case, cmp: [{axis: truth, a: verdict_by_definition, b: verdict_by_prior, rel: same}]}
  information_entity_compose_to_case: {display: 事例を部分に持つ情報, extends: information_entity, mod: {of: [v_compose, to], with: case}}
  application_example: {display: 適用例, extends: information_entity_compose_to_case, mod: {of: [v_compose, to], with: verdict}}
  test: {display: テスト, extends: application_example, mod: {of: [v_use, to], with: verification}}
  label_token_positions: {display: 語のトークン位置, extends: information_entity_compose_to_word, mod: {of: [v_compose, from], with: context}}
  information_entity_compose_from_question: {display: 設問の部分である情報, extends: information_entity, mod: {of: [v_compose, from], with: question}}
  position_after_word: {display: 語の直後, extends: information_entity_compose_from_question, mod: {of: [v_come_after, from], with: word, at: {order: 1}}}
  question_format_compose_to_opt_yes: {display: 選択肢「はい」を部分に持つ設問形式, extends: question_format, mod: {of: [v_compose, to], with: opt_yes}}
  fmt_yesno: {display: はい・いいえの二択, extends: question_format_compose_to_opt_yes, mod: {of: [v_compose, to], with: opt_no}}
  question_format_compose_to_opt_applies: {display: 選択肢「当たる」を部分に持つ設問形式, extends: question_format, mod: {of: [v_compose, to], with: opt_applies}}
  fmt_fill: {display: 空欄補充の二択, extends: question_format_compose_to_opt_applies, mod: {of: [v_compose, to], with: opt_not_applies}}
  question_format_compose_to_opt_correct: {display: 選択肢「正しい」を部分に持つ設問形式, extends: question_format, mod: {of: [v_compose, to], with: opt_correct}}
  fmt_truth: {display: 正誤判定の二択, extends: question_format_compose_to_opt_correct, mod: {of: [v_compose, to], with: opt_wrong}}
  fmt_paraphrase_choice: {display: 言い換えの二択, extends: question_format, mod: {of: [v_compose, to], with: definition, at: {count: 2}}}
  item_group: {display: 設問群, extends: information_entity, mod: {of: [v_compose, to], with: question, at: {count: {gt: 1}}}}
  item_group_refer_from_common_word: {display: 一般語へ述べる設問群, extends: item_group, mod: {of: [v_refer, from], with: common_word}}
  group_confusable: {display: 一般の類義語・同音語の設問, extends: item_group_refer_from_common_word, mod: {of: [v_agree, from], with: prior_meaning}}
  group_redef_conflict: {display: 再定義の衝突する設問, extends: item_group, mod: {of: [v_refer, from], with: conflict_case}}
  group_redef_control: {display: 再定義の衝突しない設問, extends: item_group, mod: {of: [v_refer, from], with: control_case}}
  group_new_word: {display: 新しい語の設問, extends: item_group, mod: {of: [v_refer, from], with: new_word}}
  group_sibling: {display: 分化した兄弟概念の設問, extends: group_new_word, mod: {of: [v_refer, from], with: sibling_pair}}
  group_replaced: {display: 置換された用語の設問, extends: group_new_word, mod: {of: [v_refer, from], with: replaced_word}}
  unrelated_items: {display: 無関係な設問, extends: item_group, mod: {of: [v_refer, from], with: redefinition, neg: true}}
  verdict_pair: {display: 選択肢の順序を入れ替えた2回の判定, extends: information_entity, mod: {of: [v_compose, to], with: verdict, at: {count: 2}}}

  # ===== 接続手段と教示。定義をモデルに届ける手段 =====
  teaching: {display: 教示, extends: v_teach, to: layer}
  verification: {display: 検証, extends: v_judge, to: application_example}
  symbol_selection: {display: シンボルの選定, extends: v_judge, to: symbol}
  channel: {display: 接続手段, extends: v_deliver, to: definition}
  text_injection: {display: 文章での注入, extends: channel, mod: {of: [v_involve, from], with: context}}
  renaming: {display: 改名, extends: text_injection, mod: {of: [v_stage, to], with: v_substitute}}
  opaque_renaming: {display: 元の語が見えない改名, extends: renaming, mod: {of: [v_involve, from], with: hidden_word}}
  semi_renaming: {display: 元の語が見える改名, extends: renaming, mod: {of: [v_involve, from], with: visible_word}}
  inline_expansion: {display: 設問中での定義の展開, extends: text_injection, mod: {of: [v_involve, from], with: position_after_word}}
  channel_involve_from_taught_vector: {display: 教示で得られたベクトルへに関わらせる接続手段, extends: channel, mod: {of: [v_involve, from], with: taught_vector}}
  concept_vector: {display: 概念ベクトル, extends: state_shift, mod: {of: [v_depend, from], with: label_token_positions}}
  single_layer_vector: {display: 単一層の概念ベクトル, extends: concept_vector, mod: {of: [v_depend, from], with: layer, at: {count: 1}}}
  multi_layer_vector: {display: 複数層の概念ベクトル, extends: concept_vector, mod: {of: [v_depend, from], with: layer, at: {count: {gt: 1}}}}
  dedicated_token: {display: 概念専用のトークン, extends: identifier, mod: {of: [v_compose, from], with: context}}
  key_token_vector: {display: 専用トークンの概念ベクトル, extends: state_shift, mod: {of: [v_depend, from], with: dedicated_token}}
  symbolic_membership: {display: 事実の判定と体系での帰属の決定, extends: inference, mod: {of: [v_involve, from], with: system}}
  contrast_vector: {display: 定義の有無による活性化の差のベクトル, extends: concept_vector, mod: {of: [v_depend, from], with: definition_text}}
  swapped_concept_vector: {display: 他の語の概念ベクトル, extends: concept_vector, mod: {of: [v_depend, from], with: word, neg: true}}
  common_vector_component: {display: 概念ベクトルの共通成分, extends: state_shift, mod: {of: [v_sum, from], with: concept_vector}}
  specific_vector_component: {display: 概念ベクトルの固有成分, extends: state_shift, mod: {of: [v_depend, from], with: word}}
  sense_difference_vector: {display: 語の意味の候補どうしの差のベクトル, extends: concept_vector, mod: {of: [v_depend, from], with: prior_meaning}}
  opaque_expression: {display: core 以外の識別子を無意味にした概念式, extends: concept_expression, mod: {of: [v_compose, to], with: hidden_word}}
  text_and_vector: {display: 文章と概念ベクトルの併用, extends: text_injection, mod: {of: [is, from], with: concept_vector}}
  delta_weights: {display: 差分重み, extends: channel, mod: {of: [v_involve, from], with: weights}}
  teacher_recite: {display: 定義文の暗唱を教師にする, extends: teaching, from: definition_text}
  teacher_examples: {display: 適用例を教師にする, extends: teaching, from: examples_only}
  teacher_both: {display: 定義文の暗唱と適用例の両方を教師にする, extends: teaching, from: def_and_examples}
  taught_vector: {display: 教示で得られたベクトル, extends: realizable_entity, mod: {of: [teaching, new]}}
  teaching_material: {display: 教示の材料, form: [teaching, from]}

  # ===== 使い方 =====
  usage: {display: 使い方, extends: inference, mod: {of: [v_involve, from], with: word}}
  usage_recite: {display: 定義文の暗唱, extends: usage, mod: {of: [v_stage, to], with: v_speak_definition}}
  usage_apply: {display: 適用, extends: usage, mod: {of: [v_stage, to], with: v_judge_case}}
  usage_define_paraphrase: {display: 定義の言い換えの選択, extends: usage, mod: {of: [v_stage, to], with: v_judge_definition}}
  usage_explain: {display: 説明, extends: usage_apply, mod: {of: [v_stage, to], with: v_speak_reason}}
