# 語彙。文法は tools/check_spec.py の冒頭を見よ。
roles: [target, prior_meaning, agreement_with_prior, boundary, content, placement, teacher, layers,
        channel, visibility_of_original, preceding_kind, preceding_count, following_count, answer_mode, part_of]

predicates:
  causes: {ja: の原因である}
  does_not_cause: {ja: の原因ではない}
  raises: {ja: を上げる}
  does_not_raise: {ja: を上げない}
  lowers: {ja: を下げる}
  does_not_lower: {ja: を下げない}
  transfers_to: {ja: に転移する}
  does_not_transfer_to: {ja: に転移しない}
  coexists_with: {ja: と同居できる}
  is_immune_to: {ja: の影響を受けない}
  is_a_kind_of: {ja: の一種である}
  consists_of: {ja: からなる}
  is_measured_by: {ja: で測る}
  is_assigned_to: {ja: が担う}
  is_placed_at: {ja: に置く}
  is_limited_to: {ja: に限る}
  is_required_by: {ja: に必要である}
  is_the_goal_of: {ja: の目標である}

terms:
  # --- 語と概念 ---
  word: {ja: 語, gloss: 文章に現れる名前}
  common_word: {ja: 一般語, genus: word, diff: {prior_meaning: "=present"}}
  new_word: {ja: 新しい語, genus: word, diff: {prior_meaning: "=absent"}}
  prior_meaning: {ja: 元の意味, gloss: モデルが学習済みの重みから呼び出す、語の意味}
  concept: {ja: 概念, gloss: 語を使うときに走る推論}
  definition: {ja: 定義, gloss: 概念の境界を述べた文}
  redefinition: {ja: 再定義, genus: definition, diff: {target: common_word, agreement_with_prior: "=differs"}}
  rule_redefinition: {ja: 規則型の再定義, genus: redefinition, diff: {boundary: "=numeric_threshold_or_calendar"}}
  remap_redefinition: {ja: 付け替え型の再定義, genus: redefinition, diff: {boundary: "=scope_widened_or_narrowed"}}
  case: {ja: 事例, gloss: 概念に当たるかどうかを問われる対象}
  conflict_case: {ja: 衝突する事例, genus: case, diff: {agreement_with_prior: "=differs"}}
  control_case: {ja: 衝突しない事例, genus: case, diff: {agreement_with_prior: "=agrees"}}
  application_example: {ja: 適用例, gloss: 事例と、定義に沿った判定の組}
  source_of_truth: {ja: 正本, gloss: 他のすべての記述がそこから導かれる記述}
  test: {ja: テスト, gloss: 概念の境界を確かめる事例と判定の組}
  term_server: {ja: 用語サーバー, gloss: 語を概念に解決し、モデルへ渡す定義を選ぶ部品}
  symbol: {ja: シンボル, gloss: コード中で定義され参照される名前付きの実体}
  typed_graph: {ja: 型付きグラフ, gloss: 概念と、概念間の型付きの関係を保持する永続層}
  # --- 語の使い方 ---
  usage: {ja: 使い方, gloss: 語を用いて行う課題の種類}
  usage_recite: {ja: 定義文の暗唱, genus: usage, diff: {content: definition}}
  usage_apply: {ja: 適用, genus: usage, diff: {content: case}}
  usage_define_paraphrase: {ja: 定義の言い換えの選択, genus: usage, diff: {content: definition, answer_mode: "=choose_paraphrase"}}
  usage_explain: {ja: 説明, genus: usage, diff: {content: "=reason_for_verdict"}}
  taught_usage: {ja: 教えた使い方, genus: usage, diff: {teacher: "=used_in_training"}}
  untaught_usage: {ja: 教えていない使い方, genus: usage, diff: {teacher: "=not_used_in_training"}}
  shared_inference: {ja: 使い方が共有する推論, gloss: 1つの語のすべての使い方が参照する、モデル内の計算}
  cross_usage_consistency: {ja: 使い方をまたぐ一貫性, gloss: 1つの使い方で教えたときに、他の使い方も揃って変わること}
  redefinition_success: {ja: 再定義の成功, gloss: 一般語を再定義したとき、モデルがすべての使い方で再定義に従うこと}
  # --- モデルと内部 ---
  model: {ja: モデル, gloss: 重みを固定した言語モデル}
  model_15b: {ja: Qwen2.5-1.5B-Instruct, genus: model}
  model_4b: {ja: Qwen3-4B, genus: model}
  layer: {ja: 層, gloss: トークンのベクトルが順に通る処理段}
  attention: {ja: 注意機構, gloss: 他のトークンの位置から情報を取り込む、層の中の処理}
  single_pass: {ja: 一度の処理, gloss: 途中を書き出さず、層を一度通るだけで答えを出すこと}
  chain_length: {ja: 連鎖の段数, gloss: 答えに至るまでに連ねる必要がある連想の数}
  # --- 接続の手段 ---
  channel: {ja: 接続手段, gloss: 概念の定義をモデルの計算に届ける経路}
  no_channel: {ja: 何もなし, genus: channel}
  text_injection: {ja: 文章での注入, genus: channel, diff: {placement: "=context"}}
  concept_vector: {ja: 概念ベクトル, genus: channel, diff: {placement: "=label_token_positions"}}
  single_layer_vector: {ja: 単一層の概念ベクトル, genus: concept_vector, diff: {layers: "=one"}}
  multi_layer_vector: {ja: 複数層の概念ベクトル, genus: concept_vector, diff: {layers: "=many"}}
  text_and_vector: {ja: 文章と概念ベクトルの併用, genus: channel}
  delta_weights: {ja: 差分重み, genus: channel, diff: {placement: "=weights"}}
  renaming: {ja: 改名, gloss: 再定義した一般語を、別の語に置き換えて渡すこと}
  opaque_renaming: {ja: 元の語が見えない改名, genus: renaming, diff: {visibility_of_original: "=hidden"}}
  semi_renaming: {ja: 元の語が見える改名, genus: renaming, diff: {visibility_of_original: "=visible"}}
  inline_expansion: {ja: 設問中での定義の展開, gloss: 設問中の語の直後に定義を書き添えること}
  scratchpad: {ja: 途中経過の書き出し, gloss: 答えの前に、定義の条件と事例の照合を文章として書かせること}
  # --- 渡す内容・教師 ---
  definition_text: {ja: 定義文, gloss: 定義を書いた文章}
  def_and_examples: {ja: 定義文と適用例, gloss: 定義文と、適用例4問}
  examples_only: {ja: 適用例だけ, gloss: 適用例4問}
  teacher_recite: {ja: 定義文の暗唱を教師にする, gloss: 定義文を出力できるように学習すること}
  teacher_examples: {ja: 適用例を教師にする, gloss: 適用例の判定を出力できるように学習すること}
  teacher_both: {ja: 定義文の暗唱と適用例の両方を教師にする, gloss: 上の2つを同時に学習すること}
  # --- 置き場所と前後 ---
  place_adjacent: {ja: 設問の直前, gloss: 利用者の発話の中で、設問のすぐ前}
  place_system: {ja: システムプロンプト, gloss: 会話の冒頭に置く指示の領域}
  glossary: {ja: 用語集, gloss: 複数の定義を並べた一覧}
  filler_text: {ja: 無関係な文章, gloss: 設問にも定義にも関係しない文章}
  other_definitions: {ja: 他の定義, gloss: 設問に関係しない定義}
  ordinary_definitions: {ja: 一般の意味どおりの定義, genus: other_definitions}
  other_redefinitions: {ja: 他の再定義, genus: other_definitions}
  # --- 要因 ---
  factor: {ja: 要因, gloss: 測定値を動かしうる条件}
  context_length: {ja: 文脈の長さ, genus: factor}
  distance_to_question: {ja: 設問からの距離, genus: factor}
  context_depth: {ja: 文脈の深さ, genus: factor}
  preceding_definitions: {ja: 前に並ぶ定義の数, genus: factor}
  following_definitions: {ja: 後ろに並ぶ定義の数, genus: factor}
  prior_collision: {ja: 元の意味との衝突, genus: factor}
  question_format: {ja: 設問形式, genus: factor}
  vector_count: {ja: 同時に入れる概念ベクトルの数, genus: factor}
  layer_choice: {ja: 単一層の選び方, genus: factor}
  # --- 材料 ---
  item_group: {ja: 設問群, gloss: 同じ種類の設問の集まり}
  g_confusable: {ja: 一般の類義語・同音語の設問, genus: item_group}
  g_redef_conflict: {ja: 再定義の衝突する設問, genus: item_group, diff: {content: conflict_case}}
  g_redef_control: {ja: 再定義の衝突しない設問, genus: item_group, diff: {content: control_case}}
  g_sibling: {ja: 分化した兄弟概念の設問, genus: item_group, diff: {target: new_word}}
  g_replaced: {ja: 置換された用語の設問, genus: item_group, diff: {target: new_word}}
  g_new_word: {ja: 新しい語の設問, genus: item_group, diff: {target: new_word}}
  unrelated_items: {ja: 無関係な設問, genus: item_group}
  modifier: {ja: 修飾, gloss: 上位概念に付けて下位概念を作る種差}
  unseen_genus: {ja: 学習していない上位概念, gloss: 修飾のベクトルの学習に使わなかった上位概念}
  # --- 設問形式 ---
  fmt_yesno: {ja: はい・いいえの二択, gloss: 学習時と同じ設問形式}
  fmt_fill: {ja: 空欄補充の二択, gloss: 当たる・当たらないを選ぶ形式}
  fmt_truth: {ja: 正誤判定の二択, gloss: 文が正しいか誤りかを選ぶ形式}
  fmt_free: {ja: 自由生成, gloss: 選択肢を示さずに答えさせる形式}
  # --- 測定 ---
  metric: {ja: 指標, gloss: 測定値の種類}
  accuracy: {ja: 正答率, genus: metric}
  order_robust_accuracy: {ja: 選択肢の順序に頑健な正答率, genus: metric}
  recital_nll: {ja: 定義文の出しにくさ, genus: metric}
  training_loss: {ja: 学習の損失, genus: metric}
  redefinition_following: {ja: 再定義への追従, gloss: 衝突する事例で、再定義に沿って判定すること}
  control_preservation: {ja: 衝突しない事例での判定の維持, gloss: 衝突しない事例で、正しい判定を保つこと}
  verdict: {ja: 判定, gloss: 事例が概念に当たるかどうかの答え}
  # --- 適用条件 ---
  open_weight_model: {ja: 重みが公開されたモデル, genus: model}
  api_only_model: {ja: APIでしか使えないモデル, genus: model}
  # --- 設計 ---
  this_design: {ja: 本設計, gloss: CMT の設計}
  preceding_definition_effect: {ja: 前に並ぶ定義による追従の低下, gloss: 再定義の前に他の定義が並ぶと、再定義への追従が下がる現象}
  relevant_definitions: {ja: 関係する定義だけ, gloss: 問い合わせに関係する少数の定義}
  glossary_head: {ja: 用語集の先頭, gloss: 用語集の中で、前に他の定義がない位置}
  symbol_selection: {ja: シンボルの選定, gloss: 概念に対応するシンボルを選ぶこと}
  consolidation_target: {ja: 変更の固定先, gloss: 安定した変更を保持しておく接続手段}
