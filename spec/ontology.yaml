  # ----- 質 -----
  experimental_role: {ja: 実験での位置づけ, is: classification, from: has_experimental_role,
                      values: {varied: {ja: 動かす条件}, measured: {ja: 測る量}}}
  quantity: {ja: 量の種類, is: classification, from: has_quantity,
             values: {token_count: {ja: トークン数}, definition_count: {ja: 定義の個数}, instance_count: {ja: 本数}, step_count: {ja: 段数},
                      layer_number: {ja: 層の番号}, mismatch: {ja: 食い違いの有無}, proportion_correct: {ja: 正答の割合},
                      negative_log_likelihood: {ja: 1トークンあたりの負の対数尤度}, loss: {ja: 最後の反復での損失},
                      agreement_with_definition: {ja: 定義に沿う度合い}, co_change: {ja: 揃って変わる度合い}, decrease: {ja: 下がり幅}}}
  counted_side: {ja: 数える側, is: classification, from: is_counted_on_side,
