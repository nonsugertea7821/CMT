# 概念の体系。正本。tools/check_spec.py で検査する。
# このファイル全体が体系である。体系によって制御される書き方が体系制御言語で、概念式は、体系が持つものの一部。
# 自然言語の文は、ここから変換して得る表示で、正本ではない。変換は LLM が行ってもシステムが行ってもよい。
#
# 基礎: 持続体どうしの状態の関係 5個（法則を持つ）と、体系そのものの行為 1個（について述べる）。
#       「について述べる」は体系自身がしている行為なので、体系の中では定義しない。限定（修飾）はできる。
# ノード: すべて、持続体か生起体の下にある。説明文（gloss）を持つのは最上位の2つだけ。
# 動詞: 生起体のノードで、両端（from, to）を持つ。関係に当たる。
#       静的な動詞は holds（成り立っている状態の関係）、動的な動詞は pre / post（起こる前後の状態の関係）で書く。
#       new は、始点でも終点でもない第三のもの。new_kind はその種類。
#       動詞の下位は、端の種類を狭めて書く（extends: 動詞, from / to: 狭めた種類）。
# 形:   form: [動詞, 位置]。位置は from / to / new。その位置に来るもの全体。
# 修飾語: of: [動詞, 位置]。その位置を占めているという性質。質か実現可能体の下に置く。
# 上位: extends: 上位。1つだけ。階層を降りるたびに限定が増える（法則 monotone, specific）。
# 修飾: mod: 修飾語 | {of: [動詞, 位置], with: もう一方の端の中身, neg: 否定, quant: all | any, at: {軸: 値}}
#       1つのノードが足せる限定は1つだけ（法則 single）。並べて書くことはしない。2つ以上の限定は、階層を降りて重ねる。
#       2つの種類の両方に当たるもの（AND）は、関係を省かずに「A のうち、B に属するもの」と書く:
#       {extends: A, mod: {of: [is, from], with: B}}
#       「その動詞の、その位置を占めるもの」に限定する。
# 分類: 軸は関係を抽象として見たもの、値はその具体。値は、固定値か、関数（真偽を返す範囲の判定式）。
#   at:  修飾の中で、軸の値を置く。個数や順番。
#   val: 概念そのものが取る値（{軸: 値}）。文字列や真偽。
#   cmp: 2つのものを同じ軸の上で比べる（{axis: 軸, a: 実体, b: 実体, rel: same | differ}）。
#   axis: 質が、どの軸の値を取る大きさであるか。
# 役割: 実現可能体のうち、定義に依存するもの（担い手の質に依存するのが傾向性）。
#       個々の役割は、根拠となる定義を持つ。

base:
  exists: {ja: 在る, arity: 1}
  depend: {ja: 依存する, arity: 2, laws: [end_exists]}
  part: {ja: 部分である, arity: 2, laws: [transitive, antisymmetric]}
  after: {ja: 後ろにある, arity: 2, laws: [transitive, asymmetric]}
  involve: {ja: 生起体に持続体が関わる, arity: 2, laws: [end_exists]}
  refer: {ja: について述べる, arity: 2, system_act: true}

# 法則（公理）。体系が、証明なしに置くもの。ja は表示で、当てはめるのは実行器。
# scope は、法則が掛かる節。どの法則も、検査（check_spec.py）か実行の検査（run_spec.py）のどちらかが当てはめる。
# 名前空間（領域）。識別子は「領域.名前」と書く。領域を書かない識別子は core に属する。
# 表示語と名前は、同じ領域の中では重複できない。領域が違えば重複してよい（法則 unique_in_domain）。
# ノードは、自分の領域か、その領域が uses に挙げた領域のノードだけを参照できる（法則 layered）。循環する uses は書けない。
domains:
  core: {ja: 核, uses: []}
  run: {ja: 実行, uses: [core]}
  exp: {ja: 実験, uses: [core, run]}

laws:
  transitive: {ja: 推移的, scope: base}
  antisymmetric: {ja: 反対称的, scope: base}
  asymmetric: {ja: 非対称的, scope: base}
  end_exists: {ja: 始点が在れば終点も在る, scope: base}
  truth_distinct: {ja: 真偽の値は2つで互いに違う, scope: axes}
  inherit: {ja: 下位は上位の端を引き継ぐ, scope: nodes}
  narrow: {ja: 下位は上位を狭めることしかできない, scope: nodes}
  acyclic: {ja: 定義は自分自身を参照しない, scope: nodes}
  monotone: {ja: 階層を降りるたびに限定が増える, scope: nodes}
  specific: {ja: より具体的な概念があればその下に置く, scope: nodes}
  single: {ja: 1つのノードが足せる限定は1つだけ, scope: nodes}
  unique_in_domain: {ja: 表示語は同じ領域の中で重複しない, scope: domains}
  layered: {ja: 参照できるのは自分の領域と使う領域だけ, scope: domains}
  step: {ja: 前の状態が成り立つとき後の状態に置き換える, scope: run}
  frame: {ja: 動詞が触れなかった文は変わらない, scope: run}
  halt: {ja: 当てはまる動詞がなければ止まる, scope: run}

axes:
  count: {ja: 個数, source: any, value: number}   # どの関係についても「いくつと結ばれるか」を見られる
  ratio: {ja: 割合, source: part, value: number}
  order: {ja: 順番, source: after, value: number}
  text: {ja: 文字列, source: refer, value: literal}
  truth: {ja: 真偽, source: refer, value: [true, false]}

nodes:
  continuant: {ja: 持続体, gloss: 時間を通じて同一性を保って存在するもの}
  occurrent: {ja: 生起体, gloss: 時間の中で起こり、展開するもの}

  # ----- 静的 -----
  v_depend: {ja: 依存する, extends: occurrent, from: continuant, to: continuant, holds: ["depend(from, to)"]}
  v_compose: {ja: 部分になる, extends: occurrent, from: continuant, to: continuant, holds: ["part(from, to)"]}
  v_stage: {ja: 時間的な部分になる, extends: occurrent, from: occurrent, to: occurrent, holds: ["part(from, to)"]}
  v_come_after: {ja: 後ろに置かれる, extends: occurrent, from: continuant, to: continuant, holds: ["after(from, to)"]}
  v_refer: {ja: 述べる, extends: occurrent, from: continuant, to: any, holds: ["refer(from, to)"]}
  v_agree: {ja: 一致する, extends: occurrent, from: continuant, to: continuant, holds: ["refer(from, new)", "refer(to, new)"]}
  v_measure: {ja: 測る, extends: occurrent, from: continuant, to: any, holds: ["refer(from, to)", "depend(from, to)"]}
  v_express: {ja: で書かれる, extends: occurrent, from: continuant, to: continuant, holds: ["depend(from, to)", "part(new, from)", "part(new, to)"]}
  v_involve: {ja: に関わらせる, extends: occurrent, from: occurrent, to: continuant, holds: ["involve(from, to)"]}
  v_perform: {ja: 行う, extends: occurrent, from: continuant, to: occurrent, holds: ["involve(to, from)"]}
  v_trigger: {ja: 引き起こす, extends: occurrent, from: any, to: occurrent, holds: ["after(to, from)", "depend(to, from)"]}
  # ----- 動的 -----
  v_design: {ja: 設計する, extends: occurrent, from: continuant, to: continuant, pre: ["not exists(to)"], post: ["exists(to)"]}
  v_compute: {ja: 計算する, extends: occurrent, from: continuant, to: any, pre: ["not exists(to)"], post: ["exists(to)"]}
  v_learn: {ja: 学習する, extends: occurrent, from: continuant, to: continuant, new_kind: realizable_entity,
            pre: ["not exists(new)"], post: ["exists(new)", "depend(new, from)", "refer(new, to)"]}
  v_freeze: {ja: 固定する, extends: occurrent, from: continuant, to: continuant, new_kind: realizable_entity,
             pre: ["exists(new)", "depend(new, to)"], post: ["not exists(new)"]}
  v_vary: {ja: 動かす, extends: occurrent, from: continuant, to: continuant, new_kind: quality,
           pre: ["depend(new, to)"], post: ["not depend(new, to)"]}

  # ===== BFO の区別 =====
  dependent: {ja: 依存するもの, form: [v_depend, from]}
  independent_continuant: {ja: 独立持続体, extends: continuant, mod: {of: [v_depend, from], neg: true}}
  specifically_dependent_continuant: {ja: 特定依存持続体, extends: dependent, mod: {of: [v_depend, from], at: {count: 1}}}
  generically_dependent_continuant: {ja: 汎用依存持続体, extends: dependent, mod: {of: [v_depend, from], quant: any}}
  realizable_entity: {ja: 実現可能体, extends: specifically_dependent_continuant, mod: {of: [v_involve, to]}}
  quality: {ja: 質, extends: specifically_dependent_continuant, mod: {of: [v_involve, to], neg: true}}
  disposition: {ja: 傾向性, extends: realizable_entity, mod: {of: [v_depend, from], with: quality}}
  role: {ja: 役割, extends: realizable_entity, mod: {of: [v_depend, from], with: definition}}
  magnitude: {ja: 大きさ, extends: quality, mod: {of: [v_come_after, from], with: quality}}
  process: {ja: 過程, extends: occurrent, mod: {of: [v_stage, to]}}

  # ===== 場面と、そこでの取り決め（役割の根拠になる定義） =====
  process_stage_to_v_vary: {ja: 動かすから時間的な部分になる過程, extends: process, mod: {of: [v_stage, to], with: v_vary}}
  experiment: {ja: 実験, extends: process_stage_to_v_vary, mod: {of: [v_stage, to], with: v_measure}}
  experiment_protocol: {ja: 実験の取り決め, extends: definition, mod: {of: [v_refer, from], with: experiment}}

  # ===== 修飾語 =====
  frozen: {ja: 固定されている, extends: quality, of: [v_freeze, to]}
  learned: {ja: 学習で得られた, extends: quality, of: [v_learn, new]}

  # ===== 情報 =====
  information_entity: {ja: 情報, extends: generically_dependent_continuant, mod: {of: [v_refer, from]}}
  language: {ja: 言語, extends: information_entity, mod: {of: [v_express, to]}}
  system: {ja: 体系, extends: information_entity, mod: {of: [v_compose, to], with: concept_expression, at: {count: {gt: 1}}}}
  controlled_language: {ja: 体系制御言語, extends: language, mod: {of: [v_depend, from], with: system}}
  definition_compose_from_system: {ja: 体系へ部分になる定義, extends: definition, mod: {of: [v_compose, from], with: system}}
  concept_expression: {ja: 概念式, extends: definition_compose_from_system, mod: {of: [v_express, from], with: controlled_language}}
  passage_express_from_natural_language: {ja: 自然言語へで書かれる文章, extends: passage, mod: {of: [v_express, from], with: natural_language}}
  natural_language: {ja: 自然言語, extends: language, mod: {of: [v_design, to], neg: true}}
  information_entity_compose_to_word: {ja: 語から部分になる情報, extends: information_entity, mod: {of: [v_compose, to], with: word}}
  sentence: {ja: 文, extends: information_entity_compose_to_word, mod: {of: [v_express, from], with: language}}
  passage: {ja: 文章, extends: information_entity, mod: {of: [v_compose, to], with: sentence}}
  information_entity_express_from_natural_language: {ja: 自然言語へで書かれる情報, extends: information_entity, mod: {of: [v_express, from], with: natural_language}}
  word: {ja: 語, extends: information_entity_express_from_natural_language, mod: {of: [v_compose, from], with: sentence}}
  definition: {ja: 定義, extends: sentence, mod: {of: [v_refer, from], with: concept}}


  # ===== 人工物 =====
  artifact: {ja: 人工物, extends: generically_dependent_continuant, mod: {of: [v_refer, from], neg: true}}
  artifact_compose_from_model: {ja: モデルへ部分になる人工物, extends: artifact, mod: {of: [v_compose, from], with: model}}
  weights: {ja: 重み, extends: artifact_compose_from_model, mod: learned}
  frozen_weights: {ja: 固定された重み, extends: weights, mod: frozen}
  artifact_compute_from: {ja: 計算する人工物, extends: artifact, mod: {of: [v_compute, from]}}
  model: {ja: モデル, extends: artifact_compute_from, mod: {of: [v_compose, to], with: frozen_weights}}


  # ===== 生起体 =====
  inference: {ja: 推論, extends: process, mod: {of: [v_perform, to], with: model}}
  concept: {ja: 概念, extends: inference, mod: {of: [v_trigger, to], with: word}}

  # new は、始点がない場合の終点の値（比べる相手）

  # 記録の項目名は、ここにあるノードの識別子そのもの。
  # ----- 文の骨組み: 何が（s）、どう関係し（p）、何に（o） -----
  p: {ja: 関係づける, extends: occurrent, from: any, to: any, holds: ["exists(from)", "exists(to)"]}
  s: {ja: 始点に来るもの, form: [p, from]}
  o: {ja: 終点に来るもの, form: [p, to]}
  # ----- 大きさを比べる動詞。「後ろにある」が、より大きい、に当たる -----
  v_come_before: {ja: 前に置かれる, extends: occurrent, from: continuant, to: continuant, holds: ["after(to, from)"]}
  v_not_before: {ja: 前には置かれない, extends: occurrent, from: continuant, to: continuant, holds: ["not after(to, from)"]}
  v_not_after: {ja: 後ろには置かれない, extends: occurrent, from: continuant, to: continuant, holds: ["not after(from, to)"]}
  v_level: {ja: 同じ位置にある, extends: occurrent, from: continuant, to: continuant, holds: ["not after(from, to)", "not after(to, from)"]}
  # ----- 識別子と結果ファイル -----
  information_entity_express_from_controlled_language: {ja: 体系制御言語へで書かれる情報, extends: information_entity, mod: {of: [v_express, from], with: controlled_language}}
  identifier: {ja: 識別子, extends: information_entity_express_from_controlled_language, mod: {of: [v_refer, from], with: concept_expression, at: {count: 1}}}
  pattern: {ja: 識別子の雛形, extends: information_entity, mod: {of: [v_refer, from], with: identifier, at: {count: {gt: 1}}}}
  # ----- 測定値 -----
  information_entity_refer_from_p: {ja: 関係づけるへ述べる情報, extends: information_entity, mod: {of: [v_refer, from], with: p}}
  axis: {ja: 軸, extends: information_entity_refer_from_p, mod: {of: [v_compose, to], with: value}}
  value: {ja: 値, extends: information_entity, mod: {of: [v_compose, from], with: axis}}
  # ----- 観察・仮説・決定・残り項目 -----
  hypothesis: {ja: 仮説, extends: sentence, mod: {of: [v_refer, from], with: occurrent}}
  role_depend_from_experiment_protocol: {ja: 実験の取り決めへ依存する役割, extends: role, mod: {of: [v_depend, from], with: experiment_protocol}}
  scope: {ja: 適用範囲, extends: role_depend_from_experiment_protocol, mod: {of: [v_depend, from], with: hypothesis}}

  # ===== 体系が、自分の書き方（文法）について述べるための概念 =====
  expression_part: {ja: 概念式の部分, extends: information_entity, mod: {of: [v_compose, from], with: concept_expression}}
  ja: {ja: 表示語, extends: word, mod: {of: [v_agree, from], with: identifier}}
  gloss: {ja: 説明文, extends: passage_express_from_natural_language, mod: {of: [v_refer, from], with: concept}}
  kind: {ja: 種類, form: [v_compose, to]}
  participant: {ja: 関わるもの, form: [v_involve, to]}
  participant_p_from_not: {ja: 関係づけることのない関わるもの, extends: participant, mod: {of: [p, from], neg: true}}
  third_participant: {ja: 第三のもの, extends: participant_p_from_not, mod: {of: [p, to], neg: true}}
  state_relation: {ja: 状態の関係, extends: occurrent, mod: {of: [v_stage, to], neg: true}}
  extends: {ja: 上位の指定, extends: expression_part, mod: {of: [v_refer, from], with: kind}}
  position: {ja: 位置, extends: expression_part, mod: {of: [v_refer, from], with: p}}
  form: {ja: 形の指定, extends: position, mod: {of: [v_compose, from], with: mod, neg: true}}
  mod: {ja: 修飾の指定, extends: expression_part, mod: {of: [v_compose, to], with: position}}
  with: {ja: もう一方の端の指定, extends: expression_part, mod: {of: [v_refer, from], with: participant}}
  neg: {ja: 否定の指定, extends: expression_part, val: {truth: false}}
  quant: {ja: 数量化の指定, extends: expression_part, mod: {of: [v_refer, from], with: participant, at: {count: {gt: 1}}}}
  value_part: {ja: 値の指定, extends: expression_part, mod: {of: [v_refer, from], with: value}}
  at: {ja: 修飾の中の値の指定, extends: value_part, mod: {of: [v_compose, from], with: mod}}
  val: {ja: 概念が取る値の指定, extends: value_part, mod: {of: [v_compose, from], with: mod, neg: true}}
  cmp: {ja: 比較の指定, extends: expression_part, mod: {of: [v_refer, from], with: value, at: {count: 2}}}
  a: {ja: 比べる一方, form: [v_level, from]}
  b: {ja: 比べるもう一方, form: [v_level, to]}
  same: {ja: 同じである, extends: quality, of: [v_level, from]}
  differ: {ja: 違っている, extends: quality, of: [v_level, from], neg: true}
  rel: {ja: 比べた結果, extends: quality, mod: {of: [v_depend, from], with: cmp}}
  from: {ja: 始点の位置, extends: position, mod: {of: [v_refer, from], with: s}}
  to: {ja: 終点の位置, extends: position, mod: {of: [v_refer, from], with: o}}
  new_kind: {ja: 第三のものの種類の指定, extends: expression_part, mod: {of: [v_refer, from], with: third_participant}}
  holds: {ja: 成り立つ状態の指定, extends: expression_part, mod: {of: [v_refer, from], with: state_relation}}
  pre: {ja: 前の状態の指定, extends: holds, mod: {of: [v_come_before, from], with: post}}
  post: {ja: 後の状態の指定, extends: holds, mod: {of: [v_come_after, from], with: pre}}
  arity: {ja: 端の数, extends: magnitude, mod: {of: [v_measure, from], with: state_relation}}
  sentence_refer_from_state_relation: {ja: 状態の関係へ述べる文, extends: sentence, mod: {of: [v_refer, from], with: state_relation}}
  laws: {ja: 法則, extends: sentence_refer_from_state_relation, val: {truth: true}}
  system_act: {ja: 体系そのものの行為, extends: v_refer, from: system}
  grammar_rule: {ja: 文法の規則, extends: sentence, mod: {of: [v_refer, from], with: expression_part}}
  grammar: {ja: 文法の記述, extends: section, mod: {of: [v_compose, to], with: grammar_rule, at: {count: {gt: 1}}}}

  # ===== 述語論理の語。「について述べる」の限定として書く。区別は法則 truth_distinct が与える =====
  sentence_refer_from_sentence: {ja: 文へ述べる文, extends: sentence, mod: {of: [v_refer, from], with: sentence}}
  not: {ja: 否定, extends: sentence_refer_from_sentence, cmp: [{axis: truth, a: not, b: sentence, rel: differ}]}
  any: {ja: 存在の数量化, extends: sentence, mod: {of: [v_refer, from], with: participant, at: {count: {ge: 1}}}}
  all: {ja: 全称の数量化, extends: not, mod: {of: [v_refer, from], with: any}}
  value_not_before_from: {ja: 前には置かれない値, extends: value, mod: {of: [v_not_before, from]}}
  between: {ja: 範囲の判定, extends: value_not_before_from, mod: {of: [v_not_after, from]}}
  # ===== 個体の層と実行 =====
  is: {ja: 属する, extends: p, to: kind}
  individuals: {ja: 個体, form: [is, from]}
  facts: {ja: 個体についての文, extends: sentence, mod: {of: [v_refer, from], with: individuals}}
  run.state: {ja: 状態, extends: information_entity, mod: {of: [v_compose, to], with: facts}}
  rewrite_rule: {ja: 書き換えの規則, extends: definition, mod: {of: [v_refer, from], with: post}}
  run.v_execute: {ja: 実行する, extends: occurrent, from: continuant, to: run.state, new_kind: run.state,
              pre: ["not exists(new)"], post: ["exists(new)", "after(new, to)"]}
  role_depend_from_rewrite_rule: {ja: 書き換えの規則へ依存する役割, extends: role, mod: {of: [v_depend, from], with: rewrite_rule}}
  run.executor: {ja: 実行器, extends: role_depend_from_rewrite_rule, mod: {of: [run.v_execute, from]}}
  run.halted: {ja: 止まった状態, extends: run.state, mod: {of: [run.v_execute, to], neg: true}}
  run.run: {ja: 実行の記録, extends: information_entity, mod: {of: [v_refer, from], with: run.v_execute}}

  # ===== 文法の語のうち、上に無かったもの。文法の語は、すべてノードの識別子である =====
  new: {ja: 第三の位置, extends: position, mod: {of: [v_refer, from], with: third_participant}}
  of: {ja: 位置の指定, extends: expression_part, mod: {of: [v_refer, from], with: position}}
  section: {ja: 体系の節, extends: information_entity, mod: {of: [v_compose, from], with: system}}
  base: {ja: 基礎の節, extends: section, mod: {of: [v_refer, from], with: state_relation}}
  axes: {ja: 軸の節, extends: section, mod: {of: [v_refer, from], with: axis}}
  nodes: {ja: ノードの節, extends: section, mod: {of: [v_refer, from], with: concept_expression}}
  source: {ja: もとになる関係の指定, extends: holds, mod: {of: [v_compose, from], with: axes}}
  run.steps: {ja: 歩みの並び, extends: information_entity, mod: {of: [v_refer, from], with: run.v_execute, at: {count: {ge: 1}}}}
  expect: {ja: 期待する文, extends: facts, val: {truth: true}}
  function: {ja: 関数, extends: value, mod: {of: [v_refer, from], with: value}}
  logic: {ja: 述語論理の語, extends: word, mod: {of: [v_refer, from], with: sentence}}
  gt: {ja: より大きいという判定, extends: function, mod: {of: [v_come_after, from]}}
  ge: {ja: 以上という判定, extends: function, mod: {of: [v_not_before, from]}}
  lt: {ja: より小さいという判定, extends: function, mod: {of: [v_come_before, from]}}
  le: {ja: 以下という判定, extends: function, mod: {of: [v_not_after, from]}}
  number: {ja: 数の値, extends: value, mod: {of: [v_refer, from], with: magnitude}}
  literal: {ja: 文字の値, extends: value, mod: {of: [v_refer, from], with: word}}

  # ===== 実行の戦略と実行時の意味論。実行の検査（run_spec.py）は、run.runtime の節に書かれた選択に従う =====
  run.strategy: {ja: 実行の戦略, extends: definition, mod: {of: [v_refer, from], with: run.v_execute}}
  run.runtime: {ja: 実行時の意味論の節, extends: section, mod: {of: [v_refer, from], with: run.strategy}}
  run.world: {ja: 書かれていない文の扱い, extends: run.strategy, mod: {of: [v_refer, from], with: facts}}
  run.closed_world: {ja: 書かれていない文は成り立たない, extends: run.world, val: {truth: false}}
  run.pre_rule: {ja: 前の状態の確かめ方, extends: run.strategy, mod: {of: [v_refer, from], with: pre}}
  run.post_rule: {ja: 後の状態の作り方, extends: run.strategy, mod: {of: [v_refer, from], with: post}}
  run.replace: {ja: 否定の文を取り除き肯定の文を加える, extends: run.post_rule, mod: {of: [v_refer, from], with: not}}
  run.law_check: {ja: 法則を確かめる時点, extends: run.strategy, mod: {of: [v_refer, from], with: laws}}
  run.every_step: {ja: 1歩ごとに確かめる, extends: run.law_check, mod: {of: [v_come_after, from], with: run.steps}}
  run.binding: {ja: 位置への個体の割り当て方, extends: run.strategy, mod: {of: [v_refer, from], with: individuals}}
  run.distinct: {ja: 位置ごとに別の個体を割り当てる, extends: run.binding, cmp: [{axis: text, a: from, b: to, rel: differ}]}
  run.choice: {ja: 当てはまる動詞の選び方, extends: run.strategy, mod: {of: [v_refer, from], with: run.steps}}
  run.recorded: {ja: 実行の記録が選び方を与える, extends: run.choice, mod: {of: [v_depend, from], with: run.run}}
  run.progress: {ja: 当てはまるとみなす条件, extends: run.strategy, mod: {of: [v_refer, from], with: run.halted}}
  run.changes_state: {ja: 前の状態が成り立ち後の状態がまだ成り立っていない, extends: run.progress, mod: {of: [v_come_before, from], with: post}}
  # ===== 構文糖衣。短い書き方と、それが表すものの対応 =====
  syntax: {ja: 構文糖衣の節, extends: section, mod: {of: [v_refer, from], with: pattern}}
  formula: {ja: 状態の関係の式, extends: pattern, mod: {of: [v_refer, from], with: state_relation}}

  # ===== 名前空間 =====
  domain: {ja: 領域, extends: information_entity, mod: {of: [v_compose, to], with: concept_expression}}
  domains: {ja: 領域の節, extends: section, mod: {of: [v_refer, from], with: domain}}
  uses: {ja: 使う領域の指定, extends: expression_part, mod: {of: [v_refer, from], with: domain}}

# 体系が、自分の記録（領域のファイルに書かれた個体）について述べる。個体は is で種類に属する。
# 記録の種類ごとに、それが何であるか（is）、識別子の種類（key）、持てる項目（fields）を書く。
# 項目名は、ノードの識別子そのもの。その項目の中身は、そのノードに当たるものである。

  # 個体の項目。ある種類の個体に書ける項目は、「その種類のものとの関係で限定された下位」を持つノードだけ。


# 実行時の意味論。実行器が、書き換えの規則をどう当てはめるか。語も値もノードの識別子。
# 実行の検査は、ここに書かれた選択に従う。実装のない選択が書かれていれば、エラーにする。
runtime:
  world: closed_world
  pre_rule: all
  post_rule: replace
  law_check: every_step
  binding: distinct
  choice: recorded
  progress: changes_state

# 構文糖衣。短い書き方（正規表現）と、それが表す部分の名前。部分の名前はノードの識別子。
syntax:
  formula: {pattern: '(?P<not>not )?(?P<base>\w+)\((?P<from>\w+)(?:, (?P<to>\w+))?\)', value: [not, base, from, to]}

# 体系が、自分の書き方（文法）について述べる。
# 文法の語は、すべてノードの識別子である。節ごとに、そこで使える語を並べる。検査は、ここに並んだ語だけを受け付ける。
grammar:
  grammar: [system, nodes, mod, cmp, base, axes, laws, run, position, rel, function, value, logic, runtime, syntax, domains, domain, individuals, grammar]
  system: [domains, base, laws, axes, nodes, runtime, syntax, grammar]
  nodes: [ja, gloss, extends, from, to, new_kind, holds, pre, post, form, of, neg, mod, val, cmp, axis]
  mod: [of, with, neg, quant, at]
  cmp: [axis, a, b, rel]
  base: [ja, arity, laws, system_act]
  axes: [ja, source, value]
  laws: [ja, scope]
  run: [individuals, facts, steps, expect, halted]   # 実行の記録（spec/runs/*.yaml）
  position: [from, to, new]
  rel: [same, differ]
  function: [gt, ge, lt, le]
  value: [number, literal]
  logic: [not, all, any, between]   # true と false は、真偽の軸の値
  runtime: [world, pre_rule, post_rule, law_check, binding, choice, progress]
  syntax: [formula]
  domains: [ja, uses]
  domain: [domain, nodes, individuals]   # 領域のファイル（spec/exp.yaml）
  individuals: [is, ja, val]
