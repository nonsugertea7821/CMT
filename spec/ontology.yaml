  delivered: {ja: 届ける量, is: classification, from: delivers,
              values: {nothing: {ja: 何も届けない}}}
  word_substitution: {ja: 語の置き換え, is: classification, from: substitutes_word,
                      values: {substituted: {ja: 別の語に置き換える}}}
  position_to_word: {ja: 語に対する位置, is: classification, from: is_positioned_to_word,
