classifications:
  classification: {ja: 分類, gloss: 軸と値によって実体を分けるもの}
  # ===== 値を列挙する軸 =====
  # ----- BFO の区別 -----
  dependence: {ja: 依存のしかた, is: classification, from: depends_on,
               values: {on_nothing: {ja: 何にも依存しない}, on_specific_bearer: {ja: 特定の担い手に依存する}, on_any_bearer: {ja: 担い手を替えても同一である}}}
  realization: {ja: 実現のしかた, is: classification, from: is_realized_in,
                values: {needs_no_process: {ja: 過程がなくても現に成り立つ}, needs_process: {ja: 過程の中で実現される}}}
  grounding: {ja: 由来, is: classification, from: is_grounded_in,
              values: {external_circumstance: {ja: 外の状況から与えられる}, internal_makeup: {ja: 担い手の成り立ちに由来する}}}
  temporal_extent: {ja: 時間的な広がり, is: classification, from: has_temporal_extent,
                    values: {extended: {ja: 時間的な部分を持つ}}}
  aboutness: {ja: 記述性, is: classification, from: is_about,
              values: {describes: {ja: 何かについて述べる}, does_not_describe: {ja: 何についても述べない}}}
  # ----- 情報 -----
  unit: {ja: 単位, is: classification, from: has_unit,
         values: {name: {ja: 名前}, sentence: {ja: 文}, passage: {ja: 文章}, pair: {ja: 組}, list: {ja: 一覧}, set: {ja: 集まり},
                  position: {ja: 位置}, form: {ja: 形式}, graph: {ja: グラフ}, design: {ja: 設計}}}
  language: {ja: 言語, is: classification, from: is_written_in,
             values: {natural: {ja: 自然言語}, programming: {ja: プログラミング言語}}}
  speech_act: {ja: 言語行為, is: classification, from: has_speech_act,
               values: {states: {ja: 述べる}, asks: {ja: 問う}, answers: {ja: 答える}}}
  speaker: {ja: 発話者, is: classification, from: is_spoken_by,
            values: {system: {ja: システム}, user: {ja: 利用者}}}
  persistence: {ja: 保持, is: classification, from: persists,
                values: {persistent: {ja: 永続する}}}
  expression_part: {ja: 概念式での位置, is: classification, from: is_part_of_expression,
                    values: {genus: {ja: 類}, differentia: {ja: 種差}}}
  options: {ja: 選択肢, is: classification, from: has_options,
            values: {yes_or_no: {ja: はい・いいえ}, applies_or_not: {ja: 当たる・当たらない}, true_or_false: {ja: 正しい・誤り},
                     two_paraphrases: {ja: 定義の言い換え2つ}, no_options: {ja: 選択肢なし}}}
  task: {ja: 課題, is: classification, from: has_task,
         values: {distinguish_siblings: {ja: 兄弟概念を区別する}, choose_current_term: {ja: 現行の語を選ぶ}}}
  prior_meaning_presence: {ja: 元の意味の有無, is: classification, from: has_prior_meaning,
                           values: {present: {ja: 元の意味がある}, absent: {ja: 元の意味がない}}}
  agreement_with_prior: {ja: 元の意味との一致, is: classification, from: agrees_with_prior,
                         values: {agrees: {ja: 一致する}, differs: {ja: 食い違う}}}
  boundary_kind: {ja: 境界の決まり方, is: classification, from: has_boundary_kind,
                  values: {numeric_threshold_or_calendar: {ja: 数値のしきい値または暦の計算で決まる}, scope_widened_or_narrowed: {ja: 対象の範囲の伸縮で決まる}}}
  relevance_to_question: {ja: 設問との関係, is: classification, from: is_relevant_to,
                          values: {relevant: {ja: 関係する}, irrelevant: {ja: 関係しない}}}
  # ----- 人工物 -----
  function: {ja: 働き, is: classification, from: has_function,
             values: {language_modeling: {ja: 次のトークンを予測する}, token_transformation: {ja: トークンのベクトルを書き換える},
                      information_routing: {ja: 他のトークンの位置から情報を取り込む}, term_resolution: {ja: 語を概念に解決して渡す定義を選ぶ}}}
  weight_state: {ja: 重みの状態, is: classification, from: has_weight_state,
