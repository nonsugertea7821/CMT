# 概念の体系。3本のツリーからなる。
#   entities         実体のツリー。最上位は BFO の continuant（持続体）と occurrent（生起体）。
#                    原始概念はこの2つだけで、説明文（gloss）を持てるのもこの2つだけ。
#                    他のすべての実体は「上位の実体 [軸=値, ...]」という概念式（is と where）で記述する。
#   relations        関係のツリー。各関係は、結ぶ実体の種類（domain, range）と、述語論理による定義（def）を持つ。
#                    primitive は、他の関係で定義しない関係。any はすべての実体。
#   classifications  分類のツリー。軸は関係を抽象として見たもの（from）、値はその具体（values / values_from / number）。
# 正規形（軸を整列した式）が同じ実体は同一とみなし、重複は検査で失敗する。

entities:
  continuant: {ja: 持続体, gloss: 時間を通じて同一性を保って存在するもの}
  occurrent: {ja: 生起体, gloss: 時間の中で起こり、展開するもの}
  independent_continuant: {ja: 独立持続体, is: continuant, where: {dependence: on_nothing}}
  specifically_dependent_continuant: {ja: 特定依存持続体, is: continuant, where: {dependence: on_specific_bearer}}
  generically_dependent_continuant: {ja: 汎用依存持続体, is: continuant, where: {dependence: on_any_bearer}}
  quality: {ja: 質, is: specifically_dependent_continuant, where: {realization: needs_no_process}}
  realizable_entity: {ja: 実現可能体, is: specifically_dependent_continuant, where: {realization: needs_process}}
  role: {ja: 役割, is: realizable_entity, where: {grounding: external_circumstance}}
  disposition: {ja: 傾向性, is: realizable_entity, where: {grounding: internal_makeup}}
  process: {ja: 過程, is: occurrent, where: {temporal_extent: extended}}
  information_entity: {ja: 情報, is: generically_dependent_continuant, where: {aboutness: describes}}
  word: {ja: 語, is: information_entity, where: {unit: name, language: natural}}
  common_word: {ja: 一般語, is: word, where: {prior_meaning_presence: present}}
  new_word: {ja: 新しい語, is: word, where: {prior_meaning_presence: absent}}
  modifier: {ja: 修飾, is: word, where: {expression_part: differentia}}
  genus_concept: {ja: 上位概念, is: word, where: {expression_part: genus}}
  seen_genus: {ja: 学習した上位概念, is: genus_concept, where: {training_use: used}}
  unseen_genus: {ja: 学習していない上位概念, is: genus_concept, where: {training_use: not_used}}
  code: {ja: コード, is: information_entity, where: {unit: passage, language: programming}}
  symbol: {ja: シンボル, is: information_entity, where: {unit: name, language: programming}}
  definition: {ja: 定義, is: information_entity, where: {unit: sentence, speech_act: states, content: concept}}
  redefinition: {ja: 再定義, is: definition, where: {target: common_word, agreement_with_prior: differs}}
  rule_redefinition: {ja: 規則型の再定義, is: redefinition, where: {boundary_kind: numeric_threshold_or_calendar}}
  remap_redefinition: {ja: 付け替え型の再定義, is: redefinition, where: {boundary_kind: scope_widened_or_narrowed}}
  other_definitions: {ja: 他の定義, is: definition, where: {relevance_to_question: irrelevant}}
  relevant_definitions: {ja: 関係する定義だけ, is: definition, where: {relevance_to_question: relevant}}
  ordinary_definitions: {ja: 一般の意味どおりの定義, is: other_definitions, where: {agreement_with_prior: agrees}}
  other_redefinitions: {ja: 他の再定義, is: other_definitions, where: {agreement_with_prior: differs}}
  case: {ja: 事例, is: information_entity, where: {unit: sentence, judged_against: concept}}
  conflict_case: {ja: 衝突する事例, is: case, where: {agreement_with_prior: differs}}
  control_case: {ja: 衝突しない事例, is: case, where: {agreement_with_prior: agrees}}
  question: {ja: 設問, is: information_entity, where: {unit: sentence, speech_act: asks, content: case}}
  verdict: {ja: 判定, is: information_entity, where: {unit: sentence, speech_act: answers, content: case}}
  reason: {ja: 理由, is: information_entity, where: {unit: sentence, speech_act: states, content: verdict}}
  application_example: {ja: 適用例, is: information_entity, where: {unit: pair, content: [case, verdict]}}
  test: {ja: テスト, is: application_example, where: {use: verification}}
  definition_text: {ja: 定義文, is: information_entity, where: {unit: passage, content: definition}}
  examples_only: {ja: 適用例だけ, is: information_entity, where: {unit: passage, content: application_example}}
  def_and_examples: {ja: 定義文と適用例, is: information_entity, where: {unit: passage, content: [definition, application_example]}}
  filler_text: {ja: 無関係な文章, is: information_entity, where: {unit: passage, relevance_to_question: irrelevant}}
  context: {ja: 文脈, is: information_entity, where: {unit: passage, input_of: model}}
  glossary: {ja: 用語集, is: information_entity, where: {unit: list, content: definition}}
  glossary_head: {ja: 用語集の先頭, is: information_entity, where: {unit: position, located_in: glossary, preceding_count: 0}}
  place_system: {ja: システムプロンプト, is: information_entity, where: {unit: position, located_in: context, speaker: system}}
  place_adjacent: {ja: 設問の直前, is: information_entity, where: {unit: position, located_in: context, speaker: user, immediately_before: question}}
  label_token_positions: {ja: 語のトークン位置, is: information_entity, where: {unit: position, located_in: context, occupied_by: word}}
  question_format: {ja: 設問形式, is: information_entity, where: {unit: form, content: [question, verdict]}}
  fmt_yesno: {ja: はい・いいえの二択, is: question_format, where: {options: yes_or_no}}
  fmt_fill: {ja: 空欄補充の二択, is: question_format, where: {options: applies_or_not}}
  fmt_truth: {ja: 正誤判定の二択, is: question_format, where: {options: true_or_false}}
  fmt_free: {ja: 自由生成, is: question_format, where: {options: no_options}}
  fmt_paraphrase_choice: {ja: 言い換えの二択, is: question_format, where: {options: two_paraphrases}}
  item_group: {ja: 設問群, is: information_entity, where: {unit: set, content: question}}
  g_confusable: {ja: 一般の類義語・同音語の設問, is: item_group, where: {target: common_word, agreement_with_prior: agrees}}
  g_redef_conflict: {ja: 再定義の衝突する設問, is: item_group, where: {target: conflict_case}}
  g_redef_control: {ja: 再定義の衝突しない設問, is: item_group, where: {target: control_case}}
  g_new_word: {ja: 新しい語の設問, is: item_group, where: {target: new_word}}
  g_sibling: {ja: 分化した兄弟概念の設問, is: g_new_word, where: {task: distinguish_siblings}}
  g_replaced: {ja: 置換された用語の設問, is: g_new_word, where: {task: choose_current_term}}
  unrelated_items: {ja: 無関係な設問, is: item_group, where: {relevance_to_question: irrelevant}}
  typed_graph: {ja: 型付きグラフ, is: information_entity, where: {unit: graph, content: concept, persistence: persistent}}
  this_design: {ja: 本設計, is: information_entity, where: {unit: design, content: concept, target: model}}
  artifact: {ja: 人工物, is: generically_dependent_continuant, where: {aboutness: does_not_describe}}
  model: {ja: モデル, is: artifact, where: {function: language_modeling, weight_state: frozen}}
  model_15b: {ja: Qwen2.5-1.5B-Instruct, is: model, where: {parameter_count: 1500000000, layer_total: 28}}
  model_4b: {ja: Qwen3-4B, is: model, where: {parameter_count: 4000000000}}
  open_weight_model: {ja: 重みが公開されたモデル, is: model, where: {weight_access: open}}
  api_only_model: {ja: APIでしか使えないモデル, is: model, where: {weight_access: closed}}
  weights: {ja: 重み, is: artifact, where: {component_of: model, origin: learned}}
  layer: {ja: 層, is: artifact, where: {component_of: model, function: token_transformation}}
  attention: {ja: 注意機構, is: artifact, where: {component_of: layer, function: information_routing}}
  term_server: {ja: 用語サーバー, is: artifact, where: {function: term_resolution}}
  factor: {ja: 要因, is: quality, where: {experimental_role: varied}}
  metric: {ja: 指標, is: quality, where: {experimental_role: measured}}
  context_length: {ja: 文脈の長さ, is: factor, where: {bearer: context, quantity: token_count}}
  context_depth: {ja: 文脈の深さ, is: factor, where: {bearer: definition, quantity: token_count, counted_side: before}}
  distance_to_question: {ja: 設問からの距離, is: factor, where: {bearer: definition, quantity: token_count, counted_side: after}}
  preceding_definitions: {ja: 前に並ぶ定義の数, is: factor, where: {bearer: relevant_definitions, quantity: definition_count, counted_side: before}}
  following_definitions: {ja: 後ろに並ぶ定義の数, is: factor, where: {bearer: relevant_definitions, quantity: definition_count, counted_side: after}}
  prior_collision: {ja: 元の意味との衝突, is: factor, where: {bearer: redefinition, quantity: mismatch}}
  format_variation: {ja: 設問形式の違い, is: factor, where: {bearer: question_format, quantity: mismatch}}
  vector_count: {ja: 同時に入れる概念ベクトルの数, is: factor, where: {bearer: concept_vector, quantity: instance_count}}
  layer_choice: {ja: 単一層の選び方, is: factor, where: {bearer: single_layer_vector, quantity: layer_number}}
  chain_length: {ja: 連鎖の段数, is: factor, where: {bearer: inference, quantity: step_count}}
  accuracy: {ja: 正答率, is: metric, where: {bearer: verdict, quantity: proportion_correct, option_order: averaged}}
  order_robust_accuracy: {ja: 選択肢の順序に頑健な正答率, is: metric, where: {bearer: verdict, quantity: proportion_correct, option_order: both_orders}}
  recital_nll: {ja: 定義文の出しにくさ, is: metric, where: {bearer: definition_text, quantity: negative_log_likelihood}}
  training_loss: {ja: 学習の損失, is: metric, where: {bearer: teaching, quantity: loss}}
  redefinition_following: {ja: 再定義への追従, is: metric, where: {bearer: verdict, target: conflict_case, quantity: agreement_with_definition}}
  control_preservation: {ja: 衝突しない事例での判定の維持, is: metric, where: {bearer: verdict, target: control_case, quantity: agreement_with_definition}}
  redefinition_success: {ja: 再定義の成功, is: metric, where: {bearer: usage, target: redefinition, quantity: agreement_with_definition}}
  cross_usage_consistency: {ja: 使い方をまたぐ一貫性, is: metric, where: {bearer: usage, target: redefinition, quantity: co_change}}
  preceding_definition_effect: {ja: 前に並ぶ定義による追従の低下, is: metric, where: {bearer: verdict, target: conflict_case, quantity: decrease, attributed_to: preceding_definitions}}
  source_of_truth: {ja: 正本, is: role, where: {role_function: origin_of_derivation}}
  consolidation_target: {ja: 変更の固定先, is: role, where: {role_function: holder_of_stable_change}}
  prior_meaning: {ja: 元の意味, is: disposition, where: {bearer: weights, target: word}}
  inference: {ja: 推論, is: process, where: {performed_by: model}}
  concept: {ja: 概念, is: inference, where: {triggered_by: word}}
  shared_inference: {ja: 使い方が共有する推論, is: concept, where: {scope_of_use: all_usages}}
  single_pass: {ja: 一度の処理, is: inference, where: {intermediate_output: not_written}}
  scratchpad: {ja: 途中経過の書き出し, is: inference, where: {intermediate_output: written}}
  usage: {ja: 使い方, is: process, where: {performed_by: model, target: word}}
  usage_recite: {ja: 定義文の暗唱, is: usage, where: {content: definition_text}}
  usage_apply: {ja: 適用, is: usage, where: {content: case}}
  usage_define_paraphrase: {ja: 定義の言い換えの選択, is: usage, where: {content: definition, answer_mode: fmt_paraphrase_choice}}
  usage_explain: {ja: 説明, is: usage, where: {content: reason}}
  taught_usage: {ja: 教えた使い方, is: usage, where: {training_use: used}}
  untaught_usage: {ja: 教えていない使い方, is: usage, where: {training_use: not_used}}
  symbol_selection: {ja: シンボルの選定, is: process, where: {action: select, target: symbol}}
  verification: {ja: 検証, is: process, where: {action: verify, target: concept}}
  teaching: {ja: 教示, is: process, where: {action: teach, target: concept_vector}}
  teacher_recite: {ja: 定義文の暗唱を教師にする, is: teaching, where: {content: definition_text}}
  teacher_examples: {ja: 適用例を教師にする, is: teaching, where: {content: application_example}}
  teacher_both: {ja: 定義文の暗唱と適用例の両方を教師にする, is: teaching, where: {content: def_and_examples}}
  channel: {ja: 接続手段, is: process, where: {action: deliver, content: definition, target: model}}
  no_channel: {ja: 何もなし, is: channel, where: {delivered: nothing}}
  text_injection: {ja: 文章での注入, is: channel, where: {placement: context}}
  renaming: {ja: 改名, is: text_injection, where: {word_substitution: substituted}}
  opaque_renaming: {ja: 元の語が見えない改名, is: renaming, where: {visibility_of_original: hidden}}
  semi_renaming: {ja: 元の語が見える改名, is: renaming, where: {visibility_of_original: visible}}
  inline_expansion: {ja: 設問中での定義の展開, is: text_injection, where: {position_to_word: immediately_after_word}}
  concept_vector: {ja: 概念ベクトル, is: channel, where: {placement: label_token_positions}}
  single_layer_vector: {ja: 単一層の概念ベクトル, is: concept_vector, where: {layer_count: one}}
  multi_layer_vector: {ja: 複数層の概念ベクトル, is: concept_vector, where: {layer_count: many}}
  text_and_vector: {ja: 文章と概念ベクトルの併用, is: channel, where: {placement: [context, label_token_positions]}}
  delta_weights: {ja: 差分重み, is: channel, where: {placement: weights}}

relations:
  relation: {ja: 関係, gloss: 2つの実体を結ぶもの}
  # ----- 効果 -----
  effect_relation: {ja: 質を変える, is: relation, domain: any, range: quality, primitive: true}
  raises: {ja: を上げる, is: effect_relation, domain: any, range: quality,
           def: "forall x q. raises(x, q) iff value(q, with(x)) gt value(q, without(x))"}
  does_not_raise: {ja: を上げない, is: effect_relation, domain: any, range: quality,
                   def: "forall x q. does_not_raise(x, q) iff not raises(x, q)"}
  lowers: {ja: を下げる, is: effect_relation, domain: any, range: quality,
           def: "forall x q. lowers(x, q) iff value(q, with(x)) lt value(q, without(x))"}
  does_not_lower: {ja: を下げない, is: effect_relation, domain: any, range: quality,
                   def: "forall x q. does_not_lower(x, q) iff not lowers(x, q)"}
  causes: {ja: の原因である, is: effect_relation, domain: any, range: quality,
           def: "forall x q. causes(x, q) iff (exists(q) implies exists(x)) and (not exists(x) implies not exists(q))"}
  is_immune_to: {ja: の影響を受けない, is: relation, domain: any, range: any,
                 def: "forall x y. is_immune_to(x, y) iff value(accuracy, with(x) and with(y)) eq value(accuracy, with(x) and without(y))"}
  # ----- 転移 -----
  transfer_relation: {ja: 変化が及ぶ, is: relation, domain: any, range: any, primitive: true}
  transfers_to: {ja: に転移する, is: transfer_relation, domain: any, range: any,
                 def: "forall x y. transfers_to(x, y) iff forall c. changed(c, x) implies changed(c, y)"}
  does_not_transfer_to: {ja: に転移しない, is: transfer_relation, domain: any, range: any,
                         def: "forall x y. does_not_transfer_to(x, y) iff not transfers_to(x, y)"}
  coexists_with: {ja: と同居できる, is: transfer_relation, domain: usage, range: usage,
                  def: "forall x y. coexists_with(x, y) iff exists c. changed(c, x) and changed(c, y)"}
  # ----- 構造 -----
  structural_relation: {ja: 成り立ちを述べる, is: relation, domain: any, range: any, primitive: true}
  is_a_kind_of: {ja: の一種である, is: structural_relation, domain: any, range: any,
                 def: "forall x y. is_a_kind_of(x, y) iff forall i. instance_of(i, x) implies instance_of(i, y)"}
  consists_of: {ja: からなる, is: structural_relation, domain: any, range: any,
                def: "forall x y. consists_of(x, y) iff forall p. part_of(p, x) iff instance_of(p, y)"}
  is_placed_at: {ja: に置く, is: structural_relation, domain: continuant, range: generically_dependent_continuant,
                 def: "forall x y. is_placed_at(x, y) iff part_of(x, y)"}
  # ----- 設計上の割り当て -----
  design_relation: {ja: 設計として定める, is: relation, domain: any, range: any, primitive: true}
  is_measured_by: {ja: で測る, is: design_relation, domain: quality, range: quality,
                   def: "forall x y. is_measured_by(x, y) iff value(x) eq value(y)"}
  is_assigned_to: {ja: が担う, is: design_relation, domain: any, range: any,
                   def: "forall x y. is_assigned_to(x, y) iff forall i. instance_of(i, x) implies realized_by(i, y)"}
  is_limited_to: {ja: に限る, is: design_relation, domain: any, range: any,
                  def: "forall x y. is_limited_to(x, y) iff forall i. instance_of(i, x) implies instance_of(i, y) or applies_to(i, y)"}
  is_required_by: {ja: に必要である, is: design_relation, domain: process, range: artifact,
                   def: "forall x y. is_required_by(x, y) iff forall c. delivered_to(c, y) implies delivered_by(c, x)"}
  is_the_goal_of: {ja: の目標である, is: design_relation, domain: quality, range: information_entity,
                   def: "forall x y. is_the_goal_of(x, y) iff maximizes(y, x)"}
  # ----- 属性（分類の軸のもとになる関係）。すべて原始関係 -----
  attribute_relation: {ja: 性質を持つ, is: relation, domain: any, range: any, primitive: true}
  depends_on: {ja: に依存する, is: attribute_relation, domain: continuant, range: continuant, primitive: true}
  is_realized_in: {ja: の中で実現される, is: attribute_relation, domain: specifically_dependent_continuant, range: process, primitive: true}
  is_grounded_in: {ja: に由来する, is: attribute_relation, domain: realizable_entity, range: any, primitive: true}
  has_temporal_extent: {ja: 時間的な広がりを持つ, is: attribute_relation, domain: occurrent, range: occurrent, primitive: true}
  is_about: {ja: について述べる, is: attribute_relation, domain: generically_dependent_continuant, range: any, primitive: true}
  has_unit: {ja: という単位である, is: attribute_relation, domain: information_entity, range: information_entity, primitive: true}
  is_written_in: {ja: で書かれる, is: attribute_relation, domain: information_entity, range: information_entity, primitive: true}
  has_speech_act: {ja: という言語行為である, is: attribute_relation, domain: information_entity, range: process, primitive: true}
  is_located_in: {ja: の中にある, is: attribute_relation, domain: information_entity, range: information_entity, primitive: true}
  is_spoken_by: {ja: が発話する, is: attribute_relation, domain: information_entity, range: any, primitive: true}
  is_occupied_by: {ja: が占める, is: attribute_relation, domain: information_entity, range: information_entity, primitive: true}
  is_judged_against: {ja: に照らして判定される, is: attribute_relation, domain: information_entity, range: process, primitive: true}
  is_input_of: {ja: の入力である, is: attribute_relation, domain: information_entity, range: artifact, primitive: true}
  is_used_for: {ja: のために使う, is: attribute_relation, domain: information_entity, range: process, primitive: true}
  persists: {ja: 保持される, is: attribute_relation, domain: information_entity, range: occurrent, primitive: true}
  is_part_of_expression: {ja: 概念式の部分である, is: attribute_relation, domain: word, range: information_entity, primitive: true}
  has_options: {ja: 選択肢を持つ, is: attribute_relation, domain: question_format, range: information_entity, primitive: true}
  has_task: {ja: 課題を課す, is: attribute_relation, domain: item_group, range: process, primitive: true}
  has_prior_meaning: {ja: 元の意味を持つ, is: attribute_relation, domain: word, range: disposition, primitive: true}
  agrees_with_prior: {ja: 元の意味と一致する, is: attribute_relation, domain: information_entity, range: disposition, primitive: true}
  has_boundary_kind: {ja: 境界の決まり方を持つ, is: attribute_relation, domain: definition, range: quality, primitive: true}
  is_relevant_to: {ja: 設問に関係する, is: attribute_relation, domain: information_entity, range: information_entity, primitive: true}
  has_target: {ja: を対象とする, is: attribute_relation, domain: any, range: any, primitive: true}
  has_content: {ja: を内容とする, is: attribute_relation, domain: any, range: any, primitive: true}
  has_function: {ja: という働きを持つ, is: attribute_relation, domain: artifact, range: process, primitive: true}
  has_weight_state: {ja: 重みの状態を持つ, is: attribute_relation, domain: artifact, range: quality, primitive: true}
  has_parameter_count: {ja: パラメータ数を持つ, is: attribute_relation, domain: model, range: quality, primitive: true}
  has_layer_total: {ja: 層の総数を持つ, is: attribute_relation, domain: model, range: quality, primitive: true}
  has_weight_access: {ja: 重みに触れられる, is: attribute_relation, domain: model, range: artifact, primitive: true}
  is_component_of: {ja: の部品である, is: attribute_relation, domain: artifact, range: artifact, primitive: true}
  has_origin: {ja: という成り立ちを持つ, is: attribute_relation, domain: artifact, range: process, primitive: true}
  has_experimental_role: {ja: 実験での位置づけを持つ, is: attribute_relation, domain: quality, range: role, primitive: true}
  is_borne_by: {ja: が担い手である, is: attribute_relation, domain: specifically_dependent_continuant, range: any, primitive: true}
  has_quantity: {ja: という量である, is: attribute_relation, domain: quality, range: quality, primitive: true}
  is_counted_on_side: {ja: の側で数える, is: attribute_relation, domain: quality, range: information_entity, primitive: true}
  has_option_order: {ja: 選択肢の順序を扱う, is: attribute_relation, domain: quality, range: quality, primitive: true}
