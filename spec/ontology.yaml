# 概念の体系。3本のツリーからなる。
#   entities         実体のツリー。最上位は BFO の continuant（持続体）と occurrent（生起体）。
#                    原始概念はこの2つだけで、説明文（gloss）を持てるのもこの2つだけ。
#                    他のすべての実体は「上位の実体 [軸=値, ...]」という概念式（is と where）で記述する。
#   relations        関係のツリー。原子関係は from_to（向きを持つ結び付き）だけ。
#                    他のすべての関係は「上位の関係 [from=…, to=…, 軸=値, ...]」という式で記述する。
#                    from と to は両端の種類。any はすべての実体、value は分類の値、number は数。
#                    式だけで書けない合成関係に限り、述語論理の定義（def）を添える。
#   classifications  分類のツリー。軸は関係を抽象として見たもの（from）、値はその具体（values / values_from / number）。
#                    of: relation の軸は関係を分類する軸で、値は述語論理の法則（law）を持てる。law の r はその関係自身。
# 正規形（軸を整列した式）が同じ実体は同一とみなし、重複は検査で失敗する。

entities:
  continuant: {ja: 持続体, gloss: 時間を通じて同一性を保って存在するもの}
  occurrent: {ja: 生起体, gloss: 時間の中で起こり、展開するもの}
  independent_continuant: {ja: 独立持続体, is: continuant, where: {dependence: on_nothing}}
  specifically_dependent_continuant: {ja: 特定依存持続体, is: continuant, where: {dependence: on_specific_bearer}}
  generically_dependent_continuant: {ja: 汎用依存持続体, is: continuant, where: {dependence: on_any_bearer}}
  quality: {ja: 質, is: specifically_dependent_continuant, where: {realization: needs_no_process}}
  realizable_entity: {ja: 実現可能体, is: specifically_dependent_continuant, where: {realization: needs_process}}
  role: {ja: 役割, is: realizable_entity, where: {grounding: external_circumstance}}
  disposition: {ja: 傾向性, is: realizable_entity, where: {grounding: internal_makeup}}
  process: {ja: 過程, is: occurrent, where: {temporal_extent: extended}}
  information_entity: {ja: 情報, is: generically_dependent_continuant, where: {aboutness: describes}}
  word: {ja: 語, is: information_entity, where: {unit: name, language: natural}}
  common_word: {ja: 一般語, is: word, where: {prior_meaning_presence: present}}
  new_word: {ja: 新しい語, is: word, where: {prior_meaning_presence: absent}}
  modifier: {ja: 修飾, is: word, where: {expression_part: differentia}}
  genus_concept: {ja: 上位概念, is: word, where: {expression_part: genus}}
  seen_genus: {ja: 学習した上位概念, is: genus_concept, where: {training_use: used}}
  unseen_genus: {ja: 学習していない上位概念, is: genus_concept, where: {training_use: not_used}}
  code: {ja: コード, is: information_entity, where: {unit: passage, language: programming}}
  symbol: {ja: シンボル, is: information_entity, where: {unit: name, language: programming}}
  definition: {ja: 定義, is: information_entity, where: {unit: sentence, speech_act: states, content: concept}}
  redefinition: {ja: 再定義, is: definition, where: {target: common_word, agreement_with_prior: differs}}
  rule_redefinition: {ja: 規則型の再定義, is: redefinition, where: {boundary_kind: numeric_threshold_or_calendar}}
  remap_redefinition: {ja: 付け替え型の再定義, is: redefinition, where: {boundary_kind: scope_widened_or_narrowed}}
  other_definitions: {ja: 他の定義, is: definition, where: {relevance_to_question: irrelevant}}
  relevant_definitions: {ja: 関係する定義だけ, is: definition, where: {relevance_to_question: relevant}}
  ordinary_definitions: {ja: 一般の意味どおりの定義, is: other_definitions, where: {agreement_with_prior: agrees}}
  other_redefinitions: {ja: 他の再定義, is: other_definitions, where: {agreement_with_prior: differs}}
  case: {ja: 事例, is: information_entity, where: {unit: sentence, criterion: concept}}
  conflict_case: {ja: 衝突する事例, is: case, where: {agreement_with_prior: differs}}
  control_case: {ja: 衝突しない事例, is: case, where: {agreement_with_prior: agrees}}
  question: {ja: 設問, is: information_entity, where: {unit: sentence, speech_act: asks, content: case}}
  verdict: {ja: 判定, is: information_entity, where: {unit: sentence, speech_act: answers, content: case}}
  reason: {ja: 理由, is: information_entity, where: {unit: sentence, speech_act: states, content: verdict}}
  application_example: {ja: 適用例, is: information_entity, where: {unit: pair, content: [case, verdict]}}
  test: {ja: テスト, is: application_example, where: {use: verification}}
  definition_text: {ja: 定義文, is: information_entity, where: {unit: passage, content: definition}}
  examples_only: {ja: 適用例だけ, is: information_entity, where: {unit: passage, content: application_example}}
  def_and_examples: {ja: 定義文と適用例, is: information_entity, where: {unit: passage, content: [definition, application_example]}}
  filler_text: {ja: 無関係な文章, is: information_entity, where: {unit: passage, relevance_to_question: irrelevant}}
  context: {ja: 文脈, is: information_entity, where: {unit: passage, consumer: model}}
  glossary: {ja: 用語集, is: information_entity, where: {unit: list, content: definition}}
  glossary_head: {ja: 用語集の先頭, is: information_entity, where: {unit: position, location: glossary, preceding_count: 0}}
  place_system: {ja: システムプロンプト, is: information_entity, where: {unit: position, location: context, speaker: system}}
  place_adjacent: {ja: 設問の直前, is: information_entity, where: {unit: position, location: context, speaker: user, immediately_before: question}}
  label_token_positions: {ja: 語のトークン位置, is: information_entity, where: {unit: position, location: context, occupant: word}}
  question_format: {ja: 設問形式, is: information_entity, where: {unit: form, content: [question, verdict]}}
  fmt_yesno: {ja: はい・いいえの二択, is: question_format, where: {options: yes_or_no}}
  fmt_fill: {ja: 空欄補充の二択, is: question_format, where: {options: applies_or_not}}
  fmt_truth: {ja: 正誤判定の二択, is: question_format, where: {options: true_or_false}}
  fmt_free: {ja: 自由生成, is: question_format, where: {options: no_options}}
  fmt_paraphrase_choice: {ja: 言い換えの二択, is: question_format, where: {options: two_paraphrases}}
  item_group: {ja: 設問群, is: information_entity, where: {unit: set, content: question}}
  g_confusable: {ja: 一般の類義語・同音語の設問, is: item_group, where: {target: common_word, agreement_with_prior: agrees}}
  g_redef_conflict: {ja: 再定義の衝突する設問, is: item_group, where: {target: conflict_case}}
  g_redef_control: {ja: 再定義の衝突しない設問, is: item_group, where: {target: control_case}}
  g_new_word: {ja: 新しい語の設問, is: item_group, where: {target: new_word}}
  g_sibling: {ja: 分化した兄弟概念の設問, is: g_new_word, where: {task: distinguish_siblings}}
  g_replaced: {ja: 置換された用語の設問, is: g_new_word, where: {task: choose_current_term}}
  unrelated_items: {ja: 無関係な設問, is: item_group, where: {relevance_to_question: irrelevant}}
  typed_graph: {ja: 型付きグラフ, is: information_entity, where: {unit: graph, content: concept, persistence: persistent}}
  this_design: {ja: 本設計, is: information_entity, where: {unit: design, content: concept, target: model}}
  artifact: {ja: 人工物, is: generically_dependent_continuant, where: {aboutness: does_not_describe}}
  model: {ja: モデル, is: artifact, where: {function: language_modeling, weight_state: frozen}}
  model_15b: {ja: Qwen2.5-1.5B-Instruct, is: model, where: {parameter_count: 1500000000, layer_total: 28}}
  model_4b: {ja: Qwen3-4B, is: model, where: {parameter_count: 4000000000}}
  open_weight_model: {ja: 重みが公開されたモデル, is: model, where: {weight_access: open}}
  api_only_model: {ja: APIでしか使えないモデル, is: model, where: {weight_access: closed}}
  weights: {ja: 重み, is: artifact, where: {component_of: model, origin: learned}}
  layer: {ja: 層, is: artifact, where: {component_of: model, function: token_transformation}}
  attention: {ja: 注意機構, is: artifact, where: {component_of: layer, function: information_routing}}
  term_server: {ja: 用語サーバー, is: artifact, where: {function: term_resolution}}
  factor: {ja: 要因, is: quality, where: {experimental_role: varied}}
  metric: {ja: 指標, is: quality, where: {experimental_role: measured}}
  context_length: {ja: 文脈の長さ, is: factor, where: {bearer: context, quantity: token_count}}
  context_depth: {ja: 文脈の深さ, is: factor, where: {bearer: definition, quantity: token_count, counted_side: before}}
  distance_to_question: {ja: 設問からの距離, is: factor, where: {bearer: definition, quantity: token_count, counted_side: after}}
  preceding_definitions: {ja: 前に並ぶ定義の数, is: factor, where: {bearer: relevant_definitions, quantity: definition_count, counted_side: before}}
  following_definitions: {ja: 後ろに並ぶ定義の数, is: factor, where: {bearer: relevant_definitions, quantity: definition_count, counted_side: after}}
  prior_collision: {ja: 元の意味との衝突, is: factor, where: {bearer: redefinition, quantity: mismatch}}
  format_variation: {ja: 設問形式の違い, is: factor, where: {bearer: question_format, quantity: mismatch}}
  vector_count: {ja: 同時に入れる概念ベクトルの数, is: factor, where: {bearer: concept_vector, quantity: instance_count}}
  layer_choice: {ja: 単一層の選び方, is: factor, where: {bearer: single_layer_vector, quantity: layer_number}}
  chain_length: {ja: 連鎖の段数, is: factor, where: {bearer: inference, quantity: step_count}}
  accuracy: {ja: 正答率, is: metric, where: {bearer: verdict, quantity: proportion_correct, option_order: averaged}}
  order_robust_accuracy: {ja: 選択肢の順序に頑健な正答率, is: metric, where: {bearer: verdict, quantity: proportion_correct, option_order: both_orders}}
  recital_nll: {ja: 定義文の出しにくさ, is: metric, where: {bearer: definition_text, quantity: negative_log_likelihood}}
  training_loss: {ja: 学習の損失, is: metric, where: {bearer: teaching, quantity: loss}}
  redefinition_following: {ja: 再定義への追従, is: metric, where: {bearer: verdict, target: conflict_case, quantity: agreement_with_definition}}
  control_preservation: {ja: 衝突しない事例での判定の維持, is: metric, where: {bearer: verdict, target: control_case, quantity: agreement_with_definition}}
  redefinition_success: {ja: 再定義の成功, is: metric, where: {bearer: usage, target: redefinition, quantity: agreement_with_definition}}
  cross_usage_consistency: {ja: 使い方をまたぐ一貫性, is: metric, where: {bearer: usage, target: redefinition, quantity: co_change}}
  preceding_definition_effect: {ja: 前に並ぶ定義による追従の低下, is: metric, where: {bearer: verdict, target: conflict_case, quantity: decrease, attribution: preceding_definitions}}
  source_of_truth: {ja: 正本, is: role, where: {role_function: origin_of_derivation}}
  consolidation_target: {ja: 変更の固定先, is: role, where: {role_function: holder_of_stable_change}}
  prior_meaning: {ja: 元の意味, is: disposition, where: {bearer: weights, target: word}}
  inference: {ja: 推論, is: process, where: {performer: model}}
  concept: {ja: 概念, is: inference, where: {trigger: word}}
  shared_inference: {ja: 使い方が共有する推論, is: concept, where: {scope_of_use: all_usages}}
  single_pass: {ja: 一度の処理, is: inference, where: {intermediate_output: not_written}}
  scratchpad: {ja: 途中経過の書き出し, is: inference, where: {intermediate_output: written}}
  usage: {ja: 使い方, is: process, where: {performer: model, target: word}}
  usage_recite: {ja: 定義文の暗唱, is: usage, where: {content: definition_text}}
  usage_apply: {ja: 適用, is: usage, where: {content: case}}
  usage_define_paraphrase: {ja: 定義の言い換えの選択, is: usage, where: {content: definition, answer_mode: fmt_paraphrase_choice}}
  usage_explain: {ja: 説明, is: usage, where: {content: reason}}
  taught_usage: {ja: 教えた使い方, is: usage, where: {training_use: used}}
  untaught_usage: {ja: 教えていない使い方, is: usage, where: {training_use: not_used}}
  symbol_selection: {ja: シンボルの選定, is: process, where: {action: select, target: symbol}}
  verification: {ja: 検証, is: process, where: {action: verify, target: concept}}
  teaching_act: {ja: 教えること, is: process, where: {action: teach}}
  teaching: {ja: 教示, is: teaching_act, where: {target: concept_vector}}
  teacher_recite: {ja: 定義文の暗唱を教師にする, is: teaching, where: {content: definition_text}}
  teacher_examples: {ja: 適用例を教師にする, is: teaching, where: {content: application_example}}
  teacher_both: {ja: 定義文の暗唱と適用例の両方を教師にする, is: teaching, where: {content: def_and_examples}}
  delivering: {ja: 届けること, is: process, where: {action: deliver}}
  channel: {ja: 接続手段, is: delivering, where: {content: definition, target: model}}
  no_channel: {ja: 何もなし, is: channel, where: {delivered: nothing}}
  text_injection: {ja: 文章での注入, is: channel, where: {placement: context}}
  renaming: {ja: 改名, is: text_injection, where: {word_substitution: substituted}}
  opaque_renaming: {ja: 元の語が見えない改名, is: renaming, where: {visibility_of_original: hidden}}
  semi_renaming: {ja: 元の語が見える改名, is: renaming, where: {visibility_of_original: visible}}
  inline_expansion: {ja: 設問中での定義の展開, is: text_injection, where: {position_to_word: immediately_after_word}}
  concept_vector: {ja: 概念ベクトル, is: channel, where: {placement: label_token_positions}}
  single_layer_vector: {ja: 単一層の概念ベクトル, is: concept_vector, where: {layer_count: one}}
  multi_layer_vector: {ja: 複数層の概念ベクトル, is: concept_vector, where: {layer_count: many}}
  text_and_vector: {ja: 文章と概念ベクトルの併用, is: channel, where: {placement: [context, label_token_positions]}}
  delta_weights: {ja: 差分重み, is: channel, where: {placement: weights}}
  referring: {ja: 言及, is: process, where: {action: refer}}
  relating: {ja: 関係づけ, is: process, where: {action: relate}}
  matching: {ja: 照合, is: process, where: {action: match}}
  judging: {ja: 判定すること, is: process, where: {action: judge}}
  exposing: {ja: 公開, is: process, where: {action: expose}}
  attributing: {ja: 帰属, is: process, where: {action: attribute}}
  substituting: {ja: 置き換え, is: process, where: {action: substitute}}
  triggering: {ja: 引き起こし, is: process, where: {action: trigger}}
  reading: {ja: 読み取り, is: process, where: {action: read}}

relations:
  relation: {ja: 関係, gloss: 2つの要素を結ぶもの}
  from_to: {ja: 結ぶ, is: relation, primitive: true, from: any, to: any}
  # ===== 基本要素どうしの4つのマス =====
  continuant_to_continuant: {ja: 持続体から持続体へ結ぶ, is: from_to, from: continuant, to: continuant}
  continuant_to_occurrent: {ja: 持続体から生起体へ結ぶ, is: from_to, from: continuant, to: occurrent}
  occurrent_to_continuant: {ja: 生起体から持続体へ結ぶ, is: from_to, from: occurrent, to: continuant}
  occurrent_to_occurrent: {ja: 生起体から生起体へ結ぶ, is: from_to, from: occurrent, to: occurrent}
  # ----- 持続体 → 持続体 -----
  depends_on: {ja: に依存する, is: continuant_to_continuant, where: {existence: target_required}}
  inheres_in: {ja: に宿る, is: depends_on, where: {specificity: specific_target}}
  carried_by: {ja: に担われる, is: depends_on, where: {specificity: any_target}}
  part_of: {ja: の部分である, is: continuant_to_continuant, where: {transitivity: transitive, symmetry: antisymmetric}}
  located_in: {ja: の中にある, is: part_of, from: information_entity, to: information_entity}
  occupied_by: {ja: が占める, is: continuant_to_continuant, from: information_entity, to: information_entity, where: {inverse_of: located_in}}
  placed_before: {ja: より前に置かれる, is: continuant_to_continuant, where: {transitivity: transitive, symmetry: asymmetric},
                  def: "forall x y. placed_before(x, y) iff exists p q. instance_of(p, reading) and instance_of(q, reading) and undergoes(x, p) and undergoes(y, q) and precedes(p, q)"}
  placed_after: {ja: より後ろに置かれる, is: continuant_to_continuant, where: {inverse_of: placed_before}}
  # ----- 持続体 → 生起体 -----
  participates_in: {ja: に関与する, is: continuant_to_occurrent, where: {existence: target_required}}
  acts_in: {ja: を行う, is: participates_in, where: {participation: acting}}
  undergoes: {ja: を受ける, is: participates_in, where: {participation: undergoing}}
  input_of: {ja: の入力である, is: participates_in, where: {participation: supplied}}
  output_of: {ja: の出力である, is: participates_in, where: {participation: produced}}
  used_for: {ja: のために使う, is: participates_in, where: {participation: instrumental}}
  receives: {ja: の届け先になる, is: participates_in, where: {participation: receiving}}
  hosts: {ja: の場になる, is: participates_in, where: {participation: hosting}}
  shapes: {ja: に形式を与える, is: participates_in, where: {participation: shaping}}
  realized_in: {ja: の中で実現される, is: participates_in, from: specifically_dependent_continuant}
  # ----- 生起体 → 持続体 -----
  has_participant: {ja: に関与される, is: occurrent_to_continuant, where: {inverse_of: participates_in}}
  performed_by: {ja: が行う, is: occurrent_to_continuant, where: {inverse_of: acts_in}}
  delivers: {ja: を届ける, is: occurrent_to_continuant, from: delivering, where: {inverse_of: undergoes}}
  delivers_into: {ja: に届ける, is: occurrent_to_continuant, from: delivering, where: {inverse_of: receives}}
  acts_at: {ja: で働く, is: occurrent_to_continuant, where: {inverse_of: hosts}}
  answers_in: {ja: の形式で答える, is: occurrent_to_continuant, where: {inverse_of: shapes}}
  # ----- 生起体 → 生起体 -----
  precedes: {ja: の前に起こる, is: occurrent_to_occurrent, where: {transitivity: transitive, symmetry: asymmetric}}
  follows: {ja: の後に起こる, is: occurrent_to_occurrent, where: {inverse_of: precedes}}
  stage_of: {ja: の時間的な部分である, is: occurrent_to_occurrent, where: {transitivity: transitive, symmetry: antisymmetric}}
  taught_by: {ja: によって教えられる, is: follows, from: channel, to: teaching}
  installed_with: {ja: と同時に有効にする, is: occurrent_to_occurrent, from: channel, to: channel, where: {symmetry: symmetric}}
  # ===== 両端の種類を問わない関係 =====
  involved_in: {ja: に含まれて関わる, is: from_to, from: any, to: occurrent,
                def: "forall x p. involved_in(x, p) iff participates_in(x, p) or stage_of(x, p)"}
  triggered_by: {ja: をきっかけに走る, is: from_to, from: occurrent, to: any, where: {via: triggering}}
  # ----- 生起体を介する関係（動詞の圧縮） -----
  is_about: {ja: について述べる, is: from_to, from: generically_dependent_continuant, to: any, where: {via: referring}}
  relevant_to: {ja: に関係する, is: from_to, from: information_entity, to: information_entity, where: {via: relating}}
  agrees_with: {ja: と一致する, is: from_to, from: information_entity, to: any, where: {via: matching}}
  judged_against: {ja: に照らして判定される, is: from_to, from: information_entity, to: process, where: {via: judging}}
  exposes: {ja: を外から触れられるようにする, is: from_to, from: artifact, to: artifact, where: {via: exposing}}
  attributed_to: {ja: に帰する, is: from_to, from: quality, to: quality, where: {via: attributing}}
  substitutes: {ja: を置き換える, is: from_to, from: channel, to: word, where: {via: substituting}}
  # ----- 値を取る関係（分類の値へ結ぶ） -----
  takes: {ja: という値を取る, is: from_to, from: any, to: value}
  has_count: {ja: という個数である, is: from_to, from: any, to: number}
  has_unit: {ja: という単位である, is: takes, from: information_entity, where: {value_space: unit}}
  written_in: {ja: で書かれる, is: takes, from: information_entity, where: {value_space: language}}
  has_force: {ja: という言語行為である, is: takes, from: information_entity, where: {value_space: speech_act}}
  spoken_by: {ja: が発話する, is: takes, from: information_entity, where: {value_space: speaker}}
  persists: {ja: 保持される, is: takes, from: information_entity, where: {value_space: persistence}}
  bounded_by: {ja: によって境界が決まる, is: takes, from: definition, where: {value_space: boundary_kind}}
  has_options: {ja: 選択肢を持つ, is: takes, from: question_format, where: {value_space: options}}
  has_task: {ja: 課題を課す, is: takes, from: item_group, where: {value_space: task}}
  has_function: {ja: という働きを持つ, is: takes, from: artifact, where: {value_space: function}}
  has_origin: {ja: という成り立ちを持つ, is: takes, from: artifact, where: {value_space: origin}}
  has_state: {ja: という状態にある, is: takes, from: artifact, where: {value_space: weight_state}}
  has_quantity: {ja: という量である, is: takes, from: quality, where: {value_space: quantity}}
  has_method: {ja: という方法で測る, is: takes, from: quality, where: {value_space: option_order}}
  grounded_in: {ja: に由来する, is: takes, from: realizable_entity, where: {value_space: grounding}}
  extends_over: {ja: にわたって続く, is: takes, from: occurrent, where: {value_space: temporal_extent}}
  has_action: {ja: という行為である, is: takes, from: process, where: {value_space: action}}
  # ===== 合成関係。式だけでは書けないので、述語論理の定義を添える =====
  has_target: {ja: を対象とする, is: from_to, from: any, to: any,
               def: "forall x y. has_target(x, y) iff is_about(x, y) or undergoes(y, x) or inheres_in(x, y)"}
  has_content: {ja: を内容とする, is: from_to, from: any, to: any,
                def: "forall x y. has_content(x, y) iff is_about(x, y) or part_of(y, x) or involved_in(y, x)"}
  has_prior_meaning: {ja: 元の意味を持つ, is: from_to, from: word, to: disposition,
                      def: "forall w d. has_prior_meaning(w, d) iff instance_of(d, prior_meaning) and has_target(d, w)"}
  agrees_with_prior: {ja: 元の意味と一致する, is: from_to, from: information_entity, to: disposition,
                      def: "forall i d. agrees_with_prior(i, d) iff instance_of(d, prior_meaning) and agrees_with(i, d)"}
  has_weight_state: {ja: 重みの状態を持つ, is: from_to, from: artifact, to: value,
                     def: "forall a q. has_weight_state(a, q) iff exists w. instance_of(w, weights) and part_of(w, a) and has_state(w, q)"}
  has_parameter_count: {ja: パラメータ数を持つ, is: from_to, from: model, to: number,
                        def: "forall m n. has_parameter_count(m, n) iff exists w. instance_of(w, weights) and part_of(w, m) and has_count(w, n)"}
  has_layer_total: {ja: 層の総数を持つ, is: from_to, from: model, to: number,
                    def: "forall m n. has_layer_total(m, n) iff exists l. instance_of(l, layer) and part_of(l, m) and has_count(l, n)"}
  has_weight_access: {ja: 重みに触れられる, is: from_to, from: model, to: artifact,
                      def: "forall m w. has_weight_access(m, w) iff instance_of(w, weights) and part_of(w, m) and exposes(m, w)"}
  has_experimental_role: {ja: 実験での位置づけを持つ, is: from_to, from: quality, to: role,
                          def: "forall q r. has_experimental_role(q, r) iff instance_of(r, role) and inheres_in(r, q)"}
  has_intermediate_output: {ja: 途中の出力を持つ, is: from_to, from: process, to: information_entity,
                            def: "forall p i. has_intermediate_output(p, i) iff output_of(i, p) and exists v. instance_of(v, verdict) and output_of(v, p) and placed_before(i, v)"}
  is_used_in_training: {ja: 学習に使われる, is: from_to, from: any, to: teaching,
                        def: "forall x t. is_used_in_training(x, t) iff instance_of(t, teaching) and involved_in(x, t)"}
  shows_original_word: {ja: 元の語を見せる, is: from_to, from: renaming, to: word,
                        def: "forall r w. shows_original_word(r, w) iff substitutes(r, w) and exists n. delivers(r, n) and part_of(w, n)"}
  # ----- 仮説と決定で使う関係 -----
  raises: {ja: を上げる, is: from_to, from: any, to: quality,
           def: "forall x q. raises(x, q) iff value(q, with(x)) gt value(q, without(x))"}
  does_not_raise: {ja: を上げない, is: from_to, from: any, to: quality,
                   def: "forall x q. does_not_raise(x, q) iff not raises(x, q)"}
  lowers: {ja: を下げる, is: from_to, from: any, to: quality,
           def: "forall x q. lowers(x, q) iff value(q, with(x)) lt value(q, without(x))"}
  does_not_lower: {ja: を下げない, is: from_to, from: any, to: quality,
                   def: "forall x q. does_not_lower(x, q) iff not lowers(x, q)"}
  causes: {ja: の原因である, is: from_to, from: any, to: quality,
           def: "forall x q. causes(x, q) iff (exists(q) implies exists(x)) and (not exists(x) implies not exists(q))"}
  is_immune_to: {ja: の影響を受けない, is: from_to, from: any, to: any,
                 def: "forall x y. is_immune_to(x, y) iff value(accuracy, with(x) and with(y)) eq value(accuracy, with(x) and without(y))"}
  transfers_to: {ja: に転移する, is: from_to, from: any, to: any,
                 def: "forall x y. transfers_to(x, y) iff forall c. changed(c, x) implies changed(c, y)"}
  does_not_transfer_to: {ja: に転移しない, is: from_to, from: any, to: any,
                         def: "forall x y. does_not_transfer_to(x, y) iff not transfers_to(x, y)"}
  coexists_with: {ja: と同居できる, is: from_to, from: usage, to: usage,
                  def: "forall x y. coexists_with(x, y) iff exists c. changed(c, x) and changed(c, y)"}
  is_a_kind_of: {ja: の一種である, is: from_to, from: any, to: any,
                 def: "forall x y. is_a_kind_of(x, y) iff forall i. instance_of(i, x) implies instance_of(i, y)"}
  consists_of: {ja: からなる, is: from_to, from: any, to: any,
                def: "forall x y. consists_of(x, y) iff forall p. part_of(p, x) iff instance_of(p, y)"}
  is_placed_at: {ja: に置く, is: from_to, from: continuant, to: generically_dependent_continuant,
                 def: "forall x y. is_placed_at(x, y) iff part_of(x, y) or carried_by(x, y)"}
  is_measured_by: {ja: で測る, is: from_to, from: quality, to: quality,
                   def: "forall x y. is_measured_by(x, y) iff value(x) eq value(y)"}
  is_assigned_to: {ja: が担う, is: from_to, from: any, to: any,
                   def: "forall x y. is_assigned_to(x, y) iff forall i. instance_of(i, x) implies realized_by(i, y)"}
  is_limited_to: {ja: に限る, is: from_to, from: any, to: any,
                  def: "forall x y. is_limited_to(x, y) iff forall i. instance_of(i, x) implies instance_of(i, y) or applies_to(i, y)"}
  is_required_by: {ja: に必要である, is: from_to, from: process, to: artifact,
                   def: "forall x y. is_required_by(x, y) iff forall c. delivered_to(c, y) implies delivers(x, c)"}
  is_the_goal_of: {ja: の目標である, is: from_to, from: quality, to: information_entity,
                   def: "forall x y. is_the_goal_of(x, y) iff maximizes(y, x)"}

classifications:
  classification: {ja: 分類, gloss: 軸と値によって実体を分けるもの}
  # ===== 値を列挙する軸 =====
  # ----- BFO の区別 -----
  dependence: {ja: 依存のしかた, is: classification, from: depends_on,
               values: {on_nothing: {ja: 何にも依存しない}, on_specific_bearer: {ja: 特定の担い手に依存する}, on_any_bearer: {ja: 担い手を替えても同一である}}}
  realization: {ja: 実現のしかた, is: classification, from: realized_in,
                values: {needs_no_process: {ja: 過程がなくても現に成り立つ}, needs_process: {ja: 過程の中で実現される}}}
  grounding: {ja: 由来, is: classification, from: grounded_in,
              values: {external_circumstance: {ja: 外の状況から与えられる}, internal_makeup: {ja: 担い手の成り立ちに由来する}}}
  temporal_extent: {ja: 時間的な広がり, is: classification, from: extends_over,
                    values: {extended: {ja: 時間的な部分を持つ}}}
  aboutness: {ja: 記述性, is: classification, from: is_about,
              values: {describes: {ja: 何かについて述べる}, does_not_describe: {ja: 何についても述べない}}}
  # ----- 情報 -----
  unit: {ja: 単位, is: classification, from: has_unit,
         values: {name: {ja: 名前}, sentence: {ja: 文}, passage: {ja: 文章}, pair: {ja: 組}, list: {ja: 一覧}, set: {ja: 集まり},
                  position: {ja: 位置}, form: {ja: 形式}, graph: {ja: グラフ}, design: {ja: 設計}}}
  language: {ja: 言語, is: classification, from: written_in,
             values: {natural: {ja: 自然言語}, programming: {ja: プログラミング言語}}}
  speech_act: {ja: 言語行為, is: classification, from: has_force,
               values: {states: {ja: 述べる}, asks: {ja: 問う}, answers: {ja: 答える}}}
  speaker: {ja: 発話者, is: classification, from: spoken_by,
            values: {system: {ja: システム}, user: {ja: 利用者}}}
  persistence: {ja: 保持, is: classification, from: persists,
                values: {persistent: {ja: 永続する}}}
  expression_part: {ja: 概念式での位置, is: classification, from: part_of,
                    values: {genus: {ja: 類}, differentia: {ja: 種差}}}
  options: {ja: 選択肢, is: classification, from: has_options,
            values: {yes_or_no: {ja: はい・いいえ}, applies_or_not: {ja: 当たる・当たらない}, true_or_false: {ja: 正しい・誤り},
                     two_paraphrases: {ja: 定義の言い換え2つ}, no_options: {ja: 選択肢なし}}}
  task: {ja: 課題, is: classification, from: has_task,
         values: {distinguish_siblings: {ja: 兄弟概念を区別する}, choose_current_term: {ja: 現行の語を選ぶ}}}
  prior_meaning_presence: {ja: 元の意味の有無, is: classification, from: has_prior_meaning,
                           values: {present: {ja: 元の意味がある}, absent: {ja: 元の意味がない}}}
  agreement_with_prior: {ja: 元の意味との一致, is: classification, from: agrees_with_prior,
                         values: {agrees: {ja: 一致する}, differs: {ja: 食い違う}}}
  boundary_kind: {ja: 境界の決まり方, is: classification, from: bounded_by,
                  values: {numeric_threshold_or_calendar: {ja: 数値のしきい値または暦の計算で決まる}, scope_widened_or_narrowed: {ja: 対象の範囲の伸縮で決まる}}}
  relevance_to_question: {ja: 設問との関係, is: classification, from: relevant_to,
                          values: {relevant: {ja: 関係する}, irrelevant: {ja: 関係しない}}}
  # ----- 人工物 -----
  function: {ja: 働き, is: classification, from: has_function,
             values: {language_modeling: {ja: 次のトークンを予測する}, token_transformation: {ja: トークンのベクトルを書き換える},
                      information_routing: {ja: 他のトークンの位置から情報を取り込む}, term_resolution: {ja: 語を概念に解決して渡す定義を選ぶ}}}
  weight_state: {ja: 重みの状態, is: classification, from: has_weight_state,
                 values: {frozen: {ja: 固定されている}}}
  weight_access: {ja: 重みへの到達, is: classification, from: has_weight_access,
                  values: {open: {ja: 重みに触れられる状態}, closed: {ja: 重みに触れられない状態}}}
  origin: {ja: 成り立ち, is: classification, from: has_origin,
           values: {learned: {ja: 学習で得られた}}}
  # ----- 質 -----
  experimental_role: {ja: 実験での位置づけ, is: classification, from: has_experimental_role,
                      values: {varied: {ja: 動かす条件}, measured: {ja: 測る量}}}
  quantity: {ja: 量の種類, is: classification, from: has_quantity,
             values: {token_count: {ja: トークン数}, definition_count: {ja: 定義の個数}, instance_count: {ja: 本数}, step_count: {ja: 段数},
                      layer_number: {ja: 層の番号}, mismatch: {ja: 食い違いの有無}, proportion_correct: {ja: 正答の割合},
                      negative_log_likelihood: {ja: 1トークンあたりの負の対数尤度}, loss: {ja: 最後の反復での損失},
                      agreement_with_definition: {ja: 定義に沿う度合い}, co_change: {ja: 揃って変わる度合い}, decrease: {ja: 下がり幅}}}
  counted_side: {ja: 数える側, is: classification, from: placed_before,
                 values: {before: {ja: 前}, after: {ja: 後ろ}}}
  option_order: {ja: 選択肢の順序の扱い, is: classification, from: has_method,
                 values: {averaged: {ja: 順序を入れ替えた2回の平均で判定する}, both_orders: {ja: 2回とも正答した場合だけ数える}}}
  role_function: {ja: 役目, is: classification, from: realized_in,
                  values: {origin_of_derivation: {ja: 他の記述がそこから導かれる}, holder_of_stable_change: {ja: 安定した変更を保持する}}}
  # ----- 過程 -----
  scope_of_use: {ja: 使われる範囲, is: classification, from: stage_of,
                 values: {all_usages: {ja: すべての使い方が参照する}}}
  intermediate_output: {ja: 途中の出力, is: classification, from: has_intermediate_output,
                        values: {not_written: {ja: 途中を書き出さない}, written: {ja: 途中を書き出す}}}
  action: {ja: 行為, is: classification, from: has_action,
           values: {deliver: {ja: 届ける}, teach: {ja: 教える}, select: {ja: 選ぶ}, verify: {ja: 確かめる}, refer: {ja: 言及する},
                    relate: {ja: 関係づける}, match: {ja: 照合する}, judge: {ja: 判定する}, expose: {ja: 公開する},
                    attribute: {ja: 帰属させる}, substitute: {ja: 置き換える}, trigger: {ja: 引き起こす}, read: {ja: 読み取る}}}
  delivered: {ja: 届ける量, is: classification, from: delivers,
              values: {nothing: {ja: 何も届けない}}}
  word_substitution: {ja: 語の置き換え, is: classification, from: substitutes,
                      values: {substituted: {ja: 別の語に置き換える}}}
  position_to_word: {ja: 語に対する位置, is: classification, from: precedes,
                     values: {immediately_after_word: {ja: 語の直後}}}
  training_use: {ja: 学習での使用, is: classification, from: is_used_in_training,
                 values: {used: {ja: 学習に使った}, not_used: {ja: 学習に使っていない}}}
  layer_count: {ja: 加える層の数, is: classification, from: acts_at,
                values: {one: {ja: 1つの層}, many: {ja: 複数の層}}}
  visibility_of_original: {ja: 元の語の見え方, is: classification, from: shows_original_word,
                           values: {hidden: {ja: 見えない}, visible: {ja: 見える}}}
  # ===== 値が実体である軸 =====
  target: {ja: 対象, is: classification, from: has_target, values_from: any}
  content: {ja: 内容, is: classification, from: has_content, values_from: any}
  bearer: {ja: 担い手, is: classification, from: inheres_in, values_from: any}
  attribution: {ja: 帰する先, is: classification, from: attributed_to, values_from: quality}
  performer: {ja: 行い手, is: classification, from: performed_by, values_from: any}
  trigger: {ja: きっかけ, is: classification, from: triggered_by, values_from: any}
  criterion: {ja: 判定の基準, is: classification, from: judged_against, values_from: process}
  consumer: {ja: 入力先, is: classification, from: input_of, values_from: artifact}
  use: {ja: 用途, is: classification, from: used_for, values_from: process}
  location: {ja: 所在, is: classification, from: located_in, values_from: information_entity}
  occupant: {ja: 占めるもの, is: classification, from: occupied_by, values_from: information_entity}
  immediately_before: {ja: 直後に来るもの, is: classification, from: placed_before, values_from: information_entity}
  component_of: {ja: 所属先, is: classification, from: part_of, values_from: artifact}
  placement: {ja: 置き場所, is: classification, from: delivers_into, values_from: generically_dependent_continuant}
  channel_used: {ja: 使う接続手段, is: classification, from: delivers, values_from: channel}
  teacher: {ja: 教師, is: classification, from: taught_by, values_from: teaching}
  preceding_kind: {ja: 前にあるものの種類, is: classification, from: placed_after, values_from: information_entity}
  answer_mode: {ja: 答えの形式, is: classification, from: answers_in, values_from: question_format}
  # ===== 値が数である軸 =====
  parameter_count: {ja: パラメータ数, is: classification, from: has_parameter_count, number: true}
  layer_total: {ja: 層の総数, is: classification, from: has_layer_total, number: true}
  layer_index: {ja: 加える層の番号, is: classification, from: acts_at, number: true}
  installed_vectors: {ja: 同時に有効にした概念ベクトルの本数, is: classification, from: installed_with, number: true}
  preceding_count: {ja: 前に並ぶ定義の個数, is: classification, from: placed_after, number: true}
  preceding_count_max: {ja: 前に並ぶ定義の個数の上限, is: classification, from: placed_after, number: true}
  preceding_filler_tokens: {ja: 前にある無関係な文章のトークン数, is: classification, from: placed_after, number: true}
  following_filler_tokens: {ja: 後ろにある無関係な文章のトークン数, is: classification, from: placed_before, number: true}
  following_definitions_count: {ja: 後ろに並ぶ定義の個数, is: classification, from: placed_before, number: true}
  # ===== 関係を分類する軸。値は述語論理の法則を持つ。r はその関係自身 =====
  existence: {ja: 存在の要請, is: classification, of: relation, from: from_to,
              values: {target_required: {ja: 始点があれば終点もある, law: "forall x y. r(x, y) implies (exists(x) implies exists(y))"}}}
  specificity: {ja: 相手の特定, is: classification, of: relation, from: from_to,
                values: {specific_target: {ja: 相手は1つに決まる, law: "forall x y z. r(x, y) and r(x, z) implies y eq z"},
                         any_target: {ja: 相手は替わってよい, law: "forall x. exists y z. r(x, y) and r(x, z) and not y eq z"}}}
  transitivity: {ja: 推移性, is: classification, of: relation, from: from_to,
                 values: {transitive: {ja: 推移的, law: "forall x y z. r(x, y) and r(y, z) implies r(x, z)"}}}
  symmetry: {ja: 対称性, is: classification, of: relation, from: from_to,
             values: {symmetric: {ja: 対称的, law: "forall x y. r(x, y) implies r(y, x)"},
                      asymmetric: {ja: 非対称的, law: "forall x y. r(x, y) implies not r(y, x)"},
                      antisymmetric: {ja: 反対称的, law: "forall x y. r(x, y) and r(y, x) implies x eq y"}}}
  participation: {ja: 関わり方, is: classification, of: relation, from: from_to,
                  values: {acting: {ja: する側}, undergoing: {ja: される側}, supplied: {ja: 入力になる側}, produced: {ja: 出力になる側},
                           instrumental: {ja: 道具になる側}, receiving: {ja: 届け先になる側}, hosting: {ja: 場になる側}, shaping: {ja: 形式を与える側}}}
  inverse_of: {ja: 逆向きにした関係, is: classification, of: relation, from: from_to, values_from: relation,
               law: "forall x y. r(x, y) iff V(y, x)"}
  via: {ja: 介する生起体, is: classification, of: relation, from: from_to, values_from: occurrent,
        law: "forall x y. r(x, y) iff exists p. instance_of(p, V) and involved_in(x, p) and involved_in(y, p)"}
  value_space: {ja: 値を取る軸, is: classification, of: relation, from: from_to, values_from: classification,
                law: "forall x v. r(x, v) iff takes(x, v) and instance_of(v, V)"}

# 関係の定義（def）で使える語。ここにない語と、上の3本のツリーにない識別子は、検査で失敗する。
logic:
  connectives: [forall, exists, iff, implies, and, or, not, gt, lt, eq]
  primitive_predicates:
    value: 条件のもとでの、質の測定値
    with: その実体がある条件
    without: その実体がない条件
    changed: 概念 c について、その使い方での出力が変わった
    instance_of: 個体が、その種類に属する
    realized_by: 個体が、その手段によって実現される
    applies_to: 個体が、その対象に適用される
    delivered_to: 概念 c が、そのモデルに届けられる
    maximizes: 設計が、その質を最大にしようとする
