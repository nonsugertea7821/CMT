  training_use: {ja: 学習での使用, is: classification, from: is_used_in_training,
                 values: {used: {ja: 学習に使った}, not_used: {ja: 学習に使っていない}}}
  layer_count: {ja: 加える層の数, is: classification, from: acts_at_layer,
                values: {one: {ja: 1つの層}, many: {ja: 複数の層}}}
  visibility_of_original: {ja: 元の語の見え方, is: classification, from: shows_original_word,
                           values: {hidden: {ja: 見えない}, visible: {ja: 見える}}}
  # ===== 値が実体である軸 =====
  target: {ja: 対象, is: classification, from: has_target, values_from: any}
  content: {ja: 内容, is: classification, from: has_content, values_from: any}
  bearer: {ja: 担い手, is: classification, from: is_borne_by, values_from: any}
  attributed_to: {ja: 帰する先, is: classification, from: is_attributed_to, values_from: quality}
  performed_by: {ja: 行い手, is: classification, from: is_performed_by, values_from: any}
  triggered_by: {ja: きっかけ, is: classification, from: is_triggered_by, values_from: any}
  judged_against: {ja: 判定の基準, is: classification, from: is_judged_against, values_from: process}
  input_of: {ja: 入力先, is: classification, from: is_input_of, values_from: artifact}
  use: {ja: 用途, is: classification, from: is_used_for, values_from: process}
  located_in: {ja: 所在, is: classification, from: is_located_in, values_from: information_entity}
  occupied_by: {ja: 占めるもの, is: classification, from: is_occupied_by, values_from: information_entity}
