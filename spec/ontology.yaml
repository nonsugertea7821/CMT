# 概念の体系。正本。tools/check_spec.py で検査する。
# このファイル全体が体系である。体系によって制御される書き方が概念体系制御言語（CSCL、Concept System Control Language）で、概念式は、体系が持つものの一部。
# 自然言語の文は、ここから変換して得る表示で、正本ではない。変換は LLM が行ってもシステムが行ってもよい。
#
# 基礎: 持続体どうしの状態の関係 5個（法則を持つ）と、体系そのものの行為 1個（について述べる）。
#       「について述べる」は体系自身がしている行為なので、体系の中では定義しない。限定（修飾）はできる。
# ノード: すべて、持続体か生起体の下にある。説明文（gloss）を持つのは最上位の2つだけ。
# 動詞: 生起体のノードで、両端（from, to）を持つ。関係に当たる。
#       静的な動詞は holds（成り立っている状態の関係）、動的な動詞は pre / post（起こる前後の状態の関係）で書く。
#       new は、始点でも終点でもない第三のもの。new_kind はその種類。
#       動詞の下位は、端の種類を狭めて書く（extends: 動詞, from / to: 狭めた種類）。
# 形:   form: [動詞, 位置]。位置は from / to / new。その位置に来るもの全体。
# 修飾語: of: [動詞, 位置]。その位置を占めているという性質。質か実現可能体の下に置く。
# 上位: extends: 上位。1つだけ。階層を降りるたびに限定が増える（法則 monotone, specific）。
# 修飾: mod: 修飾語 | {of: [動詞, 位置], with: もう一方の端の中身, neg: 否定, quant: all | any, at: {軸: 値}}
#       1つのノードが足せる限定は1つだけ（法則 single）。並べて書くことはしない。2つ以上の限定は、階層を降りて重ねる。
#       2つの種類の両方に当たるもの（AND）は、関係を省かずに「A のうち、B に属するもの」と書く:
#       {extends: A, mod: {of: [is, from], with: B}}
#       「その動詞の、その位置を占めるもの」に限定する。
# 分類: 軸は関係を抽象として見たもの、値はその具体。値は、固定値か、関数（真偽を返す範囲の判定式）。
#   at:  修飾の中で、軸の値を置く。個数や順番。
#   val: 概念そのものが取る値（{軸: 値}）。文字列や真偽。
#   cmp: 2つのものを同じ軸の上で比べる（{axis: 軸, a: 実体, b: 実体, rel: same | differ}）。
#   axis: 質が、どの軸の値を取る大きさであるか。
# 役割: 実現可能体のうち、定義に依存するもの（担い手の質に依存するのが傾向性）。
#       個々の役割は、根拠となる定義を持つ。

base:
  exists: {display: 在る, arity: 1}
  depend: {display: 依存する, arity: 2}
  part: {display: 部分である, arity: 2}
  after: {display: 後ろにある, arity: 2}
  involve: {display: 生起体に持続体が関わる, arity: 2}
  same: {display: 同じである, arity: 2}
  refer: {display: について述べる, arity: 2, system_act: true}

# 法則（公理）と名前空間（領域）は、個体と事実で書く（このファイルの individuals と facts）。
axes:
  count: {display: 個数, source: any, value: number}   # どの関係についても「いくつと結ばれるか」を見られる
  ratio: {display: 割合, source: part, value: number}
  amount: {display: 量, source: any, value: number}   # 質の大きさ。単位は質の種類が決める
  order: {display: 順番, source: after, value: number}
  text: {display: 文字列, source: refer, value: literal}
  truth: {display: 真偽, source: refer, value: [true, false]}

nodes:
  # ===== 最上位。説明文（gloss）を持つのは、この2つだけ =====
  continuant: {display: 持続体, gloss: 時間を通じて同一性を保って存在するもの}
  occurrent: {display: 生起体, gloss: 時間の中で起こり、展開するもの}

  # ===== 動詞・静的。holds に、成り立っている状態の関係を書く =====
  v_depend: {display: 依存する, extends: occurrent, from: continuant, to: continuant, holds: [{is: depend, from: from, to: to}]}
  v_compose: {display: 部分になる, extends: occurrent, from: continuant, to: continuant, holds: [{is: part, from: from, to: to}]}
  v_collect: {display: 成員の種類にする, extends: occurrent, from: kind_collection, to: continuant, holds: [{is: refer, from: from, to: to}]}
  verb_ref: {display: 動詞を指すもの, extends: information_entity, mod: {of: [v_refer, from], with: occurrent}}   # 位置の型。この位置には動詞そのものが来る
  v_close: {display: について閉じている, extends: occurrent, from: kind_collection, to: verb_ref, holds: [{is: refer, from: from, to: to}]}
  v_sum: {display: 合成する, extends: occurrent, from: summand, to: summand, new_kind: summand,
          holds: [{is: part, from: from, to: new}, {is: part, from: to, to: new}, {is: depend, from: new, to: from}, {is: depend, from: new, to: to}]}
  v_stage: {display: 時間的な部分になる, extends: occurrent, from: occurrent, to: occurrent, holds: [{is: part, from: from, to: to}]}
  v_come_after: {display: 後ろに置かれる, extends: occurrent, from: continuant, to: continuant, holds: [{is: after, from: from, to: to}]}
  v_refer: {display: 述べる, extends: occurrent, from: continuant, to: any, holds: [{is: refer, from: from, to: to}]}
  v_agree: {display: 一致する, extends: occurrent, from: continuant, to: continuant, holds: [{is: refer, from: from, to: new}, {is: refer, from: to, to: new}]}
  v_measure: {display: 測る, extends: occurrent, from: continuant, to: any, holds: [{is: refer, from: from, to: to}, {is: depend, from: from, to: to}]}
  v_express: {display: で書かれる, extends: occurrent, from: continuant, to: continuant, holds: [{is: depend, from: from, to: to}, {is: part, from: new, to: from}, {is: part, from: new, to: to}]}
  v_involve: {display: に関わらせる, extends: occurrent, from: occurrent, to: continuant, holds: [{is: involve, from: from, to: to}]}
  v_perform: {display: 行う, extends: occurrent, from: continuant, to: occurrent, holds: [{is: involve, from: to, to: from}]}
  v_trigger: {display: 引き起こす, extends: occurrent, from: any, to: occurrent, holds: [{is: after, from: to, to: from}, {is: depend, from: to, to: from}]}

  # ===== 動詞・大きさを比べる。「後ろに置かれる」が、より大きい、に当たる =====
  v_come_before: {display: 前に置かれる, extends: occurrent, from: continuant, to: continuant, holds: [{is: after, from: to, to: from}]}
  v_not_before: {display: 前には置かれない, extends: occurrent, from: continuant, to: continuant, holds: [{is: after, from: to, to: from, neg: true}]}
  v_not_after: {display: 後ろには置かれない, extends: occurrent, from: continuant, to: continuant, holds: [{is: after, from: from, to: to, neg: true}]}
  v_level: {display: 同じ位置にある, extends: occurrent, from: continuant, to: continuant, holds: [{is: after, from: from, to: to, neg: true}, {is: after, from: to, to: from, neg: true}]}

  # ===== 動詞・動的。pre と post に、起こる前後の状態の関係を書く =====
  v_design: {display: 設計する, extends: occurrent, from: continuant, to: continuant, pre: [{is: exists, from: to, neg: true}], post: [{is: exists, from: to}]}
  v_compute: {display: 計算する, extends: occurrent, from: continuant, to: any, pre: [{is: exists, from: to, neg: true}], post: [{is: exists, from: to}]}
  v_learn: {display: 学習する, extends: occurrent, from: continuant, to: continuant, new_kind: realizable_entity,
            pre: [{is: exists, from: new, neg: true}], post: [{is: exists, from: new}, {is: depend, from: new, to: from}, {is: refer, from: new, to: to}]}
  v_freeze: {display: 固定する, extends: occurrent, from: continuant, to: continuant, new_kind: realizable_entity,
             pre: [{is: exists, from: new}, {is: depend, from: new, to: to}], post: [{is: exists, from: new, neg: true}]}
  v_vary: {display: 動かす, extends: occurrent, from: continuant, to: continuant, new_kind: quality,
           pre: [{is: depend, from: new, to: to}], post: [{is: depend, from: new, to: to, neg: true}]}

  # ===== 文の骨組み。何が（s）、どう関係し（p）、何に（o）。p は、すべての関係の上位 =====
  p: {display: 関係づける, extends: occurrent, from: any, to: any, holds: [{is: exists, from: from}, {is: exists, from: to}]}
  s: {display: 始点に来るもの, form: [p, from]}
  o: {display: 終点に来るもの, form: [p, to]}

  # ===== BFO の区別 =====
  dependent: {display: 依存するもの, form: [v_depend, from]}
  independent_continuant: {display: 独立持続体, extends: continuant, mod: {of: [v_depend, from], neg: true}}
  specifically_dependent_continuant: {display: 特定依存持続体, extends: dependent, mod: {of: [v_depend, from], at: {count: 1}}}
  generically_dependent_continuant: {display: 汎用依存持続体, extends: dependent, mod: {of: [v_depend, from], quant: any}}
  realizable_entity: {display: 実現可能体, extends: specifically_dependent_continuant, mod: {of: [v_involve, to]}}
  quality: {display: 質, extends: specifically_dependent_continuant, mod: {of: [v_involve, to], neg: true}}
  disposition: {display: 傾向性, extends: realizable_entity, mod: {of: [v_depend, from], with: quality}}
  role: {display: 役割, extends: realizable_entity, mod: {of: [v_depend, from], with: definition}}
  magnitude: {display: 大きさ, extends: quality, mod: {of: [v_come_after, from], with: quality}}
  process: {display: 過程, extends: occurrent, mod: {of: [v_stage, to]}}

  # ===== 修飾語。ある動詞の、ある位置を占めているという性質 =====
  frozen: {display: 固定されている, extends: quality, of: [v_freeze, to]}
  learned: {display: 学習で得られた, extends: quality, of: [v_learn, new]}

  # ===== 情報と言語 =====
  summand: {display: 合成できる情報, extends: information_entity, mod: {of: [v_sum, from]}}
  # ===== 種類の集まり（2階）。成員は種類。集まりの性質は、成員の種類の下位には受け継がれない
  kind_collection: {display: 種類の集まり, extends: information_entity, mod: {of: [v_collect, from]}}
  closed_set: {display: 閉集合, extends: kind_collection, mod: {of: [v_close, from]}}   # 何について閉じているかは、下位の限定で決める
  composable_set: {display: 合成について閉じた集合, extends: closed_set, mod: {of: [v_close, from], with: v_sum}}
  information_entity: {display: 情報, extends: generically_dependent_continuant, mod: {of: [v_refer, from]}}
  language: {display: 言語, extends: information_entity, mod: {of: [v_express, to]}}
  system: {display: 体系, extends: information_entity, mod: {of: [v_compose, to], with: concept_expression, at: {count: {gt: 1}}}}
  cscl: {display: 概念体系制御言語, extends: language, mod: {of: [v_depend, from], with: system}}
  definition_compose_from_system: {display: 体系の部分である定義, extends: definition, mod: {of: [v_compose, from], with: system}}
  concept_expression: {display: 概念式, extends: definition_compose_from_system, mod: {of: [v_express, from], with: cscl}}
  natural_language: {display: 自然言語, extends: language, mod: {of: [v_design, to], neg: true}}
  information_entity_compose_to_word: {display: 語を部分に持つ情報, extends: information_entity, mod: {of: [v_compose, to], with: word}}
  sentence: {display: 文, extends: information_entity_compose_to_word, mod: {of: [v_express, from], with: language}}
  passage: {display: 文章, extends: information_entity, mod: {of: [v_compose, to], with: sentence}}
  passage_express_from_natural_language: {display: 自然言語へで書かれる文章, extends: passage, mod: {of: [v_express, from], with: natural_language}}
  information_entity_express_from_natural_language: {display: 自然言語へで書かれる情報, extends: information_entity, mod: {of: [v_express, from], with: natural_language}}
  word: {display: 語, extends: information_entity_express_from_natural_language, mod: {of: [v_compose, from], with: sentence}}
  definition: {display: 定義, extends: sentence, mod: {of: [v_refer, from], with: concept}}
  information_entity_express_from_cscl: {display: 概念体系制御言語へで書かれる情報, extends: information_entity, mod: {of: [v_express, from], with: cscl}}
  identifier: {display: 識別子, extends: information_entity_express_from_cscl, mod: {of: [v_refer, from], with: concept_expression, at: {count: 1}}}
  pattern: {display: 識別子の雛形, extends: information_entity, mod: {of: [v_refer, from], with: identifier, at: {count: {gt: 1}}}}
  information_entity_refer_from_p: {display: 関係づけるへ述べる情報, extends: information_entity, mod: {of: [v_refer, from], with: p}}
  axis: {display: 軸, extends: information_entity_refer_from_p, mod: {of: [v_compose, to], with: value}}
  value: {display: 値, extends: information_entity, mod: {of: [v_compose, from], with: axis}}
  hypothesis: {display: 仮説, extends: sentence, mod: {of: [v_refer, from], with: occurrent}}

  # ===== 人工物とモデル =====
  artifact: {display: 人工物, extends: generically_dependent_continuant, mod: {of: [v_refer, from], neg: true}}
  artifact_compose_from_model: {display: モデルの部分である人工物, extends: artifact, mod: {of: [v_compose, from], with: model}}
  weights: {display: 重み, extends: artifact_compose_from_model, mod: learned}
  frozen_weights: {display: 固定された重み, extends: weights, mod: frozen}
  artifact_compute_from: {display: 計算する人工物, extends: artifact, mod: {of: [v_compute, from]}}
  model: {display: モデル, extends: artifact_compute_from, mod: {of: [v_compose, to], with: frozen_weights}}

  # ===== 過程・実験・推論 =====
  process_stage_to_v_vary: {display: 動かすを時間的な部分に持つ過程, extends: process, mod: {of: [v_stage, to], with: v_vary}}
  experiment: {display: 実験, extends: process_stage_to_v_vary, mod: {of: [v_stage, to], with: v_measure}}
  experiment_protocol: {display: 実験の取り決め, extends: definition, mod: {of: [v_refer, from], with: experiment}}
  role_depend_from_experiment_protocol: {display: 実験の取り決めへ依存する役割, extends: role, mod: {of: [v_depend, from], with: experiment_protocol}}
  inference: {display: 推論, extends: process, mod: {of: [v_perform, to], with: model}}
  concept: {display: 概念, extends: inference, mod: {of: [v_trigger, to], with: word}}

  # ===== 体系が、自分の書き方（文法）について述べるための語。文法の語は、すべてノードの識別子 =====
  scope: {display: 適用範囲, extends: role_depend_from_experiment_protocol, mod: {of: [v_depend, from], with: hypothesis}}
  expression_part: {display: 概念式の部分, extends: information_entity, mod: {of: [v_compose, from], with: concept_expression}}
  display: {display: 表示語, extends: word, mod: {of: [v_agree, from], with: identifier}}
  gloss: {display: 説明文, extends: passage_express_from_natural_language, mod: {of: [v_refer, from], with: concept}}
  kind: {display: 種類, form: [v_compose, to]}
  participant: {display: 関わるもの, form: [v_involve, to]}
  participant_p_from_not: {display: 関係づけることのない関わるもの, extends: participant, mod: {of: [p, from], neg: true}}
  third_participant: {display: 第三のもの, extends: participant_p_from_not, mod: {of: [p, to], neg: true}}
  state_relation: {display: 状態の関係, extends: occurrent, mod: {of: [v_stage, to], neg: true}}
  extends: {display: 上位の指定, extends: expression_part, mod: {of: [v_refer, from], with: kind}}
  position: {display: 位置, extends: expression_part, mod: {of: [v_refer, from], with: p}}
  form: {display: 形の指定, extends: position, mod: {of: [v_compose, from], with: mod, neg: true}}
  mod: {display: 修飾の指定, extends: expression_part, mod: {of: [v_compose, to], with: position}}
  with: {display: もう一方の端の指定, extends: expression_part, mod: {of: [v_refer, from], with: participant}}
  neg: {display: 否定の指定, extends: expression_part, val: {truth: false}}
  quant: {display: 数量化の指定, extends: expression_part, mod: {of: [v_refer, from], with: participant, at: {count: {gt: 1}}}}
  value_part: {display: 値の指定, extends: expression_part, mod: {of: [v_refer, from], with: value}}
  at: {display: 修飾の中の値の指定, extends: value_part, mod: {of: [v_compose, from], with: mod}}
  val: {display: 概念が取る値の指定, extends: value_part, mod: {of: [v_compose, from], with: mod, neg: true}}
  cmp: {display: 比較の指定, extends: expression_part, mod: {of: [v_refer, from], with: value, at: {count: 2}}}
  a: {display: 比べる一方, form: [v_level, from]}
  b: {display: 比べるもう一方, form: [v_level, to]}
  same: {display: 同じである, extends: quality, of: [v_level, from]}
  differ: {display: 違っている, extends: quality, of: [v_level, from], neg: true}
  rel: {display: 比べた結果, extends: quality, mod: {of: [v_depend, from], with: cmp}}
  from: {display: 始点の位置, extends: position, mod: {of: [v_refer, from], with: s}}
  to: {display: 終点の位置, extends: position, mod: {of: [v_refer, from], with: o}}
  new_kind: {display: 第三のものの種類の指定, extends: expression_part, mod: {of: [v_refer, from], with: third_participant}}
  holds: {display: 成り立つ状態の指定, extends: expression_part, mod: {of: [v_refer, from], with: state_relation}}
  pre: {display: 前の状態の指定, extends: holds, mod: {of: [v_come_before, from], with: post}}
  post: {display: 後の状態の指定, extends: holds, mod: {of: [v_come_after, from], with: pre}}
  arity: {display: 端の数, extends: magnitude, mod: {of: [v_measure, from], with: state_relation}}
  sentence_refer_from_state_relation: {display: 状態の関係へ述べる文, extends: sentence, mod: {of: [v_refer, from], with: state_relation}}
  laws: {display: 法則, extends: sentence_refer_from_state_relation, val: {truth: true}}
  law_rule: {display: 規則で書いた法則, extends: laws, mod: {of: [v_assume, from], with: premise}}
  law_given: {display: 意味を検査が与える法則, extends: laws, mod: {of: [v_assume, from], with: premise, neg: true}}
  premise: {display: 法則の前提, extends: sentence_refer_from_state_relation, mod: {of: [v_assume, to], with: law_rule}}
  derived: {display: 法則が導く文, extends: sentence_refer_from_state_relation, mod: {of: [v_derive, to], with: law_rule}}
  required: {display: 法則が求める文, extends: sentence_refer_from_state_relation, mod: {of: [v_require, to], with: law_rule}}
  v_assume: {display: 前提に置く, extends: v_refer, from: law_rule, to: premise}
  v_derive: {display: 導く, extends: v_refer, from: law_rule, to: derived}
  v_require: {display: 成り立つことを求める, extends: v_refer, from: law_rule, to: required}
  variable: {display: 変数, extends: expression_part, mod: {of: [v_refer, from], with: law_rule}}
  law_relation: {display: 導いた関係, extends: expression_part, mod: {of: [v_refer, to], with: derived}}
  v_govern: {display: 掛かる, extends: v_refer, from: law_given, to: information_entity}
  system_act: {display: 体系そのものの行為, extends: v_refer, from: system}
  grammar_rule: {display: 文法の規則, extends: sentence, mod: {of: [v_refer, from], with: expression_part}}
  grammar: {display: 文法の記述, extends: section, mod: {of: [v_compose, to], with: grammar_rule, at: {count: {gt: 1}}}}
  new: {display: 第三の位置, extends: position, mod: {of: [v_refer, from], with: third_participant}}
  of: {display: 位置の指定, extends: expression_part, mod: {of: [v_refer, from], with: position}}
  section: {display: 体系の節, extends: information_entity, mod: {of: [v_compose, from], with: system}}
  base: {display: 基礎の節, extends: section, mod: {of: [v_refer, from], with: state_relation}}
  axes: {display: 軸の節, extends: section, mod: {of: [v_refer, from], with: axis}}
  nodes: {display: ノードの節, extends: section, mod: {of: [v_refer, from], with: concept_expression}}
  source: {display: もとになる関係の指定, extends: holds, mod: {of: [v_compose, from], with: axes}}

  # ===== 値と関数。軸の値は、固定値か、真偽を返す範囲の判定式 =====
  function: {display: 関数, extends: value, mod: {of: [v_refer, from], with: value}}
  gt: {display: より大きいという判定, extends: function, mod: {of: [v_come_after, from]}}
  ge: {display: 以上という判定, extends: function, mod: {of: [v_not_before, from]}}
  lt: {display: より小さいという判定, extends: function, mod: {of: [v_come_before, from]}}
  le: {display: 以下という判定, extends: function, mod: {of: [v_not_after, from]}}
  number: {display: 数の値, extends: value, mod: {of: [v_refer, from], with: magnitude}}
  literal: {display: 文字の値, extends: value, mod: {of: [v_refer, from], with: word}}
  value_not_before_from: {display: 前には置かれない値, extends: value, mod: {of: [v_not_before, from]}}
  between: {display: 範囲の判定, extends: value_not_before_from, mod: {of: [v_not_after, from]}}

  # ===== 述語論理の語。「について述べる」の限定として書く。区別は法則 truth_distinct が与える =====
  logic: {display: 述語論理の語, extends: word, mod: {of: [v_refer, from], with: sentence}}
  sentence_refer_from_sentence: {display: 文へ述べる文, extends: sentence, mod: {of: [v_refer, from], with: sentence}}
  not: {display: 否定, extends: sentence_refer_from_sentence, cmp: [{axis: truth, a: not, b: sentence, rel: differ}]}
  any: {display: 存在の数量化, extends: sentence, mod: {of: [v_refer, from], with: participant, at: {count: {ge: 1}}}}
  all: {display: 全称の数量化, extends: not, mod: {of: [v_refer, from], with: any}}

  # ===== 個体と事実。個体は is で種類に1つだけ属する。事実は、1つの関係だけを述べる =====
  is: {display: 属する, extends: p, to: kind}
  individuals: {display: 個体, form: [is, from]}
  facts: {display: 個体か種類についての文（種類についての文は、その種類のすべてについて）, extends: sentence, mod: {of: [v_refer, from], with: individuals}}
  expect: {display: 期待する文, extends: facts, val: {truth: true}}

  # ===== 実行。動的な動詞は、個体の状態を書き換える規則である =====
  rewrite_rule: {display: 書き換えの規則, extends: definition, mod: {of: [v_refer, from], with: post}}
  role_depend_from_rewrite_rule: {display: 書き換えの規則へ依存する役割, extends: role, mod: {of: [v_depend, from], with: rewrite_rule}}
  run.state: {display: 状態, extends: information_entity, mod: {of: [v_compose, to], with: facts}}
  run.v_execute: {display: 実行する, extends: occurrent, from: continuant, to: run.state, new_kind: run.state,
              pre: [{is: exists, from: new, neg: true}], post: [{is: exists, from: new}, {is: after, from: new, to: to}]}
  run.executor: {display: 実行器, extends: role_depend_from_rewrite_rule, mod: {of: [run.v_execute, from]}}
  run.halted: {display: 止まった状態, extends: run.state, mod: {of: [run.v_execute, to], neg: true}}
  run.run: {display: 実行の記録, extends: information_entity, mod: {of: [v_refer, from], with: run.v_execute}}
  run.steps: {display: 歩みの並び, extends: information_entity, mod: {of: [v_refer, from], with: run.v_execute, at: {count: {ge: 1}}}}

  # ===== 実行の戦略と実行時の意味論。実行の検査（run_spec.py）は、runtime の節に書かれた選択に従う =====
  run.strategy: {display: 実行の戦略, extends: definition, mod: {of: [v_refer, from], with: run.v_execute}}
  run.runtime: {display: 実行時の意味論の節, extends: section, mod: {of: [v_refer, from], with: run.strategy}}
  run.world: {display: 書かれていない文の扱い, extends: run.strategy, mod: {of: [v_refer, from], with: facts}}
  run.closed_world: {display: 書かれていない文は成り立たない, extends: run.world, val: {truth: false}}
  run.pre_rule: {display: 前の状態の確かめ方, extends: run.strategy, mod: {of: [v_refer, from], with: pre}}
  run.post_rule: {display: 後の状態の作り方, extends: run.strategy, mod: {of: [v_refer, from], with: post}}
  run.replace: {display: 否定の文を取り除き肯定の文を加える, extends: run.post_rule, mod: {of: [v_refer, from], with: not}}
  run.law_check: {display: 法則を確かめる時点, extends: run.strategy, mod: {of: [v_refer, from], with: laws}}
  run.every_step: {display: 1歩ごとに確かめる, extends: run.law_check, mod: {of: [v_come_after, from], with: run.steps}}
  run.binding: {display: 位置への個体の割り当て方, extends: run.strategy, mod: {of: [v_refer, from], with: individuals}}
  run.distinct: {display: 位置ごとに別の個体を割り当てる, extends: run.binding, cmp: [{axis: text, a: from, b: to, rel: differ}]}
  run.choice: {display: 当てはまる動詞の選び方, extends: run.strategy, mod: {of: [v_refer, from], with: run.steps}}
  run.recorded: {display: 実行の記録が選び方を与える, extends: run.choice, mod: {of: [v_depend, from], with: run.run}}
  run.progress: {display: 当てはまるとみなす条件, extends: run.strategy, mod: {of: [v_refer, from], with: run.halted}}
  run.changes_state: {display: 前の状態が成り立ち後の状態がまだ成り立っていない, extends: run.progress, mod: {of: [v_come_before, from], with: post}}

  # ===== 名前空間。領域ごとに識別子を持ち、ほかの領域のものは「領域.名前」で参照する =====
  domain: {display: 領域, extends: information_entity, mod: {of: [v_compose, to], with: concept_expression}}
  v_use: {display: 使う, extends: v_depend, from: domain, to: domain}

# 実行時の意味論。実行器が、書き換えの規則をどう当てはめるか。語も値もノードの識別子。
# 実行の検査は、ここに書かれた選択に従う。実装のない選択が書かれていれば、エラーにする。
runtime:
  world: closed_world
  pre_rule: all
  post_rule: replace
  law_check: every_step
  binding: distinct
  choice: recorded
  progress: changes_state

# 体系が、自分の書き方（文法）について述べる。
# 文法の語は、すべてノードの識別子である。節ごとに、そこで使える語を並べる。検査は、ここに並んだ語だけを受け付ける。
grammar:
  grammar: [system, nodes, mod, cmp, base, axes, run, position, rel, function, value, logic, runtime, domain, individuals, facts, grammar]
  system: [base, axes, nodes, individuals, facts, runtime, grammar]
  nodes: [display, gloss, extends, from, to, new_kind, holds, pre, post, form, of, neg, mod, val, cmp, axis]
  mod: [of, with, neg, quant, at]
  cmp: [axis, a, b, rel]
  base: [display, arity, system_act]
  axes: [display, source, value]
  run: [individuals, facts, steps, expect, halted]   # 実行の記録（spec/runs/*.yaml）
  position: [from, to, new]
  rel: [same, differ]
  function: [gt, ge, lt, le]
  value: [number, literal]
  logic: [not, all, any, between]   # true と false は、真偽の軸の値
  runtime: [world, pre_rule, post_rule, law_check, binding, choice, progress]
  domain: [domain, nodes, individuals, facts]   # 領域のファイル（spec/exp.yaml）
  individuals: [is, display, val]
  facts: [is, from, to, new, at, neg]   # 事実は動詞の個体。位置に名前を付けて書く。holds / pre / post も同じ形

# 領域と法則の個体。
individuals:
  # ===== 領域。識別子は「領域.名前」と書く。領域を書かない識別子は core に属する。
  core: {is: domain, display: 核}
  run: {is: domain, display: 実行}
  # ===== 規則の変数。規則の中で、個体やノードの代わりに置く。
  var1: {is: variable, display: 変数1}
  var2: {is: variable, display: 変数2}
  var3: {is: variable, display: 変数3}
  var4: {is: variable, display: 変数4}
  var5: {is: variable, display: 変数5}
  # ===== 導いた関係。規則が導き、規則の前提に使う。
  r_parent: {is: law_relation, display: 上位である}
  r_ancestor: {is: law_relation, display: 祖先である}
  r_end_from: {is: law_relation, display: 始点の種類である}
  r_end_to: {is: law_relation, display: 終点の種類である}
  r_end_new_kind: {is: law_relation, display: 第三のものの種類である}
  r_kind_up: {is: law_relation, display: 種類として上である}
  r_below: {is: law_relation, display: 種類として下である}
  r_limit: {is: law_relation, display: 限定である}
  r_own: {is: law_relation, display: 自分で足した式である}
  r_acc: {is: law_relation, display: 積み上がった式である}
  r_adds: {is: law_relation, display: 上位にない式を足している}
  r_concept: {is: law_relation, display: 概念である}
  r_candidate: {is: law_relation, display: 具体的な候補である}
  r_missing: {is: law_relation, display: 候補の式が欠けている}
  r_visible: {is: law_relation, display: 参照できる}
  r_kpart: {is: law_relation, display: 種類として部分である}
  r_kdep: {is: law_relation, display: 種類として依存する}
  r_in: {is: law_relation, display: 集まりに属する}
  r_ind_kind: {is: law_relation, display: 個体の種類か、その上位である}
  r_closed_op: {is: law_relation, display: その動詞について閉じている}
  r_closed: {is: law_relation, display: 閉じている}
  r_closed_verb: {is: law_relation, display: どこかの閉集合が閉じている動詞である}
  r_ternary: {is: law_relation, display: 二つから第三のものを作る動詞である}
  r_op_of: {is: law_relation, display: 事実の動詞である（上位の動詞を含む）}
  r_in_op: {is: law_relation, display: その動詞について閉じた閉集合に属する}
  r_collected: {is: law_relation, display: 集まりが直接集めた種類である}
  r_defined: {is: law_relation, display: その動詞が定義されている}
  # ===== 規則で書いた法則。前提（v_assume）がすべて成り立つとき、導く文（v_derive）を足し、求める文（v_require）が成り立っていなければ違反。
  # 否定の前提は、書かれていない（導かれていない）ことを表す。前提にだけ出てくる変数は「どれでも」と読む。
  # 基礎の関係の法則は実行の状態に、体系の書き方の法則は、検査が体系の書き方から読んだ文に当てはめる。
  # 体系の書き方の文: exists, extends, mod, of, position, with, neg, from, to, new_kind, axis, form, holds, pre, val, cmp, display, domain, refer, value, v_use。
  part_transitive: {is: law_rule, display: 部分であることは推移的}
  after_transitive: {is: law_rule, display: 後ろにあることは推移的}
  part_antisymmetric: {is: law_rule, display: 部分であることは反対称的}
  kpart_by_mod_from: {is: law_rule, display: 「X の部分である」と限定した種類は、種類として X の部分}
  kpart_by_mod_to: {is: law_rule, display: 「X を部分に持つ」と限定した種類は、種類として X を部分に持つ}
  kpart_by_sum_part: {is: law_rule, display: 「合成して X になる」と限定した種類は、種類として X の部分（部分の定義。合成する相手は問わない）}
  kpart_by_sum_whole: {is: law_rule, display: 「X と何かを合成してできる」と限定した種類は、種類として X を部分に持つ}
  kdep_by_mod: {is: law_rule, display: 「X に依存する」と限定した種類は、種類として X に依存する}
  kdep_by_sum: {is: law_rule, display: 合成してできたものは、合成する種類に依存する（生成の順序）}
  kpart_by_sum_fact_from: {is: law_rule, display: 合成する事実の始点は、合成してできたものの部分}
  kpart_by_sum_fact_to: {is: law_rule, display: 合成する事実の終点は、合成してできたものの部分}
  kdep_by_sum_fact_from: {is: law_rule, display: 合成してできたものは、合成する事実の始点に依存する}
  kdep_by_sum_fact_to: {is: law_rule, display: 合成してできたものは、合成する事実の終点に依存する}
  kpart_by_compose_fact: {is: law_rule, display: 種類どうしの「部分になる」事実は、種類としての部分}
  kdep_by_depend_fact: {is: law_rule, display: 種類どうしの「依存する」事実は、種類としての依存}
  kdep_inherit: {is: law_rule, display: 依存する種類の下位も、同じものに依存する}
  kdep_transitive: {is: law_rule, display: 種類としての依存は推移的}
  kdep_antisymmetric: {is: law_rule, display: 種類としての依存は反対称的（互いに依存するなら同じ種類）。生成の順序は逆に回らない}
  kpart_transitive: {is: law_rule, display: 種類としての部分は推移的}
  kpart_inherit: {is: law_rule, display: 部分である種類の下位も、同じ全体の部分}
  kpart_antisymmetric: {is: law_rule, display: 種類としての部分は反対称的（互いに部分なら同じ種類）}
  after_asymmetric: {is: law_rule, display: 後ろにあることは非対称的}
  depend_end_exists: {is: law_rule, display: 依存する始点が在れば終点も在る}
  involve_end_exists: {is: law_rule, display: 関わられる始点が在れば終点も在る}
  # --- 体系の書き方
  parent_by_extends: {is: law_rule, display: extends に書いたものは上位}
  parent_by_is: {is: law_rule, display: 「属する」の始点として限定した種類は上位}
  ancestor_by_parent: {is: law_rule, display: 上位は祖先}
  ancestor_by_step: {is: law_rule, display: 上位の祖先は祖先}
  acyclic: {is: law_rule, display: 定義は自分自身を参照しない（自分の祖先にならない）}
  inherit_from_own: {is: law_rule, display: 端 from は自分に書いたもの}
  inherit_from: {is: law_rule, display: 端 from を書かなければ上位から引き継ぐ}
  inherit_to_own: {is: law_rule, display: 端 to は自分に書いたもの}
  inherit_to: {is: law_rule, display: 端 to を書かなければ上位から引き継ぐ}
  inherit_new_kind_own: {is: law_rule, display: 端 new_kind は自分に書いたもの}
  inherit_new_kind: {is: law_rule, display: 端 new_kind を書かなければ上位から引き継ぐ}
  kind_up_by_parent: {is: law_rule, display: 上位は種類として上}
  kind_up_by_form_from: {is: law_rule, display: 形（from）は、その位置の端の種類の下}
  kind_up_by_form_to: {is: law_rule, display: 形（to）は、その位置の端の種類の下}
  kind_up_by_form_new: {is: law_rule, display: 形（new）は、その位置の端の種類の下}
  kind_up_by_form_new_any: {is: law_rule, display: 第三の位置の種類が書かれていない形は any の下}
  below_self: {is: law_rule, display: 自分は自分の下}
  below_any: {is: law_rule, display: すべては any の下}
  below_by_step: {is: law_rule, display: 種類として上のものの下は下}
  narrow_from: {is: law_rule, display: 下位の動詞の端 from は、上位の動詞の端を狭める}
  narrow_to: {is: law_rule, display: 下位の動詞の端 to は、上位の動詞の端を狭める}
  limit_by_mod: {is: law_rule, display: mod は限定}
  limit_by_val: {is: law_rule, display: val は限定}
  limit_by_cmp: {is: law_rule, display: cmp は限定}
  single: {is: law_rule, display: 1つのノードが足せる限定は1つだけ}
  own_by_limit: {is: law_rule, display: r_limit は自分で足した式}
  own_by_from: {is: law_rule, display: from は自分で足した式}
  own_by_to: {is: law_rule, display: to は自分で足した式}
  own_by_new_kind: {is: law_rule, display: new_kind は自分で足した式}
  own_by_axis: {is: law_rule, display: axis は自分で足した式}
  acc_own: {is: law_rule, display: 自分で足した式は積み上がった式}
  acc_ancestor: {is: law_rule, display: 祖先が足した式は積み上がった式}
  adds: {is: law_rule, display: 上位に積み上がっていない式を自分で足している}
  concept_kind: {is: law_rule, display: 上位を持ち、修飾語・形・動詞でないものは概念}
  monotone: {is: law_rule, display: 階層を降りるたびに限定が増える}
  parents_unordered: {is: law_rule, display: 上位に並べた2つは、上下の関係にない}
  specific_candidate: {is: law_rule, display: 上位の下にあり、互いに上下でない別の概念}
  specific_missing: {is: law_rule, display: 候補の式に、自分にない式がある}
  specific: {is: law_rule, display: より具体的な概念があればその下に置く}
  unique_in_domain: {is: law_rule, display: 表示語は同じ領域の中で重複しない}
  visible_self: {is: law_rule, display: 領域は自分を参照できる}
  visible_use: {is: law_rule, display: 領域は使う領域を参照できる}
  layered: {is: law_rule, display: 参照できるのは自分の領域と使う領域だけ}
  truth_two: {is: law_rule, display: 真偽の軸は true と false を持つ}
  truth_only: {is: law_rule, display: 真偽の軸の値は true か false}
  # ===== 意味を検査や実行器が与える法則。規則の当てはめ方そのもの。
  unique_names: {is: law_given, display: 名前の違う個体は同じでない}
  step: {is: law_given, display: 前の状態が成り立つとき後の状態に置き換える}
  frame: {is: law_given, display: 動詞が触れなかった文は変わらない}
  halt: {is: law_given, display: 当てはまる動詞がなければ止まる}
  part_fact_direction: {is: law_given, display: 部分の事実は、種類の限定と向きが逆にならない}
  closed_under: {is: law_rule, display: 閉集合は、限定した動詞について閉じている。その動詞の始点が閉集合の成員（の下位）なら、終点も成員（の下位）}
  closed_under_back: {is: law_rule, display: 閉じている動詞の終点が閉集合に属するなら、始点も同じ閉集合に属する}
  closed_under_new: {is: law_rule, display: 閉じている動詞でできたものは、二つと同じ閉集合に属する}
  closed_under_some: {is: law_rule, display: どこかの閉集合が閉じている動詞の事実では、二つとも、その動詞について閉じた閉集合に属する}
  closed_under_mod: {is: law_rule, display: 閉じている動詞による限定では、限定される種類と相手の種類が同じ閉集合に属する}
  closed_under_mod_back: {is: law_rule, display: 閉じている動詞による限定の相手が閉集合に属するなら、限定される種類も属する}
  closed_under_mod_some: {is: law_rule, display: 閉じている動詞による限定では、二つとも、その動詞について閉じた閉集合に属する}
  closed_has_op: {is: law_rule, display: 閉集合は、何について閉じているかを限定している}
  closed_op_ternary: {is: law_rule, display: 閉じている動詞は、二つから第三のものを作る動詞}
  collection_level: {is: law_rule, display: 種類の集まりの成員は、1階の種類。種類の集まりそのものを成員にしない}
  op_defined: {is: law_rule, display: 閉集合に属する種類は、自分か上位の種類について、閉じている動詞（の事実か限定）が定義されている。集まりが直接集めた種類は、閉じていることで定義される}
  in_by_collect: {is: law_rule, display: 集まりが集めた種類は、その集まりに属する}
  in_inherit: {is: law_rule, display: 集まりに属する種類の下位も、その集まりに属する}
  ind_kind_self: {is: law_rule, display: 個体の種類}
  ind_kind_step: {is: law_rule, display: 個体の種類の上位}
  closed_op_by_mod: {is: law_rule, display: 閉集合が閉じている動詞は、その種類か上位の限定「V について閉じている」の V}
  closed_by_op: {is: law_rule, display: 閉じている動詞を持つ集まりは、閉じている}
  closed_verb: {is: law_rule, display: どこかの閉集合が閉じている動詞}
  ternary_verb: {is: law_rule, display: 第三のものの種類を持つ動詞}
  op_of_self: {is: law_rule, display: 事実の動詞}
  op_of_up: {is: law_rule, display: 事実の動詞の上位の動詞}
  in_op: {is: law_rule, display: 種類が、動詞 V について閉じた閉集合に属する}
  collected_kind: {is: law_rule, display: 集まりが直接集めた種類}
  defined_by_fact_from: {is: law_rule, display: 事実の始点の種類には、その動詞が定義されている}
  defined_by_fact_to: {is: law_rule, display: 事実の終点の種類には、その動詞が定義されている}
  defined_by_fact_new: {is: law_rule, display: 事実でできた種類には、その動詞が定義されている}
