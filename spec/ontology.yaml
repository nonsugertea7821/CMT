  role_function: {ja: 役目, is: classification, from: has_role_function,
                  values: {origin_of_derivation: {ja: 他の記述がそこから導かれる}, holder_of_stable_change: {ja: 安定した変更を保持する}}}
  # ----- 過程 -----
  scope_of_use: {ja: 使われる範囲, is: classification, from: has_scope_of_use,
