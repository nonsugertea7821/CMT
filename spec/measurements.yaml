# 測定値。値は experiments/results/ から計算する。手で書いた数値は持たない。文法は tools/check_spec.py の冒頭を見よ。
# meaning は、軸の値が何を表すか。ノードの識別子、または {nodes: [その条件に関わるノード], at: [{axis: 軸, of: 何の, value: 値}]}。
families:
  e1:
    file: e1_{model}.json
    at: [items]
    axes:
      model: &id001 {15b: Qwen2.5-1.5B-Instruct, 4b: Qwen3-4B}
      group: [G1, G2c, G2k, G3, G4]
      cond: [none, near, glossary, far-500, far-2000]
    where: {group: '{group}'}
    cond: '{cond}'
    stats: [acc, both]
    meaning:
      model: {15b: model_15b, 4b: model_4b}
      group: {G1: g_confusable, G2c: g_redef_conflict, G2k: g_redef_control, G3: g_sibling, G4: g_replaced}
      cond:
        none:
          nodes: [no_channel]
        near:
          nodes: [text_injection, definition_text, place_adjacent]
        glossary:
          nodes: [text_injection, glossary, place_system]
        far-500:
          nodes: [text_injection, glossary, place_system]
          at:
          - {axis: count, of: following_text, value: 500}
        far-2000:
          nodes: [text_injection, glossary, place_system]
          at:
          - {axis: count, of: following_text, value: 2000}
  e1type:
    file: e1_{model}.json
    at: [items]
    axes:
      model: *id001
      group: [G2c, G2k]
      type: &id002
        rule: ['02', '03', '06', 09, '10', '11', '13', '15', '16', '17', '21', '23']
        remap: ['01', '04', '05', '07', 08, '12', '14', '18', '19', '20', '22', '24']
      cond: [none, near]
    keyset: {axis: type, pattern: '{group}-#'}
    cond: '{cond}'
    stats: [acc]
    meaning:
      model: {15b: model_15b, 4b: model_4b}
      group: {G1: g_confusable, G2c: g_redef_conflict, G2k: g_redef_control, G3: g_sibling, G4: g_replaced}
      type: {rule: rule_redefinition, remap: remap_redefinition}
  e1b:
    file: e1b_Qwen2.5-1.5B-Instruct.json
    at: [items]
    axes:
      group: [G2c, G2k]
      cond: [examples, def+examples]
    where: {group: '{group}'}
    cond: '{cond}'
    stats: [acc, both]
    meaning:
      group: {G1: g_confusable, G2c: g_redef_conflict, G2k: g_redef_control, G3: g_sibling, G4: g_replaced}
      cond:
        examples:
          nodes: [text_injection, examples_only, place_adjacent]
        def+examples:
          nodes: [text_injection, def_and_examples, place_adjacent]
  e3:
    file: e3_Qwen2.5-1.5B-Instruct_{run}.json
    at: [items]
    axes:
      run: [L8_defonly, L8_qa, L8_defqa, L14_defqa]
      group: [G2c, G2k]
      cond: [none, vec, near, near+vec]
    where: {group: '{group}'}
    cond: '{cond}'
    stats: [acc, both]
    meaning:
      run:
        L8_defonly:
          nodes: [single_layer_vector, teacher_recite]
          at:
          - {axis: order, of: layer, value: 8}
        L8_qa:
          nodes: [single_layer_vector, teacher_examples]
          at:
          - {axis: order, of: layer, value: 8}
        L8_defqa:
          nodes: [single_layer_vector, teacher_both]
          at:
          - {axis: order, of: layer, value: 8}
        L14_defqa:
          nodes: [single_layer_vector, teacher_both]
          at:
          - {axis: order, of: layer, value: 14}
      group: {G1: g_confusable, G2c: g_redef_conflict, G2k: g_redef_control, G3: g_sibling, G4: g_replaced}
      cond:
        none:
          nodes: [no_channel]
        vec:
          nodes: [single_layer_vector]
        near:
          nodes: [text_injection, definition_text, place_adjacent]
        near+vec:
          nodes: [text_and_vector, definition_text, place_adjacent]
  e3type:
    file: e3_Qwen2.5-1.5B-Instruct_{run}.json
    at: [items]
    axes:
      run: [L8_qa, L8_defqa]
      group: [G2c, G2k]
      type: *id002
      cond: [vec]
    keyset: {axis: type, pattern: '{group}-#'}
    cond: '{cond}'
    stats: [acc]
    meaning:
      run:
        L8_defonly:
          nodes: [single_layer_vector, teacher_recite]
          at:
          - {axis: order, of: layer, value: 8}
        L8_qa:
          nodes: [single_layer_vector, teacher_examples]
          at:
          - {axis: order, of: layer, value: 8}
        L8_defqa:
          nodes: [single_layer_vector, teacher_both]
          at:
          - {axis: order, of: layer, value: 8}
        L14_defqa:
          nodes: [single_layer_vector, teacher_both]
          at:
          - {axis: order, of: layer, value: 14}
      group: {G1: g_confusable, G2c: g_redef_conflict, G2k: g_redef_control, G3: g_sibling, G4: g_replaced}
      type: {rule: rule_redefinition, remap: remap_redefinition}
      cond:
        none:
          nodes: [no_channel]
        vec:
          nodes: [single_layer_vector]
        near:
          nodes: [text_injection, definition_text, place_adjacent]
        near+vec:
          nodes: [text_and_vector, definition_text, place_adjacent]
  e3loss:
    file: e3_Qwen2.5-1.5B-Instruct_{run}.json
    at: [train]
    axes:
      run: [L8_defonly, L8_qa, L8_defqa, L14_defqa]
    cond: loss_last
    stats: [mean]
    meaning:
      run:
        L8_defonly:
          nodes: [single_layer_vector, teacher_recite]
          at:
          - {axis: order, of: layer, value: 8}
        L8_qa:
          nodes: [single_layer_vector, teacher_examples]
          at:
          - {axis: order, of: layer, value: 8}
        L8_defqa:
          nodes: [single_layer_vector, teacher_both]
          at:
          - {axis: order, of: layer, value: 8}
        L14_defqa:
          nodes: [single_layer_vector, teacher_both]
          at:
          - {axis: order, of: layer, value: 14}
  e3b:
    file: e3b_transfer.json
    axes:
      fmt: [orig, fill, truth]
      group: [G2c, G2k]
      cond: [none, text, vec, vec_all]
    where: {fmt: '{fmt}', group: '{group}'}
    cond: '{cond}'
    stats: [acc, both]
    meaning:
      fmt: {orig: fmt_yesno, fill: fmt_fill, truth: fmt_truth}
      group: {G1: g_confusable, G2c: g_redef_conflict, G2k: g_redef_control, G3: g_sibling, G4: g_replaced}
      cond:
        none:
          nodes: [no_channel]
        text:
          nodes: [text_injection, def_and_examples, place_adjacent]
        vec:
          nodes: [single_layer_vector, teacher_examples]
          at:
          - {axis: order, of: layer, value: 8}
        vec_all:
          nodes: [single_layer_vector, teacher_examples]
          at:
          - {axis: order, of: layer, value: 8}
          - {axis: count, of: concept_vector, value: 24}
  e3b_g1:
    file: e3b_transfer.json
    axes:
      cond: [none, vec_all]
    where: {group: G1}
    cond: '{cond}'
    stats: [acc, margin]
    meaning:
      cond:
        none:
          nodes: [no_channel]
        vec_all:
          nodes: [single_layer_vector]
          at:
          - {axis: count, of: concept_vector, value: 24}
  e3c:
    file: e3c_generation.json
    axes:
      group: [G2c, G2k]
      cond: [none, text, vec]
    where: {group: '{group}'}
    cond: '{cond}'
    stats: [judged]
    meaning:
      group: {G1: g_confusable, G2c: g_redef_conflict, G2k: g_redef_control, G3: g_sibling, G4: g_replaced}
      cond:
        none:
          nodes: [no_channel, fmt_free]
        text:
          nodes: [text_injection, def_and_examples, fmt_free]
        vec:
          nodes: [single_layer_vector, teacher_examples, fmt_free]
  e4:
    file: e4_modifier_composition.json
    axes:
      pair: {p1: 甲種/乙種, p2: 青/赤, p3: 一類/二類}
      split: [train, test]
      cond: [none, text, vec]
    where: {pair: '{pair}', split: '{split}'}
    cond: '{cond}'
    stats: [acc]
    meaning:
      split: {train: seen_genus, test: unseen_genus}
      cond:
        none:
          nodes: [no_channel]
        text:
          nodes: [text_injection, definition_text]
        vec:
          nodes: [single_layer_vector, modifier]
  e5:
    file: e5_{model}.json
    axes:
      model: *id001
      group: [G2c, G2k]
      cond: [near, rename_semi, rename_opaque, inline, near+inline]
    where: {group: '{group}'}
    cond: '{cond}'
    stats: [acc]
    meaning:
      model: {15b: model_15b, 4b: model_4b}
      group: {G1: g_confusable, G2c: g_redef_conflict, G2k: g_redef_control, G3: g_sibling, G4: g_replaced}
      cond:
        near:
          nodes: [text_injection, definition_text, place_adjacent]
        rename_semi:
          nodes: [text_injection, semi_renaming, place_adjacent]
        rename_opaque:
          nodes: [text_injection, opaque_renaming, place_adjacent]
        inline:
          nodes: [text_injection, inline_expansion]
        near+inline:
          nodes: [text_injection, definition_text, inline_expansion, place_adjacent]
  e6_L8:
    file: e6_cross_use_L8.json
    at: ['{vec}']
    axes:
      vec: {none: none, defonly: results/e3_Qwen2.5-1.5B-Instruct_L8_defonly.pt, qa: results/e3_Qwen2.5-1.5B-Instruct_L8_qa.pt}
    cond: define_choice
    stats: [acc, margin]
    meaning:
      vec:
        none:
          nodes: [no_channel]
        defonly:
          nodes: [teacher_recite]
        qa:
          nodes: [teacher_examples]
  e6_L8_nll:
    file: e6_cross_use_L8.json
    at: ['{vec}']
    axes:
      vec: {none: none, defonly: results/e3_Qwen2.5-1.5B-Instruct_L8_defonly.pt, qa: results/e3_Qwen2.5-1.5B-Instruct_L8_qa.pt}
    cond: define_nll
    stats: [mean]
  e6_defqa:
    file: e6_cross_use_defqa_{layer}.json
    at: ['results/e3_Qwen2.5-1.5B-Instruct_{layer}_defqa.pt']
    axes:
      layer: [L8, L14]
    cond: define_choice
    stats: [acc, margin]
    meaning:
      layer:
        L8:
          nodes: [teacher_both]
          at:
          - {axis: order, of: layer, value: 8}
        L14:
          nodes: [teacher_both]
          at:
          - {axis: order, of: layer, value: 14}
  e6_defqa_nll:
    file: e6_cross_use_defqa_{layer}.json
    at: ['results/e3_Qwen2.5-1.5B-Instruct_{layer}_defqa.pt']
    axes:
      layer: [L8, L14]
    cond: define_nll
    stats: [mean]
  e7:
    file: e7_Qwen3-4B.json
    axes:
      group:
        redef: [G2c]
        new: [G3, G4]
      cond: [sys1, sys1-far500, sys1-far2000, gl5, gl15, gl55-first, gl55-last]
    where: {group: '{group}'}
    cond: '{cond}'
    stats: [acc]
    meaning:
      group: {redef: g_redef_conflict, new: g_new_word}
      cond:
        sys1:
          nodes: [relevant_definitions, place_system]
        sys1-far500:
          nodes: [relevant_definitions, place_system]
          at:
          - {axis: count, of: following_text, value: 500}
        sys1-far2000:
          nodes: [relevant_definitions, place_system]
          at:
          - {axis: count, of: following_text, value: 2000}
        gl5:
          nodes: [glossary, other_definitions]
          at:
          - axis: count
            of: preceding_definitions_set
            value: {le: 4}
        gl15:
          nodes: [glossary, other_definitions]
          at:
          - axis: count
            of: preceding_definitions_set
            value: {le: 14}
        gl55-first:
          nodes: [glossary, glossary_head]
          at:
          - {axis: count, of: following_definitions_set, value: 54}
        gl55-last:
          nodes: [glossary, other_definitions]
          at:
          - {axis: count, of: preceding_definitions_set, value: 54}
  e7b:
    file: e7_Qwen3-4B.json
    axes:
      cond: [fill500-def, fill2000-def, gl55-pos14, gl55-pos27, gl55-pos41, pre-ordinary19, pre-redef23]
    where: {group: G2c}
    cond: '{cond}'
    stats: [acc]
    meaning:
      cond:
        fill500-def:
          nodes: [filler_text]
          at:
          - {axis: count, of: preceding_text, value: 500}
        fill2000-def:
          nodes: [filler_text]
          at:
          - {axis: count, of: preceding_text, value: 2000}
        gl55-pos14:
          nodes: [other_definitions]
          at:
          - {axis: count, of: preceding_definitions_set, value: 14}
        gl55-pos27:
          nodes: [other_definitions]
          at:
          - {axis: count, of: preceding_definitions_set, value: 27}
        gl55-pos41:
          nodes: [other_definitions]
          at:
          - {axis: count, of: preceding_definitions_set, value: 41}
        pre-ordinary19:
          nodes: [ordinary_definitions]
          at:
          - {axis: count, of: preceding_definitions_set, value: 19}
        pre-redef23:
          nodes: [other_redefinitions]
          at:
          - {axis: count, of: preceding_definitions_set, value: 23}
  e8:
    file: e8_L2-13_d0.001.json
    at: [apply]
    axes: {group: [G2c, G2k], cond: [none, vec]}
    where: {group: '{group}'}
    cond: '{cond}'
    stats: [acc, both]
    meaning:
      group: {G2c: g_redef_conflict, G2k: g_redef_control}
      cond:
        none: {nodes: [no_channel]}
        vec: {nodes: [multi_layer_vector, teacher_both], at: [{axis: order, of: layer, value: {between: [2, 13]}}]}
  e8def:
    file: e8_L2-13_d0.001.json
    at: [define]
    axes: {cond: [none, vec]}
    cond: '{cond}'
    stats: [acc, both, margin]
    meaning:
      cond:
        none: {nodes: [no_channel, usage_define_paraphrase]}
        vec: {nodes: [multi_layer_vector, teacher_both, usage_define_paraphrase]}
  e8nll:
    file: e8_L2-13_d0.001.json
    at: [define]
    axes: {cond: [nll]}
    cond: '{cond}'
    stats: [mean]
    meaning:
      cond: {nll: {nodes: [multi_layer_vector, teacher_both, usage_recite]}}
  e8loss:
    file: e8_L2-13_d0.001.json
    at: [train]
    axes: {cond: [loss_last]}
    cond: '{cond}'
    stats: [mean]
    meaning:
      cond: {loss_last: {nodes: [multi_layer_vector, teaching]}}
