name: conflict-notice

# main への push のたびに、開いている PR が main と衝突していないかを調べ、衝突していればコメントで知らせる。
# PR を見張るセッションに、衝突は届かないが、コメントは届く。中身は .github/scripts/conflict_notice.py。
# GitHub が push の直後に衝突の有無を計算し終えなかった PR は、30 分ごとの見直しで拾う。
# 同じ head と同じ main について知らせたものは書き足さないので、見直しが同じコメントを重ねることはない。
on:
  push:
    branches: [main]
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: conflict-notice
  cancel-in-progress: true

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/conflict_notice.py ${{ github.sha }}
