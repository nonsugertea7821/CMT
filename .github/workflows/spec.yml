name: spec

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: 型検査
        run: python cscl/bootstrap/type_checker/type_checker.py
      - name: 実行の記録の検査
        run: python cscl/bootstrap/runtime/runtime.py
      - name: issue 同期の確認
        run: python .github/scripts/test_sync_issues.py
