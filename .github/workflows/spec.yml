name: spec

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: spec の検査
        run: python tools/check_spec.py
      - name: 実行の記録の検査
        run: python tools/run_spec.py
