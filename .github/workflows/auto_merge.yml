name: auto-merge

# 仮説の PR（ブランチ claude/h_<名前>）と、仮説の登録の PR（ほかの claude/ のブランチ）を、条件を満たすときだけ自動でマージする。条件は .github/scripts/auto_merge.py。
# 条件から外れたものはマージせず、外れた条件を PR のコメントに書く（手で見てマージする）。マージした後、ブランチを消し、issue の同期をここで走らせる
# （GITHUB_TOKEN でマージした push では、ワークフロー issues が起きないため）。
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    if: >-
      startsWith(github.head_ref, 'claude/') && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: 型検査
        run: python cscl/bootstrap/type_checker/type_checker.py
      - name: exp の検査
        run: python exp/src/exp_check.py
      - name: 判定とマージ
        id: decide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: >-
          python .github/scripts/auto_merge.py
          ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} --merge
      - name: ブランチを消す
        if: steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ github.head_ref }}"
      - name: main を取る
        if: steps.decide.outputs.merge == 'true'
        run: git fetch -q origin main && git checkout -q FETCH_HEAD
      - name: issue の同期
        if: steps.decide.outputs.merge == 'true' && vars.ISSUE_SYNC == 'on'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/sync_issues.py --apply
