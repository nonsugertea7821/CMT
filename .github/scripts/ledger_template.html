<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CMT 仮説台帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta http-equiv="Content-Security-Policy" content="/*LEDGER_CSP*/">
<meta name="referrer" content="no-referrer">
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --sunk:#eef0f4; --fg:#1a2130; --muted:#5b6474; --line:#d9dde5; --accent:#2b5ea7; --sel:#e3ecf9;
  --sup:#1d7a4c; --sup-bg:#e1f2e8; --con:#b03737; --con-bg:#f7e3e3; --mix:#896200; --mix-bg:#f6edd5;
  --unt:#5b6474; --unt-bg:#e9ecf1; --wd:#77589a; --wd-bg:#eee6f6;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP","Noto Sans CJK JP",Meiryo,system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151c; --panel:#191e27; --sunk:#141922; --fg:#e3e7ee; --muted:#98a1b0; --line:#2b323f; --accent:#80a9e8; --sel:#1f2b3d;
  --sup:#6dcd9a; --sup-bg:#163226; --con:#ee8989; --con-bg:#391c1e; --mix:#e0bb5a; --mix-bg:#342a13;
  --unt:#a1aab8; --unt-bg:#222934; --wd:#c1a2e5; --wd-bg:#2a2137; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c; --panel:#191e27; --sunk:#141922; --fg:#e3e7ee; --muted:#98a1b0; --line:#2b323f; --accent:#80a9e8; --sel:#1f2b3d;
  --sup:#6dcd9a; --sup-bg:#163226; --con:#ee8989; --con-bg:#391c1e; --mix:#e0bb5a; --mix-bg:#342a13;
  --unt:#a1aab8; --unt-bg:#222934; --wd:#c1a2e5; --wd-bg:#2a2137; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.7}
code{font-family:var(--mono);font-size:.84em;background:var(--sunk);padding:0 4px;border-radius:3px;overflow-wrap:anywhere}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);min-height:100%}
.nav{border-right:1px solid var(--line);background:var(--panel);position:sticky;top:0;height:100vh;overflow:auto;padding:20px 12px 40px}
.nav h1{font-size:1.15rem;margin:0 6px 2px}
.nav .lead{font-size:.78rem;color:var(--muted);margin:0 6px 14px}
.nav input{font:inherit;font-size:.88rem;width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);margin-bottom:12px}
.sec{font-size:.72rem;letter-spacing:.06em;color:var(--muted);margin:16px 6px 4px}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{padding-left:16px;border-left:1px solid var(--line);margin-left:11px}
.tree ul[hidden]{display:none}
.row{display:flex;align-items:flex-start;gap:2px;border-radius:6px}
.row:hover{background:var(--sunk)}
.row.on{background:var(--sel)}
.tw{flex:none;width:22px;height:26px;border:none;background:none;cursor:pointer;color:var(--muted);padding:0;font-size:.7rem}
.tw.leaf{visibility:hidden}
.lab{flex:1;min-width:0;text-align:left;border:none;background:none;padding:3px 4px;cursor:pointer;font-size:.84rem;line-height:1.5;display:grid;gap:3px}
.lab .kind{font-size:.68rem;color:var(--muted)}
.lab .mini{display:flex;align-items:center;gap:6px;font-size:.7rem;color:var(--muted);font-family:var(--mono)}
.bar{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--sunk);flex:1;max-width:120px}
.bar span{display:block;width:0}
.f-supported{background:var(--sup)} .f-refuted{background:var(--con)} .f-mixed{background:var(--mix)} .f-untested{background:var(--unt)} .f-withdrawn{background:var(--wd)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.72rem;color:var(--muted);margin:18px 6px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:-1px}

.main{padding:28px max(16px,env(safe-area-inset-right,0px)) 80px 28px;display:grid;gap:18px;align-content:start;max-width:900px}
.dhead{display:grid;gap:8px}
.dhead .big{font-size:1.3rem;font-weight:600;line-height:1.5;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.78rem;color:var(--muted);align-items:center}
.rel{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--muted)}
.rel button{background:none;border:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-align:left}
.pill{display:inline-block;padding:0 9px;border-radius:999px;font-size:.74rem;font-weight:500;white-space:nowrap;line-height:1.7}
.s-supported{color:var(--sup);background:var(--sup-bg)} .s-refuted{color:var(--con);background:var(--con-bg)}
.s-mixed{color:var(--mix);background:var(--mix-bg)} .s-untested{color:var(--unt);background:var(--unt-bg)}
.s-withdrawn{color:var(--wd);background:var(--wd-bg)}
.s-adopted{color:var(--sup);background:var(--sup-bg)} .s-tentative{color:var(--mix);background:var(--mix-bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 10px;font-size:.78rem;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip .n{font-family:var(--mono);color:var(--muted);margin-left:4px}
.group{display:grid;gap:8px}
.group h3{font-size:.9rem;margin:8px 0 0;display:flex;gap:8px;align-items:center}
.tl{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:.78rem;color:var(--muted)}
.ev{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.arrow{color:var(--line)}
.subhead{font-size:.8rem;color:var(--muted);margin-top:4px}
.hyp{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.hyp>summary{list-style:none;cursor:pointer;padding:10px 14px;display:grid;gap:4px}
.hyp>summary::-webkit-details-marker{display:none}
.hyp>summary .say{font-size:.98rem}
.hyp>summary .say::before{content:"▸";color:var(--muted);font-size:.75em;margin-right:8px;display:inline-block;transition:transform .15s}
.hyp[open]>summary .say::before{transform:rotate(90deg)}
.hyp .in{padding:0 14px 14px;display:grid;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.pr{display:grid;gap:6px}
.pr .ptitle{font-weight:600;font-size:.9rem}
.md{font-size:.88rem;overflow-wrap:anywhere}
.md p,.md ul,.md ol{margin:0 0 .6em}
.md ul,.md ol{padding-left:1.4em}
.md h5{font-size:.9rem;margin:1em 0 .3em;color:var(--fg)}
.md pre{background:var(--sunk);padding:8px 10px;border-radius:6px;overflow:auto;font-size:.8rem}
.md pre code{background:none;padding:0}
.md .tbl{overflow-x:auto;margin:0 0 .8em}
.md table{border-collapse:collapse;font-size:.82rem}
.md th,.md td{border:1px solid var(--line);padding:3px 8px;text-align:left;vertical-align:top}
.md th{background:var(--sunk)}
.others{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.note{font-size:.8rem;color:var(--muted)}
.empty{color:var(--muted)}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .nav{position:static;height:auto;max-height:55vh;border-right:none;border-bottom:1px solid var(--line);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .main{padding:20px 16px 60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" aria-label="ロードマップ">
    <h1>CMT 仮説台帳</h1>
    <p class="lead">左はロードマップ。決定の下に、それが依存する決定と、それを引き上げる決定が入る。押すと、その決定の根拠の仮説が右（狭い画面では下）に出る。仮説を押すと、確かめた PR の説明が開く。</p>
    <input id="q" type="search" placeholder="仮説を言葉で探す" aria-label="仮説を言葉で探す">
    <div class="sec">ロードマップ</div>
    <ul class="tree" id="road"></ul>
    <div class="sec">ロードマップの外の決定</div>
    <ul class="tree" id="others"></ul>
    <div class="sec">決定に結んでいない仮説</div>
    <ul class="tree" id="side"></ul>
    <div class="legend" id="legend"></div>
  </nav>
  <main class="main" id="detail"></main>
</div>

<script>
const DATA=/*LEDGER_DATA*/null;
const HST=[["supported","支持された"],["refuted","反証された"],["mixed","支持と反証の両方"],["untested","まだ確かめていない"],["withdrawn","取り下げた"]];
const HS=Object.fromEntries(HST);
const DS={adopted:"採用",tentative:"仮の決定",withdrawn:"取り下げ"};
const SIDE="__side";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const D=DATA.decisions,H=DATA.hypotheses,P=DATA.prs||{};
const say=x=>x.text.join("。また、");
let current=null,query="",only=new Set();

const byDec={},bySubj={};
for(const [h,x] of Object.entries(H)){
  if(!x.decisions.length){(byDec[SIDE]??=[]).push(h);(bySubj[x.subject]??=[]).push(h)}
  for(const d of x.decisions)(byDec[d]??=[]).push(h);
}

/* 木: 決定の子は、それが依存する決定と、それを引き上げる決定。置き換えの辺は木に入れない。 */
const out={},inn={},kids={},parents={};
for(const [d,x] of Object.entries(D))for(const e of x.edges){
  if(e.kind==="supersede"||!D[e.to])continue;
  (out[d]??=[]).push(e);(inn[e.to]??=[]).push({...e,from:d});
  const [p,c]=e.kind==="raise"?[e.to,d]:[d,e.to];
  (kids[p]??=[]).push({id:c,kind:e.kind});(parents[c]??=[]).push(p);
}
const onMap=new Set(Object.keys(D).filter(d=>out[d]||inn[d]));
const roots=[...onMap].filter(d=>!parents[d]);

function counts(list){const c={};for(const h of list||[])c[H[h].status]=(c[H[h].status]||0)+1;return c}
function bar(list){const c=counts(list),n=(list||[]).length||1;return `<span class="bar">${HST.map(([s])=>c[s]?`<span class="f-${s}" data-w="${(c[s]/n*100).toFixed(2)}"></span>`:"").join("")}</span>`}
function row(key,label,list,childHTML,kind,open){
  const has=!!childHTML;
  return `<li><div class="row" data-row="${esc(key)}"><button class="tw${has?"":" leaf"}" aria-expanded="${open}" aria-label="開く・閉じる">${open?"▾":"▸"}</button>`+
    `<button class="lab" data-d="${esc(key)}">${kind?`<span class="kind">${esc(kind)}</span>`:""}<span>${esc(label)}</span><span class="mini">${bar(list)}${(list||[]).length}</span></button></div>`+
    (has?`<ul${open?"":" hidden"}>${childHTML}</ul>`:"")+`</li>`;
}
function decRow(d,kind,depth,seen){
  if(seen.has(d))return "";
  const s=new Set(seen);s.add(d);
  const ch=(kids[d]||[]).map(k=>decRow(k.id,k.kind==="raise"?"引き上げる":"",depth+1,s)).join("");
  return row(d,say(D[d]),byDec[d],ch,kind,depth<2);
}
function drawNav(){
  $("road").innerHTML=roots.map(d=>decRow(d,"",0,new Set())).join("");
  const others=Object.keys(D).filter(d=>!onMap.has(d)&&(byDec[d]||[]).length).sort((a,b)=>byDec[b].length-byDec[a].length);
  $("others").innerHTML=others.map(d=>row(d,say(D[d]),byDec[d],"","",false)).join("");
  const subs=Object.entries(bySubj).sort((a,b)=>b[1].length-a[1].length);
  $("side").innerHTML=row(SIDE,"わき道（すべて）",byDec[SIDE],subs.map(([k,v])=>row(SIDE+"/"+k,k+"について",v,"","",false)).join(""),"",false);
  $("legend").innerHTML=HST.map(([s,l])=>`<span><i class="f-${s}"></i>${l}</span>`).join("");
  document.querySelectorAll(".lab").forEach(b=>b.addEventListener("click",()=>{query="";$("q").value="";select(b.dataset.d)}));
  document.querySelectorAll(".tw").forEach(b=>b.addEventListener("click",()=>{
    const ul=b.closest("li").querySelector(":scope>ul");if(!ul)return;
    const open=ul.hidden;ul.hidden=!open;b.setAttribute("aria-expanded",open);b.textContent=open?"▾":"▸"}));
  widths();
}
function widths(){document.querySelectorAll("[data-w]").forEach(e=>{e.style.width=e.dataset.w+"%"})}

function prBlock(ns){
  if(!ns.length)return `<p class="note">この仮説を名指しした PR は見つからなかった。</p>`;
  const link=n=>`<a href="https://github.com/${DATA.repo}/pull/${n}" target="_blank" rel="noopener noreferrer">#${n}</a>`;
  const own=ns.filter(p=>p.own),rest=ns.filter(p=>!p.own);
  const full=p=>`<div class="pr"><div class="meta">${link(p.n)}<span>${esc(P[p.n].date)} にマージ</span></div><div class="ptitle">${esc(P[p.n].title)}</div><div class="md">${P[p.n].html}</div></div>`;
  const shown=own.length?own:[rest[0]];
  const more=own.length?rest:rest.slice(1);
  return (own.length?"":`<p class="note">この仮説を題に出した PR はない。名指ししている PR の中で、いちばん新しいものを出す。</p>`)+
    shown.map(full).join("")+
    (more.length?`<div class="others">ほかにこの仮説に触れた PR: ${more.map(p=>`<span>${link(p.n)} ${esc(P[p.n].title)}</span>`).join("")}</div>`:"");
}
const SW={untested:"登録",supported:"支持",refuted:"反証",mixed:"mixed",withdrawn:"取り下げ"};
function day(t){return String(t||"").slice(0,10)}
function timeline(x){
  if(!x.events.length)return "";
  const ev=x.events.map((e,i)=>{
    const label=i===0?(e.status==="untested"?"登録":`登録（${SW[e.status]||e.status}）`):(e.status==="untested"?"未検証に戻す":SW[e.status]||e.status);
    const days=i?Math.round((Date.parse(e.at)-Date.parse(x.events[0].at))/864e5):null;
    return `<span class="ev"><span class="dot f-${esc(e.status)}"></span>${esc(label)} <a href="https://github.com/${DATA.repo}/commit/${esc(e.commit)}" target="_blank" rel="noopener noreferrer" title="${esc(e.at)}">${esc(day(e.at))}</a>${days?`<span class="note">（${days} 日後）</span>`:""}</span>`;
  });
  return `<span class="tl">${ev.join('<span class="arrow">→</span>')}</span>`;
}
function card(h){
  const x=H[h];
  const decs=x.decisions.filter(d=>d!==current).map(d=>`<button class="chip" data-go="${esc(d)}">${esc(say(D[d]))}</button>`).join("");
  const iss=x.issue?`<a href="https://github.com/${DATA.repo}/issues/${x.issue}" target="_blank" rel="noopener noreferrer">issue #${x.issue}</a>`:"";
  return `<details class="hyp" data-h="${esc(h)}"><summary><span class="say">${esc(say(x))}</span>${timeline(x)}
    <span class="meta"><span class="pill s-${esc(x.status)}">${HS[x.status]||esc(x.status)}</span><code>${esc(h)}</code>${x.prs.length?`<span>PR ${x.prs.length} 件</span>`:""}${x.scope.length?`<span>範囲: ${esc(x.scope.join("・"))}</span>`:""}</span></summary>
    <div class="in">${prBlock(x.prs)}${decs||iss?`<div class="meta">${iss}${decs?`<span>ほかに根拠にしている決定:</span>${decs}`:""}</div>`:""}</div></details>`;
}
function listFor(d){
  if(query){const ql=query.toLowerCase();return Object.keys(H).filter(h=>(h+" "+H[h].text.join(" ")+" "+H[h].subject).toLowerCase().includes(ql))}
  if(d&&d.startsWith(SIDE+"/"))return bySubj[d.slice(SIDE.length+1)]||[];
  return byDec[d]||[];
}
function select(d){
  current=d;only.clear();
  document.querySelectorAll(".row").forEach(r=>r.classList.toggle("on",r.dataset.row===d));
  try{history.replaceState(null,"","#"+encodeURIComponent(d))}catch(e){}
  render();
}
function head(d){
  if(query)return `<div class="dhead"><div class="big">「${esc(query)}」を含む仮説</div><p class="note">すべての仮説から探している。左で決定を押すと戻る。</p></div>`;
  if(d===SIDE)return `<div class="dhead"><div class="big">わき道</div><p class="note">どの決定の根拠にもしていない仮説。</p></div>`;
  if(d.startsWith(SIDE+"/"))return `<div class="dhead"><div class="meta">わき道</div><div class="big">${esc(d.slice(SIDE.length+1))}について</div></div>`;
  const x=D[d];
  const rel=[...(out[d]||[]).map(e=>`<span>${e.kind==="raise"?"引き上げる":"依存する"}: <button data-go="${esc(e.to)}">${esc(say(D[e.to]))}</button></span>`),
    ...(inn[d]||[]).map(e=>`<span>${e.kind==="raise"?"引き上げられる":"依存される"}: <button data-go="${esc(e.from)}">${esc(say(D[e.from]))}</button></span>`),
    ...x.edges.filter(e=>e.kind==="supersede").map(e=>`<span>置き換えた: ${esc(D[e.to]?say(D[e.to]):e.to)}</span>`)];
  const pr=x.prs.length?`<a href="https://github.com/${DATA.repo}/pull/${x.prs[0].n}" target="_blank" rel="noopener noreferrer">${x.prs[0].own?"決めた":"触れた"} PR #${x.prs[0].n}</a>`:"";
  return `<div class="dhead"><div class="meta"><span class="pill s-${esc(x.status)}">${DS[x.status]||esc(x.status)}</span><code>${esc(d)}</code>${pr}</div><div class="big">${esc(say(x))}。</div>${rel.length?`<div class="rel">${rel.join("")}</div>`:""}</div>`;
}
function render(){
  const d=current,all=listFor(d),c=counts(all);
  const list=only.size?all.filter(h=>only.has(H[h].status)):all;
  const tools=`<div class="chips">${HST.filter(([s])=>c[s]).map(([s,l])=>`<button class="chip" data-st="${s}" aria-pressed="${only.has(s)}"><span class="pill s-${s}">${l}</span><span class="n">${c[s]}</span></button>`).join("")}<span class="note">${list.length} / ${all.length} 件。登録の順（古いものが上）。押すと PR の説明が開く。</span></div>`;
  const sorted=[...list].sort((a,b)=>H[a].seq-H[b].seq);
  const body=sorted.length?`<section class="group">${sorted.map(card).join("")}</section>`:"";
  $("detail").innerHTML=head(d)+tools+(body||`<p class="empty">ここに結んだ仮説はない。</p>`);
  document.querySelectorAll("[data-st]").forEach(b=>b.addEventListener("click",()=>{const s=b.dataset.st;only.has(s)?only.delete(s):only.add(s);render()}));
  document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",e=>{e.preventDefault();query="";$("q").value="";select(b.dataset.go);reveal(b.dataset.go)}));
  $("detail").scrollTop=0;
}
function reveal(d){
  const r=document.querySelector(`.row[data-row="${CSS.escape(d)}"]`);if(!r)return;
  for(let ul=r.closest("ul");ul&&ul.classList.contains("tree")===false;ul=ul.parentElement.closest("ul")){ul.hidden=false;const tw=ul.parentElement.querySelector(":scope>.row .tw");if(tw){tw.setAttribute("aria-expanded","true");tw.textContent="▾"}}
  r.scrollIntoView({block:"nearest"});
}
$("q").addEventListener("input",e=>{query=e.target.value.trim();only.clear();render()});
drawNav();
const start=decodeURIComponent(location.hash.slice(1));
const ok=k=>D[k]||k===SIDE||(k.startsWith(SIDE+"/")&&bySubj[k.slice(SIDE.length+1)]);
select(ok(start)?start:(roots[0]||SIDE));reveal(current);
addEventListener("hashchange",()=>{const h=decodeURIComponent(location.hash.slice(1));if(ok(h)&&h!==current){select(h);reveal(h)}});
</script>
</body>
</html>
